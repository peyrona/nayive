<!-- index.html - Web Share Target landing page.

     The launcher manifest declares this folder as a share_target. When the user
     picks photos, videos or any file and taps Share -> "Nayive", the OS POSTs
     them here. A page can't read that POST, so apps/sw.js intercepts it,
     stashes the files in the "nayive-share-inbox" Cache, and 303-redirects here
     with ?n=<count>. This page reads them back out of that cache, lets the user
     confirm the destination, uploads each file as a NEW file (create-only PUT),
     then opens it:
       - photos and videos only (inbox kind "media") -> a Photos album;
       - anything else, or a mix (kind "files")      -> a Drive folder.
     A shared link (no files) arrives as ?link=&title=&text=: two buttons send
     it to Bookmarks or to Chat. Nothing is written here for a link.
     ?err=1: the service worker could not keep what was shared (storage full).

     Online only (it uploads). iOS Safari does not support Web Share Target at
     all - there the launcher shows the "Add to Home Screen" recipe instead and
     users add photos from inside Photos (the header upload button). -->

<body>
    <div class="app">
        <div class="st-head">

<script>
"use strict";

const $ = s => document.querySelector( s );
const INBOX = "nayive-share-inbox";
const PARAMS = new URLSearchParams( location.search );

let ITEMS = [];          // [{ name, blob }]
let DEST  = null;        // folder path, e.g. "files/fotos/viajes"
let KIND  = "media";     // "media": photos/videos -> a Photos album | "files": anything -> a Drive folder

const IMAGE_RE = /\.(jpe?g|png|gif|webp|bmp|avif|heic|heif)$/i;
const VIDEO_RE = /\.(mp4|m4v|mov|webm|3gp|mkv|avi)$/i;
const isImage  = it => /^image\//.test( ( it.blob && it.blob.type ) || "" ) || IMAGE_RE.test( it.name || "" );
const isVideo  = it => /^video\//.test( ( it.blob && it.blob.type ) || "" ) || VIDEO_RE.test( it.name || "" );

// The texts say "photos" while every item is a photo, "files" otherwise.
const T = ( photoKey, fileKey ) => ITEMS.every( isImage ) ? photoKey : fileKey;

/* Pull the shared files back out of the Cache the service worker filled. */
async function readInbox()
{
    if( ! ( "caches" in window ) ) return [];

    let cache;
    try { cache = await caches.open( INBOX ); }
    catch ( _ ) { return []; }

    let manifest = { count: 0, names: [] };
    try
    {
        const m = await cache.match( new URL( "inbox/manifest.json", location.href ).toString() );
        if( m ) manifest = await m.json();
    }
    catch ( _ ) {}

    KIND = manifest.kind === "files" ? "files" : "media";      // no kind: a share from before files came in

    const n = manifest.count || parseInt( PARAMS.get( "n" ) || "0", 10 ) || 0;
    const out = [];

    for( let i = 0; i < n; i++ )
    {
        const key = new URL( "inbox/" + i, location.href ).toString();
        const res = await cache.match( key );
        if( ! res ) continue;               // uploaded already, by an earlier try (see upload)
        const blob = await res.blob();
        let name = ( manifest.names && manifest.names[ i ] ) || "";
        if( ! name )
        {
            const h = res.headers.get( "X-File-Name" );
            name = h ? decodeURIComponent( h ) : ( "foto-" + ( i + 1 ) + ".jpg" );
        }
        out.push( { name: name, blob: blob, key: key } );
    }
    return out;
}

// One photo is saved: out of the inbox now, so a retry (or a page closed half
// way) never uploads it twice. The manifest stays: readInbox skips the gap.
async function dropFromInbox( it )
{
    try { await ( await caches.open( INBOX ) ).delete( it.key ); }
    catch ( _ ) {}
}

// Photos left after a failed upload are KEPT on purpose: the service worker
// adds the next share after them instead of clearing the inbox (sw.js
// handleShare). A share merely left open is not kept.
async function markKept()
{
    try
    {
        const cache = await caches.open( INBOX );
        const key   = new URL( "inbox/manifest.json", location.href ).toString();
        const res   = await cache.match( key );
        const m     = res ? await res.json() : { count: 0, names: [] };
        m.kept = true;
        await cache.put( key, new Response( JSON.stringify( m ), { headers: { "Content-Type": "application/json" } } ) );
    }
    catch ( _ ) {}
}

async function clearInbox()
{
    try
    {
        const cache = await caches.open( INBOX );
        const keys  = await cache.keys();
        await Promise.all( keys.map( k => cache.delete( k ) ) );
    }
    catch ( _ ) {}
}

function renderStrip()
{
    $( "#count" ).textContent = Ayni.tf( ITEMS.length === 1 ? T( "st.onePhoto", "st.oneFile" ) : T( "st.nPhotos", "st.nFiles" ),
                                            { n: ITEMS.length } );

    const strip = $( "#strip" );
    strip.innerHTML = "";
    const SHOW = 6;
    ITEMS.slice( 0, SHOW ).forEach( it =>
    {
        if( ! isImage( it ) )           // a video or any other file: its icon and name
        {
            const tile = document.createElement( "div" );
            tile.className = "tile";
            tile.title = it.name;
            const ic = document.createElement( "span" );
            ic.className = "icon";
            ic.dataset.icon = isVideo( it ) ? "video" : "file";
            const nm = document.createElement( "span" );
            nm.className = "nm";
            nm.textContent = it.name;
            tile.append( ic, nm );
            strip.appendChild( tile );
            return;
        }
        const img = document.createElement( "img" );
        img.src = URL.createObjectURL( it.blob );
        img.alt = it.name;
        // Freed once shown - or once it turns out it cannot be (a HEIC, say).
        const free = () => URL.revokeObjectURL( img.src );
        img.addEventListener( "load",  free, { once: true } );
        img.addEventListener( "error", free, { once: true } );
        strip.appendChild( img );
    } );
    if( ITEMS.length > SHOW )
    {
        const more = document.createElement( "div" );
        more.className = "more";
        more.textContent = "+" + ( ITEMS.length - SHOW );
        strip.appendChild( more );
    }
}

function setDest( folder )
{
    DEST = folder;
    $( "#destVal" ).textContent = folder
        ? ( folder.replace( /^files\//, "" ).replace( /^data\//, "" ) || Ayni.t( 'ui.filesRoot' ) )
        : Ayni.t( KIND === "files" ? 'st.pickFolder' : 'st.pickAlbum' );
    $( "#goBtn" ).ariaDisabled = ! folder || ! ITEMS.length;
}

// A file goes up as a NEW file only (create-only PUT): a name another device
// took after the listing answers 412 (409 in an album shared with us), and
// the next free one is used - "IMG_1 (2).jpg" - never written over. (A 412
// that is this very photo's first try, landed before a dropped connection
// made the PUT go again, is a success already: AyniNet's "our own first try".)
// `taken` gains every name tried; 50 names in a row taken is not a race any
// more: an error.
function sendNew( want, bytes, taken )
{
    return AyniNet.createFresh( DEST, function () { const name = Ayni.uniqueName( want, taken ); taken.add( name ); return name; },
                               bytes, { on409: true } );
}

async function upload()
{
    if( ! DEST || ! ITEMS.length ) return;

    // Room for all of it? If not, offer to empty the papelera (its contents
    // count against the quota just like anything else).
    const need = ITEMS.reduce( ( n, it ) => n + ( ( it.blob && it.blob.size ) || 0 ), 0 );
    if( ! await NayiveUI.ensureRoom( need ) ) return;

    Ayni.setBusy( $( "#goBtn" ), Ayni.t( "ayni.sync.saving" ) );
    $( "#cancelBtn" ).ariaDisabled = true;
    $( "#changeDest" ).ariaDisabled = true;
    $( "#bar" ).hidden = false;

    // If this user has a max photo size, shrink + convert to JPEG right here.
    const maxPx = await AyniPhoto.limit();

    // Names already in the destination, so a share never clobbers a file. A
    // listing that fails sends NOTHING (D4, drive-files #12): taken as "no
    // names taken", every photo went up under its own name over the album's
    // same-named ones. The photos stay in the inbox, to try again. A 404 is
    // an album that is not there (any more): it holds no names.
    let taken = new Set();
    let unread = false;
    try
    {
        taken = await AyniNet.namesIn( DEST );
    }
    catch ( err )
    {
        if( err && err.status === 401 ) { AyniNet.loginRedirect(); return; }
        if( ! err || err.status !== 404 ) unread = true;
    }

    let done  = 0;
    let quota = false;       // a 507: nothing after it fits either
    const failed = [];       // [{ it, why }] - they stay in the inbox, to try again
    for( let i = 0; i < ITEMS.length; i++ )
    {
        const it    = ITEMS[ i ];
        if( quota || unread ) { failed.push( { it: it, why: "" } ); continue; }

        const ready = await AyniPhoto.prepare(
                          it.blob && ! it.blob.name ? new File( [ it.blob ], it.name || "foto.jpg",
                                                                { type: it.blob.type } )
                                                    : it.blob,
                          maxPx );
        const want  = ready.name || it.name || ( "foto-" + Date.now() + "-" + i + ".jpg" );

        try
        {
            const bytes = new Uint8Array( await ready.blob.arrayBuffer() );
            await sendNew( want, bytes, taken );
            done++;
            await dropFromInbox( it );
        }
        catch ( err )
        {
            const status = err && err.status;
            if( status === 401 ) { AyniNet.loginRedirect(); return; }
            if( status === 507 ) quota = true;
            failed.push( { it: it, why: quota ? "" : err && err.status ? "HTTP " + err.status : Ayni.t( 'st.noConnection' ) } );
        }
        $( "#barFill" ).style.width = Math.round( ( ( i + 1 ) / ITEMS.length ) * 100 ) + "%";
    }

    // What did not get saved stays in the inbox and on screen, named, to try
    // again (or Cancel): never cleared as if it had been uploaded.
    if( failed.length )
    {
        if( done ) Ayni.toast( "ok", Ayni.tf( done === 1 ? T( "st.oneUploaded", "st.oneFileUploaded" ) : T( "st.nUploaded", "st.nFilesUploaded" ), { n: done } ) );

        ITEMS = failed.map( f => f.it );
        await markKept();
        renderStrip();
        $( "#bar" ).hidden = true;
        $( "#barFill" ).style.width = "0";
        Ayni.setBusy( $( "#goBtn" ), false );
        $( "#cancelBtn" ).ariaDisabled = false;
        $( "#changeDest" ).ariaDisabled = false;
        setDest( DEST );

        Ayni.alert( {
            title: Ayni.tf( T( 'st.notUploaded', 'st.filesNotUploaded' ), { n: failed.length } ),
            body:  ( quota ? Ayni.t( 'ui.quotaExceeded' ) + "\n\n" : "" ) +
                   ( unread ? Ayni.t( KIND === "files" ? 'st.folderUnread' : 'st.albumUnread' ) + "\n\n" : "" ) +
                   failed.map( f => f.it.name + ( f.why ? " (" + f.why + ")" : "" ) ).join( "\n" ) +
                   "\n\n" + Ayni.t( 'st.keptToRetry' )
        } );
        return;
    }

    const allPhotos = ITEMS.every( isImage );
    await clearInbox();
    Ayni.toast( "ok", Ayni.tf( done === 1 ? ( allPhotos ? "st.oneUploaded" : "st.oneFileUploaded" )
                                          : ( allPhotos ? "st.nUploaded"   : "st.nFilesUploaded" ), { n: done } ) );

    // Files: remember the folder for the next share (Drive's own config keeps
    // every other key, see drive/settings.js), then open it in Drive.
    if( KIND === "files" )
    {
        try
        {
            await AyniNet.updateJson( "data/drive/config.json", cfg =>
            {
                const next = ( cfg && typeof cfg === "object" && ! Array.isArray( cfg ) ) ? cfg : {};
                next.shareFolder = DEST;
                return next;
            } );
        }
        catch ( _ ) {}

        location.replace( "../drive/?open=" + encodeURIComponent( DEST ) );
        return;
    }

    // Remember this album as the Photos folder, then open it there. Only
    // `folder` changes: the file's other keys are kept, and an unreadable one
    // (not a 404) is left as it is rather than written over. Version-checked
    // (AyniNet.updateJson): a setting saved meanwhile is kept, not put back.
    try
    {
        await AyniNet.updateJson( "data/photos/config.json", cfg =>   // null = no file yet
        {
            const next = ( cfg && typeof cfg === "object" && ! Array.isArray( cfg ) ) ? cfg : {};
            next.folder = DEST;
            return next;
        } );
    }
    catch ( _ ) {}

    location.replace( "../photos/?dir=" + encodeURIComponent( DEST ) );
}

$( "#changeDest" ).addEventListener( "click", async () =>
{
    const files = KIND === "files";
    const f = await NayiveUI.pickFolder( {
        title: Ayni.t( files ? 'st.whichFolder'     : 'st.whichAlbum' ),
        note:  Ayni.t( files ? 'st.whichFolderNote' : 'st.whichAlbumNote' ),
        allowRoot: true,
        rootLabel: Ayni.t( 'ui.filesRoot' )
    } );
    if( f ) setDest( f );
} );

$( "#goBtn" ).addEventListener( "click", upload );
$( "#cancelBtn" ).addEventListener( "click", async () =>
{
    await clearInbox();
    location.replace( "../index.html" );
} );

// A shared link: Bookmarks or Chat, the user picks. Only a page is opened.
function showLink()
{
    const link  = PARAMS.get( "link" );
    const title = PARAMS.get( "title" ) || "";
    const text  = PARAMS.get( "text" ) || link;

    $( "#headIcon" ).dataset.icon = "link";
    $( "#linkUrl" ).textContent = link;
    if( title && title !== link ) { $( "#linkTitle" ).textContent = title; $( "#linkTitle" ).hidden = false; }
    $( "#linkCard"    ).hidden = false;
    $( "#linkActions" ).hidden = false;

    $( "#toBookmarks" ).addEventListener( "click", () =>
        location.replace( "../bookmarks/?" + new URLSearchParams( { add: link, title: title } ).toString() ) );
    $( "#toChat" ).addEventListener( "click", () =>
        location.replace( "../chat/?text=" + encodeURIComponent( text ) ) );
}

async function boot()
{
    if( /^https?:\/\//i.test( PARAMS.get( "link" ) || "" ) ) { showLink(); return; }

    ITEMS = await readInbox();

    // The service worker could not keep what was shared (storage full). With
    // files kept from an earlier share still here, a toast; else the card says it.
    if( PARAMS.get( "err" ) && ITEMS.length ) Ayni.toast( 'warn', Ayni.t( 'st.tooBig' ) );

    if( ! ITEMS.length )
    {
        if( PARAMS.get( "err" ) )
        {
            $( "#emptyText" ).dataset.i18n = "st.tooBig";
            $( "#emptyText" ).textContent  = Ayni.t( "st.tooBig" );
        }
        $( "#empty" ).hidden = false;
        return;
    }

    const files = KIND === "files";
    if( files )
    {
        $( "#headIcon" ).dataset.icon = "file";
        $( "#destLbl" ).dataset.i18n = "st.folder";
        $( "#destLbl" ).textContent = Ayni.t( "st.folder" );
    }

    renderStrip();
    $( "#review"   ).hidden = false;
    $( "#destCard" ).hidden = false;
    $( "#actions"  ).hidden = false;

    // Default destination: the folder Photos already remembers (photos and
    // videos), or the one the last shared files went to (anything else).
    let folder = null;
    try
    {
        const cfg = await AyniNet.readJson( files ? "data/drive/config.json" : "data/photos/config.json" );
        const f   = cfg && ( files ? cfg.shareFolder : cfg.folder );
        if( typeof f === "string" && f ) folder = f;
    }
    catch ( err )
    {
        if( err && err.status === 401 ) { AyniNet.loginRedirect(); return; }
    }
    setDest( folder );

    if( ! folder )
        Ayni.toast( 'info', Ayni.t( files ? 'st.pickFolderToast' : 'st.pickAlbumToast' ) );
}

// shared/ayni/ayni-net.js + shared/ui.js load deferred; they run before
// DOMContentLoaded, so wait for it before boot() touches AyniNet / NayiveUI.
Ayni.i18n.ready.then( boot );
</script>
</body>
</html>
