<!-- index.html - Image: the photo editor (shared/image-editor.js) on ONE picture,
     ?file=<path relative to the file root>, e.g. "files/viajes/a.jpg".

     Drive and Photos open it, each picture in a window of its own (a desktop
     window, a browser tab, or - on a phone - this page in place of theirs).
     Its saves reach them as file news (GumApi.onFilesChanged), so they show
     the new picture without a reload. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Nayive's first script (old settings, whose page, error reports), then
         Ayni's language layer: it hides the page until the texts are in, and
         every inline script below may call Ayni.t(). -->
    <script src="../shared/i18n.js"></script>
    <script src="../shared/ayni/ayni-i18n.js" data-dict="../shared/i18n/" data-langs="es en pt fr de"></script>
    <title>Image</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='2'%3E%3C/rect%3E%3Ccircle cx='8.5' cy='8.5' r='1.5'%3E%3C/circle%3E%3Cpolyline points='21 15 16 10 5 21'%3E%3C/polyline%3E%3C/svg%3E">

    <!-- Shared colour scheme: the dialogs follow it; the editor itself is
         always dark (the IMAGE EDITOR block in shared/app.css). -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/ayni/ayni-base.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-buttons.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-toasts.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-dialogs.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-menus.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-search.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-lists.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-help.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ document.documentElement.dataset.theme = localStorage.getItem( 'ayni-theme' ) || ( matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light' ); }catch( e ){}</script>
    <script src="../shared/ayni/ayni-icons.js" defer></script>
    <script src="../shared/ayni/ayni-base.js" defer></script>
    <script src="../shared/ayni/ayni-buttons.js" defer></script>
    <script src="../shared/ayni/ayni-toasts.js" defer></script>
    <script src="../shared/ayni/ayni-dialogs.js" defer></script>
    <script src="../shared/ayni/ayni-menus.js" defer></script>
    <script src="../shared/ayni/ayni-search.js" defer></script>
    <script src="../shared/ayni/ayni-lists.js" defer></script>
    <script src="../shared/ayni/ayni-help.js" defer></script>
    <script src="../shared/locker.js"></script>

    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <!-- Ayni.fitBar: the header's ⋮ for what does not fit (image.js rankHeader). -->
    <!-- Loads and builds the editor (loadEditor / newEditor), keeps the EXIF. -->
    <script src="../shared/photo.js" defer></script>
    <!-- The photo notes sidecar and the thumbnails' upkeep. -->
    <script src="../shared/media.js" defer></script>
    <link rel="stylesheet" href="image.css">
    <script>
    Ayni.i18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        var rows = [
            { sel: '#editorSaveBtn',   text: Ayni.t( 'image.introSave' ) },
            { sel: '#editorSaveAsBtn', text: Ayni.t( 'image.introCopy' ) }
        ];
        // a desktop window has no ←: its own close does that
        if( ! NayiveUI.windowed ) rows.unshift( { sel: '#backBtn', icon: 'back', text: Ayni.t( 'image.introBack' ) } );
        Ayni.help( { title: 'Image', lead: Ayni.t( 'image.introLead' ), rows: rows,
            // The guided tour ("Ver el tour" in the card): the bar's buttons, the
            // editor's undo / redo, its tools, the zoom box, the note under the picture.
            tour: [ 'rows',
                    { sel: '#editorHead', text: Ayni.t( 'image.tourUndo' ) },
                    { sel: '#editorTools, .fit-more', text: Ayni.t( 'image.tourTools' ) },   // a phone: the tools are in the ⋮
                    { sel: '.ie-zoom', ghost: '#editorHost', text: Ayni.t( 'image.tourView' ) },
                    { sel: '#editorComment', text: Ayni.t( 'image.tourNote' ) } ] } );
    } );
    </script>
</head>
<body>

    <div class="app">
        <!-- The header. In a desktop window it IS the window's title bar. -->
        <header class="topbar">
            <!-- Back to Drive / Photos (a phone, a tab). Hidden in a desktop
                 window: the window's own close does it. -->
            <button id="backBtn" class="btn" type="button" data-i18n-attr="data-tip:ui.close, aria-label:ui.close"></button>
            <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <h1>Image</h1>
            <!-- The picture's name: the desktop names the window by it. -->
            <span id="fileLabel" class="file-label"></span>

            <div class="topbar-actions tall" role="toolbar" data-i18n-attr="aria-label:ui.actions">
                <!-- The editor puts its tools here, then its undo / redo. -->
                <div class="tb-group" id="editorTools"></div>
                <div class="tb-group" id="editorHead"></div>
                <div class="tb-group">
                    <button id="editorSaveBtn"   class="btn" type="button" data-i18n-attr="data-tip:ui.save, aria-label:ui.save"></button>
                    <button id="editorSaveAsBtn" class="btn" type="button" data-i18n-attr="aria-label:ui.saveCopy, data-tip:drive.saveCopyEllipsis"></button>
                </div>
                <div class="tb-group tb-sys">
                    <button class="btn" data-help-open data-rank="31" type="button" data-i18n-attr="data-tip:ayni.help, aria-label:ayni.help">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- The editor: a fixed dark surface (the IMAGE EDITOR block in shared/app.css). -->
        <div class="editor-page">
            <div id="editorHost" class="editor-canvas"><p id="editorMsg" class="editor-msg"></p></div>
            <textarea id="editorComment" class="editor-comment" rows="2" data-i18n-attr="placeholder:drive.photoCommentPh"></textarea>
        </div>
    </div>

    <!-- "Guardar copia" dialog. -->
    <dialog id="saveCopyBackdrop" class="panel">
        <header>
            <h2 data-i18n="ui.saveCopy"></h2>
        </header>
        <div class="body">
            <div class="field">
                <label for="saveCopyName" data-i18n="ui.fileName"></label>
                <input type="text" id="saveCopyName" autocomplete="off" spellcheck="false">
            </div>
        </div>
        <footer>
            <button class="btn" id="saveCopyCancelBtn"  data-close data-i18n-attr="data-tip:ui.cancel"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="saveCopyConfirmBtn" data-i18n-attr="data-tip:ui.saveCopy"><span class="icon" data-icon="check"></span></button>
        </footer>
    </dialog>

    <!-- A module for its top-level await of the dictionary. -->
    <script type="module" src="image.js"></script>
</body>
</html>
