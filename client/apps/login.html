<!-- SEALED - a user-data write path (docs/sealed-crud.md): announce a change, keep it minimal, then `node tools/data-safety-test/run.mjs` must be ALL GREEN. -->
<!-- login.html - sign-in screen for Nayive. Posts to /api/login, which sets the session cookie. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Nayive's first script (old settings, whose page, error reports), then
         Ayni's language layer: it hides the page until the texts are in, and
         every inline script below may call Ayni.t(). -->
    <script src="shared/i18n.js"></script>
    <script src="shared/ayni/ayni-i18n.js" data-dict="shared/i18n/" data-langs="es en pt fr de"></script>
    <script src="shared/ayni/ayni-util.js"></script>
    <!-- Only its localCount(): LEFTOVERS below never wipes unsent work. -->
    <script src="shared/ayni/ayni-store.js"></script>
    <title>Nayive</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="shared/ayni/ayni-base.css">
    <link rel="stylesheet" href="shared/ayni/ayni-buttons.css">
    <link rel="stylesheet" href="shared/ayni/ayni-toasts.css">

    <link rel="stylesheet" href="shared/ayni/ayni-pickers.css">
    <link rel="stylesheet" href="shared/ayni/ayni-layout.css">
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="shared/ayni/ayni-share.css">
    <link rel="stylesheet" href="shared/ayni/ayni-pwa.css">
    <link rel="stylesheet" href="shared/ayni/ayni-locker.css">
    <link rel="stylesheet" href="shared/ayni/ayni-status.css">
    <link rel="stylesheet" href="shared/ayni/ayni-shell.css">
    <link rel="stylesheet" href="shared/app.css">
    <link rel="stylesheet" href="shared/ayni/ayni-doc.css">
    <link rel="stylesheet" href="shared/ayni/ayni-media.css">
    <link rel="stylesheet" href="shared/ayni/ayni-image.css">
    <link rel="stylesheet" href="shared/ayni/ayni-map.css">
    <script>try{ document.documentElement.dataset.theme = localStorage.getItem( 'ayni-theme' ) || ( matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light' ); }catch( e ){}</script>
    <script src="shared/ayni/ayni-icons.js" defer></script>
    <script src="shared/ayni/ayni-base.js" defer></script>
    <script src="shared/ayni/ayni-icons-more.js" defer></script>
    <script src="shared/ayni/ayni-shell.js" defer></script>
    <script src="shared/ayni/ayni-status.js" defer></script>
    <script src="shared/ayni/ayni-share.js" defer></script>
    <script src="shared/ayni/ayni-upload.js" defer></script>
    <script src="shared/ayni/ayni-pwa.js" defer></script>
    <script src="shared/ayni/ayni-boot.js" defer></script>
    <script src="shared/ayni/ayni-buttons.js" defer></script>
    <script src="shared/ayni/ayni-toasts.js" defer></script>
    <script src="shared/ayni/ayni-dialogs.js" defer></script>
    <script src="shared/ayni/ayni-menus.js" defer></script>
    <script src="shared/ayni/ayni-search.js" defer></script>
    <script src="shared/ayni/ayni-lists.js" defer></script>
    <script src="shared/ayni/ayni-help.js" defer></script>
    <script src="shared/ayni/ayni-fields.js" defer></script>
    <script src="shared/ayni/ayni-pickers.js" defer></script>
    <script src="shared/ayni/ayni-layout.js" defer></script>

    <style>
        /* Base reset + fonts from ../shared/app.css. This is the standalone
           sign-in screen, so it keeps its own centred single-card layout and
           the uppercase field labels of an entry form. */
        html, body { height: 100%; }
        body
        {
            font-size: 15px; line-height: 1.5;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card
        {
            width: 100%; max-width: 340px; background: var(--card);
            border: 1px solid var(--line); border-radius: var(--radius-l);
            padding: 30px 26px 26px; box-shadow: var(--elev-card);
        }
        .brand
        {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.35rem; font-weight: 700; margin-bottom: 22px;
        }
        .brand img { width: 48px; height: 48px; flex: 0 0 auto; }
        label
        {
            display: block; font-size: 0.78rem; color: var(--text-dim);
            margin: 0 0 5px 2px; text-transform: uppercase; letter-spacing: 0.04em;
        }
        /* The fields are Ayni's (.input, the password with its eye in an
           .input-group): the same as in every other app. Entry-screen tweak only:
           a comfortable gap under each. */
        .card > .input, .card > .input-group { margin-bottom: 16px; }
        .remember
        {
            display: flex; align-items: center; justify-content: flex-start; gap: 10px;
            text-transform: none; letter-spacing: 0; font-size: 0.85rem;
            color: var(--text-dim); margin: -4px 0 6px 2px; cursor: pointer;
        }
        button
        {
            display: flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; padding: 0; margin: 6px 0 0 auto;   /* auto-left => pushed to the right edge */
            color: var(--on-accent); background: var(--accent);
            border: none; border-radius: 50%; cursor: pointer;
        }
        button svg { width: 22px; height: 22px; margin-left: 2px; }   /* nudge: optical centre of a triangle */
        button:hover  { filter: brightness(1.12); }
        button:active { filter: brightness(0.93); }
        button:disabled { opacity: 0.55; cursor: default; filter: none; }
        /* Bottom row: error message at the left, Continue button at the right. */
        .foot { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
        .foot button { margin: 0 0 0 auto; }
        .error
        {
            color: var(--danger); font-size: 0.88rem; margin: 0; line-height: 1.3;
        }
    </style>
</head>
<body>
    <form class="card" id="loginForm" method="post" action="/api/login" autocomplete="on">
        <div class="brand">
            <img src="icons/icon-192.png" alt="">
            <span>Nayive</span>
        </div>

        <p class="warn-box" id="notMine" role="alert" data-i18n="login.notMine" hidden></p>

        <label for="user" data-i18n="login.user"></label>
        <input class="input" id="user" name="user" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>

        <label for="password" data-i18n="login.password"></label>
        <div class="input-group">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" data-i18n-attr="placeholder:login.blankIfNew">
            <button type="button" class="btn" id="pwEye" data-reveal></button>
        </div>

        <label class="remember switch" for="remember">
            <span data-i18n="login.remember"></span>
            <input role="switch" type="checkbox" id="remember" name="remember" checked>
        </label>

        <div class="foot">
            <p class="error" id="error" role="alert"></p>
            <button type="submit" id="submit" data-i18n-attr="data-tip:login.signIn, aria-label:login.signIn">
                <span class="icon" data-icon="play-solid"></span>
            </button>
        </div>
    </form>

    <script>
        ( function ()
        {
            var form   = document.getElementById( 'loginForm' );
            var errBox = document.getElementById( 'error' );
            var submit = document.getElementById( 'submit' );

            // SOMEONE ELSE'S PC (server/go/api_auth.go apiLogout). A session
            // signed in with "Keep me signed in" off is wiped from this browser
            // at its sign-out. "nayive-shared" says the last session here was
            // one. A browser with no trace of Nayive, or such a browser, may
            // not be the user's: say "use a private window", and start with
            // the switch off.
            //
            // LEFTOVERS: such a session that ended without a sign-out (the
            // browser closed, the 12 h ran out) left its files here; with no
            // session left, the server is asked to wipe this browser now. The
            // sign-in waits for it, so it never wipes the new session's work.
            // NEVER UNSENT WORK: saves, drafts or Chat text still only here
            // (AyniStore.localCount - every account's) keep the browser as it
            // is; they stay tagged for their owner's next sign-in, which sends
            // them (the sign-out asks about them; this page cannot). No
            // AyniStore, or the count fails = keep too.
            var shared = false, known = false;
            try
            {
                shared = localStorage.getItem( 'nayive-shared' ) === '1';
                for( var i = 0; i < localStorage.length; i++ )
                {
                    var k = localStorage.key( i ) || '';
                    if( k !== 'nayive-shared' && ( k.indexOf( 'nayive' ) === 0 || k.indexOf( 'balata' ) === 0 ) ) known = true;
                }
            }
            catch ( e ) {}
            if( shared || ! known )
            {
                document.getElementById( 'notMine' ).hidden = false;
                document.getElementById( 'remember' ).checked = false;
            }
            var leftovers = ! shared ? Promise.resolve() :
                fetch( '/api/whoami', { credentials: 'same-origin' } ).then( function ( r )
                {
                    if( r.status !== 401 ) return;
                    return window.AyniStore.localCount().then( function ( n )
                    {
                        if( n !== 0 ) return;
                        return fetch( '/api/logout', { method: 'POST', credentials: 'same-origin', headers: { 'X-Nayive-Forget': '1' } } );
                    } );
                } ).catch( function () {} );

            // i18n.js hides the page until the dictionary is in, and a hidden
            // field cannot take focus: focus once the page is shown.
            var focusUser = function () { document.getElementById( 'user' ).focus(); };
            Ayni.i18n.ready.then( focusUser, focusUser );

            // The eye that shows / hides the password is Ayni's [data-reveal].

            // The admin account manages users, so it goes straight to the
            // admin panel. Everyone else lands on the app launcher - ?return= is
            // NOT a way back into any app: on iPhone, Safari restores the last
            // app's tab after its cookie expired, and following it would drop
            // you into that stale app. Only a ONE-SHOT target comes back (the
            // same list as server/go/static.go loginReturn), rebuilt from its
            // own parameters, never echoed: a chat notice or a link shared to
            // Chat (chat/?c=, ?text=) and a "¿Dónde estás?" answer (/?here=).
            // Both pages drop the parameter once used. An account with no
            // password yet goes to the launcher, which asks for one first.
            function returnTo( info )
            {
                if( info.role === 'admin' ) return '/nayive/admin.html';
                if( info.must_set_password ) return '/nayive/';
                var raw = new URLSearchParams( location.search ).get( 'return' );
                var u   = null;
                try { u = raw ? new URL( raw, location.origin ) : null; } catch ( e ) {}
                if( ! u || u.origin !== location.origin ) return '/nayive/';

                var keep = new URLSearchParams();
                var take = function ( k ) { var v = u.searchParams.get( k ); if( v ) keep.set( k, v ); };
                var path = '';
                if( u.pathname === '/nayive/chat/' || u.pathname === '/nayive/chat/index.html' )
                {
                    take( 'c' ); take( 'text' ); path = '/nayive/chat/';
                }
                else if( u.pathname === '/nayive/' || u.pathname === '/nayive/index.html' )
                {
                    take( 'here' ); path = '/nayive/';
                }
                var q = keep.toString();
                return path && q ? path + '?' + q : '/nayive/';
            }

            form.addEventListener( 'submit', async function ( ev )
            {
                ev.preventDefault();
                errBox.textContent = '';
                submit.disabled = true;

                try
                {
                    await leftovers;
                    var remember = document.getElementById( 'remember' ).checked;
                    var res = await fetch( '/api/login',
                    {
                        method:      'POST',
                        headers:     { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify(
                        {
                            user:     document.getElementById( 'user' ).value.trim(),
                            password: document.getElementById( 'password' ).value,
                            remember: remember
                        } )
                    } );

                    if( res.ok )
                    {
                        var info = await res.json().catch( function () { return {}; } );
                        // The launcher checks this device's notifications once
                        // after each sign-in (see "after each login" there).
                        if( info.role !== 'admin' )
                            try { sessionStorage.setItem( 'nayive-just-in', '1' ); } catch ( e ) {}
                        // A password change elsewhere may have dropped this
                        // device's push: the launcher's next load registers it
                        // again, even when this sign-in goes straight to Chat.
                        try { localStorage.removeItem( 'nayive-push-note' ); } catch ( e ) {}
                        // Never for the admin: its session is never wiped
                        // (api_auth.go apiLogout), so it leaves the mark as it
                        // was - another account's unsent saves may be here.
                        if( info.role !== 'admin' )
                            try
                            {
                                if( remember ) localStorage.removeItem( 'nayive-shared' );
                                else           localStorage.setItem( 'nayive-shared', '1' );
                            }
                            catch ( e ) {}
                        // No password yet: the launcher (never the big-screen
                        // desktop, whose apps the server now refuses) asks for one.
                        try
                        {
                            if( info.must_set_password ) sessionStorage.setItem( 'nayive-must-set', '1' );
                            else                         sessionStorage.removeItem( 'nayive-must-set' );
                        }
                        catch ( e ) {}
                        location.href = returnTo( info );
                        return;
                    }

                    // The server's own words are Spanish: say it in the user's language.
                    errBox.textContent = Ayni.t( res.status === 401 ? 'login.badCreds' : 'login.failed' );
                }
                catch ( e )
                {
                    errBox.textContent = Ayni.t( 'login.noServer' );
                }

                submit.disabled = false;
                document.getElementById( 'password' ).value = '';
                document.getElementById( 'password' ).focus();
            } );
        } )();
    </script>
</body>
</html>
