        const SVG_TRIPS  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="5.5" cy="9" rx="2" ry="2.5"></ellipse><ellipse cx="12" cy="6" rx="2.1" ry="2.6"></ellipse><ellipse cx="18.5" cy="9" rx="2" ry="2.5"></ellipse><path d="M12 12c-4.5 0-7.8 2-7.8 4.4 0 2 2.55 3.3 5.4 2.9 1.35-.2 1.5-.7 2.4-.7s1.05.5 2.4.7c2.85.4 5.4-.9 5.4-2.9C19.8 14 16.5 12 12 12z"></path></svg>';
        const SVG_SPLIT  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 7A7 7 0 1 0 16.5 17"></path><line x1="3" y1="10.2" x2="13.5" y2="10.2"></line><line x1="3" y1="13.8" x2="13.5" y2="13.8"></line></svg>';

        // Extensions each tool can open/import (mirrors the accept="" of their import
        // inputs — see apps/write, apps/calc). Kept disjoint so a double-click routes
        // to exactly one tool.
        const WRITE_IMPORT = [ 'docx' ];
        const CALC_IMPORT  = [ 'xlsx', 'csv' ];
        // LibreOffice documents. Write and Calc cannot read them, so the server
        // makes a .docx / .xlsx twin beside the original (openOffice below; keep
        // officeTwin in server/go/office.go the same lists). The other LibreOffice
        // kinds have no app here and are refused: Impress, Draw, Math, Base.
        const OFFICE_WRITE  = [ 'odt', 'ott', 'fodt', 'sxw', 'stw' ];
        const OFFICE_CALC   = [ 'ods', 'ots', 'fods', 'sxc', 'stc' ];
        const OFFICE_REFUSE = [ 'odp', 'otp', 'fodp', 'sxi', 'sti',      // Impress
                                'odg', 'otg', 'fodg', 'sxd', 'std',      // Draw
                                'odf', 'sxm', 'odb' ];                   // Math, Base
        // Plain-text / code / markup files → the Text editor (see apps/text), which is
        // also the catch-all: it opens anything not owned by another tool and not a
        // known-binary type, so this list only steers the file-row ICON.
        const TEXT_IMPORT  =
        [
            'txt', 'log', 'une', 'model', 'md', 'markdown', 'mkd',
            'html', 'htm', 'xhtml', 'css', 'js', 'mjs', 'cjs', 'jsx', 'ts',
            'json', 'map', 'webmanifest', 'xml', 'xsl', 'xsd', 'svg', 'rss',
            'yaml', 'yml', 'toml', 'ini', 'conf', 'cfg', 'properties', 'env',
            'sh', 'bash', 'zsh', 'ksh', 'ps1', 'bat', 'sql',
            'py', 'pyw', 'r', 'c', 'h', 'cpp', 'cc', 'cxx', 'hpp', 'hh', 'java', 'cs', 'tex'
        ];
        // Raster images → an image opener. '.svg' is deliberately absent: the server
        // serves it as text/plain, so it stays in TEXT_IMPORT.
        //   IMAGE_EDIT  the formats the TOAST UI Image Editor can load AND re-encode
        //               (canvas.toDataURL) → they open in Drive's built-in editor.
        //   IMAGE_VIEW  every other raster type → the plain lightbox (view only), and
        //               it also stays the superset used for the file-row icon.
        const IMAGE_EDIT = [ 'png', 'jpg', 'jpeg', 'webp' ];
        const IMAGE_VIEW = [ 'png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'avif' ];
        // Audio / video → Drive's own player (browser-native <audio>/<video> controls,
        // view only, no editing). What actually plays depends on the browser's codecs.
        const VIDEO_VIEW = [ 'mp4', 'm4v', 'webm', 'ogv', 'mov', 'mkv' ];
        const AUDIO_VIEW = [ 'mp3', 'm4a', 'aac', 'ogg', 'oga', 'opus', 'wav', 'flac', 'weba' ];

        function extOf( name )
        {
            const m = /\.([a-z0-9]+)$/i.exec( name );
            return m ? m[1].toLowerCase() : '';
        }

        // Server nodes carry `size` (bytes, files only) and `mtime` (last-modified,
        // Unix seconds). Dates always render yyyy-mm-dd (Nayive ANSI-date rule).
        function fmtSize( bytes )
        {
            if( bytes == null ) return '';
            if( bytes < 1024 )  return bytes + ' B';

            const units = [ 'KB', 'MB', 'GB', 'TB' ];
            let   v = bytes / 1024, i = 0;
            while( v >= 1024 && i < units.length - 1 ) { v /= 1024; i++; }

            return (v < 10 ? v.toFixed( 1 ) : Math.round( v )) + ' ' + units[i];
        }

        function pad2( n ) { return String( n ).padStart( 2, '0' ); }

        function fmtDate( unixSec )
        {
            if( ! unixSec ) return '';
            const d = new Date( unixSec * 1000 );
            return d.getFullYear() + '-' + pad2( d.getMonth() + 1 ) + '-' + pad2( d.getDate() );
        }

        function fmtDateTime( unixSec )
        {
            if( ! unixSec ) return '';
            const d = new Date( unixSec * 1000 );
            return fmtDate( unixSec ) + ' ' + pad2( d.getHours() ) + ':' + pad2( d.getMinutes() );
        }

        // The app a shared item belongs to. Only the top-level rows of
        // "Compartido conmigo" carry node.shared (lib/shares.py root_nodes) —
        // 'photos' | 'trips' | 'folder' | 'file'. Anything deeper inside a share
        // is an ordinary file again.
        function sharedApp( node )
        {
            return ( node && node.shared && node.shared.app ) || '';
        }

        // The extension that decides the icon and the opener. A shared item's name
        // is its slug ("SEPE.txt" -> "sepe-txt", the dot is gone), so its type comes
        // from the grant's own title instead — see lib/shares.py slugify().
        function typeExt( node )
        {
            return extOf( node && node.shared ? ( node.shared.title || '' ) : nameOf( node ) );
        }

        function listIcon( node )
        {
            // A shared album / trip shows ITS app's glyph, not a plain folder.
            const app = sharedApp( node );
            if( app === 'photos' ) return { cls: ' ic-photos', svg: SVG_PHOTOS };
            if( app === 'trips'  ) return { cls: ' ic-trips',  svg: SVG_TRIPS  };
            if( app === 'split'  ) return { cls: ' ic-trips',  svg: SVG_SPLIT  };   // a shared expenses group, opens in Split

            if( isDir( node ) ) return { cls: '', svg: SVG_FOLDER };

            const ext = typeExt( node );

            if( WRITE_IMPORT.includes( ext ) || OFFICE_WRITE.includes( ext ) ) return { cls: ' ic-doc',   svg: SVG_DOC   };
            if( CALC_IMPORT.includes( ext )  || OFFICE_CALC.includes( ext )  ) return { cls: ' ic-sheet', svg: SVG_SHEET };
            if( ext === 'pdf'                ) return { cls: ' ic-pdf',   svg: SVG_PDF   };
            if( TEXT_IMPORT.includes( ext )  ) return { cls: ' ic-code',  svg: SVG_CODE  };
            if( IMAGE_VIEW.includes( ext )   ) return { cls: ' ic-image', svg: SVG_IMAGE };
            if( VIDEO_VIEW.includes( ext )   ) return { cls: ' ic-media', svg: SVG_VIDEO };
            if( AUDIO_VIEW.includes( ext )   ) return { cls: ' ic-media', svg: SVG_AUDIO };

            return { cls: '', svg: SVG_FILE };
        }

        function buildListRow( node, showPath )
        {
            const dir = isDir( node );
            const name = displayName( node );

            const row = document.createElement( 'div' );
            row.className     = 'row' + (selectedPaths.has( node.path ) ? ' selected' : '');
            row.dataset.path  = node.path;

            // Phone: a visible ⋮ that opens the same per-item menu as a long-press.
            const menuBtn = document.createElement( 'button' );
            menuBtn.className = 'icon-btn sm row-menu';
            menuBtn.title     = T( 'ui.actions' );
            menuBtn.setAttribute( 'aria-label', T( 'ui.actions' ) );
            menuBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>';
            menuBtn.addEventListener( 'click', function( e )
            {
                e.stopPropagation();
                const r = menuBtn.getBoundingClientRect();
                openMenuFor( row, r.right, r.bottom );
            });
            row.appendChild( menuBtn );

            // One icon, always: the app (or file type) that opens this row. Inside
            // "Compartido conmigo" it doubles as the "who lent me this" tooltip —
            // the whole folder already says the items are somebody else's.
            const icon = listIcon( node );
            const ic   = document.createElement( 'span' );
            ic.className = 'row-ic' + icon.cls;
            ic.innerHTML = icon.svg;
            if( node.shared )
                ic.title = node.shared.by ? TF( 'drive.sharedByWho', { who: node.shared.by } ) : T( 'drive.sharedWithYou' );

            const label = document.createElement( 'span' );
            label.className   = 'row-name';
            label.textContent = name;

            const meta = document.createElement( 'span' );
            meta.className = 'row-meta';

            if( showPath )
            {
                const parent = node.path.indexOf( '/' ) !== -1 ? node.path.slice( 0, node.path.lastIndexOf( '/' ) ) : '';
                meta.textContent = fsRel( parent ) || 'Drive';
                meta.title       = node.path;
            }
            else
            {
                const bits = [];
                // A folder from the one-level listing carries no child count
                // (its `nodes` is an empty stub) — show just its date.
                if( dir && node.nodes && node.nodes.length ) bits.push( node.nodes.length + ' elem.' );
                else if( ! dir && node.size != null )         bits.push( fmtSize( node.size ) );
                if( node.mtime )                   bits.push( fmtDate( node.mtime ) );

                meta.textContent = bits.join( ' · ' );
                if( node.mtime ) meta.title = fmtDateTime( node.mtime );
            }

            row.appendChild( ic );
            row.appendChild( label );
            row.appendChild( meta );
            paintConvertBadge( row );

            // Plain click selects one (file or folder alike); Ctrl/⌘-click toggles
            // the selection; double-click opens — a folder navigates in, a file
            // routes to its viewer / editor. Selection highlight is repainted in
            // place so a fast double-click keeps its target row.
            //
            // Touch has no double-click: on a phone a tap still opens folders the
            // way it always has (a tap on a file selects it; long-press opens it).
            row.addEventListener( 'click', function( e )
            {
                // Phone: a tap goes into a folder (there is no double-click). On a
                // shared album / trip openNode() sends it to its app instead.
                if( isPhone() && isDir( node ) && ! e.ctrlKey && ! e.metaKey ) { openNode( node ); return; }

                if( e.ctrlKey || e.metaKey )
                    selectedPaths.has( node.path ) ? selectedPaths.delete( node.path ) : selectedPaths.add( node.path );
                else
                    { selectedPaths.clear(); selectedPaths.add( node.path ); }

                paintSelection();
                updateToolbarState();
            });

            // Suppress the browser's native word-selection on the second click of
            // a double-click before it starts.
            row.addEventListener( 'mousedown', function( e ) { if( e.detail > 1 ) e.preventDefault(); } );

            row.addEventListener( 'dblclick', function( e )
            {
                e.preventDefault();
                e.stopPropagation();
                const sel = window.getSelection();
                if( sel ) sel.removeAllRanges();
                openNode( node );
            });

            makeDraggable( row, node );
            if( dir ) makeDropTarget( row, function() { return node.path; } );

            return row;
        }

        // Sync the .selected class of every visible row to selectedPaths, without
        // rebuilding the list (keeps row elements alive across a click/dblclick).
        function paintSelection()
        {
            document.querySelectorAll( '#listing .row' ).forEach( function( r )
            {
                r.classList.toggle( 'selected', selectedPaths.has( r.dataset.path ) );
            });
        }

        //------------------------------------------------------------------------//
        // INTERNAL DRAG-AND-DROP: drag files / folders onto a folder to move them.
        // Drop targets are folder rows in the listing and every folder in the tree
        // pane. External OS-file drops (uploads) are untouched — onDrop / the
        // list-pane drag-over bail out while `dragPaths` is set.

        function canDropInto( destPath, paths )
        {
            // A drop is a move, and nothing shared moves — in or out. An "add"
            // grant does not open this up either: it only lets a file be
            // uploaded, never renamed into place. Both ends are checked: a
            // search can put a shared hit and one of ours side by side, and
            // dragging OURS would otherwise carry the other one along.
            if( NayiveUI.isShared( destPath ) ) return false;
            if( paths.some( NayiveUI.isShared ) ) return false;

            for( const p of paths )
            {
                if( p === destPath ) return false;                        // onto itself
                const n = findNode( p );
                if( n && isDir( n ) && destPath.indexOf( p + '/' ) === 0 ) // into its own subtree
                    return false;
            }
            return true;
        }

        // Wire an element as a move-drop target. getDest() returns the folder path
        // (FS_ROOT / '' = Drive root) or null when it is not a valid target.
        function makeDropTarget( el, getDest )
        {
            el.addEventListener( 'dragover', function( e )
            {
                if( ! dragPaths ) return;
                const dest = getDest();
                if( dest === null || ! canDropInto( dest, dragPaths ) ) return;
                e.preventDefault();
                e.stopPropagation();
                e.dataTransfer.dropEffect = 'move';
                el.classList.add( 'drop-target' );
            });
            el.addEventListener( 'dragleave', function( e )
            {
                if( e.relatedTarget && el.contains( e.relatedTarget ) ) return;   // moved onto a child, still inside
                el.classList.remove( 'drop-target' );
            });
            el.addEventListener( 'drop', function( e )
            {
                el.classList.remove( 'drop-target' );
                if( ! dragPaths ) return;
                const dest = getDest();
                if( dest === null || ! canDropInto( dest, dragPaths ) ) return;
                e.preventDefault();
                e.stopPropagation();
                const paths = dragPaths.slice();
                dragPaths = null;
                doMove( paths, dest );
            });
        }

        // Make a row draggable. On drag start it carries the current multi-selection
        // when the row is part of it, otherwise just this one node.
        function makeDraggable( el, node )
        {
            el.draggable = true;
            el.addEventListener( 'dragstart', function( e )
            {
                // Somebody else's: there is no move to start (see canDropInto).
                if( NayiveUI.isShared( node.path ) ) { e.preventDefault(); return; }

                if( selectedPaths.has( node.path ) && selectedPaths.size )
                    dragPaths = Array.from( selectedPaths );
                else
                {
                    dragPaths = [ node.path ];
                    selectedPaths.clear();
                    selectedPaths.add( node.path );
                    paintSelection();
                    updateToolbarState();
                }
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData( 'text/plain', dragPaths.join( '\n' ) );
                el.classList.add( 'dragging' );
            });
            el.addEventListener( 'dragend', function()
            {
                dragPaths = null;
                el.classList.remove( 'dragging' );
                document.querySelectorAll( '.drop-target' ).forEach( function( t ) { t.classList.remove( 'drop-target' ); } );
            });
        }

        // Activate a node the way a plain click does: navigate into a folder, or
        // route a file to its viewer / editor. Always handles the node — a file
        // no extension rule claims ends in the "Abrir con" dialog — so it always
        // returns true; the flag is kept for callers that still test it.
        function openNode( node )
        {
            // Something shared with us that belongs to an app: hand it straight to
            // that app instead of browsing its folder. Both open it read-only —
            // the server roots a "shared/..." path with writable=false.
            const app = sharedApp( node );
            if( app === 'photos' ) { openDoc( '../photos/index.html?dir='  + encodeURIComponent( node.path ) ); return true; }
            if( app === 'trips'  ) { openDoc( '../trips/index.html?open=' + encodeURIComponent( node.path ) ); return true; }
            if( app === 'split'  ) { openDoc( '../split/index.html?open=' + encodeURIComponent( node.path ) ); return true; }

            if( isDir( node ) ) { navigateTo( node.path ); return true; }

            const ext     = typeExt( node );
            const toWrite = WRITE_IMPORT.includes( ext );
            const toCalc  = CALC_IMPORT.includes( ext );
            const toText  = TEXT_IMPORT.includes( ext );

            // A file in a format an editor opens natively: open it in place, from
            // wherever it lives. Non-native formats (csv) fall through to the
            // import/conversion routing below.
            if( ext === 'docx' ) { openDoc( '../write/index.html?file=' + encodeURIComponent( node.path ) ); return true; }
            if( ext === 'xlsx' ) { openDoc( '../calc/index.html?file='  + encodeURIComponent( node.path ) ); return true; }
            if( toText )         { openDoc( '../text/index.html?file='  + encodeURIComponent( node.path ) ); return true; }

            // A LibreOffice document: its Microsoft Office twin, made first when
            // there is none (Impress / Draw / Math / Base only get a "no").
            const office = officeKind( ext );
            if( office ) { openOffice( node, office ); return true; }

            // An image the editor can re-encode: open it in Drive's built-in editor.
            if( IMAGE_EDIT.includes( ext ) ) { openImageEditor( node.path ); return true; }

            // Any other image: show it in Drive's built-in lightbox viewer (no editing).
            if( IMAGE_VIEW.includes( ext ) ) { openImageViewer( node.path ); return true; }

            // Audio / video: play it in Drive's built-in player (no editing).
            if( VIDEO_VIEW.includes( ext ) ) { openMediaViewer( node.path, 'video' ); return true; }
            if( AUDIO_VIEW.includes( ext ) ) { openMediaViewer( node.path, 'audio' ); return true; }

            // A PDF: hand it to the browser's own PDF viewer (zoom, print, pages).
            if( ext === 'pdf' ) { openDoc( GumApi.fileUrl( node.path ) ); return true; }

            // A file elsewhere that one of the editors can import: hand it to the tool
            // with its import action pre-triggered (ask which one when both qualify).
            if( toWrite && toCalc ) { openWithDialog( node.path, [ 'write', 'calc' ], 'drive.openWithBody' ); return true; }
            if( toWrite )           { openImport( 'write', node.path ); return true; }
            if( toCalc )            { openImport( 'calc',  node.path ); return true; }
            if( toText )            { openImport( 'text',  node.path ); return true; }

            // No app claims this extension: ask which one should have it.
            openWithDialog( node.path, OPEN_WITH_ALL, 'drive.openWithAny' );
            return true;
        }

        //------------------------------------------------------------------------//
        // OPEN A DRIVE FILE IN WRITE / CALC (the tool's import action, pre-triggered)

        function openImport( tool, path )
        {
            openDoc( '../' + tool + '/index.html?import=' + encodeURIComponent( path ) );
        }

        //------------------------------------------------------------------------//
        // LIBREOFFICE DOCUMENTS (the lists sit with WRITE_IMPORT). The server
        // writes the Microsoft Office twin beside the original - "x.odt" ->
        // "x.docx", "y.ods" -> "y.xlsx" - and never touches the original
        // (server/go/office.go). An upload converts every one; a double-click
        // opens the twin, converting first when there is none yet.

        // 'write' | 'calc' | 'refuse' | '' for an extension.
        function officeKind( ext )
        {
            if( OFFICE_WRITE.includes( ext ) )  return 'write';
            if( OFFICE_CALC.includes( ext ) )   return 'calc';
            if( OFFICE_REFUSE.includes( ext ) ) return 'refuse';
            return '';
        }

        // "docs/x.odt" -> "docs/x.docx"; '' for a file that has no twin.
        function officeTwinRel( relPath )
        {
            const kind = officeKind( extOf( relPath ) );
            if( kind !== 'write' && kind !== 'calc' ) return '';
            return relPath.replace( /\.[^./]+$/, kind === 'write' ? '.docx' : '.xlsx' );
        }

        // POST /api/office -> { path, converted }. `replace` on upload: the file
        // just sent must never be answered with an older twin.
        async function officeTwin( path, replace )
        {
            const q = new URLSearchParams( { file: path } );
            if( replace ) q.set( 'replace', '1' );
            return JSON.parse( await withBusy( GumApi.fetchText( '/api/office?' + q.toString(), { method: 'POST' } ) ) );
        }

        // What to say when the server said no (the codes: api_office.go).
        function officeFailText( err, name )
        {
            const m = String( err && err.message );
            if( m.indexOf( '503' ) >= 0 ) return T( 'drive.officeOff' );
            if( m.indexOf( '507' ) >= 0 ) return TF( 'drive.officeQuota',    { name: name } );
            if( m.indexOf( '403' ) >= 0 ) return TF( 'drive.officeReadOnly', { name: name } );
            return TF( 'drive.officeFailed', { name: name } );
        }

        async function openOffice( node, kind )
        {
            const name = displayName( node );
            if( kind === 'refuse' ) { NayiveUI.toast( TF( 'drive.officeRefusedOpen', { name: name } ), { ms: 6000 } ); return; }
            // A file shared on its own has no folder of ours to put a twin in.
            if( node.shared )       { NayiveUI.toast( TF( 'drive.officeReadOnly',    { name: name } ), { ms: 6000 } ); return; }

            // The tab opens NOW, while the double-click still counts: opened
            // after the wait, the browser would block it as a pop-up.
            const busyText = TF( 'drive.officeConverting', { name: name } );
            const win = isPhone() ? null : window.open( '', '_blank' );
            if( win ) try { win.document.title = name; win.document.body.textContent = busyText; } catch( _ ) {}
            setStatus( busyText );
            try
            {
                const r   = await officeTwin( node.path, false );
                const url = new URL( '../' + kind + '/index.html?file=' + encodeURIComponent( r.path ), location.href ).href;
                setStatus( '' );
                if( r.converted )
                {
                    NayiveUI.toast( TF( 'drive.officeConverted', { name: r.path.split( '/' ).pop() } ), { ms: 5000 } );
                    reload();     // the twin shows up beside the original
                }
                if( win ) win.location.href = url;
                else      location.href = url;
            }
            catch( err )
            {
                setStatus( '' );
                if( win ) win.close();
                NayiveUI.toast( officeFailText( err, name ), { ms: 6000 } );
            }
        }

        //------------------------------------------------------------------------//
        // "ABRIR CON" DIALOG
        //
        // Drive has no launcher buttons for the other apps any more: a file gets
        // to its app by being opened. When openNode knows the extension it goes
        // straight there; when it does not, this dialog asks. Two callers:
        //   - a file BOTH Write and Calc could import (their lists are disjoint
        //     today, so it never fires — kept in case they ever overlap);
        //   - a file no app claims, and then every app is on offer.

        const OPEN_WITH_BTN =
        {
            text:   'importWithTextBtn',   write: 'importWithWriteBtn', calc:   'importWithCalcBtn',
            photos: 'importWithPhotosBtn', music: 'importWithMusicBtn', movies: 'importWithMoviesBtn'
        };
        const OPEN_WITH_ALL = [ 'text', 'write', 'calc', 'photos', 'music', 'movies' ];

        let openWithPath = null;

        function openWithDialog( path, apps, msgKey )
        {
            openWithPath = path;
            document.getElementById( 'importWithMsg' ).textContent =
                TF( msgKey, { name: path.split( '/' ).pop() } );

            for( const app in OPEN_WITH_BTN )
                document.getElementById( OPEN_WITH_BTN[ app ] ).hidden = ! apps.includes( app );

            setBackdrop( 'importWithBackdrop', true );
        }

        // Text opens any file as it is; Write and Calc convert theirs on import.
        // Photos / Music / Movies only ever take a FOLDER (?dir=), so they open
        // the one the file sits in.
        function chooseOpenWith( app )
        {
            const path = openWithPath;
            openWithPath = null;
            setBackdrop( 'importWithBackdrop', false );
            if( ! path ) return;

            if( app === 'text' )                    openDoc( '../text/index.html?file=' + encodeURIComponent( path ) );
            else if( app === 'write' || app === 'calc' ) openImport( app, path );
            else openDoc( '../' + app + '/index.html?dir=' +
                          encodeURIComponent( path.split( '/' ).slice( 0, -1 ).join( '/' ) ) );
        }

        //------------------------------------------------------------------------//
        // BUILT-IN IMAGE VIEWER (lightbox; view only, never handed to an editor)

        function openImageViewer( path )
        {
            const name = path.split( '/' ).pop();
            const img  = document.getElementById( 'viewerImg' );

            img.src = GumApi.fileUrl( path );
            img.alt = name;
            document.getElementById( 'viewerName' ).textContent = name;

            setBackdrop( 'viewerBackdrop', true );
        }

        function closeImageViewer()
        {
            setBackdrop( 'viewerBackdrop', false );
            document.getElementById( 'viewerImg' ).removeAttribute( 'src' );   // free the decoded bitmap
        }

        //------------------------------------------------------------------------//
        // BUILT-IN IMAGE EDITOR (TOAST UI Image Editor — png / jpg / webp only)

        // The library (~0.7 MB) is heavy and rarely needed, so it is not in the page
        // head: this loads its two bundles once, on the first edit, and caches the
        // promise. Order matters — tui.colorPicker must exist before the editor bundle.
        let editorLibPromise = null;

        function loadImageEditorLib()
        {
            if( editorLibPromise ) return editorLibPromise;

            function addCss( href )
            {
                const l = document.createElement( 'link' );
                l.rel = 'stylesheet'; l.href = href;
                document.head.appendChild( l );
            }

            function addScript( src )
            {
                return new Promise( function( resolve, reject )
                {
                    const s = document.createElement( 'script' );
                    s.src = src;
                    s.onload = resolve;
                    s.onerror = function() { reject( new Error( 'failed to load ' + src ) ); };
                    document.head.appendChild( s );
                });
            }

            addCss( 'lib/tui-color-picker_v2.2.8.min.css' );
            addCss( 'lib/tui-image-editor_v3.15.3.min.css' );

            editorLibPromise = addScript( 'lib/tui-color-picker_v2.2.8.min.js' )
                .then( function() { return addScript( 'lib/tui-image-editor_v3.15.3.min.js' ); } )
                .catch( function( err ) { editorLibPromise = null; throw err; } );

            return editorLibPromise;
        }

        let imageEditor  = null;    // the live tui.ImageEditor instance, or null
        let editorSeq    = 0;       // bumped on every open AND every close, so a
                                    // slow first library load knows it is stale
        let editorPath   = null;    // Drive path of the image being edited
        let editorDirty  = false;   // an edit is on the undo stack and not yet saved
        let commentBase  = '';      // the photo comment as last loaded / saved

        // Per-photo comments live in one hidden sidecar map keyed by the image's
        // files/ path, the same file the Photos app reads and writes. The map is
        // NOT stored inside the image (a canvas export drops all metadata), so it
        // has to follow a rename / move / copy - which is why both the map and
        // that upkeep belong to shared/media.js, not here.
        function commentValue() { return document.getElementById( 'editorComment' ).value.trim(); }
        function isEditorDirty() { return editorDirty || commentValue() !== commentBase; }

        async function loadPhotoComment( path )
        {
            const box = document.getElementById( 'editorComment' );
            box.value  = '';
            commentBase = '';
            let map;
            try { map = await NayiveMedia.readComments(); } catch( _ ) { return; }
            box.value  = map[ path ] || '';
            commentBase = box.value.trim();
        }

        async function savePhotoComment( path )
        {
            let map;
            try { map = await NayiveMedia.readComments(); } catch( _ ) { return; }
            const text = commentValue();
            if( text ) map[ path ] = text; else delete map[ path ];
            try { await NayiveMedia.writeComments( map ); commentBase = text; }
            catch( _ ) { /* non-fatal: the image itself was saved */ }
        }

        async function openImageEditor( path )
        {
            // The library is fetched on the FIRST edit and takes a moment, and
            // the overlay is already up while it loads — so the user can close
            // it, or pick another image, before we get to build anything. This
            // counter says whether the open we started is still the one wanted:
            // without it a closed editor would come to life behind the page,
            // invisible and undismissable.
            const seq  = ++editorSeq;
            const name = path.split( '/' ).pop();

            document.getElementById( 'editorName' ).textContent = name;
            document.getElementById( 'editorSaveBtn'   ).innerHTML = NayiveUI.icon( 'check'  );
            document.getElementById( 'editorSaveAsBtn' ).innerHTML = NayiveUI.icon( 'saveas' );
            setBackdrop( 'editorBackdrop', true );
            setStatus( T( 'drive.loadingEditor' ) );

            try { await loadImageEditorLib(); }
            catch( _ )
            {
                if( seq !== editorSeq ) return;
                setStatus( '' );
                setBackdrop( 'editorBackdrop', false );
                NayiveUI.toast( T( 'drive.editorFailed' ) );
                return;
            }
            if( seq !== editorSeq ) return;          // closed / superseded while it loaded
            setStatus( '' );

            editorPath  = path;
            editorDirty = false;
            loadPhotoComment( path );

            const host = document.getElementById( 'tuiEditor' );
            if( imageEditor ) { try { imageEditor.destroy(); } catch( _ ) {} imageEditor = null; }
            host.innerHTML = '';

            imageEditor = new tui.ImageEditor( host, {
                includeUI: {
                    loadImage: { path: GumApi.fileUrl( path ), name: name },
                    menu: [ 'crop', 'flip', 'rotate', 'draw', 'shape', 'icon', 'text', 'mask', 'filter' ],
                    initMenu: '',
                    menuBarPosition: 'bottom',
                    uiSize: { width: '100%', height: '100%' }
                },
                cssMaxWidth:  window.innerWidth,
                cssMaxHeight: window.innerHeight - 44,
                selectionStyle: { cornerSize: 18, rotatingPointOffset: 60 },
                usageStatistics: false   // the library pings Google Analytics unless this is off
            });

            imageEditor.on( 'undoStackChanged', function( len ) { editorDirty = len > 0; } );
        }

        // png stays png; jpg/jpeg → jpeg; webp → webp. Anything else defaults to png.
        function editorFormatFor( name )
        {
            const e = extOf( name );
            if( e === 'jpg' || e === 'jpeg' ) return 'jpeg';
            if( e === 'webp' )                return 'webp';
            return 'png';
        }

        function dataUrlToBytes( dataUrl )
        {
            const bin = atob( dataUrl.slice( dataUrl.indexOf( ',' ) + 1 ) );
            const out = new Uint8Array( bin.length );
            for( let i = 0; i < bin.length; i++ ) out[i] = bin.charCodeAt( i );
            return out;
        }

        async function saveEditorTo( destPath )
        {
            if( ! imageEditor ) return;

            const fmt  = editorFormatFor( destPath );
            const opts = { format: fmt };
            if( fmt !== 'png' ) opts.quality = 0.92;

            let bytes;
            try { bytes = dataUrlToBytes( imageEditor.toDataURL( opts ) ); }
            catch( _ ) { NayiveUI.toast( T( 'drive.renderFailed' ) ); return; }

            setStatus( T( 'ui.sync.saving' ) );
            try
            {
                await withBusy( GumApi.writeFileBytes( destPath, bytes ) );
                editorDirty = false;

                // "Guardar copia" → keep editing the copy from now on.
                editorPath = destPath;
                document.getElementById( 'editorName' ).textContent = destPath.split( '/' ).pop();

                await savePhotoComment( destPath );

                NayiveUI.toast( T( 'drive.imageSaved' ) );
            }
            catch( _ ) { NayiveUI.toast( T( 'drive.imageSaveFailed' ) ); }

            setStatus( '' );
            await reload();
        }

        function saveEditor()
        {
            if( editorPath ) saveEditorTo( editorPath );
        }

        function saveEditorAs()
        {
            if( ! editorPath ) return;

            const cur = editorPath.split( '/' ).pop();
            const dot = cur.lastIndexOf( '.' );
            const seed = dot > 0 ? cur.slice( 0, dot ) + '-editado' + cur.slice( dot ) : cur + '-editado';

            const inp = document.getElementById( 'saveCopyName' );
            inp.value = seed;
            setBackdrop( 'saveCopyBackdrop', true );
            inp.focus();
            // preselect the base name, leaving the extension out of the selection
            try { inp.setSelectionRange( 0, dot > 0 ? seed.length - ( cur.length - dot ) : seed.length ); }
            catch( _ ) {}
        }

        async function confirmSaveCopy()
        {
            if( ! editorPath ) return;
            const name = document.getElementById( 'saveCopyName' ).value.trim();
            if( ! name ) return;

            const cut  = editorPath.lastIndexOf( '/' );
            const dir  = cut < 0 ? '' : editorPath.slice( 0, cut );   // '' at the root
            const dest = joinPath( dir, name );

            setBackdrop( 'saveCopyBackdrop', false );

            // A PUT replaces the file outright, with no trip through the
            // papelera, so the copy has to ask what renaming and uploading both
            // ask. The folder is re-listed rather than read off the screen: the
            // image may have been opened from a search hit, whose folder is not
            // the one on display.
            if( dest !== editorPath && ( await destNameSet( dir ) ).has( name ) )
            {
                if( ! await NayiveUI.confirm( {
                    title: T( 'drive.nameExistsTitle' ),
                    body: TF( 'drive.nameExistsCopyBody', { name: name } ),
                    confirm: T( 'drive.replace' ), danger: true } ) ) return;

                try { await withBusy( GumApi.deletePaths( [ dest ] ) ); }
                catch( _ ) { NayiveUI.toast( T( 'drive.moveExistingFailed' ) ); return; }
            }

            saveEditorTo( dest );
        }

        async function closeImageEditor( force )
        {
            if( ! force && isEditorDirty() &&
                ! await NayiveUI.confirm( {
                    title: T( 'drive.unsavedTitle' ),
                    body: T( 'drive.unsavedBody' ),
                    confirm: T( 'drive.closeWithout' ), danger: true } ) )
                return;

            editorSeq++;                 // an open still loading its library is now stale

            if( imageEditor )
            {
                try { imageEditor.destroy(); } catch( _ ) {}
                imageEditor = null;
            }
            document.getElementById( 'tuiEditor' ).innerHTML = '';
            document.getElementById( 'editorComment' ).value = '';
            editorPath   = null;
            editorDirty  = false;
            commentBase  = '';
            setBackdrop( 'editorBackdrop', false );
        }

        //------------------------------------------------------------------------//
        // BUILT-IN AUDIO / VIDEO PLAYER (view only, never handed to an editor)

        function openMediaViewer( path, kind )
        {
            const name  = path.split( '/' ).pop();
            const url   = GumApi.fileUrl( path );
            const video = document.getElementById( 'mediaVideo' );
            const audio = document.getElementById( 'mediaAudio' );

            video.hidden = (kind !== 'video');
            document.getElementById( 'mediaAudioBox' ).hidden = (kind !== 'audio');

            const el = (kind === 'video') ? video : audio;
            el.src = url;
            el.load();

            document.getElementById( 'mediaName' ).textContent = name;
            setBackdrop( 'mediaBackdrop', true );
            el.play().catch( function() {} );   // autoplay may be blocked — controls still work
        }

        function closeMediaViewer()
        {
            const video = document.getElementById( 'mediaVideo' );
            const audio = document.getElementById( 'mediaAudio' );

            video.pause(); audio.pause();
            video.removeAttribute( 'src' ); audio.removeAttribute( 'src' );
            video.load(); audio.load();   // drop the buffered stream

            setBackdrop( 'mediaBackdrop', false );
        }

        // The paths a toolbar action (rename / move / copy / link / delete)
        // works on: the listing selection if there is one, otherwise the folder
        // you are viewing — which is the one shown selected in the tree. The
        // Drive root itself is never a target. Delete has always used this
        // fallback; rename / move / copy / link use it too, so the tree stays
        // actionable without first selecting a row in the right pane.
        function actionTargets()
        {
            if( selectedPaths.size ) return Array.from( selectedPaths );
            if( currentFolder && currentFolder !== FS_ROOT ) return [ currentFolder ];
            return [];
        }

        function updateToolbarState()
        {
            const n  = selectedPaths.size;
            const nT = actionTargets().length;

            // Anything under shared/ belongs to somebody else. The server refuses
            // every write on it (resolve_path returns writable=false), so the
            // buttons that would write are simply turned off here - a shared item
            // can be opened, downloaded and copied out, never changed.
            const targets = actionTargets();
            const roSel   = readOnlySel();        // same rule the context menus use
            const roHere  = readOnlyHere();

            document.getElementById( 'renameBtn'   ).disabled = (nT !== 1) || roSel;
            document.getElementById( 'moveToBtn'   ).disabled = (nT === 0) || roSel;
            document.getElementById( 'copyToBtn'   ).disabled = (nT === 0);   // copying OUT is fine
            document.getElementById( 'newFolderBtn' ).disabled = roHere;
            // Upload is the ONE thing an "add" share opens up: a folder somebody
            // shared with us, having ticked "pueden añadir archivos". Everything
            // else on this row stays off there — see canAddHere.
            document.getElementById( 'uploadBtn'    ).disabled = roHere && ! canAddHere;

            // Compartir: exactly one thing, mine, and not a whole virtual root.
            const shOne  = (targets.length === 1) ? targets[ 0 ] : '';
            const shareBtn = document.getElementById( 'shareBtn' );
            shareBtn.disabled = ! shOne || NayiveUI.isShared( shOne )
                                || shOne === 'files' || shOne === 'data';
            shareBtn.title    = shOne && ! shareBtn.disabled
                              ? TF( 'drive.shareOne', { name: shOne.split( '/' ).pop() } )
                              : T( 'drive.shareHint' );

            // Delete acts on the checked items, or (nothing checked) on the current
            // folder — disabled only at the root with no selection. A non-empty
            // current folder gets an extra confirmation (see openDeleteConfirm).
            const delBtn = document.getElementById( 'deleteBtn' );
            delBtn.disabled = (nT === 0) || roSel;
            delBtn.title    = (n > 0) ? T( 'drive.trashSelection' ) : T( 'drive.trashFolder' );

            // Copy-link acts on the one checked item, or (nothing checked) on the
            // folder selected in the tree — disabled only at the root with no selection.
            const clBtn = document.getElementById( 'copyLinkBtn' );
            clBtn.disabled = (nT !== 1);
            clBtn.title    = (n === 1) ? T( 'drive.linkItem' ) : T( 'drive.linkFolder' );

            // Download acts on the checked items, or (nothing checked) on the current folder.
            const dlBtn = document.getElementById( 'downloadBtn' );
            dlBtn.disabled = (nT === 0);
            dlBtn.title    = (n > 0) ? T( 'drive.downloadSelection' ) : T( 'drive.downloadFolder' );
        

            // Several of the titles above were just rewritten from scratch, so the
            // "· Ctrl+D" hints go back on last.
            applyKeyHints();
        }

        function setStatus( text ) { document.getElementById( 'statusLabel' ).textContent = text || ''; }

        // The thin bar under the "Drive" title showing how full the server disk is.
        // frac is 0..1; null hides the bar (unknown / request failed).
        // Colour: green ≤70 %, gold ≤90 %, red above.
        function setDiskGauge( frac )
        {
            const bar = document.getElementById( 'diskBar' );

            if( frac == null ) { bar.hidden = true; return; }

            frac = Math.max( 0, Math.min( 1, frac ) );
            const pct = frac * 100;
            const col = pct <= 70 ? 'var(--ok)' : pct <= 90 ? 'var(--warn)' : 'var(--danger)';

            bar.hidden = false;
            bar.style.setProperty( '--disk-fill', col );
            bar.firstElementChild.style.width = pct.toFixed( 1 ) + '%';
        }

        async function refreshDiskGauge()
        {
            try
            {
                const s    = JSON.parse( await GumApi.fetchText( GumApi.API_FILES + '?stat=disk' ) );
                const used = s.total - s.usable;
                const held = s.trash || 0;
                setDiskGauge( used / s.total );
                document.getElementById( 'diskBar' ).title =
                    TF( 'drive.diskPct', { pct: Math.round( 100 * used / s.total ),
                                           used: fmtSize( used ), total: fmtSize( s.total ) } ) +
                    ( held ? '\n' + TF( 'drive.trashHolds', { held: fmtSize( held ) } ) : '' );

                // Nearly full and the papelera is holding something: one tap on
                // the bar is the quickest way to get the space back.
                offerEmptyTrash( used / s.total >= 0.9 && held > 0, held );
            }
            catch( _ )
            {
                setDiskGauge( null );
                offerEmptyTrash( false, 0 );
            }
        }

        // Makes the disk bar clickable while the disk is nearly full and the
        // papelera has something in it. Emptying it is the only space a user
        // can reclaim without deleting anything they still have.
        function offerEmptyTrash( on, held )
        {
            const bar = document.getElementById( 'diskBar' );
            bar.classList.toggle( 'disk-bar--offer', !! on );
            bar.onclick = ! on ? null : async function ()
            {
                if( ! await NayiveUI.confirm( {
                        title:   T( 'drive.emptyTrashTitle' ),
                        body:    TF( 'drive.diskFullBody', { held: fmtSize( held ) } ),
                        confirm: T( 'drive.emptyTrash' ), danger: true } ) ) return;
                try { await GumApi.trashEmpty(); }
                catch( _ ) { NayiveUI.toast( T( 'drive.emptyTrashFailed' ) ); return; }
                NayiveUI.toast( T( 'drive.trashEmptied' ) );
                reload();
            };
        }

        function setSyncStatus( ok )
        {
            const el = document.getElementById( 'syncIndicator' );
            el.classList.toggle( 'synced', ok !== false );
            // The plug IS the "re-read this folder" button now (it replaced #refreshBtn).
            el.title = T( ok === false ? 'drive.connError' : 'ui.sync.synced' ) + T( 'ui.sync.tapHint' );
        }

        // Any request in flight (list, upload, rename, delete, download) turns the dot
        // blue; the .busy class wins over .synced in the stylesheet while it lasts.
        let netInFlight = 0;

        function netBusy( delta )
        {
            netInFlight = Math.max( 0, netInFlight + delta );

            const el = document.getElementById( 'syncIndicator' );
            if( el ) el.classList.toggle( 'busy', netInFlight > 0 );
        }

        // Run a GumApi call with the dot blue for as long as it is in flight.
        function withBusy( promise )
        {
            netBusy( 1 );
            return promise.finally( function() { netBusy( -1 ); } );
        }

        async function reload()
        {
            setStatus( T( 'ui.loading' ) );

            try
            {
                dirTreeRoot = scopeTree( await withBusy( GumApi.dirTree() ) );
                computeFsRoot();
                expandedFolders.add( FS_ROOT );

                if( ! findNode( currentFolder ) )
                    currentFolder = FS_ROOT;

                selectedPaths.clear();
                await loadListing( currentFolder );      // refetch the open folder + render
                if( searchQuery.trim() ) runSearch();    // keep an active search live
                setSyncStatus( true );
                setStatus( '' );
                refreshDiskGauge();          // keep the server-HD bar current on manual refresh
            }
            catch( _ )
            {
                setSyncStatus( false );
                setStatus( T( 'drive.reloadError' ) );
            }
        }

        //------------------------------------------------------------------------//
        // ACTIONS: NEW FOLDER

        function openNewFolder()
        {
            document.getElementById( 'newFolderName' ).value = '';
            setBackdrop( 'newFolderBackdrop', true );
            document.getElementById( 'newFolderName' ).focus();
        }

        async function confirmNewFolder()
        {
            const name = document.getElementById( 'newFolderName' ).value.trim();
            if( ! name ) return;

            setBackdrop( 'newFolderBackdrop', false );
            setStatus( T( 'drive.creatingFolder' ) );

            try
            {
                await withBusy( GumApi.makeDir( currentFolder, name ) );
                await reload();
            }
            catch( _ )
            {
                NayiveUI.toast( T( 'drive.createFolderFailed' ) );
                setStatus( '' );
            }
        }

        //------------------------------------------------------------------------//
        // ACTIONS: UPLOAD

        // Each upload item is { relPath, file }, where relPath is the path of the
        // file relative to the current folder ('sub/dir/name.ext' for a folder
        // upload, just 'name.ext' for a plain file).

        function onUploadInputChange( e )
        {
            const items = Array.from( e.target.files || [] ).map( function( f ) {
                return { relPath: (f.webkitRelativePath || f.name), file: f };
            } );
            e.target.value = '';
            uploadItems( items );
        }

        function onDrop( e )
        {
            if( dragPaths ) return;                 // an internal move, handled by the folder row
            e.preventDefault();
            document.getElementById( 'listPane' ).classList.remove( 'drag-over' );

            const dt = e.dataTransfer;
            if( ! dt ) return;

            // Prefer the entry API so dropped folders are walked recursively.
            const entries = [];
            if( dt.items && dt.items.length )
            {
                for( let i = 0; i < dt.items.length; i++ )
                {
                    const en = dt.items[i].webkitGetAsEntry && dt.items[i].webkitGetAsEntry();
                    if( en ) entries.push( en );
                }
            }

            if( entries.length )
            {
                setStatus( T( 'drive.readingFolder' ) );
                Promise.all( entries.map( function( en ) { return walkEntry( en, '' ); } ) )
                       .then( function( lists ) { uploadItems( [].concat.apply( [], lists ) ); } )
                       .catch( function() { setStatus( '' ); NayiveUI.toast( T( 'drive.readFolderFailed' ) ); } );
                return;
            }

            const files = Array.from( dt.files || [] );
            if( files.length ) uploadItems( files.map( function( f ) { return { relPath: f.name, file: f }; } ) );
        }

        // Recursively turn a FileSystemEntry into a flat list of { relPath, file }.
        function walkEntry( entry, prefix )
        {
            if( entry.isFile )
            {
                return new Promise( function( resolve, reject ) {
                    entry.file( function( f ) { resolve( [ { relPath: prefix + f.name, file: f } ] ); }, reject );
                } );
            }

            const reader  = entry.createReader();
            const dirPath = prefix + entry.name + '/';
            const all     = [];

            return new Promise( function( resolve, reject ) {
                (function readBatch() {
                    reader.readEntries( function( batch ) {
                        if( ! batch.length )
                        {
                            Promise.all( all.map( function( en ) { return walkEntry( en, dirPath ); } ) )
                                   .then( function( lists ) { resolve( [].concat.apply( [], lists ) ); } )
                                   .catch( reject );
                            return;
                        }
                        for( let i = 0; i < batch.length; i++ ) all.push( batch[i] );
                        readBatch();                       // keep reading: readEntries returns at most ~100 per call
                    }, reject );
                })();
            } );
        }

        // The overwrite-warning dialog resolves this when the user picks an option.
        let replaceResolver = null;

        // Show the "Ya existen" dialog and resolve to 'cancel' | 'skip' | 'overwrite'.
        //   collisions - the upload items whose target file already exists
        //   total      - how many items are in the whole upload
        function askReplace( collisions, total )
        {
            const allCollide = collisions.length === total;

            // One clash gets the singular title; data-i18n keeps it right on a language switch.
            const titleKey = collisions.length === 1 ? 'drive.alreadyExistOne' : 'drive.alreadyExist';
            const titleEl  = document.getElementById( 'replaceTitle' );
            titleEl.setAttribute( 'data-i18n', titleKey );
            titleEl.textContent = T( titleKey );

            document.getElementById( 'replaceMsg' ).textContent = collisions.length === 1
                ? T( 'drive.oneClash' )
                : TF( 'drive.nClashes', { n: collisions.length } );

            const ul = document.getElementById( 'replaceList' );
            ul.innerHTML = '';
            const SHOWN = 12;
            collisions.slice( 0, SHOWN ).forEach( function( it )
            {
                const li    = document.createElement( 'li' );
                const shown = clashName( it ) || it.relPath;   // a twin's name, when it is the twin that clashes
                li.textContent = shown;
                li.title = shown;
                ul.appendChild( li );
            });
            if( collisions.length > SHOWN )
            {
                const li = document.createElement( 'li' );
                li.textContent = TF( 'drive.andNMore', { n: collisions.length - SHOWN } );
                ul.appendChild( li );
            }

            // When every item collides there is nothing to "skip to", so the only
            // meaningful choice is replace-or-cancel: hide the checkbox, force overwrite.
            document.getElementById( 'replaceOptWrap' ).hidden = allCollide;
            document.getElementById( 'replaceOverwrite' ).checked = allCollide;

            const confirmBtn = document.getElementById( 'replaceConfirmBtn' );
            confirmBtn.title = allCollide ? T( 'drive.replace' ) : T( 'drive.continue' );
            confirmBtn.setAttribute( 'aria-label', confirmBtn.title );

            setBackdrop( 'replaceBackdrop', true );

            return new Promise( function( resolve ) { replaceResolver = resolve; } );
        }

        function settleReplace( choice )
        {
            setBackdrop( 'replaceBackdrop', false );
            const r = replaceResolver;
            replaceResolver = null;
            if( r ) r( choice );
        }

        //------------------------------------------------------------------------//
        // UPLOAD: CONVERT TO MP4. A video no browser can play is offered for
        // conversion on the server before it is sent (server/go/convert.go; plan
        // in docs/avi-to-mp4.md). The server queues it, one film at a time, and
        // pushes a notification when it is done; meanwhile the row shows "En
        // cola" / "Convirtiendo… 42 %".

        // Keep the same list as convertExts in server/go/convert.go.
        const CONVERT_EXT = [ 'avi', 'divx', 'wmv', 'asf', 'flv', 'f4v', 'mpg', 'mpeg', 'vob',
                              'ts', 'm2ts', 'mts', '3gp', 'rm', 'rmvb', 'ogm', 'mkv', 'mov' ];

        function isConvertible( path )
        {
            const dot = path.lastIndexOf( '.' );
            return dot > path.lastIndexOf( '/' ) &&
                   CONVERT_EXT.indexOf( path.slice( dot + 1 ).toLowerCase() ) !== -1;
        }

        async function getJson( url )
        {
            try { return JSON.parse( await GumApi.fetchText( url ) ); }
            catch( _ ) { return null; }
        }

        let convertResolver = null;

        // 'convert' | 'plain' | 'cancel'. No dialog at all ('plain') when the
        // server has no ffmpeg: then there is nothing to offer.
        async function askConvert( videos )
        {
            const st = await getJson( '/api/convert' );
            if( ! st || ! st.available ) return 'plain';

            // "te avisaremos" must not be a lie: warn when NO device of this
            // user has notifications on (per user - a phone may have them).
            const push = await getJson( '/api/push' );
            document.getElementById( 'convertNoPush' ).hidden = !! ( push && push.count > 0 );

            const ul = document.getElementById( 'convertList' );
            ul.innerHTML = '';
            const SHOWN = 12;
            videos.slice( 0, SHOWN ).forEach( function( it )
            {
                const li = document.createElement( 'li' );
                li.textContent = it.relPath;
                li.title = it.relPath;
                ul.appendChild( li );
            });
            if( videos.length > SHOWN )
            {
                const li = document.createElement( 'li' );
                li.textContent = TF( 'drive.andNMore', { n: videos.length - SHOWN } );
                ul.appendChild( li );
            }

            setBackdrop( 'convertBackdrop', true );
            return new Promise( function( resolve ) { convertResolver = resolve; } );
        }

        function settleConvert( choice )
        {
            setBackdrop( 'convertBackdrop', false );
            const r = convertResolver;
            convertResolver = null;
            if( r ) r( choice );
        }

        let convertJobs  = new Map();     // path -> { state, percent }: this user's queue
        let convertTimer = null;

        function convertLabel( job )
        {
            return job.state === 'running' ? TF( 'drive.convertRunning', { pct: job.percent || 0 } )
                                           : T( 'drive.convertQueued' );
        }

        // The "En cola" / "Convirtiendo… %" badge at the front of a row's meta.
        // Called by buildListRow and by every poll.
        function paintConvertBadge( row )
        {
            const job   = convertJobs.get( row.dataset.path );
            const meta  = row.querySelector( '.row-meta' );
            let   badge = row.querySelector( '.row-convert' );
            if( ! job || ! meta ) { if( badge ) badge.remove(); return; }
            if( ! badge )
            {
                badge = document.createElement( 'span' );
                badge.className = 'row-convert';
                meta.insertBefore( badge, meta.firstChild );
            }
            badge.textContent = convertLabel( job );
        }

        // Every 5 s while this user has a job. When one ends, the listing is
        // reloaded: the mp4 has appeared and the original gone to the papelera.
        async function pollConvert()
        {
            convertTimer = null;
            const st = await getJson( '/api/convert' );
            if( st )
            {
                const before = convertJobs;
                convertJobs = new Map( ( st.jobs || [] ).map( function( j ) { return [ j.path, j ]; } ) );

                let ended = false;
                before.forEach( function( _, p ) { if( ! convertJobs.has( p ) ) ended = true; } );
                if( ended ) await reload();
                else document.querySelectorAll( '#listing .row[data-path]' ).forEach( paintConvertBadge );
            }
            if( convertJobs.size && ! convertTimer ) convertTimer = setTimeout( pollConvert, 5000 );
        }

        function startConvertPoll()
        {
            if( convertTimer ) clearTimeout( convertTimer );
            convertTimer = setTimeout( pollConvert, 800 );
        }

        //------------------------------------------------------------------------//
        // APP IMPORTS: a .ics / .vcf dropped at the top level of an upload is merged
        // into the Calendar (data/calendar.ics) / Contacts (data/contacts.vcf) file
        // instead of being stored as a plain file in the tree.

        function isAppImport( it )
        {
            if( it.relPath.indexOf( '/' ) !== -1 ) return false;     // part of a folder upload — leave it
            const n = it.relPath.toLowerCase();
            return n.endsWith( '.ics' ) || n.endsWith( '.vcf' );
        }

        async function readTextOrEmpty( path )
        {
            try { return await GumApi.readFile( path ); }
            catch( err )
            {
                if( /\b404\b/.test( String( err && err.message ) ) ) return '';
                throw err;
            }
        }

        // Unfold RFC 5545 / RFC 6350 continuation lines; normalise EOLs to \n.
        function unfoldLines( text )
        {
            return text.replace( /\r\n/g, '\n' ).replace( /\r/g, '\n' ).replace( /\n[ \t]/g, '' );
        }

        // Every top-level BEGIN:<name> … END:<name> block, returned as CRLF strings.
        function extractBlocks( rawText, name )
        {
            const up    = 'BEGIN:' + name.toUpperCase();
            const lines = String( rawText || '' ).replace( /\r\n/g, '\n' ).replace( /\r/g, '\n' ).split( '\n' );
            const out   = [];
            let   buf   = null, depth = 0;

            for( const line of lines )
            {
                const t = line.trim().toUpperCase();

                if( ! buf )
                {
                    if( t === up ) { buf = [ line.trim() ]; depth = 1; }
                    continue;
                }

                buf.push( line.trim() );
                if( t.indexOf( 'BEGIN:' ) === 0 )      depth++;
                else if( t.indexOf( 'END:' ) === 0 )
                {
                    depth--;
                    if( depth === 0 ) { out.push( buf.join( '\r\n' ) ); buf = null; }
                }
            }
            return out;
        }

        // The value of a simple property (UID, TZID) from inside a block.
        function blockProp( block, prop )
        {
            const want = prop.toUpperCase();
            for( const l of unfoldLines( block ).split( '\n' ) )
            {
                const m = l.match( /^([^:;]+)(?:;[^:]*)?:(.*)$/ );
                if( m && m[ 1 ].trim().toUpperCase() === want ) return m[ 2 ].trim();
            }
            return '';
        }

        async function mergeIntoContacts( incomingText )
        {
            const incoming = extractBlocks( incomingText, 'VCARD' );
            if( ! incoming.length ) throw new Error( T( 'drive.noContactsInFile' ) );

            const blocks = extractBlocks( await readTextOrEmpty( 'data/contacts.vcf' ), 'VCARD' );
            const byUid  = new Map();
            blocks.forEach( function( b, i ) { const u = blockProp( b, 'UID' ); if( u ) byUid.set( u, i ); } );

            for( const b of incoming )
            {
                const u = blockProp( b, 'UID' );
                if( u && byUid.has( u ) ) blocks[ byUid.get( u ) ] = b;
                else { blocks.push( b ); if( u ) byUid.set( u, blocks.length - 1 ); }
            }

            await GumApi.writeFileBytes( 'data/contacts.vcf',
                new TextEncoder().encode( blocks.join( '\r\n' ) + '\r\n' ) );
            return incoming.length;
        }

        async function mergeIntoCalendar( incomingText )
        {
            const events = extractBlocks( incomingText, 'VEVENT' );
            const zones  = extractBlocks( incomingText, 'VTIMEZONE' );
            if( ! events.length ) throw new Error( T( 'drive.noEventsInFile' ) );

            let existing = await readTextOrEmpty( 'data/calendar.ics' );
            if( ! /BEGIN:VCALENDAR/i.test( existing ) )
                existing = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Mingle//Personal Calendar//EN\r\nEND:VCALENDAR\r\n';

            const exEvents = extractBlocks( existing, 'VEVENT' );
            const exZones  = extractBlocks( existing, 'VTIMEZONE' );

            const byUid = new Map();
            exEvents.forEach( function( b, i ) { const u = blockProp( b, 'UID' ); if( u ) byUid.set( u, i ); } );
            for( const b of events )
            {
                const u = blockProp( b, 'UID' );
                if( u && byUid.has( u ) ) exEvents[ byUid.get( u ) ] = b;
                else { exEvents.push( b ); if( u ) byUid.set( u, exEvents.length - 1 ); }
            }

            const haveTz = new Set( exZones.map( function( b ) { return blockProp( b, 'TZID' ); } ) );
            for( const b of zones )
            {
                const id = blockProp( b, 'TZID' );
                if( ! haveTz.has( id ) ) { exZones.push( b ); haveTz.add( id ); }
            }

            // Keep the existing VCALENDAR header lines, replace the body.
            const head = [];
            for( const raw of existing.replace( /\r\n/g, '\n' ).replace( /\r/g, '\n' ).split( '\n' ) )
            {
                const t = raw.trim().toUpperCase();
                if( ! t ) continue;
                if( t === 'BEGIN:VCALENDAR' ) { head.push( 'BEGIN:VCALENDAR' ); continue; }
                if( t.indexOf( 'BEGIN:' ) === 0 || t.indexOf( 'END:' ) === 0 ) break;   // body / footer reached
                if( head.length ) head.push( raw.trim() );
            }
            if( ! head.length ) head.push( 'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mingle//Personal Calendar//EN' );

            const out = head.concat( exZones, exEvents, [ 'END:VCALENDAR' ] ).join( '\r\n' ) + '\r\n';
            await GumApi.writeFileBytes( 'data/calendar.ics', new TextEncoder().encode( out ) );
            return events.length;
        }

        async function runAppImports( imports )
        {
            let calEvents = 0, calFiles = 0, conCards = 0, conFiles = 0;
            const failed = [];

            for( const it of imports )
            {
                setStatus( TF( 'drive.importing', { name: it.relPath } ) );
                const isIcs = it.relPath.toLowerCase().endsWith( '.ics' );
                try
                {
                    const text = await it.file.text();
                    if( isIcs ) { calEvents += await mergeIntoCalendar( text ); calFiles++; }
                    else        { conCards  += await mergeIntoContacts( text ); conFiles++; }
                }
                catch( err )
                {
                    failed.push( it.relPath + ( err && err.message ? ' (' + err.message + ')' : '' ) );
                }
            }

            const done = [];
            if( calFiles ) done.push( TF( calEvents === 1 ? 'drive.oneEventTo' : 'drive.nEventsTo', { n: calEvents } ) );
            if( conFiles ) done.push( TF( conCards  === 1 ? 'drive.oneContactTo' : 'drive.nContactsTo', { n: conCards } ) );
            if( done.length ) NayiveUI.toast( TF( 'drive.imported', { what: done.join( T( 'drive.and' ) ) } ) );
            if( failed.length ) NayiveUI.alert( { title: T( 'drive.importFailedTitle' ), body: failed.join( '\n' ) } );
        }

        // "album/foto.HEIC" + "foto.jpg" -> "album/foto.jpg", and never onto a
        // name that is already taken: a photo converted to .jpg lands on a name
        // the collision question at the top of uploadItems never asked about,
        // so it gets "(copia)" instead of overwriting anything.
        // `used` holds the paths this same batch has already written. Like the
        // collision check itself, currentChild() only knows the folder on
        // screen, so inside a dragged-in sub-folder only `used` protects.
        function renameTo( relPath, name, used )
        {
            const i    = relPath.lastIndexOf( '/' );
            const dir  = i < 0 ? '' : relPath.slice( 0, i + 1 );
            // uniqueName() only ever calls taken.has(), so a small object with
            // that one method does the job of a Set here.
            const taken = { has: n => !! currentChild( dir + n ) || used.has( dir + n ) };
            return dir + uniqueName( name, taken );
        }

        // The name an upload would overwrite in the folder on screen: the file
        // itself, or - for a LibreOffice document - its twin. '' when nothing.
        function clashName( it )
        {
            const node = currentChild( it.relPath );
            if( node && ! isDir( node ) ) return it.relPath;
            const twin = officeTwinRel( it.relPath );
            const tn   = twin && currentChild( twin );
            return tn && ! isDir( tn ) ? twin : '';
        }

        async function uploadItems( items )
        {
            if( ! items.length ) return;

            // LibreOffice kinds with no app here (Impress, Draw, Math, Base) are
            // refused, all named in one message; the rest goes on. `notes` are
            // said again in the last message, so a long upload cannot bury them.
            const notes   = [];
            const refused = items.filter( function( it ) { return officeKind( extOf( it.relPath ) ) === 'refuse'; } );
            if( refused.length )
            {
                items = items.filter( function( it ) { return refused.indexOf( it ) === -1; } );
                notes.push( TF( 'drive.officeRefused',
                                { names: refused.map( function( it ) { return it.relPath.split( '/' ).pop(); } ).join( ', ' ) } ) );
                NayiveUI.toast( notes[0], { ms: 6000 } );
                if( ! items.length ) return;
            }

            // Pull out .ics / .vcf files — they go to Calendar / Contacts, not the tree.
            const imports = items.filter( isAppImport );
            if( imports.length )
            {
                items = items.filter( function( it ) { return ! isAppImport( it ); } );
                await runAppImports( imports );
                if( ! items.length ) { setStatus( '' ); await reload(); return; }
            }

            // Warn before overwriting anything that already exists at the destination.
            // A LibreOffice document also lands its twin ("x.odt" -> "x.docx"), so
            // a twin already here is a clash too - see clashName.
            const collisions = items.filter( function( it ) { return !! clashName( it ); } );

            if( collisions.length )
            {
                const choice = await askReplace( collisions, items.length );

                if( choice === 'cancel' ) { setStatus( '' ); return; }

                if( choice === 'skip' )
                {
                    const drop = new Set( collisions );
                    items = items.filter( function( it ) { return ! drop.has( it ); } );
                    if( ! items.length ) { setStatus( '' ); return; }
                }
                // choice === 'overwrite': fall through with every item
            }

            // Videos a browser cannot play (.avi, .wmv, ...): offer to turn them
            // into an .mp4 on the server, BEFORE anything is sent. Never inside a
            // shared folder: the job ends by moving the original to the papelera.
            let toConvert = new Set();
            const inSharedDir = currentFolder === 'shared' || currentFolder.indexOf( 'shared/' ) === 0;
            const videos      = inSharedDir ? [] : items.filter( function( it ) { return isConvertible( it.relPath ); } );
            if( videos.length )
            {
                const choice = await askConvert( videos );
                if( choice === 'cancel' ) { setStatus( '' ); return; }
                if( choice === 'convert' ) toConvert = new Set( videos );
            }
            let converting = 0;
            const toOffice = [];    // LibreOffice documents sent: their twins are made after the upload

            // Quota check: refuse the whole batch up-front if it would not fit.
            // ensureRoom() offers to empty the papelera when that alone would
            // make room. (The server enforces the quota too; this is just a
            // friendlier message before a long upload.)
            let need = 0;
            for( const it of items )
            {
                need += it.file.size;
                if( toConvert.has( it ) ) need += it.file.size;   // the mp4 sits beside it until done
                if( officeTwinRel( it.relPath ) ) need += it.file.size;   // its twin, about as big
                const node = currentChild( it.relPath );
                if( node && ! isDir( node ) && node.size ) need -= node.size;   // overwrite frees the old bytes
            }
            if( ! await NayiveUI.ensureRoom( need ) ) { setStatus( '' ); return; }

            // If this user has a max photo size, images are shrunk to it and
            // turned into JPEG here, in the browser, before being sent.
            const maxPx = await NayivePhoto.limit();
            const used  = new Set();          // paths already written by this batch

            // Create every directory that appears in the item paths, shallow first.
            const dirs = new Set();
            for( const it of items )
            {
                const segs = it.relPath.split( '/' );
                let acc = '';
                for( let i = 0; i < segs.length - 1; i++ )
                {
                    acc = acc ? acc + '/' + segs[i] : segs[i];
                    dirs.add( acc );
                }
            }

            const sorted = Array.from( dirs ).sort( function( a, b ) { return a.split( '/' ).length - b.split( '/' ).length; } );

            for( const d of sorted )
            {
                const segs   = d.split( '/' );
                const name   = segs.pop();
                const parent = joinPath( currentFolder, segs.join( '/' ) );
                setStatus( T( 'drive.creatingFolders' ) );
                try { await withBusy( GumApi.makeDir( parent, name ) ); }
                catch( _ ) { /* already exists — fine */ }
            }

            for( let i = 0; i < items.length; i++ )
            {
                const it = items[i];
                setStatus( TF( 'photos.uploadingN', { i: i + 1, n: items.length } ) );

                try
                {
                    // No limit, or not a photo -> ready.blob IS it.file.
                    const ready   = await NayivePhoto.prepare( it.file, maxPx );
                    const relPath = ready.changed && ready.name !== it.file.name
                                  ? renameTo( it.relPath, ready.name, used )
                                  : it.relPath;
                    used.add( relPath );
                    const path    = joinPath( currentFolder, relPath );

                    // Send the Blob itself: the browser streams it from disk.
                    // Reading it into memory first crashed the tab on big files.
                    const conv = toConvert.has( it );
                    await withBusy( GumApi.writeFileBytes( path, ready.blob, conv ? { convert: 'mp4' } : null ) );
                    if( conv ) converting++;
                    if( officeTwinRel( relPath ) ) toOffice.push( { path: path, name: relPath.split( '/' ).pop() } );
                }
                catch( err )
                {
                    if( String( err && err.message ).indexOf( '507' ) >= 0 )
                    {
                        NayiveUI.toast( TF( 'drive.uploadQuota', { name: it.relPath } ) );
                        break;
                    }
                    NayiveUI.toast( TF( 'drive.uploadFailed', { name: it.relPath } ) );
                }
            }

            // LibreOffice documents: now their Microsoft Office twins, beside
            // them - one at a time, as the server does them anyway.
            if( toOffice.length )
            {
                NayiveUI.toast( T( 'drive.officeStart' ), { ms: 4000 } );
                const done = [], failed = [];
                let   off  = false;
                for( let i = 0; i < toOffice.length && ! off; i++ )
                {
                    setStatus( TF( 'drive.officeConvertingN', { i: i + 1, n: toOffice.length } ) );
                    try { await officeTwin( toOffice[i].path, true ); done.push( toOffice[i].name ); }
                    catch( err )
                    {
                        if( String( err && err.message ).indexOf( '503' ) >= 0 ) off = true;   // no LibreOffice: none will
                        else failed.push( toOffice[i].name );
                    }
                }
                if( off )                  notes.push( T( 'drive.officeOffUpload' ) );
                else if( failed.length )   notes.push( TF( 'drive.officeFailedN', { names: failed.join( ', ' ) } ) );
                else if( done.length > 1 ) notes.push( TF( 'drive.officeConvertedN', { n: done.length } ) );
                else                       notes.push( TF( 'drive.officeConverted', { name: officeTwinRel( done[0] ) } ) );
            }

            setStatus( '' );
            await reload();
            // Ask the server rather than trust the count: it may have refused to
            // queue (ffmpeg gone meanwhile), and the PUT's answer is not read.
            if( converting )
            {
                const st = await getJson( '/api/convert' );
                if( st && st.jobs && st.jobs.length )
                {
                    if( notes.length ) notes.push( T( 'drive.convertStarted' ) );
                    else               NayiveUI.toast( T( 'drive.convertStarted' ) );
                    startConvertPoll();
                }
            }
            // One message with all of it: a toast replaces the one before.
            if( notes.length ) NayiveUI.toast( notes.join( ' ' ), { ms: 4000 + 2000 * notes.length } );
        }

        //------------------------------------------------------------------------//
        // ACTIONS: RENAME

        function openRename()
        {
            const targets = actionTargets();
            if( targets.length !== 1 ) return;

            const path = targets[0];
            document.getElementById( 'renameName' ).value = path.split( '/' ).pop();
            setBackdrop( 'renameBackdrop', true );
            document.getElementById( 'renameName' ).focus();
        }

        async function confirmRename()
        {
            const targets = actionTargets();
            if( targets.length !== 1 ) return;

            const oldPath = targets[0];
            const newName = document.getElementById( 'renameName' ).value.trim();
            if( ! newName ) return;

            setBackdrop( 'renameBackdrop', false );
            setStatus( T( 'drive.renaming' ) );

            const parent  = oldPath.includes( '/' ) ? oldPath.slice( 0, oldPath.lastIndexOf( '/' ) ) : '';
            const newPath = joinPath( parent, newName );

            // The server refuses to rename onto an existing item (it would be
            // destroyed with no trip through the papelera). Offer to move the
            // one in the way to the papelera first.
            if( newPath !== oldPath && rowNode( newPath ) )
            {
                if( ! await NayiveUI.confirm( {
                    title: T( 'drive.nameExistsTitle' ),
