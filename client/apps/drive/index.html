<!-- index.html - Personal file explorer (multi-user; talks to the server's
     /api/files endpoints: tree, read/write, mkdir, rename/move, trash).

     A move / rename / copy / delete here also keeps the media apps' path-keyed
     sidecars in step so they never drift: the photo comments
     (data/photos/comments.json) and the Photos + Music scan caches
     (data/<app>/scan-cache.json). Drive only says WHAT moved - the files
     themselves belong to those apps, so the upkeep lives in shared/media.js:
     NayiveMedia.remapPaths() / .copyPaths() / .purgePaths(). -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Drive</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='12' cy='5' rx='9' ry='3'%3E%3C/ellipse%3E%3Cpath d='M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3'%3E%3C/path%3E%3Cpath d='M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5'%3E%3C/path%3E%3C/svg%3E">

    <!-- Shared colour scheme (dark default, opt-in light). The choice is shared by every app; set it from the launcher's "Esquemas de color" dialog. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>

    <!-- Vendored libs (all pinned, no build step). -->
    <script src="lib/zipjs_v2.8.60.min.js"></script>

    <!-- Gum file-API helpers: HMAC signing, the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/photo.js" defer></script>
    <!-- The media apps' own module. Drive uses one block of it: the upkeep of
         their path-keyed sidecars when a file is moved, renamed, copied or
         trashed. Deferred is fine here (this page's script is a module and
         calls NayiveMedia only after DOMContentLoaded); the media apps
         themselves must NOT defer it. -->
    <script src="../shared/media.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'drive',
            title: 'Drive',
            lead:  NayiveUI.t( 'drive.introLead' ),
            buttons: [
                { sel: '#searchToggleBtn', text: NayiveUI.t( 'drive.introSearch' ) },
                { sel: '#newFolderBtn',    text: NayiveUI.t( 'drive.introNewFolder' ) },
                { sel: '#uploadBtn',       text: NayiveUI.t( 'drive.introUpload' ) },
                { sel: '#downloadBtn',     text: NayiveUI.t( 'drive.introDownload' ) },
                { sel: '#renameBtn',       text: NayiveUI.t( 'drive.introRename' ) },
                { sel: '#moveToBtn',       text: NayiveUI.t( 'drive.introMove' ) },
                { sel: '#copyToBtn',       text: NayiveUI.t( 'drive.introCopy' ) },
                { sel: '#copyLinkBtn',     text: NayiveUI.t( 'drive.introLink' ) },
                { sel: '#shareBtn',        text: NayiveUI.t( 'drive.introShare' ) },
                { sel: '#deleteBtn',       text: NayiveUI.t( 'drive.introTrash' ) },
                { sel: '#trashViewBtn',    text: NayiveUI.t( 'drive.introOpenTrash' ) },
                { sel: '#moreBtn',         text: NayiveUI.t( 'drive.introMore' ) },
                { sel: '#syncIndicator', name: NayiveUI.t( 'ui.syncName' ),
                  text: NayiveUI.t( 'drive.introSync' ) }
            ]
        } );
    } );
    </script>

    <style>
        /* Base reset, .app shell, .topbar, .icon-btn, .sheet, .field and the
           input look all come from ../shared/app.css. Drive overrides the page
           scroll (both axes hidden - the tree / list panes scroll themselves)
           and adds its file-browser chrome. */
        html, body { height: 100%; overflow: hidden; }

        .topbar h1 { margin: 0; }                    /* the .brand wrapper owns the right-hand gap */

        /* Brand block: the icon + "Drive", with the server-HD gauge sitting under
           both. The gauge bar is as wide as (icon + gap + name) and only shows on
           PC / tablet - it is hidden in the ≤640px phone layout below. */
        .brand { display: inline-flex; flex-direction: column; align-items: stretch; flex: 0 0 auto; margin-right: 10px; }
        .brand-row { display: flex; align-items: center; }
        .disk-bar { height: 7px; margin-top: 3px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
        .disk-bar > i { display: block; height: 100%; width: 0; border-radius: 1px; background: var(--disk-fill, var(--ok)); transition: width .3s ease, background-color .3s ease; }
        /* Nearly full with something in the papelera: the bar becomes a button
           that empties it (see offerEmptyTrash). */
        .disk-bar--offer { cursor: pointer; box-shadow: 0 0 0 2px color-mix( in srgb, var(--danger) 35%, transparent ); }
        .topbar .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--line); flex: 0 0 auto; }
        .status-label { flex: 1 1 auto; min-width: 0; font-size: 0.85rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; text-align: right; }

        /* Look from app.css (FORM FIELD); only the width is Drive's. */
        .topbar-search { flex: 0 0 auto; width: 190px; }

        /* Body: tree + listing */
        .body-row { flex: 1 1 auto; min-height: 0; display: flex; }

        .tree-pane
        {
            width: var(--tree-w, 250px); flex: 0 0 auto; overflow: auto;
            padding: 8px 4px;
        }
        /* The inner tree grows to its widest row so .tree-pane can scroll it sideways. */
        #treePane > .tree-node { min-width: max-content; }

        /* Drag handle between the tree and the file list (desktop only). */
        .pane-resizer
        {
            flex: 0 0 auto; width: 5px; cursor: col-resize; background: var(--line);
            touch-action: none;
        }
        .pane-resizer:hover, .pane-resizer.dragging { background: var(--accent); }

        .tree-node .tree-row
        {
            display: flex; align-items: center; gap: 4px; padding: 6px 6px; border-radius: 6px;
            cursor: pointer; font-size: 0.87rem; white-space: nowrap; user-select: none;
        }
        .tree-node .tree-row:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
        .tree-node .tree-row.selected { background: var(--accent); color: var(--on-accent); }
        .tree-node .tree-row.selected .tree-name { color: var(--on-accent); }
        .tree-node .tree-row .twisty { width: 14px; height: 14px; flex: 0 0 auto; color: var(--text-dim); transition: transform .12s ease; }
        .tree-node .tree-row.selected .twisty { color: var(--on-accent); }
        .tree-node .tree-row .twisty.open { transform: rotate(90deg); }
        .tree-node .tree-row .twisty.leaf { visibility: hidden; }
        .tree-node .tree-row svg.folder-ic { flex: 0 0 auto; }
        .tree-node .tree-name { flex: 0 0 auto; white-space: nowrap; }
        .tree-children { margin-left: 16px; display: none; }
        .tree-children.open { display: block; }
        /* ⋮ actions button on a folder row — a shared .icon-btn.sm, shown on touch
           only (see the phone @media). The selected row is accent-filled, so there
           its glyph takes --on-accent. */
        .tree-node .tree-row .row-menu { display: none; margin-left: auto; }
        .tree-node .tree-row.selected .row-menu { color: var(--on-accent); }

        /* Right pane */
        .list-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

        .breadcrumb { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.85rem; flex: 0 0 auto; }
        .breadcrumb .crumb { color: var(--text-dim); cursor: pointer; padding: 3px 5px; border-radius: 5px; }
        .breadcrumb .crumb:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
        .breadcrumb .crumb.current { color: var(--text); font-weight: 600; cursor: default; }
        .breadcrumb .crumb.current:hover { background: none; }
        .breadcrumb .crumb-sep { color: var(--text-dim); padding: 0 1px; }

        .listing { flex: 1 1 auto; overflow: auto; padding: 4px 0; }
        /* Wrapper around the rows: as wide as the widest row, so .listing scrolls it
           sideways while each row's border / hover still spans the full width. */
        .list-rows { min-width: 100%; width: max-content; }
        .empty-hint { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

        .row
        {
            display: flex; align-items: center; gap: 10px; padding: 9px 14px;
            border-bottom: 1px solid color-mix(in srgb, var(--text) 6%, transparent); cursor: pointer;
        }
        .row:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
        .row.selected { background: color-mix(in srgb, var(--accent) 22%, transparent); }
        .row .row-menu { display: none; }   /* a shared .icon-btn.sm, shown on touch only (phone @media) */
        .row .row-ic { flex: 0 0 auto; color: var(--text-dim); }
        /* File-type icon colours. The dark set is pastel for the dark ground; the
           light set is deepened so it stays legible on the grey light background. */
        .row .row-ic.ic-doc   { color: #5b8def; }   /* Write document (.docx, .md)  */
        .row .row-ic.ic-sheet { color: var(--accent); }  /* Calc spreadsheet (.xlsx, .csv) */
        .row .row-ic.ic-pdf   { color: #d9903c; }   /* PDF (amber — red reads as "error") */
        .row .row-ic.ic-code  { color: #b98ae6; }   /* Text editor (.html, .css, .js, .json, .txt…) */
        .row .row-ic.ic-image { color: #d16ba5; }   /* Image, opened in Drive's built-in viewer */
        .row .row-ic.ic-media { color: #4bb8a9; }   /* Audio / video, opened in Drive's built-in player */
        /* "Compartido conmigo": a shared album / trip shows its APP's glyph in
           place of the plain folder icon, so you see what opens it. */
        .row .row-ic.ic-photos { color: #d16ba5; }  /* a shared album, opens in Photos */
        .row .row-ic.ic-trips  { color: #4bb8a9; }  /* a shared trip,  opens in Trips  */

        :root[data-theme="light"] .row .row-ic.ic-doc    { color: #1E4A85; }
        :root[data-theme="light"] .row .row-ic.ic-pdf    { color: #6F430F; }
        :root[data-theme="light"] .row .row-ic.ic-code   { color: #5A3A8C; }
        :root[data-theme="light"] .row .row-ic.ic-image  { color: #8A3466; }
        :root[data-theme="light"] .row .row-ic.ic-media  { color: #1F6F63; }
        :root[data-theme="light"] .row .row-ic.ic-photos { color: #8A3466; }
        :root[data-theme="light"] .row .row-ic.ic-trips  { color: #1F6F63; }
        .row .row-name { flex: 0 0 auto; white-space: nowrap; font-size: 0.92rem; }
        /* size · date sit at the right edge; margin-left:auto eats the gap so they
           line up in a column. On a row wider than the pane (very long name) the
           auto margin collapses and the meta just follows the name, scrolled off. */
        .row .row-meta { flex: 0 0 auto; margin-left: auto; padding-left: 16px; white-space: nowrap; font-size: 0.78rem; color: var(--text-dim); }

        .list-pane { position: relative; }

        /* Drop cover: shown over the whole listing while files are dragged in from
           the desktop. Its own blue hue, so it never reads as a selection (--accent).
           The label is the same blue, darkened, so it stays legible on the tint.
           A real element, not ::after -- CSS `content` cannot hold an i18n string. */
        .list-pane
        {
            --drop:      #7FB3E8;                                  /* dark theme: light blue, so the tint reads on a dark ground */
            --drop-text: color-mix(in srgb, var(--drop) 25%, #000);
        }
        :root[data-theme="light"] .list-pane
        {
            --drop:      #3B82D6;                                  /* light theme: a plain blue */
            --drop-text: color-mix(in srgb, var(--drop) 25%, #000);
        }
        .drop-cover
        {
            display: none; position: absolute; inset: 0; z-index: 5;
            align-items: center; justify-content: center;
            /* 72%: the rows still show through, but the tint carries enough of the
               blue that the darker blue label stays legible in both themes. */
            background: color-mix(in srgb, var(--drop) 72%, transparent);
            border: 2px dashed var(--drop-text);
            color: var(--drop-text); font-size: 1.05rem; font-weight: 700;
            pointer-events: none;
        }
        .list-pane.drag-over .drop-cover { display: flex; }

        /* Internal drag-and-drop: move files / folders onto a folder */
        .row.dragging, .tree-row.dragging { opacity: 0.4; }
        .row.drop-target
        {
            background: color-mix(in srgb, var(--accent) 30%, transparent);
            outline: 2px solid var(--accent); outline-offset: -2px;
        }
        .tree-row.drop-target
        {
            background: color-mix(in srgb, var(--accent) 30%, transparent);
            outline: 2px solid var(--accent); outline-offset: -2px;
        }

        /* Keyboard navigation: arrow keys move a cursor, Left/Right swap panes */
        .tree-node .tree-row.kbd:not(.selected)
        {
            background: color-mix(in srgb, var(--accent) 22%, transparent);
            box-shadow: inset 2px 0 0 var(--accent);
        }
        body.kbd-tree .tree-pane, body.kbd-list .list-pane { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }

        /* Dialogs: .sheet-backdrop / .sheet / .field / inputs from app.css. */
        .sheet p { font-size: 0.9rem; color: var(--text-dim); margin: 0 0 14px; }

        /* Upload dialog: big "pick with a dialog" icon choices.
           Desktop  -> Archivos + Carpeta.
           Phone / tablet (no hover, coarse pointer) -> Fotos + Archivos: "Fotos" jumps
           straight to the image gallery, and "Carpeta" (webkitdirectory) does nothing
           on iOS Safari so it would be a dead button there. */
        .upload-choices { display: flex; flex-wrap: wrap; gap: 12px; }
        .upload-choice
        {
            flex: 1 1 0; min-width: 90px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 18px 10px; border-radius: var(--radius-m); border: 1px solid var(--line);
            background: var(--card2); color: var(--text); font-size: 0.9rem; font-family: inherit; cursor: pointer;
        }
        .upload-choice:hover { background: color-mix(in srgb, var(--accent) 14%, var(--card2)); border-color: var(--accent); }
        .upload-choice:focus { outline: none; }
        .upload-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .upload-choice svg { color: var(--accent); }
        .upload-choice-photos { display: none; }                       /* desktop: no "Fotos" tile */
        @media (hover: none) and (pointer: coarse)
        {
            .upload-choice-photos { display: flex; }                   /* phone / tablet: show it */
            .upload-choice-dir    { display: none; }                   /* …and drop the folder picker */
        }
        .upload-note
        {
            margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line);
            font-size: 0.82rem; color: var(--text-dim); line-height: 1.45;
        }
        .upload-note b { color: var(--text); font-weight: 600; }

        /* "Abrir con" dialog: six app tiles, so they may take two rows.
           .upload-choice is display:flex, which beats the browser's own [hidden]
           rule — the apps openWithDialog leaves out must be told again. */
        .open-with-apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }  /* tiles fill the row: equal margins */
        .open-with-apps .upload-choice[hidden] { display: none; }

        /* "Ya existen" (overwrite warning) dialog */
        .replace-list
        {
            margin: 0 0 14px; padding: 8px 10px; list-style: none;
            max-height: 30vh; overflow-y: auto;
            background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-s);
            font-size: 0.85rem; color: var(--text-dim);
        }
        .replace-list li { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .replace-opt { display: flex; align-items: flex-start; gap: 8px; font-size: 0.88rem; color: var(--text); cursor: pointer; margin-bottom: 4px; }
        .replace-opt input { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
        .convert-nopush { font-size: 0.88rem; }
        .link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--link); text-decoration: underline; cursor: pointer; }
        .row-convert { color: var(--accent); font-weight: 600; margin-right: 6px; }
        .replace-opt[hidden] { display: none; }   /* class selector would otherwise beat [hidden]'s UA style */

        /* Built-in image viewer (lightbox — view only, no editing).
           Always a dark overlay, so its own colours are fixed and do not follow the theme. */
        .viewer-backdrop
        {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
        }
        .viewer-backdrop.open { display: flex; }
        .viewer-backdrop img
        {
            max-width: 100%; max-height: calc(100% - 40px); object-fit: contain;
            border-radius: 4px; background: #202124;
        }
        .viewer-name
        {
            margin-top: 14px; max-width: 100%; font-size: 0.85rem; color: rgba(255, 255, 255, 0.7);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .viewer-close { position: absolute; top: 14px; right: 16px; }   /* the look is the shared .editor-btn */

        /* Built-in audio / video viewer (same dark overlay as the image lightbox).
           The media element keeps the browser's own controls; clicking the dark
           area around it (not the player) or the ✕ closes. */
        .media-backdrop
        {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
        }
        .media-backdrop.open { display: flex; }
        .media-backdrop video
        {
            max-width: 100%; max-height: calc(100% - 40px);
            border-radius: 4px; background: #000;
        }
        .media-backdrop .media-audio-box
        {
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            padding: 34px 30px; border-radius: 14px; background: #202124;
        }
        /* class selectors would otherwise beat the UA [hidden] rule */
        .media-backdrop video[hidden], .media-backdrop .media-audio-box[hidden] { display: none; }
        .media-backdrop .media-audio-box svg { color: rgba(255, 255, 255, 0.5); }
        .media-backdrop audio { width: min(78vw, 420px); }

        /* Built-in image editor (TOAST UI Image Editor, loaded on demand). Full-screen,
           always dark — like the lightbox its colours are fixed and do not follow the theme.
           Used only for the formats the library can re-encode (png / jpg / webp); every
           other image type still opens in the plain lightbox above. */
        /* The chrome itself is the shared IMAGE EDITOR block in shared/app.css
           (Photos opens the same editor). Only the layer it sits on is Drive's:
           over the folder sheet (95) and UNDER the dialogs (.sheet-backdrop, 100)
           — "Guardar copia" and the unsaved-changes question both open FROM the
           editor, so they have to land on top of it. Nothing else can be open
           behind it: a file is opened from a listing row, never from the tree
           sheet, a dialog or a context menu. */
        .editor-backdrop { z-index: 99; }

        /* Indeterminate progress dialog (shown while Drive builds a ZIP) */
        .progress-sheet { max-width: 320px; text-align: center; }
        .progress-track
        {
            position: relative; height: 6px; margin-top: 2px; overflow: hidden;
            border-radius: 3px; background: color-mix(in srgb, var(--text) 12%, transparent);
        }
        .progress-track::before
        {
            content: ''; position: absolute; top: 0; bottom: 0; width: 40%;
            border-radius: 3px; background: var(--accent);
            animation: progress-slide 1.1s ease-in-out infinite;
        }
        @keyframes progress-slide
        {
            0%   { left: -40%; }
            100% { left: 100%; }
        }

        /* Context menu on a listing row (desktop right-click; touch: the row's ⋮ button).
           The look is the shared .top-menu / .menu-item; .ctx-menu only adds the
           closed state (openCtxMenu adds .open) and the greyed-out rows. */
        .ctx-menu { display: none; }
        .ctx-menu.open { display: flex; }
        .ctx-menu .menu-item[hidden] { display: none; }   /* .menu-item's display would otherwise beat [hidden]'s UA style */
        .ctx-menu .menu-item:disabled { opacity: 0.34; cursor: default; background: none; }

        /* Folder chooser (Mover a… / Copiar a…) */
        .tree-picker
        {
            max-height: 46vh; overflow-y: auto; overflow-x: hidden;
            border: 1px solid var(--line); border-radius: var(--radius-s); padding: 6px 4px; margin-bottom: 14px;
        }
        .tree-picker .tree-row.bad { opacity: 0.32; cursor: default; }
        .tree-picker .tree-row.bad:hover { background: none; }

        /* Properties dialog: a label / value grid. The dimmed label reads like a
           .field label (app.css); the exact byte count goes under its own value
           in small type, the way every file manager writes it. */
        .props
        {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 16px;
            margin: 0 0 14px;
            font-size: 0.9rem;
        }
        .props dt { color: var(--text-dim); }
        .props dd { margin: 0; overflow-wrap: anywhere; }
        .props dd .props-sub { display: block; font-size: 0.8rem; color: var(--text-dim); }

        /* Trash view ("Papelera"). A flat listing of trashed items; the file-tree
           toolbar buttons are hidden while it is open. */
        #moreBtn { display: none; }   /* phone only — see B6b in the phone block */
        body.trash-mode .topbar-search,
        body.trash-mode #searchToggleBtn,
        body.trash-mode #newFolderBtn, body.trash-mode #uploadBtn,
        body.trash-mode #renameBtn,  body.trash-mode #moveToBtn,
        body.trash-mode #copyToBtn,  body.trash-mode #copyLinkBtn,
        body.trash-mode #downloadBtn, body.trash-mode #deleteBtn,
        body.trash-mode .topbar .sep,
        body.trash-mode .tree-pane { display: none; }

        .trash-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .trash-bar .trash-title { font-weight: 600; margin-right: auto; }
        .trash-bar .trash-days { display: flex; align-items: center; gap: 6px; color: var(--muted, var(--text)); font-size: .9em; }
        /* 5em, not 3.5em: the shared 10px side padding plus the spinner arrows ate
           all but one digit, so "30" read as "3" */
        .trash-bar .trash-days input { width: 5em; padding-inline: 8px 4px; text-align: center; }
        /* Every button in the bar is a shared one: "←" an .icon-btn, "Vaciar
           papelera" a .text-btn.ghost.danger, the days hint an .info-dot. */
        .trash-bar .info-dot svg { width: 19px; height: 19px; }

        /* Restore / delete-forever: two shared .icon-btn.sm (the second .danger) */
        .row .row-trash-actions { display: flex; gap: 6px; flex: 0 0 auto; }

        /* --- Responsive: phone layout (≤640px). New elements below are hidden here
               and only revealed inside the @media block, so desktop is untouched. --- */
        #searchToggleBtn { display: none; }
        .tree-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 90; display: none; }

        @media (max-width: 640px)
        {
            /* B1 — keep the app name (it is how you know where you are, and
               tapping it goes home); hide only the HD gauge and tighten the bar.
               The name is a touch smaller here so the button row still fits. */
            .topbar h1 { font-size: 1rem; margin-right: 6px; white-space: nowrap; }
            .brand { margin-right: 2px; }
            .disk-bar { display: none; }
            .topbar .sep { display: none; }
            .topbar { gap: 2px; padding: 6px 6px; }

            /* B2 — search collapses behind a magnifier button */
            #searchToggleBtn { display: flex; }
            .topbar-search { display: none; }
            .topbar.searching .topbar-search { display: block; flex: 1 1 auto; width: auto; min-width: 0; }

            /* B4 — the folder tree becomes a slide-in sheet */
            .tree-pane
            {
                position: fixed; top: 0; bottom: 0; left: 0; z-index: 95;
                width: 82vw; max-width: 300px; background: var(--bg);
                transform: translateX(-100%); transition: transform .18s ease;
                box-shadow: 0 0 32px rgba(0,0,0,0.45); padding-top: 12px;
            }
            .tree-pane.open { transform: translateX(0); }
            .tree-backdrop.open { display: block; }
            .tree-node .tree-row { padding: 9px 8px; }

            .breadcrumb .crumb-root
            {
                border: 1px solid var(--line); background: var(--card2);
                border-radius: 6px; padding: 5px 9px; color: var(--text); font-weight: 600;
            }
            .breadcrumb .crumb-root::after { content: " ▾"; color: var(--text-dim); }

            /* B6 — per-file actions come from the row's ⋮ menu; keep Download */
            #renameBtn, #moveToBtn, #copyToBtn, #copyLinkBtn, #deleteBtn { display: none; }

            /* B6b — of what is left, the ones a phone reaches for LEAST move
               into the header's own "⋮" (#topMenu, built in wireTopMenu from
               these very buttons). Compartir is here because it is the one
               per-file action the row menu does not carry; la papelera is
               once-in-a-while. What stays is what you came to Drive to do:
               buscar, nueva carpeta, subir, descargar — six buttons, one row,
               even with something selected. */
            #shareBtn, #trashViewBtn { display: none; }
            #moreBtn { display: flex; }

            /* B7 — roomier rows, ⋮ action button, no size/date column */
            .row { padding: 11px 12px 11px 6px; gap: 8px; }
            .row .row-menu { display: flex; }
            .tree-node .tree-row .row-menu { display: flex; }
            .row .row-meta { display: none; }
            .breadcrumb { padding: 8px 10px; }
            .breadcrumb .crumb { padding: 5px 6px; }

            /* B8 — no sideways scrolling on a phone: names truncate as before. */
            .pane-resizer { display: none; }
            .tree-pane { overflow-x: hidden; }
            #treePane > .tree-node { min-width: 0; }
            .tree-node .tree-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
            .listing { overflow-x: hidden; }
            .list-rows { width: auto; min-width: 0; }
            .row .row-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <div class="brand">
                <div class="brand-row">
                    <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path></svg>
                    <h1>Drive</h1>
                </div>
                <div id="diskBar" class="disk-bar" hidden data-i18n-attr="title:drive.diskUse"><i></i></div>
            </div>

            <input type="search" id="searchInput" class="topbar-search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:drive.searchPh, title:drive.searchTip">
            <button id="searchToggleBtn" class="icon-btn" data-i18n-attr="title:ui.search">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>

            <div class="sep"></div>

            <button id="newFolderBtn" class="icon-btn" data-i18n-attr="title:ui.newFolder">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
            </button>
            <button id="uploadBtn" class="icon-btn" data-i18n-attr="title:drive.uploadTip">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>
            <input type="file" id="uploadInput" multiple style="display:none">
            <input type="file" id="uploadDirInput" webkitdirectory multiple style="display:none">
            <input type="file" id="uploadPhotoInput" accept="image/*" multiple style="display:none">
            <button id="downloadBtn" class="icon-btn" disabled data-i18n-attr="title:drive.downloadFolderOrSel">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>

            <div class="sep"></div>

            <button id="renameBtn" class="icon-btn" disabled data-i18n-attr="title:ui.rename">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
            <button id="moveToBtn" class="icon-btn" data-i18n-attr="title:drive.moveToDots" disabled>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H2"></path><path d="M2 13h11"></path><path d="m10 16 3-3-3-3"></path></svg>
            </button>
            <button id="copyToBtn" class="icon-btn" data-i18n-attr="title:drive.copyToDots" disabled>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button id="copyLinkBtn" class="icon-btn" data-i18n-attr="title:drive.copyLink" disabled>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            </button>
            <button id="shareBtn" class="icon-btn" disabled data-i18n-attr="title:drive.shareWith">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>
            </button>
            <button id="deleteBtn" class="icon-btn danger" disabled data-i18n-attr="title:ui.toTrash">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>

            <span id="statusLabel" class="status-label"></span>

            <button id="trashViewBtn" class="icon-btn" data-i18n-attr="title:acct.trash">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <!-- Phone only: the buttons above that a phone reaches for least
                 (see B6b in the phone block). Its entries are cloned from them. -->
            <button id="moreBtn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-attr="title:ui.moreOptions, aria-label:ui.moreOptions">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>
            </button>
            <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </button>
            <button id="syncIndicator" class="sync-indicator synced" type="button" data-i18n-attr="title:ui.synced"></button>
        </div>

        <div class="body-row">
            <div id="treeBackdrop" class="tree-backdrop"></div>
            <div id="treePane" class="tree-pane"></div>
            <div id="paneResizer" class="pane-resizer" data-i18n-attr="title:drive.dragWidth"></div>

            <div id="listPane" class="list-pane">
                <div id="breadcrumb" class="breadcrumb"></div>
                <div id="listing" class="listing"></div>
                <div id="dropCover" class="drop-cover"><span data-i18n="drive.dropHere"></span></div>
            </div>
        </div>

    </div>

    <!-- Per-item menu: desktop right-click, or the row's ⋮ button (touch). Acts on the selection. -->
    <!-- The header's "⋮" (phone). Same component as the row menus below; its
         entries are built in JS from the toolbar buttons they stand for. -->
    <div id="topMenu" class="ctx-menu top-menu"></div>

    <div id="ctxMenu" class="ctx-menu top-menu">
        <button class="menu-item" id="ctxOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg><span data-i18n="drive.open"></span></button>
        <button class="menu-item" id="ctxDownload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span data-i18n="ui.download"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="ctxCut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg><span data-i18n="ui.cut"></span></button>
        <button class="menu-item" id="ctxClip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg><span data-i18n="ui.copy"></span></button>
        <button class="menu-item" id="ctxMove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H2"></path><path d="M2 13h11"></path><path d="m10 16 3-3-3-3"></path></svg><span data-i18n="drive.moveToDots"></span></button>
        <button class="menu-item" id="ctxCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span data-i18n="drive.copyToDots"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="ctxRename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg><span data-i18n="ui.rename"></span></button>
        <button class="menu-item" id="ctxLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><span data-i18n="drive.copyLink"></span></button>
        <button class="menu-item" id="ctxProps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg><span data-i18n="drive.properties"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item danger" id="ctxDelete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span data-i18n="ui.toTrash"></span></button>
    </div>

    <!-- Desktop right-click on empty space in the listing -->
    <div id="ctxAreaMenu" class="ctx-menu top-menu">
        <button class="menu-item" id="ctxAreaNewFolder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg><span data-i18n="ui.newFolder"></span></button>
        <button class="menu-item" id="ctxAreaPaste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14l2 2 4-4"></path></svg><span data-i18n="ui.paste"></span></button>
    </div>

    <!-- Folder chooser: destination for "Mover a…" / "Copiar a…" -->
    <div id="pickFolderBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="pickFolderTitle" data-i18n="drive.moveTo"></h2>
            <p id="pickFolderMsg"></p>
            <div id="pickFolderTree" class="tree-picker"></div>
            <div class="sheet-actions">
                <button id="pickFolderCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="pickFolderConfirmBtn" data-act="primary" data-i18n-attr="title:drive.move"></button>
            </div>
        </div>
    </div>

    <!-- Upload dialog: drop hint + pick-with-a-dialog choices (file / folder) -->
    <div id="uploadBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="ui.upload"></h2>
            <p><span data-i18n="drive.dragDropHint"></span><br><span data-i18n="drive.orPickBelow"></span></p>
            <div class="upload-choices">
                <button id="uploadPickPhotosBtn" class="upload-choice upload-choice-photos">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-4.5-4.5L3 21"></path></svg>
                    <span data-i18n="trips.photos"></span>
                </button>
                <button id="uploadPickFilesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <span data-i18n="ui.filesRoot"></span>
                </button>
                <button id="uploadPickDirBtn" class="upload-choice upload-choice-dir">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="drive.folder"></span>
                </button>
            </div>
            <p class="upload-note" data-i18n="drive.uploadNote"></p>
            <div class="sheet-actions">
                <button id="uploadCancelBtn" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- New folder dialog -->
    <div id="newFolderBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="ui.newFolder"></h2>
            <div class="field">
                <input type="text" id="newFolderName" autocomplete="off" data-i18n-attr="placeholder:drive.folderNamePh">
            </div>
            <div class="sheet-actions">
                <button id="newFolderCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="newFolderConfirmBtn" data-act="primary" data-i18n-attr="title:drive.create"></button>
            </div>
        </div>
    </div>

    <!-- Rename dialog -->
    <div id="renameBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="ui.rename"></h2>
            <div class="field">
                <input type="text" id="renameName" autocomplete="off" data-i18n-attr="aria-label:drive.newName">
            </div>
            <div class="sheet-actions">
                <button id="renameCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="renameConfirmBtn" data-act="primary" data-i18n-attr="title:ui.rename"></button>
            </div>
        </div>
    </div>

    <!-- Properties dialog (right-click -> "Propiedades"). Read-only: one close button. -->
    <div id="propsBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="drive.properties"></h2>
            <dl id="propsBody" class="props"></dl>
            <div class="sheet-actions">
                <button id="propsCloseBtn" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Move-to-trash confirm dialog -->
    <div id="deleteBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="ui.toTrash"></h2>
            <p id="deleteMsg"></p>
            <p id="deleteFolderWarn" style="text-transform:uppercase;font-weight:700" hidden></p>
            <div class="sheet-actions">
                <button id="deleteCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="deleteConfirmBtn" data-act="primary:trash" data-i18n-attr="title:ui.toTrash"></button>
            </div>
        </div>
    </div>

    <!-- Upload: warn before overwriting files that already exist at the destination -->
    <div id="replaceBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="replaceTitle" data-i18n="drive.alreadyExist"></h2>
            <p id="replaceMsg"></p>
            <ul id="replaceList" class="replace-list"></ul>
            <label id="replaceOptWrap" class="replace-opt">
                <input type="checkbox" id="replaceOverwrite">
                <span data-i18n="drive.replaceExisting"></span>
            </label>
            <div class="sheet-actions">
                <button id="replaceCancelBtn"  data-act="close" data-i18n-attr="title:ui.cancel"></button>
                <button id="replaceConfirmBtn" data-act="primary" data-i18n-attr="title:drive.continue"></button>
            </div>
        </div>
    </div>

    <!-- Upload: videos a browser cannot play. Convert them to MP4 on the server?
         (server/go/convert.go; asked before anything is sent) -->
    <div id="convertBackdrop" class="sheet-backdrop">
        <div class="sheet">
