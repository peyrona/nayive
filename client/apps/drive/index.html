<!-- index.html - Personal file explorer (multi-user; talks to the server's
     /api/files endpoints: tree, read/write, mkdir, rename/move, trash).

     A move / rename / copy / delete here also keeps the media apps' path-keyed
     sidecars in step so they never drift: the photo comments
     (data/photos/comments.json) and the Photos + Music scan caches
     (data/<app>/scan-cache.json). Drive only says WHAT moved - the files
     themselves belong to those apps, so the upkeep lives in shared/media.js:
     NayiveMedia.remapPaths() / .copyPaths() / .purgePaths(). -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Nayive's first script (old settings, whose page, error reports), then
         Ayni's language layer: it hides the page until the texts are in, and
         every inline script below may call Ayni.t(). -->
    <script src="../shared/i18n.js"></script>
    <script src="../shared/ayni/ayni-i18n.js" data-dict="../shared/i18n/" data-langs="es en pt fr de"></script>
    <title>Drive</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='12' cy='5' rx='9' ry='3'%3E%3C/ellipse%3E%3Cpath d='M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3'%3E%3C/path%3E%3Cpath d='M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5'%3E%3C/path%3E%3C/svg%3E">

    <!-- Colours and light / dark: Ayni's base (shared/ayni/). Follows the system until the user picks; set it from the launcher. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/ayni/ayni-base.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-buttons.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-toasts.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-dialogs.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ document.documentElement.dataset.theme = localStorage.getItem( 'ayni-theme' ) || ( matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light' ); }catch( e ){}</script>
    <script src="../shared/ayni/ayni-icons.js" defer></script>
    <script src="../shared/ayni/ayni-base.js" defer></script>
    <script src="../shared/ayni/ayni-buttons.js" defer></script>
    <script src="../shared/ayni/ayni-toasts.js" defer></script>
    <script src="../shared/ayni/ayni-dialogs.js" defer></script>
    <script src="../shared/locker.js"></script>

    <!-- Gum file-API helpers: HMAC signing, the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- The offline store Calendar and Contacts save through: a dropped .ics /
         .vcf is merged into their file through it too (upload.js). -->
    <script src="../shared/store.js" defer></script>
    <script src="../shared/vcard.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <!-- The item browser: picking, the selection's buttons, the one menu, the tree. -->
    <script src="../shared/browser.js" defer></script>
    <script src="../shared/photo.js" defer></script>
    <!-- The media apps' own module. Drive uses one block of it: the upkeep of
         their path-keyed sidecars when a file is moved, renamed, copied or
         trashed. Deferred is fine here (this page's script is a module and
         calls NayiveMedia only after DOMContentLoaded); the media apps
         themselves must NOT defer it. -->
    <script src="../shared/media.js" defer></script>
    <script>
    Ayni.i18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'drive',
            title: 'Drive',
            lead:  Ayni.t( 'drive.introLead' ),
            buttons: [
                { sel: '#gridBtn',         text: Ayni.t( 'drive.introGrid' ) },
                { sel: '#listBtn',         text: Ayni.t( 'drive.introList' ) },
                { sel: '#searchToggleBtn', icon: 'text-cursor', text: Ayni.t( 'drive.introSearch' ) },
                { sel: '#searchBuilderBtn', text: Ayni.t( 'drive.introSearchBuilder' ) },
                { sel: '#newFolderBtn',    text: Ayni.t( 'drive.introNewFolder' ) },
                { sel: '#uploadBtn',       text: Ayni.t( 'drive.introUpload' ) },
                // The selection's buttons (shared/browser.js) come and go with
                // what is picked, so their rows carry their own glyph and name.
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>', name: Ayni.t( 'ui.download' ),      text: Ayni.t( 'drive.introDownload' ), tour: { sel: '.sel-group [data-sel-act="download"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>', name: Ayni.t( 'ui.rename' ),        text: Ayni.t( 'drive.introRename' ), tour: { sel: '.sel-group [data-sel-act="rename"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H2"></path><path d="M2 13h11"></path><path d="m10 16 3-3-3-3"></path></svg>', name: Ayni.t( 'drive.moveToDots' ), text: Ayni.t( 'drive.introMove' ), tour: { sel: '.sel-group [data-sel-act="move"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>', name: Ayni.t( 'drive.copyToDots' ), text: Ayni.t( 'drive.introCopy' ), tour: { sel: '.sel-group [data-sel-act="copyTo"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>', name: Ayni.t( 'drive.copyLink' ),   text: Ayni.t( 'drive.introLink' ), tour: { sel: '.sel-group [data-sel-act="link"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>', name: Ayni.t( 'ui.share' ),         text: Ayni.t( 'drive.introShare' ), tour: { sel: '.sel-group [data-sel-act="share"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M11 3.5h1M10 6h1M11 8.5h1M10 11h1"></path><rect x="8.5" y="13.5" width="5" height="5" rx="1"></rect></svg>', name: Ayni.t( 'drive.compress' ),   text: Ayni.t( 'drive.introCompress' ), tour: { sel: '.sel-group [data-sel-act="compress"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>', name: Ayni.t( 'drive.properties' ), text: Ayni.t( 'drive.introProps' ), tour: { sel: '.sel-group [data-sel-act="props"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                { svg: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>', name: Ayni.t( 'ui.toTrash' ),       text: Ayni.t( 'drive.introTrash' ), tour: { sel: '.sel-group [data-sel-act="bin"]', picked: true, ghost: '.sel-group:not([hidden]), #listing' } },
                // Fixed names: both tooltips turn into "Back to Drive" while
                // their view is open (render in tree.js).
                { sel: '#bigFilesBtn', name: Ayni.t( 'drive.bigTitle' ),
                  text: Ayni.t( 'drive.introBigFiles' ) },
                { sel: '#trashViewBtn', name: Ayni.t( 'acct.trash' ),
                  text: Ayni.t( 'drive.introOpenTrash' ) },
                { sel: '#moreBtn',         text: Ayni.t( 'drive.introMore' ) }
            ],
            // The guided tour ("Ver el tour" in the card): the folders, the card's
            // rows - the selection's ones with the first row picked (`picked`),
            // each lit in the header or, with no room, in its ⋮.
            tour: [ { sel: '#breadcrumb', text: Ayni.t( 'drive.tourCrumbs' ) },
                    { use: 'pick', ghost: '#listing' }, { use: 'picked', ghost: '#listing' }, 'buttons' ]
        } );
    } );
    </script>

    <link rel="stylesheet" href="drive.css">
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <div class="brand">
                <div class="brand-row">
                    <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path></svg>
                    <h1>Drive</h1>
                </div>
                <div id="diskBar" class="disk-bar" hidden data-i18n-attr="title:drive.diskUse"><i></i></div>
            </div>

            <!-- The view switch: icons (the default) or a list (listing.js).
                 On a phone it leaves the header for the ⋮ (menus.js). -->
            <div class="tb-modes">
                <button id="gridBtn" class="btn view-btn" type="button" data-i18n-attr="data-tip:drive.viewGrid, aria-label:drive.viewGrid">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
                </button>
                <button id="listBtn" class="btn view-btn" type="button" data-i18n-attr="data-tip:drive.viewList, aria-label:drive.viewList">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3.5" y1="6" x2="3.51" y2="6"></line><line x1="3.5" y1="12" x2="3.51" y2="12"></line><line x1="3.5" y1="18" x2="3.51" y2="18"></line></svg>
                </button>
            </div>

            <span id="statusLabel" class="status-label"></span>

            <input type="file" id="uploadInput" multiple style="display:none">
            <input type="file" id="uploadDirInput" webkitdirectory multiple style="display:none">
            <input type="file" id="uploadPhotoInput" accept="image/*" multiple style="display:none">

            <div class="topbar-actions">
                <!-- WHAT YOU DO TO WHAT IS PICKED (shared/browser.js draws it):
                     only while something is picked. It is the first group, so the
                     bar grows leftwards when it comes and the buttons after it
                     never move. -->
                <div id="selActions" class="tb-group" hidden></div>

                <div id="driveTools" class="tb-group">
                    <!-- The shared search fold (NayiveUI.searchFold): the magnifier after
                         the box opens it. The funnel inside the box opens the advanced
                         search: name rules, kinds and dates, no wildcards to learn
                         (advsearch.js); the × after it clears and folds the box. -->
                    <div class="search-wrap">
                        <input type="search" id="searchInput" class="topbar-search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:drive.searchPh, title:drive.searchTip">
                        <!-- Stands in for the box while an advanced search is in force (advsearch.js). -->
                        <button id="advChip" type="button" class="adv-chip" hidden>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                            <span id="advChipText"></span>
                        </button>
                        <button id="searchBuilderBtn" class="btn sm" type="button" data-i18n-attr="data-tip:drive.sbTitle, aria-label:drive.sbTitle"></button>
                    </div>
                    <button id="searchToggleBtn" class="btn" type="button" data-rank="20" data-i18n-attr="data-tip:ui.search, aria-label:ui.search">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                    <button id="newFolderBtn" class="btn" data-rank="21" data-i18n-attr="data-tip:ui.newFolder">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    </button>
                    <button id="uploadBtn" class="btn" data-rank="22" data-i18n-attr="data-tip:drive.uploadTip">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </button>
                    <!-- "Biggest files" on/off, like the bin next to it: lit while the
                         list is open, and a second tap goes back (listing.js). -->
                    <button id="bigFilesBtn" class="btn" data-rank="23" data-i18n-attr="data-tip:drive.bigTitle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="M11 4h10"></path><path d="M11 8h7"></path><path d="M11 12h4"></path></svg>
                    </button>
                    <button id="trashViewBtn" class="btn" data-rank="24" data-i18n-attr="data-tip:acct.trash">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                    </button>
                </div>

                <div class="tb-group tb-sys">
                    <!-- The buttons that do not fit the header (NayiveUI.fitBar, menus.js);
                         hidden while everything fits. -->
                    <button id="moreBtn" class="btn" type="button" hidden aria-haspopup="true" aria-expanded="false" data-i18n-attr="data-tip:ui.moreOptions, aria-label:ui.moreOptions">
                        <span class="icon" data-icon="more"></span>
                    </button>
                    <button class="btn" data-intro-open data-rank="31" type="button" data-i18n-attr="data-tip:ui.help, aria-label:ui.help">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </button>
                </div>
                <button id="syncIndicator" class="sync-indicator synced" type="button" data-i18n-attr="data-tip:ui.synced"></button>
            </div>
        </div>

        <div class="body-row">
            <div id="listPane" class="list-pane">
                <div id="breadcrumb" class="breadcrumb"></div>
                <div id="listing" class="listing"></div>
                <div id="dropCover" class="drop-cover"><span data-i18n="drive.dropHere"></span></div>
            </div>
        </div>

    </div>

    <!-- Upload dialog: drop hint + pick-with-a-dialog choices (file / folder) -->
    <dialog id="uploadBackdrop" class="panel">
        <header>
            <h2 data-i18n="ui.upload"></h2>
            <button class="btn" id="uploadCancelBtn" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <p><span data-i18n="drive.dragDropHint"></span><br><span data-i18n="drive.orPickBelow"></span></p>
            <div class="upload-choices">
                <button id="uploadPickPhotosBtn" class="upload-choice upload-choice-photos">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-4.5-4.5L3 21"></path></svg>
                    <span data-i18n="trips.photos"></span>
                </button>
                <button id="uploadPickFilesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <span data-i18n="drive.pickFiles"></span>
                </button>
                <button id="uploadPickDirBtn" class="upload-choice upload-choice-dir">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="drive.folder"></span>
                </button>
            </div>
            <p class="upload-note" data-i18n="drive.uploadNote"></p>
        </div>
    </dialog>

    <!-- Advanced search (advsearch.js): name rules, kinds and a date window,
         with a live count. The rows and the pills are built by the script. -->
    <dialog id="searchBuilderBackdrop" class="panel big">
        <header>
            <h2 data-i18n="drive.sbTitle"></h2>
        </header>
        <div class="body">
            <div class="field">
                <label><span data-i18n="drive.sbName"></span> <span class="sb-hint" data-i18n="drive.sbNote"></span></label>
                <div id="sbRules" class="sb-rules"></div>
                <div class="sb-rule-bar">
                    <button id="sbAddRule" type="button" class="btn text dashed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span data-i18n="drive.sbAddRule"></span>
                    </button>
                    <div id="sbModeRow" class="sb-mode" hidden>
                        <span data-i18n="drive.sbMustMatch"></span>
                        <div id="sbMode" class="sb-pills"></div>
                    </div>
                </div>
            </div>
            <div class="field">
                <label><span data-i18n="drive.sbKinds"></span> <span class="sb-hint" data-i18n="drive.sbKindsHint"></span></label>
                <div id="sbKinds" class="sb-pills"></div>
            </div>
            <div class="field">
                <label data-i18n="drive.sbWhen"></label>
                <div id="sbWhen" class="sb-pills"></div>
                <div id="sbRange" class="field-row sb-range" hidden>
                    <div class="field">
                        <label for="sbFrom" data-i18n="drive.sbFrom"></label>
                        <div class="dt-field"><input type="date" id="sbFrom"><span class="dt-display"></span></div>
                    </div>
                    <div class="field">
                        <label for="sbTo" data-i18n="drive.sbTo"></label>
                        <div class="dt-field"><input type="date" id="sbTo"><span class="dt-display"></span></div>
                    </div>
                </div>
            </div>
            <div class="sb-result">
                <div id="sbCount" class="sb-count" hidden></div>
                <p id="sbSummary" class="share-note"></p>
            </div>
        </div>
        <footer>
            <div class="extra"><button id="sbClearBtn" type="button" class="btn" data-i18n-attr="data-tip:drive.sbClear"><span class="icon" data-icon="eraser"></span></button></div>
            <button class="btn" id="sbCancelBtn" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="sbSearchBtn" data-i18n-attr="data-tip:ui.search"><span class="icon" data-icon="search"></span></button>
        </footer>
    </dialog>

    <!-- New folder dialog -->
    <dialog id="newFolderBackdrop" class="panel">
        <header>
            <h2 data-i18n="ui.newFolder"></h2>
        </header>
        <div class="body">
            <div class="field">
                <input type="text" id="newFolderName" autocomplete="off" data-i18n-attr="placeholder:drive.folderNamePh">
            </div>
        </div>
        <footer>
            <button class="btn" id="newFolderCancelBtn"  data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="newFolderConfirmBtn" data-i18n-attr="data-tip:drive.create"><span class="icon" data-icon="check"></span></button>
        </footer>
    </dialog>

    <!-- Rename dialog -->
    <dialog id="renameBackdrop" class="panel">
        <header>
            <h2 data-i18n="ui.rename"></h2>
        </header>
        <div class="body">
            <div class="field">
                <input type="text" id="renameName" autocomplete="off" data-i18n-attr="aria-label:drive.newName">
            </div>
            <p id="renameError" class="field-error" data-i18n="drive.noSlash" hidden></p>
        </div>
        <footer>
            <button class="btn" id="renameCancelBtn"  data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="renameConfirmBtn" data-i18n-attr="data-tip:ui.rename"><span class="icon" data-icon="check"></span></button>
        </footer>
    </dialog>

    <!-- What is inside a .zip (zip.js): a double-click on one opens it.
         The list and the note are filled when the server answers. -->
    <dialog id="zipBackdrop" class="panel">
        <header>
            <h2 id="zipTitle"></h2>
        </header>
        <div class="body">
            <p id="zipSummary" class="zip-summary"></p>
            <ul id="zipList" class="replace-list zip-list" hidden></ul>
            <p id="zipNote" class="zip-note"></p>
        </div>
        <footer>
            <button class="btn" id="zipCloseBtn"   data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="zipExtractBtn" data-i18n-attr="data-tip:drive.extractHere"><span class="icon" data-icon="unzip"></span></button>
        </footer>
    </dialog>

    <!-- Properties dialog (right-click -> "Propiedades"). Read-only: one close button. -->
    <dialog id="propsBackdrop" class="panel">
        <header>
            <h2 data-i18n="drive.properties"></h2>
            <button class="btn" id="propsCloseBtn" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <dl id="propsBody" class="props"></dl>
        </div>
    </dialog>

    <!-- Upload: warn before overwriting files that already exist at the destination -->
    <dialog id="replaceBackdrop" class="panel">
        <header>
            <h2 id="replaceTitle" data-i18n="drive.alreadyExist"></h2>
        </header>
        <div class="body">
            <p id="replaceMsg"></p>
            <ul id="replaceList" class="replace-list"></ul>
            <label id="replaceOptWrap" class="replace-opt switch end">
                <span data-i18n="drive.replaceExisting"></span>
                <input role="switch" type="checkbox" id="replaceOverwrite">
            </label>
        </div>
        <footer>
            <button class="btn" id="replaceCancelBtn"  data-close data-i18n-attr="data-tip:ui.cancel"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="replaceConfirmBtn" data-i18n-attr="data-tip:drive.continue"><span class="icon" data-icon="check"></span></button>
        </footer>
    </dialog>

    <!-- Upload: videos a browser cannot play. Convert them to MP4 on the server?
         (server/go/convert.go; asked before anything is sent) -->
    <dialog id="convertBackdrop" class="panel">
        <header>
            <h2 data-i18n="drive.convertTitle"></h2>
            <button class="btn" id="convertCancelBtn" data-close data-i18n-attr="data-tip:ui.cancel"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <ul id="convertList" class="replace-list"></ul>
            <p data-i18n="drive.convertMsg"></p>
            <p id="convertNoPush" class="convert-nopush" hidden>
                <span data-i18n="drive.convertNoPush"></span>
                <button id="convertPushBtn" class="link-btn" data-i18n="drive.convertPushLink"></button>
            </p>
            <div class="upload-choices">
                <button id="convertYesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="16" rx="2"></rect><line x1="6" y1="4" x2="6" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line><path d="M19 9a3 3 0 0 1 0 6"></path><polyline points="21 13 19 15 17 13"></polyline></svg>
                    <span data-i18n="drive.convertYes"></span>
                </button>
                <button id="convertNoBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span data-i18n="drive.convertNo"></span>
                </button>
            </div>
        </div>
    </dialog>

    <!-- Built-in image viewer (lightbox) -->
    <div id="viewerBackdrop" class="viewer-backdrop">
        <button id="viewerCloseBtn" class="btn on-media viewer-close" data-i18n-attr="data-tip:ui.close, aria-label:ui.close"><span class="icon" data-icon="close"></span></button>
        <img id="viewerImg" alt="">
        <span id="viewerName" class="viewer-name"></span>
    </div>

    <!-- Built-in audio / video player -->
    <div id="mediaBackdrop" class="media-backdrop">
        <button id="mediaCloseBtn" class="btn on-media viewer-close" data-i18n-attr="data-tip:ui.close, aria-label:ui.close"><span class="icon" data-icon="close"></span></button>
        <video id="mediaVideo" controls playsinline hidden></video>
        <div id="mediaAudioBox" class="media-audio-box" hidden>
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <audio id="mediaAudio" controls></audio>
        </div>
        <span id="mediaName" class="viewer-name"></span>
    </div>

    <!-- Indeterminate progress dialog (shown while Drive builds a ZIP) -->
    <dialog id="progressBackdrop" class="panel progress-sheet">
        <header>
            <h2 id="progressTitle" data-i18n="drive.zipping"></h2>
        </header>
        <div class="body">
            <div class="progress-track"></div>
        </div>
    </dialog>

    <!-- "Open with" dialog: a double-clicked file no app claims (and the
         Write-or-Calc tie). openWithDialog picks which buttons show. -->
    <dialog id="importWithBackdrop" class="panel">
        <header>
            <h2 data-i18n="drive.openWith"></h2>
            <button class="btn" id="importWithCancelBtn" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <p id="importWithMsg"></p>
            <!-- One labelled tile per app, the same shape the upload dialog uses.
                 App names are never translated, so the labels are literal. -->
            <div class="upload-choices open-with-apps">
                <button id="importWithTextBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline><line x1="14" y1="4" x2="10" y2="20"></line></svg>
                    <span>Text</span>
                </button>
                <button id="importWithWriteBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 512 512" fill="currentColor"><g transform="translate(45 465) rotate(-48)"><path d="M0 0 28 -14 82 -36C96 -36 110 -27 122 -19L122 19C110 27 96 36 82 36L28 14Z"></path><rect x="132" y="-26" width="350" height="52"></rect><path d="M494 -26 522 -26C542 -26 550 -14 550 0 550 14 542 26 522 26L494 26Z"></path></g><rect x="262" y="220" width="176" height="50" rx="12"></rect><path fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" d="M294 270 294 300C294 314 228 312 228 332L228 445C228 460 240 472 255 472L445 472C460 472 472 460 472 445L472 332C472 312 406 314 406 300L406 270"></path><path d="M228 355 472 355 472 445C472 460 460 472 445 472L255 472C240 472 228 460 228 445Z"></path></svg>
                    <span>Write</span>
                </button>
                <button id="importWithCalcBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 512 512" fill="currentColor"><g transform="translate(-213.2 -558.1) scale(1.8891 3.2191)"><g transform="translate(37.3 3.7)"><path d="m 159.5,210.8 v 7.2 h 25.2 v 16.5 H 159.5 V 300 h -21.5 v -65.6 h -19.9 v -16.5 h 19.9 v -5.7 q 0,-14.8 6.2,-20.5 6.2,-5.7 22.9,-5.7 h 17.7 v 16.5 h -16.8 q -4.8,0 -6.6,1.8 -1.7,1.8 -1.8,6.5 z"></path><g transform="translate(67.4 112.5) scale(.625)"><path d="m 243.4,186.2 q -9.7,17.5 -14.4,33.9 -4.7,16.4 -4.7,32.8 0,16.3 4.7,32.8 4.7,16.5 14.4,34.1 h -16.7 q -11.6,-16.9 -17.3,-33.3 -5.6,-16.5 -5.6,-33.5 0,-17 5.6,-33.5 5.7,-16.6 17.3,-33.3 z"></path><path d="M 329.9,218 302.2,257.2 332.3,300 H 307.2 L 291.1,272.4 275.1,300 h -25 l 30.3,-42.8 -27.9,-39.3 h 25 l 13.6,24.5 13.7,-24.5 z"></path><path d="m 338.9,186.2 h 16.7 q 11.6,16.7 17.2,33.3 5.7,16.5 5.7,33.5 0,17.1 -5.6,33.5 -5.6,16.4 -17.3,33.3 h -16.7 q 9.7,-17.6 14.4,-34.1 4.7,-16.6 4.7,-32.8 0,-16.4 -4.7,-32.8 -4.7,-16.4 -14.4,-33.9 z"></path></g></g></g></svg>
                    <span>Calc</span>
                </button>
                <button id="importWithPhotosBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="16" height="16" rx="2"></rect><circle cx="12" cy="8" r="2"></circle><path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18"></path><path d="M18 22H4a2 2 0 0 1-2-2V6"></path></svg>
                    <span>Photos</span>
                </button>
                <button id="importWithMusicBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    <span>Music</span>
                </button>
                <button id="importWithMoviesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                    <span>Movies</span>
                </button>
            </div>
        </div>
    </dialog>

    <!-- Drive's code, one file per feature. Classic scripts sharing one global
         scope, so keep this order. init.js is a module for its top-level
         await: Ayni.i18n.ready comes only after every script here has run,
         so it starts the app last although it loads second. -->
    <script src="state.js" defer></script>
    <script type="module" src="init.js"></script>
    <script src="menus.js" defer></script>
    <script src="tree.js" defer></script>
    <script src="trash.js" defer></script>
    <script src="navigate.js" defer></script>
    <script src="keyboard.js" defer></script>
    <script src="listing.js" defer></script>
    <script src="thumbs.js" defer></script>
    <script src="advsearch.js" defer></script>
    <script src="dragdrop.js" defer></script>
    <script src="open.js" defer></script>
    <script src="viewers.js" defer></script>
    <script src="toolbar.js" defer></script>
    <script src="upload.js" defer></script>
    <script src="actions.js" defer></script>
    <script src="move-copy.js" defer></script>
    <script src="zip.js" defer></script>
</body>
</html>
