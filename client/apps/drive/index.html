    <!-- Bottom-centre transient toast (shared .toast styling from theme.css) -->
    <div id="toast" class="toast"></div>

    <script type="module">

        // Interface strings: every one of them lives in shared/i18n/*.json.
        const T  = k           => NayiveUI.t( k );
        const TF = ( k, vars ) => NayiveUI.tf( k, vars );
        // Nothing is drawn from JS before the dictionary is in: without an
        // in-source fallback, an early render would paint the bare keys.
        await NayiveI18n.ready;

        //------------------------------------------------------------------------//
        // STATE

        let dirTreeRoot     = null;          // FOLDERS-ONLY recursive tree (left pane), from ?tree=dirs
        let IS_ADMIN        = false;         // set from the tree root's `role` field

        // The open folder's own contents (files + sub-folders, one level), from
        // ?dir=. The right pane renders straight from this — the folders-only
        // tree above no longer carries file nodes (D4 phase 2).
        let curListing      = { path: null, nodes: [] };
        let listingLoading  = false;
        let listingSeq      = 0;             // guards against an out-of-order folder load landing late

        // The folder shown to the user AS "Drive". Admin sees the real server root
        // (''); a regular user's documents live under files/, so we show that node
        // as the root and hide the "Files" wrapper. Real paths kept as-is (the
        // server still wants the `files/` prefix) — only the display is rerooted.
        let FS_ROOT = '';
        function computeFsRoot() { FS_ROOT = ( ! IS_ADMIN && findNode( 'files' ) ) ? 'files' : ''; }
        function fsRel( path )                // strip the FS_ROOT prefix, for display only
        {
            if( ! FS_ROOT || path === FS_ROOT ) return path === FS_ROOT ? '' : path;
            return path.indexOf( FS_ROOT + '/' ) === 0 ? path.slice( FS_ROOT.length + 1 ) : path;
        }

        // The server sends everything this session may see. For a regular user
        // that already excludes other homes; we additionally hide their own data/
        // folder (app data — tasks.json, calendar.ics, trips/…) and any
        // dotfiles/dot-dirs (e.g. files/.bak). Admin sees everything.
        // Every listing / tree / search result is filtered through pruneNodes so
        // the rule lives in one place.
        function pruneNodes( nodes )
        {
            if( ! Array.isArray( nodes ) ) return [];
            if( IS_ADMIN ) return nodes.slice();

            return nodes.filter( function( n )
            {
                var name = n.path.split( '/' ).pop();
                if( name.charAt( 0 ) === '.' ) return false;
                return n.path !== 'data' && n.path.indexOf( 'data/' ) !== 0;
            } );
        }

        function pruneTreeInPlace( node )
        {
            if( ! node || ! Array.isArray( node.nodes ) ) return node;
            node.nodes = pruneNodes( node.nodes );
            node.nodes.forEach( pruneTreeInPlace );
            return node;
        }

        function scopeTree( raw )
        {
            IS_ADMIN = !! ( raw && raw.role === 'admin' );
            return pruneTreeInPlace( raw );
        }
        let currentFolder   = '';            // path relative to file-manager root ('' = root)
        let expandedFolders = new Set( [''] );
        let selectedPaths   = new Set();      // paths selected in the current listing
        let searchQuery     = '';            // when non-empty, the listing shows server-side name matches
        let searchHits      = null;          // array of match nodes while a search is active, else null
        let searchTruncated = false;         // the server capped the result list
        let searchSeq       = 0;             // guards against a stale search response landing late
        let searchTimer     = null;          // debounce for the search box
        let trashMode       = false;         // the "Papelera" view is open instead of the file tree
        let trashItems      = [];            // entries from GumApi.trashList() while trashMode is on
        let trashDays       = null;          // auto-delete period (days) shown in the Papelera bar
        let dragPaths       = null;          // paths being drag-moved inside Drive (null = not an internal drag)
        let kbdPane         = 'list';        // which pane the arrow keys drive: 'tree' (folders) | 'list' (files)
        let kbdTreePath     = null;          // tree row under the keyboard cursor while kbdPane === 'tree'

        // Phone layout: the folder tree becomes a slide-in sheet, the search field
        // collapses behind a magnifier, the app launchers are hidden (see @media ≤640px).
        const PHONE = window.matchMedia( '(max-width: 640px)' );
        function isPhone() { return PHONE.matches; }

        function openTreeSheet()
        {
            document.getElementById( 'treePane'     ).classList.add( 'open' );
            document.getElementById( 'treeBackdrop' ).classList.add( 'open' );
        }
        function closeTreeSheet()
        {
            document.getElementById( 'treePane'     ).classList.remove( 'open' );
            document.getElementById( 'treeBackdrop' ).classList.remove( 'open' );
        }

        // Open a file / editor URL. On a phone there is no visible way back from a new
        // browser tab, so navigate in place — the browser's Back button returns to Drive.
        function openDoc( url )
        {
            if( isPhone() ) location.href = url;
            else            window.open( url, '_blank' );
        }

        //------------------------------------------------------------------------//
        // INITIALIZATION

        NayiveI18n.ready.then( function()
        {
            wireStaticUI();
            _tryAutoAccess_();
        });

        async function _tryAutoAccess_()
        {
            try
            {
                // Folders-only tree — also the auth gate (401 here => not signed in).
                dirTreeRoot = scopeTree( await GumApi.dirTree() );

                // A regular user's "Drive" root IS their files/ folder.
                computeFsRoot();
                currentFolder   = FS_ROOT;
                expandedFolders = new Set( [ FS_ROOT ] );

                document.getElementById( 'app' ).style.display = '';
                await loadListing( FS_ROOT );                       // fills the right pane + renders
                await applyDeepLink();
                pollConvert();   // a conversion may still be running from an earlier upload
                document.getElementById( 'searchInput' ).focus();   // ready to type a filter straight away
                refreshDiskGauge();                                 // fill the server-HD bar under the title
            }
            catch( _ )
            {
                GumApi.loginRedirect();
            }
        }

        function wireStaticUI()
        {
            document.getElementById( 'newFolderBtn'      ).addEventListener( 'click', function() { openNewFolder(); } );
            document.getElementById( 'uploadBtn'         ).addEventListener( 'click', function() { setBackdrop( 'uploadBackdrop', true ); document.getElementById( 'uploadPickFilesBtn' ).focus(); } );
            document.getElementById( 'uploadCancelBtn'   ).addEventListener( 'click', function() { setBackdrop( 'uploadBackdrop', false ); } );
            document.getElementById( 'uploadPickPhotosBtn').addEventListener( 'click', function() { setBackdrop( 'uploadBackdrop', false ); document.getElementById( 'uploadPhotoInput' ).click(); } );
            document.getElementById( 'uploadPickFilesBtn').addEventListener( 'click', function() { setBackdrop( 'uploadBackdrop', false ); document.getElementById( 'uploadInput' ).click(); } );
            document.getElementById( 'uploadPickDirBtn'  ).addEventListener( 'click', function() { setBackdrop( 'uploadBackdrop', false ); document.getElementById( 'uploadDirInput' ).click(); } );
            document.getElementById( 'uploadInput'       ).addEventListener( 'change', onUploadInputChange );
            document.getElementById( 'uploadDirInput'    ).addEventListener( 'change', onUploadInputChange );
            document.getElementById( 'uploadPhotoInput'  ).addEventListener( 'change', onUploadInputChange );
            document.getElementById( 'renameBtn'         ).addEventListener( 'click', openRename );
            document.getElementById( 'copyLinkBtn'       ).addEventListener( 'click', copySelectionLink );
            document.getElementById( 'downloadBtn'       ).addEventListener( 'click', downloadSelection );
            document.getElementById( 'deleteBtn'         ).addEventListener( 'click', openDeleteConfirm );
            // New documents are created in the folder currently open in Drive
            // (?dir=), so they save where the user is looking, not the files/ root.
            document.getElementById( 'syncIndicator'     ).addEventListener( 'click', function() { reload(); } );
            document.getElementById( 'trashViewBtn'      ).addEventListener( 'click', function() { trashMode ? closeTrash() : openTrash(); } );

            wireTopMenu();      // the header's ⋮ (phone) — see B6b in the phone block
            initPaneResizer();

            document.getElementById( 'searchInput' ).addEventListener( 'input', function( e )
            {
                searchQuery = e.target.value;
                selectedPaths.clear();
                if( searchTimer ) clearTimeout( searchTimer );

                if( ! searchQuery.trim() )
                {
                    searchHits = null;
                    searchTruncated = false;
                    render();
                    return;
                }

                searchHits = null;                     // "Buscando…" until the server answers
                render();
                searchTimer = setTimeout( runSearch, 200 );
            });
            document.getElementById( 'searchInput' ).addEventListener( 'keydown', function( e )
            {
                if( e.key === 'Escape' && e.target.value )
                {
                    e.stopPropagation();          // keep the global Escape (dialogs / viewer) out of it
                    clearSearch();
                    selectedPaths.clear();
                    document.querySelector( '.topbar' ).classList.remove( 'searching' );
                    render();
                    return;
                }

                // ArrowDown drops out of the search box straight into the file list.
                if( e.key === 'ArrowDown' && ! isPhone() )
                {
                    e.preventDefault();
                    e.target.blur();
                    focusPane( 'list' );
                }
            });

            // Phone: the magnifier reveals the search field (which keeps its live filter);
            // tapping it again hides and clears it.
            document.getElementById( 'searchToggleBtn' ).addEventListener( 'click', function()
            {
                const on = document.querySelector( '.topbar' ).classList.toggle( 'searching' );
                if( on ) document.getElementById( 'searchInput' ).focus();
                else     { clearSearch(); selectedPaths.clear(); render(); }
            });

            document.getElementById( 'treeBackdrop' ).addEventListener( 'click', closeTreeSheet );
            PHONE.addEventListener( 'change', function() { closeTreeSheet(); render(); } );


            document.getElementById( 'newFolderCancelBtn'  ).addEventListener( 'click', function() { setBackdrop( 'newFolderBackdrop', false ); } );
            document.getElementById( 'newFolderConfirmBtn' ).addEventListener( 'click', confirmNewFolder );
            document.getElementById( 'newFolderName'       ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) confirmNewFolder(); } );

            document.getElementById( 'propsCloseBtn' ).addEventListener( 'click', function() { setBackdrop( 'propsBackdrop', false ); } );

            document.getElementById( 'renameCancelBtn'  ).addEventListener( 'click', function() { setBackdrop( 'renameBackdrop', false ); } );
            document.getElementById( 'renameConfirmBtn' ).addEventListener( 'click', confirmRename );
            document.getElementById( 'renameName'       ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) confirmRename(); } );

            document.getElementById( 'deleteCancelBtn'  ).addEventListener( 'click', function() { setBackdrop( 'deleteBackdrop', false ); } );
            document.getElementById( 'deleteConfirmBtn' ).addEventListener( 'click', confirmDelete );

            document.getElementById( 'replaceCancelBtn'  ).addEventListener( 'click', function() { settleReplace( 'cancel' ); } );
            document.getElementById( 'replaceConfirmBtn' ).addEventListener( 'click', function()
            {
                settleReplace( document.getElementById( 'replaceOverwrite' ).checked ? 'overwrite' : 'skip' );
            });

            document.getElementById( 'convertCancelBtn' ).addEventListener( 'click', function() { settleConvert( 'cancel' ); } );
            document.getElementById( 'convertYesBtn'    ).addEventListener( 'click', function() { settleConvert( 'convert' ); } );
            document.getElementById( 'convertNoBtn'     ).addEventListener( 'click', function() { settleConvert( 'plain' ); } );
            document.getElementById( 'convertPushBtn'   ).addEventListener( 'click', function()
            {
                // The switch lives in the launcher's "Mi cuenta". A NEW tab, so
                // this upload is not lost; it copies sessionStorage, so the
                // launcher's reopen note opens the dialog there.
                try { sessionStorage.setItem( 'balata-acct-reopen', '1' ); } catch( _ ) {}
                window.open( '../', '_blank' );
                try { sessionStorage.removeItem( 'balata-acct-reopen' ); } catch( _ ) {}
            });

            document.getElementById( 'importWithCancelBtn' ).addEventListener( 'click', function() { openWithPath = null; setBackdrop( 'importWithBackdrop', false ); } );
            for( const app in OPEN_WITH_BTN )
                document.getElementById( OPEN_WITH_BTN[ app ] )
                        .addEventListener( 'click', function( a ) { return function() { chooseOpenWith( a ); }; }( app ) );

            document.getElementById( 'viewerBackdrop' ).addEventListener( 'click', closeImageViewer );   // click anywhere (image, backdrop or ✕) closes

            document.getElementById( 'editorSaveBtn'   ).addEventListener( 'click', saveEditor );
            document.getElementById( 'editorSaveAsBtn' ).addEventListener( 'click', saveEditorAs );
            document.getElementById( 'editorCloseBtn'  ).addEventListener( 'click', function() { closeImageEditor( false ); } );

            document.getElementById( 'saveCopyCancelBtn'  ).addEventListener( 'click', function() { setBackdrop( 'saveCopyBackdrop', false ); } );
            document.getElementById( 'saveCopyConfirmBtn' ).addEventListener( 'click', confirmSaveCopy );
            document.getElementById( 'saveCopyName'       ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) { e.preventDefault(); confirmSaveCopy(); } } );

            // Media player: only the dark area or the ✕ closes — never a click that
            // lands on the <video>/<audio> element (those go to its own controls).
            document.getElementById( 'mediaCloseBtn' ).addEventListener( 'click', closeMediaViewer );
            document.getElementById( 'mediaBackdrop' ).addEventListener( 'click', function( e )
            {
                if( e.target === this ) closeMediaViewer();
            });
            document.addEventListener( 'keydown', function( e )
            {
                if( e.key !== 'Escape' ) return;

                if( anyCtxMenuOpen() )
                {
                    closeCtxMenus();
                    return;
                }

                if( isPhone() && document.getElementById( 'treePane' ).classList.contains( 'open' ) )
                {
                    closeTreeSheet();
                    return;
                }

                if( document.getElementById( 'saveCopyBackdrop' ).classList.contains( 'open' ) )
                {
                    setBackdrop( 'saveCopyBackdrop', false );
                    return;
                }

                if( document.getElementById( 'editorBackdrop' ).classList.contains( 'open' ) )
                {
                    closeImageEditor( false );
                    return;
                }

                if( document.getElementById( 'viewerBackdrop' ).classList.contains( 'open' ) )
                {
                    closeImageViewer();
                    return;
                }

                if( document.getElementById( 'mediaBackdrop' ).classList.contains( 'open' ) )
                {
                    closeMediaViewer();
                    return;
                }

                const open = document.querySelector( '.sheet-backdrop.open' );

                if( ! open || open.id === 'progressBackdrop' )   // indeterminate progress is not user-dismissable
                    return;

                if( open.id === 'replaceBackdrop' )
                {
                    settleReplace( 'cancel' );
                    return;
                }

                if( open.id === 'convertBackdrop' )
                {
                    settleConvert( 'cancel' );
                    return;
                }

                if( open.id === 'importWithBackdrop' )
                    openWithPath = null;

                setBackdrop( open.id, false );
            });

            document.addEventListener( 'keydown', onNavKey );
            document.addEventListener( 'keydown', onShortcutKey );

            // A click anywhere in a pane makes it the keyboard-focused one. (Just
            // flips the flag — no re-render here, so the row's own click still lands.)
            document.getElementById( 'treePane' ).addEventListener( 'mousedown', function() { kbdPane = 'tree'; paintKbdPane(); } );
            document.getElementById( 'listing'  ).addEventListener( 'mousedown', function() { kbdPane = 'list'; paintKbdPane(); } );

            const listPane = document.getElementById( 'listPane' );
            listPane.addEventListener( 'dragover', function( e ) { if( dragPaths ) return; e.preventDefault(); listPane.classList.add( 'drag-over' ); } );
            listPane.addEventListener( 'dragleave', function( e )
            {
                // Crossing into a child row fires dragleave on the pane too; only a
                // real exit (relatedTarget outside the pane) hides the cover.
                if( e.relatedTarget && listPane.contains( e.relatedTarget ) ) return;
                listPane.classList.remove( 'drag-over' );
            } );
            listPane.addEventListener( 'drop', onDrop );

            document.getElementById( 'moveToBtn' ).addEventListener( 'click', function() { openFolderPicker( 'move' ); } );
            document.getElementById( 'copyToBtn' ).addEventListener( 'click', function() { openFolderPicker( 'copy' ); } );
            document.getElementById( 'shareBtn' ).addEventListener( 'click', function()
            {
                const tg = actionTargets();
                if( tg.length !== 1 ) return;
                const node = rowNode( tg[ 0 ] );
                NayiveUI.shareSheet( {
                    path:   tg[ 0 ],
                    app:    (node && isDir( node )) ? 'folder' : 'file',
                    title:  tg[ 0 ].split( '/' ).pop(),
                    canAdd: !! (node && isDir( node ))   // only a folder can be added to
                } );
            } );

            document.getElementById( 'pickFolderCancelBtn'  ).addEventListener( 'click', function() { setBackdrop( 'pickFolderBackdrop', false ); } );
            document.getElementById( 'pickFolderConfirmBtn' ).addEventListener( 'click', confirmFolderPicker );

            wireContextMenu();
        }

        //------------------------------------------------------------------------//
        // CONTEXT MENUS (right-click on desktop; on touch, the row's ⋮ button)
        //
        //   #ctxMenu     - on a listing row: acts on the current selection
        //   #ctxAreaMenu - on empty space:  Nueva carpeta / Pegar (internal clipboard)
        //
        // Touch long-press is NOT a menu shortcut — it opens the pressed item
        // (folder: navigate in; file: viewer / editor), a firm alternative to the
        // fiddly double-tap.

        let ctxOpenedAt  = 0;      // guards the close-on-click that follows an open
        let swallowClick = false;  // eat the click a touch long-press leaves behind
        let clipboard    = null;   // { mode: 'move' | 'copy', paths: [...] } set by Cortar / Copiar

        function wireContextMenu()
        {
            const listing = document.getElementById( 'listing' );

            listing.addEventListener( 'contextmenu', onListingContextMenu );

            document.getElementById( 'ctxOpen'     ).addEventListener( 'click', function() { closeCtxMenus(); openSelectedNode(); } );
            document.getElementById( 'ctxDownload' ).addEventListener( 'click', function() { closeCtxMenus(); downloadSelection(); } );
            document.getElementById( 'ctxCut'      ).addEventListener( 'click', function() { closeCtxMenus(); setClipboard( 'move' ); } );
            document.getElementById( 'ctxClip'     ).addEventListener( 'click', function() { closeCtxMenus(); setClipboard( 'copy' ); } );
            document.getElementById( 'ctxMove'     ).addEventListener( 'click', function() { closeCtxMenus(); openFolderPicker( 'move' ); } );
            document.getElementById( 'ctxCopy'     ).addEventListener( 'click', function() { closeCtxMenus(); openFolderPicker( 'copy' ); } );
            document.getElementById( 'ctxRename'   ).addEventListener( 'click', function() { closeCtxMenus(); openRename(); } );
            document.getElementById( 'ctxLink'     ).addEventListener( 'click', function() { closeCtxMenus(); copySelectionLink(); } );
            document.getElementById( 'ctxDelete'   ).addEventListener( 'click', function() { closeCtxMenus(); openDeleteConfirm(); } );
            document.getElementById( 'ctxProps'    ).addEventListener( 'click', function() { closeCtxMenus(); openProperties(); } );

            document.getElementById( 'ctxAreaNewFolder' ).addEventListener( 'click', function() { closeCtxMenus(); openNewFolder(); } );
            document.getElementById( 'ctxAreaPaste'     ).addEventListener( 'click', function() { closeCtxMenus(); doPaste(); } );

            document.addEventListener( 'click', function( e )
            {
                if( swallowClick ) { swallowClick = false; e.preventDefault(); e.stopPropagation(); return; }
                if( Date.now() - ctxOpenedAt < 300 ) return;
                if( ! e.target.closest( '.ctx-menu' ) ) closeCtxMenus();
            }, true );

            document.addEventListener( 'scroll', function() { closeCtxMenus(); }, true );
            window.addEventListener( 'resize', function() { closeCtxMenus(); } );

            // Touch long-press on a row -> open that item (not a menu; the ⋮ button is the menu).
            let lpTimer = null, lpX = 0, lpY = 0;

            listing.addEventListener( 'touchstart', function( e )
            {
                if( e.target.closest( '.row-menu' ) ) return;          // the ⋮ button handles its own tap

                const rowEl = e.target.closest( '.row' );
                if( ! rowEl || ! rowEl.dataset.path ) return;
                const t = e.touches[0];
                lpX = t.clientX; lpY = t.clientY;

                lpTimer = setTimeout( function()
                {
                    lpTimer      = null;
                    swallowClick = true;
                    setTimeout( function() { swallowClick = false; }, 700 );   // self-heal if no click follows
                    const node = rowNode( rowEl.dataset.path );
                    if( node ) openNode( node );
                }, 500 );
            }, { passive: true } );

            listing.addEventListener( 'touchmove', function( e )
            {
                if( ! lpTimer ) return;
                const t = e.touches[0];
                if( Math.abs( t.clientX - lpX ) > 10 || Math.abs( t.clientY - lpY ) > 10 ) { clearTimeout( lpTimer ); lpTimer = null; }
            }, { passive: true } );

            listing.addEventListener( 'touchend', function() { if( lpTimer ) { clearTimeout( lpTimer ); lpTimer = null; } } );
        }

        function onListingContextMenu( e )
        {
            // The papelera has none of these actions — its rows carry no
            // dataset.path, so without this the empty-area menu would open and
            // Nueva carpeta / Pegar would act on the folder BEHIND the papelera,
            // which stays on screen after the reload. Same as the keyboard
            // shortcuts: in trash mode Drive steps aside for the browser.
            if( trashMode ) return;

            e.preventDefault();
            openMenuFor( e.target.closest( '.row' ), e.clientX, e.clientY );
        }

        // rowEl set  -> the per-item menu (acts on the selection);
        // rowEl null -> the empty-area menu (Nueva carpeta / Pegar).
        function openMenuFor( rowEl, x, y )
        {
            if( rowEl && rowEl.dataset.path )
            {
                selectOnlyForMenu( rowEl.dataset.path );
                openCtxMenu( 'ctxMenu', x, y );
            }
            else
            {
                openCtxMenu( 'ctxAreaMenu', x, y );
            }
        }

        // If the right-clicked / long-pressed row is not already part of the
        // selection, make it the only selected item; otherwise leave the multi
        // selection alone so the menu acts on the whole set.
        function selectOnlyForMenu( path )
        {
            if( selectedPaths.has( path ) ) return;
            selectedPaths = new Set( [ path ] );
            render();
        }

        // A folder row in the left tree, right-clicked or ⋮-tapped: make it the
        // sole selection and open the same per-item menu the listing uses. Every
        // action (Renombrar / Mover / Copiar / …) already works off selectedPaths,
        // so nothing else needs to know the target came from the tree.
        function openTreeMenuFor( path, x, y )
        {
            if( ! path ) return;                       // the "Drive" root has no actions
            selectedPaths = new Set( [ path ] );
            render();
            openCtxMenu( 'ctxMenu', x, y );
        }

        function openCtxMenu( id, x, y )
        {
            closeCtxMenus();

            if(      id === 'ctxMenu'     ) updateCtxMenuState();
            else if( id === 'ctxAreaMenu' ) updateAreaMenuState();
            else                            updateTopMenuState();   // the header's ⋮ (phone)

            const m = document.getElementById( id );
            m.classList.add( 'open' );

            const mw = m.offsetWidth, mh = m.offsetHeight;
            m.style.left = Math.max( 6, Math.min( x, window.innerWidth  - mw - 8 ) ) + 'px';
            m.style.top  = Math.max( 6, Math.min( y, window.innerHeight - mh - 8 ) ) + 'px';

            ctxOpenedAt = Date.now();
        }

        function closeCtxMenus()
        {
            document.getElementById( 'ctxMenu'     ).classList.remove( 'open' );
            document.getElementById( 'ctxAreaMenu' ).classList.remove( 'open' );
            document.getElementById( 'topMenu'     ).classList.remove( 'open' );
            document.getElementById( 'moreBtn'     ).setAttribute( 'aria-expanded', 'false' );
        }

        function anyCtxMenuOpen()
        {
            return document.getElementById( 'ctxMenu'     ).classList.contains( 'open' ) ||
                   document.getElementById( 'ctxAreaMenu' ).classList.contains( 'open' ) ||
                   document.getElementById( 'topMenu'     ).classList.contains( 'open' );
        }

        //--------------------------------------------------------------------//
        // HEADER "⋮"  (phone only — see B6b in the phone block)
        //
        // The header buttons a phone reaches for least are hidden there and
        // come back in this menu. Each entry is BUILT from the button it stands
        // for — same glyph, same title — and clicking it clicks that button, so
        // there is still exactly one set of handlers, one enabled/disabled rule
        // and one set of titles to keep up to date.

        const TOP_MENU_BTNS = [ 'shareBtn', 'trashViewBtn' ];

        function wireTopMenu()
        {
            const menu = document.getElementById( 'topMenu' );
            const btn  = document.getElementById( 'moreBtn' );

            for( const id of TOP_MENU_BTNS )
            {
                const src = document.getElementById( id );
                const svg = src && src.querySelector( 'svg' );
                if( ! svg ) continue;

                const item = document.createElement( 'button' );
                item.className    = 'menu-item';
                item.dataset.menu = id;
                item.appendChild( svg.cloneNode( true ) );

                const label = document.createElement( 'span' );
                item.appendChild( label );
                menu.appendChild( item );
            }

            btn.addEventListener( 'click', function( e )
            {
                e.stopPropagation();                       // the document handler would close it again
                if( menu.classList.contains( 'open' ) ) { closeCtxMenus(); return; }

                const r = btn.getBoundingClientRect();
                openCtxMenu( 'topMenu', r.right, r.bottom + 4 );   // openCtxMenu clamps it to the screen
                btn.setAttribute( 'aria-expanded', 'true' );
            } );

            menu.addEventListener( 'click', function( e )
            {
                const item = e.target.closest( 'button[data-menu]' );
                if( ! item || item.disabled ) return;

                closeCtxMenus();
                document.getElementById( item.dataset.menu ).click();
            } );
        }

        // Called by openCtxMenu just before the menu shows: copy each source
        // button's live state across. A tooltip says more than a menu row should
        // — the reason a button is off after an em dash, or the file name in a
        // quote ("Compartir \"x.txt\" con…"). The row is labelled with whatever
        // comes before either; the whole title stays as the row's own tooltip.
        function updateTopMenuState()
        {
            const trash = document.body.classList.contains( 'trash-mode' );

            for( const item of document.querySelectorAll( '#topMenu button[data-menu]' ) )
            {
                const src = document.getElementById( item.dataset.menu );
                // stripKeyHint: a desktop window narrowed into the phone layout can
                // still carry a "· Ctrl+U" in the title, and a menu row is no place
                // for a key the phone has not got.
                const t   = stripKeyHint( src.getAttribute( 'title' ) || '' );

                item.disabled = !! src.disabled;
                item.title    = t;
                item.querySelector( 'span' ).textContent = t.split( /[\u2014"]/ )[0].trim() || t;

                // Trash mode takes most of the toolbar away; the menu must not
                // offer what the bar itself has just hidden.
                item.hidden = trash && item.dataset.menu !== 'trashViewBtn';
            }
        }

        // Anything under shared/ belongs to somebody else and the server refuses
        // every write on it, so the menus turn those entries off exactly as the
        // toolbar does (updateToolbarState) — an action that can only ever end
        // in an error toast is not worth offering. Reading (Abrir, Descargar,
        // Copiar, Copiar a…, Enlace) stays on: copying OUT is fine.
        function readOnlySel()  { return actionTargets().some( NayiveUI.isShared ); }
        function readOnlyHere() { return NayiveUI.isShared( currentFolder ); }

        function updateCtxMenuState()
        {
            const one = selectedPaths.size === 1;
            const ro  = readOnlySel();
            document.getElementById( 'ctxOpen'   ).disabled = ! one;
            document.getElementById( 'ctxRename' ).disabled = ! one || ro;
            document.getElementById( 'ctxLink'   ).disabled = ! one;
            document.getElementById( 'ctxCut'    ).disabled = ro;   // a cut is a move
            document.getElementById( 'ctxMove'   ).disabled = ro;
            document.getElementById( 'ctxDelete' ).disabled = ro;
        }

        function updateAreaMenuState()
        {
            // Both entries write into the open folder. An "add" grant does not
            // help here: it only ever lets a file be UPLOADED (see canAddHere).
            const ro   = readOnlyHere();
            const btn  = document.getElementById( 'ctxAreaPaste' );
            const has  = !! (clipboard && clipboard.paths.length);
            document.getElementById( 'ctxAreaNewFolder' ).disabled = ro;
            btn.disabled = ! has || ro;
            btn.querySelector( 'span' ).textContent = has
                ? TF( clipboard.mode === 'move' ? 'drive.pasteMoveN' : 'drive.pasteCopyN',
                      { n: clipboard.paths.length } )
                : T( 'ui.paste' );
        }

        function setClipboard( mode )
        {
            if( ! selectedPaths.size ) return;
            clipboard = { mode: mode, paths: Array.from( selectedPaths ) };
            flashStatus( TF( mode === 'move' ? 'drive.nCut' : 'drive.nCopiedClip', { n: clipboard.paths.length } ) );
        }

        async function doPaste()
        {
            if( ! (clipboard && clipboard.paths.length) ) return;

            const mode  = clipboard.mode;
            const paths = clipboard.paths;
            const dest  = currentFolder;

            for( const p of paths )
            {
                const n = findNode( p );
                if( n && isDir( n ) && (dest === p || dest.indexOf( p + '/' ) === 0) )
                {
                    NayiveUI.toast( T( 'drive.pasteIntoItself' ) );
                    return;
                }
            }

            clipboard = null;

            if( mode === 'move' ) await doMove( paths, dest );
            else                  await doCopy( paths, dest );
        }

        function openSelectedNode()
        {
            if( selectedPaths.size !== 1 ) return;
            const node = rowNode( Array.from( selectedPaths )[0] );
            if( node ) openNode( node );
        }

        function setBackdrop( id, open ) { NayiveUI.setOpen( id, open ); }   // impl in shared/ui.js

        //------------------------------------------------------------------------//
        // TREE HELPERS

        function splitPath( path ) { return path ? path.split( '/' ) : []; }

        function joinPath( parent, name ) { return parent ? parent + '/' + name : name; }

        // Walks the FOLDERS-ONLY tree. Resolves any folder path; returns null for
        // a file path (files no longer live in this tree — use rowNode() for
        // something shown in the right pane, or fetch the folder with listDir()).
        function findNode( path )
        {
            if( ! path ) return dirTreeRoot;

            let node = dirTreeRoot;

            for( const seg of splitPath( path ) )
            {
                if( ! node || ! node.nodes ) return null;
                node = node.nodes.find( function( n ) { return n.path.split( '/' ).pop() === seg; } );
            }

            return node || null;
        }

        // The node behind a path currently shown in the right pane: a folder from
        // the tree, or a file from the open folder's one-level listing / the
        // active search results.
        function rowNode( path )
        {
            return findNode( path ) ||
                   ( curListing.nodes || [] ).find( function( n ) { return n.path === path; } ) ||
                   ( searchHits || [] ).find( function( n ) { return n.path === path; } ) ||
                   null;
        }

        function isDir( node ) { return node && node.nodes !== null && node.nodes !== undefined; }

        function nameOf( node ) { return node.path === '' ? 'Drive' : node.path.split( '/' ).pop(); }

        // What the user reads. Same as nameOf() everywhere except in "Compartido
        // conmigo": there the path segment is a slug the server made ("Le Nord" ->
        // "le-nord"), so the grant's own title is shown instead. nameOf() stays the
        // ON-DISK name — copy-to and the zip writer must keep using that.
        function displayName( node )
        {
            return ( node && node.shared && node.shared.title ) || nameOf( node );
        }

        // An existing direct child of the open folder with this name, or null.
        // Nested upload paths ("sub/x") aren't in the one-level listing — those
        // fall through to the server's own overwrite guard.
        function currentChild( relPath )
        {
            if( relPath.indexOf( '/' ) !== -1 ) return null;
            return ( curListing.nodes || [] ).find( function( n ) { return nameOf( n ) === relPath; } ) || null;
        }

        //------------------------------------------------------------------------//
        // PANE RESIZER — drag the divider to set the tree-pane width (desktop only).
        // Width is stored in localStorage and applied as the --tree-w custom
        // property; the phone @media rule hard-codes its own width, so the sheet
        // layout is untouched. Double-click resets to the default.

        function initPaneResizer()
        {
            const rz  = document.getElementById( 'paneResizer' );
            const tp  = document.getElementById( 'treePane' );
            const KEY = 'drive-tree-width';
            const MIN = 140, MAX = 640, DEF = 250;

            const saved = parseInt( localStorage.getItem( KEY ), 10 );
            if( saved >= MIN && saved <= MAX )
                document.documentElement.style.setProperty( '--tree-w', saved + 'px' );

            let dragging = false, startX = 0, startW = 0;

            rz.addEventListener( 'pointerdown', function( e )
            {
                if( isPhone() ) return;
                dragging = true;
                startX   = e.clientX;
                startW   = tp.getBoundingClientRect().width;
                rz.setPointerCapture( e.pointerId );
                rz.classList.add( 'dragging' );
                document.body.style.userSelect = 'none';
            });

            rz.addEventListener( 'pointermove', function( e )
            {
                if( ! dragging ) return;
                let w = Math.round( startW + ( e.clientX - startX ) );
                w = Math.max( MIN, Math.min( MAX, w ) );
                document.documentElement.style.setProperty( '--tree-w', w + 'px' );
            });

            function endDrag()
            {
                if( ! dragging ) return;
                dragging = false;
                rz.classList.remove( 'dragging' );
                document.body.style.userSelect = '';
                try { localStorage.setItem( KEY, parseInt( tp.getBoundingClientRect().width, 10 ) ); } catch( _ ) {}
            }
            rz.addEventListener( 'pointerup', endDrag );
            rz.addEventListener( 'pointercancel', endDrag );

            rz.addEventListener( 'dblclick', function()
            {
                document.documentElement.style.setProperty( '--tree-w', DEF + 'px' );
                try { localStorage.setItem( KEY, DEF ); } catch( _ ) {}
            });
        }

        //------------------------------------------------------------------------//
        // RENDER

        function render()
        {
            document.body.classList.toggle( 'trash-mode', trashMode );
            document.getElementById( 'trashViewBtn' ).classList.toggle( 'is-active', trashMode );

            if( trashMode )
            {
                renderTrashBar();
                renderTrashListing();
                return;
            }

            renderTree();
            renderBreadcrumb();
            renderListing();
            updateToolbarState();
        }

        //------------------------------------------------------------------------//
        // TRASH VIEW ("Papelera")

        async function openTrash()
        {
            setStatus( T( 'drive.loadingTrash' ) );
            try
            {
                trashItems = await withBusy( GumApi.trashList() );
                try { trashDays = ( await GumApi.trashDays() ).days; }
                catch( _e ) { trashDays = null; }
                trashMode  = true;
                selectedPaths.clear();
                clearSearch();
                render();
                setStatus( '' );
            }
            catch( _ ) { setStatus( T( 'drive.trashOpenFailed' ) ); }
        }

        function closeTrash()
        {
            trashMode  = false;
            trashItems = [];
            render();
            reload();                        // refresh the tree + disk gauge
        }

        async function refreshTrash()
        {
            try { trashItems = await withBusy( GumApi.trashList() ); }
            catch( _ ) { trashItems = []; }
            render();
        }

        function renderTrashBar()
        {
            const host = document.getElementById( 'breadcrumb' );
            host.innerHTML = '';

            const bar = document.createElement( 'div' );
            bar.className = 'trash-bar';

            // "Back to Drive" - the left arrow every Nayive app uses to leave a screen.
            const back = document.createElement( 'button' );
            back.className = 'icon-btn';
            back.title     = T( 'drive.backToDrive' );
            back.setAttribute( 'aria-label', T( 'drive.backToDrive' ) );
            back.innerHTML = NayiveUI.icon( 'back' );
            back.addEventListener( 'click', closeTrash );
            bar.appendChild( back );

            const title = document.createElement( 'span' );
            title.className   = 'trash-title';
            title.textContent = T( 'acct.trash' ) + ( trashItems.length ? ' (' + trashItems.length + ')' : '' );
            bar.appendChild( title );

            if( trashDays != null )
            {
                const dwrap = document.createElement( 'label' );
                dwrap.className   = 'trash-days';
                dwrap.textContent = T( 'drive.deleteAfter' ) + ' ';

                const dinput = document.createElement( 'input' );
                dinput.type  = 'number';
                dinput.min   = '1';
                dinput.max   = '90';
                dinput.value = trashDays;
                dinput.addEventListener( 'change', async function()
                {
                    let v = parseInt( dinput.value, 10 );
                    if( ! Number.isFinite( v ) ) { dinput.value = trashDays; return; }
                    v = Math.max( 1, Math.min( 90, v ) );
                    try
                    {
                        const res = await GumApi.setTrashDays( v );
                        trashDays = res.days;
                        dinput.value = trashDays;
                        flashStatus( TF( 'drive.deleteAfterMsg', { n: trashDays } ) );
                    }
                    catch( _ ) { dinput.value = trashDays; setStatus( T( 'drive.saveFailedShort' ) ); }
                } );
                dwrap.appendChild( dinput );
                dwrap.appendChild( document.createTextNode( ' ' + T( 'acct.days' ) ) );

                const dinfo = document.createElement( 'button' );
                dinfo.className = 'info-dot';
                dinfo.setAttribute( 'data-info', T( 'drive.trashDaysInfo' ) );
                dwrap.appendChild( dinfo );
                if( window.NayiveUI ) NayiveUI.applyInfoDots( dwrap );

                bar.appendChild( dwrap );
            }

            const empty = document.createElement( 'button' );
            empty.className   = 'icon-btn danger';
            empty.title       = T( 'drive.emptyTrash' );
            empty.setAttribute( 'aria-label', T( 'drive.emptyTrash' ) );
            empty.innerHTML   = SVG_TRASH;
            empty.disabled    = ! trashItems.length;
            empty.addEventListener( 'click', emptyTrash );
            bar.appendChild( empty );

            host.appendChild( bar );
        }

        function renderTrashListing()
        {
            if( ! trashItems.length )
            {
                document.getElementById( 'listing' ).innerHTML =
                    '<div class="empty-hint" data-i18n="drive.trashEmptyMsg"></div>';
                return;
            }

            const host = listRowsHost();

            trashItems.forEach( function( item )
            {
                const row = document.createElement( 'div' );
                row.className = 'row';

                const ic = document.createElement( 'span' );
                ic.className = 'row-ic';
                ic.innerHTML = item.dir ? SVG_FOLDER : SVG_FILE;

                const label = document.createElement( 'span' );
                label.className   = 'row-name';
                label.textContent = item.name;

                const meta = document.createElement( 'span' );
                meta.className = 'row-meta';
                const where = fsRel( item.orig.indexOf( '/' ) !== -1
                                     ? item.orig.slice( 0, item.orig.lastIndexOf( '/' ) ) : '' ) || 'Drive';
                const bits = [ where, fmtDate( item.deleted ) ];
                if( ! item.dir ) bits.push( fmtSize( item.size ) );
                meta.textContent = bits.join( ' · ' );
                meta.title       = TF( 'drive.wasIn', { where: fsRel( item.orig ) || item.orig } );

                const actions = document.createElement( 'span' );
                actions.className = 'row-trash-actions';

                const restoreBtn = document.createElement( 'button' );
                restoreBtn.className = 'icon-btn sm';
                restoreBtn.title     = T( 'drive.restore' );
                restoreBtn.setAttribute( 'aria-label', T( 'drive.restore' ) );
                restoreBtn.innerHTML = SVG_RESTORE;
                restoreBtn.addEventListener( 'click', function() { restoreTrash( [ item.id ] ); } );

                const delBtn = document.createElement( 'button' );
                delBtn.className   = 'icon-btn sm danger';
                delBtn.title       = T( 'drive.deleteForever' );
                delBtn.setAttribute( 'aria-label', T( 'drive.deleteForever' ) );
                delBtn.innerHTML   = SVG_TRASH;
                delBtn.addEventListener( 'click', function() { purgeTrash( [ item.id ], item.name ); } );

                actions.appendChild( restoreBtn );
                actions.appendChild( delBtn );

                row.appendChild( ic );
                row.appendChild( label );
                row.appendChild( meta );
                row.appendChild( actions );
                host.appendChild( row );
            });
        }

        async function restoreTrash( ids )
        {
            setStatus( T( 'drive.restoring' ) );
            try
            {
                const res = await withBusy( GumApi.trashRestore( ids ) );
                await refreshTrash();
                if( res && res.renamed && res.renamed.length )
                    flashStatus( TF( 'drive.restoredAs', { name: res.renamed[0] } ) );
                else
                    flashStatus( T( 'drive.restored' ) );
            }
            catch( _ ) { setStatus( '' ); NayiveUI.toast( T( 'drive.restoreFailed' ) ); }
        }

        async function purgeTrash( ids, name )
        {
            if( ! await NayiveUI.confirm( {
                title: T( 'drive.deleteForever' ),
                body: TF( 'drive.deleteForeverBody', { name: name } ),
                confirm: T( 'drive.delete' ), danger: true } ) ) return;
            setStatus( T( 'drive.deleting' ) );
            try
            {
                await withBusy( GumApi.trashDelete( ids ) );
                await refreshTrash();
                flashStatus( T( 'drive.deletedForever' ) );
            }
            catch( _ ) { setStatus( '' ); NayiveUI.toast( T( 'drive.deleteFailedMsg' ) ); }
        }

        async function emptyTrash()
        {
            if( ! trashItems.length ) return;
            if( ! await NayiveUI.confirm( {
                title: T( 'drive.emptyTrashTitle' ),
                body: TF( 'drive.emptyTrashBody', { n: trashItems.length } ),
                confirm: T( 'drive.emptyTrash' ), danger: true } ) ) return;
            setStatus( T( 'drive.emptyingTrash' ) );
            try
            {
                await withBusy( GumApi.trashEmpty() );
                await refreshTrash();
                flashStatus( T( 'drive.trashEmptied' ) );
            }
            catch( _ ) { setStatus( '' ); NayiveUI.toast( T( 'drive.emptyTrashFailed' ) ); }
        }

        function renderTree()
        {
            const host = document.getElementById( 'treePane' );
            host.innerHTML = '';
            host.appendChild( buildTreeNode( findNode( FS_ROOT ) || dirTreeRoot, 0 ) );

            // Everything other people shared with us hangs off its own root, next
            // to Drive. It is a virtual folder (lib/shares.py) — the paths inside
            // it are real, they just point into someone else's home, read-only.
            const shared = findNode( 'shared' );
            if( shared ) host.appendChild( buildTreeNode( shared, 0, T( 'drive.sharedWithMe' ) ) );
        }

        function buildTreeNode( node, depth, rootLabel )
        {
            const wrap = document.createElement( 'div' );
            wrap.className = 'tree-node';

            const subDirs = (node.nodes || []).filter( isDir ).sort( function( a, b )
            {
                return displayName( a ).localeCompare( displayName( b ), NayiveUI.lang(), { sensitivity: 'base', numeric: true } );
            });
            const isOpen  = expandedFolders.has( node.path );

            const row = document.createElement( 'div' );
            // Only the open folder is highlighted: a folder selected in the list is
            // already shown there, and two lit rows here read as two open folders.
            row.className = 'tree-row'
                          + (node.path === currentFolder ? ' selected' : '')
                          + (kbdPane === 'tree' && node.path === kbdTreePath ? ' kbd' : '');
            row.dataset.path = node.path;

            const twisty = document.createElement( 'span' );
            twisty.className = 'twisty' + (subDirs.length ? (isOpen ? ' open' : '') : ' leaf');
            twisty.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
            twisty.addEventListener( 'click', function( e )
            {
                e.stopPropagation();
                if( ! subDirs.length ) return;
                if( isOpen ) expandedFolders.delete( node.path ); else expandedFolders.add( node.path );
                renderTree();
            });

            const folderIc = document.createElement( 'span' );
            folderIc.className = 'folder-ic';
            folderIc.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';

            const label = document.createElement( 'span' );
            label.className   = 'tree-name';
            label.textContent = depth === 0 ? (rootLabel || 'Drive') : displayName( node );

            row.appendChild( twisty );
            row.appendChild( folderIc );
            row.appendChild( label );

            // Every folder but the "Drive" root gets the same per-item actions the
            // right pane offers: right-click on desktop, a ⋮ button on touch, plus
            // drag-to-move. They act on this folder without navigating into it.
            if( depth > 0 )
            {
                const menuBtn = document.createElement( 'button' );
                menuBtn.className = 'icon-btn sm row-menu';
                menuBtn.title     = T( 'ui.actions' );
                menuBtn.setAttribute( 'aria-label', T( 'ui.actions' ) );
                menuBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>';
                menuBtn.addEventListener( 'click', function( e )
                {
                    e.stopPropagation();
                    const r = menuBtn.getBoundingClientRect();
                    openTreeMenuFor( node.path, r.right, r.bottom );
                });
                row.appendChild( menuBtn );

                row.addEventListener( 'contextmenu', function( e )
                {
                    e.preventDefault();
                    e.stopPropagation();
                    openTreeMenuFor( node.path, e.clientX, e.clientY );
                });

                makeDraggable( row, node );
            }

            row.addEventListener( 'click', function() { navigateTo( node.path ); } );
            makeDropTarget( row, function() { return node.path; } );

            wrap.appendChild( row );

            const childrenHost = document.createElement( 'div' );
            childrenHost.className = 'tree-children' + (isOpen ? ' open' : '');

            subDirs.forEach( function( c ) { childrenHost.appendChild( buildTreeNode( c, depth + 1 ) ); } );

            wrap.appendChild( childrenHost );

            return wrap;
        }

        function renderBreadcrumb()
        {
            const host = document.getElementById( 'breadcrumb' );
            host.innerHTML = '';

            // The "Drive" crumb doubles as the folder-tree opener on phone, so it is
            // always shown — even in search mode.
            const searching = !! searchQuery.trim();
            const rootCrumb = document.createElement( 'span' );
            rootCrumb.className   = 'crumb crumb-root' + (currentFolder === FS_ROOT && ! searching ? ' current' : '');
            rootCrumb.textContent = 'Drive';
            rootCrumb.addEventListener( 'click', function() { isPhone() ? openTreeSheet() : navigateTo( FS_ROOT ); } );
            host.appendChild( rootCrumb );

            if( searching )
            {
                const sep = document.createElement( 'span' );
                sep.className   = 'crumb-sep';
                sep.textContent = '/';
                host.appendChild( sep );

                const info = document.createElement( 'span' );
                info.className   = 'crumb current';
                info.textContent = TF( 'movies.resultsFor', { q: searchQuery.trim() } );
                host.appendChild( info );
                return;
            }

            // "shared/..." is not under FS_ROOT (files/): it is the other virtual
            // root, so its crumbs are built from the real path, and the first
            // segment is shown by its Spanish name.
            const inShared = currentFolder === 'shared' || currentFolder.indexOf( 'shared/' ) === 0;
            const segs  = splitPath( inShared ? currentFolder : fsRel( currentFolder ) );
            let   accum = inShared ? '' : FS_ROOT;

            segs.forEach( function( seg, i )
            {
                accum = accum ? accum + '/' + seg : seg;
                const path = accum;

                const sep = document.createElement( 'span' );
                sep.className   = 'crumb-sep';
                sep.textContent = '/';
                host.appendChild( sep );

                const crumb = document.createElement( 'span' );
                crumb.className   = 'crumb' + (i === segs.length - 1 ? ' current' : '');
                // "shared" -> its Spanish name; "shared/<slug>" -> the grant's real
                // title ("le-nord" -> "Le Nord"); anything deeper is a real folder
                // name already.
                crumb.textContent = inShared
                                  ? ( i === 0 ? T( 'drive.sharedWithMe' )
                                    : i === 1 ? displayName( rowNode( path ) || { path: path } )
                                    : seg )
                                  : seg;
                crumb.addEventListener( 'click', function() { navigateTo( path ); } );
                host.appendChild( crumb );
            });
        }

        // True while the open folder is one somebody shared with us AND they let us
        // add files to it. Answered by the grant (NayiveUI.canAddTo -> /api/shares,
        // fetched once per page), so it lands a moment after the folder does — the
        // toolbar is repainted when it arrives.
        let canAddHere = false;

        function refreshCanAdd( path )
        {
            canAddHere = false;
            updateToolbarState();
            NayiveUI.canAddTo( path ).then( function( yes )
            {
                if( path !== currentFolder ) return;    // navigated on while we asked
                canAddHere = yes;
                updateToolbarState();
            } );
        }

        function navigateTo( path )
        {
            currentFolder = path;
            expandedFolders.add( path );
            if( kbdPane === 'tree' ) kbdTreePath = path;
            selectedPaths.clear();
            clearSearch();
            if( isPhone() ) closeTreeSheet();
            loadListing( path );                // renders now, and again when the folder arrives
        }

        // Fetch the open folder's own contents (one level). Renders a "Cargando…"
        // hint immediately, then the rows. A newer navigation supersedes an
        // in-flight one via listingSeq.
        async function loadListing( path )
        {
            const seq = ++listingSeq;
            listingLoading = true;
            refreshCanAdd( path );      // every route into a folder passes here
            render();

            try
            {
                const r = await GumApi.listDir( path );
                if( seq !== listingSeq ) return;
                curListing     = { path: path, nodes: pruneNodes( r.nodes || [] ) };
                listingLoading = false;
                render();
            }
            catch( err )
            {
                if( seq !== listingSeq ) return;
                listingLoading = false;
                curListing = { path: path, nodes: [] };
                render();
                if( String( err && err.message ).indexOf( '401' ) >= 0 ) { GumApi.loginRedirect(); return; }
                NayiveUI.toast( T( 'drive.openFolderFailed' ) );
            }
        }

        function clearSearch()
        {
            searchQuery     = '';
            searchHits      = null;
            searchTruncated = false;
            if( searchTimer ) { clearTimeout( searchTimer ); searchTimer = null; }
            const el = document.getElementById( 'searchInput' );
            if( el ) el.value = '';
        }

        //------------------------------------------------------------------------//
        // KEYBOARD NAVIGATION
        //   Left / Right : move the cursor between the folder tree and the file list
        //   Up   / Down  : move the highlight within the focused pane
        //   Enter        : open the highlighted item (tree: go into the folder;
        //                  list: navigate a folder / open a file)

        function kbdTreeRows() { return Array.from( document.querySelectorAll( '#treePane .tree-row' ) ); }
        function kbdListRows() { return Array.from( document.querySelectorAll( '#listing .row'   ) ); }

        function paintKbdPane()
        {
            document.body.classList.toggle( 'kbd-tree', kbdPane === 'tree' );
            document.body.classList.toggle( 'kbd-list', kbdPane === 'list' );
        }

        function focusPane( which )
        {
            if( isPhone() || trashMode ) return;
            kbdPane = which;

            if( which === 'tree' )
            {
                const rows = kbdTreeRows();
                if( ! rows.length ) { kbdPane = 'list'; return; }
                if( ! rows.some( function( r ) { return r.dataset.path === kbdTreePath; } ) )
                    kbdTreePath = rows.some( function( r ) { return r.dataset.path === currentFolder; } )
                                ? currentFolder : rows[0].dataset.path;
                renderTree();
                scrollKbdIntoView( kbdTreeRows().find( function( r ) { return r.dataset.path === kbdTreePath; } ) );
            }
            else
            {
                renderTree();                    // drop the tree's keyboard cursor
                const rows = kbdListRows();
                if( rows.length && ! rows.some( function( r ) { return selectedPaths.has( r.dataset.path ); } ) )
                {
                    selectedPaths.clear();
                    selectedPaths.add( rows[0].dataset.path );
                    paintSelection();
                    updateToolbarState();
                }
                scrollKbdIntoView( kbdListRows().find( function( r ) { return selectedPaths.has( r.dataset.path ); } ) );
            }

            paintKbdPane();
        }

        function scrollKbdIntoView( el ) { if( el ) el.scrollIntoView( { block: 'nearest', inline: 'nearest' } ); }

        function kbdTreeMove( dir, activate )
        {
            const rows  = kbdTreeRows();
            if( ! rows.length ) return;
            const paths = rows.map( function( r ) { return r.dataset.path; } );
            let i = paths.indexOf( kbdTreePath );

            if( activate )
            {
                if( i >= 0 ) { kbdTreePath = paths[i]; navigateTo( paths[i] ); paintKbdPane(); }
                return;
            }

            i = i < 0 ? 0 : Math.min( Math.max( i + dir, 0 ), rows.length - 1 );
            kbdTreePath = paths[i];
            renderTree();
            scrollKbdIntoView( kbdTreeRows()[i] );
        }

        function kbdListMove( dir, activate )
        {
            const rows  = kbdListRows();
            if( ! rows.length ) return;
            const paths = rows.map( function( r ) { return r.dataset.path; } );
            const here  = paths.filter( function( p ) { return selectedPaths.has( p ); } );
            let i = here.length ? paths.indexOf( here[here.length - 1] ) : -1;

            if( activate )
            {
                if( i >= 0 ) openNode( rowNode( paths[i] ) );
                return;
            }

            i = i < 0 ? 0 : Math.min( Math.max( i + dir, 0 ), rows.length - 1 );
            selectedPaths.clear();
            selectedPaths.add( paths[i] );
            paintSelection();
            updateToolbarState();
            scrollKbdIntoView( rows[i] );
        }

        //------------------------------------------------------------------------//
        // KEYBOARD SHORTCUTS
        //
        // Only the six things a person does most in Drive get one — buscar, nueva
        // carpeta, subir, descargar, renombrar y enviar a la papelera. The table
        // below is the single source of truth: the same entry matches the keypress
        // AND builds the "· Ctrl+F" that button's tooltip ends in, so the keys and
        // what the tooltips promise can never drift apart.
        //
        // Nothing here happens on a phone: no keyboard, and a title there is also
        // the ⋮ menu's label and the help card's name, so the hints come off too.

        const IS_MAC = /Mac|iPhone|iPad|iPod/.test( navigator.platform || navigator.userAgent || '' );

        // "Ctrl+F" on a PC, "⌘F" on a Mac. The modifier NAMES are translated
        // (Strg / Entf in German, Supr in Spanish); the Mac glyphs are the same
        // in every language, so they stay literal.
        const HINT_SEP = ' · ';                                   // "Renombrar · F2"
        function combo( parts ) { return parts.join( IS_MAC ? '' : '+' ); }
        function kMod() { return IS_MAC ? '⌘' : T( 'ui.keyCtrl' ); }   // ⌘ / Ctrl
        function kAlt() { return IS_MAC ? '⌥' : T( 'ui.keyAlt'  ); }   // ⌥ / Alt

        // The Ctrl of the platform, and nothing else held down. e.code (not e.key)
        // because e.key is what the LAYOUT produces: Ctrl+F on a Cyrillic keyboard
        // reads as "ф", and Mac's ⌥N types a dead "˜".
        function modOnly( e )
        {
            return ( IS_MAC ? ( e.metaKey && ! e.ctrlKey ) : ( e.ctrlKey && ! e.metaKey ) )
                   && ! e.altKey && ! e.shiftKey;
        }
        function bare( e ) { return ! e.ctrlKey && ! e.metaKey && ! e.altKey && ! e.shiftKey; }

        const SHORTCUTS = [
            // Ctrl+F is the one key that also works from inside a text box — that
            // is where the browser's own find bar would have opened.
            { el: 'searchInput', label: () => combo( [ kMod(), 'F' ] ), inField: true,
              match: e => modOnly( e ) && e.code === 'KeyF',
              run:   focusSearch },

            // Ctrl+Shift+N is Chrome's incognito window and cannot be taken away
            // from it, so nueva carpeta gets Alt+N instead.
            { el: 'newFolderBtn', label: () => combo( [ kAlt(), 'N' ] ),
              match: e => e.altKey && ! e.ctrlKey && ! e.metaKey && ! e.shiftKey && e.code === 'KeyN' },

            { el: 'uploadBtn',   label: () => combo( [ kMod(), 'U' ] ),
              match: e => modOnly( e ) && e.code === 'KeyU' },

            { el: 'downloadBtn', label: () => combo( [ kMod(), 'D' ] ),
              match: e => modOnly( e ) && e.code === 'KeyD' },

            { el: 'renameBtn',   label: () => 'F2',
              match: e => e.key === 'F2' && bare( e ) },

            // The button, with nothing ticked, sends the WHOLE OPEN FOLDER to the
            // papelera. A stray Supr must never do that, so the key acts only on a
            // selection.
            { el: 'deleteBtn',   label: () => T( 'ui.keyDel' ), needsSelection: true,
              match: e => e.key === 'Delete' && bare( e ) }
        ];

        function focusSearch()
        {
            const box = document.getElementById( 'searchInput' );
            box.focus();
            box.select();
        }

        // Hangs " · Ctrl+F" off each shortcut button's tooltip — and takes it off
        // again on a phone. A middle dot rather than parentheses: the search tip
        // already ends in "(uno)". Idempotent, because updateToolbarState rewrites
        // some of these titles ("Descargar selección") on every selection change
        // and calls us right after.
        function applyKeyHints()
        {
            const phone = isPhone();

            for( const s of SHORTCUTS )
            {
                const el = document.getElementById( s.el );
                if( ! el ) continue;

                const hint = HINT_SEP + s.label();
                let   t    = el.getAttribute( 'title' ) || '';

                if( t.slice( -hint.length ) === hint ) t = t.slice( 0, -hint.length );
                if( ! t ) continue;                    // no tooltip yet: nothing to hang the hint on

                el.setAttribute( 'title', phone ? t : t + hint );
            }
        }

        // The tooltip a shortcut button carries is also what the phone's ⋮ menu
        // labels its row with (updateTopMenuState); strip the hint there in case
        // a desktop window was just narrowed into the phone layout.
        function stripKeyHint( title )
        {
            for( const s of SHORTCUTS )
            {
                const hint = HINT_SEP + s.label();
                if( title.slice( -hint.length ) === hint ) return title.slice( 0, -hint.length );
            }
            return title;
        }

        // A checkbox is not a text field: ticking rows and then pressing Supr is
        // exactly how a person deletes, so that one keeps working.
        function inTextField( t )
        {
            const f = ( t && t.closest ) ? t.closest( 'input, textarea, select, [contenteditable]' ) : null;
            return !! f && f.type !== 'checkbox';
        }

        function onShortcutKey( e )
        {
            const s = SHORTCUTS.find( function( x ) { return x.match( e ); } );
            if( ! s ) return;

            if( isPhone() || trashMode ) return;
            if( anyCtxMenuOpen() ) return;
            // A dialog, the viewer, the player or the image editor owns the screen:
            // the toolbar behind it is not what the key is for.
            if( document.querySelector( '.sheet-backdrop.open, .viewer-backdrop.open, .media-backdrop.open, .editor-backdrop.open' ) ) return;
            if( ! s.inField && inTextField( e.target ) ) return;

            // Swallowed even when the action itself cannot run, so the browser's
            // find bar / view-source / bookmark never appears over Drive.
            e.preventDefault();

            if( s.run ) { s.run(); return; }

            const btn = document.getElementById( s.el );
            if( ! btn || btn.disabled ) return;
            if( s.needsSelection && ! selectedPaths.size ) return;

            btn.click();                               // one path in, same as the ⋮ menu takes
        }

        function onNavKey( e )
        {
            if( e.ctrlKey || e.metaKey || e.altKey || e.shiftKey ) return;
            if( [ 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter' ].indexOf( e.key ) === -1 ) return;

            const t = e.target;
            if( t && t.closest && t.closest( 'input, textarea, button, a, select, [contenteditable]' ) ) return;
            if( isPhone() || trashMode ) return;
            if( anyCtxMenuOpen() ) return;
            if( document.querySelector( '.sheet-backdrop.open, .viewer-backdrop.open, .media-backdrop.open, .editor-backdrop.open' ) ) return;

            if( e.key === 'ArrowLeft'  ) { e.preventDefault(); focusPane( 'tree' ); return; }
            if( e.key === 'ArrowRight' ) { e.preventDefault(); focusPane( 'list' ); return; }

            e.preventDefault();
            const dir      = e.key === 'ArrowDown' ? 1 : -1;
            const activate = e.key === 'Enter';
            if( kbdPane === 'tree' ) kbdTreeMove( dir, activate );
            else                     kbdListMove( dir, activate );
            paintKbdPane();
        }

        // A plain word searches as a substring; a query with * or ? is an
        // anchored wildcard — the rule the search box has always shown. Either
        // way we hand the server a shell glob and it matches basenames,
        // case-insensitive (GET /api/files?find=).
        function buildPattern( raw )
        {
            const q = (raw || '').trim();
            if( ! q ) return null;
            return (q.indexOf( '*' ) !== -1 || q.indexOf( '?' ) !== -1) ? q : ('*' + q + '*');
        }

        async function runSearch()
        {
            const pattern = buildPattern( searchQuery );
            if( ! pattern )
            {
                searchHits = null;
                searchTruncated = false;
                render();
                return;
            }

            const seq = ++searchSeq;
            try
            {
                const r = await GumApi.find( pattern );
                if( seq !== searchSeq ) return;          // a newer query already went out
                searchHits      = pruneNodes( r.nodes || [] );
                searchTruncated = !! r.truncated;
                render();
            }
            catch( err )
            {
                if( seq !== searchSeq ) return;
                searchHits = [];
                searchTruncated = false;
                render();
                NayiveUI.toast( T( 'drive.searchFailed' ) );
            }
        }

        // Rows live in a .list-rows wrapper so the wrapper can grow to the widest
        // row (width: max-content) and the #listing box scrolls it horizontally,
        // while every row's hover / border still spans the full width.
        function listRowsHost()
        {
            const host = document.getElementById( 'listing' );
            host.innerHTML = '';
            const rows = document.createElement( 'div' );
            rows.className = 'list-rows';
            host.appendChild( rows );
            return rows;
        }

        function renderListing()
        {
            const box = document.getElementById( 'listing' );

            if( searchQuery.trim() )
            {
                if( searchHits === null )                 // still waiting on the server
                {
                    box.innerHTML = '<div class="empty-hint" data-i18n="drive.searching"></div>';
                    return;
                }

                const hits = searchHits.slice().sort( function( a, b )
                {
                    const da = isDir( a ), db = isDir( b );
                    if( da !== db ) return da ? -1 : 1;                 // folders first
                    return a.path.localeCompare( b.path );
                });

                if( ! hits.length )
                {
                    box.innerHTML = '';
                    const hint = document.createElement( 'div' );
                    hint.className   = 'empty-hint';
                    hint.textContent = TF( 'drive.noResultsFor', { q: searchQuery.trim() } );
                    box.appendChild( hint );
                    return;
                }

                const host = listRowsHost();
                if( searchTruncated )
                {
                    const note = document.createElement( 'div' );
                    note.className   = 'empty-hint';
                    note.textContent = TF( 'drive.tooManyResults', { n: hits.length } );
                    box.insertBefore( note, host );
                }
                hits.forEach( function( child ) { host.appendChild( buildListRow( child, true ) ); } );
                return;
            }

            if( listingLoading )
            {
                box.innerHTML = '<div class="empty-hint" data-i18n="ui.loading"></div>';
                return;
            }

            const kids = curListing.nodes.slice().sort( function( a, b )
            {
                const da = isDir( a ), db = isDir( b );
                if( da !== db ) return da ? -1 : 1;                 // folders first
                return displayName( a ).localeCompare( displayName( b ), NayiveUI.lang(), { sensitivity: 'base', numeric: true } );
            });

            if( ! kids.length )
            {
                box.innerHTML = '<div class="empty-hint" data-i18n="drive.emptyFolderHint"></div>';
                return;
            }

            const host = listRowsHost();
            kids.forEach( function( child )
            {
                host.appendChild( buildListRow( child ) );
            });
        }

        // Icons shown in the listing. The document / spreadsheet / code glyphs are the
        // Write, Calc and Text app marks, so a row looks like the tool that opens it.
        const SVG_FOLDER = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';
        // Trash-view action glyphs: close, restore, permanent delete.
        const SVG_RESTORE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>';
        const SVG_TRASH   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';

        const SVG_PDF    = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><text x="12" y="18.5" font-size="7" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">PDF</text></svg>';
        const SVG_CODE   = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>';
        const SVG_IMAGE  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>';
        const SVG_VIDEO  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="16" rx="2"></rect><polygon points="22 7 16 11 16 13 22 17"></polygon><polygon points="7 9 11 12 7 15" fill="currentColor" stroke="none"></polygon></svg>';
        const SVG_AUDIO  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>';
        // Only used inside "Compartido conmigo": the Photos and Trips launcher
        // glyphs, so a shared album / trip looks like the app that opens it.
        const SVG_PHOTOS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="16" height="16" rx="2"></rect><circle cx="12" cy="8" r="2"></circle><path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18"></path><path d="M18 22H4a2 2 0 0 1-2-2V6"></path></svg>';
