<!-- index.html - Personal file explorer (multi-user; talks to the server's
     /api/files endpoints: tree, read/write, mkdir, rename/move, trash).

     A move / rename / copy / delete here also keeps the media apps' path-keyed
     sidecars in step so they never drift: the photo comments
     (data/photos/comments.json) and the Photos + Music scan caches
     (data/<app>/scan-cache.json). Drive only says WHAT moved - the files
     themselves belong to those apps, so the upkeep lives in shared/media.js:
     NayiveMedia.remapPaths() / .copyPaths() / .purgePaths(). -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Drive</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='12' cy='5' rx='9' ry='3'%3E%3C/ellipse%3E%3Cpath d='M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3'%3E%3C/path%3E%3Cpath d='M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5'%3E%3C/path%3E%3C/svg%3E">

    <!-- Shared colour scheme (dark default, opt-in light). The choice is shared by every app; set it from the launcher's "Esquemas de color" dialog. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>

    <!-- Vendored libs (all pinned, no build step). -->
    <script src="lib/zipjs_v2.8.60.min.js"></script>

    <!-- Gum file-API helpers: HMAC signing, the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/photo.js" defer></script>
    <!-- The media apps' own module. Drive uses one block of it: the upkeep of
         their path-keyed sidecars when a file is moved, renamed, copied or
         trashed. Deferred is fine here (this page's script is a module and
         calls NayiveMedia only after DOMContentLoaded); the media apps
         themselves must NOT defer it. -->
    <script src="../shared/media.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'drive',
            title: 'Drive',
            lead:  NayiveUI.t( 'drive.introLead' ),
            buttons: [
                { sel: '#searchToggleBtn', icon: 'textcursor', text: NayiveUI.t( 'drive.introSearch' ) },
                { sel: '#searchBuilderBtn', text: NayiveUI.t( 'drive.introSearchBuilder' ) },
                { sel: '#newFolderBtn',    text: NayiveUI.t( 'drive.introNewFolder' ) },
                { sel: '#uploadBtn',       text: NayiveUI.t( 'drive.introUpload' ) },
                { sel: '#downloadBtn',     text: NayiveUI.t( 'drive.introDownload' ) },
                { sel: '#renameBtn',       text: NayiveUI.t( 'drive.introRename' ) },
                { sel: '#moveToBtn',       text: NayiveUI.t( 'drive.introMove' ) },
                { sel: '#copyToBtn',       text: NayiveUI.t( 'drive.introCopy' ) },
                { sel: '#copyLinkBtn',     text: NayiveUI.t( 'drive.introLink' ) },
                { sel: '#shareBtn',        text: NayiveUI.t( 'drive.introShare' ) },
                { sel: '#deleteBtn',       text: NayiveUI.t( 'drive.introTrash' ) },
                // A fixed name: the bin's tooltip turns into "Back to Drive"
                // while the bin is open (render in tree.js).
                // Fixed names: both tooltips turn into "Back to Drive" while
                // their view is open (render in tree.js).
                { sel: '#bigFilesBtn', name: NayiveUI.t( 'drive.bigTitle' ),
                  text: NayiveUI.t( 'drive.introBigFiles' ) },
                { sel: '#trashViewBtn', name: NayiveUI.t( 'acct.trash' ),
                  text: NayiveUI.t( 'drive.introOpenTrash' ) },
                { sel: '#moreBtn',         text: NayiveUI.t( 'drive.introMore' ) },
                { sel: '#syncIndicator', name: NayiveUI.t( 'ui.syncName' ),
                  text: NayiveUI.t( 'drive.introSync' ) }
            ]
        } );
    } );
    </script>

    <link rel="stylesheet" href="drive.css">
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <div class="brand">
                <div class="brand-row">
                    <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path></svg>
                    <h1>Drive</h1>
                </div>
                <div id="diskBar" class="disk-bar" hidden data-i18n-attr="title:drive.diskUse"><i></i></div>
            </div>

            <!-- The magnifier inside the box opens the advanced search: name
                 rules, kinds and dates, no wildcards to learn (advsearch.js). -->
            <div class="search-wrap">
                <input type="search" id="searchInput" class="topbar-search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:drive.searchPh, title:drive.searchTip">
                <!-- Stands in for the box while an advanced search is in force (advsearch.js). -->
                <button id="advChip" type="button" class="adv-chip" hidden>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    <span id="advChipText"></span>
                </button>
                <button id="searchBuilderBtn" class="icon-btn sm" data-i18n-attr="title:drive.sbTitle">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <button id="searchToggleBtn" class="icon-btn" data-i18n-attr="title:ui.search">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>

            <div class="sep"></div>

            <button id="newFolderBtn" class="icon-btn" data-i18n-attr="title:ui.newFolder">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
            </button>
            <button id="uploadBtn" class="icon-btn" data-i18n-attr="title:drive.uploadTip">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>
            <input type="file" id="uploadInput" multiple style="display:none">
            <input type="file" id="uploadDirInput" webkitdirectory multiple style="display:none">
            <input type="file" id="uploadPhotoInput" accept="image/*" multiple style="display:none">
            <button id="downloadBtn" class="icon-btn" disabled data-i18n-attr="title:drive.downloadFolderOrSel">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>

            <!-- WHAT YOU DO TO WHAT IS SELECTED: the ticked rows, or the
                 folder open in the tree. The whole group - its rule included -
                 leaves the bar only at the Drive root with nothing ticked;
                 with just the open folder, Rename / Move / Copy stay off and
                 Link / Share / Delete show. display: contents, so the buttons
                 still lay themselves out as children of the .topbar; the
                 hidden attribute takes all of them at once
                 (updateToolbarState in toolbar.js). -->
            <div id="selActions" hidden>
                <div class="sep"></div>

                <button id="renameBtn" class="icon-btn" disabled data-i18n-attr="title:ui.rename">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                </button>
                <button id="moveToBtn" class="icon-btn" data-i18n-attr="title:drive.moveToDots" disabled>
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H2"></path><path d="M2 13h11"></path><path d="m10 16 3-3-3-3"></path></svg>
                </button>
                <button id="copyToBtn" class="icon-btn" data-i18n-attr="title:drive.copyToDots" disabled>
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
                <button id="copyLinkBtn" class="icon-btn" data-i18n-attr="title:drive.copyLink" disabled>
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </button>
                <button id="shareBtn" class="icon-btn" disabled data-i18n-attr="title:drive.shareWith">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>
                </button>
                <button id="deleteBtn" class="icon-btn danger" disabled data-i18n-attr="title:ui.toTrash">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>

                
            </div>

            <span id="statusLabel" class="status-label"></span>

            <!-- "Biggest files" on/off, like the bin next to it: lit while the
                 list is open, and a second tap goes back (listing.js). -->
            <button id="bigFilesBtn" class="icon-btn" data-i18n-attr="title:drive.bigTitle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path><path d="M11 4h10"></path><path d="M11 8h7"></path><path d="M11 12h4"></path></svg>
            </button>
            <button id="trashViewBtn" class="icon-btn" data-i18n-attr="title:acct.trash">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <!-- Phone only: the buttons above that a phone reaches for least
                 (see B6b in the phone block). Its entries are cloned from them. -->
            <button id="moreBtn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-attr="title:ui.moreOptions, aria-label:ui.moreOptions">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>
            </button>
            <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </button>
            <button id="syncIndicator" class="sync-indicator synced" type="button" data-i18n-attr="title:ui.synced"></button>
        </div>

        <div class="body-row">
            <div id="treeBackdrop" class="tree-backdrop"></div>
            <div id="treePane" class="tree-pane"></div>
            <div id="paneResizer" class="pane-resizer" data-i18n-attr="title:drive.dragWidth"></div>

            <div id="listPane" class="list-pane">
                <div id="breadcrumb" class="breadcrumb"></div>
                <div id="listing" class="listing"></div>
                <div id="dropCover" class="drop-cover"><span data-i18n="drive.dropHere"></span></div>
            </div>
        </div>

    </div>

    <!-- Per-item menu: desktop right-click, or the row's ⋮ button (touch). Acts on the selection. -->
    <!-- The header's "⋮" (phone). Same component as the row menus below; its
         entries are built in JS from the toolbar buttons they stand for. -->
    <div id="topMenu" class="ctx-menu top-menu"></div>

    <div id="ctxMenu" class="ctx-menu top-menu">
        <button class="menu-item" id="ctxOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg><span data-i18n="drive.open"></span></button>
        <button class="menu-item" id="ctxDownload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span data-i18n="ui.download"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="ctxCut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg><span data-i18n="ui.cut"></span></button>
        <button class="menu-item" id="ctxClip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg><span data-i18n="ui.copy"></span></button>
        <button class="menu-item" id="ctxMove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9V5a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H2"></path><path d="M2 13h11"></path><path d="m10 16 3-3-3-3"></path></svg><span data-i18n="drive.moveToDots"></span></button>
        <button class="menu-item" id="ctxCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span data-i18n="drive.copyToDots"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" id="ctxRename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg><span data-i18n="ui.rename"></span></button>
        <button class="menu-item" id="ctxLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><span data-i18n="drive.copyLink"></span></button>
        <button class="menu-item" id="ctxProps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg><span data-i18n="drive.properties"></span></button>
        <div class="menu-sep"></div>
        <button class="menu-item danger" id="ctxDelete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span data-i18n="ui.toTrash"></span></button>
    </div>

    <!-- Desktop right-click on empty space in the listing -->
    <div id="ctxAreaMenu" class="ctx-menu top-menu">
        <button class="menu-item" id="ctxAreaNewFolder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg><span data-i18n="ui.newFolder"></span></button>
        <button class="menu-item" id="ctxAreaPaste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14l2 2 4-4"></path></svg><span data-i18n="ui.paste"></span></button>
    </div>

    <!-- Folder chooser: destination for "Mover a…" / "Copiar a…" -->
    <div id="pickFolderBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="pickFolderTitle" data-i18n="drive.moveTo"></h2>
            <p id="pickFolderMsg"></p>
            <div id="pickFolderTree" class="tree-picker"></div>
            <div class="sheet-actions">
                <button id="pickFolderCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="pickFolderConfirmBtn" data-act="primary" data-i18n-attr="title:drive.move"></button>
            </div>
        </div>
    </div>

    <!-- Upload dialog: drop hint + pick-with-a-dialog choices (file / folder) -->
    <div id="uploadBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="ui.upload"></h2>
            <p><span data-i18n="drive.dragDropHint"></span><br><span data-i18n="drive.orPickBelow"></span></p>
            <div class="upload-choices">
                <button id="uploadPickPhotosBtn" class="upload-choice upload-choice-photos">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-4.5-4.5L3 21"></path></svg>
                    <span data-i18n="trips.photos"></span>
                </button>
                <button id="uploadPickFilesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <span data-i18n="ui.filesRoot"></span>
                </button>
                <button id="uploadPickDirBtn" class="upload-choice upload-choice-dir">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="drive.folder"></span>
                </button>
            </div>
            <p class="upload-note" data-i18n="drive.uploadNote"></p>
            <div class="sheet-actions">
                <button id="uploadCancelBtn" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Advanced search (advsearch.js): name rules, kinds and a date window,
         with a live count. The rows and the pills are built by the script. -->
    <div id="searchBuilderBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--wide">
            <h2 data-i18n="drive.sbTitle"></h2>
            <div class="field">
                <label><span data-i18n="drive.sbName"></span> <span class="sb-hint" data-i18n="drive.sbNote"></span></label>
                <div id="sbRules" class="sb-rules"></div>
                <div class="sb-rule-bar">
                    <button id="sbAddRule" type="button" class="text-btn dashed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span data-i18n="drive.sbAddRule"></span>
                    </button>
                    <div id="sbModeRow" class="sb-mode" hidden>
                        <span data-i18n="drive.sbMustMatch"></span>
                        <div id="sbMode" class="sb-pills"></div>
                    </div>
                </div>
            </div>
            <div class="field">
                <label><span data-i18n="drive.sbKinds"></span> <span class="sb-hint" data-i18n="drive.sbKindsHint"></span></label>
                <div id="sbKinds" class="sb-pills"></div>
            </div>
            <div class="field">
                <label data-i18n="drive.sbWhen"></label>
                <div id="sbWhen" class="sb-pills"></div>
                <div id="sbRange" class="field-row sb-range" hidden>
                    <div class="field">
                        <label for="sbFrom" data-i18n="drive.sbFrom"></label>
                        <div class="dt-field"><input type="date" id="sbFrom"><span class="dt-display"></span></div>
                    </div>
                    <div class="field">
                        <label for="sbTo" data-i18n="drive.sbTo"></label>
                        <div class="dt-field"><input type="date" id="sbTo"><span class="dt-display"></span></div>
                    </div>
                </div>
            </div>
            <div class="sb-result">
                <div id="sbCount" class="sb-count" hidden></div>
                <p id="sbSummary" class="share-note"></p>
            </div>
            <div class="sheet-actions">
                <button id="sbClearBtn" type="button" class="text-btn ghost sheet-actions-left" data-i18n="drive.sbClear"></button>
                <button id="sbCancelBtn" data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="sbSearchBtn" data-act="primary:search" data-i18n-attr="title:ui.search"></button>
            </div>
        </div>
    </div>

    <!-- New folder dialog -->
    <div id="newFolderBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="ui.newFolder"></h2>
            <div class="field">
                <input type="text" id="newFolderName" autocomplete="off" data-i18n-attr="placeholder:drive.folderNamePh">
            </div>
            <div class="sheet-actions">
                <button id="newFolderCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="newFolderConfirmBtn" data-act="primary" data-i18n-attr="title:drive.create"></button>
            </div>
        </div>
    </div>

    <!-- Rename dialog -->
    <div id="renameBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="ui.rename"></h2>
            <div class="field">
                <input type="text" id="renameName" autocomplete="off" data-i18n-attr="aria-label:drive.newName">
            </div>
            <div class="sheet-actions">
                <button id="renameCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="renameConfirmBtn" data-act="primary" data-i18n-attr="title:ui.rename"></button>
            </div>
        </div>
    </div>

    <!-- Properties dialog (right-click -> "Propiedades"). Read-only: one close button. -->
    <div id="propsBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="drive.properties"></h2>
            <dl id="propsBody" class="props"></dl>
            <div class="sheet-actions">
                <button id="propsCloseBtn" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Move-to-trash confirm dialog -->
    <div id="deleteBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="ui.toTrash"></h2>
            <p id="deleteMsg"></p>
            <p id="deleteFolderWarn" style="text-transform:uppercase;font-weight:700" hidden></p>
            <div class="sheet-actions">
                <button id="deleteCancelBtn"  data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="deleteConfirmBtn" data-act="primary:trash" data-i18n-attr="title:ui.toTrash"></button>
            </div>
        </div>
    </div>

    <!-- Upload: warn before overwriting files that already exist at the destination -->
    <div id="replaceBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="replaceTitle" data-i18n="drive.alreadyExist"></h2>
            <p id="replaceMsg"></p>
            <ul id="replaceList" class="replace-list"></ul>
            <label id="replaceOptWrap" class="replace-opt">
                <input type="checkbox" id="replaceOverwrite">
                <span data-i18n="drive.replaceExisting"></span>
            </label>
            <div class="sheet-actions">
                <button id="replaceCancelBtn"  data-act="close" data-i18n-attr="title:ui.cancel"></button>
                <button id="replaceConfirmBtn" data-act="primary" data-i18n-attr="title:drive.continue"></button>
            </div>
        </div>
    </div>

    <!-- Upload: videos a browser cannot play. Convert them to MP4 on the server?
         (server/go/convert.go; asked before anything is sent) -->
    <div id="convertBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="drive.convertTitle"></h2>
            <ul id="convertList" class="replace-list"></ul>
            <p data-i18n="drive.convertMsg"></p>
            <p id="convertNoPush" class="convert-nopush" hidden>
                <span data-i18n="drive.convertNoPush"></span>
                <button id="convertPushBtn" class="link-btn" data-i18n="drive.convertPushLink"></button>
            </p>
            <div class="upload-choices">
                <button id="convertYesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="16" rx="2"></rect><line x1="6" y1="4" x2="6" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line><path d="M19 9a3 3 0 0 1 0 6"></path><polyline points="21 13 19 15 17 13"></polyline></svg>
                    <span data-i18n="drive.convertYes"></span>
                </button>
                <button id="convertNoBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span data-i18n="drive.convertNo"></span>
                </button>
            </div>
            <div class="sheet-actions">
                <button id="convertCancelBtn" data-act="close" data-i18n-attr="title:ui.cancel"></button>
            </div>
        </div>
    </div>

    <!-- Built-in image viewer (lightbox) -->
    <div id="viewerBackdrop" class="viewer-backdrop">
        <button id="viewerCloseBtn" class="editor-btn viewer-close" data-i18n-attr="title:ui.close, aria-label:ui.close">&times;</button>
        <img id="viewerImg" alt="">
        <span id="viewerName" class="viewer-name"></span>
    </div>

    <!-- Built-in audio / video player -->
    <div id="mediaBackdrop" class="media-backdrop">
        <button id="mediaCloseBtn" class="editor-btn viewer-close" data-i18n-attr="title:ui.close, aria-label:ui.close">&times;</button>
        <video id="mediaVideo" controls playsinline hidden></video>
        <div id="mediaAudioBox" class="media-audio-box" hidden>
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <audio id="mediaAudio" controls></audio>
        </div>
        <span id="mediaName" class="viewer-name"></span>
    </div>

    <!-- Indeterminate progress dialog (shown while Drive builds a ZIP) -->
    <div id="progressBackdrop" class="sheet-backdrop">
        <div class="sheet progress-sheet">
            <h2 id="progressTitle" data-i18n="drive.zipping"></h2>
            <div class="progress-track"></div>
        </div>
    </div>

    <!-- "Open with" dialog: a double-clicked file no app claims (and the
         Write-or-Calc tie). openWithDialog picks which buttons show. -->
    <div id="importWithBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="drive.openWith"></h2>
            <p id="importWithMsg"></p>
            <!-- One labelled tile per app, the same shape the upload dialog uses.
                 App names are never translated, so the labels are literal. -->
            <div class="upload-choices open-with-apps">
                <button id="importWithTextBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    <span>Text</span>
                </button>
                <button id="importWithWriteBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 512 512" fill="currentColor"><g transform="translate(45 465) rotate(-48)"><path d="M0 0 28 -14 82 -36C96 -36 110 -27 122 -19L122 19C110 27 96 36 82 36L28 14Z"></path><rect x="132" y="-26" width="350" height="52"></rect><path d="M494 -26 522 -26C542 -26 550 -14 550 0 550 14 542 26 522 26L494 26Z"></path></g><rect x="262" y="220" width="176" height="50" rx="12"></rect><path fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" d="M294 270 294 300C294 314 228 312 228 332L228 445C228 460 240 472 255 472L445 472C460 472 472 460 472 445L472 332C472 312 406 314 406 300L406 270"></path><path d="M228 355 472 355 472 445C472 460 460 472 445 472L255 472C240 472 228 460 228 445Z"></path></svg>
                    <span>Write</span>
                </button>
                <button id="importWithCalcBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 512 512" fill="currentColor"><g transform="translate(-213.2 -558.1) scale(1.8891 3.2191)"><g transform="translate(37.3 3.7)"><path d="m 159.5,210.8 v 7.2 h 25.2 v 16.5 H 159.5 V 300 h -21.5 v -65.6 h -19.9 v -16.5 h 19.9 v -5.7 q 0,-14.8 6.2,-20.5 6.2,-5.7 22.9,-5.7 h 17.7 v 16.5 h -16.8 q -4.8,0 -6.6,1.8 -1.7,1.8 -1.8,6.5 z"></path><g transform="translate(67.4 112.5) scale(.625)"><path d="m 243.4,186.2 q -9.7,17.5 -14.4,33.9 -4.7,16.4 -4.7,32.8 0,16.3 4.7,32.8 4.7,16.5 14.4,34.1 h -16.7 q -11.6,-16.9 -17.3,-33.3 -5.6,-16.5 -5.6,-33.5 0,-17 5.6,-33.5 5.7,-16.6 17.3,-33.3 z"></path><path d="M 329.9,218 302.2,257.2 332.3,300 H 307.2 L 291.1,272.4 275.1,300 h -25 l 30.3,-42.8 -27.9,-39.3 h 25 l 13.6,24.5 13.7,-24.5 z"></path><path d="m 338.9,186.2 h 16.7 q 11.6,16.7 17.2,33.3 5.7,16.5 5.7,33.5 0,17.1 -5.6,33.5 -5.6,16.4 -17.3,33.3 h -16.7 q 9.7,-17.6 14.4,-34.1 4.7,-16.6 4.7,-32.8 0,-16.4 -4.7,-32.8 -4.7,-16.4 -14.4,-33.9 z"></path></g></g></g></svg>
                    <span>Calc</span>
                </button>
                <button id="importWithPhotosBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="16" height="16" rx="2"></rect><circle cx="12" cy="8" r="2"></circle><path d="m22 13-1.3-1.3a2.4 2.4 0 0 0-3.4 0L11 18"></path><path d="M18 22H4a2 2 0 0 1-2-2V6"></path></svg>
                    <span>Photos</span>
                </button>
                <button id="importWithMusicBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                    <span>Music</span>
                </button>
                <button id="importWithMoviesBtn" class="upload-choice">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                    <span>Movies</span>
                </button>
            </div>
            <div class="sheet-actions">
                <button id="importWithCancelBtn" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Built-in image editor (TOAST UI Image Editor; library loaded on first use) -->
    <div id="editorBackdrop" class="editor-backdrop">
        <div class="editor-bar">
            <span id="editorName" class="editor-title"></span>
            <span class="editor-actions">
                <button id="editorSaveBtn"   class="editor-btn" data-i18n-attr="title:ui.save, aria-label:ui.save"></button>
                <button id="editorSaveAsBtn" class="editor-btn" data-i18n-attr="aria-label:ui.saveCopy, title:drive.saveCopyEllipsis"></button>
                <button id="editorCloseBtn"  class="editor-btn" data-i18n-attr="title:ui.close, aria-label:ui.close">&times;</button>
            </span>
        </div>
        <div id="tuiEditor" class="editor-canvas"></div>
        <textarea id="editorComment" class="editor-comment" rows="2" data-i18n-attr="placeholder:drive.photoCommentPh"></textarea>
    </div>

    <!-- "Guardar copia" dialog. Sits above the image-editor overlay
         (sheet-backdrop z-index 100 > editor-backdrop 99). -->
    <div id="saveCopyBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--pack">
            <h2 data-i18n="ui.saveCopy"></h2>
            <div class="field">
                <label for="saveCopyName" data-i18n="ui.fileName"></label>
                <input type="text" id="saveCopyName" autocomplete="off" spellcheck="false">
            </div>
            <div class="sheet-actions">
                <button id="saveCopyCancelBtn"  data-act="close" data-i18n-attr="title:ui.cancel"></button>
                <button id="saveCopyConfirmBtn" data-act="primary" data-i18n-attr="title:ui.saveCopy"></button>
            </div>
        </div>
    </div>

    <!-- Bottom-centre transient toast (shared .toast styling from theme.css) -->
    <div id="toast" class="toast"></div>

    <!-- Drive's code, one file per feature. Classic scripts sharing one global
         scope, so keep this order. init.js is a module for its top-level
         await: NayiveI18n.ready comes only after every script here has run,
         so it starts the app last although it loads second. -->
    <script src="state.js" defer></script>
    <script type="module" src="init.js"></script>
    <script src="menus.js" defer></script>
    <script src="tree.js" defer></script>
    <script src="trash.js" defer></script>
    <script src="navigate.js" defer></script>
    <script src="keyboard.js" defer></script>
    <script src="listing.js" defer></script>
    <script src="advsearch.js" defer></script>
    <script src="dragdrop.js" defer></script>
    <script src="open.js" defer></script>
    <script src="viewers.js" defer></script>
    <script src="toolbar.js" defer></script>
    <script src="upload.js" defer></script>
    <script src="actions.js" defer></script>
    <script src="move-copy.js" defer></script>
</body>
</html>
