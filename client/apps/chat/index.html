<!-- index.html - Chat: a private messenger, WhatsApp-style, for this Nayive
     user and the people they invite by link (no account, no app for them).
     The same screens serve both sides: this page for the owner, guest.html
     (served at /c/<token>/) for a person. See docs/chat-app.md, chat/core.js
     and server/go/chat.go. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in. -->
    <script src="../shared/i18n.js"></script>
    <title>Chat</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z'/%3E%3C/svg%3E">

    <!-- Shared colour scheme. Apply the saved choice before first paint to avoid a flash. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/locker.js"></script>

    <!-- Installable. Notifications come through the launcher's service worker
         (the account's devices, "Mi cuenta"). -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <!-- Maps (a place sent in a message): Leaflet, after app.css (LEAFLET CHROME there). -->
    <link rel="stylesheet" href="../trips/lib/leaflet_v1.9.4/leaflet.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div id="app"></div>

    <script src="../trips/lib/leaflet_v1.9.4/leaflet.js" defer></script>
    <script src="../shared/basemap.js" defer></script>
    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/photo.js" defer></script>
    <script src="../shared/vcard.js" defer></script>
    <script src="lib/qrcode_v0.12.0/qrcode.js" defer></script>
    <script src="core.js" defer></script>
    <script src="list.js" defer></script>
    <script src="conv.js" defer></script>
    <script src="compose.js" defer></script>
    <script src="media.js" defer></script>
    <script src="info.js" defer></script>
    <script src="call.js" defer></script>
    <script src="chat.js" defer></script>
    <script>
        // Deferred scripts run before DOMContentLoaded: everything is in by then.
        document.addEventListener( 'DOMContentLoaded', function ()
        {
            NayiveI18n.ready.then( function ()
            {
                // who: its account names what this page keeps on the device (core.js C.scope)
                NayiveUI.bootWithStore( null, function ( who ) { return NayiveChat.start( { mode: 'owner', api: '/api/chat', user: who && who.user } ); } );
            } );
        } );
    </script>
</body>
</html>
