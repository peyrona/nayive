            inp.placeholder = placeholder;
            inp.value = value;
            inp.autocomplete = 'off';
            return inp;
        }

        function readMultiRows( hostId, kind )
        {
            const out = [];

            for( const row of document.getElementById( hostId ).querySelectorAll( '.multi-row' ) )
            {
                const sel    = row.querySelector( 'select' );
                const inputs = row.querySelectorAll( 'input' );

                if( kind === 'adr' )
                {
                    const rec = {
                        type   : sel ? sel.value : 'HOME',
                        street : inputs[ 0 ].value.trim(),
                        postal : inputs[ 1 ].value.trim(),
                        city   : inputs[ 2 ].value.trim(),
                        region : inputs[ 3 ].value.trim(),
                        country: inputs[ 4 ].value.trim()
                    };

                    if( rec.street || rec.city || rec.region || rec.postal || rec.country )
                        out.push( rec );
                }
                else if( kind === 'url' )
                {
                    const v = inputs[ 0 ].value.trim();
                    if( v ) out.push( { value: v } );
                }
                else
                {
                    const v = inputs[ 0 ].value.trim();
                    if( v ) out.push( { type: sel ? sel.value : 'OTHER', value: v } );
                }
            }

            return out;
        }

        function commitEdit()
        {
            const given  = document.getElementById( 'fGiven'  ).value.trim();
            const family = document.getElementById( 'fFamily' ).value.trim();
            const org    = document.getElementById( 'fOrg'    ).value.trim();

            const tels   = readMultiRows( 'telRows',   'tel' );
            const emails = readMultiRows( 'emailRows', 'email' );

            if( ! given && ! family && ! org && ! tels.length && ! emails.length )
            {
                flashToast( T( 'contact.needSomething' ) );
                return;
            }

            const c = editingUid ? findContact( editingUid ) : makeContact();
            if( ! editingUid ) contacts.push( c );

            c.n.given  = given;
            c.n.family = family;
            c.fn       = [ given, family ].filter( Boolean ).join( ' ' ).trim() || c.fn || org;
            c.org      = org;
            c.title    = document.getElementById( 'fJobTitle' ).value.trim();
            c.tels     = tels;
            c.emails   = emails;
            c.adrs     = readMultiRows( 'adrRows', 'adr' );
            c.urls     = readMultiRows( 'urlRows', 'url' );
            c.bday     = document.getElementById( 'fBday' ).value;
            c.note     = document.getElementById( 'fNote' ).value.trim();

            closeBackdrop( 'editBackdrop' );
            render();
            saveContacts();
            refreshDedupIfOpen();
        }

        async function deleteCurrent()
        {
            if( ! detailUid ) return;

            const uid = detailUid;
            const c   = contacts.find( x => x.uid === uid );
            if( ! c ) return;

            const ok = await NayiveUI.confirm( {
                title:   T( 'contact.deleteContact' ),
                body:    TF( 'contact.deleteContactBody', { name: displayName( c ) } ),
                confirm: T( 'ui.delete' ),
                danger:  true
            } );
            if( ! ok ) return;

            contacts = contacts.filter( x => x.uid !== uid );

            closeBackdrop( 'detailBackdrop' );
            render();
            saveContacts();
            refreshDedupIfOpen();
        }

        function setMoreOpen( open )
        {
            document.getElementById( 'moreToggle' ).classList.toggle( 'open', open );
            document.getElementById( 'moreToggle' ).setAttribute( 'aria-expanded', String( open ) );
            document.getElementById( 'moreSection' ).style.display = open ? '' : 'none';
            document.getElementById( 'moreLabel' ).textContent = open ? T( 'contact.fewerFields' ) : T( 'contact.moreFields' );
        }

        //------------------------------------------------------------------------//
        // DUPLICATES — review sheet

        let dupGroups  = [];     // last findDuplicateGroups() result, backing the dedup sheet
        let mergeModel = null;   // union preview backing the merge sheet

        // Phone-only "⋮" menu: the three header buttons that do not fit beside the
        // title on a 390px screen (import / export / duplicates). Same shape as
        // Calendar's: a button toggles it, any click elsewhere closes it.
        // The shared header "..." popup (shared/ui.js): anchors itself under the button and
        // closes on a pick, a click outside, Escape or a resize.
        function wireTopMenu()
        {
            NayiveUI.wireMenu(
            {
                btn: 'moreBtn', menu: 'topMenu',
                onPick: function( item )
                {
                    if(      item.dataset.menu === 'import' ) document.getElementById( 'importInput' ).click();
                    else if( item.dataset.menu === 'export' ) exportVcf();
                    else if( item.dataset.menu === 'dedup'  ) openDedupSheet();
                }
            } );
        }

        function openDedupSheet()
        {
            openBackdrop( 'dedupBackdrop' );
            renderDedupScanning();

            // Yield twice so the sheet + progress bar actually paint before the
            // synchronous scan freezes the main thread.
            requestAnimationFrame( () => requestAnimationFrame( () =>
            {
                dupGroups = findDuplicateGroups( contacts );
                renderDedupSheet();
            }));
        }

        // Placeholder shown in the dedup sheet while findDuplicateGroups() is running.
        function renderDedupScanning()
        {
            document.getElementById( 'dedupCount' ).textContent = '';
            document.getElementById( 'dedupList' ).innerHTML =
                '<div class="dedup-scanning">'
              +     '<div class="scan-bar"><span></span></div>'
              +     '<p data-i18n="contact.scanning"></p>'
              + '</div>';
        }

        function refreshDedupIfOpen()
        {
            if( document.getElementById( 'dedupBackdrop' ).classList.contains( 'open' ) )
            {
                dupGroups = findDuplicateGroups( contacts );
                renderDedupSheet();
            }
        }

        function renderDedupSheet()
        {
            const host = document.getElementById( 'dedupList' );
            host.innerHTML = '';

            document.getElementById( 'dedupCount' ).textContent = dupGroups.length ? ' (' + dupGroups.length + ')' : '';

            if( ! dupGroups.length )
            {
                const p = document.createElement( 'p' );
                p.className = 'dedup-empty';
                p.textContent = T( 'contact.noDupes' );
                host.appendChild( p );
                return;
            }

            dupGroups.forEach( ( g, gi ) => host.appendChild( buildDupGroupCard( g, gi ) ) );
        }

        function buildDupGroupCard( g, gi )
        {
            const card = document.createElement( 'div' );
            card.className = 'dup-group';

            const chips = document.createElement( 'div' );
            chips.className = 'dup-chips';

            const conf = document.createElement( 'span' );
            conf.className = 'dup-conf ' + g.confidence;
            conf.textContent = g.confidence === 'alta' ? T( 'contact.confHigh' ) : T( 'contact.confLow' );
            chips.appendChild( conf );

            g.reasons.forEach( r =>
            {
                const chip = document.createElement( 'span' );
                chip.className = 'dup-chip';
                chip.textContent = r;
                chips.appendChild( chip );
            });
            card.appendChild( chips );

            g.contacts.forEach( c =>
            {
                const row = document.createElement( 'div' );
                row.className = 'dup-contact';
                row.addEventListener( 'click', () => openDetail( c.uid ) );

                const name = displayName( c );

                const av = document.createElement( 'div' );
                av.className = 'avatar';
                av.style.background = avatarColor( name );
                av.textContent = initials( c, name );
                row.appendChild( av );

                const meta = document.createElement( 'div' );
                meta.className = 'contact-meta';

                const nm = document.createElement( 'div' );
                nm.className = 'contact-name';
                nm.textContent = name;
                meta.appendChild( nm );

                const sub = subLine( c );
                if( sub )
                {
                    const sb = document.createElement( 'div' );
                    sb.className = 'contact-sub';
                    sb.textContent = sub;
                    meta.appendChild( sb );
                }

                row.appendChild( meta );

                // With 3+ members the group may have swept in someone who only shares a surname
                // (union-find joins the whole connected component). Let the user drop them.
                if( g.contacts.length > 2 )
                {
                    const rm = document.createElement( 'button' );
                    rm.type = 'button';
                    rm.className = 'dup-remove';
                    rm.title = T( 'contact.removeFromGroup' );
                    rm.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>';
                    rm.addEventListener( 'click', e =>
                    {
                        e.stopPropagation();
                        excludeFromDupGroup( gi, c.uid );
                    });
                    row.appendChild( rm );
                }

                card.appendChild( row );
            });

            const actions = document.createElement( 'div' );
            actions.className = 'dup-actions';

            const dismiss = document.createElement( 'button' );
            dismiss.type = 'button';
            dismiss.className = 'btn-text';
            dismiss.textContent = T( 'contact.notDupes' );
            dismiss.addEventListener( 'click', () => dismissDupGroup( gi ) );
            actions.appendChild( dismiss );

            const merge = document.createElement( 'button' );
            merge.type = 'button';
            merge.className = 'btn-pill';
            merge.textContent = T( 'contact.merge' );
            merge.addEventListener( 'click', () => openMergeSheet( gi ) );
            actions.appendChild( merge );

            card.appendChild( actions );
            return card;
        }

        function dismissDupGroup( gi )
        {
            const g = dupGroups[ gi ];
            if( ! g ) return;

            for( let a = 0; a < g.contacts.length; a++ )
                for( let b = a + 1; b < g.contacts.length; b++ )
                    dismissed.add( dismissKey( g.contacts[ a ].uid, g.contacts[ b ].uid ) );

            saveMeta();
            dupGroups = findDuplicateGroups( contacts );
            renderDedupSheet();
        }

        // Drops one contact from a group: marks it "not a duplicate" of every other member
        // so the next scan won't pull it back, then re-renders. The rest of the group stays
        // together (their own matching pairs are untouched) and can be merged.
        function excludeFromDupGroup( gi, uid )
        {
            const g = dupGroups[ gi ];
            if( ! g ) return;

            g.contacts.forEach( other =>
            {
                if( other.uid !== uid )
                    dismissed.add( dismissKey( uid, other.uid ) );
            });

            saveMeta();
            dupGroups = findDuplicateGroups( contacts );
            renderDedupSheet();
        }

        //------------------------------------------------------------------------//
        // DUPLICATES — merge preview

        function firstNonEmpty( arr )
        {
            return ( arr.map( s => ( s || '' ).trim() ).find( Boolean ) ) || '';
        }

        // Most-complete card: most N components filled, then longest display name.
        function mostComplete( list )
        {
            return list.slice().sort( ( a, b ) =>
            {
                const fa = [ a.n.given, a.n.family, a.n.additional, a.n.prefix, a.n.suffix ].filter( Boolean ).length;
                const fb = [ b.n.given, b.n.family, b.n.additional, b.n.prefix, b.n.suffix ].filter( Boolean ).length;
                return fb - fa || displayName( b ).length - displayName( a ).length;
            })[ 0 ];
        }

        function unionValues( lists, keyFn )
        {
            const seen = new Set();
            const out  = [];

            for( const list of lists )
                for( const it of list )
                {
                    const k = keyFn( it );
                    if( ! k || seen.has( k ) ) continue;
                    seen.add( k );
                    out.push( it );
                }

            return out;
        }

        function openMergeSheet( gi )
        {
            const group = dupGroups[ gi ];
            if( ! group ) return;

            const members = group.contacts.filter( c => findContact( c.uid ) );

            if( members.length < 2 )
            {
                flashToast( T( 'contact.groupClean' ) );
                refreshDedupIfOpen();
                return;
            }

            openMergeFor( members );
        }

        // Builds the union preview and opens the sheet. Called both by the
        // duplicate scanner (a group) and by the manual pick (ticked rows).
        function openMergeFor( members )
        {
            const withVal  = arr => arr.filter( x => ( x.value || '' ).trim() );
            const realAdrs = c => c.adrs.filter( a => a.street || a.city || a.region || a.postal || a.country );
            const telKey   = t => { const d = normPhone( t.value ); return d ? phoneTail( d ) : foldForSearch( ( t.value || '' ).trim() ); };
            const mailKey  = e => normEmail( e.value );
            const adrKey   = a => foldForSearch( [ a.street, a.city, a.region, a.postal, a.country ].join( '|' ) ).replace( /[^a-z0-9|]/g, '' );
            const urlKey   = u => ( u.value || '' ).trim().toLowerCase().replace( /\/+$/, '' );

            mergeModel = {
                members : members,
                primary : members.map( c => c.uid ).sort()[ 0 ],
                names   : [ ...new Set( members.map( displayName ) ) ],
                nameSrc : mostComplete( members ),
                orgs    : [ ...new Set( members.map( c => c.org.trim() ).filter( Boolean ) ) ],
                titles  : [ ...new Set( members.map( c => c.title.trim() ).filter( Boolean ) ) ],
                tels    : unionValues( members.map( c => withVal( c.tels ) ),   telKey ),
                emails  : unionValues( members.map( c => withVal( c.emails ) ), mailKey ),
                adrs    : unionValues( members.map( realAdrs ),                 adrKey ),
                urls    : unionValues( members.map( c => withVal( c.urls ) ),   urlKey ),
                bday    : firstNonEmpty( members.map( c => c.bday ) ),
                notes   : [ ...new Set( members.map( c => c.note.trim() ).filter( Boolean ) ) ]
            };

            renderMergePreview();
            openBackdrop( 'mergeBackdrop' );
        }

        function renderMergePreview()
        {
            const m    = mergeModel;
            const body = document.getElementById( 'mergeBody' );
            body.innerHTML = '';

            body.appendChild( mergePickField( T( 'contact.firstName' ), 'mergeName', m.names, displayName( m.nameSrc ) ) );

            if( m.orgs.length )   body.appendChild( mergePickField( T( 'contact.org' ), 'mergeOrg', m.orgs, m.orgs[ 0 ] ) );
            if( m.titles.length ) body.appendChild( mergePickField( T( 'contact.jobTitle' ), 'mergeTitle', m.titles, m.titles[ 0 ] ) );

            mergeCheckSection( body, T( 'contact.phones' ),   'tel',   m.tels,   t => [ typeLabel( TEL_TYPES(), t.type ),   t.value ] );
            mergeCheckSection( body, T( 'contact.emails' ),     'email', m.emails, e => [ typeLabel( EMAIL_TYPES(), e.type ), e.value ] );
            mergeCheckSection( body, T( 'contact.addresses' ), 'adr',   m.adrs,   a => [ typeLabel( ADR_TYPES(), a.type ),   formatAddress( a ) ] );
            mergeCheckSection( body, T( 'contact.websites' ),  'url',   m.urls,   u => [ 'Web', u.value ] );

            if( m.bday )
            {
                const sec = document.createElement( 'div' );
                sec.className = 'merge-section';
                sec.innerHTML = '<div class="ms-label" data-i18n="contact.birthday"></div>';
                const v = document.createElement( 'div' );
                v.className = 'mr-val';
                v.textContent = formatBday( m.bday );
                sec.appendChild( v );
                body.appendChild( sec );
            }

            if( m.notes.length )
            {
                const sec = document.createElement( 'div' );
                sec.className = 'merge-section';
                sec.innerHTML = '<div class="ms-label" data-i18n="ui.notes"></div>';
                const v = document.createElement( 'div' );
                v.className = 'merge-note-preview';
                v.textContent = m.notes.join( '\n———\n' );
                sec.appendChild( v );
                body.appendChild( sec );
            }
        }

        function mergePickField( label, id, options, selected )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';

            const lbl = document.createElement( 'label' );
            lbl.textContent = label;
            field.appendChild( lbl );

            if( options.length <= 1 )
            {
                const input = document.createElement( 'input' );
                input.type = 'hidden';
                input.id = id;
                input.value = options[ 0 ] || selected || '';
                field.appendChild( input );

                const span = document.createElement( 'div' );
                span.className = 'mr-val';
                span.textContent = input.value;
                field.appendChild( span );
            }
            else
            {
                const sel = document.createElement( 'select' );
                sel.id = id;

                options.forEach( o =>
                {
                    const opt = document.createElement( 'option' );
                    opt.value = o;
                    opt.textContent = o;
                    sel.appendChild( opt );
                });

                sel.value = selected;
                field.appendChild( sel );
            }

            return field;
        }

        function mergeCheckSection( body, label, kind, items, fmt )
        {
            if( ! items.length ) return;

            const sec = document.createElement( 'div' );
            sec.className = 'merge-section';

            const l = document.createElement( 'div' );
            l.className = 'ms-label';
            l.textContent = label;
            sec.appendChild( l );

            items.forEach( ( it, idx ) =>
            {
                const [ type, value ] = fmt( it );

                const row = document.createElement( 'label' );
                row.className = 'merge-row';

                const cb = document.createElement( 'input' );
                cb.type = 'checkbox';
                cb.checked = true;
                cb.dataset.kind = kind;
                cb.dataset.idx  = idx;
                row.appendChild( cb );

                const t = document.createElement( 'span' );
                t.className = 'mr-type';
                t.textContent = type;
                row.appendChild( t );

                const v = document.createElement( 'span' );
                v.className = 'mr-val';
                v.textContent = value;
                row.appendChild( v );

                sec.appendChild( row );
            });

            body.appendChild( sec );
        }

        function collectChecked( kind )
        {
            const list = mergeModel[ kind === 'adr' ? 'adrs' : kind + 's' ];
            const out  = [];

            document.querySelectorAll( '#mergeBody input[data-kind="' + kind + '"]' ).forEach( cb =>
            {
                if( cb.checked ) out.push( list[ Number( cb.dataset.idx ) ] );
            });

            return out;
        }

        function doMerge()
        {
            const m = mergeModel;
            if( ! m ) return;

            const groupUids  = new Set( m.members.map( c => c.uid ) );
            const chosenName = ( document.getElementById( 'mergeName' ).value || '' ).trim();
            const nameSrc    = m.members.find( c => displayName( c ) === chosenName ) || m.nameSrc;

            const merged  = makeContact();
            merged.uid    = m.primary;
            merged.n      = { ...nameSrc.n };
            merged.fn     = chosenName || displayName( nameSrc );
            merged.org    = ( document.getElementById( 'mergeOrg' )   || {} ).value || firstNonEmpty( m.members.map( c => c.org ) );
            merged.title  = ( document.getElementById( 'mergeTitle' ) || {} ).value || firstNonEmpty( m.members.map( c => c.title ) );
            merged.tels   = collectChecked( 'tel' );
            merged.emails = collectChecked( 'email' );
            merged.adrs   = collectChecked( 'adr' );
            merged.urls   = collectChecked( 'url' );
            merged.bday   = m.bday;
            merged.note   = m.notes.join( '\n———\n' );

            const hadDismissals = dismissed.size > 0;

            undoState = { contacts: contacts.slice() };

            contacts = contacts.filter( c => ! groupUids.has( c.uid ) );
            contacts.push( merged );

            closeBackdrop( 'mergeBackdrop' );
            setSelectMode( false );     // no-op unless the merge came from a manual pick
            render();
            saveContacts();

            if( hadDismissals )
                saveMeta();                 // prunes dismissed pairs that referenced the removed cards

            flashUndo( T( 'contact.merged' ) );
            refreshDedupIfOpen();
        }

        function undoMerge()
        {
            if( ! undoState ) return;

            contacts  = undoState.contacts;
            undoState = null;

            render();
            saveContacts();
            refreshDedupIfOpen();
        }

        //------------------------------------------------------------------------//
        // IMPORT / EXPORT

        function exportVcf()
        {
            if( ! contacts.length )
            {
                flashToast( T( 'contact.nothingToExport' ) );
                return;
            }

            const blob = new Blob( [ contactsToVcf( contacts ) ], { type: 'text/vcard;charset=utf-8' } );
            const url  = URL.createObjectURL( blob );
            const a    = document.getElementById( 'downloadAnchor' );

            a.href     = url;
            a.download = 'contactos.vcf';
            a.click();

            setTimeout( () => URL.revokeObjectURL( url ), 1000 );
        }

        async function importVcf( file )
        {
            let text;
            try   { text = await file.text(); }
            catch { flashToast( T( 'contact.readFailed' ) ); return; }

            const incoming = vcfToContacts( text );

            if( ! incoming.length )
            {
                flashToast( T( 'contact.noVcards' ) );
                return;
            }

            const byUid = new Map( contacts.map( c => [ c.uid, c ] ) );
            let   added = 0, updated = 0;

            for( const inc of incoming )
            {
                if( byUid.has( inc.uid ) )
                {
                    Object.assign( byUid.get( inc.uid ), inc );
                    updated++;
                }
                else
                {
                    contacts.push( inc );
                    byUid.set( inc.uid, inc );
                    added++;
                }
            }

            render();
            await saveContacts();

            flashToast( TF( 'contact.imported', { added: added, updated: updated } ) );

            // Imports are where duplicates are actually created — surface them right away.
            if( findDuplicateGroups( contacts ).length )
                openDedupSheet();
        }

        //------------------------------------------------------------------------//
        // UI WIRING

        function wireStaticUI()
        {
            document.getElementById( 'addBtn'    ).addEventListener( 'click', openEditForNew );

            document.getElementById( 'selectBtn'      ).addEventListener( 'click', () => setSelectMode( ! selectMode ) );
            document.getElementById( 'selectCancel'   ).addEventListener( 'click', () => setSelectMode( false ) );
            document.getElementById( 'selectMergeBtn' ).addEventListener( 'click', mergePicked );
            wireLongPress();
            wireAzRail();

            document.getElementById( 'exportBtn' ).addEventListener( 'click', exportVcf );

            document.getElementById( 'importBtn' ).addEventListener( 'click', () => document.getElementById( 'importInput' ).click() );
            document.getElementById( 'importInput' ).addEventListener( 'change', function()
            {
                if( this.files && this.files[ 0 ] )
                    importVcf( this.files[ 0 ] );

                this.value = '';
            });

            const search = document.getElementById( 'searchInput' );
            search.addEventListener( 'input', function()
            {
                query = this.value;
                document.getElementById( 'searchClear' ).classList.toggle( 'show', !! query );
                document.getElementById( 'searchIcon' ).style.display = query ? 'none' : '';   // hide magnifier so it never overlaps the clear (x)
                syncSelectBtn();
                render();
            });
            document.getElementById( 'searchClear' ).addEventListener( 'click', function()
            {
                search.value = '';
                query = '';
                this.classList.remove( 'show' );
                document.getElementById( 'searchIcon' ).style.display = '';
                syncSelectBtn();
                render();
                search.focus();
            });

            document.getElementById( 'detailCloseBtn'  ).addEventListener( 'click', () => closeBackdrop( 'detailBackdrop' ) );
            document.getElementById( 'detailEditBtn'    ).addEventListener( 'click', function()
            {
                const uid = detailUid;
                closeBackdrop( 'detailBackdrop' );
                openEditForExisting( uid );
            });
            document.getElementById( 'detailDeleteBtn'  ).addEventListener( 'click', deleteCurrent );

            document.getElementById( 'editCloseBtn' ).addEventListener( 'click', () => closeBackdrop( 'editBackdrop' ) );
            document.getElementById( 'editSaveBtn'   ).addEventListener( 'click', commitEdit );
            document.getElementById( 'fBday'         ).addEventListener( 'input', refreshBdayDisplay );

            document.getElementById( 'dedupBtn'        ).addEventListener( 'click', openDedupSheet );
            wireTopMenu();
            document.getElementById( 'dedupCloseBtn'   ).addEventListener( 'click', () => closeBackdrop( 'dedupBackdrop' ) );
            document.getElementById( 'mergeCloseBtn'   ).addEventListener( 'click', () => closeBackdrop( 'mergeBackdrop' ) );
            document.getElementById( 'mergeConfirmBtn' ).addEventListener( 'click', doMerge );

            document.getElementById( 'moreToggle' ).addEventListener( 'click', function()
            {
                setMoreOpen( ! this.classList.contains( 'open' ) );
            });

            document.querySelectorAll( 'button[data-add]' ).forEach( function( btn )
            {
                btn.addEventListener( 'click', () => addMultiRow( btn.dataset.add, {} ) );
            });

            document.addEventListener( 'keydown', function( e )
            {
                if( e.key !== 'Escape' ) return;

                // Close the top-most open sheet only. Detail floats above the rest (z-index).
                const order = [ 'detailBackdrop', 'mergeBackdrop', 'editBackdrop', 'dedupBackdrop' ];

                for( const id of order )
                {
                    if( document.getElementById( id ).classList.contains( 'open' ) )
                    {
                        closeBackdrop( id );
                        return;
                    }
                }

                setSelectMode( false );   // no sheet open: Escape leaves pick-several mode
            });
        }

        function openBackdrop( id )  { NayiveUI.open( id ); }     // impl in shared/ui.js
        function closeBackdrop( id ) { NayiveUI.close( id ); }

        // Both toasts are the shared ones (shared/ui.js + the .toast rules in
        // shared/theme.css); these two names are kept only because the app calls them a lot.
        // Plain functions, not `const x = NayiveUI.y`: shared/ui.js is deferred, so NayiveUI
        // does not exist yet while this script is parsed.
        function flashToast( msg ) { NayiveUI.toast( msg ); }
        function flashUndo( msg )  { NayiveUI.undoToast( msg, undoMerge ); }

    </script>
</body>
</html>
