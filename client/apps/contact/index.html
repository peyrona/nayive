<!-- SEALED - a user-data write path (docs/sealed-crud.md): announce a change, keep it minimal, then `node tools/data-safety-test/run.mjs` must be ALL GREEN. -->
<!-- index.html - Personal single-user address book. Source of truth is a single vCard 3.0
     file (apps/contact/contacts.vcf), backed by Gum's file-manager API. vCard 3.0 (RFC 2426)
     is chosen over 4.0 for import/export interoperability with phones (Android, iOS, Google
     Contacts all read and write 3.0 natively). -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Contacts</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='17' rx='2'/%3E%3Ccircle cx='9' cy='11' r='2.2'/%3E%3Cpath d='M5.5 17.5c0-2.2 1.7-3.3 3.5-3.3s3.5 1.1 3.5 3.3'/%3E%3Cline x1='14' y1='10' x2='18' y2='10'/%3E%3Cline x1='14' y1='14' x2='18' y2='14'/%3E%3C/svg%3E">

    <!-- Shared colour scheme (light default, opt-in dark). Toggle lives in Drive / the launcher; this page just follows the saved choice. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/locker.js"></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS; a no-op on the plain-HTTP LAN URL. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <!-- File-API helpers: the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <!-- The item browser: picking, the one menu, the keys, the groups tree. -->
    <script src="../shared/browser.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'contact',
            title: 'Contacts',
            lead:  [ T( 'contact.introLead' ), T( 'contact.introPick' ) ],
            buttons: [
                { sel: '#dedupBtn',  text: T( 'contact.introDedup' ) },
                { sel: '#settingsBtn', text: T( 'contact.introSettings' ) },
                { sel: '#treeBtn',   text: T( 'contact.introGroups' ) },
                { sel: '#addBtn',    text: T( 'contact.introAdd' ) },
                { sel: '#syncIndicator', name: NayiveUI.t( 'ui.syncName' ),
                  text: T( 'contact.introSync' ) }
            ]
        } );
    } );
    </script>

    <!-- Offline-capable persistence: local last-known-good cache + write-behind sync. -->
    <script src="../shared/store.js" defer></script>
    <script src="../shared/photo.js" defer></script>

    <style>
        /* Base reset, card shell (.page/.page-inner/.card), .header, .app-icon,
           .icon-btn, .sheet, .field and the input look all come from
           ../shared/app.css. Only what is unique to the address book lives here. */

        #detailBackdrop { z-index: 110; }   /* a contact opened from the Duplicates sheet floats above it */
        #editBackdrop   { z-index: 115; }   /* ...and so does its Edit, which replaces it */
        /* ...but a dialog built on the fly by shared/ui.js (confirm, alert,
           folder picker - the only backdrops that carry role="dialog") is
           always the top-most thing on screen, above the detail card. */
        .sheet-backdrop[role="dialog"] { z-index: 120; }

        /* Text inputs that sit outside a .field (multi-value rows) — app.css
           styles the look; they only need their width set here. */
        .multi-row input,
        .multi-row select { width: 100%; }


        /* Contact list */
        /* Sticky so the letter you are inside of stays named while you scroll a
           700-row book. The page itself is the scroller (.page has no overflow,
           see shared/app.css), so top:0 is the viewport top. The opaque
           background is required — rows would slide under a transparent head. */
        .letter-head
        {
            position: sticky; top: var(--win-head-h, 0px); z-index: 3;   /* under the sticky title row (app.css) */
            background: var(--card);
            font-size: 0.75rem; font-weight: 700; color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.04em;
            padding: 12px 2px 4px; border-bottom: 1px solid var(--line); margin-bottom: 2px;
        }
        /* In a desktop window the page does not scroll: .list-scroll does, so its
           scroll bar runs from under the title row to the bottom, never over the
           toolbar. It spans the card's side padding, so the bar sits on the
           window's edge; the letters pin to its top. */
        html.is-windowed,
        html.is-windowed body { height: 100%; overflow: hidden; }
        html.is-windowed .page > .page-inner > .card
        {
            display: flex; flex-direction: column;
            height: 100vh; padding-bottom: 0;
        }
        html.is-windowed .page > .page-inner > .card > .header { flex: 0 0 auto; margin-bottom: 0; }
        html.is-windowed .list-scroll
        {
            flex: 1 1 auto; min-height: 0; overflow-y: auto;
            margin: 0 -16px; padding: 0 16px 16px;
        }
        /* The gap under the title row scrolls away with the rows: as padding it
           would leave a band where rows show above a pinned letter. */
        html.is-windowed .list-scroll::before { content: ''; display: block; height: var(--space-4); }
        html.is-windowed .letter-head { top: 0; }
        /* The card fills the window: the rail hugs its right edge, clear of the scroll bar. */
        html.is-windowed .az-rail   { right: 16px; }
        html.is-windowed .az-bubble { right: 40px; }

        /* --- A-Z jump rail ---------------------------------------------------
           Fixed to the right edge of the *card*, not of the window: on a phone
           the card fills the screen and max() yields the 2px floor, on a desktop
           calc(50% - 228px) lands it just inside the 460px card (shared/app.css
           .page-inner). Only letters that actually have contacts are painted, so
           the rail is short in a small address book. Below the sheets (z 110+),
           so an open detail card covers it. */
        .az-rail
        {
            position: fixed; right: max(2px, calc(50% - 228px)); top: 50%;
            transform: translateY(-50%); z-index: 5;
            display: flex; flex-direction: column; align-items: center;
            padding: 4px 3px; border-radius: 999px;
            background: color-mix(in srgb, var(--card) 88%, transparent);
            user-select: none; touch-action: none; cursor: pointer;
        }
        /* A 23px-wide strip is a ~6mm thumb target, and a miss opens whatever
           contact row is underneath. This invisible flap widens the catch area to
           the left without widening the pill; events on a pseudo-element are
           dispatched to the element itself, so the rail still gets the pointer. */
        .az-rail::before { content: ''; position: absolute; top: 0; bottom: 0; right: 0; left: -18px; }
        .az-letter
        {
            border: none; background: transparent; padding: 0;
            width: 17px; text-align: center;
            font-size: clamp(8px, 2vh, 11px); line-height: 1.32; font-weight: 700;
            color: var(--text-dim); pointer-events: none;   /* the rail tracks the finger, not each letter */
        }
        .az-rail:hover .az-letter,
        .az-rail.dragging .az-letter { color: var(--text); }
        .az-letter.on { color: var(--accent); }

        /* The letter under the finger while dragging the rail. */
        .az-bubble
        {
            position: fixed; right: max(24px, calc(50% - 206px)); top: 50%;
            transform: translateY(-50%); z-index: 6;
            min-width: 46px; padding: 8px 10px; border-radius: var(--radius-m);
            background: var(--accent); color: var(--on-accent);
            font-size: 1.3rem; font-weight: 700; text-align: center;
            pointer-events: none;
        }

        .contact-row
        {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 4px; border-radius: var(--radius-s); cursor: pointer;
        }
        .contact-row:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }

        .avatar
        {
            flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.86rem; font-weight: 700; color: #fff; user-select: none;
        }
        .avatar.lg { width: 60px; height: 60px; font-size: 1.35rem; }
        .avatar.xl { width: 96px; height: 96px; font-size: 2rem; }
        .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .face-pick-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

        /* --- Picking (the shared item browser, see LIST in the script) ------
           The round tick and the row ⋮ are the shared .pick-tick / .row-more
           (app.css ITEM BROWSER); a picked row is tinted like a hover, only
           stronger. A long-press picks: the phone must not select the name
           or pop its own copy callout while the finger is down. */
        .contact-row { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .contact-row.is-selected,
        .contact-row.is-selected:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
        .contact-row .pick-tick { margin-right: -4px; }
        .ct-star { display: flex; flex: 0 0 auto; color: var(--warn); }
        .ct-star svg { width: 15px; height: 15px; }

        /* --- The groups tree (All contacts, Favourites, Groups) -------------
           Above 640px the card widens and the tree sits left of the list; on a
           phone it slides in from #treeBtn (the shared .tree-sheet, app.css).
           The rail and its bubble follow the wider card's right edge. */
        .ct-body { display: flex; align-items: flex-start; gap: 12px; }
        .ct-body > .list-scroll { flex: 1 1 auto; min-width: 0; }
        #tree.ntree { min-width: 0; }
        #tree .tree-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .ct-where  { display: none; }
        @media (min-width: 641px)
        {
            .page-inner { max-width: 700px; }
            .tree-pane
            {
                flex: 0 0 auto; width: 190px;
                position: sticky; top: calc(var(--win-head-h, 0px) + 8px);
                max-height: calc(100vh - 100px); overflow: auto; padding-bottom: 12px;
            }
            .az-rail   { right: max(2px, calc(50% - 348px)); }
            .az-bubble { right: max(24px, calc(50% - 326px)); }
        }
        @media (max-width: 640px)
        {
            /* The tree's button sits after the title, in the header (look LEFT). */
            .header h1 { flex-grow: 0; }
            .ct-where  { display: flex; align-items: center; gap: 4px; min-width: 0; margin-right: auto; font-size: 0.9rem; font-weight: 600; color: var(--text-dim); }
            #viewName  { min-width: 0; overflow-wrap: anywhere; }
            /* The rows' ⋮ clear of the A-Z rail's catch area. */
            .list-scroll:has(> .az-rail:not([hidden])) .contact-row { padding-right: 24px; }
        }
        /* In a desktop window the tree and the list each scroll on their own. */
        html.is-windowed .ct-body { flex: 1 1 auto; min-height: 0; align-items: stretch; gap: 0; margin: 0 -16px; }
        html.is-windowed .ct-body > .list-scroll { margin: 0; }
        @media (min-width: 641px)
        {
            html.is-windowed .tree-pane
            {
                position: static; max-height: none;
                padding: var(--space-4) 6px 12px 8px; border-right: 1px solid var(--line);
            }
        }

        .contact-meta { flex: 1 1 auto; min-width: 0; }
        .contact-name { font-size: 0.95rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-sub { font-size: 0.80rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Empty state */
        .empty { display: none; flex-direction: column; align-items: center; text-align: center; padding: 40px 10px 20px; color: var(--text-faint); }
        .empty p { margin: 4px 0 0; font-size: 0.82rem; }
        .empty .empty-title { margin: 10px 0 0; font-size: 0.95rem; font-weight: 600; color: var(--text-dim); }


        /* Native date inputs render in the browser's own locale (e.g. mm/dd/yyyy). Hide the
           native text and overlay our own yyyy-mm-dd label; the input stays tappable
           underneath so the picker still opens. Same technique as Calendar / Trip. */
        /* .dt-field is the shared DATE / TIME FIELD block (shared/app.css). */

        /* Repeatable multi-value rows (phones, emails, addresses) */
        .multi-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
        .multi-row select { flex: 0 0 96px; }
        .multi-row .multi-fields { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

        /* Section title with an inline "+" that adds a row (phones, emails, addresses, sites) */
        .section-head
        {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.80rem; color: var(--text-dim); margin: 8px 0 6px;
        }
        /* The "+" is the shared .icon-btn.sm. */

        /* The "más campos" fold is the shared .more-toggle block (shared/app.css). */

        hr.divider { border: none; border-top: 1px solid var(--line); margin: 14px 0; }

        /* Detail view */
        .detail-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin-bottom: 16px; }
        .detail-name { font-size: 1.2rem; font-weight: 700; }
        .detail-org { font-size: 0.86rem; color: var(--text-dim); }

        .detail-group { margin-bottom: 12px; }
        .detail-group + .detail-group { border-top: 1px solid var(--line); padding-top: 12px; }
        .detail-item { display: flex; flex-direction: column; gap: 1px; padding: 4px 0; }
        .detail-item .di-label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
        .detail-item .di-value { font-size: 0.98rem; color: var(--text); word-break: break-word; }
        .detail-item .di-value.multiline { white-space: pre-wrap; }

        /* .sheet-actions / .btn / .btn-* live in ../shared/theme.css */

        /* .toast, .toast.show, .toast.actionable and .toast-undo all live in
           ../shared/theme.css - the same "Deshacer" as Habits and Split. */

        /* Duplicates */
        .dedup-count { font-size: 0.82rem; font-weight: 400; color: var(--text-dim); margin-left: 6px; }
        .dedup-empty { color: var(--text-dim); font-size: 0.92rem; text-align: center; padding: 24px 8px; }

        /* Shown while findDuplicateGroups() runs (its O(n²) scan blocks the main thread). */
        .dedup-scanning { padding: 28px 8px; text-align: center; color: var(--text-dim); }
        .dedup-scanning p { margin: 12px 0 0; font-size: 0.9rem; }
        .scan-bar { position: relative; height: 4px; border-radius: 2px; background: var(--card2); overflow: hidden; }
        .scan-bar > span
        {
            position: absolute; top: 0; left: -40%; height: 100%; width: 40%;
            background: var(--accent); border-radius: 2px;
            animation: scan-slide 1s ease-in-out infinite;
        }
        @keyframes scan-slide { from { left: -40%; } to { left: 100%; } }

        .dup-group
        {
            border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px;
            margin-bottom: 12px; background: var(--card2);
        }
        .dup-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        /* The reasons are the shared read-only .tag. */
        .dup-conf { font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-pill); }
        .dup-conf.alta  { background: var(--accent); color: var(--on-accent); }
        .dup-conf.media { background: transparent; color: var(--text-dim); border: 1px solid var(--line); }

        .dup-contact { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-radius: var(--radius-s); cursor: pointer; }
        .dup-contact:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }

        /* "Not duplicates" / "Merge": the shared .text-btn.ghost / .text-btn. */
        .dup-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 8px; }

        /* Merge preview */
        .merge-section { margin-top: 10px; }
        .merge-section > .ms-label { font-size: 0.80rem; color: var(--text-dim); margin-bottom: 4px; }
        .merge-row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 2px; font-size: 0.92rem; }
        .merge-row input[type=checkbox] { width: 17px; height: 17px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--accent); }
        .merge-row .mr-type { color: var(--text-dim); font-size: 0.76rem; flex: 0 0 auto; min-width: 52px; padding-top: 1px; }
        .merge-row .mr-val { color: var(--text); word-break: break-word; white-space: pre-wrap; }
        .merge-note-preview { font-size: 0.86rem; color: var(--text); white-space: pre-wrap; background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 8px 10px; }
    </style>
</head>

<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="page" style="display: none;">
        <div class="page-inner">
            <div class="card">

                <div class="header">
                    <svg class="app-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="17" rx="2"></rect>
                        <circle cx="9" cy="11" r="2.2"></circle>
                        <path d="M5.5 17.5c0-2.2 1.7-3.3 3.5-3.3s3.5 1.1 3.5 3.3"></path>
                        <line x1="14" y1="10" x2="18" y2="10"></line>
                        <line x1="14" y1="14" x2="18" y2="14"></line>
                    </svg>
                    <h1>Contacts</h1>
                    <!-- Phones only (<= 640 px): the groups tree slides in; the
                         name says which one is on screen (none for All contacts). -->
                    <div class="ct-where">
                        <button id="treeBtn" class="icon-btn" type="button" data-i18n-attr="title:contact.groups, aria-label:contact.groups">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
                        </button>
                        <span id="viewName"></span>
                    </div>

                    <div class="header-actions">
                        <!-- The selection's buttons (shared/browser.js): only while something is picked. -->
                        <div id="selActions" class="tb-group" hidden></div>
                        <div class="tb-group">
                            <!-- The shared search fold (NayiveUI.searchFold, wireStaticUI). -->
                            <div class="search-wrap">
                                <input id="searchInput" class="search-input" type="text" autocomplete="off" data-i18n-attr="placeholder:contact.searchPh0, aria-label:ui.search">
                            </div>
                            <button id="searchBtn" class="icon-btn" type="button" data-i18n-attr="title:ui.search, aria-label:ui.search">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </button>
                            <button id="addBtn" class="icon-btn" data-i18n-attr="title:contact.newContact">
                                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                            <button id="dedupBtn" class="icon-btn" data-i18n-attr="title:contact.findDupes">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            </button>
                        </div>
                        <div class="tb-group tb-sys">
                            <!-- Settings: sync with phones (CardDAV) + import / export .vcf.
                                 The launcher's gear glyph, so "settings" looks the same everywhere. -->
                            <button id="settingsBtn" class="icon-btn" data-i18n-attr="title:ui.settings, aria-label:ui.settings">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            </button>
                            <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            </button>
                        </div>
                        <button id="syncIndicator" class="sync-indicator" type="button" data-i18n-attr="title:ui.sync.synced"></button>
                    </div>
                </div>

                <!-- The groups tree beside the list (on a phone it slides in from
                     #treeBtn, in the header), then the list. In a desktop

                <div class="ct-body">

    <input type="file" id="importInput" accept=".vcf,text/vcard,text/x-vcard" style="display:none;">

    <script src="../shared/vcard.js"></script>     <!-- NOT deferred: the script below takes it on its first lines -->
    <script>
        //------------------------------------------------------------------------//
        // STATE

        const CONTACTS_FILE  = 'data/contacts.vcf';
        const META_FILE      = 'data/contacts-meta.json';   // local UX state only, never contact data

        // The vCard reading and writing every reader of the book shares (shared/vcard.js).
        const { contentLines, isQuotedPrintable, decodeValue, splitOnce, splitOutsideQuotes, splitEscaped,
                parseParams, unescapeText, escapeText, foldLine, photoOf, cards: vcfCards } = NayiveVCard;

        // Interface strings: every one of them lives in shared/i18n/*.json.
        const T  = k           => NayiveUI.t( k );
        const TF = ( k, vars ) => NayiveUI.tf( k, vars );

        // Filled in on DOMContentLoaded: shared/gum-api.js and shared/store.js
        // now load deferred, so GumApi / NayiveStore are not defined yet while
        // this script is parsed. Every reader runs later (DCL or an event), so
        // a plain `let` here is enough.
        let API_FILES;
        let store;                    // offline-capable persistence (see ../shared/store.js)

        // Types offered in the editor selects. Imported cards with any other TYPE keep their
        // own value (it is prepended as an extra <option> so nothing is silently lost).
        // Built on demand: the labels come from the dictionary, which lands after
        // this script has been parsed.
        const TEL_TYPES   = () => [ [ 'CELL', T( 'contact.typeMobile' ) ], [ 'HOME', T( 'contact.typeHome' ) ], [ 'WORK', T( 'contact.typeWork' ) ], [ 'FAX', T( 'contact.typeFax' ) ], [ 'OTHER', T( 'contact.typeOther' ) ] ];
        const ADR_TYPES   = () => [ [ 'HOME', T( 'contact.typeHome' ) ], [ 'WORK', T( 'contact.typeWork' ) ], [ 'OTHER', T( 'contact.typeOther' ) ] ];
        const EMAIL_TYPES = () => [ [ 'HOME', T( 'contact.typePersonal' ) ], [ 'WORK', T( 'contact.typeWork' ) ], [ 'OTHER', T( 'contact.typeOther' ) ] ];

        const SEARCH_PLACEHOLDER = () => T( 'contact.searchPh' );   // shown after a "[<count>] " prefix

        let contacts   = [];      // source of truth: array of contact objects (see makeContact)
        let unparsedCards = [];   // [{ pos, text }] cards of the file the parser could not read: written back untouched
        let nextPos    = 0;       // the place in the file of the next card added (see contactsToVcf)
        let bookRead   = false;   // the address book has been read once (or is not there yet): edits may be saved
        let loadFailSaid = false; // the "could not be read" toast has been shown
        let query      = '';
        let editingUid = null;    // uid of the contact open in the edit form, or null when adding
        let dismissed  = new Set();   // dismissKey() strings for pairs the user marked "not a duplicate"
        let undoState  = null;    // { was, made, added } of the last duplicates merge, for its "Deshacer" (undoCards)

        //------------------------------------------------------------------------//
        // INITIALIZATION

        NayiveI18n.ready.then( function()
        {
            API_FILES = GumApi.API_FILES;
            store     = NayiveStore.createStore( { apiBase: API_FILES, conflicts: true, merge: mergeBook } );
            store.onMerged( onBookMerged );

            wireStaticUI();

            // The store's state machine drives the header plug for every read and write.
            store.onState( NayiveUI.syncIndicator() );

            // The plug's click and the focus / visibilitychange re-reads, all on ONE guarded
            // path (shared/ui.js). `contacts` is this tab's private snapshot and every
            // saveContacts() PUTs the whole .vcf (last write wins, no merge), so a tab left
            // open all day showed a stale agenda AND could upload it over a contact added on
            // the phone. The guard keeps the read out of an open dialog: loadContacts() ends
            // in render(), which would repaint under a detail / edit / duplicates sheet.
            NayiveUI.wireRefresh( { store: store, read: loadContacts } );

            // Probe the API, then load. On a failed probe the shared helper bounces to the
            // sign-in page only when we are really online with nothing cached; otherwise it
            // opens on the local cache and the store syncs once the connection is back.
            NayiveUI.bootWithStore( store, async function( who )
            {
                await loadContacts();
            } );
        });

        //------------------------------------------------------------------------//
        // PERSISTENCE

        async function loadContacts()
        {
            const [ vcf, meta ] = await Promise.all(
            [
                store.read( CONTACTS_FILE ),
                store.read( META_FILE )
            ]);

            if( vcf.source === 'empty' )                                          // first run, file not created yet
            {
                contacts      = [];
                unparsedCards = [];
                nextPos       = 0;
            }
            else if( vcf.body !== null )
            {
                const unparsed = [];
                contacts      = vcfToContacts( vcf.body, unparsed );
                unparsedCards = unparsed;
                nextPos       = contacts.length + unparsed.length;   // an added card goes after the last one

                // Text that holds no card at all is not an address book this page
                // can edit: saving the empty list would write over it.
                if( ! contacts.length && ! unparsed.length && vcf.body.trim() )
                    store.block( CONTACTS_FILE );
            }
            // else: server unreachable AND nothing cached — keep what we have,
            // never fall back to [] here (that is the save-over-real-data bug).
            // The store refuses to save this file until a read succeeds, and
            // canSave() keeps the list on screen from pretending otherwise.
            else if( ! bookRead && ! loadFailSaid )
            {
                loadFailSaid = true;    // once: the focus re-reads would repeat it
                flashToast( T( 'ui.store.notRead' ) );
            }

            if( vcf.body !== null || vcf.source === 'empty' )
                bookRead = true;

            // A card without a UID got one just now (parseVCard): write it once, so
            // the "not duplicates" marks and the picks that hang on it stay put
            // from one load to the next. Only on a fresh read from the server: a
            // cached copy may be older than the file.
            if( vcf.source === 'network' && contacts.some( c => c.src && ! c.src.uidRead ) )
                saveContacts();

            dismissed = new Set();

            if( meta.body !== null )
            {
                try
                {
                    const parsed = JSON.parse( meta.body );
                    ( parsed.notDuplicate || [] ).forEach( pair => dismissed.add( dismissKey( pair[ 0 ], pair[ 1 ] ) ) );
                }
                catch( _ ) { /* corrupt meta file — start with an empty dismissed set */ }
            }

            render();
        }

        // AUTO RE-READ
        //
        // Persists the "not a duplicate" set. Prunes entries whose contacts no longer exist.
        function saveMeta()
        {
            const live = new Set( contacts.map( c => c.uid ) );

            const notDuplicate = [ ...dismissed ]
                .map( k => k.split( ' ' ) )
                .filter( pair => live.has( pair[ 0 ] ) && live.has( pair[ 1 ] ) );

            dismissed = new Set( notDuplicate.map( p => dismissKey( p[ 0 ], p[ 1 ] ) ) );

            return store.write( META_FILE, JSON.stringify( { notDuplicate }, null, 2 ) );
        }

        function dismissKey( u1, u2 ) { return [ u1, u2 ].sort().join( ' ' ); }

        // TWO DEVICES, ONE ADDRESS BOOK (shared/store.js MERGE). Both saved from
        // the same copy: both changes are kept, card by card, by UID. A card is
        // compared as the text it is in the file - a card nobody touched is
        // written back line for line, so only real edits differ - and one
        // changed on both is merged field by field against its base copy
        // (mergeCard); with no base copy of it, the later REV wins (mine when
        // there is none). Cards with no UID (a card the parser could not read)
        // are told apart by their text. The "not duplicates" pairs merge as a
        // set. null = a side that is not an address book: nothing is merged over it.
        function mergeBook( path, base, mine, theirs )
        {
            const S = NayiveStore;

            if( path === META_FILE )
            {
                const pairs = t => { try { const v = JSON.parse( t ); return v && Array.isArray( v.notDuplicate ) ? v.notDuplicate : null; } catch( _ ) { return null; } };
                const m = pairs( mine ), t = pairs( theirs );
                if( ! m || ! t ) return null;
                const notDuplicate = S.mergeLists( base == null ? null : pairs( base ), m, t,
                                                   { id: p => Array.isArray( p ) ? dismissKey( p[ 0 ], p[ 1 ] ) : null } );
                return JSON.stringify( { notDuplicate }, null, 2 );
            }

            const m = vcfCards( mine ), t = vcfCards( theirs );
            if( ! m || ! t ) return null;
            const newer = ( x, y, tie ) => x.rev && y.rev && x.rev !== y.rev ? ( y.rev > x.rev ? y : x ) : tie;
            const merged = S.mergeLists( base == null ? null : vcfCards( base ), m, t,
                                         { id: c => c.uid,
                                           both: ( b, x, y ) => b === undefined ? newer( x, y, y ) : mergeCard( b, x, y ) } );
            return merged.length ? merged.map( c => c.text ).join( '\r\n' ) + '\r\n' : '';
        }

        // ONE CARD CHANGED ON BOTH SIDES (H2, list-apps #14). Kept whole from the
        // newer REV, the other side's edit of a DIFFERENT field was dropped: an
        // e-mail added on the PC lost the picture Chat had put on the phone's
        // card. Now the card is merged line by line against its base copy (`b`):
        //   - a line (a property) only one side changed takes that side's;
        //     both changed it: the newer REV's (a tie: mine);
        //   - phones, e-mails, addresses, webs... are one item per VALUE: one
        //     either side added stays, one either side removed goes, one whose
        //     type changed on one side takes that change;
        //   - an "item1." group (an iPhone's line + its label) is one item, and
        //     is renumbered when the other side's lines use that name;
        //   - REV ends as the newer of the two.
        // Lines are compared unfolded, so a fold or a QUOTED-PRINTABLE soft
        // break written another way is no change. b, m, t: { text, uid, rev }
        // as vcfCards gives them.
        function mergeCard( b, m, t )
        {
            const S      = NayiveStore;
            const B      = cardItems( b.text ), M = cardItems( m.text ), T = cardItems( t.text );
            const newerT = revKey( t.rev ) > revKey( m.rev );
            const out    = S.mergeLists( B.items, M.items, T.items,
                                         { id: i => i.k, both: ( bi, mi, ti ) => newerT ? ti : mi } );

            // Raw lines back; a group of theirs whose name one of mine took is renamed.
            const used = new Set( out.filter( i => M.raw.has( i ) && M.raw.get( i ).group ).map( i => M.raw.get( i ).group.toLowerCase() ) );
            const lines = [];

            for( const i of out )
            {
                const r = M.raw.get( i ) || T.raw.get( i );
                let   g = r.group;

                if( g && T.raw.has( i ) && ! M.raw.has( i ) && used.has( g.toLowerCase() ) )
                {
                    let n = 1;
                    while( used.has( 'item' + n ) ) n++;
                    g = 'item' + n;
                }
                if( g ) used.add( g.toLowerCase() );

                for( const p of r.lines )
                    lines.push( ...( g === r.group ? p : [ g + p[ 0 ].slice( r.group.length ) ].concat( p.slice( 1 ) ) ) );
            }

            return { text: [ M.begin ].concat( lines, [ M.end ] ).join( '\r\n' ), uid: m.uid, rev: newerT ? t.rev : m.rev };
        }

        // The lines of one card as merge items { k, t } - a key (null: none) and
        // the text it is compared by - with each item's raw lines beside it
        // (raw: item -> { group, lines: [ physical lines of each content line ] }).
        function cardItems( text )
        {
            const MULTI_PROPS = [ 'TEL', 'EMAIL', 'ADR', 'URL', 'IMPP', 'X-SOCIALPROFILE', 'RELATED', 'X-ABRELATEDNAMES', 'X-ABDATE' ];
            const items = [], raw = new Map(), groups = {};
            let   begin = 'BEGIN:VCARD', end = 'END:VCARD';

            for( const cl of contentLines( text ) )
            {
                const tag = cl.text.trim().toUpperCase();
                if( tag === 'BEGIN:VCARD' ) { begin = cl.phys.join( '\r\n' ); continue; }
                if( tag === 'END:VCARD' )   { end   = cl.phys.join( '\r\n' ); continue; }
                if( ! cl.text.trim() ) continue;

                const [ left, value ] = splitOnce( cl.text, ':' );
                const segs  = left === null ? [ '' ] : splitOutsideQuotes( left, ';' );
                const dot   = segs[ 0 ].lastIndexOf( '.' );
                const group = dot === -1 ? '' : segs[ 0 ].slice( 0, dot );
                const name  = segs[ 0 ].slice( dot + 1 ).trim().toUpperCase();
                const flat  = group ? cl.text.slice( group.length + 1 ) : cl.text;

                // The key: the property, and for a many-valued one its value too
                // (a phone by its digits, an e-mail in lower case).
                let k = null;
                if( left !== null && name )
                {
                    k = name;
                    if( MULTI_PROPS.indexOf( name ) !== -1 )
                    {
                        let v = unescapeText( decodeValue( value, parseParams( segs.slice( 1 ) ) ) ).trim();
                        if( name === 'TEL' )   v = v.replace( /^tel:/i, '' ).replace( /[^\d+]/g, '' );
                        if( name === 'EMAIL' ) v = v.toLowerCase();
                        k = name + ':' + v;
                    }
                }

                if( group )
                {
                    const gk = group.toLowerCase();
                    let   it = groups[ gk ];
                    if( ! it ) { it = groups[ gk ] = { k: k, t: '' }; items.push( it ); raw.set( it, { group: group, lines: [] } ); }
                    else if( /^X-AB/.test( it.k || '' ) && k && ! /^X-AB/.test( k ) ) it.k = k;   // keyed by its line, not its label
                    it.t += ( it.t ? '\n' : '' ) + flat;
                    raw.get( it ).lines.push( cl.phys );
                    continue;
                }

                const it = { k: k, t: flat };
                items.push( it );
                raw.set( it, { group: '', lines: [ cl.phys ] } );
            }

            return { items, raw, begin, end };
        }

        // The store merged another device's save in: the book (or the "not
        // duplicates" set) from now on. The list is not redrawn under an open
        // sheet; edits there find their card by UID.
        function onBookMerged( path, body )
        {
            if( path === META_FILE )
            {
                try { dismissed = new Set( ( JSON.parse( body ).notDuplicate || [] ).map( p => dismissKey( p[ 0 ], p[ 1 ] ) ) ); }
                catch( _ ) {}
                return;
            }
            if( path !== CONTACTS_FILE ) return;

            const unparsed = [];
            contacts      = vcfToContacts( body, unparsed );
            unparsedCards = unparsed;
            nextPos       = contacts.length + unparsed.length;
            bookRead      = true;
            if( ! document.querySelector( '.sheet-backdrop.open' ) ) render();
        }

        function saveContacts()
        {
            // Writes the local cache now and queues the upload; the store flushes
            // it immediately, on reconnect, or on tab focus. Fire-and-forget.
            return store.write( CONTACTS_FILE, contactsToVcf( contacts ) );
        }

        // Nothing may change on screen that cannot be saved. The store refuses to
        // save a file it could not read ('unread') or that this page does not
        // understand ('bad'), and until the first read is in, the list on screen
        // is not the address book yet: an add then would upload a one-card book
        // over the real one. Says why and answers false.
        function canSave()
        {
            const why = store.isBlocked( CONTACTS_FILE );

            if( bookRead && ! why )
                return true;

            flashToast( T( why === 'bad' ? 'ui.store.badFile' : why === 'unread' ? 'ui.store.notRead' : 'ui.store.loading' ) );
            return false;
        }

        //------------------------------------------------------------------------//
        // vCard 3.0  <->  contact MODEL
        //
        // A contact object:
        // {
        //   uid,
        //   fn,                                   // formatted / display name (vCard FN, required on write)
        //   n: { family, given },                  // every given name in one, every surname in the other
        //   org, title,
        //   tels:   [ { type, value } ],
        //   emails: [ { type, value } ],
        //   adrs:   [ { type, street, city, region, postal, country } ],
        //   urls:   [ { value } ],
        //   bday,                                 // 'YYYY-MM-DD', '--MM-DD' (no year) or ''
        //   note,
        //   photo,                                // 'data:image/jpeg|png;base64,...' or '' (see photoOf)
        //   src,                                  // the card as read from the file, or null (see parseVCard)
        //   pos,                                  // its place in the file (Infinity: not placed yet, goes last)
        //   rev                                   // when it was last edited here ('' : not in this session)
        // }

        function makeContact()
        {
            return {
                uid  : 'contact-' + Date.now() + '-' + Math.random().toString( 36 ).slice( 2, 8 ),
                fn   : '',
                n    : { family: '', given: '' },
                org  : '', title: '',
                tels : [], emails: [], adrs: [], urls: [],
                bday : '', note: '', photo: '',
                src  : null, pos: Infinity, rev: ''
            };
        }

        // --- Parsing ---------------------------------------------------------

        // `unparsed` (optional) collects, as { pos, text }, every card the parser
        // could not read - one it choked on, or one cut short by a new BEGIN or the
        // end of the file - so a save writes it back instead of dropping it. Every
        // card gets its place in the file (c.pos): the list is sorted to be shown,
        // the file is written back in its own order.
        function vcfToContacts( text, unparsed )
        {
            const out   = [];
            let   block = null;     // content lines of the card being read
            let   begin = '';       // its BEGIN:VCARD line, as written
            let   pos   = 0;        // cards met so far
            const made  = {};       // made-up UIDs so far -> how many (see below)

            const keepRaw = extra =>
            {
                const text = [ begin ].concat( ...block.map( l => l.phys ), extra ).join( '\r\n' );
                if( unparsed ) unparsed.push( { pos: pos, text: text } );
                pos++;
            };

            for( const cl of contentLines( text ) )
            {
                const tag = cl.text.trim().toUpperCase();

                if( tag === 'BEGIN:VCARD' )
                {
                    if( block ) keepRaw( [] );
                    block = [];
                    begin = cl.phys[ 0 ];
                    continue;
                }

                if( tag === 'END:VCARD' )
                {
                    if( block )
                    {
                        try
                        {
                            const c = normalizeContact( parseVCard( block ) );

                            // No UID in the card: one made from its own text, not a
                            // random one, so every device makes the SAME one and a
                            // merge (mergeBook) does not take the card for two. A
                            // second identical card gets "-2", and so on.
                            if( ! c.src.uidRead )
                            {
                                const h = 'contact-h' + NayiveStore.hashText( [ begin ].concat( ...block.map( l => l.phys ), cl.phys[ 0 ] ).join( '\n' ) );
                                made[ h ] = ( made[ h ] || 0 ) + 1;
                                c.uid = made[ h ] === 1 ? h : h + '-' + made[ h ];
                            }

                            c.src.begin = begin;
                            c.src.end   = cl.phys[ 0 ];
                            c.src.snap  = snapshot( c );

                            if( ! c.src.uidRead )
                                c.src.snap.uid = '';    // made up just now: to be written (see loadContacts)

                            c.pos = pos++;
                            out.push( c );
                        }
                        catch( _ ) { keepRaw( [ cl.phys[ 0 ] ] ); }   // one malformed card is kept as it is, not lost
                    }
                    block = null;
                    continue;
                }

                if( block && cl.text.trim() !== '' )
                    block.push( cl );
            }

            if( block ) keepRaw( [] );

            return out.sort( byDisplayName );
        }

        // The model field each vCard property feeds. Any other property is kept as
        // its lines and written back untouched.
        const FIELD_OF = { UID: 'uid', FN: 'fn', N: 'n', ORG: 'org', TITLE: 'title', TEL: 'tels', EMAIL: 'emails',
                           ADR: 'adrs', URL: 'urls', BDAY: 'bday', NOTE: 'note', PHOTO: 'photo' };

        // Reads one card's content lines into a contact. Each line is labelled on
        // the way (its group, its property name, the field it feeds and, for a
        // phone / email / address / web, the key of the entry it made), and the
        // card keeps them in c.src, so a save rewrites only what an edit changed
        // (see contactToVCard).
        function parseVCard( blockLines )
        {
            const c = makeContact();
            let   suffix  = '';
            let   nParts  = null;
            let   uidRead = false;

            for( const cl of blockLines )
            {
                const [ left, raw ] = splitOnce( cl.text, ':' );
                if( left === null ) continue;

                const segs   = splitOutsideQuotes( left, ';' );
                const dot    = segs[ 0 ].lastIndexOf( '.' );             // any "groupN." prefix
                const name   = segs[ 0 ].slice( dot + 1 ).toUpperCase();
                const params = parseParams( segs.slice( 1 ) );
                const value  = decodeValue( raw, params );

                cl.group = dot === -1 ? '' : segs[ 0 ].slice( 0, dot );
                cl.name  = name;
                cl.field = FIELD_OF[ name ] || '';

                // A phone / email / address / web: the entry it made, and its key.
                const entry = ( field, e ) => { c[ field ].push( e ); cl.key = entryKey( field, e ); };

                switch( name )
                {
                    case 'FN':
                        c.fn = unescapeText( value );
                        break;

                    case 'N':
                    {
                        // vCard N carries five components; a name carries two: every given
                        // name, and every surname. Spanish surnames come in pairs and no rule
                        // says where the first one ends ("Ruiz de la Herranz Mata"), so they
                        // are never split - which is also why the 'additional' component needs
                        // no guesswork: a phone with an English three-box form files a first
                        // surname there ("Alberto Gómez Aguilar" -> N:Aguilar;Alberto;Gómez;;),
                        // so it simply joins the surnames, in front.
                        const p = splitEscaped( value, ';' ).map( unescapeText );

                        c.n = { family : [ p[ 2 ], p[ 0 ] ].filter( Boolean ).join( ' ' ).trim(),
                                given  : ( p[ 1 ] || '' ).trim() };
                        suffix = ( p[ 4 ] || '' ).trim();
                        nParts = p;                     // the prefix ("Dra.") is kept from here on a save
                        break;
                    }

                    case 'ORG':
                        c.org = splitEscaped( value, ';' ).map( unescapeText ).filter( Boolean ).join( ' · ' );
                        break;

                    case 'TITLE':
                        c.title = unescapeText( value );
                        break;

                    case 'TEL':      // vCard 4.0 may write it as a URI: "tel:+34-600..."
                        entry( 'tels', { type: pickType( params, 'CELL' ), value: unescapeText( value ).trim().replace( /^tel:/i, '' ) } );
                        break;

                    case 'EMAIL':
                        entry( 'emails', { type: pickType( params, 'HOME' ), value: unescapeText( value ).trim() } );
                        break;

                    case 'ADR':
                    {
                        // ADR components: pobox ; ext ; street ; locality ; region ; postal ; country
                        const p = splitEscaped( value, ';' ).map( unescapeText );
                        entry( 'adrs',
                        {
                            type   : pickType( params, 'HOME' ),
                            street : [ p[0], p[1], p[2] ].filter( Boolean ).join( ', ' ).trim(),
                            city   : p[3] || '', region: p[4] || '', postal: p[5] || '', country: p[6] || ''
                        });
                        break;
                    }

                    case 'URL':
                        entry( 'urls', { value: value.trim() } );
                        break;

                    case 'BDAY':
                        c.bday = normalizeBday( value.trim(), params );
                        break;

                    case 'NOTE':
                        c.note = unescapeText( value );
                        break;

                    case 'UID':
                        if( value.trim() ) { c.uid = value.trim(); uidRead = true; }
                        break;

                    case 'PHOTO':
                        if( ! c.photo ) c.photo = photoOf( value, params );
                        break;
                }
            }

            // Real cards almost never put "Jr." in N's suffix: they put the note that tells
            // two people apart - "(peluo)", "(medico)". Keep it, where notes belong. The
            // honorific prefix is not shown; FN still shows it, and N keeps it on a save.
            if( suffix )
                c.note = c.note ? c.note + '\n' + suffix : suffix;

            // vcfToContacts adds begin / end (the card's own BEGIN and END lines) and
            // snap (the fields as read, see snapshot).
            c.src = { lines: blockLines, nParts: nParts, suffix: suffix, uidRead: uidRead };

            return c;
        }

        // Fill in whatever the source card left implicit so the rest of the app can rely on it.
        function normalizeContact( c )
        {
            if( ! c.n.given && ! c.n.family && c.fn )
            {
                const parts = c.fn.trim().split( /\s+/ );
                c.n.given  = parts.shift() || '';
                c.n.family = parts.join( ' ' );
            }

            if( ! c.fn )
                c.fn = displayName( c );

            return c;
        }

        // First meaningful TYPE value (ignoring transport/preference noise), else the fallback.
        function pickType( params, fallback )
        {
            const skip  = new Set( [ 'VOICE', 'PREF', 'INTERNET', 'QUOTED-PRINTABLE', '' ] );   // the last: 2.1's bare encoding
            const types = params.filter( p => p.key === 'TYPE' ).map( p => p.val ).filter( v => ! skip.has( v ) );

            return types[ 0 ] || fallback;
        }

        // 'YYYY-MM-DD', or '--MM-DD' for a birthday without a year (the vCard 4.0
        // form phones write; Tasks greets it too). Apple writes "no year" as 1604
        // (and names it in X-APPLE-OMIT-YEAR): not a real year, so it reads as
        // '--MM-DD' as well - the card's own BDAY line is left as it was.
        function normalizeBday( s, params )
        {
            let m = /^(\d{4})-?(\d{2})-?(\d{2})/.exec( s );

            if( m )
            {
                const omit = ( ( params || [] ).find( p => p.key === 'X-APPLE-OMIT-YEAR' ) || {} ).val;
                return ( m[ 1 ] === '1604' || m[ 1 ] === omit ? '--' : m[ 1 ] + '-' ) + m[ 2 ] + '-' + m[ 3 ];
            }

            m = /^--(\d{2})-?(\d{2})/.exec( s );
            if( m ) return '--' + m[ 1 ] + '-' + m[ 2 ];

            return '';   // free text is dropped rather than shown wrong (its BDAY line stays in the file)
        }

        // --- Serialization --------------------------------------------------
        //
        // A card read from the file keeps its lines (c.src) and goes back as it
        // was: what Contacts does not model is never lost - a PHOTO, NICKNAME,
        // CATEGORIES, an iPhone's item1.X-ABLabel, a second TYPE, the N prefix.
        // Only the fields an edit changed are written anew; a card nobody touched
        // goes back line for line. A new card (no c.src) is written whole.

        // In the file's own order (c.pos), never the list's: that one is sorted by
        // name in the reader's language, and a save must not shuffle the file.
        function contactsToVcf( list )
        {
            const at = x => Number.isFinite( x.pos ) ? x.pos : Number.MAX_SAFE_INTEGER;   // not placed yet: last

            return list.map( c => ( { pos: c.pos, text: contactToVCard( c ) } ) )
                       .concat( unparsedCards )
                       .sort( ( a, b ) => at( a ) - at( b ) )
                       .map( x => x.text ).join( '\r\n' ) + '\r\n';
        }

        const FIELDS = [ 'uid', 'fn', 'n', 'org', 'title', 'tels', 'emails', 'adrs', 'urls', 'bday', 'note', 'photo' ];
        const MULTI  = new Set( [ 'tels', 'emails', 'adrs', 'urls' ] );

        // Each field of the model as one string, so a save can tell which ones an
        // edit changed. Entries are keyed in a fixed order: the form builds its
        // objects in another one.
        function snapshot( c )
        {
            const s = { uid: c.uid, fn: c.fn, n: JSON.stringify( [ c.n.family, c.n.given ] ),
                        org: c.org, title: c.title, bday: c.bday, note: c.note, photo: c.photo };

            for( const f of MULTI )
                s[ f ] = JSON.stringify( c[ f ].map( e => entryKey( f, e ) ) );

            return s;
        }

        function entryKey( field, e )
        {
            if( field === 'adrs' ) return JSON.stringify( [ e.type, e.street, e.city, e.region, e.postal, e.country ] );
            if( field === 'urls' ) return JSON.stringify( [ e.value ] );
            return JSON.stringify( [ e.type, e.value ] );
        }

        function contactToVCard( c )
        {
            const src = c.src;

            if( ! src )
                return [ 'BEGIN:VCARD', 'VERSION:3.0' ]
                    .concat( ...FIELDS.map( f => fieldLines( c, f, null ) ), [ revLine( c ), 'END:VCARD' ] )
                    .map( foldLine ).join( '\r\n' );

            const now  = snapshot( c );
            const redo = new Set( FIELDS.filter( f => now[ f ] !== src.snap[ f ] ) );

            if( ! redo.size )
                return [ src.begin ].concat( ...src.lines.map( l => l.phys ), [ src.end ] ).join( '\r\n' );

            // Only a uid added (see loadContacts): the card keeps its VERSION and REV.
            // Anything else makes it a vCard 3.0 card, as the new lines are.
            const whole = ! ( redo.size === 1 && redo.has( 'uid' ) );

            // N's suffix is shown inside the note (see parseVCard): it stays in N only
            // while the NOTE line goes back as it was.
            if( src.suffix && redo.has( 'note' ) ) redo.add( 'n' );

            // vCard 3.0 wants FN and N: a card without them gets them.
            if( whole )
                for( const f of [ 'fn', 'n' ] )
                    if( ! src.lines.some( l => l.field === f ) ) redo.add( f );

            // The new lines of each field. A phone / email / address / web the edit
            // left as it was keeps its own line: its item group, its label, every TYPE.
            const reused = new Set();
            const fresh  = {};

            for( const f of redo )
                fresh[ f ] = freshLines( c, f, src, redo, reused, whole );

            // An itemN.X-ABLabel (or X-ABADR...) goes with the line it labelled.
            const gone = new Set(), kept = new Set();

            for( const l of src.lines )
                if( l.group && l.field )
                    ( redo.has( l.field ) && ! reused.has( l ) ? gone : kept ).add( l.group );

            // A field the card did not have goes on top, after VERSION.
            let   head    = FIELDS.filter( f => redo.has( f ) && ! src.lines.some( l => l.field === f ) );
            const putHead = () => { for( const f of head ) out.push( ...fresh[ f ] ); head = []; };
            const done    = new Set();
            const out     = [ src.begin ];

            if( ! src.lines.some( l => l.name === 'VERSION' ) )
            {
                if( whole ) out.push( 'VERSION:3.0' );
                putHead();
            }

            for( const l of src.lines )
            {
                if( l.name === 'VERSION' )
                {
                    if( done.has( 'VERSION' ) ) continue;
                    done.add( 'VERSION' );
                    out.push( ...( whole ? [ 'VERSION:3.0' ] : l.phys ) );
                    putHead();
                    continue;
                }

                if( l.name === 'REV' && whole ) continue;          // a new one goes at the end

                if( l.field && redo.has( l.field ) )
                {
                    if( ! done.has( l.field ) ) out.push( ...fresh[ l.field ] );
                    done.add( l.field );
                    continue;
                }

                if( l.group && gone.has( l.group ) && ! kept.has( l.group ) ) continue;

                out.push( ...keptLines( l, whole ) );
            }

            if( whole ) out.push( revLine( c ) );
            out.push( src.end );

            return out.join( '\r\n' );
        }

        // One field's lines as the model says, vCard 3.0, folded. With the card's
        // src: an entry of a multi-value field that is still as it was read reuses
        // that line (added to `reused`), and N keeps what the model does not hold.
        function freshLines( c, f, src, redo, reused, whole )
        {
            if( ! src || ! MULTI.has( f ) )
                return fieldLines( c, f, src, redo ).map( foldLine );

            const out = [];

            for( const e of c[ f ] )
            {
                const line = entryLine( f, e );
                if( ! line ) continue;

                const k   = entryKey( f, e );
                const old = src.lines.find( l => l.field === f && l.key === k && ! reused.has( l ) );

                if( old ) { reused.add( old ); out.push( ...keptLines( old, whole ) ); }
                else      out.push( foldLine( line ) );
            }

            return out;
        }

        // The unfolded lines of one field (`src` / `redo` only matter to N).
        function fieldLines( c, f, src, redo )
        {
            switch( f )
            {
                case 'uid':   return [ 'UID:' + c.uid ];
                case 'fn':    return [ 'FN:' + escapeText( displayName( c ) ) ];
                case 'n':     return [ nLine( c, src, redo ) ];
                case 'org':   return c.org   ? [ 'ORG:'   + escapeText( c.org ) ]   : [];
                case 'title': return c.title ? [ 'TITLE:' + escapeText( c.title ) ] : [];
                case 'bday':  return c.bday  ? [ 'BDAY:'  + c.bday ]                : [];
                case 'note':  return c.note  ? [ 'NOTE:'  + escapeText( c.note ) ]  : [];
                case 'photo': return photoLines( c.photo );
            }

            return c[ f ].map( e => entryLine( f, e ) ).filter( Boolean );
        }

        // The picture as vCard 3.0 writes it: PHOTO;ENCODING=b;TYPE=JPEG:<base64>.
        function photoLines( photo )
        {
            const d = /^data:image\/([a-z]+);base64,(.+)$/.exec( photo || '' );
            return d ? [ 'PHOTO;ENCODING=b;TYPE=' + d[ 1 ].toUpperCase() + ':' + d[ 2 ] ] : [];
        }

        function entryLine( f, e )
        {
            if( f === 'tels' )
                return e.value.trim() ? 'TEL;TYPE=' + ( e.type || 'VOICE' ) + ':' + escapeText( e.value.trim() ) : '';

            if( f === 'emails' )
                return e.value.trim() ? 'EMAIL;TYPE=' + ( e.type || 'HOME' ) + ':' + escapeText( e.value.trim() ) : '';

            if( f === 'urls' )
                return e.value.trim() ? 'URL:' + e.value.trim() : '';

            if( ! ( e.street || e.city || e.region || e.postal || e.country ) )
                return '';

            return 'ADR;TYPE=' + ( e.type || 'HOME' ) + ':' +
                   [ '', '', e.street, e.city, e.region, e.postal, e.country ].map( escapeText ).join( ';' );
        }

        // N always has five components: family ; given ; additional ; prefix ; suffix.
        // A card read from the file keeps its prefix ("Dra."), its components as
        // they were while the name is unchanged, and its suffix while the NOTE
        // line goes back as it was (see parseVCard).
        function nLine( c, src, redo )
        {
            const p     = ( src && src.nParts ) || [];
            const same  = !! ( src && src.nParts ) && JSON.stringify( [ c.n.family, c.n.given ] ) === src.snap.n;
            const parts = same ? [ p[ 0 ], p[ 1 ], p[ 2 ], p[ 3 ] ] : [ c.n.family, c.n.given, '', p[ 3 ] ];

            parts.push( src && ! redo.has( 'note' ) ? src.suffix : '' );

            return 'N:' + parts.map( s => escapeText( s || '' ) ).join( ';' );
        }

        // A kept line, as it was. When the card becomes vCard 3.0, a 2.1
        // QUOTED-PRINTABLE line loses its soft breaks (3.0 has none: it is
        // re-folded, still encoded) and a trailing blank line goes.
        function keptLines( l, whole )
        {
            if( ! whole ) return l.phys;

            if( l.phys.length > 1 && isQuotedPrintable( l.text ) )
                return [ foldLine( l.text ) ];

            const p = l.phys.slice();
            while( p.length > 1 && p[ p.length - 1 ].trim() === '' ) p.pop();
            return p;
        }

        // A card's REV is when it was last edited here (commitEdit / doMerge set
        // c.rev), so saving the book again later - for another card - does not
        // re-date it.
        function revLine( c )
        {
            return 'REV:' + ( c.rev || revStamp() );
        }

        function revStamp()
        {
            return new Date().toISOString().replace( /\.\d+Z$/, 'Z' );
        }

        //------------------------------------------------------------------------//
        // DERIVED HELPERS

        function displayName( c )
        {
            if( c.fn && c.fn.trim() )
                return c.fn.trim();

            const nm = [ c.n.given, c.n.family ].filter( Boolean ).join( ' ' ).trim();
            if( nm ) return nm;

            if( c.org ) return c.org;

            const e = c.emails.find( x => x.value.trim() );
            if( e ) return e.value.trim();

            const t = c.tels.find( x => x.value.trim() );
            if( t ) return t.value.trim();

            return T( 'contact.noName' );
        }

        function subLine( c )
        {
            if( c.org && c.title ) return c.title + ' · ' + c.org;
            if( c.org )            return c.org;
            if( c.title )          return c.title;

            const t = c.tels.find( x => x.value.trim() );
            if( t ) return t.value.trim();

            const e = c.emails.find( x => x.value.trim() );
            if( e ) return e.value.trim();

            return '';
        }

        // Many countries use two surnames (father's + mother's). Take the FIRST
        // word of the given name and the FIRST word of the family name, so
        // "Ana Sofía Pérez Ruiz" gives 'AP', not 'AR'.
        // A card's circle: its picture, or its initials on the name's colour.
        function paintAvatar( av, c, sName )
        {
            av.textContent = '';
            av.style.background = avatarColor( sName );

            if( c.photo )
            {
                const img = document.createElement( 'img' );
                img.src = c.photo;
                img.alt = '';
                img.loading = 'lazy';
                av.appendChild( img );
            }
            else av.textContent = initials( c, sName );
        }

        function initials( c, sName )
        {
            const firstWord = s => ( s || '' ).trim().split( /\s+/ )[ 0 ] || '';

            const g = firstWord( c && c.n && c.n.given );
            const f = firstWord( c && c.n && c.n.family );

            if( g && f ) return ( g[ 0 ] + f[ 0 ] ).toUpperCase();

            const parts = ( sName || '' ).trim().split( /\s+/ ).filter( Boolean );

            if( parts.length === 0 ) return '?';
            if( parts.length === 1 ) return parts[ 0 ].slice( 0, 2 ).toUpperCase();

            return ( parts[ 0 ][ 0 ] + parts[ parts.length - 1 ][ 0 ] ).toUpperCase();
        }

        // Stable pastel-ish colour derived from the name, tuned for the dark theme.
        function avatarColor( sName )
        {
            let h = 0;
            for( let i = 0; i < sName.length; i++ )
                h = ( h * 31 + sName.charCodeAt( i ) ) % 360;

            return 'hsl(' + h + ', 42%, 42%)';
        }

        function foldForSearch( s )
        {
            return String( s ).normalize( 'NFD' ).replace( /[\u0300-\u036f]/g, "" ).toLowerCase();
        }

        function byDisplayName( a, b )
        {
            return displayName( a ).localeCompare( displayName( b ), NayiveUI.lang(), { sensitivity: 'base' } );
        }

        function findContact( uid )
        {
            return contacts.find( c => c.uid === uid );
        }

        //------------------------------------------------------------------------//
        // DUPLICATE DETECTION
        //
        // Deterministic and explainable: every candidate pair records WHY it matched.
        // Biased towards precision — a wrong merge loses data, a missed duplicate is only an
        // annoyance. A fuzzy name match must be corroborated by a second signal; an exact
        // (accent/case/order-insensitive) name match is surfaced on its own for review.

        const NAME_SIM_THRESHOLD = 0.85;   // ~1 substitution in a short surname (Gonzalez/Gonzales); still needs corroboration

        function normPhone( raw )
        {
            const d = String( raw || '' ).replace( /\D/g, '' );
            return d.length >= 5 ? d : '';
        }

        // Compare on the last 9 digits so "+34 600 123 456", "0034600123456" and "600123456"
        // all match despite country-code / trunk-prefix differences.
        function phoneTail( digits )
        {
            return digits.length > 9 ? digits.slice( -9 ) : digits;
        }

        function normEmail( raw )
        {
            return String( raw || '' ).trim().toLowerCase();
        }

        function nameTokens( c )
        {
            return foldForSearch( [ c.n.given, c.n.family ].filter( Boolean ).join( ' ' ) )
                .replace( /[^a-z0-9]+/g, ' ' ).trim().split( ' ' ).filter( Boolean );
        }

        function contactKeys( c )
        {
            const tokens = nameTokens( c );
            const emails = c.emails.map( e => normEmail( e.value ) ).filter( Boolean );

            return {
                uid    : c.uid,
                phones : new Set( c.tels.map( t => phoneTail( normPhone( t.value ) ) ).filter( Boolean ) ),
                emails : new Set( emails ),
                domains: new Set( emails.map( e => e.slice( e.indexOf( '@' ) + 1 ) ).filter( Boolean ) ),
                org    : foldForSearch( c.org || '' ).trim(),
                tokens : tokens,
                nameKey: tokens.slice().sort().join( ' ' )
            };
        }

        function intersects( a, b )
        {
            for( const x of a ) if( b.has( x ) ) return true;
            return false;
        }

        // Classic two-row Levenshtein edit distance.
        function levenshtein( a, b )
        {
            if( a === b )     return 0;
            if( ! a.length )  return b.length;
            if( ! b.length )  return a.length;

            let prev = Array.from( { length: b.length + 1 }, ( _, i ) => i );

            for( let i = 1; i <= a.length; i++ )
            {
                const cur = [ i ];

                for( let j = 1; j <= b.length; j++ )
                {
                    const cost = a[ i - 1 ] === b[ j - 1 ] ? 0 : 1;
                    cur[ j ] = Math.min( cur[ j - 1 ] + 1, prev[ j ] + 1, prev[ j - 1 ] + cost );
                }

                prev = cur;
            }

            return prev[ b.length ];
        }

        function nameSim( a, b )
        {
            const max = Math.max( a.length, b.length );
            return max === 0 ? 0 : 1 - levenshtein( a, b ) / max;
        }

        // True when `short` reads as an abbreviation of `long`: same surname (last token) and
        // every other short token is a prefix of a distinct other long token — so
        // "j m perez" ~ "julia maria perez" and "jose m" ~ "jose maria".
        function isAbbrevOf( short, long )
        {
            if( short.length < 2 || long.length < 2 || short.length > long.length ) return false;
            if( short[ short.length - 1 ] !== long[ long.length - 1 ] )              return false;

            const pool = long.slice( 0, -1 );
            let   matched = 0;

            for( const tok of short.slice( 0, -1 ) )
            {
                const idx = pool.findIndex( p => p.startsWith( tok ) );
                if( idx === -1 ) return false;
                pool.splice( idx, 1 );
                matched++;
            }

            return matched > 0;
        }

        /**
         * Scans the whole address book for likely-duplicate groups.
         *
         * @param   list          contact array to scan.
         * @param   dismissedSet  Set of dismissKey() strings to skip (defaults to the module set).
         * @returns array of { contacts:[...], reasons:string[], confidence:'alta'|'media' },
         *          most-actionable first.
         */
        function findDuplicateGroups( list, dismissedSet = dismissed )
        {
            const keys   = list.map( contactKeys );
            const parent = keys.map( ( _, i ) => i );

            const find  = x => { while( parent[ x ] !== x ) x = parent[ x ] = parent[ parent[ x ] ]; return x; };
            const union = ( a, b ) => { a = find( a ); b = find( b ); if( a !== b ) parent[ a ] = b; };

            const pairReasons = new Map();   // "i,j" -> string[]
            const pairConf    = new Map();   // "i,j" -> 'alta' | 'media'

            for( let i = 0; i < keys.length; i++ )
            {
                for( let j = i + 1; j < keys.length; j++ )
                {
                    const A = keys[ i ], B = keys[ j ];

                    if( dismissedSet.has( dismissKey( A.uid, B.uid ) ) )
                        continue;

                    const reasons = [];

                    const samePhone = intersects( A.phones, B.phones );
                    const sameMail  = intersects( A.emails, B.emails );
                    if( samePhone ) reasons.push( T( 'contact.samePhone' ) );
                    if( sameMail )  reasons.push( T( 'contact.sameEmail' ) );
                    const sharedContact = samePhone || sameMail;

                    const bothNamed = !! ( A.nameKey && B.nameKey );
                    const sameName  = bothNamed && A.nameKey === B.nameKey;
                    const simName   = bothNamed && ! sameName && nameSim( A.nameKey, B.nameKey ) >= NAME_SIM_THRESHOLD;
                    const abbrev    = bothNamed && ! sameName &&
                                      ( isAbbrevOf( A.tokens, B.tokens ) || isAbbrevOf( B.tokens, A.tokens ) );

                    if( sameName )     reasons.push( T( 'contact.sameName' ) );
                    else if( simName ) reasons.push( T( 'contact.similarName' ) );
                    else if( abbrev )  reasons.push( T( 'contact.shortName' ) );

                    // A second signal INDEPENDENT of the name (a shared surname is not one — the
                    // name match already implies it).
                    const corroboration = sharedContact
                                       || ( !! A.org && A.org === B.org )
                                       || intersects( A.domains, B.domains );

                    const isCandidate = sharedContact
                                     || sameName
                                     || ( ( simName || abbrev ) && corroboration );

                    if( ! isCandidate )
                        continue;

                    pairReasons.set( i + ',' + j, reasons );
                    pairConf.set( i + ',' + j, ( sharedContact || ( sameName && corroboration ) ) ? 'alta' : 'media' );
                    union( i, j );
                }
            }

            const buckets = new Map();

            for( const [ key, reasons ] of pairReasons )
            {
                const [ i, j ] = key.split( ',' ).map( Number );
                const root     = find( i );

                if( ! buckets.has( root ) )
                    buckets.set( root, { idx: new Set(), reasons: new Set(), confidence: 'media' } );

                const b = buckets.get( root );
                b.idx.add( i ).add( j );
                reasons.forEach( r => b.reasons.add( r ) );
                if( pairConf.get( key ) === 'alta' ) b.confidence = 'alta';
            }

            const rank = { alta: 0, media: 1 };

            return [ ...buckets.values() ]
                .map( b => ({
                    contacts  : [ ...b.idx ].map( n => list[ n ] ).sort( byDisplayName ),
                    reasons   : [ ...b.reasons ],
                    confidence: b.confidence
                }) )
                .sort( ( a, b ) =>
                       rank[ a.confidence ] - rank[ b.confidence ]
                    || b.contacts.length - a.contacts.length
                    || byDisplayName( a.contacts[ 0 ], b.contacts[ 0 ] ) );
        }

        //------------------------------------------------------------------------//
        // RENDERING

        function render()
        {
            contacts.sort( byDisplayName );

            const listEl  = document.getElementById( 'contactList' );
            const emptyEl = document.getElementById( 'emptyState' );

            listEl.innerHTML = '';

            // The open group is gone (renamed or deleted elsewhere): all contacts.
            if( view.indexOf( 'g:' ) === 0 && ! groupExists( view.slice( 2 ) ) ) view = 'all';
            if( treeView ) treeView.render();
            document.getElementById( 'viewName' ).textContent = view === 'all' ? '' : viewName( view );

            const matcher = buildMatcher( query );
            const shown   = view === 'all' ? contacts : contacts.filter( inView );
            const visible = matcher ? shown.filter( matcher ) : shown;

            document.getElementById( 'searchInput' ).placeholder = '[' + contacts.length + '] ' + SEARCH_PLACEHOLDER();

            if( visible.length === 0 )
            {
                listEl.style.display = 'none';
                emptyEl.style.display = 'flex';
                buildAzRail( [] );

                if( contacts.length === 0 )
                {
                    document.getElementById( 'emptyTitle' ).textContent = T( 'contact.emptyTitle' );
                    document.getElementById( 'emptyBody' ).textContent  = T( 'contact.emptyBody' );
                }
                else if( ! shown.length )
                {
                    document.getElementById( 'emptyTitle' ).textContent = viewName( view );
                    document.getElementById( 'emptyBody' ).textContent  = T( view === 'fav' ? 'contact.favEmpty' : 'contact.groupEmpty' );
                }
                else
                {
                    document.getElementById( 'emptyTitle' ).textContent = T( 'contact.noResults' );
                    document.getElementById( 'emptyBody' ).textContent  = TF( 'contact.noMatch', { q: query.trim() } );
                }

                return;
            }

            emptyEl.style.display = 'none';
            listEl.style.display  = '';

            // Each letter is its own <div>: a sticky head only stays pinned while its
            // OWN parent is on screen, so wrapping is what makes A stop hovering at
            // the top once you have scrolled down into B. Flat siblings would pile
            // every head already scrolled past on top of each other at top:0.
            let currentLetter = null;
            let groupEl       = null;
            const letters     = [];

            for( const c of visible )
            {
                const letter = firstLetter( displayName( c ) );

                if( letter !== currentLetter )
                {
                    currentLetter = letter;
                    letters.push( letter );

                    groupEl = document.createElement( 'div' );
                    groupEl.className = 'letter-group';
