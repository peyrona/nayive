                    const head = document.createElement( 'div' );
                    head.className   = 'letter-head';
                    head.textContent = letter;
                    head.dataset.letter = letter;
                    groupEl.appendChild( head );

                    listEl.appendChild( groupEl );
                }

                groupEl.appendChild( buildContactRow( c ) );
            }

            buildAzRail( letters );
        }

        /* --- A-Z jump rail ------------------------------------------------------
         * Paints one tick per letter that render() actually emitted a head for, in
         * the same order, and hides itself when the list is short enough to thumb
         * through (AZ_RAIL_MIN) - a rail over 30 rows is clutter, not a shortcut.
         * -----------------------------------------------------------------------*/
        const AZ_RAIL_MIN = 30;             // rows below this: no rail

        function buildAzRail( letters )
        {
            const rail = document.getElementById( 'azRail' );

            rail.innerHTML = '';
            azHideBubble();

            // One letter is not a jump target, and neither is a list you can flick past.
            if( letters.length < 2 ||
                contactList().querySelectorAll( '.contact-row' ).length < AZ_RAIL_MIN )
            {
                rail.hidden = true;
                return;
            }

            for( const letter of letters )
            {
                const b = document.createElement( 'button' );
                b.type      = 'button';
                b.className = 'az-letter';
                b.dataset.letter  = letter;
                b.textContent     = letter;
                b.tabIndex        = -1;     // the rail is one target, not 27 tab stops
                b.setAttribute( 'aria-hidden', 'true' );
                rail.appendChild( b );
            }

            rail.hidden = false;
        }

        function contactList()
        {
            return document.getElementById( 'contactList' );
        }

        // Which rail tick sits under this y? Geometry, not elementFromPoint: the
        // ticks are pointer-events:none so the rail keeps the capture while dragging.
        function azLetterAt( y )
        {
            const ticks = document.getElementById( 'azRail' ).children;
            if( ! ticks.length ) return null;

            for( const t of ticks )
            {
                const r = t.getBoundingClientRect();
                if( y < r.bottom ) return t;
            }

            return ticks[ ticks.length - 1 ];
        }

        function azJumpTo( letter )
        {
            const head = contactList().querySelector( '.letter-head[data-letter="' + letter + '"]' );
            if( ! head ) return;

            // 'auto', not 'smooth': while scrubbing the rail a queued smooth scroll
            // per letter fights the finger.
            head.scrollIntoView( { block: 'start', behavior: 'auto' } );

            for( const t of document.getElementById( 'azRail' ).children )
                t.classList.toggle( 'on', t.dataset.letter === letter );
        }

        function azHideBubble()
        {
            const bub = document.getElementById( 'azBubble' );
            bub.hidden = true;
            bub.textContent = '';
        }

        function wireAzRail()
        {
            const rail = document.getElementById( 'azRail' );
            const bub  = document.getElementById( 'azBubble' );

            function track( ev )
            {
                const tick = azLetterAt( ev.clientY );
                if( ! tick ) return;

                azJumpTo( tick.dataset.letter );

                bub.textContent = tick.dataset.letter;
                bub.hidden      = false;
            }

            rail.addEventListener( 'pointerdown', ev => {
                ev.preventDefault();                       // no text selection, no page scroll
                rail.setPointerCapture( ev.pointerId );
                rail.classList.add( 'dragging' );
                track( ev );
            } );

            rail.addEventListener( 'pointermove', ev => {
                if( rail.hasPointerCapture( ev.pointerId ) ) track( ev );
            } );

            function end( ev )
            {
                if( rail.hasPointerCapture( ev.pointerId ) ) rail.releasePointerCapture( ev.pointerId );
                rail.classList.remove( 'dragging' );
                azHideBubble();
            }

            rail.addEventListener( 'pointerup',     end );
            rail.addEventListener( 'pointercancel', end );
        }

        // Text fields only (names, org, title, note, emails). Phones are matched separately,
        // digit-by-digit, so that spaces, "+", "(0)" etc. on either side are ignored.
        //
        // BOTH parts of N: go in, not only the FN that displayName() returns. A card can
        // hold a name its FN never shows - an imported surname FN left out - and typing it
        // has to find the contact: being unsearchable by your own name is never acceptable.
        function contactHaystack( c )
        {
            return foldForSearch( [
                displayName( c ),
                c.n.given, c.n.family,
                c.org, c.title, c.note,
                ...c.emails.map( e => e.value )
            ].join( ' ' ) );
        }

        // Returns a predicate over contacts, or null when the query is empty. Plain
        // accent-insensitive substring match on text; if the query carries any digits it also
        // matches against each phone reduced to bare digits.
        function buildMatcher( rawQuery )
        {
            const qText   = foldForSearch( rawQuery.trim() );
            // Phone numbers are matched by their digits only when the query looks like
            // one ("+34 600", "600-12"): "Pepe 2" must not match every phone with a 2.
            const qDigits = /^[\d\s+\-().\/]+$/.test( rawQuery.trim() ) ? rawQuery.replace( /\D/g, '' ) : '';

            if( ! qText )
                return null;

            return function( c )
            {
                if( contactHaystack( c ).includes( qText ) )
                    return true;

                return qDigits.length > 0 &&
                       c.tels.some( t => t.value.replace( /\D/g, '' ).includes( qDigits ) );
            };
        }

        function firstLetter( sName )
        {
            const ch = foldForSearch( sName ).charAt( 0 ).toUpperCase();
            return /[A-Z]/.test( ch ) ? ch : '#';
        }

        function buildContactRow( c )
        {
            const name = displayName( c );

            // Clicks, keys and the tick / ⋮ are the item browser's (LIST below).
            const row = document.createElement( 'div' );
            row.className = 'contact-row';
            row.dataset.uid = c.uid;

            appendFace( row, c, name );

            if( isFav( c ) )
            {
                const st = document.createElement( 'span' );
                st.className = 'ct-star';
                st.title = T( 'contact.favourites' );
                st.innerHTML = NayiveUI.glyph( 'star' );
                row.appendChild( st );
            }

            return row;
        }

        // The avatar, the name and the sub line, as the list shows a contact - also
        // the members of a group in the Duplicates sheet.
        function appendFace( row, c, name )
        {
            const av = document.createElement( 'div' );
            av.className = 'avatar';
            paintAvatar( av, c, name );
            row.appendChild( av );

            const meta = document.createElement( 'div' );
            meta.className = 'contact-meta';

            const nm = document.createElement( 'div' );
            nm.className = 'contact-name';
            nm.textContent = name;
            meta.appendChild( nm );

            const sub = subLine( c );
            if( sub )
            {
                const sb = document.createElement( 'div' );
                sb.className = 'contact-sub';
                sb.textContent = sub;
                meta.appendChild( sb );
            }

            row.appendChild( meta );
        }

        //------------------------------------------------------------------------//
        // GROUPS  -  the card's own CATEGORIES line (vCard 3.0), the way phones
        // and Google keep a contact's groups, so the .vcf carries them out and
        // back. A favourite is the "starred" category (Google's mark for one).
        // Contacts never modelled CATEGORIES: it is one of the lines a card
        // keeps as it was read (c.src, see contactToVCard), so groups are read
        // from those lines, and a change writes the card as the save would,
        // with a new CATEGORIES line and a new REV, and reads it back
        // (cardWithCats) - the reading and writing code is not touched.

        const STARRED     = 'starred';
        const HIDDEN_CATS = new Set( [ STARRED, 'mycontacts' ] );   // system groups: never listed

        // Every category on the card, in its order, once each (case aside). A
        // merged card can carry two CATEGORIES lines: both count.
        function catsOf( c )
        {
            const out = [];

            for( const l of ( c.src ? c.src.lines : [] ) )
            {
                if( l.name !== 'CATEGORIES' ) continue;

                const [ left, raw ] = splitOnce( l.text, ':' );
                if( left === null ) continue;

                const value = decodeValue( raw, parseParams( splitOutsideQuotes( left, ';' ).slice( 1 ) ) );

                for( const v of splitEscaped( value, ',' ).map( s => unescapeText( s ).trim() ) )
                    if( v && ! out.some( x => x.toLowerCase() === v.toLowerCase() ) ) out.push( v );
            }

            return out;
        }

        const sameCat  = ( a, b ) => a.toLowerCase() === b.toLowerCase();
        const isFav    = c => catsOf( c ).some( x => sameCat( x, STARRED ) );
        const groupsOf = c => catsOf( c ).filter( x => ! HIDDEN_CATS.has( x.toLowerCase() ) );
        const inGroup  = ( c, g ) => groupsOf( c ).some( x => sameCat( x, g ) );

        // The card as the save would write it, its CATEGORIES set to `cats` and
        // a new REV (the other device's merge takes the newer one), read back.
        // A card made here gains its lines that way. null: it did not read back.
        function cardWithCats( c, cats )
        {
            const out = [], stamp = 'REV:' + revStamp();
            let   rev = false;

            for( const cl of contentLines( contactToVCard( c ) ) )
            {
                const left = splitOnce( cl.text, ':' )[ 0 ];
                let   name = left === null ? '' : splitOutsideQuotes( left, ';' )[ 0 ];
                name = name.slice( name.lastIndexOf( '.' ) + 1 ).trim().toUpperCase();

                if( name === 'CATEGORIES' ) continue;
                if( name === 'REV' ) { if( ! rev ) out.push( stamp ); rev = true; continue; }

                if( cl.text.trim().toUpperCase() === 'END:VCARD' )
                {
                    if( cats.length ) out.push( foldLine( 'CATEGORIES:' + cats.map( escapeText ).join( ',' ) ) );
                    if( ! rev ) out.push( stamp );
                }

                out.push( ...cl.phys );
            }

            const nc = vcfToContacts( out.join( '\r\n' ) + '\r\n' )[ 0 ];
            if( ! nc || nc.uid !== c.uid ) return null;

            nc.pos = c.pos;
            return nc;
        }

        // Changes the categories of these cards (fn: the old list -> the new
        // one) and saves. `msg`: the toast, whose Undo puts each card back as
        // it was (undoCards: by uid, on the book as it is now).
        function changeCats( uids, fn, msg )
        {
            if( ! canSave() ) return false;

            const was = [], made = new Map();

            for( const uid of uids )
            {
                const i = contacts.findIndex( x => x.uid === uid );
                if( i === -1 ) continue;

                const c = contacts[ i ], before = catsOf( c ), after = fn( before.slice() );
                if( after.join( '\n' ) === before.join( '\n' ) ) continue;

                const nc = cardWithCats( c, after );
                if( ! nc ) continue;

                was.push( c );
                contacts[ i ] = nc;
                made.set( uid, contactToVCard( nc ) );
            }

            if( was.length )
            {
                render();
                saveContacts();
                refreshDedupIfOpen();
            }

            if( msg && was.length ) flashUndo( msg, function() { if( canSave() ) undoCards( was, made, [] ); } );
            else if( msg )          flashToast( msg );
            return true;
        }

        const withCat    = g => cats => cats.some( x => sameCat( x, g ) ) ? cats : cats.concat( g );
        const withoutCat = g => cats => cats.filter( x => ! sameCat( x, g ) );

        // Groups made here that nobody is in yet: a group is only a word on its
        // cards, so an empty one lives on this device until a card takes it.
        const EMPTY_KEY = 'nayive-contact-empty-groups';
        let   emptyGroups = [];
        try { emptyGroups = JSON.parse( localStorage.getItem( EMPTY_KEY ) || '[]' ).filter( g => typeof g === 'string' && g ); } catch( _ ) {}

        function setEmptyGroups( list )
        {
            emptyGroups = list;
            try { localStorage.setItem( EMPTY_KEY, JSON.stringify( list ) ); } catch( _ ) {}
        }

        // [ { name, n } ] every group, by name: the cards' own, then the empty ones.
        function allGroups()
        {
            const by = new Map();

            for( const c of contacts )
                for( const g of groupsOf( c ) )
                {
                    const k = g.toLowerCase();
                    if( ! by.has( k ) ) by.set( k, { name: g, n: 0 } );
                    by.get( k ).n++;
                }

            for( const g of emptyGroups )
                if( ! by.has( g.toLowerCase() ) ) by.set( g.toLowerCase(), { name: g, n: 0 } );

            return [ ...by.values() ].sort( ( a, b ) => a.name.localeCompare( b.name, NayiveUI.lang(), { sensitivity: 'base' } ) );
        }

        const groupExists = g => allGroups().some( x => sameCat( x.name, g ) );

        function addToGroup( uids, g )
        {
            if( ! changeCats( uids, withCat( g ), TF( 'contact.addedTo', { g: g } ) ) ) return;
            setEmptyGroups( emptyGroups.filter( x => ! sameCat( x, g ) ) );
            render();
        }

        // "Add to group…": the groups in the same tree, and a new one on top.
        async function addToGroupDialog( uids )
        {
            const NEW = '\u0000new';
            const id  = await NayiveUI.pickNode( {
                title:   T( 'contact.addToGroup' ),
                okLabel: T( 'contact.addToGroup' ),
                lit:     null,
                roots:   () => [ { id: NEW, name: T( 'contact.newGroup' ) + '…', icon: 'plus' } ]
                               .concat( allGroups().map( g => ( { id: 'g:' + g.name, name: g.name, icon: 'tag' } ) ) )
            } );
            if( id == null ) return;

            const g = id === NEW ? await askGroupName( T( 'contact.newGroup' ), '' ) : id.slice( 2 );
            if( g ) addToGroup( uids, g );
        }

        // A group's name, asked in a small dialog: -> Promise( name | null ).
        // A name another group has is refused (a toast) and asked again.
        function askGroupName( title, was )
        {
            return new Promise( function( resolve )
            {
                const d = NayiveUI.modal( { title: title, escape: () => finish( null ) } );
                let   done = false;
                const finish = v => { if( done ) return; done = true; d.close(); resolve( v ); };

                const field = document.createElement( 'div' );
                field.className = 'field';
                const lbl = document.createElement( 'label' );
                lbl.textContent = T( 'contact.groupName' );
                const inp = document.createElement( 'input' );
                inp.type = 'text';
                inp.autocomplete = 'off';
                inp.maxLength = 60;
                inp.value = was || '';
                inp.id = lbl.htmlFor = 'groupNameInput';
                field.append( lbl, inp );
                d.sheet.appendChild( field );

                const row = document.createElement( 'div' );
                row.className = 'sheet-actions';
                const no = document.createElement( 'button' );
                no.id = 'groupNameCancel';
                no.setAttribute( 'data-act', 'close' );
                no.title = T( 'ui.cancel' );
                const ok = document.createElement( 'button' );
                ok.id = 'groupNameOk';
                ok.setAttribute( 'data-act', 'primary' );
                ok.title = T( 'ui.save' );
                row.append( no, ok );
                d.sheet.appendChild( row );
                NayiveUI.applySheetButtons( d.sheet );

                const submit = () =>
                {
                    const v = inp.value.replace( /[\r\n]+/g, ' ' ).trim();
                    if( ! v ) { inp.focus(); return; }
                    if( was && sameCat( v, was ) && v === was ) { finish( null ); return; }
                    if( HIDDEN_CATS.has( v.toLowerCase() ) || ( ! ( was && sameCat( v, was ) ) && groupExists( v ) ) )
                    {
                        flashToast( T( 'contact.groupTaken' ) );
                        inp.select();
                        return;
                    }
                    finish( v );
                };
                no.addEventListener( 'click', () => finish( null ) );
                ok.addEventListener( 'click', submit );
                inp.addEventListener( 'keydown', e => { if( e.key === 'Enter' && ! e.isComposing ) { e.preventDefault(); submit(); } } );

                d.show();
                setTimeout( () => { inp.focus(); inp.select(); }, 0 );
            } );
        }

        async function newGroup()
        {
            const g = await askGroupName( T( 'contact.newGroup' ), '' );
            if( ! g ) return;
            setEmptyGroups( emptyGroups.concat( g ) );
            render();
        }

        async function renameGroup( g )
        {
            const to = await askGroupName( T( 'contact.renameGroup' ), g );
            if( ! to ) return;

            const members = contacts.filter( c => inGroup( c, g ) ).map( c => c.uid );
            setEmptyGroups( emptyGroups.map( x => sameCat( x, g ) ? to : x ) );
            if( view === 'g:' + g ) view = 'g:' + to;

            if( members.length ) changeCats( members, cats => cats.map( x => sameCat( x, g ) ? to : x ), T( 'contact.groupRenamed' ) );
            else render();
        }

        // The group goes; its contacts stay (only the word leaves their cards).
        function deleteGroup( g )
        {
            const members = contacts.filter( c => inGroup( c, g ) ).map( c => c.uid );
            setEmptyGroups( emptyGroups.filter( x => ! sameCat( x, g ) ) );
            if( view === 'g:' + g ) view = 'all';

            if( members.length ) changeCats( members, withoutCat( g ), TF( 'contact.groupDeleted', { g: g } ) );
            else { render(); flashToast( TF( 'contact.groupDeleted', { g: g } ) ); }
        }

        function toggleFav( uids )
        {
            const all = uids.every( u => { const c = findContact( u ); return c && isFav( c ); } );
            changeCats( uids, all ? withoutCat( STARRED ) : withCat( STARRED ), null );
        }

        //------------------------------------------------------------------------//
        // SHARE / EXPORT A FEW  -  the picked cards as one .vcf. Share is the
        // device's own share sheet with the file (a phone); where the device
        // can not share a file, the action is not offered.

        let shareOk = null;
        function canShareFiles()
        {
            if( shareOk === null )
                try   { shareOk = !! ( navigator.canShare && navigator.canShare( { files: [ new File( [ '' ], 'c.vcf', { type: 'text/vcard' } ) ] } ) ); }
                catch { shareOk = false; }
            return shareOk;
        }

        function cardsFile( list )
        {
            const name = list.length === 1 ? ( displayName( list[ 0 ] ).replace( /[\\/:*?"<>|]+/g, ' ' ).trim() || 'contact' ) + '.vcf'
                                           : T( 'contact.exportFile' );
            return new File( [ list.map( contactToVCard ).join( '\r\n' ) + '\r\n' ], name, { type: 'text/vcard' } );
        }

        function shareCards( list, title )
        {
            if( ! list.length ) return;
            navigator.share( { files: [ cardsFile( list ) ], title: title || '' } ).catch( function() { /* closed */ } );
        }

        function exportCards( list )
        {
            if( ! list.length ) return;
            const f   = cardsFile( list );
            const url = URL.createObjectURL( f );
            const a   = document.getElementById( 'downloadAnchor' );
            a.href     = url;
            a.download = f.name;
            a.click();
            setTimeout( () => URL.revokeObjectURL( url ), 1000 );
        }

        // Every picked card goes at once; "Deleted [Undo]" puts them back by
        // uid, each in its place in the file (undoCards: one gone is added again).
        function deleteContacts( uids )
        {
            if( ! canSave() ) return;

            const gone = new Set( uids );
            const was  = contacts.filter( c => gone.has( c.uid ) );
            if( ! was.length ) return;

            contacts = contacts.filter( c => ! gone.has( c.uid ) );

            render();
            saveContacts();
            refreshDedupIfOpen();

            flashUndo( T( 'ui.toast.deleted' ), function()
            {
                if( canSave() ) undoCards( was, new Map(), [] );
            } );
        }

        //------------------------------------------------------------------------//
        // LIST  -  the shared item browser (shared/browser.js): a click picks, a
        // double-click (a tap, Enter) opens the card; Ctrl / Shift pick more, a
        // long-press picks on a phone. One action list feeds the header group,
        // the menu (right-click = the row's ⋮ = the header's ⋮) and the keys.
        // The tree on the left: All contacts, Favourites, Groups; contacts
        // dropped on a group join it, on Favourites become favourites.

        let browse     = null;     // the item browser on #contactList
        let treeView   = null;     // the groups tree in #tree
        let searchFold = null;
        let view       = 'all';    // 'all' | 'fav' | 'groups' (in any group) | 'g:<name>'
        let groupsOpen = true;

        const one = ids => ids.length === 1;
        const cardsOf = ids => ids.map( findContact ).filter( Boolean );

        function viewName( v )
        {
            if( v === 'fav' )    return T( 'contact.favourites' );
            if( v === 'groups' ) return T( 'contact.groups' );
            if( v.indexOf( 'g:' ) === 0 ) return v.slice( 2 );
            return T( 'contact.allContacts' );
        }

        function inView( c )
        {
            if( view === 'fav' )    return isFav( c );
            if( view === 'groups' ) return groupsOf( c ).length > 0;
            if( view.indexOf( 'g:' ) === 0 ) return inGroup( c, view.slice( 2 ) );
            return true;
        }

        function setView( v )
        {
            view = v;
            render();
            window.scrollTo( 0, 0 );
            document.querySelector( '.list-scroll' ).scrollTop = 0;
        }

        // Built once the dictionary is in (wireStaticUI runs after it).
        function actionList() { return [
            { id: 'open', label: T( 'ui.open' ), icon: 'external', key: 'Enter', group: 0, when: one,
              run: ids => openDetail( ids[ 0 ] ) },
            { id: 'edit', label: T( 'contact.edit' ), icon: 'edit', key: 'F2', bar: 1, group: 0, when: one,
              run: ids => openEditForExisting( ids[ 0 ] ) },
            { id: 'fav', icon: 'star', key: 'S', bar: 2, group: 1,
              label: ids => T( ids.length && cardsOf( ids ).every( isFav ) ? 'contact.unfavourite' : 'contact.favAdd' ),
              run: toggleFav },
            { id: 'group', label: T( 'contact.addToGroup' ), icon: 'tag', bar: 3, phone: 1, group: 1,
              run: addToGroupDialog },
            { id: 'ungroup', label: T( 'contact.ungroup' ), icon: 'x', group: 1,
              where: () => view.indexOf( 'g:' ) === 0,
              run: ids => changeCats( ids, withoutCat( view.slice( 2 ) ), TF( 'contact.removedFrom', { g: view.slice( 2 ) } ) ) },
            { id: 'share', label: T( 'ui.share' ), icon: 'share', bar: 4, phone: 1, group: 2, where: canShareFiles,
              run: ids => shareCards( cardsOf( ids ) ) },
            { id: 'export', label: T( 'contact.exportVcf' ), icon: 'download', group: 2,
              run: ids => exportCards( cardsOf( ids ) ) },
            { id: 'merge', label: T( 'contact.merge' ), icon: 'merge', bar: 5, group: 2, when: ids => ids.length >= 2,
              run: ids => openMergeFor( cardsOf( ids ) ) },
            { id: 'delete', label: T( 'ui.delete' ), icon: 'trash', key: [ 'Del', 'Backspace' ], bar: 9, phone: 1, group: 3, danger: true,
              run: deleteContacts }
        ]; }

        function treeRoots()
        {
            return [
                { id: 'all',    name: T( 'contact.allContacts' ), icon: 'users', badge: contacts.length || '', noMenu: true, noDrag: true },
                { id: 'fav',    name: T( 'contact.favourites' ),  icon: 'star',  noMenu: true, noDrag: true },
                { id: 'groups', name: T( 'contact.groups' ),      icon: 'tag',   noDrag: true,
                  kids: allGroups().map( g => ( { id: 'g:' + g.name, name: g.name, icon: 'tag', badge: g.n || '', noDrag: true } ) ) }
            ];
        }

        // A group's right-click / ⋮ / long-press: rename, share, delete; on
        // "Groups": a new one.
        function treeMenu( id, x, y, anchor )
        {
            let items = null;

            if( id === 'groups' )
                items = [ { id: 'newGroup', label: T( 'contact.newGroup' ), icon: 'plus', run: newGroup } ];
            else if( id.indexOf( 'g:' ) === 0 )
            {
                const g = id.slice( 2 );
                const members = () => contacts.filter( c => inGroup( c, g ) );
                items = [
                    { id: 'renameGroup', label: T( 'contact.renameGroup' ), icon: 'edit', run: () => renameGroup( g ) },
                    { id: 'shareGroup',  label: T( 'contact.shareGroup' ),  icon: 'share', hidden: ! canShareFiles(),
                      disabled: ! members().length, run: () => shareCards( members(), g ) },
                    { sep: true },
                    { id: 'deleteGroup', label: T( 'contact.deleteGroup' ), icon: 'trash', danger: true, run: () => deleteGroup( g ) }
                ];
            }

            if( items ) NayiveUI.menuAt( x, y, items, { anchor: anchor } );
        }

        function treeCan( ids, id )
        {
            return id === 'fav' || id.indexOf( 'g:' ) === 0 ? 'inside' : false;
        }

        function treeDrop( ids, id )
        {
            if( id === 'fav' ) changeCats( ids, withCat( STARRED ), TF( 'contact.addedTo', { g: T( 'contact.favourites' ) } ) );
            else if( id.indexOf( 'g:' ) === 0 ) addToGroup( ids, id.slice( 2 ) );
        }

        function wireList()
        {
            treeView = NayiveUI.tree( {
                host:    document.getElementById( 'tree' ),
                pane:    document.getElementById( 'treePane' ),
                roots:   treeRoots,
                isOpen:  id => id === 'groups' && groupsOpen,
                setOpen: ( id, v ) => { if( id === 'groups' ) groupsOpen = v; },
                current: () => view,
                go:      id => setView( id ),
                menu:    treeMenu,
                drop:    { can: treeCan, drop: treeDrop }
            } );

            browse = NayiveUI.browser( {
                list:    contactList(),
                row:     '.contact-row',
                idOf:    el => el.dataset.uid,
                bar:     document.getElementById( 'selActions' ),
                actions: actionList(),
                area:    [ { id: 'new', label: T( 'contact.newContact' ), icon: 'plus', run: openEditForNew } ],
                tree:    treeView,
                open:    uid => openDetail( uid ),
                search:  () => { if( searchFold ) searchFold.open(); },
                drag:    { text: ids => cardsOf( ids ).map( displayName ).join( '\n' ) }
            } );

            document.getElementById( 'treeBtn' ).addEventListener( 'click', () => treeView.openSheet() );
        }

        //------------------------------------------------------------------------//
        // DETAIL VIEW

        let detailUid = null;

        function openDetail( uid )
        {
            const c = findContact( uid );
            if( ! c ) return;

            detailUid = uid;

            const name = displayName( c );

            paintAvatar( document.getElementById( 'detailAvatar' ), c, name );

            document.getElementById( 'detailName' ).textContent = name;

            const orgLine = [ c.title, c.org ].filter( Boolean ).join( ' · ' );
            document.getElementById( 'detailOrg' ).textContent = orgLine;
            document.getElementById( 'detailOrg' ).style.display = orgLine ? '' : 'none';

            const body = document.getElementById( 'detailBody' );
            body.innerHTML = '';

            const phoneGroup = buildDetailGroup( c.tels.filter( t => t.value.trim() ).map( t => ({
                label: typeLabel( TEL_TYPES(), t.type ),
                value: t.value,
                href : 'tel:' + t.value.replace( /[^\d+]/g, '' )
            })) );
            if( phoneGroup ) body.appendChild( phoneGroup );

            const mailGroup = buildDetailGroup( c.emails.filter( e => e.value.trim() ).map( e => ({
                label: typeLabel( EMAIL_TYPES(), e.type ),
                value: e.value,
                href : 'mailto:' + e.value
            })) );
            if( mailGroup ) body.appendChild( mailGroup );

            const adrGroup = buildDetailGroup( c.adrs
                .map( a => ({ label: typeLabel( ADR_TYPES(), a.type ), value: formatAddress( a ) }) )
                .filter( x => x.value ) );
            if( adrGroup ) body.appendChild( adrGroup );

            const urlGroup = buildDetailGroup( c.urls.filter( u => u.value.trim() ).map( u => ({
                label: T( 'contact.web' ), value: u.value, href: /^https?:/i.test( u.value ) ? u.value : 'https://' + u.value
            })) );
            if( urlGroup ) body.appendChild( urlGroup );

            const misc = [];
            // Shown as stored: ANSI yyyy-mm-dd, or --mm-dd without a year (see
            // normalizeBday) - no locale-dependent reformatting.
            if( c.bday ) misc.push( { label: T( 'contact.birthday' ), value: c.bday } );
            if( c.note ) misc.push( { label: NayiveUI.t( 'ui.notes' ), value: c.note, multiline: true } );
            const miscGroup = buildDetailGroup( misc );
            if( miscGroup ) body.appendChild( miscGroup );

            if( ! body.children.length )
            {
                const p = document.createElement( 'div' );
                p.className = 'detail-item';
                p.innerHTML = '<span class="di-value" style="color:var(--text-dim)" data-i18n="contact.noContactData"></span>';
                body.appendChild( p );
            }

            openBackdrop( 'detailBackdrop' );
        }

        function buildDetailGroup( items )
        {
            if( ! items.length )
                return null;

            const group = document.createElement( 'div' );
            group.className = 'detail-group';

            for( const it of items )
            {
                const wrap = document.createElement( 'div' );
                wrap.className = 'detail-item';

                const lbl = document.createElement( 'span' );
                lbl.className = 'di-label';
                lbl.textContent = it.label;
                wrap.appendChild( lbl );

                if( it.href )
                {
                    const a = document.createElement( 'a' );
                    a.className = 'di-value';
                    a.href = it.href;
                    a.textContent = it.value;
                    wrap.appendChild( a );
                }
                else
                {
                    const v = document.createElement( 'span' );
                    v.className = 'di-value' + ( it.multiline ? ' multiline' : '' );
                    v.textContent = it.value;
                    wrap.appendChild( v );
                }

                group.appendChild( wrap );
            }

            return group;
        }

        function formatAddress( a )
        {
            return [ a.street, [ a.postal, a.city ].filter( Boolean ).join( ' ' ), a.region, a.country ]
                .map( s => s.trim() ).filter( Boolean ).join( '\n' );
        }

        function typeLabel( table, sType )
        {
            const hit = table.find( r => r[ 0 ] === sType );
            return hit ? hit[ 1 ] : ( sType || T( 'contact.typeOther' ) );
        }

        //------------------------------------------------------------------------//
        // EDIT FORM

        function openEditForNew()
        {
            if( ! canSave() ) return;     // nothing typed for a save that cannot happen

            editingUid = null;
            document.getElementById( 'editTitle' ).textContent = T( 'contact.newContact' );

            fillForm( makeContact() );

            // Seed one empty phone + email row so the common case needs no extra taps.
            addMultiRow( 'tel',   { type: 'CELL', value: '' } );
            addMultiRow( 'email', { type: 'HOME', value: '' } );

            setMoreOpen( false );
            openBackdrop( 'editBackdrop' );
            setTimeout( () => document.getElementById( 'fGiven' ).focus(), 0 );
        }

        function openEditForExisting( uid )
        {
            const c = findContact( uid );
            if( ! c || ! canSave() ) return;

            editingUid = uid;
            document.getElementById( 'editTitle' ).textContent = T( 'contact.editContact' );

            fillForm( c );

            c.tels.forEach( t => addMultiRow( 'tel', t ) );
            c.emails.forEach( e => addMultiRow( 'email', e ) );
            c.adrs.forEach( a => addMultiRow( 'adr', a ) );
            c.urls.forEach( u => addMultiRow( 'url', u ) );

            const hasMore = c.adrs.length || c.urls.length || c.bday || c.note;
            setMoreOpen( !! hasMore );

            formWas = formState();
            openBackdrop( 'editBackdrop' );
        }

        // The form's fields as they stand, one string each. commitEdit writes back
        // only those that differ from how openEditForExisting filled them.
        let formWas = null;

        // PICTURE. The form's picture, a data: URL or '' (none): the circle
        // takes one from this device, "From Nayive" from the user's files (the
        // Photos folder first), the bin drops it. Kept in the card itself, as
        // its PHOTO (see photoLines): a PNG or a JPEG of 300 x 300 px at most
        // (NayivePhoto.face). Saved with the form, like every other field.
        let formPhoto = '';

        const IMAGE_EXT = /\.(jpe?g|png|gif|webp|bmp|avif)$/i;   // what a browser can draw (no HEIC)

        function showFormPhoto()
        {
            const name = [ document.getElementById( 'fGiven' ).value, document.getElementById( 'fFamily' ).value ].join( ' ' ).trim();
            paintAvatar( document.getElementById( 'fPhotoAv' ), { photo: formPhoto, n: { given: '', family: '' } }, name || '?' );
            document.getElementById( 'fPhotoDrop' ).hidden = ! formPhoto;
        }

        async function takeFormPhoto( blob )
        {
            try
            {
                const pic = await NayivePhoto.face( blob );
                formPhoto = await new Promise( ( ok, no ) =>
                {
                    const r = new FileReader();
                    r.onload  = () => ok( r.result );
                    r.onerror = () => no( r.error );
                    r.readAsDataURL( pic );
                });
                showFormPhoto();
            }
            catch( _ ) { flashToast( T( 'contact.notImage' ) ); }
        }

        async function formPhotoFromNayive()
        {
            let dir = 'files';
            try { const cfg = await GumApi.readJson( 'data/photos/config.json' ); if( cfg && cfg.folder ) dir = cfg.folder; } catch( _ ) {}

            const f = await NayiveUI.pickFile( { title: T( 'contact.changePhoto' ), dir: dir, only: name => IMAGE_EXT.test( name ) } );
            if( ! f ) return;
            if( ! IMAGE_EXT.test( f.name ) ) { flashToast( T( 'contact.notImage' ) ); return; }

            try   { await takeFormPhoto( new Blob( [ await GumApi.readFileBytes( f.path ) ] ) ); }
            catch { flashToast( T( 'ui.store.notRead' ) ); }
        }

        function wireFormPhoto()
        {
            const input = document.getElementById( 'fPhotoInput' );
            const nay   = document.getElementById( 'fPhotoNayive' );
            const drop  = document.getElementById( 'fPhotoDrop' );

            nay.innerHTML  = NayiveUI.icon( 'folder' );
            nay.append( T( 'contact.fromNayive' ) );
            drop.innerHTML = NayiveUI.icon( 'trash' );
            drop.append( T( 'contact.removePhoto' ) );

            document.getElementById( 'fPhotoBtn' ).addEventListener( 'click', () => input.click() );
            input.addEventListener( 'change', () =>
            {
                const file = input.files && input.files[ 0 ];
                input.value = '';
                if( file ) takeFormPhoto( file );
            });
            nay.addEventListener( 'click', formPhotoFromNayive );
            drop.addEventListener( 'click', () => { formPhoto = ''; showFormPhoto(); } );
            [ 'fGiven', 'fFamily' ].forEach( id => document.getElementById( id ).addEventListener( 'input', showFormPhoto ) );
        }

        function formState()
        {
            const v    = id => document.getElementById( id ).value;
            const bday = document.getElementById( 'fBday' );

            return {
                given : v( 'fGiven' ), family: v( 'fFamily' ), org: v( 'fOrg' ), title: v( 'fJobTitle' ),
                tels  : JSON.stringify( readMultiRows( 'telRows',   'tel' ) ),
                emails: JSON.stringify( readMultiRows( 'emailRows', 'email' ) ),
                adrs  : JSON.stringify( readMultiRows( 'adrRows',   'adr' ) ),
                urls  : JSON.stringify( readMultiRows( 'urlRows',   'url' ) ),
                bday  : bday.value + '|' + ( bday.dataset.noYear || '' ),
                note  : v( 'fNote' ),
                photo : formPhoto
            };
        }

        function fillForm( c )
        {
            document.getElementById( 'fGiven'    ).value = c.n.given;
            document.getElementById( 'fFamily'   ).value = c.n.family;
            document.getElementById( 'fOrg'      ).value = c.org;
            document.getElementById( 'fJobTitle' ).value = c.title;
            document.getElementById( 'fNote'     ).value = c.note;

            formPhoto = c.photo || '';
            showFormPhoto();

            // <input type=date> cannot hold a birthday without a year ('--MM-DD'):
            // it waits here, shown by the overlay, until a date is picked.
            const bday = document.getElementById( 'fBday' );
            bday.value          = /^--/.test( c.bday ) ? '' : c.bday;
            bday.dataset.noYear = /^--/.test( c.bday ) ? c.bday : '';
            refreshBdayDisplay();

            [ 'telRows', 'emailRows', 'adrRows', 'urlRows' ].forEach( id =>
            {
                document.getElementById( id ).innerHTML = '';
            });
        }

        // The native date input's .value is always yyyy-mm-dd whatever the browser
        // locale shows, so this overlay renders the date in ANSI format directly.
        function refreshBdayDisplay()
        {
            const el   = document.getElementById( 'fBday' );
            const disp = document.getElementById( 'fBdayDisplay' );
            const v    = el.value || el.dataset.noYear || '';
            disp.textContent = v || T( 'ui.dateHint' );
            disp.classList.toggle( 'placeholder', ! v );
        }

        function addMultiRow( kind, data )
        {
            data = data || {};

            const host = document.getElementById(
                kind === 'tel' ? 'telRows' : kind === 'email' ? 'emailRows' : kind === 'adr' ? 'adrRows' : 'urlRows' );

            const row = document.createElement( 'div' );
            row.className = 'multi-row';

            if( kind === 'tel' || kind === 'email' || kind === 'adr' )
            {
                const table = kind === 'tel' ? TEL_TYPES() : kind === 'email' ? EMAIL_TYPES() : ADR_TYPES();
                row.appendChild( buildTypeSelect( table, data.type ) );
            }

            const fields = document.createElement( 'div' );
            fields.className = 'multi-fields';

            if( kind === 'tel' )
            {
                fields.appendChild( makeInput( 'tel', T( 'contact.numberPh' ), data.value || '' ) );
            }
            else if( kind === 'email' )
            {
                fields.appendChild( makeInput( 'email', T( 'contact.emailPh' ), data.value || '' ) );
            }
            else if( kind === 'url' )
            {
                fields.appendChild( makeInput( 'url', 'https://…', data.value || '' ) );
            }
            else if( kind === 'adr' )
            {
                fields.appendChild( makeInput( 'text', T( 'contact.streetPh' ), data.street || '' ) );

                const cityRow = document.createElement( 'div' );
                cityRow.style.display = 'flex';
                cityRow.style.gap = '6px';
                cityRow.appendChild( makeInput( 'text', T( 'contact.postal' ), data.postal || '' ) );
                cityRow.appendChild( makeInput( 'text', T( 'contact.cityPh' ), data.city || '' ) );
                fields.appendChild( cityRow );

                const regionRow = document.createElement( 'div' );
                regionRow.style.display = 'flex';
                regionRow.style.gap = '6px';
                regionRow.appendChild( makeInput( 'text', T( 'contact.regionPh' ), data.region || '' ) );
                regionRow.appendChild( makeInput( 'text', T( 'contact.countryPh' ), data.country || '' ) );
                fields.appendChild( regionRow );
            }

            row.appendChild( fields );

            const rm = document.createElement( 'button' );
            rm.type = 'button';
            rm.className = 'icon-btn danger';
            rm.title = T( 'contact.remove' );
            rm.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
            rm.addEventListener( 'click', () => row.remove() );
            row.appendChild( rm );

            host.appendChild( row );
        }

        function buildTypeSelect( table, current )
        {
            const sel = document.createElement( 'select' );

            const known = new Set( table.map( r => r[ 0 ] ) );

            if( current && ! known.has( current ) )
            {
                const opt = document.createElement( 'option' );
                opt.value = current;
                opt.textContent = current;
                sel.appendChild( opt );
            }

            for( const [ val, label ] of table )
            {
                const opt = document.createElement( 'option' );
                opt.value = val;
                opt.textContent = label;
                sel.appendChild( opt );
            }

            sel.value = current || table[ 0 ][ 0 ];
            return sel;
        }

        function makeInput( type, placeholder, value )
        {
            const inp = document.createElement( 'input' );
            inp.type = type;
            inp.placeholder = placeholder;
            inp.value = value;
            inp.autocomplete = 'off';
            return inp;
        }

        function readMultiRows( hostId, kind )
        {
            const out = [];

            for( const row of document.getElementById( hostId ).querySelectorAll( '.multi-row' ) )
            {
                const sel    = row.querySelector( 'select' );
                const inputs = row.querySelectorAll( 'input' );

                if( kind === 'adr' )
                {
                    const rec = {
                        type   : sel ? sel.value : 'HOME',
                        street : inputs[ 0 ].value.trim(),
                        postal : inputs[ 1 ].value.trim(),
                        city   : inputs[ 2 ].value.trim(),
                        region : inputs[ 3 ].value.trim(),
                        country: inputs[ 4 ].value.trim()
                    };

                    if( rec.street || rec.city || rec.region || rec.postal || rec.country )
                        out.push( rec );
                }
                else if( kind === 'url' )
                {
                    const v = inputs[ 0 ].value.trim();
                    if( v ) out.push( { value: v } );
                }
                else
                {
                    const v = inputs[ 0 ].value.trim();
                    if( v ) out.push( { type: sel ? sel.value : 'OTHER', value: v } );
                }
            }

            return out;
        }

        function commitEdit()
        {
            if( ! canSave() ) return;     // the form stays open: nothing typed is lost

            const given  = document.getElementById( 'fGiven'  ).value.trim();
            const family = document.getElementById( 'fFamily' ).value.trim();
            const org    = document.getElementById( 'fOrg'    ).value.trim();

            const tels   = readMultiRows( 'telRows',   'tel' );
            const emails = readMultiRows( 'emailRows', 'email' );

            if( ! given && ! family && ! org && ! tels.length && ! emails.length )
            {
                flashToast( T( 'contact.needSomething' ) );
                return;
            }

            const c = editingUid ? findContact( editingUid ) : makeContact();
            if( ! editingUid ) { c.pos = nextPos++; contacts.push( c ); }

            // Only the fields the user changed are written into the card: a field
            // left alone keeps its value as read, so the save does not "tidy" it
            // (trim a NOTE that ends in a newline) into a rewritten line.
            const now     = formState();
            const touched = f => ! editingUid || now[ f ] !== formWas[ f ];

            // FN is the card's own display name and may say more than the parts do
            // ("MAD Lola (Villaamil)"). Rebuild it only when the name really changed:
            // editing a phone or a birthday must leave it exactly as it was.
            const nameChanged = ( touched( 'given' )  && given  !== c.n.given ) ||
                                ( touched( 'family' ) && family !== c.n.family );

            if( touched( 'given' ) )  c.n.given  = given;
            if( touched( 'family' ) ) c.n.family = family;

            if( nameChanged || ! c.fn.trim() )
                c.fn = [ c.n.given, c.n.family ].filter( Boolean ).join( ' ' ).trim() || c.fn || org;

            if( touched( 'org' ) )    c.org    = org;
            if( touched( 'title' ) )  c.title  = document.getElementById( 'fJobTitle' ).value.trim();
            if( touched( 'tels' ) )   c.tels   = tels;
            if( touched( 'emails' ) ) c.emails = emails;
            if( touched( 'adrs' ) )   c.adrs   = readMultiRows( 'adrRows', 'adr' );
            if( touched( 'urls' ) )   c.urls   = readMultiRows( 'urlRows', 'url' );
            if( touched( 'bday' ) )   c.bday   = document.getElementById( 'fBday' ).value || document.getElementById( 'fBday' ).dataset.noYear || '';
            if( touched( 'note' ) )   c.note   = document.getElementById( 'fNote' ).value.trim();
            if( touched( 'photo' ) )  c.photo  = formPhoto;

            if( Object.keys( now ).some( touched ) )
                c.rev = revStamp();   // its REV, kept by later saves of the book (see revLine)

            closeBackdrop( 'editBackdrop' );
            render();
            saveContacts();
            refreshDedupIfOpen();
        }

        // No question: it goes at once, and "Deleted [Undo]" puts the card back in
        // its place in the list and in the file (it keeps its pos and its lines).
        function deleteCurrent()
        {
            if( ! detailUid || ! canSave() ) return;

            const uid = detailUid;
            const idx = contacts.findIndex( x => x.uid === uid );
            if( idx === -1 ) return;

            const c = contacts[ idx ];

            contacts = contacts.filter( x => x.uid !== uid );

            closeBackdrop( 'detailBackdrop' );
            render();
            saveContacts();
            refreshDedupIfOpen();

            // By uid, not by the list as it was: a re-read may have replaced `contacts`.
            flashUndo( T( 'ui.toast.deleted' ), function()
            {
                if( ! canSave() || findContact( uid ) ) return;

                contacts.splice( Math.min( idx, contacts.length ), 0, c );

                render();
                saveContacts();
                refreshDedupIfOpen();
            } );
        }

        function setMoreOpen( open )
        {
            document.getElementById( 'moreToggle' ).classList.toggle( 'open', open );
            document.getElementById( 'moreToggle' ).setAttribute( 'aria-expanded', String( open ) );
            document.getElementById( 'moreSection' ).style.display = open ? '' : 'none';
            document.getElementById( 'moreLabel' ).textContent = open ? T( 'contact.fewerFields' ) : T( 'contact.moreFields' );
        }

        //------------------------------------------------------------------------//
        // DUPLICATES — review sheet

        let dupGroups  = [];     // last findDuplicateGroups() result, backing the dedup sheet
        let mergeModel = null;   // union preview backing the merge sheet

        //------------------------------------------------------------------------//
        // SETTINGS SHEET  -  vCard files (import / export).

        function wireSettingsSheet()
        {
            document.getElementById( 'settingsBtn'      ).addEventListener( 'click', () => openBackdrop( 'settingsBackdrop' ) );
            document.getElementById( 'settingsCloseBtn' ).addEventListener( 'click', () => closeBackdrop( 'settingsBackdrop' ) );

            document.getElementById( 'setExportBtn' ).addEventListener( 'click', exportVcf );
            document.getElementById( 'setImportBtn' ).addEventListener( 'click', () =>
            {
                if( ! canSave() ) return;
                closeBackdrop( 'settingsBackdrop' );     // the import's own result shows on the list
                document.getElementById( 'importInput' ).click();
            });
        }

        // `groups`: already found (an import just looked), so not scanned again.
        function openDedupSheet( groups )
        {
            openBackdrop( 'dedupBackdrop' );

            if( Array.isArray( groups ) )
            {
                dupGroups = groups;
                renderDedupSheet();
                return;
            }

            renderDedupScanning();

            // Yield twice so the sheet + progress bar actually paint before the
            // synchronous scan freezes the main thread.
            requestAnimationFrame( () => requestAnimationFrame( () =>
            {
                dupGroups = findDuplicateGroups( contacts );
                renderDedupSheet();
            }));
        }

        // Placeholder shown in the dedup sheet while findDuplicateGroups() is running.
        function renderDedupScanning()
        {
            document.getElementById( 'dedupCount' ).textContent = '';
            document.getElementById( 'dedupList' ).innerHTML =
                '<div class="dedup-scanning">'
              +     '<div class="scan-bar"><span></span></div>'
              +     '<p data-i18n="contact.scanning"></p>'
              + '</div>';
        }

        function refreshDedupIfOpen()
        {
            if( document.getElementById( 'dedupBackdrop' ).classList.contains( 'open' ) )
            {
                dupGroups = findDuplicateGroups( contacts );
                renderDedupSheet();
            }
        }

        function renderDedupSheet()
        {
            const host = document.getElementById( 'dedupList' );
            host.innerHTML = '';

            document.getElementById( 'dedupCount' ).textContent = dupGroups.length ? ' (' + dupGroups.length + ')' : '';

            if( ! dupGroups.length )
            {
                const p = document.createElement( 'p' );
                p.className = 'dedup-empty';
                p.textContent = T( 'contact.noDupes' );
                host.appendChild( p );
                return;
            }

            dupGroups.forEach( ( g, gi ) => host.appendChild( buildDupGroupCard( g, gi ) ) );
        }

        function buildDupGroupCard( g, gi )
        {
            const card = document.createElement( 'div' );
            card.className = 'dup-group';

            const chips = document.createElement( 'div' );
            chips.className = 'dup-chips';

            const conf = document.createElement( 'span' );
            conf.className = 'dup-conf ' + g.confidence;
            conf.textContent = g.confidence === 'alta' ? T( 'contact.confHigh' ) : T( 'contact.confLow' );
            chips.appendChild( conf );

            g.reasons.forEach( r =>
            {
                const chip = document.createElement( 'span' );
                chip.className = 'tag';
                chip.textContent = r;
                chips.appendChild( chip );
            });
            card.appendChild( chips );

            g.contacts.forEach( c =>
            {
                const row = document.createElement( 'div' );
                row.className = 'dup-contact';
                row.addEventListener( 'click', () => openDetail( c.uid ) );

                appendFace( row, c, displayName( c ) );

                // With 3+ members the group may have swept in someone who only shares a surname
                // (union-find joins the whole connected component). Let the user drop them.
                if( g.contacts.length > 2 )
                {
                    const rm = document.createElement( 'button' );
                    rm.type = 'button';
                    rm.className = 'icon-btn sm danger';
                    rm.title = T( 'contact.removeFromGroup' );
                    rm.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>';
                    rm.addEventListener( 'click', e =>
                    {
                        e.stopPropagation();
                        excludeFromDupGroup( gi, c.uid );
                    });
                    row.appendChild( rm );
                }

                card.appendChild( row );
            });

            const actions = document.createElement( 'div' );
            actions.className = 'dup-actions';

            const dismiss = document.createElement( 'button' );
            dismiss.type = 'button';
            dismiss.className = 'text-btn ghost';
            dismiss.textContent = T( 'contact.notDupes' );
            dismiss.addEventListener( 'click', () => dismissDupGroup( gi ) );
            actions.appendChild( dismiss );

            const merge = document.createElement( 'button' );
            merge.type = 'button';
            merge.className = 'text-btn';
            merge.textContent = T( 'contact.merge' );
            merge.addEventListener( 'click', () => openMergeSheet( gi ) );
            actions.appendChild( merge );

            card.appendChild( actions );
            return card;
        }

        function dismissDupGroup( gi )
        {
            const g = dupGroups[ gi ];
            if( ! g ) return;

            for( let a = 0; a < g.contacts.length; a++ )
                for( let b = a + 1; b < g.contacts.length; b++ )
                    dismissed.add( dismissKey( g.contacts[ a ].uid, g.contacts[ b ].uid ) );

            saveMeta();
            dupGroups = findDuplicateGroups( contacts );
            renderDedupSheet();
        }

        // Drops one contact from a group: marks it "not a duplicate" of every other member
        // so the next scan won't pull it back, then re-renders. The rest of the group stays
        // together (their own matching pairs are untouched) and can be merged.
        function excludeFromDupGroup( gi, uid )
        {
            const g = dupGroups[ gi ];
            if( ! g ) return;

            g.contacts.forEach( other =>
            {
                if( other.uid !== uid )
                    dismissed.add( dismissKey( uid, other.uid ) );
            });

            saveMeta();
            dupGroups = findDuplicateGroups( contacts );
            renderDedupSheet();
        }

        //------------------------------------------------------------------------//
        // DUPLICATES — merge preview

        function firstNonEmpty( arr )
        {
            return ( arr.map( s => ( s || '' ).trim() ).find( Boolean ) ) || '';
        }

        // Most-complete card: both name parts beat one, then longest display name.
        function mostComplete( list )
        {
            return list.slice().sort( ( a, b ) =>
            {
                const fa = [ a.n.given, a.n.family ].filter( Boolean ).length;
                const fb = [ b.n.given, b.n.family ].filter( Boolean ).length;
                return fb - fa || displayName( b ).length - displayName( a ).length;
            })[ 0 ];
        }

        function unionValues( lists, keyFn )
        {
            const seen = new Set();
            const out  = [];

            for( const list of lists )
                for( const it of list )
                {
                    const k = keyFn( it );
                    if( ! k || seen.has( k ) ) continue;
                    seen.add( k );
                    out.push( it );
                }

            return out;
        }

        function openMergeSheet( gi )
        {
            const group = dupGroups[ gi ];
            if( ! group ) return;

            const members = group.contacts.filter( c => findContact( c.uid ) );

            if( members.length < 2 )
            {
                flashToast( T( 'contact.groupClean' ) );
                refreshDedupIfOpen();
                return;
            }

            openMergeFor( members );
        }

        // Builds the union preview and opens the sheet. Called both by the
        // duplicate scanner (a group) and by the manual pick (ticked rows).
        function openMergeFor( members )
        {
            const withVal  = arr => arr.filter( x => ( x.value || '' ).trim() );
            const realAdrs = c => c.adrs.filter( a => a.street || a.city || a.region || a.postal || a.country );
            const telKey   = t => { const d = normPhone( t.value ); return d ? phoneTail( d ) : foldForSearch( ( t.value || '' ).trim() ); };
            const mailKey  = e => normEmail( e.value );
            const adrKey   = a => foldForSearch( [ a.street, a.city, a.region, a.postal, a.country ].join( '|' ) ).replace( /[^a-z0-9|]/g, '' );
            const urlKey   = u => ( u.value || '' ).trim().toLowerCase().replace( /\/+$/, '' );

            mergeModel = {
                members : members,
                primary : members.map( c => c.uid ).sort()[ 0 ],
                names   : [ ...new Set( members.map( displayName ) ) ],
                nameSrc : mostComplete( members ),
                orgs    : [ ...new Set( members.map( c => c.org.trim() ).filter( Boolean ) ) ],
                titles  : [ ...new Set( members.map( c => c.title.trim() ).filter( Boolean ) ) ],
                tels    : unionValues( members.map( c => withVal( c.tels ) ),   telKey ),
                emails  : unionValues( members.map( c => withVal( c.emails ) ), mailKey ),
                adrs    : unionValues( members.map( realAdrs ),                 adrKey ),
                urls    : unionValues( members.map( c => withVal( c.urls ) ),   urlKey ),
                bday    : firstNonEmpty( members.map( c => c.bday ) ),
                bdays   : [ ...new Set( members.map( c => c.bday ).filter( Boolean ) ) ],
                notes   : [ ...new Set( members.map( c => c.note.trim() ).filter( Boolean ) ) ]
            };

            renderMergePreview();
            openBackdrop( 'mergeBackdrop' );
        }

        function renderMergePreview()
        {
            const m    = mergeModel;
            const body = document.getElementById( 'mergeBody' );
            body.innerHTML = '';

            body.appendChild( mergePickField( T( 'contact.firstName' ), 'mergeName', m.names, displayName( m.nameSrc ) ) );

            if( m.orgs.length )   body.appendChild( mergePickField( T( 'contact.org' ), 'mergeOrg', m.orgs, m.orgs[ 0 ] ) );
            if( m.titles.length ) body.appendChild( mergePickField( T( 'contact.jobTitle' ), 'mergeTitle', m.titles, m.titles[ 0 ] ) );

            mergeCheckSection( body, T( 'contact.phones' ),   'tel',   m.tels,   t => [ typeLabel( TEL_TYPES(), t.type ),   t.value ] );
            mergeCheckSection( body, T( 'contact.emails' ),     'email', m.emails, e => [ typeLabel( EMAIL_TYPES(), e.type ), e.value ] );
            mergeCheckSection( body, T( 'contact.addresses' ), 'adr',   m.adrs,   a => [ typeLabel( ADR_TYPES(), a.type ),   formatAddress( a ) ] );
            mergeCheckSection( body, T( 'contact.websites' ),  'url',   m.urls,   u => [ T( 'contact.web' ), u.value ] );

            // Two different birthdays: the user picks one, like the name.
            if( m.bdays.length > 1 )
                body.appendChild( mergePickField( T( 'contact.birthday' ), 'mergeBday', m.bdays, m.bday ) );
            else if( m.bday )
            {
                const sec = document.createElement( 'div' );
                sec.className = 'merge-section';
                sec.innerHTML = '<div class="ms-label" data-i18n="contact.birthday"></div>';
                const v = document.createElement( 'div' );
                v.className = 'mr-val';
                v.textContent = m.bday;
                sec.appendChild( v );
                body.appendChild( sec );
            }

            if( m.notes.length )
            {
                const sec = document.createElement( 'div' );
                sec.className = 'merge-section';
                sec.innerHTML = '<div class="ms-label" data-i18n="ui.notes"></div>';
                const v = document.createElement( 'div' );
                v.className = 'merge-note-preview';
                v.textContent = m.notes.join( '\n———\n' );
                sec.appendChild( v );
                body.appendChild( sec );
            }
        }

        function mergePickField( label, id, options, selected )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';

            const lbl = document.createElement( 'label' );
            lbl.textContent = label;
            field.appendChild( lbl );

            if( options.length <= 1 )
            {
                const input = document.createElement( 'input' );
                input.type = 'hidden';
                input.id = id;
                input.value = options[ 0 ] || selected || '';
                field.appendChild( input );

                const span = document.createElement( 'div' );
                span.className = 'mr-val';
                span.textContent = input.value;
                field.appendChild( span );
            }
            else
            {
                const sel = document.createElement( 'select' );
                sel.id = id;

                options.forEach( o =>
                {
                    const opt = document.createElement( 'option' );
                    opt.value = o;
                    opt.textContent = o;
                    sel.appendChild( opt );
                });

                sel.value = selected;
                field.appendChild( sel );
            }

            return field;
        }

        function mergeCheckSection( body, label, kind, items, fmt )
        {
            if( ! items.length ) return;

            const sec = document.createElement( 'div' );
            sec.className = 'merge-section';

            const l = document.createElement( 'div' );
            l.className = 'ms-label';
            l.textContent = label;
            sec.appendChild( l );

            items.forEach( ( it, idx ) =>
            {
                const [ type, value ] = fmt( it );

                const row = document.createElement( 'label' );
                row.className = 'merge-row';

                const cb = document.createElement( 'input' );
                cb.type = 'checkbox';
                cb.checked = true;
                cb.dataset.kind = kind;
                cb.dataset.idx  = idx;
                row.appendChild( cb );

                const t = document.createElement( 'span' );
                t.className = 'mr-type';
                t.textContent = type;
                row.appendChild( t );

                const v = document.createElement( 'span' );
                v.className = 'mr-val';
                v.textContent = value;
                row.appendChild( v );

                sec.appendChild( row );
            });

            body.appendChild( sec );
        }

        function collectChecked( kind )
        {
            const list = mergeModel[ kind === 'adr' ? 'adrs' : kind + 's' ];
            const out  = [];

            document.querySelectorAll( '#mergeBody input[data-kind="' + kind + '"]' ).forEach( cb =>
            {
                if( cb.checked ) out.push( list[ Number( cb.dataset.idx ) ] );
            });

            return out;
        }

        function doMerge()
        {
            const m = mergeModel;
            if( ! m || ! canSave() ) return;

            const groupUids  = new Set( m.members.map( c => c.uid ) );
            const chosenName = ( document.getElementById( 'mergeName' ).value || '' ).trim();
            const nameSrc    = m.members.find( c => displayName( c ) === chosenName ) || m.nameSrc;

            const merged  = makeContact();
            merged.uid    = m.primary;
            merged.n      = { ...nameSrc.n };
            merged.fn     = chosenName || displayName( nameSrc );
            merged.org    = ( document.getElementById( 'mergeOrg' )   || {} ).value || firstNonEmpty( m.members.map( c => c.org ) );
            merged.title  = ( document.getElementById( 'mergeTitle' ) || {} ).value || firstNonEmpty( m.members.map( c => c.title ) );
            merged.tels   = collectChecked( 'tel' );
            merged.emails = collectChecked( 'email' );
            merged.adrs   = collectChecked( 'adr' );
            merged.urls   = collectChecked( 'url' );
            merged.bday   = ( document.getElementById( 'mergeBday' ) || {} ).value || m.bday;
            merged.note   = m.notes.join( '\n———\n' );
            merged.photo  = nameSrc.photo || firstNonEmpty( m.members.map( c => c.photo ) );
            merged.src    = mergedSource( m.members, nameSrc );
            merged.pos    = Math.min( ...m.members.map( c => c.pos ) );   // where its first member stood in the file
            merged.rev    = revStamp();

            const hadDismissals = dismissed.size > 0;

            // The Undo puts the members back by uid (see undoCards), over the
            // merged card (it carries the first member's uid) as written here.
            undoState = { was: m.members.slice(), made: new Map( [ [ merged.uid, contactToVCard( merged ) ] ] ), added: [] };

            contacts = contacts.filter( c => ! groupUids.has( c.uid ) );
            contacts.push( merged );

            closeBackdrop( 'mergeBackdrop' );
            if( browse ) browse.clear();    // the picked rows were the members
            render();
            saveContacts();

            if( hadDismissals )
                saveMeta();                 // prunes dismissed pairs that referenced the removed cards

            flashUndo( T( 'contact.merged' ) );
            refreshDedupIfOpen();
        }

        // The merged card keeps what its members held beyond the model (a PHOTO, a
        // NICKNAME, CATEGORIES, labelled items): every member's lines go in, and an
        // empty snapshot marks every field as changed, so the model's fields are
        // written from the preview while a phone / email / address / web picked as
        // it was keeps its member's own line (see contactToVCard). A later member's
        // item group is renumbered when an earlier one used the name, so two
        // members' "item1" never label each other's lines. Unmodelled lines that
        // two members share are kept once.
        function mergedSource( members, nameSrc )
        {
            const lines = [], seen = new Set(), used = new Set();

            for( const c of members )
            {
                if( ! c.src ) continue;

                const rename = {};

                for( const l of c.src.lines )
                {
                    if( l.group && ! ( l.group in rename ) )
                    {
                        let g = l.group;
                        for( let i = 1; used.has( g ); i++ ) g = 'item' + i;
                        rename[ l.group ] = g;
                        used.add( g );
                    }

                    const g = l.group ? rename[ l.group ] : '';
                    const x = g === l.group ? l
                            : { ...l, group: g, text: g + l.text.slice( l.group.length ),
                                phys: [ g + l.phys[ 0 ].slice( l.group.length ) ].concat( l.phys.slice( 1 ) ) };

                    if( ! x.field && seen.has( x.text ) ) continue;
                    seen.add( x.text );
                    lines.push( x );
                }
            }

            return { begin: 'BEGIN:VCARD', end: 'END:VCARD', lines: lines, snap: {}, uidRead: true, suffix: '',
                     nParts: nameSrc.src ? nameSrc.src.nParts : null };
        }

        function undoMerge()
        {
            if( ! undoState || ! canSave() ) return;

            const u = undoState;
            undoState = null;
            undoCards( u.was, u.made, u.added );
        }

        // UNDO BY CARD (H3, list-apps #15 / #16). The "Merged" and "Imported"
        // Undos used to put back a copy of the WHOLE book taken before: a save
        // that met another device's in those six seconds had merged its cards in
        // (store.js MERGE), and the Undo's save dropped them. Now only what the
        // action did is undone, on the book as it is NOW, by uid:
        //   was    the cards as they were before (removed or replaced). Each goes
        //          back: in place of the card the action wrote while that one is
        //          still as written; field by field (mergeCard) when the other
        //          device has changed it since; added again when it is gone. One
        //          the action removed that is back already (the other device
        //          edited it: an edit beats a delete) stays as it is.
        //   made   uid -> the text the action wrote for that card;
        //   added  the uids the action added: they leave.
        function undoCards( was, made, added )
        {
            const gone = new Set( added );
            contacts = contacts.filter( c => ! gone.has( c.uid ) );

            for( const old of was )
            {
                const i = contacts.findIndex( c => c.uid === old.uid );

                if( i === -1 ) { contacts.push( old ); continue; }
                if( ! made.has( old.uid ) ) continue;

                const now = contactToVCard( contacts[ i ] );
                if( now === made.get( old.uid ) ) { contacts[ i ] = old; continue; }

                // Changed since: undo only the action's own change of it.
                const one = text => vcfCards( text )[ 0 ];
                const mix = mergeCard( one( made.get( old.uid ) ), one( contactToVCard( old ) ), one( now ) );
                const c   = vcfToContacts( mix.text )[ 0 ];
                if( ! c ) continue;
                c.pos = contacts[ i ].pos;
                contacts[ i ] = c;
            }

            render();
            saveContacts();
            refreshDedupIfOpen();
        }

        //------------------------------------------------------------------------//
        // IMPORT / EXPORT

        function exportVcf()
        {
            if( ! contacts.length )
            {
                flashToast( T( 'contact.nothingToExport' ) );
                return;
            }

            const blob = new Blob( [ contactsToVcf( contacts ) ], { type: 'text/vcard;charset=utf-8' } );
            const url  = URL.createObjectURL( blob );
            const a    = document.getElementById( 'downloadAnchor' );

            a.href     = url;
            a.download = T( 'contact.exportFile' );
            a.click();

            setTimeout( () => URL.revokeObjectURL( url ), 1000 );
        }

        async function importVcf( file )
        {
            if( ! canSave() ) return;

            let text;
            try   { text = await file.text(); }
            catch { flashToast( T( 'contact.readFailed' ) ); return; }

            const incoming = vcfToContacts( text );

            if( ! incoming.length )
            {
                flashToast( T( 'contact.noVcards' ) );
                return;
            }

            // For the Undo, by uid (undoCards): each replaced card as it was, and
            // the uids added. Not a copy of the whole book.
            const replaced = [], addedUids = [], seen = new Set();
            const byUid   = new Map( contacts.map( c => [ c.uid, c ] ) );
            let   added = 0, updated = 0;

            // In the imported file's order: a new card goes after the book's last
            // one; an updated card keeps its place. A card edited since the file
            // was made (a newer REV here) is kept: re-importing an old export must
            // not take the edits back.
            for( const inc of incoming.slice().sort( ( a, b ) => a.pos - b.pos ) )
            {
                if( byUid.has( inc.uid ) )
                {
                    const old = byUid.get( inc.uid );
                    if( revKey( revOf( inc ) ) < revKey( revOf( old ) ) ) continue;
                    if( ! seen.has( inc.uid ) ) replaced.push( structuredClone( old ) );   // before it changes in place
                    seen.add( inc.uid );
                    Object.assign( old, inc, { pos: old.pos } );
                    updated++;
                }
                else
                {
                    inc.pos = nextPos++;
                    contacts.push( inc );
                    byUid.set( inc.uid, inc );
                    addedUids.push( inc.uid );
                    seen.add( inc.uid );
                    added++;
                }
            }

            const made = new Map( replaced.map( c => [ c.uid, contactToVCard( byUid.get( c.uid ) ) ] ) );

            render();
            await saveContacts();

            flashUndo( TF( 'contact.imported', { added: added, updated: updated } ), function()
            {
                if( ! canSave() ) return;
                undoCards( replaced, made, addedUids );
            } );

            // Imports are where duplicates are actually created — surface them right away.
            const groups = findDuplicateGroups( contacts );
            if( groups.length )
                openDedupSheet( groups );
        }

        // When a card was last changed: its REV as edited here, else as read from
        // the file ('' : none). revKey() makes "2026-09-28T10:15:00Z" and
        // "20260928T101500Z" compare alike; no REV sorts as the oldest.
        function revOf( c )
        {
            if( c.rev ) return c.rev;
            const l = c.src && c.src.lines.find( x => x.name === 'REV' );
            return l ? l.text.slice( l.text.indexOf( ':' ) + 1 ) : '';
        }

        function revKey( rev )
        {
            return String( rev || '' ).replace( /[^0-9]/g, '' ).slice( 0, 14 ).padEnd( 14, '0' );
        }

        //------------------------------------------------------------------------//
        // UI WIRING

        function wireStaticUI()
        {
            document.getElementById( 'addBtn'    ).addEventListener( 'click', openEditForNew );

            // First: its Escape must see an open sheet before the one below closes it.
            wireList();
            wireAzRail();

            wireSettingsSheet();
            wireFormPhoto();

            document.getElementById( 'importInput' ).addEventListener( 'change', function()
            {
                if( this.files && this.files[ 0 ] )
                    importVcf( this.files[ 0 ] );

                this.value = '';
            });

            const search = document.getElementById( 'searchInput' );
            search.addEventListener( 'input', function()
            {
                query = this.value;
                render();
            });
            // The magnifier opens it; its × (or Escape) empties and folds it,
            // which fires "input" above and drops the search.
            searchFold = NayiveUI.searchFold( { box: search.parentElement, input: search,
                                                toggle: document.getElementById( 'searchBtn' ),
                                                bar: document.querySelector( '.header' ) } );

            document.getElementById( 'detailCloseBtn'  ).addEventListener( 'click', () => closeBackdrop( 'detailBackdrop' ) );
            document.getElementById( 'detailEditBtn'    ).addEventListener( 'click', function()
            {
                const uid = detailUid;
                closeBackdrop( 'detailBackdrop' );
                openEditForExisting( uid );
            });
            document.getElementById( 'detailDeleteBtn'  ).addEventListener( 'click', deleteCurrent );

            document.getElementById( 'editCloseBtn' ).addEventListener( 'click', () => closeBackdrop( 'editBackdrop' ) );
            document.getElementById( 'editSaveBtn'   ).addEventListener( 'click', commitEdit );
            document.getElementById( 'fBday'         ).addEventListener( 'input', function()
            {
                this.dataset.noYear = '';     // a date picked (or cleared) replaces a birthday without a year
                refreshBdayDisplay();
            });

            document.getElementById( 'dedupBtn'        ).addEventListener( 'click', openDedupSheet );
            document.getElementById( 'dedupCloseBtn'   ).addEventListener( 'click', () => closeBackdrop( 'dedupBackdrop' ) );
            document.getElementById( 'mergeCloseBtn'   ).addEventListener( 'click', () => closeBackdrop( 'mergeBackdrop' ) );
            document.getElementById( 'mergeConfirmBtn' ).addEventListener( 'click', doMerge );

            document.getElementById( 'moreToggle' ).addEventListener( 'click', function()
            {
                setMoreOpen( ! this.classList.contains( 'open' ) );
            });

            document.querySelectorAll( 'button[data-add]' ).forEach( function( btn )
            {
                btn.addEventListener( 'click', () => addMultiRow( btn.dataset.add, {} ) );
            });

            document.addEventListener( 'keydown', function( e )
            {
                if( e.key !== 'Escape' ) return;

                // Close the top-most open sheet only. Detail floats above the rest (z-index).
                const order = [ 'detailBackdrop', 'mergeBackdrop', 'editBackdrop', 'dedupBackdrop' ];

                for( const id of order )
                {
                    if( document.getElementById( id ).classList.contains( 'open' ) )
                    {
                        closeBackdrop( id );
                        return;
                    }
                }
                // No sheet open: Escape clears the pick (shared/browser.js).
            });
        }

        function openBackdrop( id )  { NayiveUI.open( id ); }     // impl in shared/ui.js
        function closeBackdrop( id ) { NayiveUI.close( id ); }

        // Both toasts are the shared ones (shared/ui.js + the .toast rules in
        // shared/theme.css); these two names are kept only because the app calls them a lot.
        // Plain functions, not `const x = NayiveUI.y`: shared/ui.js is deferred, so NayiveUI
        // does not exist yet while this script is parsed.
        function flashToast( msg )      { NayiveUI.toast( msg ); }
        function flashUndo( msg, undo ) { NayiveUI.undoToast( msg, undo || undoMerge ); }   // no `undo`: the merge's

    </script>
