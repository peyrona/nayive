                    if( window.NayiveUI ) NayiveUI.applyInfoDots( span );
                }

                // Sub-tasks done out of the total, and - once any of them carries a
                // duration - how long the task is: the LONGEST CHAIN through it, so
                // two sub-tasks that run at the same time are counted once.
                const chips = [];

                if( t.subtasks && t.subtasks.length )
                {
                    const count = document.createElement( 'span' );
                    count.className = 'count-tag';
                    count.textContent = t.subtasks.filter( function( s ) { return s.done; } ).length
                                        + '/' + t.subtasks.length;
                    chips.push( count );

                    const end = planOf( t ).end;

                    if( end )
                    {
                        const total = document.createElement( 'span' );
                        total.className = 'chip total';
                        total.textContent = TF( 'tasks.planDaysChip', { n: end } );
                        total.title = T( 'tasks.planTotalTitle' );
                        chips.push( total );
                    }
                }

                row.appendChild( chips.length ? withChips( span, chips ) : span );
            }

            const actions = document.createElement( 'div' );
            actions.className = 'task-actions';

            if( t.done )
            {
                const undoBtn = document.createElement( 'button' );
                undoBtn.className = 'icon-btn';
                undoBtn.title = T( 'tasks.backToActive' );
                undoBtn.innerHTML = NayiveUI.icon( 'undo' );
                undoBtn.addEventListener( 'click', function() { toggleTask( t.id ); } );

                actions.appendChild( undoBtn );

                const delBtn = document.createElement( 'button' );
                delBtn.className = 'icon-btn danger';
                delBtn.title = NayiveUI.t( 'ui.delete' );
                delBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path></svg>';
                delBtn.addEventListener( 'click', function() { deleteTask( t.id ); } );

                actions.appendChild( delBtn );
            }
            else
            {
                const checkBtn = document.createElement( 'button' );
                checkBtn.className = 'icon-btn check';
                checkBtn.title = T( 'tasks.markDone' );
                checkBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>';
                checkBtn.addEventListener( 'click', function() { toggleTask( t.id ); } );

                actions.appendChild( checkBtn );

                if( ! t.isCalendarSync )
                {
                    const addSubBtn = document.createElement( 'button' );
                    addSubBtn.className = 'icon-btn';
                    addSubBtn.title = T( 'tasks.addSubtask' );
                    addSubBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
                    addSubBtn.addEventListener( 'click', function() { startNewSubtask( t.id ); } );

                    actions.appendChild( addSubBtn );
                }
            }

            row.appendChild( actions );

            return row;
        }

        // `cell` is this row's slice of the task's dependency rail, or null when the
        // task has no dependencies at all - then no rail column is drawn and the row
        // keeps the exact indent it has always had.
        function buildSubtaskRow( task, s, cell )
        {
            const waiting = waitingOn( task, s ).length > 0 && ! s.done;

            const row = document.createElement( 'div' );
            row.className = 'subtask-row' + (waiting ? ' is-waiting' : '');
            row.dataset.subtaskId = s.id;

            // Read-only task: the handle stays as an empty spacer so the row keeps
            // its indent, but there are no grip dots and nothing to drag.
            const handle = document.createElement( 'div' );
            handle.className = 'subtask-handle';

            if( ! task.isCalendarSync )
            {
                handle.title = T( 'tasks.dragHandle' );
                handle.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>';
                handle.addEventListener( 'pointerdown', function( e ) { onSubtaskDragStart( e, task.id, s.id ); } );
            }

            row.appendChild( handle );

            if( cell )
                row.appendChild( buildRail( cell, s.done ? 'done' : waiting ? 'waiting' : '' ) );

            const isEditing = editingSubtask && editingSubtask.taskId === task.id && editingSubtask.subtaskId === s.id;

            if( isEditing )
            {
                const input = document.createElement( 'input' );
                input.type = 'text';
                input.className = 'subtask-edit-input field-edit';
                input.value = s.text;
                input.placeholder = T( 'tasks.describeTask' );

                input.addEventListener( 'keydown', function( e )
                {
                    if( e.key === 'Enter' )  commitEditSubtask( task.id, s.id, input.value );
                    if( e.key === 'Escape' ) cancelEditSubtask();
                });
                input.addEventListener( 'blur', function() { commitEditSubtask( task.id, s.id, input.value ); } );

                row.appendChild( input );

                requestAnimationFrame( function() { input.focus(); input.select(); } );
            }
            else
            {
                const editable = ! s.done && ! task.isCalendarSync;

                const span = document.createElement( 'span' );
                span.className = 'subtask-text field-edit-text' + (s.done ? ' done' : editable ? ' is-editable' : '');
                span.textContent = s.text;

                if( editable )
                    span.addEventListener( 'click', function() { startEditSubtask( task.id, s.id ); } );

                // How long it takes, when it has been told. Nothing else about the
                // plan is written on the row: the rail says what waits for what.
                const chips = [];

                if( s.days > 0 )
                {
                    const days = document.createElement( 'span' );
                    days.className = 'chip' + (s.done ? ' is-done' : '');
                    days.textContent = TF( 'tasks.planDaysChip', { n: s.days } );
                    days.title = T( 'tasks.planDays' );
                    chips.push( days );
                }

                row.appendChild( chips.length ? withChips( span, chips ) : span );
            }

            const actions = document.createElement( 'div' );
            actions.className = 'subtask-actions';

            const checkBtn = document.createElement( 'button' );
            checkBtn.className = 'icon-btn sm check' + (s.done ? ' done' : '');
            checkBtn.title = T( 'tasks.markDone' );
            checkBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>';
            checkBtn.addEventListener( 'click', function() { toggleSubtask( task.id, s.id ); } );

            actions.appendChild( checkBtn );

            // The one new control. Full height so the row keeps its shape, 16px wide
            // so it takes almost nothing from the text. The calendar task is rebuilt
            // from scratch every morning, so its sub-tasks never get one.
            if( ! task.isCalendarSync )
            {
                const planBtn = document.createElement( 'button' );
                planBtn.className = 'icon-btn sm thin subtask-plan-btn';
                planBtn.title = T( 'tasks.planOpen' );
                planBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>';
                planBtn.addEventListener( 'click', function() { openPlanSheet( task.id, s.id ); } );

                actions.appendChild( planBtn );
            }

            row.appendChild( actions );

            return row;
        }


        // One rail cell. Every piece is placed from the TOP of the cell, never from
        // its middle, so the dot lands on the row's first line of text whatever the
        // row's height - the one being edited included.
        function buildRail( cell, state )
        {
            const rail = document.createElement( 'div' );
            rail.className = 'rail';

            function seg( cls )
            {
                const i = document.createElement( 'i' );
                i.className = cls;
                rail.appendChild( i );
            }

            if( cell.v0up )  seg( 'v0 up' );
            if( cell.v0dn )  seg( 'v0 dn' );
            if( cell.v1all ) seg( 'v1 all' );
            if( cell.v1up )  seg( 'v1 up' );
            if( cell.v1dn )  seg( 'v1 dn' );
            if( cell.elbow ) seg( 'h' );

            if( cell.node )
            {
                const dot = document.createElement( 'b' );
                dot.className = state;
                dot.title = T( state === 'done'    ? 'tasks.planDotDone'
                             : state === 'waiting' ? 'tasks.planDotWaiting'
                             :                       'tasks.planDotReady' );
                rail.appendChild( dot );
            }

            return rail;
        }

        // The plan strip: one lane per sub-task that has a duration, on a relative
        // axis that is as many columns as the task is long. The columns share the
        // width, so it fits any pane and never scrolls. The day numbers are dropped
        // once there are too many of them to read - the total at the end still says
        // how long the task is.
        //
        // It reads the schedule from planOf() and never touches the stored order:
        // the list above stays the manual order the user dragged into place.
        function buildPlanStrip( task )
        {
            const p = planOf( task );

            if( ! p.end )
                return null;

            const wrap = document.createElement( 'div' );
            wrap.className = 'plan';

            const cols    = 'repeat(' + p.end + ', minmax(0, 1fr))';
            const numbers = p.end <= 14;
            // The day grid is one <div> per day per lane. Past a couple of months a
            // per-day line is unreadable anyway, so the cells stop and the bars
            // (grid tracks, which cost nothing) carry on alone.
            const cells   = p.end <= 60;

            function trackRow( nameEl, items, isAxis )
            {
                const row = document.createElement( 'div' );
                row.className = 'plan-row';
                row.appendChild( nameEl );

                const track = document.createElement( 'div' );
                track.className = 'plan-track';
                track.style.gridTemplateColumns = cols;

                // The day grid is real cells, not a background: a column here is a
                // fraction of the pane, and a gradient cannot follow that.
                if( cells )
                {
                    for( let d = 1; d <= p.end; d++ )
                    {
                        const c = document.createElement( 'div' );
                        c.className = isAxis ? 'plan-axis' : 'plan-cell';
                        c.style.gridColumn = d + ' / span 1';

                        if( isAxis && numbers )
                            c.textContent = String( d );

                        track.appendChild( c );
                    }
                }

                items.forEach( function( el ) { track.appendChild( el ); } );
                row.appendChild( track );

                return row;
            }

            const axisName = document.createElement( 'div' );
            axisName.className = 'plan-name';
            axisName.textContent = T( 'tasks.planDay' );

            const axisRow = trackRow( axisName, [], true );

            const total = document.createElement( 'span' );
            total.className = 'plan-total';
            total.textContent = TF( 'tasks.planDaysChip', { n: p.end } );
            total.title = T( 'tasks.planTotalTitle' );
            axisRow.appendChild( total );

            wrap.appendChild( axisRow );

            p.subs.forEach( function( s )
            {
                const name = document.createElement( 'div' );
                name.className = 'plan-name' + (s.done ? ' done' : '');
                name.textContent = s.text;
                name.title = s.text;

                const items = [];

                const bar = document.createElement( 'div' );
                // Solid on the longest chain (nothing to lose), lighter when it has
                // room to slip, grey once it is done.
                bar.className = 'plan-bar' + (s.done ? ' done' : p.slack[ s.id ] ? ' off' : '');
                bar.style.gridColumn = p.es[ s.id ] + ' / span ' + s.days;
                items.push( bar );

                if( p.slack[ s.id ] && ! s.done )
                {
                    const tail = document.createElement( 'div' );
                    tail.className = 'plan-slack';
                    tail.style.gridColumn = ( p.ef[ s.id ] + 1 ) + ' / span ' + p.slack[ s.id ];
                    tail.title = T( 'tasks.planSlack' );
                    items.push( tail );
                }

                wrap.appendChild( trackRow( name, items, false ) );
            });

            return wrap;
        }

        //------------------------------------------------------------------------//
        // THE PLAN SHEET  -  the only way into either field.

        let planSheet = null;   // { taskId, subtaskId } while the sheet is open

        function openPlanSheet( taskId, subtaskId )
        {
            const task = findTask( taskId );
            const sub  = task && ( task.subtasks || [] ).find( function( s ) { return s.id === subtaskId; } );

            if( ! sub )
                return;

            planSheet = { taskId: taskId, subtaskId: subtaskId };

            document.getElementById( 'planTextInput' ).value = sub.text;
            document.getElementById( 'planDaysInput' ).value = sub.days > 0 ? String( sub.days ) : '';

            const list = document.getElementById( 'planAfterList' );
            list.innerHTML = '';

            // Every sibling except itself and the ones that already depend on it -
            // offering those is the only way to close a loop, so they are simply not
            // on the list. Cheaper than detecting a cycle afterwards, and it cannot
            // fail silently.
            const choices = ( task.subtasks || [] ).filter( function( o )
            {
                return o.id !== sub.id && o.text && ! dependsOn( task, o, sub.id );
            });

            if( ! choices.length )
            {
                const empty = document.createElement( 'p' );
                empty.className = 'pick-empty';
                empty.textContent = T( 'tasks.planNoSiblings' );
                list.appendChild( empty );
            }

            choices.forEach( function( o )
            {
                const on  = ( sub.after || [] ).indexOf( o.id ) !== -1;
                const row = document.createElement( 'label' );
                row.className = 'pick-row' + (on ? ' on' : '');

                const box = document.createElement( 'input' );
                box.type    = 'checkbox';
                box.checked = on;
                box.value   = String( o.id );
                box.addEventListener( 'change', function() { row.classList.toggle( 'on', box.checked ); } );
                row.appendChild( box );

                const name = document.createElement( 'span' );
                name.style.flex = '1 1 auto';
                name.style.minWidth = '0';
                name.textContent = o.text;
                row.appendChild( name );

                if( o.days > 0 )
                {
                    const chip = document.createElement( 'span' );
                    chip.className = 'chip';
                    chip.textContent = TF( 'tasks.planDaysChip', { n: o.days } );
                    row.appendChild( chip );
                }

                list.appendChild( row );
            });

            NayiveUI.open( 'planSheetBackdrop' );
        }

        function stepDays( by )
        {
            const input = document.getElementById( 'planDaysInput' );
            const n     = Math.round( Number( input.value ) ) || 0;
            const next  = Math.min( DAYS_MAX, Math.max( 0, n + by ) );

            input.value = next ? String( next ) : '';
        }

        // Writes the whole sheet at once: whatever it says is what the sub-task has.
        // `clearPlan` is the red bin - it keeps the text (a typo fixed on the way out
        // is still a fix) and drops the duration and the order, which is the same
        // state as a sub-task that never had either.
        function savePlanSheet( clearPlan )
        {
            if( ! planSheet )
                return;

            const task = findTask( planSheet.taskId );
            const sub  = task && ( task.subtasks || [] ).find( function( s ) { return s.id === planSheet.subtaskId; } );

            if( ! sub )
            {
                closePlanSheet();
                return;
            }

            // An empty box keeps the name it had: this is not the place a sub-task
            // can be erased, and commitEditSubtask() treats a blanked name the same.
            const sText = document.getElementById( 'planTextInput' ).value.trim();

            if( sText )
                sub.text = sText;

            const n = clearPlan ? 0 : Math.round( Number( document.getElementById( 'planDaysInput' ).value ) );

            if( n > 0 ) sub.days = Math.min( n, DAYS_MAX );
            else        delete sub.days;

            const after = clearPlan ? []
                            : [].slice.call( document.querySelectorAll( '#planAfterList input:checked' ) )
                                  .map( function( box ) { return Number( box.value ); } );

            if( after.length ) sub.after = after;
            else               delete sub.after;

            closePlanSheet();
            render();
            saveTasks();
        }

        function closePlanSheet()
        {
            NayiveUI.close( 'planSheetBackdrop' );
            planSheet = null;
        }

        //------------------------------------------------------------------------//
        // SUB-TASK DRAG & DROP (Pointer Events — works with mouse, touch and pen alike)

        function onSubtaskDragStart( e, fromTaskId, subtaskId )
        {
            e.preventDefault();

            const handle = e.currentTarget;
            const rowEl  = handle.closest( '.subtask-row' );
            const rect   = rowEl.getBoundingClientRect();

            handle.setPointerCapture( e.pointerId );

            const ghost = rowEl.cloneNode( true );
            ghost.classList.add( 'drag-ghost' );
            ghost.style.width = rect.width + 'px';
            document.body.appendChild( ghost );
            positionGhost( ghost, e.clientX, e.clientY );

            dragCtx = { fromTaskId: fromTaskId, subtaskId: subtaskId, ghostEl: ghost, hoverGroup: null, hoverRow: null, pointerId: e.pointerId };

            rowEl.style.opacity = '0.35';

            handle.addEventListener( 'pointermove', onSubtaskDragMove );
            handle.addEventListener( 'pointerup', onSubtaskDragEnd );
            handle.addEventListener( 'pointercancel', onSubtaskDragCancel );
        }

        function onSubtaskDragMove( e )
        {
            if( ! dragCtx )
                return;

            positionGhost( dragCtx.ghostEl, e.clientX, e.clientY );

            const group    = findTaskGroupAt( e.clientX, e.clientY );
            const sameTask = group && Number( group.dataset.taskId ) === dragCtx.fromTaskId;

            // Whole-card highlight is only meaningful for reparenting onto a DIFFERENT task.
            const cardHoverGroup = sameTask ? null : group;

            if( cardHoverGroup !== dragCtx.hoverGroup )
            {
                if( dragCtx.hoverGroup )
                    dragCtx.hoverGroup.classList.remove( 'drop-hover' );

                if( cardHoverGroup )
                    cardHoverGroup.classList.add( 'drop-hover' );

                dragCtx.hoverGroup = cardHoverGroup;
            }

            // Row-level insertion line is only meaningful for reordering within the SAME task.
            updateRowHover( sameTask ? findSubtaskDropAt( e.clientX, e.clientY, dragCtx.subtaskId ) : null );
        }

        function onSubtaskDragEnd( e )
        {
            if( ! dragCtx )
                return;

            const targetGroup = findTaskGroupAt( e.clientX, e.clientY );
            const sameTask    = targetGroup && Number( targetGroup.dataset.taskId ) === dragCtx.fromTaskId;
            const dropInfo    = sameTask ? findSubtaskDropAt( e.clientX, e.clientY, dragCtx.subtaskId ) : null;
            const ctx         = dragCtx;

            cleanupDrag( e.currentTarget );

            if( sameTask )
            {
                if( dropInfo )
                    reorderSubtask( ctx.fromTaskId, ctx.subtaskId, dropInfo.subtaskId, dropInfo.before );
                else
                    render();   // dropped back within the same task but not on a specific row
            }
            else if( targetGroup )
            {
                moveSubtask( ctx.subtaskId, ctx.fromTaskId, Number( targetGroup.dataset.taskId ) );
            }
            else
            {
                render();   // restore normal opacity even when dropped outside any task
            }
        }

        function onSubtaskDragCancel( e )
        {
            if( ! dragCtx )
                return;

            cleanupDrag( e.currentTarget );
            render();
        }

        function cleanupDrag( handle )
        {
            if( dragCtx )
            {
                dragCtx.ghostEl.remove();

                if( dragCtx.hoverGroup )
                    dragCtx.hoverGroup.classList.remove( 'drop-hover' );

                if( dragCtx.hoverRow )
                    dragCtx.hoverRow.classList.remove( 'insert-before', 'insert-after' );
            }

            handle.removeEventListener( 'pointermove', onSubtaskDragMove );
            handle.removeEventListener( 'pointerup', onSubtaskDragEnd );
            handle.removeEventListener( 'pointercancel', onSubtaskDragCancel );

            dragCtx = null;
        }

        function positionGhost( ghost, clientX, clientY )
        {
            ghost.style.transform = 'translate(' + (clientX + 14) + 'px,' + (clientY - 18) + 'px)';
        }

        function findTaskGroupAt( clientX, clientY )
        {
            const el    = elementUnderGhost( clientX, clientY );
            const group = el ? el.closest( '.task-group' ) : null;

            // The calendar task is read-only: no sub-task from elsewhere can be
            // dropped into it, so it never highlights and never accepts a move.
            return group && group.classList.contains( 'calendar-sync' ) ? null : group;
        }

        // Which sub-task row the pointer is over, and whether it's hovering the top or bottom
        // half of it (i.e. "insert before this row" vs "insert after this row"). Excludes the
        // row currently being dragged — dropping on itself is not a meaningful reorder target.
        function findSubtaskDropAt( clientX, clientY, excludeSubtaskId )
        {
            const el  = elementUnderGhost( clientX, clientY );
            const row = el ? el.closest( '.subtask-row' ) : null;

            if( ! row )
                return null;

            const id = Number( row.dataset.subtaskId );

            if( id === excludeSubtaskId )
                return null;

            const rect   = row.getBoundingClientRect();
            const before = (clientY - rect.top) < (rect.height / 2);

            return { row: row, subtaskId: id, before: before };
        }

        function updateRowHover( dropInfo )
        {
            if( dragCtx.hoverRow && dragCtx.hoverRow !== (dropInfo && dropInfo.row) )
                dragCtx.hoverRow.classList.remove( 'insert-before', 'insert-after' );

            if( dropInfo )
            {
                dropInfo.row.classList.remove( 'insert-before', 'insert-after' );
                dropInfo.row.classList.add( dropInfo.before ? 'insert-before' : 'insert-after' );
            }

            dragCtx.hoverRow = dropInfo ? dropInfo.row : null;
        }

        function elementUnderGhost( clientX, clientY )
        {
            const ghost = dragCtx ? dragCtx.ghostEl : null;

            if( ghost )
                ghost.style.display = 'none';

            const el = document.elementFromPoint( clientX, clientY );

            if( ghost )
                ghost.style.display = '';

            return el;
        }

    </script>
</body>
</html>
