<!-- index.html - Bookmarks: web links kept in folders. One JSON file per user,
     data/bookmarks/bookmarks.json, read and written through shared/store.js
     (offline cache + write-behind). Imports and exports the Netscape HTML
     file every browser reads, plus its own JSON backup. See
     docs/bookmarks-app.md. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Bookmarks</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z'/%3E%3C/svg%3E">

    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/locker.js"></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/store.js" defer></script>

    <!-- The app: classic deferred files sharing one scope, in this order, then
         the one module that waits for the dictionary and boots. -->
    <script src="model.js" defer></script>
    <script src="render.js" defer></script>
    <script src="sheets.js" defer></script>
    <script src="io.js" defer></script>
    <script src="input.js" defer></script>
    <script src="boot.js" type="module"></script>

    <link rel="stylesheet" href="bookmarks.css">
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <h1>Bookmarks</h1>

            <!-- The view switch: cards or a compact list. -->
            <div class="tb-modes">
                <button id="gridBtn" class="icon-btn view-btn" type="button" data-i18n-attr="title:bookmarks.viewGrid, aria-label:bookmarks.viewGrid">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
                </button>
                <button id="listBtn" class="icon-btn view-btn" type="button" data-i18n-attr="title:bookmarks.viewList, aria-label:bookmarks.viewList">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3.5" y1="6" x2="3.51" y2="6"></line><line x1="3.5" y1="12" x2="3.51" y2="12"></line><line x1="3.5" y1="18" x2="3.51" y2="18"></line></svg>
                </button>
            </div>

            <div class="topbar-actions">
                <div class="tb-group">
                    <!-- The shared search fold (NayiveUI.searchFold, input.js). -->
                    <div class="search-wrap">
                        <input id="searchInput" class="search-input" type="text" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:bookmarks.searchPh, aria-label:ui.search">
                    </div>
                    <button id="searchBtn" class="icon-btn" type="button" data-i18n-attr="title:ui.search, aria-label:ui.search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                    <button id="addBtn" class="icon-btn" type="button" data-i18n-attr="title:bookmarks.newBookmark, aria-label:bookmarks.newBookmark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button id="newFolderBtn" class="icon-btn" type="button" data-i18n-attr="title:ui.newFolder, aria-label:ui.newFolder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
                    </button>
                </div>
                <div class="tb-group tb-sys">
                    <button id="moreBtn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-attr="title:ui.moreOptions, aria-label:ui.moreOptions">
                        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>
                    </button>
                    <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </button>
                </div>
                <button id="syncIndicator" class="sync-indicator" type="button" data-i18n-attr="title:ui.sync.synced"></button>
            </div>
        </div>

        <!-- The header "⋮". Filled by input.js (wireTopMenu). -->
        <div id="topMenu" class="top-menu" role="menu" hidden></div>
        <!-- The long-press / right-click / row "⋮" menu. Filled per item. -->
        <div id="ctxMenu" class="top-menu" role="menu" hidden></div>

        <div class="body-row">
            <!-- The folder tree (PC + tablet; hidden on a phone). -->
            <nav id="treePane" class="tree-pane" data-i18n-attr="aria-label:bookmarks.folders">
                <div class="tree-head">
                    <span class="section-label" data-i18n="bookmarks.folders"></span>
                    <button id="expandAllBtn" class="icon-btn sm" type="button" data-i18n-attr="title:bookmarks.expandAll, aria-label:bookmarks.expandAll">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 8 12 13 17 8"></polyline><polyline points="7 13 12 18 17 13"></polyline></svg>
                    </button>
                    <button id="collapseAllBtn" class="icon-btn sm" type="button" data-i18n-attr="title:bookmarks.collapseAll, aria-label:bookmarks.collapseAll">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 16 12 11 17 16"></polyline><polyline points="7 11 12 6 17 11"></polyline></svg>
                    </button>
                </div>
                <div id="tree"></div>
            </nav>
            <div id="paneResizer" class="pane-resizer" role="separator" aria-orientation="vertical" data-i18n-attr="title:ui.dragResize"></div>

            <main id="listPane" class="list-pane">
                <!-- Selection mode: ← leaves it. -->
                <div id="selectBar" class="select-bar" hidden>
                    <button id="selectLeave" class="icon-btn" type="button" data-i18n-attr="title:bookmarks.selectLeave, aria-label:bookmarks.selectLeave"></button>
                    <span id="selectCount" class="select-count"></span>
                    <button id="selectAllBtn" class="icon-btn" type="button" data-i18n-attr="title:bookmarks.selectAll, aria-label:bookmarks.selectAll">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><polyline points="8 12 11 15 16 9"></polyline></svg>
                    </button>
                    <button id="selectMoveBtn" class="icon-btn" type="button" data-i18n-attr="title:bookmarks.moveTo, aria-label:bookmarks.moveTo"></button>
                    <button id="selectDeleteBtn" class="icon-btn danger" type="button" data-i18n-attr="title:ui.delete, aria-label:ui.delete"></button>
                </div>

                <div id="filterRow" class="filter-row">
                    <button class="pill" type="button" data-filter="all"></button>
                    <button class="pill" type="button" data-filter="fav"></button>
                    <button class="pill" type="button" data-filter="recent"></button>
                </div>

                <div class="crumb-row">
                    <button id="upBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:bookmarks.up, aria-label:bookmarks.up"></button>
                    <div id="crumbs" class="open-crumb"></div>
                </div>

                <div id="items" class="items"></div>
                <div id="emptyHint" class="empty-hint" hidden></div>
            </main>
        </div>
    </div>

    <!-- Add / edit a bookmark -->
    <div id="bmBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="bmTitle"></h2>
            <div class="field">
                <label for="bmUrl" data-i18n="bookmarks.url"></label>
                <input id="bmUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://">
            </div>
            <p id="bmUrlError" class="field-error" hidden></p>
            <p id="bmDupNote" class="bm-dup-note" hidden></p>
            <div class="field">
                <label for="bmName" data-i18n="bookmarks.title"></label>
                <input id="bmName" type="text" autocomplete="off">
            </div>
            <div class="field">
                <label for="bmFolder" data-i18n="ui.folder"></label>
                <select id="bmFolder"></select>
            </div>
            <div class="field">
                <label for="bmTags" data-i18n="bookmarks.tags"></label>
                <input id="bmTags" type="text" autocomplete="off" data-i18n-attr="placeholder:bookmarks.tagsPh">
            </div>
            <div class="field">
                <label for="bmNotes" data-i18n="ui.notes"></label>
                <textarea id="bmNotes" rows="3"></textarea>
            </div>
            <label class="check-row switch-row"><span data-i18n="bookmarks.favourite"></span><span class="switch sm"><input id="bmFav" type="checkbox"><span class="track"></span></span></label>
            <div class="sheet-actions">
                <button id="bmDeleteBtn" class="sheet-actions-left" type="button" data-act="danger" data-i18n-attr="title:ui.delete"></button>
                <button type="button" data-act="close" data-i18n-attr="title:ui.cancel"></button>
                <button id="bmSaveBtn" type="button" data-act="primary" data-i18n-attr="title:ui.save"></button>
            </div>
        </div>
    </div>

    <!-- New folder / rename a folder -->
    <div id="folderBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="folderTitle"></h2>
            <div class="field">
                <label for="folderName" data-i18n="bookmarks.folderName"></label>
                <input id="folderName" type="text" autocomplete="off">
            </div>
            <div class="field">
                <label for="folderParent" data-i18n="bookmarks.parent"></label>
                <select id="folderParent"></select>
            </div>
            <div class="sheet-actions">
                <button type="button" data-act="close" data-i18n-attr="title:ui.cancel"></button>
                <button id="folderSaveBtn" type="button" data-act="primary" data-i18n-attr="title:ui.save"></button>
            </div>
        </div>
    </div>

    <!-- Move to… -->
    <div id="moveBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="moveTitle"></h2>
            <div class="field">
                <label for="moveFolder" data-i18n="ui.folder"></label>
                <select id="moveFolder"></select>
            </div>
            <div class="sheet-actions">
                <button type="button" data-act="close" data-i18n-attr="title:ui.cancel"></button>
                <button id="moveOkBtn" type="button" data-act="primary" data-i18n-attr="title:bookmarks.moveHere"></button>
            </div>
        </div>
    </div>

    <!-- Import -->
    <div id="importBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="bookmarks.import"></h2>
            <p class="sheet-lead" data-i18n="bookmarks.importLead"></p>
            <div class="field">
                <span class="field-caption" data-i18n="bookmarks.importHow"></span>
                <label class="check-row"><input type="radio" name="importMode" value="add" checked> <span data-i18n="bookmarks.importAdd"></span></label>
                <label class="check-row"><input type="radio" name="importMode" value="replace"> <span data-i18n="bookmarks.importReplace"></span></label>
            </div>
            <div class="choice-row">
                <button id="importDeviceBtn" class="text-btn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    <span data-i18n="bookmarks.fromDevice"></span>
                </button>
                <button id="importNayiveBtn" class="text-btn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path></svg>
                    <span data-i18n="bookmarks.fromNayive"></span>
                </button>
            </div>
            <div class="sheet-actions">
                <button type="button" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Export -->
    <div id="exportBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="bookmarks.export"></h2>
            <p class="sheet-lead" data-i18n="bookmarks.exportLead"></p>
            <div class="field">
                <span class="field-caption" data-i18n="bookmarks.exportWhere"></span>
                <label class="check-row"><input type="radio" name="exportWhere" value="device" checked> <span data-i18n="bookmarks.toDevice"></span></label>
                <label class="check-row"><input type="radio" name="exportWhere" value="nayive"> <span data-i18n="bookmarks.toNayive"></span></label>
            </div>
            <div class="choice-row">
                <button id="exportHtmlBtn" class="text-btn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span data-i18n="bookmarks.exportHtml"></span>
                </button>
                <button id="exportJsonBtn" class="text-btn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    <span data-i18n="bookmarks.exportJson"></span>
                </button>
            </div>
            <div class="sheet-actions">
                <button type="button" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Save from any page: a browser bookmark (bookmarklet) to drag to the bar -->
    <div id="bmletBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 data-i18n="bookmarks.bookmarklet"></h2>
            <p class="sheet-lead" data-i18n="bookmarks.bookmarkletLead"></p>
            <div class="choice-row">
                <a id="bmletLink" class="text-btn" draggable="true" href="#">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="bookmarks.bookmarkletBtn"></span>
                </a>
            </div>
            <div class="sheet-actions">
                <button type="button" data-act="close" data-i18n-attr="title:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- Duplicates -->
    <div id="dupBackdrop" class="sheet-backdrop">
        <div class="sheet sheet--wide">
            <h2><span data-i18n="bookmarks.dupes"></span> <span id="dupCount" class="dup-count"></span></h2>
            <p class="sheet-lead" data-i18n="bookmarks.dupesLead"></p>
            <div id="dupList"></div>
            <div class="sheet-actions">
                <button type="button" data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="dupRemoveBtn" type="button" data-act="danger" data-i18n-attr="title:bookmarks.dupesRemove"></button>
            </div>
        </div>
    </div>

    <input type="file" id="importInput" accept=".html,.htm,.json,text/html,application/json" hidden>
    <div id="toast" class="toast"></div>
</body>
</html>
