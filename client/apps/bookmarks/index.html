<!-- index.html - Bookmarks: web links kept in folders. One JSON file per user,
     data/bookmarks/bookmarks.json, read and written through shared/store.js
     (offline cache + write-behind). Imports and exports the Netscape HTML
     file every browser reads, plus its own JSON backup. See
     docs/bookmarks-app.md. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <script src="../shared/ayni/ayni-i18n.js" data-dict="../shared/i18n/" data-langs="es en pt fr de"></script>
    <title>Bookmarks</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z'/%3E%3C/svg%3E">

    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/ayni/ayni-base.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-buttons.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-toasts.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-dialogs.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-menus.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-search.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-lists.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-help.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-fields.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-pickers.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-layout.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ document.documentElement.dataset.theme = localStorage.getItem( 'ayni-theme' ) || ( matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light' ); }catch( e ){}</script>
    <script src="../shared/ayni/ayni-icons.js" defer></script>
    <script src="../shared/ayni/ayni-base.js" defer></script>
    <script src="../shared/ayni/ayni-buttons.js" defer></script>
    <script src="../shared/ayni/ayni-toasts.js" defer></script>
    <script src="../shared/ayni/ayni-dialogs.js" defer></script>
    <script src="../shared/ayni/ayni-menus.js" defer></script>
    <script src="../shared/ayni/ayni-search.js" defer></script>
    <script src="../shared/ayni/ayni-lists.js" defer></script>
    <script src="../shared/ayni/ayni-help.js" defer></script>
    <script src="../shared/ayni/ayni-fields.js" defer></script>
    <script src="../shared/ayni/ayni-pickers.js" defer></script>
    <script src="../shared/ayni/ayni-layout.js" defer></script>
    <script src="../shared/locker.js"></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/store.js" defer></script>

    <!-- The app: classic deferred files sharing one scope, in this order, then
         the one module that waits for the dictionary and boots. -->
    <script src="model.js" defer></script>
    <script src="render.js" defer></script>
    <script src="sheets.js" defer></script>
    <script src="io.js" defer></script>
    <script src="input.js" defer></script>
    <script src="boot.js" type="module"></script>

    <link rel="stylesheet" href="bookmarks.css">
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <h1>Bookmarks</h1>

            <!-- The view switch: cards or a compact list. -->
            <div class="tb-modes">
                <button id="gridBtn" class="btn view-btn" type="button" data-i18n-attr="data-tip:bookmarks.viewGrid, aria-label:bookmarks.viewGrid">
                    <span class="icon" data-icon="view-grid"></span>
                </button>
                <button id="listBtn" class="btn view-btn" type="button" data-i18n-attr="data-tip:bookmarks.viewList, aria-label:bookmarks.viewList">
                    <span class="icon" data-icon="view-list"></span>
                </button>
            </div>

            <div class="topbar-actions tall" role="toolbar" data-i18n-attr="aria-label:ui.actions">
                <!-- The selection's buttons (Ayni.list): only while something is picked. -->
                <div id="selActions" class="tb-group" hidden></div>
                <div class="tb-group">
                    <!-- The search field (Ayni.searchField, input.js). -->
                    <div class="input-group search-field fold">
                        <input id="searchInput" class="input" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:bookmarks.searchPh, aria-label:ui.search">
                    </div>
                    <button id="searchBtn" class="btn" type="button" data-rank="20" data-search data-i18n-attr="data-tip:ui.search, aria-label:ui.search">
                        <span class="icon" data-icon="search"></span>
                    </button>
                    <button id="addBtn" class="btn" type="button" data-rank="21" data-i18n-attr="data-tip:bookmarks.newBookmark, aria-label:bookmarks.newBookmark">
                        <span class="icon" data-icon="plus"></span>
                    </button>
                    <button id="newFolderBtn" class="btn" type="button" data-rank="22" data-i18n-attr="data-tip:ui.newFolder, aria-label:ui.newFolder">
                        <span class="icon" data-icon="folder-plus"></span>
                    </button>
                </div>
                <div class="tb-group tb-sys">
                    <!-- The ONE "⋮" (Ayni.fitBar, input.js): the buttons that do not
                         fit the header, then Bookmarks' own rows (import, sort...). -->
                    <button id="moreBtn" class="btn" type="button" hidden aria-haspopup="true" aria-expanded="false" data-i18n-attr="data-tip:ui.moreOptions, aria-label:ui.moreOptions">
                        <span class="icon" data-icon="more"></span>
                    </button>
                    <button class="btn" data-help-open data-rank="31" type="button" data-i18n-attr="data-tip:ayni.help, aria-label:ayni.help">
                        <span class="icon" data-icon="help"></span>
                    </button>
                </div>
                <button id="syncIndicator" class="sync-indicator" type="button" data-i18n-attr="data-tip:ui.sync.synced"></button>
            </div>
        </div>

        <div class="body-row">
            <!-- The folder tree (PC + tablet; on a phone it slides in from the folder button). -->
            <nav id="treePane" class="tree-pane" data-i18n-attr="aria-label:bookmarks.folders">
                <div class="tree-head">
                    <span class="section-label" data-i18n="bookmarks.folders"></span>
                    <button id="expandAllBtn" class="btn sm" type="button" data-i18n-attr="data-tip:bookmarks.expandAll, aria-label:bookmarks.expandAll">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 8 12 13 17 8"></polyline><polyline points="7 13 12 18 17 13"></polyline></svg>
                    </button>
                    <button id="collapseAllBtn" class="btn sm" type="button" data-i18n-attr="data-tip:bookmarks.collapseAll, aria-label:bookmarks.collapseAll">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 16 12 11 17 16"></polyline><polyline points="7 11 12 6 17 11"></polyline></svg>
                    </button>
                </div>
                <ul id="tree" data-fit data-i18n-attr="aria-label:bookmarks.folders"></ul>
            </nav>
            <div id="paneResizer" class="splitter"></div>

            <main id="listPane" class="list-pane">
                <div id="filterRow" class="filter-row choices" role="group">
                    <button class="btn text sm bordered" type="button" aria-pressed="false" data-filter="all"></button>
                    <button class="btn text sm bordered" type="button" aria-pressed="false" data-filter="fav"></button>
                    <button class="btn text sm bordered" type="button" aria-pressed="false" data-filter="recent"></button>
                </div>

                <div class="crumb-row">
                    <button id="treeBtn" class="btn" type="button" data-i18n-attr="data-tip:ui.folders, aria-label:ui.folders">
                        <span class="icon" data-icon="folder"></span>
                    </button>
                    <button id="upBtn" class="btn" type="button" hidden data-i18n-attr="data-tip:bookmarks.up, aria-label:bookmarks.up"></button>
                    <div id="crumbs" class="open-crumb"></div>
                </div>

                <div id="items" class="items"></div>
                <div id="emptyHint" class="empty-hint" hidden></div>
            </main>
        </div>
    </div>

    <!-- Add / edit a bookmark -->
    <dialog id="bmBackdrop" class="panel">
        <header>
            <h2 id="bmTitle"></h2>
        </header>
        <div class="body">
            <div class="field">
                <label for="bmUrl" data-i18n="bookmarks.url"></label>
                <input class="input" id="bmUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://" aria-describedby="bmUrlError">
                <span id="bmUrlError" class="error" hidden></span>
            </div>
            <p id="bmDupNote" class="bm-dup-note" hidden></p>
            <div class="field">
                <label for="bmName" data-i18n="bookmarks.title"></label>
                <input class="input" id="bmName" type="text" autocomplete="off">
            </div>
            <div class="field">
                <label for="bmFolder" data-i18n="ui.folder"></label>
                <div class="picker" id="bmFolder"></div>
            </div>
            <div class="field">
                <label for="bmTags" data-i18n="bookmarks.tags"></label>
                <input class="input" id="bmTags" type="text" autocomplete="off" data-i18n-attr="placeholder:bookmarks.tagsPh">
            </div>
            <div class="field">
                <label for="bmNotes" data-i18n="ui.notes"></label>
                <textarea class="input" id="bmNotes" rows="3"></textarea>
            </div>
            <label class="check-row switch end"><span data-i18n="bookmarks.favourite"></span><input role="switch" id="bmFav" type="checkbox"></label>
        </div>
        <footer>
            <div class="extra"><button id="bmDeleteBtn" class="btn danger" type="button" data-i18n-attr="data-tip:ui.delete"><span class="icon" data-icon="trash"></span></button></div>
            <button class="btn" type="button" data-close data-i18n-attr="data-tip:ui.cancel"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="bmSaveBtn" type="button" data-i18n-attr="data-tip:ui.save"><span class="icon" data-icon="check"></span></button>
        </footer>
    </dialog>

    <!-- New folder / rename a folder -->
    <dialog id="folderBackdrop" class="panel">
        <header>
            <h2 id="folderTitle"></h2>
        </header>
        <div class="body">
            <div class="field">
                <label for="folderName" data-i18n="bookmarks.folderName"></label>
                <input class="input" id="folderName" type="text" autocomplete="off">
            </div>
            <div class="field">
                <label for="folderParent" data-i18n="bookmarks.parent"></label>
                <div class="picker" id="folderParent"></div>
            </div>
        </div>
        <footer>
            <button class="btn" type="button" data-close data-i18n-attr="data-tip:ui.cancel"><span class="icon" data-icon="close"></span></button>
            <button class="btn primary" id="folderSaveBtn" type="button" data-i18n-attr="data-tip:ui.save"><span class="icon" data-icon="check"></span></button>
        </footer>
    </dialog>

    <!-- Import -->
    <dialog id="importBackdrop" class="panel">
        <header>
            <h2 data-i18n="bookmarks.import"></h2>
            <button class="btn" type="button" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <p class="sheet-lead" data-i18n="bookmarks.importLead"></p>
            <div class="field">
                <span class="field-caption" data-i18n="bookmarks.importHow"></span>
                <label class="choice check-row"><input type="radio" name="importMode" value="add" checked> <span data-i18n="bookmarks.importAdd"></span></label>
                <label class="choice check-row"><input type="radio" name="importMode" value="replace"> <span data-i18n="bookmarks.importReplace"></span></label>
            </div>
            <div class="choice-row">
                <button id="importDeviceBtn" class="btn text primary" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    <span data-i18n="bookmarks.fromDevice"></span>
                </button>
                <button id="importNayiveBtn" class="btn text primary" type="button">
                    <span data-i18n="bookmarks.fromNayive"></span>
                </button>
            </div>
        </div>
    </dialog>

    <!-- Export -->
    <dialog id="exportBackdrop" class="panel">
        <header>
            <h2 data-i18n="bookmarks.export"></h2>
            <button class="btn" type="button" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <p class="sheet-lead" data-i18n="bookmarks.exportLead"></p>
            <div class="field">
                <span class="field-caption" data-i18n="bookmarks.exportWhere"></span>
                <label class="choice check-row"><input type="radio" name="exportWhere" value="device" checked> <span data-i18n="bookmarks.toDevice"></span></label>
                <label class="choice check-row"><input type="radio" name="exportWhere" value="nayive"> <span data-i18n="bookmarks.toNayive"></span></label>
            </div>
            <div class="choice-row">
                <button id="exportHtmlBtn" class="btn text primary" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span data-i18n="bookmarks.exportHtml"></span>
                </button>
                <button id="exportJsonBtn" class="btn text primary" type="button">
                    <span class="icon" data-icon="save"></span>
                    <span data-i18n="bookmarks.exportJson"></span>
                </button>
            </div>
        </div>
    </dialog>

    <!-- Save from any page: a browser bookmark (bookmarklet) to drag to the bar -->
    <dialog id="bmletBackdrop" class="panel">
        <header>
            <h2 data-i18n="bookmarks.bookmarklet"></h2>
            <button class="btn" type="button" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
        </header>
        <div class="body">
            <p class="sheet-lead" data-i18n="bookmarks.bookmarkletLead"></p>
            <div class="choice-row">
                <a id="bmletLink" class="btn text primary" draggable="true" href="#">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                    <span data-i18n="bookmarks.bookmarkletBtn"></span>
                </a>
            </div>
        </div>
    </dialog>

    <!-- Duplicates -->
    <dialog id="dupBackdrop" class="panel big">
        <header>
            <h2><span data-i18n="bookmarks.dupes"></span> <span id="dupCount" class="dup-count"></span></h2>
        </header>
        <div class="body">
            <p class="sheet-lead" data-i18n="bookmarks.dupesLead"></p>
            <div id="dupList"></div>
        </div>
        <footer>
            <button class="btn" type="button" data-close data-i18n-attr="data-tip:ui.close"><span class="icon" data-icon="close"></span></button>
            <button class="btn danger" id="dupRemoveBtn" type="button" data-i18n-attr="data-tip:bookmarks.dupesRemove"><span class="icon" data-icon="trash"></span></button>
        </footer>
    </dialog>

    <input type="file" id="importInput" accept=".html,.htm,.json,text/html,application/json" hidden>
</body>
</html>
