<!-- SEALED - a user-data write path (docs/sealed-crud.md): announce a change, keep it minimal, then `node tools/data-safety-test/run.mjs` must be ALL GREEN. -->
<!-- index.html - "Music": browse and play the audio files in one Drive folder
     (and its subfolders). Opened as  ?dir=<folder path>  from Drive's "Abrir
     con" dialog (a double-clicked file no app claims) - Drive has no Music
     button any more.

     Opened from the launcher there is no ?dir=: the page uses the folder it
     remembers in data/music/config.json, and the first time (no config yet)
     asks for it with NayiveUI.pickFolder and saves the answer. The crumb in the
     header re-opens that picker to change folder. Only if the visitor cancels
     the picker (or isn't signed in) does the "open me from Drive" hint show.

     Real folders only: the file list comes from GumApi.listDirRecursive(dir)
     (GET /api/files?dir=&recursive=1 - the whole subtree in one call), each
     song plays straight from GumApi.fileUrl(path) through a real <audio>
     element (the server already streams that with Range support - the same
     endpoint Drive's own built-in A/V player uses). Title/artist/album come
     from the file's ID3v2 tags when it is an .mp3 (a small Range read, same
     trick Photos uses for EXIF), else from the path: "Artist/Album/NN - Title"
     when the folder structure has it, the bare filename otherwise. The ID3 read
     and the track-length probe are both a network hit per file, so their
     results are cached in data/music/scan-cache.json (keyed by path + size +
     mtime): a big library is only scanned once, later opens read the cache and
     the song list itself renders in pages as you scroll. That cache stays in
     step: Drive re-keys it on a move / rename and drops entries on a trash
     (remapMediaCaches / purgeMediaCaches), Music itself sweeps entries for
     files no longer in the library every time it opens, and a stale entry
     never matches anyway (the size + mtime guard). Saved
     playlists live in data/music/playlists.json (paths, not IDs - a real
     file's path is already a stable identifier). The Now Playing queue is
     session-only, like any player's queue.

     Known gaps (fine for a first real version, not yet built): only .mp3
     carries real tag reading (FLAC/OGG stay filename-derived); nothing writes
     a guessed tag back into the file yet. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Music</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 18V5l12-2v13'/%3E%3Ccircle cx='6' cy='18' r='3'/%3E%3Ccircle cx='18' cy='16' r='3'/%3E%3C/svg%3E">

    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/locker.js"></script>
    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/browser.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'music',
            title: 'Music',
            lead:  NayiveUI.t( 'music.introLead' ),
            buttons: [
                { sel: '#folderInfoBtn', text: NayiveUI.t( 'music.introFolder' ) },
                { sel: '#searchToggle', text: NayiveUI.t( 'music.introSearch' ) },
                { sel: '#reloadBtn',   text: NayiveUI.t( 'music.introRescan' ) },
                { icon: 'folder',       name: NayiveUI.t( 'music.library' ), text: NayiveUI.t( 'music.introTree' ) },
                { sel: '#seqBtn',       name: NayiveUI.t( 'music.introOrderName' ), text: NayiveUI.t( 'music.introOrder' ) },
                { sel: '#saveListBtn',  text: NayiveUI.t( 'music.introSaveList' ) },
                { sel: '#clearQueueBtn', text: NayiveUI.t( 'music.introClear' ) }
            ]
        } );
    } );
    </script>

    <style>
    /* ===================================================================
     * MUSIC - per-app layout only. Chrome (header, .icon-btn, .field,
     * .sheet, .btn) comes from shared/theme.css + app.css; this block holds
     * the library / queue split and the player bar, none of which exists
     * anywhere else yet.
     * =================================================================*/
    html, body { height: 100%; }

    /* The header's toolbar (folder-? menu, .tb-modes, .topbar-actions groups)
       comes from shared/app.css (folder-backed viewers), search field included. */

    /* ---- main row: library + queue ----------------------------------
       .main-row, .view-head, .media-card, .scope-chip, .empty-hint and the
       whole player bar are the shared MEDIA VIEWER block in shared/app.css.
       Only what is really Music's own is below. */

    .pane-resizer { flex: 0 0 auto; width: 5px; cursor: col-resize; background: transparent;
                     transition: background-color var(--tr-fast); }
    .pane-resizer:hover, .pane-resizer.dragging { background: var(--accent); }

    .lib-pane   { flex: 1 1 auto; min-width: 300px; display: flex; flex-direction: column; overflow: hidden; }

    /* ---- the tree: Library (songs, albums, artists, folders) and the
       playlists. Its rows are the shared tree (.ntree.tree-fit, app.css); on a
       phone it slides in from #treeBtn (the shared .tree-sheet). ---------- */
    .tree-pane  { flex: 0 0 auto; width: 210px; overflow: auto; padding: 14px 6px 16px;
                  border-right: 1px solid var(--line); }
    #treeBtn    { display: none; }
    .view-head  { margin: 0 0 12px; }

    .lib-content{ flex: 1 1 auto; overflow-y: auto; padding: 18px 20px 28px; }

    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    /* The album and artist cards are the shared .media-card (app.css). */
    .album-art  { width: 100%; aspect-ratio: 1; border-radius: var(--radius-s);
                  display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); }
    .album-art svg { width: 32%; height: 32%; }

    .artist-grid  { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .artist-card  { align-items: center; text-align: center; padding: 18px 10px; }
    .artist-avatar{ width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center;
                     justify-content: center; font-size: 1.3rem; font-weight: 700; color: rgba(255,255,255,.92); }

    .scope-bar  { display: flex; align-items: center; margin: 18px 0 12px; }

    /* "Show more" is the shared .text-btn.ghost, full width. */
    .show-more { width: 100%; margin: 10px 0 4px; }

    /* ---- library rows: one song (a shared .card-row), real drag source;
       a tap on its body plays it ------------------------------------------ */
    .song-row { padding: 8px 10px; margin-bottom: 6px; cursor: default; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .song-row.is-playing { border-color: color-mix(in srgb, var(--accent) 55%, transparent);
                            background: color-mix(in srgb, var(--accent) 10%, var(--card2)); }
    .song-row.is-playing .song-title { color: var(--accent); }
    /* Picked (shared/browser.js): the shared accent fill, over "playing" too. */
    .song-row.is-selected { background: var(--accent); border-color: var(--accent); }
    .song-row.is-selected :is(.song-title, .song-sub, .song-dur) { color: var(--on-accent); }
    /* A playlist's song that is no longer in the library. */
    .song-row.is-missing .song-art   { background: var(--line) !important; }
    .song-row.is-missing .song-title { color: var(--text-dim); }
    .song-art  { flex: 0 0 auto; width: 38px; height: 38px; border-radius: var(--radius-s);
                 display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); }
    .song-art svg { width: 18px; height: 18px; }
    .song-meta { flex: 1 1 auto; min-width: 0; }
    .song-title{ font-size: 0.88rem; font-weight: 600; color: var(--text);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-sub  { font-size: 0.76rem; color: var(--text-dim); margin-top: 1px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-dur  { flex: 0 0 auto; font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); width: 38px; text-align: right; }

    /* ---- queue pane --------------------------------------------------- */
    .queue-pane { flex: 0 0 auto; display: flex; flex-direction: column; min-width: 260px; max-width: 560px;
                  background: var(--bg); border-left: 1px solid var(--line); overflow: hidden; }
    .queue-header{ flex: 0 0 auto; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
    .queue-title-row{ margin-bottom: 12px; }
    .queue-title-row h2 { margin: 0; font-size: 1.02rem; font-weight: 700; color: var(--text); }
    .queue-mode-row  { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mode-pills      { display: flex; gap: 6px; }
    .queue-actions   { display: flex; align-items: center; gap: 4px; }

    .queue-list  { flex: 1 1 auto; overflow-y: auto; padding: 12px; }
    .queue-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
                   padding: 56px 24px; color: var(--text-faint); text-align: center; }
    .queue-empty svg { width: 30px; height: 30px; opacity: .5; }
    .queue-empty p   { margin: 0; font-size: 0.84rem; }
    .queue-tail  { height: 26px; }

    .queue-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px;
                 background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-m);
                 cursor: grab; transition: border-color var(--tr-fast), background-color var(--tr-fast); }
    .queue-row:hover  { border-color: color-mix(in srgb, var(--text) 22%, transparent); }
    .queue-row:active { cursor: grabbing; }
    .queue-row.is-playing { border-color: color-mix(in srgb, var(--accent) 55%, transparent);
                             background: color-mix(in srgb, var(--accent) 10%, var(--card2)); }
    .queue-row.is-playing .queue-title { color: var(--accent); }
    .queue-row.drag-over { box-shadow: inset 0 2px 0 var(--accent); }
    .queue-indicator { flex: 0 0 auto; width: 16px; color: var(--text-faint); display: flex; align-items: center; }
    .queue-indicator svg { width: 14px; height: 16px; display: block; }
    .eq  { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
    .eq span { width: 3px; background: var(--accent); border-radius: 1px; animation: eqBounce .9s ease-in-out infinite; transform-origin: bottom; }
    .eq span:nth-child(1) { height: 40%; animation-delay: 0s; }
    .eq span:nth-child(2) { height: 100%; animation-delay: .15s; }
    .eq span:nth-child(3) { height: 65%; animation-delay: .3s; }
    @keyframes eqBounce { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .eq span { animation: none; } }   /* still bars */
    .queue-art { flex: 0 0 auto; width: 36px; height: 36px; border-radius: var(--radius-s); border: none;
                 display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); cursor: pointer; padding: 0; }
    .queue-art svg { width: 17px; height: 17px; }
    .queue-meta{ flex: 1 1 auto; min-width: 0; }
    .queue-title{ font-size: 0.86rem; font-weight: 600; color: var(--text);
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-sub { font-size: 0.74rem; color: var(--text-dim); margin-top: 1px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-dur { flex: 0 0 auto; font-size: 0.74rem; color: var(--text-dim); }

    /* ---- player bar: the shared MEDIA VIEWER block (shared/app.css).
       Only the album cover and the "what is playing" column are Music's. ---- */
    .player-now     { width: 270px; }
    .player-art     { width: 48px; height: 48px; border-radius: var(--radius-s); }
    .player-art svg { width: 22px; height: 22px; }

    /* The queue as a sheet on a phone (openQueueSheet): the same pane, flat. */
    .queue-open-btn { display: none; }
    .queue-sheet .queue-pane { display: flex; min-width: 0; max-width: none; border-left: 0; background: none;
                               width: auto !important; flex-basis: auto !important; }   /* over the resizer's inline width */
    .queue-sheet .queue-header { padding: 0 36px 12px 0; }
    .queue-sheet .queue-list   { padding: 12px 0 0; overflow: visible; }
    .queue-sheet .queue-row    { cursor: pointer; }

    @media (max-width: 640px)
    {
        #treeBtn { display: inline-flex; }
        .tree-pane:not(.tree-sheet) { display: none; }     /* until the tree is made (boot) */
    }

    @media (max-width: 760px)
    {
        #mainRow > .queue-pane, .pane-resizer { display: none; }
        .queue-open-btn             { display: inline-flex; }
        .lib-pane                   { min-width: 0; }   /* the 420px floor made the page 551px wide on a phone */
        .volume-block { display: none; }
        #outBtn       { order: 4; }
        /* Player bar in two rows: cover + title + transport, then the seek bar
           full width underneath (one row clipped the "next" button off-screen). */
        .player-bar  { flex-wrap: wrap; gap: 8px 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
        .player-now  { flex: 1 1 0; min-width: 0; width: auto; }
        .seek-block  { flex: 1 0 100%; order: 5; min-width: 0; }
        .time-label  { width: auto; }
    }
    </style>
</head>
<body>
<div class="app">

    <header class="topbar">
        <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <h1>Music</h1>
        <!-- The toolbar, shown once a folder is open (display: contents). -->
        <div class="tb-tools" id="tools" hidden>
            <button class="icon-btn has-popup" id="folderInfoBtn" type="button" data-rank="22" aria-haspopup="menu" aria-expanded="false" data-i18n-attr="title:ui.folderInfo, aria-label:ui.folderInfo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="10.5" x2="12.01" y2="10.5"/><line x1="12" y1="13.5" x2="12" y2="17.5"/></svg>
            </button>

            <!-- Phones only (<= 640 px): the tree (library + playlists) slides in. -->
            <button class="icon-btn" id="treeBtn" type="button" data-rank="23" data-i18n-attr="title:music.library, aria-label:music.library">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
            </button>
        </div>
        <div class="topbar-actions">
            <!-- The selection's buttons (shared/browser.js): only while something is picked. -->
            <div id="selActions" class="tb-group" hidden></div>
            <!-- Like #tools, shown once a folder is open. -->
            <div class="tb-group" data-tools hidden>
                <div class="search-wrap">
                    <input type="search" class="topbar-search" id="searchInput" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:music.searchPh">
                </div>
                <button class="icon-btn" id="searchToggle" type="button" data-rank="20" data-i18n-attr="title:ui.search, aria-label:ui.search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <!-- Phones only (<= 760 px): the queue has no pane there, it opens as a sheet. -->
                <button class="icon-btn queue-open-btn" id="queueBtn" type="button" data-rank="24" data-i18n-attr="title:music.openQueue, aria-label:music.openQueue">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="11" y2="18"/><path d="M17 18V9l4-1"/><circle cx="15.5" cy="18" r="1.5"/></svg>
                </button>
                <button class="icon-btn" id="reloadBtn" data-rank="25" data-i18n-attr="title:ui.rescanFolder, aria-label:ui.rescanFolder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
            </div>
            <div class="tb-group tb-sys" data-tools hidden>
                <button class="icon-btn" data-intro-open data-rank="31" type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </button>
            </div>
            <div class="sync-indicator synced" data-i18n-attr="title:ui.sync.synced"></div>
        </div>
    </header>

    <!-- The folder-? button's menu: the folder (tap = change it), then the counts. -->
    <div class="top-menu folder-menu" id="folderMenu" role="menu" hidden>
        <button class="menu-item" id="crumb" type="button" role="menuitem" data-i18n-attr="title:ui.changeFolder, aria-label:ui.changeFolder"></button>
        <div class="menu-info" id="subStrip"></div>
    </div>

    <div class="main-row" id="mainRow" hidden>

        <!-- The tree: Library and the playlists (NayiveUI.tree, see TREE below). -->
        <nav class="tree-pane" id="treePane" data-i18n-attr="aria-label:music.library"><div id="tree" class="tree-fit"></div></nav>

        <div class="lib-pane">
            <div class="lib-content" id="libContent"></div>
        </div>

        <div class="pane-resizer" id="paneResizer" data-i18n-attr="title:ui.dragResize"></div>

        <div class="queue-pane" id="queuePane">
            <div class="queue-header">
                <div class="queue-title-row"><h2 data-i18n="music.queue"></h2></div>
                <div class="queue-mode-row">
                    <div class="mode-pills">
                        <button class="icon-btn is-active" id="seqBtn" data-i18n-attr="title:music.playSeq, aria-label:music.playSeq">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
                        </button>
                        <button class="icon-btn" id="shuffleBtn" data-i18n-attr="title:music.playShuffle, aria-label:music.playShuffle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                        </button>
                        <!-- Off: the queue stops after its last song. On: it starts again. -->
                        <button class="icon-btn" id="repeatBtn" type="button" aria-pressed="false" data-i18n-attr="title:music.repeat, aria-label:music.repeat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                        </button>
                    </div>
                    <div class="queue-actions">
                        <button class="icon-btn" id="saveListBtn" disabled data-i18n-attr="title:music.saveQueue, aria-label:music.saveQueue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h11l3 3v11H5V5Z"/><path d="M8 5v5h7V5"/><path d="M8 14h8"/></svg>
                        </button>
                        <button class="icon-btn danger" id="clearQueueBtn" disabled data-i18n-attr="title:music.clearQueue, aria-label:music.clearQueue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="queueList"></div>
        </div>

    </div>

    <div class="empty-hint" id="noDirHint" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <p data-i18n="music.needFolder"></p>
        <a class="text-btn" href="../drive/index.html" data-i18n="ui.openDrive"></a>
    </div>

    <div class="player-bar" id="playerBar" hidden>
        <div class="player-now">
            <span class="player-art" id="playerArt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </span>
            <span class="player-meta">
                <div class="player-title" id="playerTitle" data-i18n="music.nothingPlaying"></div>
                <div class="player-sub" id="playerSub" data-i18n="music.pickSong"></div>
            </span>
        </div>

        <div class="transport">
            <button class="transport-btn" id="prevBtn" disabled data-i18n-attr="title:ui.prev, aria-label:ui.prev">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 20 9 12l10-8v16Z"/><rect x="4.5" y="4" width="2" height="16" rx="1"/></svg>
            </button>

                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" id="playIcon"><path d="M8 5v14l11-7-11-7Z"/></svg>
            </button>

                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 4l10 8-10 8V4Z"/><rect x="17.5" y="4" width="2" height="16" rx="1"/></svg>
            </button>

        <div class="seek-block">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
            <input type="range" id="volumeRange" min="0" max="100" value="80">

        <!-- Play on: a paired speaker (setSinkId) or Cast / AirPlay (Remote
             Playback). Shown only when the browser has one of the two. -->
        <button class="icon-btn has-popup" id="outBtn" type="button" hidden aria-haspopup="menu" aria-expanded="false" data-i18n-attr="title:media.outBtn, aria-label:media.outBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="14" r="4"/><circle cx="12" cy="6" r="1"/></svg>
        </button>

    <audio id="player" preload="metadata"></audio>

    <!-- QUEUE SHEET (phones): #queuePane is moved in here by openQueueSheet().
         Before the playlist sheets, so theirs open on top of it. -->

    <!-- SAVE PLAYLIST SHEET - also names a new playlist and renames one
         (openNameSheet): the same name field. -------------------------------- -->
    <div class="sheet-backdrop" id="saveBackdrop">
        <div class="sheet">
            <h2 id="saveTitle" data-i18n="music.saveList"></h2>

                <input id="playlistName" type="text" autocomplete="off" data-i18n-attr="placeholder:music.listNamePh">
            </div>
            <div class="sheet-actions">
                <button data-act="close" id="saveCancelBtn" data-i18n-attr="title:ui.cancel"></button>
                <button data-act="primary" id="saveConfirmBtn" data-i18n-attr="title:ui.save"></button>

    <div id="toast" class="toast"></div>

<script src="../shared/media.js"></script>
<script src="../shared/play-on.js"></script>
<script>
"use strict";

var $  = function ( s ) { return document.querySelector( s ); };
var $$ = function ( s ) { return Array.prototype.slice.call( document.querySelectorAll( s ) ); };

var PARAMS = new URLSearchParams( location.search );
var DIR    = ( function () { var d = PARAMS.get( "dir" ); return d ? d.replace( /\/+$/, "" ) : null; } )();

// No ?dir= means we were opened from the launcher, not from Drive: DIR is filled
// in from data/music/config.json (or the folder picker) in boot().

var PLAYLISTS_PATH = "data/music/playlists.json";
var SCAN_PATH      = "data/music/scan-cache.json";
var AUDIO_EXT = [ "mp3", "m4a", "aac", "ogg", "oga", "opus", "wav", "flac", "weba" ];

// The helpers shared with Photos / Movies live in shared/media.js (one copy).
var esc = NayiveMedia.esc, cssEsc = NayiveMedia.cssEsc, extOf = NayiveMedia.extOf, colorFor = NayiveMedia.colorFor,
    stripExt = NayiveMedia.stripExt,
    fmtClock = NayiveMedia.fmtClock, FOLDER_SVG = NayiveMedia.ICONS.folder;

/* ---------------------------------------------------------------------------
 * STATE
 * -------------------------------------------------------------------------*/
var st = {
    songs: [],              // every scanned audio file: {path, dirPath, title, artist, album, track, color, duration, durationKnown}
    folderTree: null,       // the recursive {path, nodes} scan result, rooted at DIR
    filter: "songs",        // songs | albums | artists | folders | playlist (the tree's node)
    playlistId: null,       // the playlist shown (filter "playlist")
    search: "",
    selectedAlbum: null,    // "artist‡album" key
    selectedArtist: null,
    selectedFolder: null,   // a folder path
    queue: [],              // songs currently queued, by reference to entries in st.songs
    playingIndex: -1,       // index into st.queue
    seekOnLoad: 0,          // seconds to jump to once the new src loads (an Undo resuming a song)
    shuffle: false,
    repeat: false,          // at the end of the queue: stop (false) or start again (true); per device
    played: new Set(),      // shuffle: queue entries already played this round (none repeats before all have)
    history: [],            // shuffle: entries played before the current one, for "previous"
    playlists: [],          // [{id, name, paths:[...]}]
    playlistsBlocked: "",   // "unread" / "bad": not read at start-up (every change reads the file again)
    dragPayload: null       // { type:'library', songs } | { type:'queue', index }
};

var audio = $( "#player" );

// data/music/scan-cache.json: path -> { size, mtime, title, artist, album,
// track, duration, tagRead }. Read by applyCache(), topped up by refineTags()
// / loadDurations() as they read files (shared/media.js scanCache).
var SCAN_CACHE = NayiveMedia.scanCache( SCAN_PATH );

// What a pass reads goes into SCAN_CACHE.set() (shared/media.js), which
// never writes a cache that could not be read and saves in batches;
// SCAN_CACHE.flush() writes the rest at the end of a pass, only when
// something was set since.

// Every scan() takes a new number; the tag and length readers of an older pass
// (a Rescan while they still run) see it and stop.
var scanGen = 0;

// The "Canciones" list is built one page at a time - a whole library at once
// is a lot of DOM and refineTags() re-renders it on nearly every frame while
// it scans. listShown grows as you scroll (see wireLibraryRows); it resets
// whenever the filter or the search text changes.
var LIST_PAGE = 250;
var listShown = LIST_PAGE;

/* ---------------------------------------------------------------------------
 * SCAN - walk the recursive tree the server returns and flatten it into
 * st.songs, deriving a first-guess title/artist/album from the path. ID3
 * tags for .mp3 files are read afterwards, in the background, and override
 * the guess as each one resolves (see refineTags()).
 * -------------------------------------------------------------------------*/
function deriveFromPath( fullPath )
{
    var rel = fullPath.slice( DIR.length ).replace( /^\/+/, "" );
    var segs = rel.split( "/" );
    var filename = segs[ segs.length - 1 ];
    var folders  = segs.slice( 0, -1 );

    var title = stripExt( filename );
    var track = null;
    var mTrack = /^\s*(\d{1,3})[\s._-]+(.*)$/.exec( title );
    if( mTrack ) { track = parseInt( mTrack[ 1 ], 10 ); title = mTrack[ 2 ]; }

    var artist = null, album = null;
    if( folders.length >= 2 )
    {
        artist = folders[ folders.length - 2 ];
        album  = folders[ folders.length - 1 ];
    }
    else if( folders.length === 1 )
    {
        album = folders[ 0 ];
        var mAA = /^(.+?)\s*-\s*(.+)$/.exec( album );
        if( mAA ) { artist = mAA[ 1 ]; album = mAA[ 2 ]; }
    }
    if( ! artist )
    {
        var mTA = /^(.+?)\s*-\s*(.+)$/.exec( title );
        if( mTA ) { artist = mTA[ 1 ].trim(); title = mTA[ 2 ].trim(); }
    }

    return {
        title:  title.trim() || filename,
        artist: artist ? artist.trim() : null,
        album:  album ? album.trim() : null,
        track:  track,
        folder: folders.join( "/" )
    };
}

async function scan()
{
    var gen = ++scanGen;
    setLibMsg( NayiveUI.t( 'music.scanning' ) );
    var tree = await NayiveMedia.loadFolderTree( DIR, setLibMsg, true );
    if( ! tree || gen !== scanGen ) return;
    st.folderTree = { path: DIR, nodes: tree.nodes };

    var files = NayiveMedia.flattenFiles( st.folderTree, AUDIO_EXT );

    st.songs = files.map( function ( f )
    {
        var d = deriveFromPath( f.path );
        return {
            path: f.path, size: f.size, mtime: f.mtime,
            title: d.title, artist: d.artist, album: d.album, track: d.track, folder: d.folder,
            color: colorFor( ( d.artist || "" ) + "‡" + ( d.album || d.folder || "" ) ),
            duration: null, tagRead: false
        };
    } );
    st.songs.sort( songCmp );

    await applyCache();          // reuse tags + durations read on a previous open
    if( gen !== scanGen ) return;

    // The queue still holds the last pass's song objects: point each row at
    // this pass's object for the same file (one gone since keeps its old one).
    var byPath = {};
    st.songs.forEach( function ( s ) { byPath[ s.path ] = s; } );
    st.queue.forEach( function ( e ) { e.song = byPath[ e.song.path ] || e.song; } );

    renderCollectionSummary();
    renderLibrary();
    if( treeView ) treeView.render();      // the folders, scanned again
    renderQueueList();
    updatePlayerBar();
    refineTags( gen );
    loadDurations( gen );
}

function songCmp( a, b )
{
    return ( a.artist || "" ).localeCompare( b.artist || "" ) ||
           ( a.album  || "" ).localeCompare( b.album  || "" ) ||
           ( ( a.track || 999 ) - ( b.track || 999 ) ) ||
           a.title.localeCompare( b.title );
}

/* ---------------------------------------------------------------------------
 * SCAN CACHE  (data/music/scan-cache.json)
 *
 * ID3 tags and track lengths each cost a network round-trip per file. For a
 * library of a thousand songs that is a slow, wasteful thing to redo on every
 * open, so the results are remembered here keyed by path, alongside the file's
 * size + mtime. A song that still matches its cached entry is taken as-is;
 * refineTags()/loadDurations() only touch the rest. Entries for files no
 * longer in the library are dropped on save - applyCache() sweeps them every
 * open, and Drive re-keys / drops them on a move / rename / trash too.
 * -------------------------------------------------------------------------*/
async function applyCache()
{
    await SCAN_CACHE.load();

    st.songs.forEach( function ( s )
    {
        var hit = SCAN_CACHE.hit( s );
        if( ! hit ) return;
        if( hit.title  ) s.title  = hit.title;
        if( hit.artist ) s.artist = hit.artist;
        if( hit.album  ) s.album  = hit.album;
        if( hit.track != null ) s.track = hit.track;
        if( hit.duration != null ) s.duration = hit.duration;
        s.color   = colorFor( ( s.artist || "" ) + "‡" + ( s.album || s.folder || "" ) );
        // an mp3 is only "done" once its tags were actually read; other formats
        // never get an ID3 pass, so a size/mtime match is all they need.
        s.tagRead = hit.tagRead === true || extOf( s.path ) !== "mp3";
    } );

    st.songs.sort( songCmp );   // cached tags may have changed artist/album/track

    // A song gone from the library (deleted, or moved out) leaves a dead entry.
    // refineTags()/loadDurations() may both do nothing this open (all cached),
    // so sweep here: drop the orphans and rewrite the file.
    // Only entries under DIR can be judged from its listing: the library of
    // another folder (Music opened on it from Drive) keeps its own.
    if( SCAN_CACHE.prune( new Set( st.songs.map( function ( s ) { return s.path; } ) ),
                          function ( k ) { return k.indexOf( DIR + "/" ) === 0; } ) )
        SCAN_CACHE.save();
}

/* ---------------------------------------------------------------------------
 * ID3v2 TAGS - a small Range read of the file's start, same trick Photos uses
 * for EXIF. Text frames only (TIT2/TPE1/TALB/TRCK); v2.2/2.3/2.4. Anything
 * that fails (not an mp3, no tag, a shape we don't parse) just keeps the
 * filename-derived guess.
 *
 * The first 64 KB hold the text frames of nearly every file. A frame that
 * runs past what was read - a cover picture, most often - is stepped over:
 * the read goes on AFTER it, up to the size the tag's header declares, so the
 * title / artist behind a big cover still come in and the picture itself is
 * never downloaded. A few reads per file at most.
 * -------------------------------------------------------------------------*/
var ID3_CHUNK = 65536;

// `len` bytes of the file at `url` from byte `off`. Only a real partial answer
// (206) will do past the start: a server that sent the whole file instead
// would put every later byte at the wrong offset.
async function rangeRead( url, off, len )
{
    var r = await fetch( url, { credentials: "same-origin", headers: { Range: "bytes=" + off + "-" + ( off + len - 1 ) } } );
    if( r.status !== 206 && ! ( r.ok && off === 0 ) ) throw new Error( "HTTP " + r.status );
    return new Uint8Array( await r.arrayBuffer() );
}

function syncSafeOrPlain( b, off, syncsafe )
{
    if( syncsafe )
        return ( ( b[ off ] & 0x7f ) << 21 ) | ( ( b[ off + 1 ] & 0x7f ) << 14 ) |
               ( ( b[ off + 2 ] & 0x7f ) << 7 ) | ( b[ off + 3 ] & 0x7f );
    return ( b[ off ] << 24 ) | ( b[ off + 1 ] << 16 ) | ( b[ off + 2 ] << 8 ) | b[ off + 3 ];
}

function decodeId3Text( bytes )
{
    if( ! bytes || ! bytes.length ) return "";
    var enc = bytes[ 0 ];
    var body = bytes.subarray( 1 );
    try
    {
        var out;
        if( enc === 0 )      out = new TextDecoder( "iso-8859-1" ).decode( body );
        else if( enc === 3 ) out = new TextDecoder( "utf-8" ).decode( body );
        else
        {
            var be = enc === 2;
            var start = 0;
            if( body.length >= 2 && body[ 0 ] === 0xff && body[ 1 ] === 0xfe ) { be = false; start = 2; }
            else if( body.length >= 2 && body[ 0 ] === 0xfe && body[ 1 ] === 0xff ) { be = true;  start = 2; }
            out = new TextDecoder( be ? "utf-16be" : "utf-16le" ).decode( body.subarray( start ) );
        }
        return out.replace( /\u0000+$/, "" ).trim();
    }
    catch( e ) { return ""; }
}

// The song's tag, or null when it has none. Throws when the file cannot be read.
async function readId3( url )
{
    var buf  = await rangeRead( url, 0, ID3_CHUNK );    // buf holds the file's bytes from `base` on
    var base = 0, reads = 1;
    if( buf.length < 10 || buf[ 0 ] !== 0x49 || buf[ 1 ] !== 0x44 || buf[ 2 ] !== 0x33 ) return null;
    var verMajor  = buf[ 3 ];
    var end       = syncSafeOrPlain( buf, 6, true ) + 10;     // the whole tag, its header included
    var idLen     = verMajor === 2 ? 3 : 4;
    var headerLen = verMajor === 2 ? 6 : 10;
    var want      = verMajor === 2 ? [ "TT2", "TP1", "TAL", "TRK" ] : [ "TIT2", "TPE1", "TALB", "TRCK" ];
    var frames = {}, found = 0;
    var pos = 10;

    // v2.3 / v2.4 may put an extended header first (flag 0x40): step over it.
    // Its size counts itself in v2.4, not in v2.3.
    if( verMajor >= 3 && ( buf[ 5 ] & 0x40 ) && buf.length >= 14 )
        pos = verMajor === 4 ? 10 + syncSafeOrPlain( buf, 10, true ) : 14 + syncSafeOrPlain( buf, 10, false );

    // Bytes [off, off + len) at hand, reading the stretch of the file that
    // holds them when they are not. False when that fails or takes too many reads.
    async function have( off, len )
    {
        if( off >= base && off + len <= base + buf.length ) return true;
        if( ++reads > 5 ) return false;
        try { buf = await rangeRead( url, off, Math.max( ID3_CHUNK, len ) ); base = off; }
        catch( e ) { return false; }
        return off + len <= base + buf.length;
    }

    while( found < want.length && pos + headerLen <= end )
    {
        if( ! await have( pos, headerLen ) ) break;
        var o = pos - base, id = "";
        for( var i = 0; i < idLen; i++ )
        {
            var c = buf[ o + i ];
            if( c === 0 ) break;
            id += String.fromCharCode( c );
        }
        if( ! id ) break;                               // the padding: no more frames

        var size;
        if( verMajor === 2 ) size = ( buf[ o + 3 ] << 16 ) | ( buf[ o + 4 ] << 8 ) | buf[ o + 5 ];
        else                 size = syncSafeOrPlain( buf, o + 4, verMajor === 4 );
        if( size <= 0 || pos + headerLen + size > end ) break;

        if( want.indexOf( id ) !== -1 && ! frames[ id ] )
        {
            if( ! await have( pos + headerLen, size ) ) break;
            frames[ id ] = buf.slice( pos + headerLen - base, pos + headerLen + size - base );
            found++;
        }
        pos += headerLen + size;                        // any other frame (a cover) is only stepped over
    }

    function text( v2, v3 ) { var d = frames[ verMajor === 2 ? v2 : v3 ]; return d ? decodeId3Text( d ) : ""; }
    return {
        title:  text( "TT2", "TIT2" ),
        artist: text( "TP1", "TPE1" ),
        album:  text( "TAL", "TALB" ),
        track:  text( "TRK", "TRCK" )
    };
}

// Tags read change only the rows of those songs: they are patched in place,
// once per frame, and the library is re-sorted and drawn again once at the end
// (a repaint per tag rebuilt the whole list hundreds of times).
async function refineTags( gen )
{
    var mp3s = st.songs.filter( function ( s ) { return extOf( s.path ) === "mp3" && ! s.tagRead; } );
    if( ! mp3s.length ) return;
    var CONCURRENCY = 4, next = 0, changed = new Set();

    function schedulePatch( song )
    {
        if( ! changed.size ) requestAnimationFrame( function ()
        {
            changed.forEach( patchSongRows );
            changed.clear();
        } );
        changed.add( song );
    }

    async function worker()
    {
        while( next < mp3s.length && gen === scanGen )
        {
            var song = mp3s[ next++ ];
            try
            {
                var tag = await readId3( GumApi.fileUrl( song.path ) );
                if( tag )
                {
                    if( tag.title  ) song.title  = tag.title;
                    if( tag.artist ) song.artist = tag.artist;
                    if( tag.album  ) song.album  = tag.album;
                    if( tag.track  ) { var n = parseInt( tag.track, 10 ); if( ! isNaN( n ) ) song.track = n; }
                    song.color = colorFor( ( song.artist || "" ) + "‡" + ( song.album || song.folder || "" ) );
                }
            }
            catch( e ) { /* keep the filename guess */ }
            if( gen !== scanGen ) return;               // a Rescan replaced this pass
            song.tagRead = true;
            SCAN_CACHE.set( song, {
                tagRead: true, title: song.title, artist: song.artist,
                album: song.album, track: song.track
            } );
            schedulePatch( song );
        }
    }
    var workers = [];
    for( var i = 0; i < CONCURRENCY; i++ ) workers.push( worker() );
    await Promise.all( workers );
    if( gen !== scanGen ) return;

    SCAN_CACHE.flush();
    // The tags may have moved songs to another artist / album / track number:
    // one re-sort and one full draw now.
    st.songs.sort( songCmp );
    renderCollectionSummary();
    renderLibrary();
    renderQueueList();
    updatePlayerBar();
}

// A song's tags came in: its rows (library and queue) and the player bar show
// them, without rebuilding the lists.
function patchSongRows( song )
{
    var sub = ( song.artist || NayiveUI.t( 'music.unknownArtist' ) ) + ' · ' + ( song.album || NayiveUI.t( 'music.unknownAlbum' ) );
    $$( '.song-row[data-path="' + cssEsc( song.path ) + '"]' ).forEach( function ( row )
    {
        row.querySelector( ".song-title" ).textContent = song.title;
        row.querySelector( ".song-sub" ).textContent   = sub;
        row.querySelector( ".song-art" ).style.background = song.color;
    } );
    st.queue.forEach( function ( e, i )
    {
        if( e.song !== song ) return;
        var row = $( '.queue-row[data-index="' + i + '"]' );
        if( ! row ) return;
        row.querySelector( ".queue-title" ).textContent = song.title;
        row.querySelector( ".queue-sub" ).textContent   = song.artist || NayiveUI.t( 'music.unknownArtist' );
        row.querySelector( ".queue-art" ).style.background = song.color;
    } );
    var cur = st.queue[ st.playingIndex ];
    if( cur && cur.song === song ) updatePlayerBar();
}

// Real duration via a throwaway Audio() + preload=metadata (cheap: the server
// supports Range, so the browser only pulls enough to read the header, not
// the whole file). Small batches so a big folder doesn't open 200 connections
// at once.
async function loadDurations( gen )
{
    var pending = st.songs.filter( function ( s ) { return s.duration == null; } );
    if( ! pending.length ) return;
    await NayiveMedia.pool( pending, 4, async function ( song )
    {
        if( gen !== scanGen ) return;               // a Rescan replaced this pass
        var d = await NayiveMedia.probeDuration( "audio", GumApi.fileUrl( song.path ) );
        if( d == null || gen !== scanGen ) return;
        song.duration = d;
        SCAN_CACHE.set( song, { duration: d } );
        renderLibraryDuration( song );
        renderQueueDuration( song );
    } );
    if( gen === scanGen ) SCAN_CACHE.flush();   // final flush once everything is probed
}

/* ---------------------------------------------------------------------------
 * DERIVED GROUPINGS - recomputed on demand from st.songs' current metadata
 * (cheap for a personal library; keeps albums/artists correct as ID3 tags
 * refine the filename guess).
 * -------------------------------------------------------------------------*/
function albumKey( s ) { return ( s.artist || "" ) + "‡" + ( s.album || s.folder || "" ); }

// `songs`: the songs to group (default: the whole library).
function computeAlbums( songs )
{
    var map = {};
    ( songs || st.songs ).forEach( function ( s )
    {
        var key = albumKey( s );
        if( ! map[ key ] ) map[ key ] = {
            key: key, title: s.album || NayiveUI.t( 'music.unknownAlbum' ),
            artist: s.artist || NayiveUI.t( 'music.unknownArtist' ), color: s.color, count: 0
        };
        map[ key ].count++;
    } );
    return Object.keys( map ).map( function ( k ) { return map[ k ]; } )
        .sort( function ( a, b ) { return a.artist.localeCompare( b.artist, NayiveUI.lang() ) || a.title.localeCompare( b.title, NayiveUI.lang() ); } );
}

function computeArtists( songs )
{
    var map = {};
    ( songs || st.songs ).forEach( function ( s )
    {
        var name = s.artist || NayiveUI.t( 'music.unknownArtist' );
        if( ! map[ name ] ) map[ name ] = { name: name, songCount: 0, albums: {}, color: colorFor( name ) };
        map[ name ].songCount++;
        map[ name ].albums[ s.album || s.folder || "" ] = true;
    } );
    return Object.keys( map ).map( function ( k )
    {
        var a = map[ k ];
        return { name: a.name, songCount: a.songCount, albumCount: Object.keys( a.albums ).length, color: a.color };
    } ).sort( function ( a, b ) { return a.name.localeCompare( b.name, NayiveUI.lang() ); } );
}

/* ---------------------------------------------------------------------------
 * RENDER - LIBRARY
 * -------------------------------------------------------------------------*/
var MUSIC_NOTE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
var GRIP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>';

// One song: a row of the shared item browser (BROWSER below), which adds
// the tick before it. `s.missing`: a playlist's song that
// is no longer in the library (a stub, see playlistSongs).
function songRowHtml( s )
{
    var cur = st.queue[ st.playingIndex ];
    var playing = !! cur && cur.song === s;
    var sub = s.missing ? NayiveUI.t( 'music.notFound' )
            : ( s.artist || NayiveUI.t( 'music.unknownArtist' ) ) + ' · ' + ( s.album || NayiveUI.t( 'music.unknownAlbum' ) );
    return '<div class="card-row song-row' + ( playing ? ' is-playing' : '' ) + ( s.missing ? ' is-missing' : '' ) + '" data-path="' + esc( s.path ) + '">' +
        '<span class="song-art" style="background:' + s.color + '">' + MUSIC_NOTE_SVG + '</span>' +
        '<span class="song-meta">' +
            '<div class="song-title">' + esc( s.title ) + '</div>' +
            '<div class="song-sub">' + esc( sub ) + '</div>' +
        '</span>' +
        '<span class="song-dur">' + ( s.missing ? "" : s.duration != null ? fmtClock( s.duration ) : "…" ) + '</span>' +
    '</div>';
}

function songListHtml( list, windowed )
{
    if( ! list.length ) return '<div class="empty-hint"><p data-i18n="music.noMatch"></p></div>';
    if( windowed && list.length > listShown )
        return list.slice( 0, listShown ).map( songRowHtml ).join( "" ) +
            '<button class="text-btn ghost show-more" id="showMoreBtn">' +
            esc( NayiveUI.tf( "music.showMore", { n: list.length - listShown } ) ) + '</button>';
    return list.map( songRowHtml ).join( "" );
}

var scopeBarHtml = NayiveMedia.scopeBarHtml;

function renderCollectionSummary()
{
    var albums  = computeAlbums().length;
    var artists = computeArtists().length;
    $( "#subStrip" ).textContent = NayiveUI.tf( "music.libraryCounts", { songs: st.songs.length, albums: albums, artists: artists } );
    setCrumb();
}

function setLibMsg( text )
{
    $( "#libContent" ).innerHTML = '<div class="empty-hint"><p>' + esc( text ) + '</p></div>';
}

function renderLibrary()
{
    var host = $( "#libContent" );
    var html = "";

    // The search box filters every view: the songs, and the albums / artists /
    // folder songs made of the songs it matches.
    var q = st.search.trim().toLowerCase();
    var pool = ! q ? st.songs : st.songs.filter( function ( s )
    { return ( s.title + " " + ( s.artist || "" ) + " " + ( s.album || "" ) ).toLowerCase().indexOf( q ) !== -1; } );
    NayiveMedia.searchCount( pool.length, st.songs.length );

    if( st.filter === "songs" )
    {
        html = songListHtml( pool, true );
    }
    else if( st.filter === "albums" )
    {
        var albums = computeAlbums( pool );
        html += '<div class="album-grid">' + albums.map( function ( a )
        {
            var active = st.selectedAlbum === a.key;
            return '<button class="album-card media-card' + ( active ? ' is-active' : '' ) + '" data-album="' + esc( a.key ) + '">' +
                '<span class="album-art" style="background:' + a.color + '">' + MUSIC_NOTE_SVG + '</span>' +
                '<span class="album-card-title media-card-title">' + esc( a.title ) + '</span>' +
                '<span class="album-card-sub media-card-sub">' + esc( a.artist ) + ' · ' + a.count + '</span></button>';
        } ).join( "" ) + '</div>';
        if( st.selectedAlbum )
        {
            var picked = albums.filter( function ( a ) { return a.key === st.selectedAlbum; } )[ 0 ];
            var songs = pool.filter( function ( s ) { return albumKey( s ) === st.selectedAlbum; } );
            html += scopeBarHtml( picked ? picked.title + " · " + picked.artist : "" ) + songListHtml( songs, true );
        }
        else html += '<div class="empty-hint">' + MUSIC_NOTE_SVG + '<p data-i18n="music.pickAlbum"></p></div>';
    }
    else if( st.filter === "artists" )
    {
        var artists = computeArtists( pool );
        html += '<div class="artist-grid">' + artists.map( function ( a )
        {
            var active = st.selectedArtist === a.name;
            return '<button class="artist-card media-card' + ( active ? ' is-active' : '' ) + '" data-artist="' + esc( a.name ) + '">' +
                '<span class="artist-avatar" style="background:' + a.color + '">' + esc( a.name.charAt( 0 ).toUpperCase() ) + '</span>' +
                '<span class="artist-name media-card-title">' + esc( a.name ) + '</span>' +
                '<span class="artist-meta media-card-sub">' + esc( NayiveUI.tf( "music.artistCounts", { albums: a.albumCount, songs: a.songCount } ) ) + '</span></button>';
        } ).join( "" ) + '</div>';
        if( st.selectedArtist )
        {
            var songs2 = pool.filter( function ( s ) { return ( s.artist || NayiveUI.t( 'music.unknownArtist' ) ) === st.selectedArtist; } );
            html += scopeBarHtml( st.selectedArtist ) + songListHtml( songs2, true );
        }
        else html += '<div class="empty-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><p data-i18n="music.pickArtist"></p></div>';
    }
    else if( st.filter === "playlist" )
    {
        // A playlist, in its own order; a song gone from the library is
        // still a row (dimmed), so it can be taken out of the list.
        var pl = playlistById( st.playlistId );
        var all = playlistSongs( pl );
        var inPool = new Set( pool );
        var shown = ! q ? all : all.filter( function ( s ) { return inPool.has( s ) || s.missing && s.title.toLowerCase().indexOf( q ) !== -1; } );
        var gone = all.filter( function ( s ) { return s.missing; } ).length;
        html += '<h2 class="view-head">' + esc( pl ? pl.name : "" ) + '<small>' + esc( NayiveUI.tf( "music.nSongs", { n: all.length } ) ) +
                ( gone ? " · " + esc( NayiveUI.tf( gone === 1 ? "music.oneMissing" : "music.nMissing", { n: gone } ) ) : "" ) + '</small></h2>';
        html += ! all.length ? '<div class="empty-hint">' + MUSIC_NOTE_SVG + '<p data-i18n="music.listEmpty"></p></div>'
                             : songListHtml( shown, true );
    }
    else // folders: one folder of the tree, or none yet
    {
        if( st.selectedFolder )
        {
            var prefix = st.selectedFolder;
            var songs3 = pool.filter( function ( s ) { return s.path.slice( 0, prefix.length + 1 ) === prefix + "/"; } );
            html += '<h2 class="view-head">' + esc( prefix.slice( DIR.length ).replace( /^\/+/, "" ).split( "/" ).join( " / " ) ) + '</h2>' + songListHtml( songs3, true );
        }
        else html += '<div class="empty-hint">' + FOLDER_SVG + '<p data-i18n="music.pickFolder"></p></div>';
    }

    host.innerHTML = html;
    wireLibraryRows();
}

function renderLibraryDuration( song )
{
    $$( '.song-row[data-path="' + cssEsc( song.path ) + '"] .song-dur' ).forEach( function ( el )
    { el.textContent = song.duration != null ? fmtClock( song.duration ) : "…"; } );
}


// The song rows themselves are the item browser's (BROWSER below): a click
// picks, a double-click / tap / Enter plays. Here: the album and artist
// cards, the scope chip and "Show more".
function wireLibraryRows()
{
    $$( "#libContent [data-album]" ).forEach( function ( btn )
    {
        btn.addEventListener( "click", function ()
        {
            var key = btn.getAttribute( "data-album" );
            st.selectedAlbum = st.selectedAlbum === key ? null : key;
            listShown = LIST_PAGE;
            renderLibrary();
        } );
    } );
    $$( "#libContent [data-artist]" ).forEach( function ( btn )
    {
        btn.addEventListener( "click", function ()
        {
            var name = btn.getAttribute( "data-artist" );
            st.selectedArtist = st.selectedArtist === name ? null : name;
            listShown = LIST_PAGE;
            renderLibrary();
        } );
    } );
    var clearScope = $( "#clearScopeBtn" );
    if( clearScope ) clearScope.addEventListener( "click", function ()
    {
        st.selectedAlbum = st.selectedArtist = st.selectedFolder = null;
        renderLibrary();
    } );

    // "Mostrar más" - by tap, or on its own when it scrolls into view
    var more = $( "#showMoreBtn" );
    if( more )
    {
        var grow = function () { listShown += LIST_PAGE; renderLibrary(); };
        more.addEventListener( "click", grow );
        var mo = new IntersectionObserver( function ( es )
        {
            // ignore a stale observer whose button a re-render already replaced
            if( ! more.isConnected ) { mo.disconnect(); return; }
            if( es[ 0 ].isIntersecting ) { mo.disconnect(); grow(); }
        }, { root: $( "#libContent" ), rootMargin: "600px" } );
        mo.observe( more );
    }
}

// By path, through a map made again whenever st.songs is a new list (scan).
var songMap = null;
function findSong( path )
{
    if( ! songMap || songMap.list !== st.songs )
    {
        songMap = { list: st.songs, by: new Map() };
        st.songs.forEach( function ( s ) { songMap.by.set( s.path, s ); } );
    }
    return songMap.by.get( path ) || null;
}

// A saved playlist's songs, in its order, each once; a path no longer in
// the library is a stub row (.is-missing) so it can still be taken out.
function playlistSongs( pl )
{
    var seen = new Set(), out = [];
    ( pl && pl.paths || [] ).forEach( function ( p )
    {
        if( seen.has( p ) ) return;
        seen.add( p );
        out.push( findSong( p ) || { path: p, title: stripExt( NayiveMedia.baseName( p ) ),
                                     color: "", duration: null, missing: true } );
    } );
    return out;
}

/* ---------------------------------------------------------------------------
 * RENDER - QUEUE
 * -------------------------------------------------------------------------*/
function queueRowHtml( entry, index )
{
    var song = entry.song;
    var playing = index === st.playingIndex;
    return '<div class="queue-row' + ( playing ? ' is-playing' : '' ) + '" draggable="true" data-index="' + index + '">' +
        '<span class="queue-indicator">' + ( playing
            ? '<span class="eq"><span></span><span></span><span></span></span>'
            : GRIP_SVG ) + '</span>' +
        '<button class="queue-art" style="background:' + song.color + '" data-play="' + index + '" data-i18n-attr="title:music.playThis, aria-label:music.playThis">' + MUSIC_NOTE_SVG + '</button>' +
        '<span class="queue-meta">' +
            '<div class="queue-title">' + esc( song.title ) + '</div>' +
            '<div class="queue-sub">' + esc( song.artist || NayiveUI.t( 'music.unknownArtist' ) ) + '</div>' +
        '</span>' +
        '<span class="queue-dur">' + ( song.duration != null ? fmtClock( song.duration ) : "…" ) + '</span>' +
        '<button class="icon-btn sm danger" data-remove="' + index + '" data-i18n-attr="title:music.removeFromQueue, aria-label:music.removeFromQueue">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>' +
        '</button>' +
    '</div>';
}

function renderQueueList()
{
    var host = $( "#queueList" );
    if( ! st.queue.length )
    {
        host.innerHTML = '<div class="queue-empty">' + MUSIC_NOTE_SVG +
            '<p data-i18n="music.queueEmptyHint"></p></div>';
    }
    else
    {
        host.innerHTML = '<div class="queue-list" id="queueListInner">' +
            st.queue.map( queueRowHtml ).join( "" ) + '<div class="queue-tail"></div></div>';
    }
    wireQueueRows();

    $( "#clearQueueBtn" ).disabled = ! st.queue.length;
    $( "#saveListBtn"  ).disabled = ! st.queue.length;
}

function renderQueueDuration( song )
{
    var idx = -1;
    for( var i = 0; i < st.queue.length; i++ ) { if( st.queue[ i ].song === song ) { idx = i; break; } }
    if( idx === -1 ) return;
    var el = $( '.queue-row[data-index="' + idx + '"] .queue-dur' );
    if( el ) el.textContent = song.duration != null ? fmtClock( song.duration ) : "…";
}

function wireQueueRows()
{
    var inner = $( "#queueListInner" );
    $$( "#queueList .queue-row" ).forEach( function ( row )
    {
        var index = parseInt( row.getAttribute( "data-index" ), 10 );
        row.addEventListener( "dragstart", function () { st.dragPayload = { type: "queue", index: index }; } );
        // A tap on the row plays it (its x only takes it out).
        row.addEventListener( "click", function ( e )
        {
            if( e.target.closest( "[data-remove], [data-play]" ) ) return;
            playIndex( index );
        } );
        row.addEventListener( "dragover", function ( e ) { e.preventDefault(); row.classList.add( "drag-over" ); } );
        row.addEventListener( "dragleave", function () { row.classList.remove( "drag-over" ); } );
        row.addEventListener( "drop", function ( e )
        {
            e.preventDefault(); e.stopPropagation(); row.classList.remove( "drag-over" );
            handleQueueDrop( index );
        } );
    } );
    $$( "#queueList [data-play]" ).forEach( function ( btn )
    {
        btn.addEventListener( "click", function () { playIndex( parseInt( btn.getAttribute( "data-play" ), 10 ) ); } );
    } );
    $$( "#queueList [data-remove]" ).forEach( function ( btn )
    {
        btn.addEventListener( "click", function ( e )
        {
            e.stopPropagation();
            removeFromQueue( parseInt( btn.getAttribute( "data-remove" ), 10 ) );
        } );
    } );
    if( inner )
    {
        inner.addEventListener( "dragover", function ( e ) { e.preventDefault(); } );
        inner.addEventListener( "drop", function ( e ) { e.preventDefault(); handleQueueDrop( st.queue.length ); } );
    }
}

/* ---------------------------------------------------------------------------
 * QUEUE LOGIC
 * -------------------------------------------------------------------------*/
// A song tapped in the library plays now: from its place in the queue when it
// is there already, else added at the end first.
function playSong( song )
{
    if( ! song ) return;
    var at = -1;
    st.queue.forEach( function ( e, i ) { if( at === -1 && e.song === song ) at = i; } );
    if( at === -1 ) { st.queue.push( { song: song } ); at = st.queue.length - 1; }
    playIndex( at );
}

// Songs at the end of the queue (Q, "Add to the queue"); with nothing
// playing, the first of them starts.
function addToQueue( songs )
{
    if( ! songs.length ) return;
    var first = st.queue.length;
    songs.forEach( function ( s ) { st.queue.push( { song: s } ); } );
    renderQueueList();
    if( st.playingIndex === -1 ) playIndex( first );
}

// Songs right after the one playing ("Play next"); with nothing playing
// they go first and the first of them starts.
function playNext( songs )
{
    if( ! songs.length ) return;
    var at = st.playingIndex >= 0 ? st.playingIndex + 1 : 0;
    st.queue.splice.apply( st.queue, [ at, 0 ].concat( songs.map( function ( s ) { return { song: s }; } ) ) );
    renderQueueList();
    if( st.playingIndex === -1 ) playIndex( at );
}

// Several songs played at once (Play / Enter on a pick): they become the
// queue, the first starts - as loading a playlist does - and the Undo brings
// the old queue back.
function playSongs( songs )
{
    if( ! songs.length ) return;
    if( songs.length === 1 ) { playSong( songs[ 0 ] ); return; }
    var snap = queueSnapshot();
    var entries = songs.map( function ( s ) { return { song: s }; } );
    st.queue = entries;
    st.playingIndex = -1;
    stopPlayback();
    playIndex( 0 );
    if( snap.queue.length )
        NayiveUI.undoToast( NayiveUI.tf( 'music.playingN', { n: songs.length } ), function () { restoreQueue( snap, entries ); } );
}

function handleQueueDrop( targetIndex )
{
    var payload = st.dragPayload;
    st.dragPayload = null;
    if( ! payload ) return;

    if( payload.type === "queue" )
    {
        var from = payload.index;
        if( from === targetIndex ) return;
        var wasPlaying = st.queue[ st.playingIndex ];
        var moved = st.queue.splice( from, 1 )[ 0 ];
        var insertAt = targetIndex > from ? targetIndex - 1 : targetIndex;
        st.queue.splice( insertAt, 0, moved );
        st.playingIndex = st.queue.indexOf( wasPlaying );
    }
    else if( payload.type === "library" )
    {
        // the dragged songs (every picked one when a picked row is dragged)
        var add = payload.songs.map( function ( s ) { return { song: s }; } );
        if( ! add.length ) return;
        var at = Math.min( targetIndex, st.queue.length );
        st.queue.splice.apply( st.queue, [ at, 0 ].concat( add ) );
        if( st.playingIndex >= at ) st.playingIndex += add.length;
    }
    renderQueueList();
}

function removeFromQueue( index )
{
    var entry = st.queue[ index ];
    if( ! entry ) return;
    var wasPlaying = index === st.playingIndex;
    st.queue.splice( index, 1 );
    if( ! st.queue.length ) { st.playingIndex = -1; stopPlayback(); }
    else if( wasPlaying ) playIndex( Math.min( index, st.queue.length - 1 ) );
    else if( index < st.playingIndex ) st.playingIndex--;
    renderQueueList();
    renderLibrary();

    // Undo: the row goes back where it was; the song playing now keeps playing.
    NayiveUI.undoToast( NayiveUI.t( 'ui.toast.removed' ), function ()
    {
        var cur = st.queue[ st.playingIndex ];
        st.queue.splice( Math.min( index, st.queue.length ), 0, entry );
        st.playingIndex = cur ? st.queue.indexOf( cur ) : -1;
        renderQueueList();
        renderLibrary();
    } );
}

function clearQueue()
{
    st.queue = []; st.playingIndex = -1;
    stopPlayback();
    renderQueueList();
    renderLibrary();
}

// What "Empty the queue" and "Load a playlist" throw away, for their Undo.
function queueSnapshot()
{
    return { queue: st.queue.slice(), index: st.playingIndex,
             time: audio.currentTime || 0, playing: ! audio.paused };
}

// Their Undo: the old queue comes back, in front of anything queued since
// (minus `drop`, the rows the loaded playlist put in), and its song goes on
// where it was. A song queued since that is playing now keeps playing.
function restoreQueue( snap, drop )
{
    var cur  = st.queue[ st.playingIndex ];
    var kept = st.queue.filter( function ( e ) { return drop.indexOf( e ) === -1; } );
    st.queue = snap.queue.concat( kept );

    if( cur && kept.indexOf( cur ) !== -1 ) st.playingIndex = st.queue.indexOf( cur );
    else
    {
        st.playingIndex = -1;
        stopPlayback();
        var entry = st.queue[ snap.index ];
        if( snap.index >= 0 && entry )
        {
            // a song that can no longer play just stays picked, as before
            st.playingIndex = snap.index;
            audio.src = GumApi.fileUrl( entry.song.path );
            st.seekOnLoad = snap.time;
            if( snap.playing ) audio.play().catch( function () {} );
            updateMediaSession( entry.song );
        }
    }
    renderQueueList();
    renderLibrary();
    updatePlayerBar();
}

/* ---------------------------------------------------------------------------
 * PLAYBACK - a real <audio> element; this is what makes it keep playing while
 * you browse other views (nothing here pauses it on navigation because there
 * is none - Music is one page) and, where the browser/OS allow it, while the
 * tab is in the background too (MediaSession below gives it lock-screen /
 * notification controls, same as any native player).
 * -------------------------------------------------------------------------*/
function playIndex( index )
{
    if( index < 0 || index >= st.queue.length ) return;
    st.playingIndex = index;
    st.seekOnLoad = 0;                      // an Undo's resume point was for the song before
    var song = st.queue[ index ].song;
    audio.src = GumApi.fileUrl( song.path );
    audio.play().catch( function () {} );   // autoplay may be blocked - controls still work
    renderQueueList();
    renderLibrary();
    updatePlayerBar();
    updateMediaSession( song );
}

function stopPlayback()
{
    audio.pause();
    audio.removeAttribute( "src" );
    audio.load();
    updatePlayerBar();
}

function togglePlay()
{
    if( st.playingIndex === -1 ) { if( st.queue.length ) playIndex( 0 ); return; }
    if( audio.paused ) audio.play().catch( function () {} );
    else audio.pause();
}

function advance( dir )
{
    if( ! st.queue.length ) return;
    var idx;
    if( st.shuffle ) idx = st.queue.indexOf( shuffleStep( dir ) );
    else idx = ( st.playingIndex + dir + st.queue.length ) % st.queue.length;
    playIndex( idx );
}

// The song that just ended (or failed) was the queue's last: in order, the
// last row; shuffled, every other song has played this round.
function atQueueEnd()
{
    if( ! st.queue.length ) return true;
    var cur = st.queue[ st.playingIndex ];
    if( ! st.shuffle ) return st.playingIndex >= st.queue.length - 1;
    return st.queue.every( function ( e ) { return e === cur || st.played.has( e ); } );
}

// What happens on its own after a song: the next one - but past the last,
// only with Repeat on. False when the queue stopped there.
function autoNext()
{
    if( ! st.repeat && atQueueEnd() ) return false;
    advance( 1 );
    return true;
}

function setRepeat( on )
{
    st.repeat = !! on;
    $( "#repeatBtn" ).classList.toggle( "is-active", st.repeat );
    $( "#repeatBtn" ).setAttribute( "aria-pressed", st.repeat ? "true" : "false" );
    try { localStorage.setItem( "music-repeat", st.repeat ? "1" : "0" ); } catch( e ) {}
}

// Shuffle: "next" draws from the songs not played yet this round, so none
// comes back before all have played (then a new round starts); "previous"
// goes back through the songs that did play, not to another random one.
function shuffleStep( dir )
{
    var cur = st.queue[ st.playingIndex ] || null;
    var entry = null;
    if( dir < 0 )
    {
        while( st.history.length && ! entry )
        {
            entry = st.history.pop();
            if( st.queue.indexOf( entry ) === -1 ) entry = null;   // removed from the queue since
        }
        return entry || cur || st.queue[ 0 ];                       // nothing before it: it starts again
    }
    if( cur ) { st.history.push( cur ); st.played.add( cur ); }
    var left = st.queue.filter( function ( e ) { return e !== cur && ! st.played.has( e ); } );
    if( ! left.length )
    {
        st.played = new Set( cur ? [ cur ] : [] );
        left = st.queue.filter( function ( e ) { return e !== cur; } );
    }
    entry = left.length ? left[ Math.floor( Math.random() * left.length ) ] : cur;
    st.played.add( entry );
    return entry;
}

function updatePlayerBar()
{
    var entry = st.queue[ st.playingIndex ];
    var song = entry ? entry.song : null;
    $( "#playerTitle" ).textContent = song ? song.title : NayiveUI.t( 'music.nothingPlaying' );
    $( "#playerSub"   ).textContent = song ? ( song.artist || NayiveUI.t( 'music.unknownArtist' ) ) + ( song.album ? " · " + song.album : "" )
                                            : NayiveUI.t( 'music.pickSong' );
    $( "#playerArt"   ).style.background = song ? song.color : "#3A3C42";

    var has = !! song;
    $( "#prevBtn" ).disabled = ! has;
    $( "#nextBtn" ).disabled = ! has;
    $( "#playBtn" ).disabled = ! has;
    $( "#seekRange" ).disabled = ! has;
}

/* ---------------------------------------------------------------------------
 * MEDIASESSION - lock-screen / notification transport controls, when the
 * browser supports it. Purely additive: everything above already works
 * without it.
 * -------------------------------------------------------------------------*/
function updateMediaSession( song )
{
    if( ! song ) return;
    NayiveMedia.mediaSession(
        { title: song.title, artist: song.artist || NayiveUI.t( 'music.unknownArtist' ), album: song.album || "" },
        {
            play:          function () { audio.play().catch( function () {} ); },
            pause:         function () { audio.pause(); },
            previoustrack: function () { advance( -1 ); },
            nexttrack:     function () { advance( 1 ); },
            seekto:        function ( d ) { if( d.seekTime != null ) audio.currentTime = d.seekTime; }
        } );
}

/* ---------------------------------------------------------------------------
 * PLAYLISTS - data/music/playlists.json, an array of {id, name, paths}.
 * Paths are real file paths - a real file's path is already a stable id.
 * -------------------------------------------------------------------------*/
// Only a missing file (404) is "no lists yet". Any other failure - offline, a
// 5xx, a file that is not a list - is thrown (e.read = "unread" / "bad"), after
// a toast that says why: the caller must not write - one list would otherwise
// go over all of them.
async function readPlaylists()
{
    var list, why = "";
    try { list = await GumApi.readJson( PLAYLISTS_PATH ); }
    catch( e ) { why = e instanceof SyntaxError ? "bad" : "unread"; }
    if( ! why && list !== null && ! Array.isArray( list ) ) why = "bad";
    if( why )
    {
        NayiveUI.toast( NayiveUI.t( why === "bad" ? 'ui.store.badFile' : 'ui.store.notRead' ) );
        var err = new Error( "playlists not read" );
        err.read = why;
        throw err;
    }
    return list || [];
}

// At start-up: a file that cannot be read shows no lists.
async function loadPlaylists()
{
    try { st.playlists = await readPlaylists(); st.playlistsBlocked = ""; }
    catch( e ) { st.playlists = []; st.playlistsBlocked = e.read; }
}

// One change to the lists. The phone, another tab or a desktop window save
// lists too, so a change never writes the list this page read at start-up:
// it reads the file again, `apply` makes just its own change to that fresh
// list (by id), and that is written - a list saved elsewhere meanwhile stays.
// Version-checked (GumApi.updateJson): a list saved between that read and
// this write makes it read again and `apply` again, never written over.
// One change at a time (a delete and its Undo must not cross). A file that
// cannot be read now is not written (thrown with e.read, after a toast that
// says why, as readPlaylists does). `apply` returning false: nothing to
// write. Done, the fresh list is the one shown.
var playlistsChain = Promise.resolve();

function changePlaylists( apply )
{
    var run = playlistsChain.then( async function ()
    {
        var list;
        try
        {
            list = await GumApi.updateJson( PLAYLISTS_PATH, function ( raw )
            {
                if( raw !== null && ! Array.isArray( raw ) ) { var bad = new Error( "playlists not a list" ); bad.read = "bad"; throw bad; }
                var fresh = raw || [];
                return apply( fresh ) === false ? false : fresh;
            } );
        }
        catch( e )
        {
            var why = e && e.read ? e.read : e && e.notRead ? ( e instanceof SyntaxError ? "bad" : "unread" ) : "";
            if( why )
            {
                NayiveUI.toast( NayiveUI.t( why === "bad" ? 'ui.store.badFile' : 'ui.store.notRead' ) );
                e.read = why;
            }
            throw e;
        }
        st.playlistsBlocked = "";
        st.playlists = list || [];
        refreshPlaylists();                  // the tree and an open playlist show it
    } );
    playlistsChain = run.catch( function () {} );
    return run;
}

// "Save list": the queue, as a new list (the name sheet, below).
function openSaveSheet() { openNameSheet( { kind: "queue" } ); }

var savingList = false;          // a second ✓ while the first one saves does nothing

// The lists changed (a save, a delete, its Undo, a rename): the tree shows
// them again, and so does the playlist on screen - or, when that one is gone,
// the songs.
function refreshPlaylists()
{
    if( st.filter === "playlist" && ! playlistById( st.playlistId ) ) { setFilter( "songs" ); return; }
    if( treeView ) treeView.render();
    if( st.filter === "playlist" ) renderLibrary();
}

function playlistById( id )
{
    return st.playlists.filter( function ( p ) { return p && p.id === id; } )[ 0 ] || null;
}

// `shuffled`: Shuffle on the playlist's menu - the first song is any of them.
function loadPlaylist( id, shuffled )
{
    var pl = st.playlists.filter( function ( p ) { return p.id === id; } )[ 0 ];
    if( ! pl ) return;
    var found = pl.paths.map( findSong ).filter( Boolean ).map( function ( s ) { return { song: s }; } );
    var missing = pl.paths.length - found.length;
    var missingMsg = missing ? NayiveUI.tf( missing === 1 ? "music.oneMissing" : "music.nMissing", { n: missing } ) : "";
    var snap = queueSnapshot();                 // the queue this list throws away
    st.queue = found;
    st.playingIndex = -1;
    stopPlayback();
    renderQueueList();
    if( found.length ) playIndex( shuffled ? Math.floor( Math.random() * found.length ) : 0 );

    // Undo puts the old queue back - only when there was one to lose.
    if( snap.queue.length )
        NayiveUI.undoToast( NayiveUI.t( 'music.listLoaded' ) + ( missingMsg ? " " + missingMsg : "" ),
                            function () { restoreQueue( snap, found ); } );
    else if( missingMsg ) NayiveUI.toast( missingMsg );
}

// At once, no question: the Undo puts the list back where it was.
async function deletePlaylist( id )
{
    var at = -1;
    st.playlists.forEach( function ( p, i ) { if( p.id === id ) at = i; } );
    if( at === -1 ) return;
    var pl = st.playlists[ at ];
    st.playlists = st.playlists.filter( function ( p ) { return p.id !== id; } );
    refreshPlaylists();

    // Out of the file as it is now, by id: what the phone saved meanwhile stays.
    var saving = changePlaylists( function ( list )
    {
        var n = list.length;
        for( var i = list.length - 1; i >= 0; i-- ) if( list[ i ] && list[ i ].id === id ) list.splice( i, 1 );
        return list.length !== n;               // gone there already: nothing to write
    } );
    NayiveUI.undoToast( NayiveUI.t( 'ui.toast.deleted' ), async function ()
    {
        try { await saving; } catch( e ) {}     // the delete's write lands first, or it could land last
        try
        {
            await changePlaylists( function ( list )
            {
                if( list.some( function ( p ) { return p && p.id === id; } ) ) return false;   // back already
                list.splice( Math.min( at, list.length ), 0, pl );
            } );
        }
        catch( e ) { if( ! e || ! e.read ) NayiveUI.toast( NayiveUI.t( 'music.listUpdateFailed' ) ); }
        refreshPlaylists();
    } );
    try { await saving; }
    catch( e ) { if( ! e || ! e.read ) NayiveUI.toast( NayiveUI.t( 'music.listUpdateFailed' ) ); return; }
    refreshPlaylists();                         // with the lists saved elsewhere
}

function goNode( id )

// A playlist's menu (right-click, a long-press); the Playlists row's.
function treeMenu( id, x, y, anchor )
{

function setFilter( f, folder )
{
