    st.selectedFolder = folder || null;
    listShown = LIST_PAGE;
    $( "#libContent" ).scrollTop = 0;
    renderLibrary();
    if( treeView ) treeView.render();
}

function setShuffle( on )
{
    if( on && ! st.shuffle ) { st.played = new Set(); st.history = []; }   // a fresh round
    st.shuffle = !! on;
    $( "#shuffleBtn" ).classList.toggle( "is-active", st.shuffle );
    $( "#seqBtn" ).classList.toggle( "is-active", ! st.shuffle );
}

/* ---------------------------------------------------------------------------
 * PLAYLIST CHANGES - each one through changePlaylists (it reads the file
 * again, changes only that list, by id, version-checked). Taking a song out
 * of a list never touches the song's file.
 * -------------------------------------------------------------------------*/
function listToast( e ) { if( ! e || ! e.read ) NayiveUI.toast( NayiveUI.t( 'music.listUpdateFailed' ) ); }

function findList( list, id ) { return list.filter( function ( p ) { return p && p.id === id; } )[ 0 ] || null; }

// Songs at the end of a saved list; one already in it is not added twice.
async function addToPlaylist( id, paths )
{
    paths = paths.filter( function ( p, i, a ) { return a.indexOf( p ) === i && findSong( p ); } );
    if( ! paths.length ) return;
    var added = 0, name = "", gone = false;
    try
    {
        await changePlaylists( function ( list )
        {
            var pl = findList( list, id );
            added = 0; gone = ! pl;
            if( ! pl ) return false;
            name = pl.name;
            if( ! Array.isArray( pl.paths ) ) pl.paths = [];
            paths.forEach( function ( p ) { if( pl.paths.indexOf( p ) === -1 ) { pl.paths.push( p ); added++; } } );
            return added ? undefined : false;
        } );
    }
    catch( e ) { listToast( e ); return; }
    if( gone ) { listToast( null ); return; }
    NayiveUI.toast( added ? NayiveUI.tf( 'music.addedTo', { n: added, name: name } ) : NayiveUI.tf( 'music.alreadyIn', { name: name } ) );
}

// Out of the playlist on screen, at once; the Undo puts each song back at
// its place. Only the list changes: the files stay where they are.
async function removeFromPlaylist( ids )
{
    var id = st.playlistId, drop = new Set( ids ), removed = [];
    try
    {
        await changePlaylists( function ( list )
        {
            var pl = findList( list, id );
            removed = [];
            if( ! pl || ! Array.isArray( pl.paths ) ) return false;
            var keep = [];
            pl.paths.forEach( function ( p, i ) { if( drop.has( p ) ) removed.push( [ i, p ] ); else keep.push( p ); } );
            if( ! removed.length ) return false;
            pl.paths = keep;
        } );
    }
    catch( e ) { listToast( e ); return; }
    if( ! removed.length ) return;
    var back = removed;
    NayiveUI.undoToast( NayiveUI.t( 'ui.toast.removed' ), async function ()
    {
        try
        {
            await changePlaylists( function ( list )
            {
                var pl = findList( list, id );
                if( ! pl ) return false;                 // the list was deleted since: nothing to put them in
                var paths = Array.isArray( pl.paths ) ? pl.paths.slice() : [];
                back.forEach( function ( r ) { paths.splice( Math.min( r[ 0 ], paths.length ), 0, r[ 1 ] ); } );
                pl.paths = paths;
            } );
        }
        catch( e ) { listToast( e ); }
    } );
}

// The name sheet (#saveBackdrop): saves the queue as a new list, names a
// new list, renames one.
// { kind: "queue", newId } | { kind: "new", paths, newId } | { kind: "rename", id }
var nameSheet = null;

function openNameSheet( o )
{
    var pl = o.kind === "rename" ? playlistById( o.id ) : null;
    if( o.kind === "rename" && ! pl ) return;
    if( o.kind === "queue" && ! st.queue.length ) return;
    // A new list's id is fixed here: ✓ again after a failed save replaces
    // its own list (if that write did land after all) rather than adding a
    // second one.
    if( o.kind !== "rename" ) o.newId = "pl" + Date.now().toString( 36 );
    nameSheet = o;
    $( "#saveTitle" ).textContent = NayiveUI.t( o.kind === "rename" ? "music.renameList" : o.kind === "queue" ? "music.saveList" : "music.newList" );
    $( "#saveHint" ).textContent = o.kind === "queue" ? NayiveUI.tf( "music.saveHint", { n: st.queue.length } )
                                 : o.kind === "new" && o.paths.length ? NayiveUI.tf( "music.newListHint", { n: o.paths.length } ) : "";
    $( "#playlistName" ).value = pl ? pl.name : "";
    NayiveUI.open( "saveBackdrop" );
    $( "#playlistName" ).focus();
    $( "#playlistName" ).select();
}

async function confirmName()
{
    if( ! nameSheet ) return;
    var o = nameSheet, name = $( "#playlistName" ).value.trim();
    if( ! name ) { NayiveUI.toast( NayiveUI.t( 'music.needListName' ) ); return; }
    if( savingList ) return;
    var old = null;
    savingList = true;
    try
    {
        if( o.kind !== "rename" )
        {
            // The queue as it is at ✓, not as it was when the sheet opened.
            var paths = o.kind === "queue" ? st.queue.map( function ( e ) { return e.song.path; } ) : o.paths.slice();
            var pl = { id: o.newId, name: name, paths: paths };
            await changePlaylists( function ( list )
            {
                for( var i = 0; i < list.length; i++ ) if( list[ i ] && list[ i ].id === pl.id ) { list[ i ] = pl; return; }
                list.push( pl );
            } );
        }
        else await changePlaylists( function ( list )
        {
            var p = findList( list, o.id );
            if( ! p ) return false;
            old = p.name;
            if( p.name === name ) return false;
            p.name = name;
        } );
    }
    catch( e )
    {
        // Not saved: the sheet stays open with the name typed, ✓ tries
        // again. A read that failed has said why already.
        if( ! e || ! e.read ) NayiveUI.toast( NayiveUI.t( 'music.listSaveFailed' ) );
        return;
    }
    finally { savingList = false; }
    NayiveUI.setOpen( "saveBackdrop", false );
    nameSheet = null;
    if( o.kind === "queue" ) NayiveUI.toast( NayiveUI.t( 'music.listSaved' ) );
    else if( o.kind === "new" )
    {
        if( o.paths.length ) NayiveUI.toast( NayiveUI.tf( 'music.addedTo', { n: o.paths.length, name: name } ) );
        else { NayiveUI.toast( NayiveUI.t( 'music.listSaved' ) ); goNode( "pl:" + o.newId ); }
    }
    else if( old !== null && old !== name )
        NayiveUI.undoToast( NayiveUI.t( 'ui.toast.renamed' ), async function ()
        {
            try
            {
                await changePlaylists( function ( list )
                {
                    var p = findList( list, o.id );
                    if( ! p || p.name !== name ) return false;   // gone, or renamed again since
                    p.name = old;
                } );
            }
            catch( e ) { listToast( e ); }
        } );
}

/* ---------------------------------------------------------------------------
 * BROWSER - the song rows are the shared item browser's (shared/browser.js):
 * a click picks (Ctrl / Shift add), a double-click, Enter or a tap plays, a
 * long-press picks on touch. One action list feeds the header group, the
 * menu (right-click) and the keys; what does not fit the header goes into
 * its one ⋮ (NayiveUI.fitBar).
 * -------------------------------------------------------------------------*/
var browse = null;

// The picked paths in the order the list shows them.
function inListOrder( ids )
{
    var want = new Set( ids ), seen = new Set(), out = [];
    $$( "#libContent .song-row" ).forEach( function ( r )
    {
        var p = r.getAttribute( "data-path" );
        if( want.has( p ) && ! seen.has( p ) ) { seen.add( p ); out.push( p ); }
    } );
    ids.forEach( function ( p ) { if( ! seen.has( p ) ) { seen.add( p ); out.push( p ); } } );
    return out;
}

// ...as songs; a playlist's song gone from the library is left out.
function songsOf( ids ) { return inListOrder( ids ).map( findSong ).filter( Boolean ); }

// Double-click / tap / Enter: that song - or, on a row of a bigger pick
// (Enter), every picked song.
function openSong( id )
{
    var ids = browse.has( id ) && browse.ids().length > 1 ? browse.ids() : [ id ];
    var songs = songsOf( ids );
    if( ! songs.length ) { NayiveUI.toast( NayiveUI.tf( 'music.oneMissing', { n: 1 } ) ); return; }
    playSongs( songs );
}

function goToAlbum( song )
{
    if( ! song ) return;
    setFilter( "albums" );
    st.selectedAlbum = albumKey( song );
    renderLibrary();
    var card = $( '#libContent [data-album="' + cssEsc( st.selectedAlbum ) + '"]' );
    if( card ) card.scrollIntoView( { block: "nearest" } );
    browse.set( [ song.path ] );
    browse.focus( song.path );
}

function pickPlaylist( ids )
{
    var paths = songsOf( ids ).map( function ( s ) { return s.path; } );
    if( ! paths.length ) return;
    var here = st.filter === "playlist" ? "pl:" + st.playlistId : null;
    NayiveUI.pickNode( {
        title:   NayiveUI.t( "music.addToPlaylist" ),
        okLabel: NayiveUI.t( "music.addToPlaylist" ),
        lit:     null,
        roots:   function () { return [ { id: "new", name: NayiveUI.t( "music.newList" ), icon: "plus" } ].concat( playlistNodes() ); },
        disabled: function ( id ) { return id === here; }
    } ).then( function ( id )
    {
        if( ! id ) return;
        if( id === "new" ) openNameSheet( { kind: "new", paths: paths } );
        else addToPlaylist( id.slice( 3 ), paths );
    } );
}

// Built once the dictionary is in (boot).
function musicActions()
{
    var T = NayiveUI.t, tf = NayiveUI.tf;
    function some( ids ) { return ids.some( function ( p ) { return !! findSong( p ); } ); }
    function one( ids )  { return ids.length === 1 && !! findSong( ids[ 0 ] ); }
    return [
        { id: "play", label: T( "media.play" ), icon: "play", key: "Enter", rank: 1, group: 0, when: some,
          run: function ( ids ) { playSongs( songsOf( ids ) ); } },
        { id: "next", label: T( "music.playNext" ), icon: ICON.next, rank: 6, group: 0, when: some,
          run: function ( ids ) { var s = songsOf( ids ); playNext( s ); NayiveUI.toast( tf( "music.nextN", { n: s.length } ) ); } },
        { id: "queue", label: T( "music.addToQueue" ), icon: "queue", key: "Q", rank: 2, group: 0, when: some,
          run: function ( ids ) { var s = songsOf( ids ); addToQueue( s ); NayiveUI.toast( tf( "music.queuedN", { n: s.length } ) ); } },
        { id: "playlist", label: T( "music.addToPlaylist" ), icon: "plus", rank: 3, group: 1, when: some, run: pickPlaylist },
        { id: "album", label: T( "music.goToAlbum" ), icon: ICON.albums, rank: 7, group: 1, when: one,
          run: function ( ids ) { goToAlbum( findSong( ids[ 0 ] ) ); } },
        { id: "drive", label: T( "ui.showInDrive" ), icon: "folder", rank: 8, group: 1, when: one,
          run: function ( ids ) { NayiveMedia.showInDrive( ids[ 0 ] ); } },
        { id: "remove", label: T( "music.removeFromList" ), icon: "x", key: "Del", rank: 5, danger: true, group: 2,
          where: function () { return st.filter === "playlist"; }, run: removeFromPlaylist }
    ];
}

function wireBrowser()
{
    treeView = NayiveMedia.libraryTree( treeOpen, {
        roots:   treeRoots,
        current: currentNode,
        go:      goNode,
        menu:    treeMenu,
        drop:    { can: function ( ids, id ) { return ids && ids.length && id.indexOf( "pl:" ) === 0 && id !== "pl:" + ( st.filter === "playlist" ? st.playlistId : "" ) ? "inside" : false; },
                   drop: function ( ids, id ) { addToPlaylist( id.slice( 3 ), songsOf( ids ).map( function ( s ) { return s.path; } ) ); } }
    } );

    // Enter on a pick of several plays them all - also with no keyboard row
    // yet (Ctrl+A on a fresh list), where the browser has no row to open.
    document.addEventListener( "keydown", function ( e )
    {
        if( e.key !== "Enter" || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || ! browse ) return;
        if( browse.ids().length < 2 || NayiveUI.menuOpen() || document.querySelector( ".sheet-backdrop.open" ) ) return;
        var a = document.activeElement;
        if( a && a !== document.body && ! $( "#libContent" ).contains( a ) ) return;   // a button, a field, the tree: theirs
        e.preventDefault();
        playSongs( songsOf( browse.ids() ) );
    } );

    browse = NayiveUI.browser( {
        list:    $( "#libContent" ),
        row:     ".song-row",
        idOf:    function ( el ) { return el.getAttribute( "data-path" ); },
        bar:     $( "#selActions" ),
        actions: musicActions(),
        tree:    treeView,
        open:    openSong,
        drag:    { text: function ( ids ) { return songsOf( ids ).map( function ( s ) { return s.title; } ).join( "\n" ); } }
    } );

    // A drag from the list may end on the queue (handleQueueDrop): it carries
    // the dragged songs (every picked one when a picked row is dragged).
    $( "#libContent" ).addEventListener( "dragstart", function ()
    {
        var ids = NayiveUI.dragIds();
        st.dragPayload = ids ? { type: "library", songs: songsOf( ids ) } : null;
    } );

    // Del / F2 on a playlist's tree row, as on its menu.
    $( "#tree" ).addEventListener( "keydown", function ( e )
    {
        var row = e.target.closest( ".tree-row" );
        if( ! row || row.dataset.id.indexOf( "pl:" ) !== 0 || e.ctrlKey || e.metaKey || e.altKey ) return;
        var pid = row.dataset.id.slice( 3 );
        if( e.key === "Delete" ) { e.preventDefault(); deletePlaylist( pid ); }
        else if( e.key === "F2" ) { e.preventDefault(); openNameSheet( { kind: "rename", id: pid } ); }
    } );
}

/* ---------------------------------------------------------------------------
 * STATIC WIRING
 * -------------------------------------------------------------------------*/
function wireStaticUI()
{
    $( "#searchInput" ).addEventListener( "input", function ( e )
    { st.search = e.target.value; listShown = LIST_PAGE; renderLibrary(); } );

    NayiveMedia.wireSearchToggle();                     // the search fold
    NayiveMedia.wireFolderInfo();                       // folder-? -> path + counts
    NayiveMedia.wireCrumbPicker( { app: "music" } );    // crumb -> folder picker

    $( "#reloadBtn" ).addEventListener( "click", function ()
    {
        st.selectedAlbum = st.selectedArtist = st.selectedFolder = null;
        scan();
    } );

    $( "#seqBtn" ).addEventListener( "click", function () { setShuffle( false ); } );
    $( "#shuffleBtn" ).addEventListener( "click", function () { setShuffle( true ); } );

    var rep = null;
    try { rep = localStorage.getItem( "music-repeat" ); } catch( e ) {}
    setRepeat( rep === "1" );
    $( "#repeatBtn" ).addEventListener( "click", function () { setRepeat( ! st.repeat ); } );

    $( "#queueBtn" ).addEventListener( "click", openQueueSheet );
    PHONE.addEventListener( "change", function () { if( ! PHONE.matches ) dockQueuePane(); } );

    // At once, no question: the Undo brings the queue back.
    $( "#clearQueueBtn" ).addEventListener( "click", function ()
    {
        if( ! st.queue.length ) return;
        var snap = queueSnapshot();
        clearQueue();
        NayiveUI.undoToast( NayiveUI.t( 'music.queueEmptied' ), function () { restoreQueue( snap, [] ); } );
    } );

    $( "#saveListBtn" ).addEventListener( "click", openSaveSheet );
    $( "#saveCancelBtn" ).addEventListener( "click", function () { NayiveUI.setOpen( "saveBackdrop", false ); } );
    $( "#saveConfirmBtn" ).addEventListener( "click", confirmName );
    $( "#playlistName" ).addEventListener( "keydown", function ( e ) { if( e.key === "Enter" ) confirmName(); } );

    $( "#prevBtn" ).addEventListener( "click", function () { advance( -1 ); } );
    $( "#nextBtn" ).addEventListener( "click", function () { advance( 1 ); } );
    $( "#playBtn" ).addEventListener( "click", togglePlay );

    $( "#queueList" ).addEventListener( "dragover", function ( e ) { e.preventDefault(); } );
    // The empty queue has no rows or list to drop on: the pane itself takes it.
    // (A drop on the list bubbles here too; the first handler used the payload.)
    $( "#queueList" ).addEventListener( "drop", function ( e ) { e.preventDefault(); handleQueueDrop( st.queue.length ); } );

    // The seek / volume / time / play icon wiring (shared/media.js); the lock
    // screen's progress bar follows the element.
    NayiveMedia.wirePlayer( audio, {
        loaded: function ()
        {
            if( st.seekOnLoad ) { try { audio.currentTime = st.seekOnLoad; } catch( e ) {} st.seekOnLoad = 0; }
            NayiveMedia.positionState( audio );
        },
        play:  function () { NayiveMedia.positionState( audio ); },
        pause: function () { NayiveMedia.positionState( audio ); }
    } );
    audio.addEventListener( "seeked", function () { NayiveMedia.positionState( audio ); } );
    audio.addEventListener( "ended", function () { autoNext(); } );

    // A song that cannot play (gone since the scan, a format the browser lacks)
    // says so and the queue goes on - it must not just stop, on a locked phone
    // least of all. A whole queue that fails in a row stops.
    var failedInRow = 0;
    audio.addEventListener( "playing", function () { failedInRow = 0; } );
    audio.addEventListener( "error", function ()
    {
        var entry = st.queue[ st.playingIndex ];
        if( ! entry || ! audio.getAttribute( "src" ) ) return;
        NayiveUI.toast( NayiveUI.tf( 'music.cantPlay', { name: entry.song.title } ) );
        if( ++failedInRow >= st.queue.length ) { failedInRow = 0; return; }
        if( ! autoNext() ) failedInRow = 0;
    } );

    wireResizer();
}

/* ---------------------------------------------------------------------------
 * BOOT
 * -------------------------------------------------------------------------*/
async function boot()
{
    wireStaticUI();
    NayivePlayOn.wire( audio, $( "#outBtn" ) );

    DIR = await NayiveMedia.openLibrary( DIR, { app: "music", title: NayiveUI.t( "music.whereFolder" ), note: NayiveUI.t( "music.whereFolderNote" ) } );
    if( ! DIR ) return;
    wireBrowser();

    await loadPlaylists();
    treeView.render();
    await scan();
}

function setCrumb() { if( DIR ) NayiveMedia.setCrumb( NayiveMedia.dirLabel( DIR ) ); }

NayiveI18n.ready.then( boot );
</script>
