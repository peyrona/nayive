    <style>
        /* Base reset, .app shell, .topbar, .icon-btn, .sheet, .field and the
           input look all come from ../shared/app.css. Text overrides the page
           scroll and adds the editor chrome + its own toolbar. */
        html, body { height: 100%; overflow: hidden; }



        /* Sync-status dot, top-right of the top bar: blue while a request is in flight, green once synced, red on error. */
        .sync-indicator { margin-left: 4px; }   /* base rule + states in ../shared/theme.css */

        /* Action toolbar (CodeMirror's free build ships no chrome of its own) */
        #toolbar { display: flex; align-items: center; gap: 2px; padding: 4px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; overflow-x: auto; }
        #toolbar .tb-sep { width: 1px; align-self: stretch; margin: 4px 6px; background: var(--line); flex: 0 0 auto; }
        /* Toolbar buttons: 30px circles; hover = GROWING WASH in app.css. */
        .tb-btn
        {
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; flex: 0 0 auto;
            border-radius: 50%; border: none; color: var(--text-dim);
            cursor: pointer; padding: 0;
        }
        .tb-btn.active,
        .tb-btn.is-active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--text); }
        /* .tb-select is shared - see TOOLBAR SELECT in app.css. Nothing local. */

        /* Right-margin spinner: the same toolbar control as .tb-select (see TOOLBAR
           SELECT in app.css), but a number box - it has to beat the filled FORM FIELD
           look every <input> gets by default, so every property is restated here. It
           keeps the browser's own up / down arrows: that is what makes it a spinner. */
        .tb-num
        {
            width: 4.6em; height: 30px; flex: 0 0 auto;
            padding: 0 0 0 6px;
            font: inherit; font-size: 0.82rem;
            color: var(--text); background: transparent;
            border: 1px solid var(--line); border-radius: var(--radius-s);
            outline: none;
        }
        .tb-num:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }

        /* Editor host */
        #editorHost { flex: 1 1 auto; min-height: 0; overflow: hidden; }

        /* MARKDOWN PREVIEW
           A .md file opens rendered and read-only; #mdViewBtn swaps this pane for
           the editor and back. The two are never up at once, so they share the slot
           under the toolbar - hence the [hidden] rule (both are flex children, and
           a flex child ignores the UA's own display:none for [hidden]). */
        #editorHost[hidden],
        #preview[hidden] { display: none; }

        #preview
        {
            flex: 1 1 auto; min-height: 0; overflow: auto;
            padding: 26px 22px 72px;
            background: var(--bg); color: var(--text);
            font-family: var(--font-sans); font-size: 15px; line-height: 1.65;
        }
        /* One readable column, centred - a full-width line of prose is unreadable. */
        #preview .md-doc { max-width: 74ch; margin: 0 auto; }

        #preview h1, #preview h2, #preview h3,
        #preview h4, #preview h5, #preview h6 { line-height: 1.25; margin: 1.6em 0 0.5em; font-weight: 700; }
        #preview > .md-doc > :first-child { margin-top: 0; }
        #preview h1 { font-size: 1.9em; color: var(--accent); }
        #preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--line); padding-bottom: 0.2em; }
        #preview h3 { font-size: 1.25em; }
        #preview h4, #preview h5, #preview h6 { font-size: 1em; color: var(--text-dim); }
        #preview p, #preview ul, #preview ol, #preview blockquote, #preview pre, #preview table { margin: 0 0 1em; }
        #preview ul, #preview ol { padding-left: 1.6em; }
        #preview li { margin: 0.25em 0; }
        #preview li > input[type="checkbox"] { margin-right: 0.45em; }   /* GFM task list */
        #preview a { color: var(--accent); }
        #preview blockquote
        {
            border-left: 3px solid var(--accent); margin-left: 0;
            padding: 0.1em 0 0.1em 1em; color: var(--text-dim);
        }
        #preview hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
        #preview img { max-width: 100%; height: auto; border-radius: var(--radius-s); }
        /* An image the reader does not load (remote, or not beside the file): its alt text. */
        #preview .md-img-off
        {
            display: inline-block; padding: 0.1em 0.5em; font-size: 0.9em; color: var(--text-dim);
            border: 1px dashed var(--line); border-radius: var(--radius-s);
        }
        /* Code keeps the editor's face; the block is a raised surface like a card. */
        #preview code
        {
            font-family: var(--font-mono); font-size: 0.88em;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-s); padding: 0.1em 0.35em;
        }
        #preview pre
        {
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--radius-m); padding: 12px 14px; overflow-x: auto;
        }
        #preview pre code { background: none; border: none; padding: 0; font-size: 0.86em; }
        #preview table { border-collapse: collapse; width: 100%; font-size: 0.94em; }
        #preview th, #preview td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
        #preview th { background: var(--card); }

        /* Which glyph is on show follows .active (set by syncMdUI). It is a CSS rule
           rather than a hidden attribute on purpose: the help card clones this button's
           first <svg> (ui.js, introGlyph), and a cloned hidden="" would leave that row
           iconless. Out of the button the rule cannot reach the clone, so it always
           shows the pencil - the right stand-in for "write in the document". */
        #mdViewBtn:not(.active) .md-ic-edit,
        #mdViewBtn.active       .md-ic-read { display: none; }

        /* Phone (see TWO LAYOUT MODES in shared/app.css): the toolbar wraps onto
           more rows instead of scrolling sideways - a scrolling bar hides half its
           buttons with no hint they exist - and its buttons grow to finger size. */
        @media (max-width: 640px)
        {
            #toolbar { flex-wrap: wrap; overflow-x: visible; row-gap: 2px; padding: 4px 6px; }
            #toolbar .tb-sep { margin: 4px 2px; }
            .tb-btn    { width: 36px; height: 36px; }
            .tb-num    { height: 36px; }   /* keeps the row one height - see .tb-select in app.css */
        }

        .CodeMirror
        {
            height: 100%;
            font-family: var(--font-mono);
            font-size: 13px; line-height: 1.5;
        }
        /* Editor chrome is token-driven (cmThemeName() in JS picks dracula in dark,
           default in light, and swaps them on balata:themechange). Scoped under
           #editorHost so it outranks the theme stylesheets' own .cm-s-* rules -
           except dracula's own background, which is !important and therefore wins:
           in dark the sheet stays dracula's #282A36, a shade ABOVE the page. That
           raised look is wanted, so light has to say it out loud: the 'default'
           theme paints no background of its own, so without the rule below the
           sheet would fall through to --bg and melt into the toolbar. --card2 is
           the "text you type into" surface (it is Write's paper too), not white. */
        #editorHost .CodeMirror { background: var(--bg); color: var(--text); }
        #editorHost .CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--line); }
        :root[data-theme="light"] #editorHost .CodeMirror,
        :root[data-theme="light"] #editorHost .CodeMirror-gutters { background: var(--card2); }
        #editorHost .CodeMirror-linenumber { color: var(--text-dim); }
        #editorHost .CodeMirror-activeline-background { background: color-mix(in srgb, var(--text) 5%, transparent); }
        #editorHost .CodeMirror-foldgutter-open:after,
        #editorHost .CodeMirror-foldgutter-folded:after { color: var(--text-dim); }
        #editorHost .CodeMirror-cursor { border-left-color: var(--text); }
        /* Right-margin guide (drawn by updateRuler(), the rulers add-on is not vendored).
           pointer-events off so the line never eats a click meant for the text. */
        .CodeMirror-rulers { position: absolute; left: 0; right: 0; top: -50px; bottom: 0; overflow: hidden; pointer-events: none; }
        /* A fine dotted hairline, half the weight of --line: it has to be findable at a
           glance and invisible while reading, so it is never a solid rule. */
        .CodeMirror-ruler  { position: absolute; top: 0; bottom: 0; border-left: 1px dotted color-mix( in srgb, var(--line) 55%, transparent ); }
        .cm-trailingspace { background: color-mix(in srgb, var(--danger) 28%, transparent); }
        .cm-searching { background: color-mix(in srgb, var(--accent) 35%, transparent) !important; }

        /* Light mode uses CodeMirror's built-in 'default' theme; darken its faintest tokens
           so they stay legible on the warm off-white (--card2) editor sheet. */
        :root[data-theme="light"] .cm-s-default .cm-comment { color: #4E5259; }
        :root[data-theme="light"] .cm-s-default .cm-meta    { color: #5A4A00; }
        :root[data-theme="light"] .cm-s-default .cm-keyword { color: #7A1FA2; }
        :root[data-theme="light"] .cm-s-default .cm-string  { color: #9A1414; }
        :root[data-theme="light"] .cm-s-default .cm-number,
        :root[data-theme="light"] .cm-s-default .cm-atom    { color: #1B5FA6; }

        /* Search / jump-to-line dialog */
        .CodeMirror-dialog
        {
            background: var(--card); color: var(--text);
            border-bottom: 1px solid var(--line); padding: 7px 10px; font-size: 0.85rem;
        }
        /* The search / go-to-line box CodeMirror injects. Nothing local: it is the
           shared text field (app.css, FORM FIELD) like every other one. */

        /* "Guardar como" + "Abrir" dialogs: .sheet / .field / .file-label / .open-list all come from app.css. */
    </style>
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <h1>Text</h1>
            <span id="fileLabel" class="file-label field-edit-text is-editable" data-i18n="ui.untitled" data-i18n-attr="title:text.clickRename"></span>
            <input id="fileNameInput" class="file-label-input field-edit" type="text" style="display:none" autocomplete="off">

            <!-- "Guardado 12:04" (shared/office.js, AUTOSAVE). -->
            <span id="savedAt" class="saved-at"></span>

            <div id="syncIndicator" class="sync-indicator" data-i18n-attr="title:ui.sync.synced"></div>
        </div>

        <div id="toolbar">
            <select id="langSelect" class="tb-select" data-i18n-attr="title:text.langSelect">
                <option value="text/plain" data-i18n="text.plainText"></option>
                <option value="text/html">HTML</option>
                <option value="text/css">CSS</option>
                <option value="text/javascript">JavaScript</option>
                <option value="application/json">JSON</option>
                <option value="application/xml">XML</option>
                <option value="text/x-markdown">Markdown</option>
                <option value="text/x-yaml">YAML</option>
                <option value="text/x-sh">Shell</option>
                <option value="text/x-sql">SQL</option>
                <option value="text/x-python">Python</option>
                <option value="text/x-csrc">C / C++ / Java</option>
                <option value="text/x-properties" data-i18n="text.iniProps"></option>
            </select>

            <!-- Markdown only: swaps the rendered document for the editor. Hidden for
                 every other language (see syncMdUI). The eye is "read it", the pencil
                 "write it": the glyph on show is always the view it takes you to. -->
            <button id="mdViewBtn" class="tb-btn" type="button" hidden>
                <svg class="md-ic-edit" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                <svg class="md-ic-read" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>

            <!-- edit-only like the group it opens: with wrap / indent / margin away,
                 this one would sit right against the next divider. -->
            <div class="tb-sep edit-only"></div>

            <!-- Cut / copy / paste. The keys already do this (CodeMirror's own);
                 these are the same three for a phone or a tablet, where there is
                 no Ctrl to hold. Glyphs are the shared ones (NayiveUI.icon), so
                 they match the entries Write and Calc carry in their Edicion menu. -->
            <button id="cutBtn"   class="tb-btn edit-only" data-i18n-attr="title:ui.cut"></button>
            <button id="copyBtn"  class="tb-btn edit-only" data-i18n-attr="title:ui.copy"></button>
            <button id="pasteBtn" class="tb-btn edit-only" data-i18n-attr="title:ui.paste"></button>

            <div class="tb-sep edit-only"></div>

            <button id="wrapBtn" class="tb-btn edit-only" data-i18n-attr="title:text.wrap">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><polyline points="18 9 21 12 18 15"></polyline><line x1="3" y1="18" x2="12" y2="18"></line></svg>
            </button>
            <select id="indentSelect" class="tb-select edit-only" data-i18n-attr="title:text.indent">
                <option value="4" selected data-i18n="text.indent4"></option>
                <option value="2" data-i18n="text.indent2"></option>
                <option value="tab" data-i18n="text.indentTab"></option>
            </select>
            <input id="marginInput" class="tb-num edit-only" type="number" min="20" max="500" step="1" inputmode="numeric"
                   autocomplete="off" data-i18n-attr="title:text.margin">

            <div class="tb-sep"></div>

            <button id="zoomOutBtn" class="tb-btn" data-i18n-attr="title:text.zoomOut">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>
            <button id="zoomInBtn" class="tb-btn" data-i18n-attr="title:text.zoomIn">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
            </button>

            <div class="tb-sep"></div>

            <button id="newBtn" class="tb-btn" data-i18n-attr="title:write.newDoc">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="12" x2="12" y2="18"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            </button>
            <button id="openBtn" class="tb-btn" data-i18n-attr="title:ui.openDoc">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </button>
            <button id="importBtn" class="tb-btn" data-i18n-attr="title:ui.importDevice">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>

            <!-- AYUDA: the three entries, none of which has a button of its own

                 clicks the one it came from, so there is one set of handlers. -->

                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"></line><line x1="10" y1="20" x2="10" y2="4"></line><line x1="16" y1="20" x2="16" y2="9"></line><line x1="21" y1="20" x2="3" y2="20"></line></svg>
                </button>
                <button id="scBtn" class="tb-btn" type="button" data-i18n-attr="title:write.shortcuts, aria-label:write.shortcuts">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="10" x2="6" y2="10"></line><line x1="10" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="14" y2="10"></line><line x1="18" y1="10" x2="18" y2="10"></line><line x1="7" y1="14" x2="17" y2="14"></line></svg>

        <!-- Ayuda menu - Estadísticas · Atajos de teclado · Botones de la barra.
             Built by wireStaticUI() from #helpTools above (shared/office.js,
             buttonMenu); .top-menu is position:fixed, so it is placed under the

    <!-- Open dialog -->

    <!-- Bottom-centre transient toast (shared .toast styling from theme.css) -->
    <div id="toast" class="toast"></div>

    <script type="module">
        // Nothing is drawn from JS before the dictionary is in: without an
        // in-source fallback, an early render would paint the bare keys.
        await NayiveI18n.ready;

        //------------------------------------------------------------------------//
        // STATE

        const O = NayiveOffice;   // paths, the file label, the Open browser (../shared/office.js)

        // Folder for "Guardar como": Drive's ?dir=<folder>, else the files/ root.
        const APP_DIR = O.appDirFromUrl();

        // Text is the catch-all editor: its "Abrir documento" browser lists every
        // file EXCEPT (a) formats another app owns and (b) known-binary types it
        // could only mangle. Anything else — including unknown or no extension —
        // is shown and opened as UTF-8 text.
        //
        // (a) owned elsewhere — mirrors each app's own extension list:
        //     Write apps/write, Calc apps/calc, Photos apps/photos IMG_EXT,
        //     Music apps/music AUDIO_EXT, Movies apps/movies VIDEO_EXT,
        //     Contact apps/contact (.vcf), Calendar apps/calendar (.ics).
        const OWNED_EXTS = new Set( [
            'docx', 'doc', 'odt', 'rtf',                                  // Write (+ its future convert list)
            'xlsx', 'xls', 'ods', 'csv',                                  // Calc  (+ its future convert list)
            'jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'avif',           // Photos
            'mp3', 'm4a', 'aac', 'ogg', 'oga', 'opus', 'wav', 'flac', 'weba',   // Music
            'mp4', 'm4v', 'webm', 'ogv', 'mov', 'mkv',                    // Movies
            'vcf',                                                        // Contact
            'ics'                                                         // Calendar
        ] );
        // (b) not text at all — opening these as text is never useful.
        const BINARY_EXTS = new Set( [
            'zip', 'tar', 'gz', 'tgz', 'bz2', 'xz', 'zst', '7z', 'rar',
            'epub', 'mobi', 'azw3', 'apk', 'aab', 'ipa', 'deb', 'rpm', 'msi',
            'pdf', 'ppt', 'pptx', 'pps', 'ppsx', 'odp', 'odg',
            'heic', 'heif', 'tif', 'tiff', 'ico', 'psd', 'xcf', 'raw', 'cr2', 'nef', 'arw', 'dng',
            'wma', 'wmv', 'avi', 'flv', '3gp', 'mid', 'midi', 'aiff', 'aif', 'mpg', 'mpeg',
            'ttf', 'otf', 'woff', 'woff2', 'eot',
            'exe', 'dll', 'so', 'dylib', 'bin', 'class', 'jar', 'wasm', 'pyc', 'pyo',
            'sqlite', 'sqlite3', 'db', 'mdb', 'accdb',
            'iso', 'img', 'dmg'
        ] );

        function textCanOpen( path )
        {
            const e = O.extOf( path );
            return ! OWNED_EXTS.has( e ) && ! BINARY_EXTS.has( e );
        }

        // The browser never walks above the user's files/ root (the first path
        // segment of APP_DIR — "files" when Text is opened from the launcher).
        const OPEN_ROOT = APP_DIR.split( '/' )[ 0 ] || 'files';

        let editor         = null;   // CodeMirror instance

        // Offline-capable persistence (../shared/store.js), same as Write. Every
        // save lands in a local IndexedDB cache and a write outbox BEFORE the PUT
        // is attempted, so a caducated session or a dropped connection can no
        // longer lose the text: it goes up on the next flush (reconnect, tab
        // focus, or right after signing in again). Reads come from the network
        // when there is one and from the last-known-good local copy when there is
        // not - a failed GET is never mistaken for "the file is empty".
        // Interface strings: every one of them lives in shared/i18n/*.json.
        const T  = k           => NayiveUI.t( k );
        const TF = ( k, vars ) => NayiveUI.tf( k, vars );

        // conflicts: a save over a file changed on another device since it was
        // opened is refused (shared/store.js, CONFLICTS).
        const store = NayiveStore.createStore( { apiBase: GumApi.API_FILES, conflicts: true } );
        // Wrap and indent are remembered TWICE, the way the language and the menu bar
        // are: in localStorage, so this browser opens the same way with no network,
        // and in the account (data/text/config.json), so the other device opens the
        // way it was left. The device copy is the one that PAINTS - nothing waits on
        // the network - and the account's copy wins as soon as it lands (syncCfg()).
        // Only a first run on a brand-new browser falls back to the phone default:
        // wrapping on, because scrolling code sideways on a phone is miserable.
        const TEXT_CFG   = 'data/text/config.json';
        const textCfg    = O.appConfig( TEXT_CFG, 'ui.prefsUnread' );   // see THE ACCOUNT'S COPY
        const WRAP_KEY   = 'gum_text_wrap';
        const INDENT_KEY = 'gum_text_indent';
        const INDENTS    = [ '4', '2', 'tab' ];
        // A browser that blocks storage throws on the read: start as a first run.
        const readPref   = function( k ) { try { return localStorage.getItem( k ); } catch( _ ) { return null; } };
        const storedWrap = readPref( WRAP_KEY );   // '0' is a real answer, so no `||` here
        let   lineWrap   = ( storedWrap === null ? window.matchMedia( '( max-width: 640px )' ).matches : storedWrap === '1' );
        const storedIdt  = readPref( INDENT_KEY );
        const indentPref = ( INDENTS.includes( storedIdt ) ? storedIdt : '4' );   // a stale value must never reach setIndent()
        let suppressChange = false;   // true while the editor is being loaded programmatically

        // MARKDOWN READER (see that section below). Declared here with the rest of
        // the state: wireStaticUI() reads both before the section's own lines run.
        const MD_MIME   = 'text/x-markdown';
        let   mdReading = false;   // true = the rendered pane is up, the editor is away
        // Which .md the preview's relative links are read beside. The session only
        // knows a file's path after loadText has put it on screen, so while a file
        // is arriving loadText says which one it is (null: ask the session).
        let   mdOpening = null;

        const FONT_KEY = 'gum_text_font_size';
        const FONT_MIN = 9;
        const FONT_MAX = 30;
        let   fontSize = ( parseInt( readPref( FONT_KEY ), 10 ) || 13 );

        // Right margin: the guide line the toolbar spinner moves, in columns of the
        // monospace grid. 132 is the wide-terminal width this editor is written to.
        const MARGIN_KEY = 'gum_text_margin';
        const MARGIN_MIN = 20;
        const MARGIN_MAX = 500;
        let   marginCols = ( parseInt( readPref( MARGIN_KEY ), 10 ) || 132 );

        // The Open browser: a shared widget, this app only says what it lists.
        // The open document - its path, whether it is someone else's, its name,
        // the top-bar label, New / Open / Import / "Guardar como" / rename /
        // Restore, start-up, the header plug and the autosave - is the one Write
        // and Calc use (shared/office.js, THE OPEN DOCUMENT). Text only says how
        // text gets into and out of CodeMirror, which files it can open, and
        // which names it may write.
        const session = O.session( {
            app        : 'text',
            store      : store,
            appDir     : APP_DIR,
            openRoot   : OPEN_ROOT,
            defaultName: T( 'text.defaultFile' ),
            canOpen    : textCanOpen,              // what the Open dialog lists
            emptyKey   : 'text.noTextFiles',
            encode     : function() { return getEditorText(); },
            load       : loadText,
            blank      : blankText,
            finishName : textSaveName,
            onSavedAs  : function( p )
            {
                if( tooBig ) { store.block( p ); return; }   // the copy is just as big: read-only too
                if( editor && ! store.isBlocked( p ) ) editor.setOption( 'readOnly', false );   // a UTF-8 copy is ours to edit (WHAT IS IN THE FILE)
            },
            sameNameRefused: function( name ) { return tooBig ? tooBigText( name ) : NayiveUI.tf( 'text.notUtf8', { name: name } ); },   // "Guardar como" onto the blocked file itself
            onChange   : function() { if( editor ) autoDetectLanguage(); },   // the name says the language
            focus      : function() { if( editor && ! mdReading ) editor.focus(); }
        } );

        //------------------------------------------------------------------------//
        // INITIALIZATION

        wireStaticUI();

        NayiveUI.bootWithStore( store, async function()
        {
            initEditor();

            // Swap CodeMirror's syntax theme when the shared colour scheme is toggled.
            window.addEventListener( 'balata:themechange', function()
            {
                if( editor ) editor.setOption( 'theme', cmThemeName() );
            } );

            syncCfg();   // deliberately NOT awaited: the device's answer is already on screen

            // Drive's "Abrir con" offers Text for any file. One whose name says it
            // is not text is refused before it is even downloaded, and start-up
            // goes on as if it had not been asked for (the rest: loadText).
            const q = new URLSearchParams( location.search );
            if( q.get( 'file' ) && BINARY_EXTS.has( O.extOf( q.get( 'file' ) ) ) )
            {
                notText( q.get( 'file' ) );
                q.delete( 'file' );
                history.replaceState( null, '', location.pathname + ( q.toString() ? '?' + q : '' ) );
            }

            // ?file= / ?import= / the untitled document kept on this device - or a blank one.
            await session.boot();

            if( ! mdReading ) editor.focus();   // caret in the text area on every startup path that shows one
        } );

        function wireStaticUI()
        {
            // New, Open, Import, "Guardar como" and Restore are wired by the session
            // (shared/office.js); the dialogs' × buttons and Escape once for every
            // app by shared/ui.js.

            // Picking Markdown by hand always lands in the editor: it is chosen
            // while writing, so it can never answer by hiding what was written.
            document.getElementById( 'langSelect' ).addEventListener( 'change', function( e ) { setLanguage( e.target.value ); setPreview( false ); editor.focus(); } );
            document.getElementById( 'mdViewBtn'  ).addEventListener( 'click',  function()    { setPreview( ! mdReading ); } );
            document.getElementById( 'preview'    ).addEventListener( 'click',  mdAnchorClick );
            document.getElementById( 'indentSelect' ).addEventListener( 'change', function( e ) { setIndent( e.target.value ); textCfg.write( { indent: e.target.value } ); editor.focus(); } );
            document.getElementById( 'wrapBtn'      ).addEventListener( 'click', toggleWrap );
            wireClipboard();
            document.getElementById( 'wrapBtn'      ).classList.toggle( 'active', lineWrap );   // reflect the remembered choice
            document.getElementById( 'indentSelect' ).value = indentPref;                        // ditto (overrides the option's `selected`)
            syncMdUI();   // the button starts hidden: nothing is open yet
            document.getElementById( 'zoomOutBtn'   ).addEventListener( 'click', function() { bumpFontSize( -1 ); } );
            document.getElementById( 'zoomInBtn'    ).addEventListener( 'click', function() { bumpFontSize(  1 ); } );

            // Ayuda (see AYUDA below): the "?" opens a three-entry menu built
            // from these three hidden buttons. setHelpMenu tells shared/ui.js to
            // leave the click to that menu instead of opening the guide card -
            // the card is the third entry.
            document.getElementById( 'statsBtn' ).addEventListener( 'click', openStats );
            document.getElementById( 'scBtn'    ).addEventListener( 'click', openShortcuts );
            document.getElementById( 'guideBtn' ).addEventListener( 'click', function() { NayiveUI.showIntro(); } );
            O.buttonMenu( { btn: 'helpBtn', menu: 'helpMenu', ids: O.HELP_IDS } );
            NayiveUI.setHelpMenu( true );

            const marginInput = document.getElementById( 'marginInput' );
            marginInput.value = String( marginCols );
            // 'input' (not 'change'): the line follows the arrows as they are clicked.
            // The caret is NOT sent back to the text here - a spinner gets clicked
            // several times in a row, unlike the selects above.
            marginInput.addEventListener( 'input',   function( e ) { setMargin( e.target.value ); } );
            marginInput.addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) editor.focus(); } );
            // min / max only bound the arrows; a typed 5 or 600 has to be put right in
            // the box too, or it would disagree with the line. 'change' = on blur/Enter.
            marginInput.addEventListener( 'change',  function( e ) { e.target.value = String( marginCols ); } );

            // Ctrl+S is CodeMirror's (extraKeys) while the text has the keys. Anywhere
            // else - the Markdown reader above all - it still saves, and never opens
            // the browser's own "Save page"; over a dialog it just does nothing.
            document.addEventListener( 'keydown', function( e )
            {
                if( e.defaultPrevented || e.code !== 'KeyS' || ! ( e.ctrlKey || e.metaKey ) || e.altKey || e.shiftKey ) return;
                e.preventDefault();
                if( ! document.querySelector( '.sheet-backdrop.open' ) ) saveNow();
            } );
        }

        //------------------------------------------------------------------------//
        // AYUDA  -  the "?" menu: Estadisticas, Atajos de teclado, Botones de la barra
        //
        // The same three entries Write and Calc carry, and the same two sheets
        // (shared/office.js, showStats / showShortcuts). Text writes no menu of
        // its own: O.buttonMenu mirrors the hidden #helpTools buttons, exactly
        // as the other two editors mirror their file buttons.

        const IS_MAC = NayiveUI.isMac;
        const MOD    = IS_MAC ? '⌘' : 'Ctrl+';

        // CodeMirror's own keys (its default keymap, the search and
        // jump-to-line add-ons) plus the four bound by hand in extraKeys above.
        // Only keys that really work here go in the sheet.
        function shortcutRows()
        {
            const SHIFT   = IS_MAC ? '⇧' : T( 'ui.keyShift' ) + '+';
            const replace = IS_MAC ? '⌘⌥F' : SHIFT + MOD + 'F';   // Cmd-Alt-F on a Mac

            return [
                [ 'write.sc.save',      MOD + 'S'        ],
                [ 'text.sc.selectAll',  MOD + 'A'        ],
                [ 'ui.undo',            MOD + 'Z'        ],
                [ 'ui.redo',            MOD + 'Y'        ],
                [ 'ui.cut',             MOD + 'X'        ],
                [ 'ui.copy',            MOD + 'C'        ],
                [ 'ui.paste',           MOD + 'V'        ],
                [ 'write.sc.find',      MOD + 'F'        ],
                [ 'text.sc.findNext',   MOD + 'G'        ],
                [ 'text.sc.findPrev',   SHIFT + MOD + 'G' ],
                [ 'write.sc.replace',   replace          ],
                [ 'text.sc.goLine',     'Alt+G'          ],
                [ 'text.sc.comment',    MOD + '/'        ],
                // Bound as Ctrl-Q only, so it stays Ctrl even on a Mac.
                [ 'text.sc.fold',       'Ctrl+Q'         ],
                [ 'text.sc.zoomIn',     MOD + '+'        ],
                [ 'text.sc.zoomOut',    MOD + '-'        ]
            ].map( function( r ) { return { text: T( r[ 0 ] ), keys: r[ 1 ] }; } );
        }

        function openShortcuts() { O.showShortcuts( shortcutRows() ); }

        // Read on open, not live: a counter that follows every keystroke would
        // walk the whole document on each one.
        function openStats()
        {
            const txt   = editor ? editor.getValue() : '';
            const words = txt.trim() ? txt.trim().split( /\s+/ ).length : 0;
            const n     = function( x ) { return x.toLocaleString( NayiveI18n.locale() ); };

            O.showStats( [
                { text: T( 'text.statLines'       ), value: n( editor ? editor.lineCount() : 0 ) },
                { text: T( 'write.statWords'      ), value: n( words ) },
                { text: T( 'write.statChars'      ), value: n( txt.length ) },
                { text: T( 'write.statCharsNoSp'  ), value: n( txt.replace( /\s/g, '' ).length ) }
            ], T( 'text.statNote' ) );
        }

        //------------------------------------------------------------------------//
        // THE ACCOUNT'S COPY
        //
        // Wrap and indent belong to the PERSON, not to the screen: pick two-space
        // indenting on the PC and the tablet should follow. So beside the device
        // copy in localStorage they are kept in data/text/config.json, exactly as
        // Write and Calc keep theirs (textCfg: shared/office.js, appConfig).
        // Read-modify-write, so a key added to this file later (a default folder,
        // say) is never clobbered; when it cannot be read nothing is written -
        // the device copy has the change already, the account's is left alone.

        // Boot only, and one way: it APPLIES what the account says and never writes
        // back, so two devices cannot push each other in circles.
        async function syncCfg()
        {
            let cfg;
            try { cfg = await textCfg.read(); }
            catch( _ ) { return; }   // offline, or unreadable: the device copy stands

            if( typeof cfg.wrap === 'boolean' && cfg.wrap !== lineWrap ) applyWrap( cfg.wrap );

            if( INDENTS.includes( cfg.indent ) && cfg.indent !== document.getElementById( 'indentSelect' ).value )
            {
                document.getElementById( 'indentSelect' ).value = cfg.indent;
                setIndent( cfg.indent );
            }
        }

        //------------------------------------------------------------------------//
        // THE CLIPBOARD
        //
        // Ctrl-X / Ctrl-C / Ctrl-V already work: CodeMirror keeps a hidden
        // textarea behind the document and the browser's own clipboard acts on
        // that. These three buttons are the same three actions for a phone or a
        // tablet, where there is no Ctrl to hold.
        //
        // Plain text both ways, unlike Write and Calc: a .txt, a .js or a .md
        // has no style to carry, so there is nothing for a rich format to keep.

        function wireClipboard()
        {
            const btns = [ [ 'cutBtn', 'cut', () => clipCopy( true ) ],
                           [ 'copyBtn', 'copy', () => clipCopy( false ) ],
                           [ 'pasteBtn', 'paste', clipPaste ] ];

            for( const [ id, ic, run ] of btns )
            {
                const b = document.getElementById( id );
                b.innerHTML = NayiveUI.icon( ic );
                b.querySelector( 'svg' ).setAttribute( 'width',  '17' );
                b.querySelector( 'svg' ).setAttribute( 'height', '17' );
                b.addEventListener( 'click', run );
            }
        }

        async function clipCopy( andCut )
        {
            const sel = editor ? editor.getSelection() : '';

            if( ! sel ) { NayiveUI.toast( T( 'write.selectTextFirst' ) ); return; }

            if( ! await O.clip.write( sel ) ) { NayiveUI.toast( T( 'ui.clipboardBlocked' ) ); return; }

            if( andCut && ! editor.getOption( 'readOnly' ) ) editor.replaceSelection( '' );   // the API edits even a read-only file

            editor.focus();
        }

        async function clipPaste()
        {
            if( ! editor || editor.getOption( 'readOnly' ) ) return;   // the API edits even a read-only file

            const text = await O.clip.text();

            if( text === null ) { NayiveUI.toast( T( 'ui.clipboardBlocked' ) ); return; }
            if( ! text ) return;

            // 'end' leaves the caret after what was pasted, where the next
            // keystroke belongs - CodeMirror's default is to select it instead.
            editor.replaceSelection( text, 'end' );
            editor.focus();
        }

        //------------------------------------------------------------------------//
        // EDITOR

        // Syntax theme follows the shared colour scheme: dracula on dark, CodeMirror's
        // built-in light 'default' on light. The editor chrome is token-driven in CSS.
        function cmThemeName()
        {
            return document.documentElement.dataset.theme === 'light' ? 'default' : 'dracula';
        }

        // The find / replace / go-to bars speak the interface language (CodeMirror's
        // own words are English).
        function cmPhrases()
        {
            return {
                'Search:'                            : T( 'text.cm.search' ),
                '(Use /re/ syntax for regexp search)': T( 'text.cm.reHint' ),
                'Replace:'                           : T( 'text.cm.replace' ),
                'Replace all:'                       : T( 'text.cm.replaceAll' ),
                'With:'                              : T( 'text.cm.with' ),
                'Replace with:'                      : T( 'text.cm.replaceWith' ),
                'Replace?'                           : T( 'text.cm.replaceQ' ),
                'Yes'                                : T( 'text.cm.yes' ),
                'No'                                 : T( 'text.cm.no' ),
                'All'                                : T( 'text.cm.all' ),
                'Stop'                               : T( 'text.cm.stop' ),
                'Jump to line:'                      : T( 'text.cm.jumpTo' ),
                '(Use line:column or scroll% syntax)': T( 'text.cm.lineHint' )
            };
        }

        function initEditor()
        {
            editor = CodeMirror.fromTextArea( document.getElementById( 'editor' ),
            {
                theme            : cmThemeName(),
                mode              : null,
                lineNumbers       : true,
                lineWrapping      : lineWrap,
                indentUnit        : 4,
                tabSize            : 4,
                indentWithTabs    : false,
                smartIndent        : true,
                matchBrackets      : true,
                autoCloseBrackets  : true,
                autoCloseTags      : true,
                matchTags          : { bothTags: true },
                styleActiveLine    : true,
                showTrailingSpace  : true,
                foldGutter         : true,
                gutters            : [ 'CodeMirror-linenumbers', 'CodeMirror-foldgutter' ],
                placeholder        : T( 'text.emptyDoc' ),
                phrases            : cmPhrases(),
                extraKeys          :
                {
                    'Ctrl-S'      : function() { saveNow(); },
                    'Cmd-S'       : function() { saveNow(); },
                    'Ctrl-/'      : 'toggleComment',
                    'Cmd-/'       : 'toggleComment',
                    'Ctrl-Q'      : function( cm ) { cm.foldCode( cm.getCursor() ); },
                    'Ctrl-=' : function() { bumpFontSize(  1 ); },
                    'Cmd-='  : function() { bumpFontSize(  1 ); },
                    'Ctrl--' : function() { bumpFontSize( -1 ); },
                    'Cmd--'  : function() { bumpFontSize( -1 ); },
                    'Shift-Tab'   : 'indentLess',
                    'Tab'         : function( cm )
                    {
                        if( cm.somethingSelected() ) cm.indentSelection( 'add' );
                        else                          cm.execCommand( cm.getOption( 'indentWithTabs' ) ? 'insertTab' : 'insertSoftTab' );
                    }
                }
            });

            editor.on( 'change', scheduleAutosave );
            // Every redraw that can move the text grid - a zoom, a resize, the first
            // paint, a theme swap - ends in a refresh, so the guide line is redrawn
            // from one place instead of from each of them.
            editor.on( 'refresh', updateRuler );
            setIndent( indentPref );   // the options above are the first-run values; this is what was chosen last
            editor.setSize( '100%', '100%' );
            applyFontSize();
            updateRuler();
        }

        // Editor-only zoom: overrides the .CodeMirror font-size and persists the choice.
        function applyFontSize()
        {
            editor.getWrapperElement().style.fontSize = fontSize + 'px';
            editor.refresh();

            // The reader shares the zoom buttons. Prose wants a little more room than
            // code at the same setting, so it sits two points above the editor.
            document.getElementById( 'preview' ).style.fontSize = ( fontSize + 2 ) + 'px';

            try { localStorage.setItem( FONT_KEY, String( fontSize ) ); } catch( _ ) {}
        }

        function bumpFontSize( delta )
        {
            const next = Math.max( FONT_MIN, Math.min( FONT_MAX, fontSize + delta ) );

            if( next === fontSize ) return;

            fontSize = next;
            applyFontSize();
            editor.focus();
        }

        // RIGHT MARGIN
        //
        // The guide line at column `marginCols`. CodeMirror's own rulers add-on is not
        // vendored, so this is its logic in miniature: one absolutely-positioned strip
        // inside the line space, its left edge at the first column's x plus N character
        // widths - which is exact, the editor font being monospace.
        function updateRuler()
        {
            if( ! editor ) return;

            const d = editor.display;
            let   box = d.lineSpace.querySelector( ':scope > .CodeMirror-rulers' );

            if( ! box )
            {
                box = document.createElement( 'div' );
                box.className = 'CodeMirror-rulers';
                box.appendChild( document.createElement( 'div' ) ).className = 'CodeMirror-ruler';
                d.lineSpace.insertBefore( box, d.cursorDiv );
            }

            const left = editor.charCoords( CodeMirror.Pos( editor.firstLine(), 0 ), 'div' ).left;

            box.style.minHeight       = ( d.scroller.offsetHeight + 30 ) + 'px';
            box.firstChild.style.left = ( left + marginCols * editor.defaultCharWidth() ) + 'px';
        }

        function setMargin( value )
        {
            const n = parseInt( value, 10 );

            if( ! n ) return;   // mid-typing the box can be empty - keep the last good line

            marginCols = Math.max( MARGIN_MIN, Math.min( MARGIN_MAX, n ) );
            updateRuler();

            try { localStorage.setItem( MARGIN_KEY, String( marginCols ) ); } catch( _ ) {}
        }

        // Lines end as the file ends them: CodeMirror reads "\r\n" and hands back
        // "\n", so a Windows file would change on every line at its first save.
        let eol = '\n';

        function setEditorText( text )
        {
            editor.setOption( 'readOnly', false );   // another document: only loadText says it is not ours to write
            tooBig = false;
            eol = ( text || '' ).indexOf( '\r\n' ) !== -1 ? '\r\n' : '\n';
            suppressChange = true;
            editor.setValue( text || '' );
            editor.clearHistory();
            suppressChange = false;
            editor.refresh();
        }

        function getEditorText()
        {
            return editor.getValue( eol );
        }

        // The MIMEs the language <select> offers — also the only values setLanguage()
        // ever puts on the editor, so the toolbar and the highlighting never disagree.
        const SELECT_MIMES = Array.from( document.getElementById( 'langSelect' ).options ).map( function( o ) { return o.value; } );

        // File extension → one of SELECT_MIMES. Kept explicit (rather than leaning on
        // meta.js alone) so the mapping stays predictable and web-file focused; meta.js
        // is only consulted as a fallback for the long tail. Unknown types stay plain text.
        const EXT_MIME =
        {
            html: 'text/html', htm: 'text/html', xhtml: 'text/html',
            css: 'text/css',
            js: 'text/javascript', mjs: 'text/javascript', cjs: 'text/javascript', jsx: 'text/javascript',
            json: 'application/json', map: 'application/json', webmanifest: 'application/json',
            xml: 'application/xml', xsl: 'application/xml', xsd: 'application/xml', svg: 'application/xml', rss: 'application/xml',
            md: 'text/x-markdown', markdown: 'text/x-markdown', mkd: 'text/x-markdown',
            yaml: 'text/x-yaml', yml: 'text/x-yaml',
            sh: 'text/x-sh', bash: 'text/x-sh', zsh: 'text/x-sh', ksh: 'text/x-sh',
            sql: 'text/x-sql',
            py: 'text/x-python', pyw: 'text/x-python',
            c: 'text/x-csrc', h: 'text/x-csrc', cpp: 'text/x-csrc', cc: 'text/x-csrc', cxx: 'text/x-csrc',
            hpp: 'text/x-csrc', hh: 'text/x-csrc', java: 'text/x-csrc', cs: 'text/x-csrc',
            ini: 'text/x-properties', conf: 'text/x-properties', cfg: 'text/x-properties',
            properties: 'text/x-properties', toml: 'text/x-properties', env: 'text/x-properties'
        };

        function detectMime( fileName )
        {
            const name = O.baseName( fileName );
            const ext  = O.extOf( name );

            if( EXT_MIME[ ext ] ) return EXT_MIME[ ext ];

            const info = CodeMirror.findModeByFileName( name );
            const mime = info && ( info.mime || ( info.mimes && info.mimes[0] ) );

            return SELECT_MIMES.includes( mime ) ? mime : 'text/plain';
        }

        function setLanguage( mime )
        {
            const m = SELECT_MIMES.includes( mime ) ? mime : 'text/plain';
            editor.setOption( 'mode', m === 'text/plain' ? null : m );   // null = plain, avoids CM's "no mode" warning
            document.getElementById( 'langSelect' ).value = m;

            // Leaving Markdown behind can never leave the reader up; entering it
            // does NOT open the reader by itself - only a file arriving does
            // (loadText). Renaming "notas" to "notas.md" while typing comes
            // through here, and must not snatch the text away mid-sentence.
            if( m !== MD_MIME ) setPreview( false );
            else                syncMdUI();
        }

        function autoDetectLanguage()
        {
            setLanguage( detectMime( session.path() || session.name() || '' ) );
        }

        function setIndent( value )
        {
            if( value === 'tab' )
            {
                editor.setOption( 'indentWithTabs', true );
                editor.setOption( 'indentUnit', 4 );
                editor.setOption( 'tabSize', 4 );
            }
            else
            {
                const n = parseInt( value, 10 ) || 4;
                editor.setOption( 'indentWithTabs', false );
                editor.setOption( 'indentUnit', n );
                editor.setOption( 'tabSize', n );
            }

            try { localStorage.setItem( INDENT_KEY, value ); } catch( _ ) {}
        }

        // Apply + remember on this device. Says nothing to the account: syncCfg()
        // calls this too, and that one must not write back.
        function applyWrap( on )
        {
            lineWrap = on;
            editor.setOption( 'lineWrapping', lineWrap );
            document.getElementById( 'wrapBtn' ).classList.toggle( 'active', lineWrap );

            try { localStorage.setItem( WRAP_KEY, lineWrap ? '1' : '0' ); } catch( _ ) {}
        }

        function toggleWrap()
        {
            applyWrap( ! lineWrap );
            textCfg.write( { wrap: lineWrap } );
            editor.focus();
        }

        //------------------------------------------------------------------------//
        // MARKDOWN READER
        //
        // Markdown is the one language Text can show the way it is meant to be read,
        // so a .md file opens rendered and read-only and #mdViewBtn is what lets you
        // write in it. Nothing is re-rendered while you type: the pane is only built
        // on the way into it, which also keeps a long document from re-parsing on
        // every keystroke.

        function isMarkdown()
        {
            return document.getElementById( 'langSelect' ).value === MD_MIME;
        }

        // The only door between the two views. `on` is a request - it is granted
        // only while the document really is Markdown.
        function setPreview( on )
        {
            mdReading = !! on && isMarkdown();

            document.getElementById( 'editorHost' ).hidden = mdReading;
            document.getElementById( 'preview'    ).hidden = ! mdReading;

            if( mdReading )
            {
                renderPreview();
            }
            else if( editor )
            {
                editor.refresh();   // it was display:none - CodeMirror measured nothing
                editor.focus();
            }

            syncMdUI();
        }

        // The toolbar follows the view: the button appears for Markdown only, its
        // glyph shows where it takes you, and the controls that act on the source
        // (wrap, indent, right margin) step aside while the document is being read.
        function syncMdUI()
        {
            const md  = isMarkdown();
            const btn = document.getElementById( 'mdViewBtn' );

            btn.hidden = ! md;
            btn.classList.toggle( 'active', mdReading );
            btn.title  = T( mdReading ? 'text.mdEdit' : 'text.mdRead' );

            document.querySelectorAll( '#toolbar .edit-only' ).forEach( function( el ) { el.hidden = mdReading; } );
        }

        // marked hands raw HTML straight through, and a .md can arrive from an
        // upload or a shared folder, so the tree is cleaned before it is shown.
        // It is an ALLOW-list: only the plain HTML a document is made of stays,
        // and only the attributes that shape it. Anything else is a way in -
        // <svg><style> restyles the whole page, <svg><set href="javascript:">
        // runs on a click, a style="" or an id="" reaches outside the preview.
        const HTML_NS = 'http://www.w3.org/1999/xhtml';

        const MD_TAGS = new Set( [ 'a', 'abbr', 'b', 'bdi', 'bdo', 'blockquote', 'br', 'caption', 'cite', 'code',
                                   'col', 'colgroup', 'dd', 'del', 'details', 'dfn', 'div', 'dl', 'dt', 'em',
                                   'figcaption', 'figure', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr', 'i', 'img',
                                   'input', 'ins', 'kbd', 'li', 'mark', 'ol', 'p', 'pre', 'q', 'rp', 'rt', 'ruby',
                                   's', 'samp', 'small', 'span', 'strong', 'sub', 'summary', 'sup', 'table',
                                   'tbody', 'td', 'tfoot', 'th', 'thead', 'time', 'tr', 'u', 'ul', 'var', 'wbr' ] );

        // Not allowed and not worth reading either: gone with all they hold. Any
        // other unknown tag (<font>, <center>...) steps aside and keeps its text.
        const MD_GONE = new Set( [ 'script', 'style', 'template', 'svg', 'math', 'iframe', 'frame', 'frameset',
                                   'object', 'embed', 'applet', 'noscript', 'noembed', 'noframes', 'textarea',
                                   'select', 'option', 'datalist', 'button', 'title', 'head', 'link', 'meta',
                                   'base', 'xmp', 'plaintext', 'audio', 'video', 'source', 'track', 'canvas', 'dialog' ] );

        // Attributes that only describe; src and href go through mdUrl() below.
        const MD_ATTRS = new Set( [ 'title', 'lang', 'dir', 'align', 'colspan', 'rowspan', 'start', 'reversed',
                                    'alt', 'width', 'height', 'open', 'datetime', 'cite' ] );

        function sanitize( root, mdPath )
        {
            Array.from( root.children ).forEach( function( el )
            {
                const tag = el.localName;

                // An <svg>/<math> child is not HTML even when its name looks like it.
                if( el.namespaceURI !== HTML_NS || MD_GONE.has( tag ) ) { el.remove(); return; }

                if( ! MD_TAGS.has( tag ) )
                {
                    sanitize( el, mdPath );
                    el.replaceWith( ...el.childNodes );
                    return;
                }

                // The one <input> worth keeping: a GFM task box, and only as a box.
                if( tag === 'input' )
                {
                    if( ( el.getAttribute( 'type' ) || '' ).toLowerCase() !== 'checkbox' ) { el.remove(); return; }
                    const on = el.hasAttribute( 'checked' );
                    Array.from( el.attributes ).forEach( function( at ) { el.removeAttribute( at.name ); } );
                    el.type     = 'checkbox';
                    el.checked  = on;
                    el.disabled = true;
                    if( on ) el.setAttribute( 'checked', '' );
                    return;
                }

                Array.from( el.attributes ).forEach( function( at )
                {
                    const name = at.name;

                    if( name === 'id' || name === 'name' )
                    {
                        // Kept as an anchor for "#section" links, but never as a real
                        // id: <img id="preview"> would stand in for the app's own.
                        if( ! el.hasAttribute( 'data-md-anchor' ) ) el.setAttribute( 'data-md-anchor', at.value );
                        el.removeAttribute( name );
                    }
                    else if( name === 'data-md-anchor' )
                    {
                        // set just above, by this same element's id
                    }
                    else if( name === 'class' && tag === 'code' && /^language-[\w+#.-]+$/.test( at.value ) )
                    {
                        // marked's fence language: harmless, and says what the code is
                    }
                    else if( name === 'src' && tag === 'img' )
                    {
                        const url = mdUrl( at.value, mdPath, 'img' );
                        if( url ) el.setAttribute( 'src', url );
                        else      el.removeAttribute( 'src' );
                    }
                    else if( name === 'href' && tag === 'a' )
                    {
                        const url = mdUrl( at.value, mdPath, 'a' );
                        if( url ) el.setAttribute( 'href', url );
                        else      el.removeAttribute( 'href' );
                    }
                    else if( ! MD_ATTRS.has( name ) )
                    {
                        el.removeAttribute( name );
                    }
                } );

                // An image that was not let in says what it was instead of loading.
                if( tag === 'img' && ! el.hasAttribute( 'src' ) )
                {
                    const ph = document.createElement( 'span' );
                    ph.className   = 'md-img-off';
                    ph.textContent = el.getAttribute( 'alt' ) || T( 'text.mdImgOff' );
                    ph.title       = T( 'text.mdImgOff' );
                    el.replaceWith( ph );
                    return;
                }

                // Links leave for a new tab: this one holds an open document. A
                // "#section" link stays here - mdAnchorClick() scrolls to it.
                if( tag === 'a' && el.hasAttribute( 'href' ) && ! el.getAttribute( 'href' ).startsWith( '#' ) )
                {
                    el.target = '_blank';
                    el.rel    = 'noopener noreferrer';
                }

                sanitize( el, mdPath );
            } );
        }

        // What a src/href in the document may point at, or null for nothing:
        //   - beside the .md (a relative path): the file itself, through the file
        //     API, or - a link to text - that file opened in Text;
        //   - an image: only that, or a data:image. Anything else is another
        //     request made in the reader's name: a remote image tells a stranger
        //     the reader's IP, a same-origin one (/api/...) acts as the reader;
        //   - a link: also the web (http/https/mailto/tel) and "#section" - but
        //     never another page of this server: that is the reader's session.
        const MD_IMG_EXTS = new Set( [ 'png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'svg', 'bmp', 'ico' ] );

        function mdUrl( raw, mdPath, kind )
        {
            // What a browser keeps of it: the ends trimmed of spaces and control
            // characters, tabs and line breaks dropped. That is what is handed on
            // ("mailto:x?subject=hi there" keeps its space) ...
            const b = String( raw ).replace( /^[\u0000-\u0020]+|[\u0000-\u0020]+$/g, '' ).replace( /[\t\n\r]/g, '' );
            // ... and what is judged is stricter: every blank and control character
            // out, so "java script:" cannot pass for anything but a scheme.
            const v = b.replace( /[\s\u0000-\u001F]/g, '' );
            if( ! v ) return null;

            if( v.startsWith( '#' ) ) return kind === 'a' ? b : null;

            const scheme = /^([a-z][a-z0-9+.-]*):/i.exec( v );

            // "\" is a "/" to a browser: "\\host\x.png" is as remote as "//host/x.png".
            if( scheme || /^[\/\\]/.test( v ) )
            {
                let u;
                try { u = new URL( b, location.href ); } catch( _ ) { return null; }

                if( kind === 'img' )
                    return ( u.protocol === 'data:' && /^data:image\//i.test( v ) ) ? b : null;

                if( u.protocol === 'mailto:' || u.protocol === 'tel:' ) return b;
                if( u.protocol !== 'http:' && u.protocol !== 'https:' ) return null;
                if( u.origin === location.origin ) return null;   // "/%61pi/..." is /api/ to the server
                return u.href;
            }

            // Relative: beside the .md - without its ?query, never above the top
            // folder it lives in ("files", or "shared/<slug>" for someone else's).
            // Untitled text has no "beside".
            if( ! mdPath ) return null;

            const parts = mdPath.split( '/' ).slice( 0, -1 );
            const top   = ( parts[ 0 ] === 'shared' ? 2 : 1 );
            const hash  = b.indexOf( '#' ) === -1 ? '' : b.slice( b.indexOf( '#' ) );

            if( parts.length < top ) return null;

            for( const seg of b.split( /[?#]/ )[ 0 ].split( '/' ) )
            {
                let s;
                try { s = decodeURIComponent( seg ); } catch( _ ) { return null; }

                if( s === '' || s === '.' ) continue;
                if( s === '..' ) { if( parts.length <= top ) return null; parts.pop(); continue; }
                if( s.includes( '/' ) || s.includes( '\\' ) ) return null;
                parts.push( s );
            }

            const path = parts.join( '/' );
            if( parts.length <= top || path === mdPath.split( '/' ).slice( 0, -1 ).join( '/' ) ) return null;

            // An <img> is fetched whole: a film beside the .md is not an image.
            if( kind === 'img' ) return MD_IMG_EXTS.has( O.extOf( path ) ) ? GumApi.fileUrl( path ) : null;

            // Text reads the #part too (mdScrollTo, once the file is on screen).
            if( textCanOpen( path ) ) return location.pathname + '?file=' + encodeURIComponent( path ) + hash;
            return GumApi.fileUrl( path );
        }

        // Headings get the anchor GitHub gives them ("## Dos palabras" ->
        // #dos-palabras; a repeated one -1, -2...), so "#section" links written
        // for GitHub land here too.
        function mdAnchors( root )
        {
            const seen = new Map();

            root.querySelectorAll( 'h1, h2, h3, h4, h5, h6' ).forEach( function( h )
            {
                if( h.hasAttribute( 'data-md-anchor' ) ) return;

                const base = h.textContent.trim().toLowerCase()
                              .replace( /[^\p{L}\p{N}\s_-]/gu, '' ).replace( /\s/g, '-' );
                const n    = seen.get( base ) || 0;

                seen.set( base, n + 1 );
                h.setAttribute( 'data-md-anchor', n ? base + '-' + n : base );
            } );
        }

        // A "#section" link scrolls the preview, not a new tab.
        function mdAnchorClick( e )
        {
            const a = e.target.closest( 'a[href^="#"]' );
            if( ! a ) return;

            e.preventDefault();
            mdScrollTo( a.getAttribute( 'href' ) );
        }

        // "#section" -> that heading (or id/name) brought to the top of the preview.
        function mdScrollTo( hash )
        {
            let want = hash.slice( 1 );
            try { want = decodeURIComponent( want ); } catch( _ ) {}
            if( ! want ) return;

            const all = Array.from( document.querySelectorAll( '#preview [data-md-anchor]' ) );
            const hit = all.find( function( el ) { return el.getAttribute( 'data-md-anchor' ) === want; } ) ||
                        all.find( function( el ) { return el.getAttribute( 'data-md-anchor' ).toLowerCase() === want.toLowerCase(); } );

            if( hit ) hit.scrollIntoView( { block: 'start' } );
        }

        function renderPreview()
        {
            const pane = document.getElementById( 'preview' );
            const doc  = pane.querySelector( '.md-doc' );

            // Parsed into a <template>: its content is inert, so an <img onerror> or
            // an <iframe src> in the source never runs or fetches - not even for the
            // instant between building the tree and cleaning it.
            const tpl = document.createElement( 'template' );

            tpl.innerHTML = marked.parse( getEditorText() );
            sanitize( tpl.content, mdOpening !== null ? mdOpening : ( session.path() || '' ) );
            mdAnchors( tpl.content );

            doc.replaceChildren( tpl.content );
            pane.scrollTop = 0;

            // Opened from another .md's "other.md#part" link: straight to the part.
            if( mdOpening && location.hash ) mdScrollTo( location.hash );
        }

        //------------------------------------------------------------------------//
        // AUTOSAVE

        // Every edit lands here. Someone else's file and an untitled one (the
        // device draft) are the session's business.
        function scheduleAutosave()
        {
            if( suppressChange ) return;   // programmatic load, not a user edit
            session.edited();
        }

        // Ctrl-S. A shared (read-only) or untitled document goes to "Guardar como" -
        // and so does one that is not UTF-8 (WHAT IS IN THE FILE): its UTF-8 copy.
        function saveNow()
        {
            const why = store.isBlocked( session.path() );
            if( why === 'loading' ) return;   // still being read: nothing to save yet
            if( why && tooBig ) { NayiveUI.toast( tooBigText( O.baseName( session.path() ) ), { ms: 5000 } ); return; }   // a copy would be just as big
            if( why ) { session.openSaveAs(); return; }
            session.saveNow();
        }

        //------------------------------------------------------------------------//
        // THE TEXT AS A FILE  (what the session in shared/office.js needs from Text)

        // A body on screen: text from the store or the device draft, bytes from
        // an import or the .bak copy. `name` is the document's path or file name -
        // the session only sets session.path() after this returns, so the language
        // (and with it the Markdown reader) is decided from the name it hands over.
        // Throws, with nothing on screen changed, for a file that is not text.
        async function loadText( body, name, how )
        {
            if( BINARY_EXTS.has( O.extOf( name || '' ) ) ) throw notText( name );

            let text = body, enc = 'UTF-8';

            if( typeof body !== 'string' )
            {
                ( { text, enc } = decodeText( body instanceof Uint8Array ? body : new Uint8Array( body ), name ) );
            }
            else if( how === 'open' )
            {
                // Read by the store as UTF-8 (see WHAT IS IN THE FILE).
                const nul = body.slice( 0, SNIFF_BYTES ).indexOf( '\u0000' ) !== -1;

                if( body.indexOf( '\uFFFD' ) !== -1 )
                {
                    // The bytes the store's text came from - never the offline
                    // copy (X-Nayive-Copy): an older version that reads as good
                    // UTF-8 would open editable, and its next save carry the
                    // store's newer version tag over the newer file. Such a copy
                    // is "no bytes": read-only.
                    try
                    {
                        const got = await GumApi.readVersion( name, { bytes: true } );
                        if( got.offline ) throw new Error( 'offline copy' );
                        ( { text, enc } = decodeText( got.body, name ) );
                    }
                    catch( e )
                    {
                        if( e.said ) throw e;                 // the bytes say it is not text
                        if( nul )    throw notText( name );   // no bytes (offline), but the NUL says enough
                        enc = '';                             // no bytes: no way to tell
                    }
                }
                else if( nul ) throw notText( name );
            }

            setEditorText( text );
            setLanguage( detectMime( name || '' ) );
            mdOpening = ( how === 'open' || how === 'restore' ) ? name : '';   // an import or a draft is nowhere yet
            try     { setPreview( isMarkdown() ); }   // a .md file opens as a document, not as source
            finally { mdOpening = null; }

            // Too big to autosave: every save sends the whole text again (a 300 MB
            // log, over and over). It opens to read; nothing is written back.
            if( how === 'open' && ( text || '' ).length > TOO_BIG )
            {
                store.block( name );
                tooBig = true;
                editor.setOption( 'readOnly', true );
                NayiveUI.toast( tooBigText( O.baseName( name ) ), { ms: 5000 } );
            }
            // Not UTF-8, or no way to tell: on screen as it really reads, but a
            // save would write it back as UTF-8 - so it is not written at all.
            else if( how === 'open' && enc !== 'UTF-8' )
            {
                store.block( name );
                editor.setOption( 'readOnly', true );
                NayiveUI.toast( TF( 'text.notUtf8', { name: O.baseName( name ) } ), { ms: 5000 } );
            }

            // "Restaurar" has already put what was on screen into the .bak: the
            // copy coming back must be saved, even over a file opened read-only.
            if( how === 'restore' && store.isBlocked( name ) === 'bad' ) store.unblock( name );
        }

        //------------------------------------------------------------------------//
        // WHAT IS IN THE FILE
        //
        // The store reads every file as UTF-8, and a byte that is not UTF-8 comes
        // back as U+FFFD: "caña" in Windows-1252 arrives as "ca�a", and the first
        // edit would save the loss for good. So a file that arrives with one is
        // read again as bytes and decoded for what it is - UTF-16 by its BOM,
        // UTF-8, or else Windows-1252 (Latin-1 and more: every byte is a
        // character, so nothing is lost) - and opened READ-ONLY, because the
        // store can only write UTF-8 back; "Guardar como" makes a UTF-8 copy.
        // An import or a restored copy is new text, so it is simply decoded.
        // Bytes that are not text at all - a NUL in the first 8 KB, the test git
        // uses - are refused.

        const SNIFF_BYTES = 8000;
        const TOO_BIG     = 20e6;   // characters: above this a file opens read-only (see loadText)
        let   tooBig      = false;  // the document on screen is one of those (setEditorText clears it)

        function tooBigText( name ) { return TF( 'text.tooBig', { name: name, mb: Math.round( TOO_BIG / 1e6 ) } ); }

        // bytes -> { text, enc }; throws notText() for a binary file.
        function decodeText( bytes, name )
        {
            if( bytes[ 0 ] === 0xFF && bytes[ 1 ] === 0xFE ) return { text: new TextDecoder( 'utf-16le' ).decode( bytes ), enc: 'UTF-16' };
            if( bytes[ 0 ] === 0xFE && bytes[ 1 ] === 0xFF ) return { text: new TextDecoder( 'utf-16be' ).decode( bytes ), enc: 'UTF-16' };

            if( bytes.subarray( 0, SNIFF_BYTES ).indexOf( 0 ) !== -1 ) throw notText( name );

            try { return { text: new TextDecoder( 'utf-8', { fatal: true } ).decode( bytes ), enc: 'UTF-8' }; }
            catch( _ ) { return { text: new TextDecoder( 'windows-1252' ).decode( bytes ), enc: 'Windows-1252' }; }
        }

        // Says so, and returns the error to throw. `said`: the session adds no
        // "could not be opened" of its own on top (shared/office.js).
        function notText( name )
        {
            NayiveUI.toast( TF( 'text.notText', { name: O.baseName( name ) } ), { ms: 5000 } );

            const e = new Error( 'not a text file: ' + name );
            e.said = true;
            return e;
        }

        function blankText()
        {
            setEditorText( '' );
            setLanguage( 'text/plain' );
        }

        // "Guardar como": the chosen format's extension - and never one another
        // app owns (.docx) or a binary one, which Text could never reopen. The
        // same test the Open browser uses, so "saveable" and "openable" cannot
        // drift apart. null keeps the dialog open.
        function textSaveName( name, fmt )
        {
            name = O.withExt( name, fmt );
            if( textCanOpen( name ) ) return name;

            NayiveUI.toast( TF( 'text.badExt', { ext: O.extOf( name ) } ) );
            return null;
        }

    </script>
</body>
</html>
