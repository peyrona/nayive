<!-- index.html - Personal single-user calendar (vCal/.ics), backed by Gum's file-manager API -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Calendar</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3C/svg%3E">

    <!-- Shared colour scheme (dark default, opt-in light). Toggle lives in Drive / the launcher; this page just follows the saved choice. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS; a no-op on the plain-HTTP LAN URL. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <!-- Vendored libs (all pinned, no build step). luxon + rrule live in shared/lib/ (tasks loads the same two files, so one download + one cache entry). Order matters: classic scripts run before the deferred module script below. -->
    <script src="../shared/lib/luxon_v3.7.2.min.js"></script>
    <script src="../shared/lib/rrule_v2.8.1.min.js"></script>
    <script src="lib/fullcalendar-core_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-daygrid_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-timegrid_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-interaction_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-list_v6.1.21.min.js"></script>
    <!-- One small locale pack per language Nayive offers; English is FullCalendar's
         own default and needs none. `locale:` below picks the active one. -->
    <script src="lib/fullcalendar-locale-es_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-locale-pt_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-locale-fr_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-locale-de_v6.1.21.min.js"></script>
    <script src="lib/fullcalendar-locale-it_v6.1.21.min.js"></script>

    <!-- Gum file-API helpers: HMAC signing, the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'calendar',
            title: 'Calendar',
            // A phone shows the month as a dots grid + the picked day's list (PHONE MONTH below), so
            // its lead and its extra "+" row differ from the PC ones.
            lead:  window.matchMedia( '(max-width: 640px)' ).matches
                 ? NayiveUI.t( 'calendar.introLeadPhone' )
                 : NayiveUI.t( 'calendar.introLead' ),
            buttons: [
                { sel: '.topbar [data-view="timeGridDay"]',  text: NayiveUI.t( 'calendar.introDay' ) },
                { sel: '.topbar [data-view="rollWeek"]',     text: NayiveUI.t( 'calendar.introWeek' ) },
                { sel: '.topbar [data-view="dayGridMonth"]', text: NayiveUI.t( 'calendar.introMonth' ) },
                { sel: '#prevBtn',   text: NayiveUI.t( 'calendar.introPrev'   ) },
                { sel: '#nextBtn',   text: NayiveUI.t( 'calendar.introNext'   ) },
                { sel: '#searchBtn', text: NayiveUI.t( 'calendar.introSearch' ) },
                { sel: '#gotoBtn',   text: NayiveUI.t( 'calendar.introGoTo'   ) },
                { sel: '#exportBtn', text: NayiveUI.t( 'calendar.introExport' ) },
                { sel: '#moreBtn',   text: NayiveUI.t( 'calendar.introViews'  ) }
            ]
            // Framed by Planner the sync dot is hidden (the host shows ONE for every pane),
            // so its row would document a control that is not on screen.
            .concat( document.documentElement.classList.contains( 'is-embedded' ) ? [] : [
                { sel: '#syncIndicator', name: NayiveUI.t( 'ui.syncName' ),
                  text: NayiveUI.t( 'calendar.introSync' ) } ] )
            .concat( window.matchMedia( '(max-width: 640px)' ).matches
                ? [ { sel: '#dlAddBtn', text: NayiveUI.t( 'calendar.introAdd' ) } ] : [] ),
            // The tasks app fills a task with today's events once a day (see its
            // CALENDAR SYNC): worth saying here, where the events are written.
            tip:  NayiveUI.t( 'calendar.introTasksLink' )
        } );
    } );
    </script>

    <!-- Offline-capable persistence: local last-known-good cache + write-behind sync. -->
    <script src="../shared/store.js" defer></script>

    <style>
        /* Base reset, .app shell, .topbar, .icon-btn, .sheet, .sheet-header,
           .field and the input look all come from ../shared/app.css. Calendar
           overrides the page scroll and adds its toolbar + dialog specifics. */
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        .app { position: relative; }                 /* containing block for the dropdown menu */
        .topbar { padding: 8px 6px; }                 /* tighter - the bar is button-heavy */

        .date-nav { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; justify-content: center; }
        .topbar .range-label { font-size: 0.82rem; color: var(--text-dim); flex: 0 1 auto; min-width: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }

        /* View switch (Día / Semana / Mes) - a toggle, so its "on" button is an accent fill. */

        /* Calendar host */
        #calHost { flex: 1 1 auto; min-height: 0; padding: 0 6px 6px; overflow: hidden; }

        /* Event dialog - wider than the default sheet (many fields, 2-col rows). */
        .sheet { max-width: 520px; }
        .sheet-header .allday-inline { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
        .sheet-header .allday-inline span:first-child { font-size: 0.82rem; color: var(--text-dim); white-space: nowrap; }

        /* "Ir a..." dialog: narrower box; fields in ANSI order (Año / Mes / Día),
           Año and Día kept narrow, Mes takes the slack. Widths key off the input ids,
           not the position, so reordering the row cannot swap them again. */
        #goToBackdrop .sheet { max-width: 360px; }
        #goToRow .field:has( #gYear )  { flex: 0 1 88px; }
        #goToRow .field:has( #gMonth ) { flex: 1 1 130px; }
        #goToRow .field:has( #gDay )   { flex: 0 1 68px; }

        /* "Hoy" in that dialog. The one deliberate exception to the round icon-only
           action row (shared/theme.css): it took over from a toolbar button, so it has
           to read as a shortcut at a glance - accent fill, the word spelled out, and
           the row's own 44px height so it still lines up with the X and the check. */
        .today-pill
        {
            display: flex; align-items: center; justify-content: center;
            height: 44px; padding: 0 22px; flex: 0 0 auto;
            border: none; border-radius: var(--radius-pill); cursor: pointer;
            font: inherit; font-size: 1rem; font-weight: 700; letter-spacing: 0.01em;
            background: var(--accent); color: var(--on-accent);
            transition: filter var(--tr-fast);
        }
        .today-pill:hover  { filter: brightness(1.13); }
        .today-pill:active { filter: brightness(0.92); }

        /* Export dialog: two dates side by side + the format. */
        #exportBackdrop .sheet { max-width: 400px; }

        .switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .track { position: absolute; inset: 0; background: color-mix(in srgb, var(--text) 22%, transparent); border-radius: var(--radius-pill); transition: background .15s; cursor: pointer; }
        .switch .track::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .switch input:checked + .track { background: var(--accent); }
        .switch input:checked + .track::before { transform: translateX(18px); }

        /* The "más campos" fold is the shared .more-toggle block (shared/app.css). */

        .dow-picker { display: flex; gap: 6px; flex-wrap: wrap; }
        .dow-btn
        {
            width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card2);
            color: var(--text-dim); font-size: 0.82rem; cursor: pointer;
        }
        .dow-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

        .radio-row { display: flex; flex-direction: column; gap: 8px; }
        .radio-opt { display: flex; align-items: center; gap: 8px; font-size: 0.94rem; }
        .radio-opt input { width: 17px; height: 17px; }
        .radio-opt .inline-input { max-width: 90px; }
        .radio-opt .dt-field-inline { width: 90px; margin-left: 4px; }

        .tz-hint { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }

        /* Native date/time inputs render in the browser's own UI locale (e.g. mm/dd/yyyy),
           ignoring this page's language. Force ISO 8601 (yyyy-mm-dd) + 24h time by hiding
           the native text (color: transparent) and overlaying our own label; the input
           itself stays put underneath so tapping it still opens the native picker. */
        /* .dt-field is the shared DATE / TIME FIELD (shared/app.css); only this
           narrow inline variant, used inside the repeat sentence, is local. */
        .dt-field-inline { position: relative; display: inline-block; vertical-align: middle; }
        .dt-field-inline .dt-display { padding: 0 8px; font-size: 0.94rem; }

        /* .sheet-actions / .btn / .btn-* live in ../shared/theme.css (this app is
           the reference for that style — see Calendar -> "Ir a fecha"). */

        .section-divider { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

        /* Search-events sheet */
        .search-results { margin-top: 2px; max-height: 52vh; overflow-y: auto; }
        .search-result
        {
            display: flex; align-items: center; gap: 8px; width: 100%;
            padding: 11px 6px; background: none; border: none; border-top: 1px solid var(--line);
            color: var(--text); font-family: inherit; text-align: left; cursor: pointer;
        }
        .search-result:first-child { border-top: none; }
        .search-result:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
        .search-result:active { background: color-mix(in srgb, var(--text) 13%, transparent); }
        .search-result .sr-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
        .search-result .sr-recur { flex: 0 0 auto; display: flex; color: var(--text-dim); }
        .search-result .sr-when { flex: 0 0 auto; font-size: 0.8rem; color: var(--text-dim); }
        .search-empty { padding: 18px 6px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

        /* FullCalendar touch-friendly overrides */
        .fc { --fc-border-color: var(--line); --fc-page-bg-color: transparent; --fc-neutral-bg-color: color-mix(in srgb, var(--text) 5%, transparent); height: 100%; }
        /* Event fill: one fixed blue, the same in light and dark - it sits on the
           day cell, not on the page background, so it does not need to follow the
           scheme. White title: #3273B3 has luminance 0.16, far under the 3:1 line. */
        .fc
        {
            --fc-event-bg-color:     #3273B3;
            --fc-event-border-color: #3273B3;
            --fc-event-text-color:   #FFFFFF;
        }
        .fc .fc-toolbar { display: none; }   /* we drive navigation from our own topbar/view-switch */
        .fc-theme-standard td, .fc-theme-standard th { border-color: var(--line); }
        .fc .fc-scrollgrid { border: none; }
        /* Day / week: the day-name row and the "Jornada" (all-day) row are their own
           scrollers, and FullCalendar forces `overflow-y: scroll` on them so their
           columns line up with the hour grid, which has the real scrollbar. Keep
           that gutter (the alignment needs it) but paint the scrollbar invisible. */
        .fc .fc-scrollgrid-section-header .fc-scroller,
        .fc .fc-scrollgrid-section-body:not(.fc-scrollgrid-section-liquid) .fc-scroller
        { scrollbar-color: transparent transparent; }
        .fc-col-header-cell { color: var(--text-dim); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; padding: 6px 0; }
        .fc-timegrid .fc-daygrid-day-frame { min-height: 1.5em; }
        .fc-timegrid .fc-daygrid-body-unbalanced .fc-daygrid-day-events,
        .fc-timegrid .fc-daygrid-body-natural .fc-daygrid-day-events { min-height: 0; margin-top: 0; margin-bottom: 0; }
        .fc-timegrid-slot-label { color: var(--text-dim); font-size: 0.78rem; }
        .fc-timegrid-axis { color: var(--text-dim); }
        .alldaytz-label { font-size: 0.82rem; color: var(--text-dim); }
        .corner-tz-badge { font-size: 0.68rem; font-weight: 700; color: var(--text-dim); letter-spacing: 0.02em; }
        /* FullCalendar gives every th `vertical-align: top`, which pinned the badge above the day names' centre line. */
        .fc-scrollgrid-section-header .fc-timegrid-axis { vertical-align: middle; }
        .fc-scrollgrid-section-header .fc-timegrid-axis-frame { display: flex; align-items: center; justify-content: center; }
        .fc-daygrid-day-number { color: var(--text); font-size: 0.86rem; padding: 6px; }
        .fc-day-today { background: color-mix(in srgb, var(--accent) 8%, transparent) !important; }
        .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: var(--accent); font-weight: 700; }
        /* No text selection / callout on an event: a phone's long-press menu would
           otherwise cancel the touch before FullCalendar starts the drag. */
        .fc-event { border-radius: 6px; border: none; padding: 2px 5px; font-size: 0.85rem; cursor: pointer;
                    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .fc-timegrid-event { padding: 3px 6px; }
        .fc-daygrid-event { padding: 2px 4px; overflow: hidden; }
        /* Month grid: a long title is cut with "..." inside its own day cell - it used
           to run on over the next day's events (worst on a phone's narrow columns). */
        .fc-daygrid-event .fc-event-main-frame { display: flex; min-width: 0; overflow: hidden; }
        .fc-daygrid-event .fc-event-title      { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fc-event .tz-tag { opacity: 0.75; font-size: 0.78em; margin-left: 4px; }
        .fc-list-event-dot { display: none; }
        .fc-list-day-cushion { background: color-mix(in srgb, var(--text) 5%, transparent) !important; color: var(--text-dim); }
        .fc-list-event td { color: var(--text); border-color: var(--line); }
        .fc-timegrid-now-indicator-line { border-color: var(--accent); }
        .fc-timegrid-now-indicator-arrow { border-color: var(--accent); color: var(--accent); }

        /* Bigger touch targets for drag/resize handles (month-view dot) */
        .fc-daygrid-event .fc-event-resizer { width: 14px !important; height: 14px !important; }

        /* Timed events: thick bottom border doubles as the resize handle (light blue),
           always visible so it reads as grabbable. Drag it up/down to shrink/extend. */
        .fc-timegrid-event .fc-event-resizer-start { display: none !important; }
        .fc-timegrid-event .fc-event-resizer-end
        {
            display: block !important;
            height: 4px !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: auto !important;
            background-color: #63BFFF !important;
            border-radius: 0 0 5px 5px !important;
            cursor: ns-resize !important;
        }

        /* --- Overflow menu (phone only) -------------------------------- */
        #moreBtn { display: none; }

        /* The "..." menu is the shared .top-menu / .menu-item (shared/app.css),
           anchored under its button by NayiveUI.wireMenu. Nothing local. */

        /* --- Phone layout (single breakpoint; PC + tablet keep the default) --- */
        @media (max-width: 640px)
        {
            /* #gotoBtn stays a real button here: jumping to another month is an
               everyday move on a phone, too common to bury in the "⋮" menu. */
            .topbar h1,
            .topbar .view-btn { display: none; }

            /* One extra button costs the bar a whole second row unless the date
               navigator gives ground first: with flex-wrap, a `flex-basis: auto`
               child breaks the line at its CONTENT width. Zero basis lets the
               month label ellipsis instead ("sept… 2026"), keeping one row. */
            .date-nav { flex-basis: 0; }

            #moreBtn { display: flex; }

            .fc-daygrid-event .tz-tag { display: none; }   /* no room for the zone tag in a phone's month cell */

            /* Dialogs stay centred cards, just wider on a phone */
            .sheet { width: 100%; max-width: none; max-height: 90vh; }
            #goToBackdrop .sheet { max-width: none; }
        }

        /* --- PHONE MONTH (phone only) -----------------------------------------
           #app gets .phone-month while a phone shows dayGridMonth: the grid is a
           fixed-height block of day numbers with up to three dots each (.pm-dots,
           painted by paintPhoneDots; FullCalendar's own event pills are hidden),
           and #dayList underneath lists the picked day's events with a "+" to add
           one. PC / tablet never get the class, so nothing here touches them. */
        #dayList { display: none; }

        @media (max-width: 640px)
        {
            /* !important: FullCalendar's `height: '100%'` option writes an inline height on the host. */
            .phone-month #calHost { flex: 0 0 auto; height: min(46vh, 340px) !important; }
            .phone-month #dayList { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; border-top: 1px solid var(--line); }

            .dl-head { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; padding: 4px 6px 4px 12px; }
            .dl-head .dl-date { flex: 1 1 auto; font-size: 0.8rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
            .dl-rows { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 6px; }
            .dl-row
            {
                display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
                border: none; border-radius: var(--radius-m); background: var(--card2); color: var(--text);
                font: inherit; text-align: left; cursor: pointer;
            }
            .dl-row:active { background: color-mix(in srgb, var(--text) 13%, var(--card2)); }
            .dl-row time { flex: 0 0 auto; min-width: 4em; color: var(--accent); font-weight: 600; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
            .dl-row .dl-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .dl-row .dl-tz { flex: 0 0 auto; font-size: 0.72rem; color: var(--text-dim); }
            .dl-empty { padding: 18px 6px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

            /* The grid: number centred, dots row under it, FullCalendar's event pills and "+N más" off. */
            .phone-month .fc-daygrid-day-frame { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; padding: 3px 0; }
            .phone-month .fc-daygrid-day-top { flex-direction: row; justify-content: center; }
            .phone-month .fc-daygrid-day-number { padding: 3px 4px; font-size: 0.9rem; line-height: 1.2; text-decoration: none; }   /* the number is an <a>: no tap underline */
            .phone-month .fc-daygrid-day-events,
            .phone-month .fc-daygrid-day-bottom { display: none; }
            .phone-month .fc-day-other .fc-daygrid-day-number { opacity: 0.45; }
            .pm-dots { display: flex; gap: 3px; justify-content: center; height: 6px; }
            .pm-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
            /* The picked day is an accent fill (today keeps its tint underneath). */
            .phone-month .fc-daygrid-day.is-picked .fc-daygrid-day-frame { background: var(--accent); border-radius: var(--radius-s); }
            .phone-month .fc-daygrid-day.is-picked .fc-daygrid-day-number { color: var(--on-accent); font-weight: 700; opacity: 1; }
            .phone-month .fc-daygrid-day.is-picked .pm-dots i { background: var(--on-accent); }
        }

        /* --- EXPORT -> PDF (print) ---------------------------------------------
           No PDF library: exportPdf() fills #printRoot with a plain, light-theme
           listing and calls window.print(); the user picks "Save as PDF" in the
           browser's own dialog. Same shape trips uses. #printRoot is display:none
           on screen and only shown on paper. */
        #printRoot { display: none; }

        /* Scoped to .printing (set on <html> by exportPdf, dropped on afterprint) so a
           plain Ctrl+P still prints the page itself rather than a blank sheet. */
        @media print
        {
            @page { margin: 14mm; }
            /* The app locks the page (html, body { height: 100%; overflow: hidden })
               so the calendar can own the scroll - left alone that clips the printed
               listing to a single page. */
            .printing, .printing body { height: auto !important; overflow: visible !important; background: #fff !important; }
            .printing #app, .printing .sheet-backdrop, .printing #toast { display: none !important; }
            .printing #printRoot { display: block !important; }
        }

        #printRoot { color: #111; background: #fff; font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #printRoot .pr-head { border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 18px; }
        #printRoot .pr-head h1 { margin: 0 0 3px; font-size: 22px; color: #111; }
        #printRoot .pr-range { font-size: 13px; color: #444; }
        #printRoot .pr-day { margin-bottom: 14px; page-break-inside: avoid; break-inside: avoid; }
        #printRoot .pr-day > h2 { font-size: 12px; margin: 0 0 5px; padding-bottom: 3px; border-bottom: 1px solid #bbb;
                                   text-transform: uppercase; letter-spacing: .05em; color: #111; }
        #printRoot table.pr-ev { border-collapse: collapse; width: 100%; }
        #printRoot table.pr-ev td { vertical-align: top; padding: 3px 10px 3px 0; border-bottom: 1px solid #e2e2e2; }
        #printRoot table.pr-ev td.pr-when { width: 140px; white-space: nowrap; color: #444; font-variant-numeric: tabular-nums; }
        #printRoot .pr-title { font-weight: 600; }
        #printRoot .pr-meta { color: #555; font-size: 10.5px; white-space: pre-line; }
        #printRoot .pr-empty { color: #666; font-style: italic; }
        #printRoot .pr-foot { margin-top: 24px; padding-top: 8px; border-top: 1px solid #bbb; color: #666; font-size: 10.5px; }
    </style>
</head>

<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
