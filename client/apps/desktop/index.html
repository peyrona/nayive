<!-- desktop/index.html - the desktop for big screens (2026-09-23). The launcher sends
     a big screen here (at least 1024 x 600 with a mouse, or as this device's "Open
     the desktop" says - see the <head> of ../index.html and OPEN THE DESKTOP).
     On a tablet (2026-10-01): finger-sized buttons, a long press for the "⋮",
     Tile by itself when held upright, and the window in front kept clear of
     the on-screen keyboard (see TOUCH, UPRIGHT, KEYBOARD).

     One bar (bottom by default): on its left the menu button, which pops up the real
     launcher (../index.html, framed); then one button per open window, in the order
     they were opened, named after the document it shows; on its right a clock
     ("<weekday> <hh:mm>" by default) - a press on its weekday / date opens the
     month's calendar, on the time a countdown, whose
     time left then sits on the bar just before the clock; after the clock a "?" opens
     the desktop's help card. The desktop's settings - per device: the clock,
     the bar's place and height - live in the "⋮" menu after the clock, which a
     right-click on an empty spot of the desk (not the bar) opens too.

     Every app runs in its own window - a same-origin <iframe>. An app whose top row
     holds its icon, name and toolbar uses that row as the title bar (close /
     minimise / maximise dots at its start, see adoptHead); the others get a bar of
     ours. Windows drag, resize from any edge, and - with "Sticky windows" on (the "⋮"
     menu) - snap to half the desk at its left / right / top / bottom edge; they come
     back where they were the next time the desktop opens. A phone-sized screen is sent to the launcher. -->

<script>
( function ()
{
    // The windows are Ayni's (shared/ayni/ayni-deskpage.js). What stays here is Nayive's: the launcher, the apps' names and icons, the lockers,
    // Chat's and eMail's dots, the one sync plug, the help.

    //------------------------------------------------------------------------//
    // APP ICONS AND NAMES - read once from the launcher's own tiles (Office's
    // and Records' popups are tiles too), so the desktop never keeps a second copy of them.
    // Keyed by the app's folder.

    var APPS = {};     // "drive" -> { name, svg }
    // A new window's widest (openApp): one-column apps, and Write - an A4 page
    // at 100 % (794 + the engine's 2 x 24 gutter) + scrollbar + borders.
    var NARROW = { contact: 560, write: 864, calculator: 328 };
    // ...and no taller than it needs: Calculator is a small fixed panel.
    var SHORT  = { calculator: 539 };
    var appsReady = fetch( '../index.html', { credentials: 'same-origin' } )
        .then( function ( r ) { return r.text(); } )
        .then( function ( html )
        {
            var doc = new DOMParser().parseFromString( html, 'text/html' );
            [].forEach.call( doc.querySelectorAll( 'a.btn.large[href]' ), function ( a )
            {
                var dir = a.getAttribute( 'href' ).split( '/' )[ 0 ];
                var svg = a.querySelector( 'svg' );
                var sp  = a.querySelector( 'span:not(.icon)' );
                APPS[ dir ] = { name: sp ? sp.textContent.trim() : dir, svg: svg ? svg.outerHTML : ICON_WIN };
            } );
        } )
        .catch( function () {} );

    function appOf( url )
    {
        try
        {
            var p = new URL( url, location.href ).pathname;
            if( p.indexOf( ROOT ) !== 0 ) return '';
            return p.slice( ROOT.length ).split( '/' )[ 0 ];
        }
        catch( e ) { return ''; }
    }

    var D = Ayni.deskPage( {
            appName: 'Nayive',
            APPS: APPS,
            NARROW: NARROW,
            SHORT: SHORT,
            appOf: function () { return appOf.apply( null, arguments ); },
            appsReady: appsReady,
            askMail: function () { return askMail.apply( null, arguments ); },
            closeMenu: function () { return closeMenu.apply( null, arguments ); },
            loadLocker: function () { return loadLocker.apply( null, arguments ); },
            loadScript: function () { return loadScript.apply( null, arguments ); },
            openMenu: function () { return openMenu.apply( null, arguments ); },
            openMoreHere: function () { return openMoreHere.apply( null, arguments ); },
            placeMail: function () { return placeMail.apply( null, arguments ); },
            placeUnread: function () { return placeUnread.apply( null, arguments ); },
            pokeUnread: function () { return pokeUnread.apply( null, arguments ); },
            weatherEngine: function ()
            {
                return window.NayiveSalon && NayiveSalon.engine ? Promise.resolve( NayiveSalon )
                     : loadScript( '../shared/lockers/culture.js' ).then( function () { return NayiveSalon; } );
            }
        } );
    var ICON_SCALE = D.ICON_SCALE, ICON_TILE = D.ICON_TILE, ICON_WIN = D.ICON_WIN, ROOT = D.ROOT, bar = D.bar, battEl = D.battEl, clock = D.clock, closeMore = D.closeMore, desk = D.desk, desktop = D.desktop, focus = D.focus, ghost = D.ghost, hookAlt = D.hookAlt, menu = D.menu, menuBtn = D.menuBtn, moreBtn = D.moreBtn, moreMenu = D.moreMenu, narrow = D.narrow, openApp = D.openApp, placeMore = D.placeMore, set = D.set, setTip = D.setTip, t = D.t, tasks = D.tasks, tile = D.tile, wins = D.wins, wxSvg = D.wxSvg;

    // SCREEN LOCKER - saved at once, on this device (see #lockSel).
    var lockSel = document.getElementById( 'lockSel' ), lockMin = document.getElementById( 'lockMin' ),
        lockText = document.getElementById( 'lockText' );
    function loadLocker()
    {
        if( ! window.AyniLocker || ! window.Ayni || ! Ayni.picker ) return;
        var s = AyniLocker.settings();
        // An Ayni list picker; '' = plain black, last
        var pk = Ayni.picker( lockSel );
        pk.options = AyniLocker.LOCKERS.concat( [ '' ] ).map( function ( id ) { return { value: id, text: t( id ? 'scrlock.' + id : 'scrlock.none' ) }; } );
        pk.set( s.id );
        lockMin.value  = s.min;
        lockText.value = s.text;
        document.getElementById( 'lockTextWrap' ).hidden = s.id !== 'clock';
        var sb = document.getElementById( 'salonBtn' ), sbl = sb.querySelector( '[data-i18n]' );
        sb.hidden = s.id !== 'culture' && s.id !== 'science';
        sbl.setAttribute( 'data-i18n', s.id === 'science' ? 'sci.settings' : 'salon.settings' );
        sbl.textContent = t( sbl.getAttribute( 'data-i18n' ) );
        placeMore();
    }
    // The minutes are ONE value for every locker: choosing a locker never
    // touches them (it used to turn 0 into 15, which looked like minutes per locker).
    lockSel.addEventListener( 'ayni:change', function ( e )
    {
        AyniLocker.save( { id: e.detail.value } );
        loadLocker();
    } );
    // Saved at every key and arrow, not only when the field is left: a menu
    // closed or a page reloaded with the focus still in it lost the number.
    function saveMin()                                    // 0 = off, never below
    {
        if( lockMin.value.trim() === '' ) return;         // half typed: wait
        var n = Math.floor( Number( lockMin.value ) );
        if( isFinite( n ) ) AyniLocker.save( { min: n >= 0 ? Math.min( n, 999 ) : 0 } );
    }
    lockMin.addEventListener( 'input', saveMin );
    lockMin.addEventListener( 'change', function () { saveMin(); loadLocker(); } );
    lockText.addEventListener( 'input', function () { AyniLocker.save( { text: lockText.value } ); } );
    // Bellas artes' / Science's settings: their scripts are loaded the first time
    // they are asked for (Science needs Bellas artes' too: the shared engine).
    function loadScript( src ) { return new Promise( function ( ok, fail ) { var sc = document.createElement( 'script' ); sc.src = src; sc.onload = ok; sc.onerror = fail; document.head.appendChild( sc ); } ); }
    document.getElementById( 'salonBtn' ).addEventListener( 'click', function ()
    {
        var sci = AyniLocker.settings().id === 'science';
        closeMore();
        ( window.NayiveSalon ? Promise.resolve() : loadScript( '../shared/lockers/culture.js' ) )
            .then( function () { return ! sci || window.NayiveScience || loadScript( '../shared/lockers/science.js' ); } )
            .then( function () { return window.NayiveSalonSettings || loadScript( '../shared/lockers/culture-settings.js' ); } )
            .then( function () { NayiveSalonSettings.open( sci ? 'science' : 'culture' ); }, function () {} );
    } );
    loadLocker();
    moreBtn.addEventListener( 'click', loadLocker );   // again at each open: names in the current language

    //------------------------------------------------------------------------//
    // THE MENU - the real launcher, framed. A tile opens its app as a window
    // instead of replacing the page; anything else inside it (gear, account,
    // theme) keeps working as it does in the launcher.
    //
    // It is loaded at once, hidden, not on the first click: a big screen never
    // shows the launcher page itself (it comes straight here), so the launcher's
    // start-up runs in this frame - signed out -> the sign-in page, the
    // account's language, a missing time zone, a new user's first password, the
    // notifications offer, the Android app's enrolment.

    var menuFrame = null, menuAuto = false;

    function ensureMenuFrame()
    {
        if( menuFrame ) return;
        menuFrame = document.createElement( 'iframe' );
        menuFrame.setAttribute( 'data-ayni-window', '' );   // it holds a whole page, as a window does
        menuFrame.src = '../index.html';
        menuFrame.addEventListener( 'load', onMenuLoad );
        menu.appendChild( menuFrame );
    }

    function openMenu()
    {
        ensureMenuFrame();
        menu.hidden = false;
        menuBtn.classList.add( 'open' );
    }

    function closeMenu()
    {
        if( menu.hidden || menu.classList.contains( 'full' ) ) return;     // a launcher dialog is up
        menu.hidden = true;
        menuBtn.classList.remove( 'open' );
        // ...and Office's or Records' popup with it, or it is still open next time.
        try { var l = menuFrame.contentWindow.NayiveLauncher; if( l ) l.closePopups(); } catch( e ) {}
    }

    function onMenuLoad()
    {
        var cw = menuFrame.contentWindow, doc;
        try { doc = cw.document; } catch( e ) { return; }
        // Signed out, or anything that left the launcher: hand it to the whole page.
        if( ! /\/nayive\/(index\.html)?$/.test( cw.location.pathname ) ) { location.href = cw.location.href; return; }

        // The launcher centres itself in a full screen; in the menu it just fills the frame.
        // `in-desktop` keeps its phone layout off: the frame is narrow, the screen is not,
        // so the menu shows the very card of a big screen's launcher.
        doc.documentElement.classList.add( 'in-desktop' );
        var st = doc.createElement( 'style' );
        st.textContent = 'html,body{overflow:hidden auto;scrollbar-width:thin}.launcher{min-height:0;padding:0}.apps-panel{border:0;border-radius:0;box-shadow:none;background:transparent}' +
                         // full screen for a dialog: the desk shows behind it, not the launcher's tiles
                         'html.desk-full,html.desk-full body{background:transparent}html.desk-full .launcher{visibility:hidden}';
        doc.head.appendChild( st );
        // The menu is exactly the launcher's panel, once that has laid out (not while hidden).
        var panel = doc.querySelector( '.apps-panel' );
        if( panel ) new cw.ResizeObserver( function ()
        {
            var r = panel.getBoundingClientRect();
            if( ! r.width ) return;
            menu.style.width  = Math.ceil( r.width  + 2 ) + 'px';   // + the menu's 1px border, each side
            menu.style.height = Math.ceil( r.bottom + 2 ) + 'px';
        } ).observe( panel );

        doc.addEventListener( 'click', function ( e )
        {
            var a = e.target.closest && e.target.closest( 'a.btn.large[href]' );   // the grid's, or a popup's
            if( ! a ) return;
            e.preventDefault();
            e.stopPropagation();
            closeMenu();
            appsReady.then( function () { openApp( new URL( a.getAttribute( 'href' ), cw.location.href ).href ); } );
        }, true );
        doc.addEventListener( 'keydown', function ( e ) { if( e.key === 'Escape' ) closeMenu(); } );
        hookAlt( cw );

        // A dialog of the launcher's opens: the menu takes the whole screen - and
        // shows itself if it was hidden (the start-up ones open on their own). When
        // the last one closes, it goes back to what it was. The launcher's own
        // help card is not one of these: it stays in the menu, as it always was.
        function menuSheets()
        {
            var up = [].some.call( doc.querySelectorAll( 'dialog.panel[open]' ), function ( b )
            {
                return ! b.classList.contains( 'help-card' );
            } );
            if( up && ! menu.classList.contains( 'full' ) )
            {
                menuAuto = menu.hidden;
                menu.hidden = false;
                menu.classList.add( 'full' );
                doc.documentElement.classList.add( 'desk-full' );
                menuBtn.classList.add( 'open' );
            }
            else if( ! up && menu.classList.contains( 'full' ) )
            {
                menu.classList.remove( 'full' );
                doc.documentElement.classList.remove( 'desk-full' );
                if( menuAuto ) closeMenu();
                menuAuto = false;
            }
        }
        new cw.MutationObserver( menuSheets ).observe( doc.body, { attributes: true, attributeFilter: [ 'class', 'hidden', 'open' ], subtree: true, childList: true } );
        menuSheets();
    }

    ensureMenuFrame();
    menuBtn.addEventListener( 'click', function () { if( menu.hidden ) openMenu(); else closeMenu(); } );
    document.addEventListener( 'keydown', function ( e ) { if( e.key === 'Escape' ) closeMenu(); } );
    // An app's icon / name in a window asks for "home": that is this menu (shared/ui.js).
    window.AyniDesk.menu = function () { if( menu.hidden ) openMenu(); else closeMenu(); };

    // A press on the desk or the bar closes an open menu. A right-click on an empty
    // spot of the desk (not the bar) opens the "⋮" menu, where the desktop's
    // settings are - unless that very press was the one closing the launcher's menu.
    var menuWasOpen = false;
    [ desk, bar ].forEach( function ( el )
    {
        el.addEventListener( 'pointerdown', function ( e )
        {
            if( e.target.closest( '#menuBtn' ) ) return;
            menuWasOpen = ! menu.hidden;
            closeMenu();
        } );
    } );
    function openMoreHere()
    {
        if( ! menuWasOpen && ! moreMenu.matches( ':popover-open' ) ) Ayni.showPopup( moreMenu, moreBtn );
    }
    desk.addEventListener( 'contextmenu', function ( e )
    {
        if( ! e.target.closest( '.desk-empty' ) ) return;
        e.preventDefault();
        openMoreHere();
    } );
    // A finger's right-click: a long press on an empty spot of the desk. And the
    // wheel moves a row of chips along the bar (a column scrolls by itself).
    document.addEventListener( 'DOMContentLoaded', function () { if( window.Ayni ) Ayni.ready.then( function ()
    {
        Ayni.longTap( desk, '.desk-empty', openMoreHere );
    } ); } );
    tasks.addEventListener( 'wheel', function ( e )
    {
        if( set.bar === 'left' || set.bar === 'right' || tasks.scrollWidth <= tasks.clientWidth || ! e.deltaY ) return;
        e.preventDefault();
        tasks.scrollLeft += e.deltaY;
    }, { passive: false } );

    //------------------------------------------------------------------------//
    // CHAT - shared/ui.js asks the server for the unread count (every minute,
    // on a push, on coming back) and tells us (nayive:chatunread). The red dot
    // sits on Chat's bar button with the count, or plain on the menu button
    // while Chat is not open; it blinks when the count goes up.

    var unreadDot = document.createElement( 'span' ), unread = -1;
    unreadDot.className = 'icon-badge';
    unreadDot.hidden = true;
    unreadDot.setAttribute( 'aria-hidden', 'true' );

    function placeUnread()
    {
        if( ! ( unread > 0 ) ) { unreadDot.hidden = true; return; }
        var chat = wins.filter( function ( w ) { return w.app === 'chat'; } )[ 0 ];
        showDot( unreadDot, chat ? chat.main : menuBtn, unread );
    }
    // On an app's bar button the dot carries the count; on the menu button it is plain.
    function showDot( dot, host, n )
    {
        if( dot.parentNode !== host ) host.appendChild( dot );
        var counted = host !== menuBtn;
        dot.classList.toggle( 'has-count', counted );
        dot.textContent = counted ? ( n > 99 ? '99+' : String( n ) ) : '';
        dot.hidden = false;
    }
    document.addEventListener( 'nayive:chatunread', function ( e )
    {
        var before = unread;
        unread = e.detail || 0;
        placeUnread();
        if( before >= 0 && unread > before )
        {
            unreadDot.classList.remove( 'blink' );
            void unreadDot.offsetWidth;
            unreadDot.classList.add( 'blink' );
        }
    } );
    // Leaving the Chat window: what was read there should take the dot away now.
    function pokeUnread()
    {
        try { navigator.serviceWorker.dispatchEvent( new MessageEvent( 'message', { data: { chat: 'new' } } ) ); } catch( e ) {}
    }

    //------------------------------------------------------------------------//
    // EMAIL - the unread count of every account's Inbox (/api/mail/unread, the
    // launcher's eMail number): a plain blue dot on the menu button's top-left,
    // or the count on eMail's bar button while eMail is open. Asked at load, every
    // minute, on a mail push (sw.js), on coming back, and on leaving the eMail
    // window. It blinks when the count goes up. The admin (403) stops asking.

    var mailDot = document.createElement( 'span' ), mailN = -1, mailStopped = false, mailAsking = false;
    mailDot.className = 'icon-badge mail-dot';
    mailDot.hidden = true;
    mailDot.setAttribute( 'aria-hidden', 'true' );

    function placeMail()
    {
        if( ! ( mailN > 0 ) ) { mailDot.hidden = true; return; }
        var em = wins.filter( function ( w ) { return w.app === 'email'; } )[ 0 ];
        showDot( mailDot, em ? em.main : menuBtn, mailN );
    }
    function askMail()
    {
        if( mailStopped || mailAsking || document.hidden ) return;
        mailAsking = true;
        fetch( '/api/mail/unread', { credentials: 'same-origin', headers: { Accept: 'application/json' } } )
            .then( function ( r )
            {
                if( r.status === 401 || r.status === 403 ) mailStopped = true;
                return r.ok ? r.json() : null;
            } )
            .then( function ( j )
            {
                if( ! j ) return;
                var before = mailN;
                mailN = j.n || 0;
                placeMail();
                if( before >= 0 && mailN > before )
                {
                    mailDot.classList.remove( 'blink' );
                    void mailDot.offsetWidth;
                    mailDot.classList.add( 'blink' );
                }
            } )
            .catch( function () {} )
            .then( function () { mailAsking = false; } );
    }
    askMail();
    setInterval( askMail, 60000 );
    document.addEventListener( 'visibilitychange', askMail );
    if( navigator.serviceWorker ) navigator.serviceWorker.addEventListener( 'message', function ( e )
    {
        if( e.data && e.data.mail === 'new' ) askMail();
    } );

    // A tapped notification: the worker (sw.js) hands its page to the desktop.
    function openTarget( url ) { appsReady.then( function () { openApp( url, { nav: true } ); } ); }
    if( navigator.serviceWorker ) navigator.serviceWorker.addEventListener( 'message', function ( e )
    {
        if( e.data && e.data.desktopOpen ) openTarget( e.data.desktopOpen );
    } );

    // "Space almost full" card (shared/ui.js): its "find big files" opens Drive here.
    document.addEventListener( 'nayive:bigfiles', function ( e )
    {
        e.preventDefault();
        openTarget( '/nayive/drive/index.html?big=1' );
    } );

    //------------------------------------------------------------------------//
    // SYNC - ONE connection status for the whole desktop, after the clock. Each
    // app keeps updating its own .sync-indicator (hidden in a window, app.css);
    // this copies the WORST of them, as Planner does for its panes. Worst first:
    // no class (red, not synced yet) > .offline (gold, changes queued) > .busy
    // (blue) > .synced (green). Looked at once a second rather than watched: an
    // app may redraw its dot (Trips redraws its whole header), and a window may
    // come and go. A window whose app has no dot (Games) does not count; with
    // none left the status hides.

    var syncDot = document.getElementById( 'syncIndicator' );

    function winDot( w )
    {
        try { return w.frame.contentDocument && w.frame.contentDocument.querySelector( '.sync-indicator' ); }
        catch( e ) { return null; }
    }
    function syncRank( el )
    {
        if( ! el ) return -1;
        var c = el.classList;
        return c.contains( 'offline' ) ? 2 : c.contains( 'busy' ) ? 1 : c.contains( 'synced' ) ? 0 : 3;
    }
    function mirrorSync()
    {
        var worst = null, worstRank = -1;
        wins.forEach( function ( w )
        {
            var el = winDot( w ), r = syncRank( el );
            if( r > worstRank ) { worstRank = r; worst = el; }
        } );
        syncDot.hidden = ! worst;
        if( ! worst ) return;
        [ 'synced', 'busy', 'offline' ].forEach( function ( cls ) { syncDot.classList.toggle( cls, worst.classList.contains( cls ) ); } );
        setTip( syncDot, worst.dataset.tip || '' );
    }
    setInterval( mirrorSync, 1000 );

    // A click refreshes every window: the app's own refresh (ui.js wireRefresh),
    // or - Planner, which has none of its own - a click on its dot, which
    // refreshes its panes.
    syncDot.addEventListener( 'click', function ()
    {
        wins.forEach( function ( w )
        {
            try
            {
                var cw = w.frame.contentWindow;
                if( cw && cw.ayniRefresh ) cw.ayniRefresh();
                else { var el = winDot( w ); if( el ) el.click(); }
            }
            catch( e ) { /* a window mid-navigation must not stop the others */ }
        } );
        setTimeout( mirrorSync, 300 );
    } );

    //------------------------------------------------------------------------//
    // HELP - the "?" after the "⋮" opens the shared help card: one row per
    // thing on the bar, then what has no button (moving windows, Alt).

    var CLOCK_SVG = Ayni.icon( 'clock-plain' );

    // After DOMContentLoaded: ui.js is deferred, this script is not.
    document.addEventListener( 'DOMContentLoaded', function () { ( window.Ayni ? Ayni.i18n.ready : Promise.resolve() ).then( function ()
    {
        if( ! window.NayiveUI ) return;
        Ayni.help( {
            title: 'Nayive',
            lead:  t( 'desktop.helpLead' ),
            rows: [
                { sel: '#menuBtn',       icon: 'grid', text: t( 'desktop.helpMenu' ) },
                // tour: ("Ver el tour" in the card) a window, its bar button, the
                // ⋮'s Tile switch, the bar's weather and battery - or, with no
                // window open / the item off, the desk or the bar as a ghost.
                { svg: ICON_WIN,  name: t( 'desktop.helpWinName' ),    text: t( 'desktop.helpWin' ), tour: { sel: '.win:not([hidden]) .win-bar', ghost: '#desk' } },
                { svg: ICON_SCALE, name: t( 'desktop.helpScaleName' ), text: t( 'desktop.helpScale' ), tour: { sel: '#tasks button', ghost: '#tasks, #bar' } },
                { icon: 'fullscreen', name: t( 'desktop.helpMoveName' ),   text: t( 'desktop.helpMove' ), tour: { sel: '.win:not([hidden])', ghost: '#desk' } },
                { svg: ICON_TILE, name: t( 'desktop.tileOn' ),          text: t( 'desktop.helpTile' ), tour: { sel: '#tileSw', open: '#moreBtn' } },
                { icon: 'forward', name: t( 'desktop.helpSwitchName' ), text: t( 'desktop.helpSwitch' ), tour: { sel: '#tasks', ghost: '#bar' } },
                { svg: wxSvg( 1, true ), name: t( 'desktop.weather' ), text: t( 'desktop.helpWeather' ), tour: { sel: '#wxBtn', ghost: '#bar' } },   // listed even while off: it says where to turn it on
                { svg: battEl.querySelector( 'svg' ).outerHTML, name: t( 'desktop.battery' ), text: t( 'desktop.helpBattery' ), tour: { sel: '#batt', ghost: '#bar' } },   // the same
                { sel: '#clock',         svg: CLOCK_SVG, name: t( 'desktop.tabClock' ), text: t( 'desktop.helpClock' ) },
                { sel: '#moreBtn',       icon: 'more', text: t( 'desktop.helpMore' ) }
            ],
            tour: [ 'rows' ]
        } );
    } ); } );
} )();
</script>
</body>
</html>
