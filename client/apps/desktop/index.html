<!-- desktop/index.html - the desktop for big screens (2026-09-23). The launcher sends
     a big screen here (at least 1024 x 600 with a mouse; see the <head> of
     ../index.html), unless this device's settings say otherwise.

     One bar (bottom by default): on its left the menu button, which pops up the real
     launcher (../index.html, framed); then one button per open window, in the order
     they were opened, named after the document it shows; on its right a clock
     ("<weekday> <hh:mm>" by default) - a press on it opens a countdown, whose
     time left then sits on the bar just before the clock; after the clock a "?" opens
     the desktop's help card. The desktop's settings - per device: how it
     starts, the bar and its font, the clock - open from two places only:
     the round button in the menu's bottom-left corner, and a right-click on an
     empty spot of the desk (not the bar).

     Every app runs in its own window - a same-origin <iframe>. An app whose top row
     holds its icon, name and toolbar uses that row as the title bar (close /
     minimise / maximise dots at its start, see adoptHead); the others get a bar of
     ours. Windows drag, resize from any edge, snap to half the desk at the left /
     right edge and fill it at the top edge, and come back where they were the next
     time the desktop opens. A phone-sized screen is sent to the launcher. -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>if( window.matchMedia( '(max-width: 640px)' ).matches ) location.replace( '../index.html' );</script>
    <!-- No password yet (a remembered session, a new tab: login.html never ran):
         every app window would get 403, so go to the launcher, which asks for one. -->
    <script>
        fetch( '/api/whoami', { credentials: 'same-origin', headers: { Accept: 'application/json' } } )
            .then( function ( r ) { return r.ok ? r.json() : null; } )
            .then( function ( me )
            {
                if( ! me || ! me.must_set_password ) return;
                try { sessionStorage.setItem( 'nayive-must-set', '1' ); } catch ( e ) {}
                location.replace( '../index.html' );
            } )
            .catch( function () {} );
    </script>
    <script src="../shared/i18n.js"></script>
    <script src="tiling.js"></script>
    <title>Nayive</title>
    <link rel="icon" type="image/png" href="../icons/icon-192.png">

    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/locker.js"></script>
    <script src="../shared/ui.js" defer></script>
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <style>
        html, body { height: 100%; overflow: hidden; }

        :root { --bar-h: 48px; }

        .desktop { display: flex; flex-direction: column; height: 100%; color: var(--text); }

        /* THE DESKTOP'S COLOURS - never chosen: worked out from the account's
           active scheme (My account -> Colour schemes), so they flip with the apps,
           by hand or at dusk and dawn. A STEP is 12%. The rules:
             desk      dark:  --bg 2 steps toward black, with 6% of --accent in it
                       light: --bg 2 steps toward --line (the scheme's own hue, not grey)
             bar       dark:  the desk, 1 step darker again
                       light: the desk, 2 steps toward --line again - the darkest part
             edges     --line, softened 3 steps toward --bg (a full --line is heavy on light)
             focused   the front window's edge: --line with 4 steps of --accent
             shadow    dark: deep black; light: --line's hue, never grey
           The desk is always darker than --bg, so a window (--bg / --card inside)
           stands off it. New names, not --bg: a token cannot use itself. */
        .desktop
        {
            --desk-bg:     color-mix(in srgb, color-mix(in oklab, var(--bg) 76%, #000), var(--accent) 6%);
            --desk-bar:    color-mix(in oklab, var(--desk-bg) 88%, #000);
            --desk-edge:   color-mix(in srgb, var(--line) 64%, var(--bg));
            --desk-focus:  color-mix(in srgb, var(--line) 52%, var(--accent));
            --desk-shadow: rgba(0, 0, 0, 0.55);
            --win-scale:   #1E90FF;     /* the Scale / Resize button (DodgerBlue); the other window buttons use --warn / --ok / --danger */
        }
        :root[data-theme="light"] .desktop
        {
            --desk-bg:     color-mix(in oklab, var(--bg) 76%, var(--line));
            --desk-bar:    color-mix(in oklab, var(--desk-bg) 76%, var(--line));
            --desk-shadow: color-mix(in srgb, var(--line) 38%, transparent);
            --win-scale:   #1873CC;     /* DodgerBlue, one step darker for a light bar */
        }

        /* THE DESK - where the windows live. The Nayive logo sits engraved in
           its centre, the same groove + lit edge as behind the launcher tiles. */
        .desk
        {
            position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
            isolation: isolate;          /* window z-indexes stay under the settings dialog */
            background: var(--desk-bg);
            --engrave-groove: color-mix(in srgb, var(--desk-bg) 55%, #000);
            --engrave-lit:    color-mix(in srgb, var(--desk-bg) 88%, #fff);
        }
        :root[data-theme="light"] .desk
        {
            --engrave-groove: color-mix(in srgb, var(--desk-bg) 87%, #000);
            --engrave-lit:    color-mix(in srgb, var(--desk-bg) 40%, #fff);
        }
        .desk::before,
        .desk::after
        {
            content: ""; position: absolute; left: 50%; top: 50%;
            width: min(38vw, 38vh); aspect-ratio: 1; translate: -50% -50%;
            pointer-events: none;
            -webkit-mask: url(../icons/logo-lines.svg) center / contain no-repeat;
                    mask: url(../icons/logo-lines.svg) center / contain no-repeat;
        }
        .desk::before { background: var(--engrave-lit); transform: translateY(1px); }
        .desk::after  { background: var(--engrave-groove); }

        /* While a window is dragged or resized the frames must not swallow the pointer. */
        .desk.busy iframe { pointer-events: none; }
        .desk.busy-frame .win:not(.dragging) iframe { pointer-events: none; }
        body.busy         { user-select: none; }
        /* A press on a title bar shows the grabbing hand until let go (grabCursor). */
        html.win-grab, html.win-grab * { cursor: grabbing !important; }

        /* Where a dragged window will land when let go at an edge. */
        .snap-ghost
        {
            position: absolute; z-index: 99999; pointer-events: none;
            border: 2px solid var(--accent); border-radius: var(--radius-m);
            background: color-mix(in srgb, var(--accent) 14%, transparent);
        }
        .snap-ghost[hidden] { display: none; }

        /* A WINDOW */
        .win
        {
            position: absolute; z-index: 1; display: flex; flex-direction: column;
            min-width: 320px; min-height: 200px;
            border: 2px solid var(--desk-edge); border-radius: var(--radius-m);
            background: var(--card); box-shadow: 0 12px 32px var(--desk-shadow);
            transform-origin: 0 0;      /* Scale (see SCALE): a shrunk window is drawn from its top-left corner */
        }
        .win.focused { border-color: var(--desk-focus); box-shadow: 0 20px 52px var(--desk-shadow); }
        .win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important;
                   border-radius: 0; border-width: 0; box-shadow: none; transform: none !important; }   /* maximised: always 1:1 */

        .win-bar
        {
            display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
            height: 44px; padding: 0 12px; cursor: default; user-select: none;
            border-bottom: 1px solid var(--line);
        }
        .win-bar > svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--accent); }
        .win-title
        {
            flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 0.9rem; font-weight: 600; color: var(--text-dim);
        }
        .win.focused .win-title { color: var(--text); }
        .win-frame { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg);
                     border-radius: 0 0 var(--radius-m) var(--radius-m); }
        .win.max .win-frame { border-radius: 0; }

        /* The app's own top row is the title bar (see adoptHead): no bar of ours. */
        .win.chromeless .win-bar   { display: none; }
        .win.chromeless .win-frame { border-radius: var(--radius-m); }
        .win.chromeless.max .win-frame { border-radius: 0; }

        /* Resize grips: four edges + four corners, invisible, just past the border.
           Sized in --win-px, one SCREEN pixel: a window shrunk by Scale keeps
           full-size grips, so even a tiny one can always be pulled bigger again. */
        .win  { --win-px: calc(1px / var(--win-s, 1)); }
        .grip { position: absolute; z-index: 2; }
        .grip.n, .grip.s { left: calc(8 * var(--win-px)); right: calc(8 * var(--win-px)); height: calc(8 * var(--win-px)); cursor: ns-resize; }
        .grip.e, .grip.w { top: calc(8 * var(--win-px)); bottom: calc(8 * var(--win-px)); width: calc(8 * var(--win-px)); cursor: ew-resize; }
        .grip.n { top: calc(-4 * var(--win-px)); }    .grip.s { bottom: calc(-4 * var(--win-px)); }
        .grip.e { right: calc(-4 * var(--win-px)); }  .grip.w { left: calc(-4 * var(--win-px)); }
        .grip.ne, .grip.nw, .grip.se, .grip.sw { width: calc(14 * var(--win-px)); height: calc(14 * var(--win-px)); }
        .grip.nw { left: calc(-4 * var(--win-px));  top: calc(-4 * var(--win-px));    cursor: nwse-resize; }
        .grip.se { right: calc(-4 * var(--win-px)); bottom: calc(-4 * var(--win-px)); cursor: nwse-resize; }
        .grip.ne { right: calc(-4 * var(--win-px)); top: calc(-4 * var(--win-px));    cursor: nesw-resize; }
        .grip.sw { left: calc(-4 * var(--win-px));  bottom: calc(-4 * var(--win-px)); cursor: nesw-resize; }
        .win.max .grip { display: none; }

        /* THE BAR - its height and font come from the settings. */
        .bar
        {
            display: flex; align-items: center; gap: 6px; flex: 0 0 auto;
            height: var(--bar-h); padding: 0 8px;
            border-top: 1px solid var(--desk-edge); background: var(--desk-bar);
            font-family: var(--bar-font, var(--font-sans));
        }
        .bar button { font-family: inherit; position: relative; }   /* position: holds the Chat and eMail dots */
        /* Unread Chat (red) and eMail (blue), see CHAT and EMAIL below. On the
           menu button: a plain dot, Chat top-right, eMail top-left. On the app's
           own bar button: a disc with the count on the app icon, so it never
           takes room from the name or covers the close (x). */
        .bar .chat-dot           { top: 3px; right: 3px; width: 8px; height: 8px; box-shadow: 0 0 0 1.5px var(--bg); }
        .bar .chat-dot.mail-dot  { right: auto; left: 3px; background: var(--busy); }
        .bar .chat-dot.has-count
        {
            top: 0; right: 0; left: auto;
            width: auto; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; line-height: 1; color: #fff;
        }
        .bar .task > .chat-dot.has-count { top: 1px; right: auto; left: 3px; }   /* over the app icon, clear of the name */
        .bar .chat-dot[hidden]   { display: none; }   /* .has-count's flex would beat app.css's */

        /* The menu button carries the Nayive logo, sized to the bar. */
        #menuBtn       { width: calc(var(--bar-h) - 8px); height: calc(var(--bar-h) - 8px); }
        #menuBtn img   { width: calc(var(--bar-h) * 0.58); height: calc(var(--bar-h) * 0.58); display: block; }
        /* Desktop-only state: while the menu is open its button keeps the hover wash. */
        #menuBtn.open  { background: color-mix(in srgb, var(--text) 14%, transparent); }

        .tasks { display: flex; align-items: center; gap: 4px; flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; }

        /* A window's button: the shared quiet .text-btn.ghost, narrowed to fit a bar. */
        .task { flex: 0 1 190px; min-width: 44px; height: calc(var(--bar-h) - 14px);
                justify-content: flex-start; padding: 0 10px; font-weight: 500; }
        .task > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task svg { color: var(--accent); }
        /* Desktop-only state: the window in front gets an accent underline; a minimised one fades. */
        .task.front { color: var(--text); border-color: var(--accent);
                      background: color-mix(in srgb, var(--accent) 12%, transparent); }
        .task.min   { opacity: 0.6; }
        /* THE WINDOW'S BUTTONS - Scale / Resize, minimise, maximise, close - at the
           right end of the bar button of the window IN FRONT only (the others show
           just their icon and name): small .icon-btn's sized to the bar, each in the
           colour the old title-bar dots had, Scale / Resize in blue (--win-scale). */
        .task           { padding-right: 3px; }
        /* The one in front keeps the others' size (190px) while its name, 1rem and
           its buttons fit in it - the buttons then at its right end. A longer name
           widens it, 1rem always between name and buttons, up to 300px; past that
           the name is cut (...). */
        .task.front     { flex: 0 1 auto; min-width: 190px; max-width: 300px; }
        .task.front > span:first-of-type { margin-right: calc(1rem - 6px); }   /* + .text-btn's 6px gap = 1rem */
        .task > .task-ctl { display: flex; flex: 0 0 auto; margin-left: auto; overflow: visible; }
        .task:not(.front) > .task-ctl { display: none; }
        .task-ctl > .task-x, #cdChip > .task-x { width: 22px; height: 22px; margin-left: auto; overflow: visible; color: var(--text-dim); }
        .task-ctl > .task-x   { margin-left: 0; }
        .task-ctl > .task-x svg { width: 14px; height: 14px; color: inherit; }
        .task-ctl > [data-win="scale"] { color: var(--win-scale); }
        .task-ctl > [data-win="min"]   { color: var(--warn); }
        .task-ctl > [data-win="max"]   { color: var(--ok); }
        .task-ctl > [data-win="close"] { color: var(--danger); }
        #cdChip > .task-x svg   { width: 12px; height: 12px; color: inherit; }
        #cdChip > .task-x:hover { color: var(--text); }

        /* The "⋮" sits closer to its neighbours: half the room a plain .icon-btn
           leaves on each side (his call for the "?" it replaced, 2026-09-28).
           Margins only - the button is the shared .icon-btn. Its right side counts
           the sync dot when it shows, the bar's end when it does not. */
        #moreBtn { margin: 0 -8px 0 -13px; }
        #moreBtn:has(+ #syncIndicator:not([hidden])) { margin-right: -10px; }
        #moreBtn[aria-expanded="true"] { background: color-mix(in srgb, var(--text) 14%, transparent); }
        /* Its menu: the shared .top-menu, above the windows; the Free/Tile switch
           is a row of it, as tall as a .menu-item. */
        #moreMenu { z-index: 100000; }
        #moreMenu .tile-sw { padding: 8px 12px; }

        /* THE TILE SWITCH (see TILE / UNTILE): "Free ()== Tile" - the shared .switch
           between two words. A word picks its side, the switch flips; the side in
           force reads bold; the word Tile while tiled tiles again. Greyed while
           there is no window on the desk. */
        .tile-sw      { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 0 4px; }
        .tile-word    { font-size: 0.85rem; font-weight: 500; color: var(--text-dim); cursor: pointer; user-select: none; white-space: nowrap; }
        .tile-sw:not(.on) .tile-word[data-tile="off"],
        .tile-sw.on .tile-word[data-tile="on"] { color: var(--text); font-weight: 600; }
        .tile-sw.idle { opacity: 0.5; }
        .tile-sw.idle .tile-word { cursor: default; }

        /* The clock: "<weekday> <date> <time>", each part optional but the time. A quiet
           .text-btn.ghost with no border: a press opens the countdown dialog. */
        #clock      { gap: 6px; height: calc(var(--bar-h) - 14px); padding: 0 10px; border-color: transparent;
                      font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
        #clock b    { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

        /* A running countdown, just before the clock: its time left, in the accent (its
           text shows only once time is up). A press on it (not on its small buttons) opens the dialog. */
        #cdChip       { gap: 6px; height: calc(var(--bar-h) - 14px); max-width: 300px; padding: 0 3px 0 10px; flex: 0 1 auto; min-width: 0;
                        color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); white-space: nowrap; }
        #cdChip b     { font-weight: 600; font-variant-numeric: tabular-nums; }
        #cdChip > .cd-text { overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); font-weight: 500; }
        #cdChip > .cd-text:empty { display: none; }
        #cdChip.paused b { opacity: 0.55; }
        /* Its small buttons at the right end (the window buttons' x look): Pause / Play
           and Stop while it runs; time's up: the chip stays, with the text (or 0:00),
           and only an x to take it away. */
        #cdChip > .task-x + .task-x { margin-left: 0; }
        #cdChip > .cd-stop, #cdChip > .cd-stop:hover { color: var(--danger); }
        #cdChip.done  { background: color-mix(in srgb, var(--accent) 14%, transparent); }
        #cdChip.done > .cd-text { color: var(--text); font-weight: 600; }
        #cdChip b:empty, #cdChip .task-x[hidden] { display: none; }

        /* THE COUNTDOWN DIALOG - hours / minutes / seconds side by side, the text below. */
        .cd-nums      { flex-wrap: nowrap; }
        .cd-nums .field { flex: 1 1 0; min-width: 76px; }
        .cd-nums .field input { width: 100%; text-align: center; font-variant-numeric: tabular-nums; }

        /* THE MENU - the real launcher in a frame, popped up over the bar's left end. */
        .menu
        {
            position: fixed; left: 8px; bottom: calc(var(--bar-h) + 8px); z-index: 100000;
            width: 440px; max-height: calc(100dvh - var(--bar-h) - 24px); height: 640px;   /* both follow the panel (onMenuLoad) */
            border: 1px solid var(--desk-edge); border-radius: 22px; overflow: hidden;
            background: var(--card); box-shadow: 0 20px 52px var(--desk-shadow);
        }
        .menu iframe { width: 100%; height: 100%; border: 0; }
        /* A dialog of the launcher's (My account, a new user's first password...)
           gets the whole screen, not the menu's corner (see menuSheets). */
        .menu.full { top: 0; left: 0; right: 0; bottom: 0; width: auto !important; height: auto !important; max-height: none;
                     border: 0; border-radius: 0; box-shadow: none; background: transparent; }

        /* Bar on top (settings): the column flips, the border moves, the menu drops
           down, and the shared notices (update bar, "space almost full") keep clear of it. */
        body.bar-top .desktop { flex-direction: column-reverse; }
        body.bar-top .bar     { border-top: 0; border-bottom: 1px solid var(--desk-edge); }
        body.bar-top .menu    { bottom: auto; top: calc(var(--bar-h) + 8px); }
        body.bar-top .menu.full { top: 0; bottom: 0; }     /* a launcher dialog still gets the whole screen */
        body.bar-top .session-bar          { top: var(--bar-h); }
        body:not(.bar-top) .quota-card     { bottom: calc(var(--bar-h) + 16px); }

        /* THE WINDOW SWITCHER - Alt pressed and let go on its own (see SWITCHER): one
           tile per window, the last used first, in the middle of the screen. */
        .switcher
        {
            position: fixed; left: 50%; top: 50%; translate: -50% -50%; z-index: 100001;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            width: max-content; max-width: min(90vw, 760px); padding: 14px;
            border: 1px solid var(--desk-edge); border-radius: var(--radius-l);
            background: var(--card); box-shadow: 0 20px 52px var(--desk-shadow);
            font-family: var(--bar-font, var(--font-sans));
        }
        /* A tile: the shared quiet .text-btn.ghost, stood up - the app's icon over the
           window's name. The chosen one gets the bar's "in front" look. */
        .sw-item            { flex-direction: column; justify-content: center; gap: 10px; width: 132px; height: 108px;
                              padding: 10px 8px; font-family: inherit; font-weight: 500; }
        .sw-item svg        { width: 40px; height: 40px; color: var(--accent); }
        .sw-item > span     { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; }
        .sw-item.min        { opacity: 0.6; }
        .sw-item.sel        { opacity: 1; color: var(--text); border-color: var(--accent);
                              background: color-mix(in srgb, var(--accent) 12%, transparent); }
        .sw-item:focus-visible { outline: none; }      /* .sel already shows it */

        /* SETTINGS: one pill per tab, the tick-box rows, the bar-height slider. */
        .set-tabs   { display: flex; gap: 6px; margin: 0 0 16px; }
        .set-check  { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; cursor: pointer; }
        .set-range  { display: flex; align-items: center; gap: 10px; }
        .set-range input { flex: 1 1 auto; }
        .set-range output { flex: 0 0 auto; min-width: 4em; text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }

    </style>
</head>
<body>
    <div class="desktop" id="desktop">
        <div class="desk" id="desk"><div class="snap-ghost" id="snapGhost" hidden></div></div>

        <div class="bar" id="bar">
            <button class="icon-btn" id="menuBtn" data-i18n-attr="title:ui.toApps" title="Apps"><img src="../icons/icon-192.png" alt=""></button>
            <div class="tasks" id="tasks"></div>
            <button id="cdChip" class="text-btn ghost" type="button" hidden><b></b><span class="cd-text"></span><span class="icon-btn task-x cd-pp" role="button" data-cd="pp"></span><span class="icon-btn task-x cd-stop" role="button" data-cd="stop"></span><span class="icon-btn task-x cd-x" role="button" data-cd="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span></button>
            <button id="clock" class="text-btn ghost" type="button"><span></span><b></b></button>
            <!-- MORE (2026-09-28) - the "⋮" after the clock: what used to sit on the
                 bar (Free/Tile, the "?") and what has no room there (Lock now).
                 More rows will come; see MORE below. -->
            <button id="moreBtn" class="icon-btn" type="button" aria-expanded="false" data-i18n-attr="title:ui.moreOptions, aria-label:ui.moreOptions"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
            <!-- ONE connection status for every window (see SYNC below); hidden until one has its own. -->
            <button id="syncIndicator" class="sync-indicator" type="button" hidden data-i18n-attr="title:ui.synced"></button>
        </div>

        <div class="menu" id="menu" hidden></div>

        <div class="top-menu" id="moreMenu" role="menu" hidden>
            <!-- TILE - one switch for the whole desk (see TILE / UNTILE): Free <-> Tile.
                 Not a button, so flipping it leaves the menu open. -->
            <div class="tile-sw" id="tileSw" data-i18n-attr="title:desktop.tileTip">
                <span class="tile-word" data-tile="off" data-i18n="desktop.tileFree"></span>
                <label class="switch sm"><input type="checkbox" id="tileChk" data-i18n-attr="aria-label:desktop.tileTip"><span class="track"></span></label>
                <span class="tile-word" data-tile="on" data-i18n="desktop.tileOn"></span>
            </div>
            <div class="menu-sep"></div>
            <button class="menu-item" id="lockNowBtn" type="button" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><span data-i18n="desktop.lockNow"></span></button>
            <!-- HELP - the shared help card (NayiveUI.firstRun, see HELP below). -->
            <button class="menu-item" id="helpBtn" data-intro-open type="button" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg><span data-i18n="ui.help"></span></button>
        </div>

        <!-- WINDOW SWITCHER - Alt pressed and let go on its own (see SWITCHER). -->
        <div class="switcher" id="switcher" role="listbox" hidden data-i18n-attr="aria-label:desktop.switchWin"></div>
    </div>

    <!-- COUNTDOWN - opened by the clock (or the countdown's chip on the bar): hours /
         minutes / seconds + an optional text; Play starts it (a running one is
         replaced). Pause / Play and Stop live on the chip, not here. -->
    <div class="sheet-backdrop" id="cdBackdrop">
        <div class="sheet sheet--pack" role="dialog" aria-modal="true" data-i18n-attr="aria-label:desktop.countdown">
            <h2 data-i18n="desktop.countdown"></h2>
            <div class="field-row cd-nums">
                <div class="field"><label for="cdH" data-i18n="desktop.cdHours"></label><input id="cdH" type="number" min="0" max="99" step="1" inputmode="numeric"></div>
                <div class="field"><label for="cdM" data-i18n="desktop.cdMins"></label><input id="cdM" type="number" min="0" max="59" step="1" inputmode="numeric"></div>
                <div class="field"><label for="cdS" data-i18n="desktop.cdSecs"></label><input id="cdS" type="number" min="0" max="59" step="1" inputmode="numeric"></div>
            </div>
            <div class="field">
                <label for="cdText" data-i18n="desktop.cdText"></label>
                <input id="cdText" type="text" maxlength="120" autocomplete="off" spellcheck="false">
            </div>
            <div class="sheet-actions">
                <button data-act="close" type="button" data-i18n-attr="title:ui.close"></button>
                <button id="cdPlay" type="button" data-act="primary:play" data-i18n-attr="title:desktop.cdStart"></button>
            </div>
        </div>
    </div>

    <!-- DESKTOP SETTINGS - this device's desktop, not the account (that is the
         launcher's cog -> My account). Every change applies at once. Its colours
         are not here: they follow the account's scheme (see THE DESKTOP'S COLOURS). -->
    <div class="sheet-backdrop" id="setBackdrop">
        <div class="sheet" role="dialog" aria-modal="true" data-i18n-attr="aria-label:desktop.settings">
            <h2 data-i18n="desktop.settings"></h2>
            <div class="set-tabs" role="tablist">
                <button class="pill is-active" type="button" role="tab" data-tab="desk"    data-i18n="desktop.tabDesktop"></button>
                <button class="pill"           type="button" role="tab" data-tab="clock"   data-i18n="desktop.tabClock"></button>
            </div>

            <div data-pane="desk">
                <div class="field">
                    <label for="setStart" data-i18n="desktop.start"></label>
                    <select id="setStart">
                        <option value="auto"     data-i18n="desktop.startAuto"></option>
                        <option value="desktop"  data-i18n="desktop.startDesktop"></option>
                        <option value="launcher" data-i18n="desktop.startLauncher"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="setBar" data-i18n="desktop.barPos"></label>
                    <select id="setBar">
                        <option value="bottom" data-i18n="desktop.barBottom"></option>
                        <option value="top"    data-i18n="desktop.barTop"></option>
                    </select>
                </div>
                <div class="field">
                    <label for="setBarH" data-i18n="desktop.barHeight"></label>
                    <div class="set-range">
                        <input type="range" id="setBarH" min="40" max="72" step="2">
                        <output id="setBarHOut" for="setBarH"></output>
                    </div>
                </div>
                <div class="field">
                    <label for="setFont" data-i18n="desktop.font"></label>
                    <select id="setFont">
                        <option value="system"  data-i18n="desktop.fontSystem"></option>
                        <option value="serif"   data-i18n="desktop.fontSerif"></option>
                        <option value="rounded" data-i18n="desktop.fontRounded"></option>
                        <option value="mono"    data-i18n="desktop.fontMono"></option>
                    </select>
                </div>
            </div>

            <div data-pane="clock" hidden>
                <div class="field">
                    <label for="setDow" data-i18n="desktop.weekday"></label>
                    <select id="setDow">
                        <option value="none"  data-i18n="desktop.weekdayNone"></option>
                        <option value="short" data-i18n="desktop.weekdayShort"></option>
                        <option value="long"  data-i18n="desktop.weekdayLong"></option>
                    </select>
                </div>
                <label class="set-check"><input type="checkbox" id="setDate"><span data-i18n="desktop.showDate"></span></label>
                <label class="set-check"><input type="checkbox" id="setSecs"><span data-i18n="desktop.showSeconds"></span></label>
            </div>

            <div class="sheet-actions">
                <button data-act="close" data-i18n-attr="title:ui.close, aria-label:ui.close"></button>
            </div>
        </div>
    </div>

    <!-- NayiveUI.toast / undoToast (styled by shared/theme.css). -->
    <div id="toast" class="toast" role="status"></div>

<script>
( function ()
{
    var ROOT    = '/nayive/';
    var desktop = document.getElementById( 'desktop' );
    var desk    = document.getElementById( 'desk' );
    var bar     = document.getElementById( 'bar' );
    var tasks   = document.getElementById( 'tasks' );
    var menu    = document.getElementById( 'menu' );
    var menuBtn = document.getElementById( 'menuBtn' );
    var ghost   = document.getElementById( 'snapGhost' );

    var ICON_WIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>';

    function t( key, fallback )
    {
        var s = window.NayiveI18n ? NayiveI18n.t( key ) : key;
        return ( ! s || s === key ) ? ( fallback || key ) : s;
    }

    function store( key, val )
    {
        try { if( val === undefined ) return JSON.parse( localStorage.getItem( key ) || 'null' ); localStorage.setItem( key, JSON.stringify( val ) ); }
        catch( e ) { return null; }
    }

    //------------------------------------------------------------------------//
    // SETTINGS - this device's desktop (a PC and a tablet can each want their
    // own), in localStorage "balata-desktop". The launcher reads `start` too.

    var SET_KEY = 'balata-desktop';
    var set = { start: 'auto', bar: 'bottom', barH: 48, font: 'system',
                dow: 'short', date: false, secs: false };
    Object.assign( set, store( SET_KEY ) || {} );
    // Until 2026-09-26 the desktop had its own colour schemes; they now follow the account's.
    delete set.scheme; delete set.active; delete set.schemes;
    // `scaleNew` (new windows start with Scale on) is set by the launcher's My
    // account, in the menu's frame: read fresh, never written back from here.
    function saveSet() { set.scaleNew = !! ( store( SET_KEY ) || {} ).scaleNew; store( SET_KEY, set ); }

    var FONTS = {
        system:  '',
        serif:   'Georgia, "Times New Roman", Times, serif',
        rounded: 'ui-rounded, "SF Pro Rounded", "Varela Round", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif',
        mono:    'var(--font-mono)'
    };

    function applyLayout()
    {
        document.body.classList.toggle( 'bar-top', set.bar === 'top' );
        document.documentElement.style.setProperty( '--bar-h', Math.max( 40, Math.min( 72, +set.barH || 48 ) ) + 'px' );
        if( FONTS[ set.font ] ) desktop.style.setProperty( '--bar-font', FONTS[ set.font ] );
        else                    desktop.style.removeProperty( '--bar-font' );
    }

    applyLayout();

    //------------------------------------------------------------------------//
    // APP ICONS AND NAMES - read once from the launcher's own tiles (Office's
    // and Records' popups are tiles too), so the desktop never keeps a second copy of them.
    // Keyed by the app's folder.

    var APPS = {};     // "drive" -> { name, svg }
    var appsReady = fetch( '../index.html', { credentials: 'same-origin' } )
        .then( function ( r ) { return r.text(); } )
        .then( function ( html )
        {
            var doc = new DOMParser().parseFromString( html, 'text/html' );
            [].forEach.call( doc.querySelectorAll( 'a.tile[href]' ), function ( a )
            {
                var dir = a.getAttribute( 'href' ).split( '/' )[ 0 ];
                var svg = a.querySelector( 'svg' );
                var sp  = a.querySelector( 'span' );
                APPS[ dir ] = { name: sp ? sp.textContent.trim() : dir, svg: svg ? svg.outerHTML : ICON_WIN };
            } );
        } )
        .catch( function () {} );

    function appOf( url )
    {
        try
        {
            var p = new URL( url, location.href ).pathname;
            if( p.indexOf( ROOT ) !== 0 ) return '';
            return p.slice( ROOT.length ).split( '/' )[ 0 ];
        }
        catch( e ) { return ''; }
    }

    //------------------------------------------------------------------------//
    // WINDOWS

    var wins  = [];     // in the order they were opened = the order of the bar buttons
    var zTop  = 10;
    var front = null;

    // The smallest a window gets (.win's min-width / min-height too). With Scale
    // on there is no smallest: it shrinks what it shows instead (see SCALE).
    var MIN_W = 320, MIN_H = 200;

    function deskRect() { return { w: desk.clientWidth, h: desk.clientHeight }; }

    // opts.fresh: a new window even if the app has one; opts.geom: {l,t,w,h} to
    // restore; opts.nav: an app already open goes to `url` (a notification, "big files").
    function openApp( url, opts )
    {
        opts = opts || {};
        var app = appOf( url );
        if( app && ! opts.fresh )
            for( var i = 0; i < wins.length; i++ )
                if( wins[ i ].app === app ) { reuse( wins[ i ], url, opts.nav ); return wins[ i ]; }

        var info = APPS[ app ] || { name: app ? app.charAt( 0 ).toUpperCase() + app.slice( 1 ) : 'Nayive', svg: ICON_WIN };
        var w = { app: app, name: info.name, svg: info.svg, url: '', pre: null,
                  scale: !! ( store( SET_KEY ) || {} ).scaleNew, nat: null, s: 1, g: null };     // see SCALE; My account sets the default

        var el = document.createElement( 'div' );
        el.className = 'win';
        el.innerHTML =
            '<div class="win-bar">' + info.svg + '<span class="win-title"></span></div>' +
            '<iframe class="win-frame"></iframe>' +
            [ 'n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw' ].map( function ( d ) { return '<div class="grip ' + d + '" data-dir="' + d + '"></div>'; } ).join( '' );
        el.querySelector( '.win-title' ).textContent = info.name;

        var g = opts.geom;
        if( g )
        {
            // a saved window: "123px" strings, plus its Scale (see SCALE)
            w.scale = !! g.scale; w.nat = g.nat || null;
            g = { l: parseFloat( g.l ) || 0, t: parseFloat( g.t ) || 0, w: parseFloat( g.w ) || 0, h: parseFloat( g.h ) || 0 };
        }
        else
        {
            // 70% x 82% of the desk, each new one 32px down-right of the last.
            var r = deskRect();
            var W = Math.min( 1100, Math.round( r.w * 0.7 ) ), H = Math.min( 780, Math.round( r.h * 0.82 ) );
            var n = wins.length % 6;
            g = { l: Math.max( 0, Math.round( ( r.w - W ) / 2 ) - 80 + n * 32 ), t: Math.max( 0, 24 + n * 32 ), w: W, h: H };
        }

        var btn = document.createElement( 'button' );
        btn.className = 'text-btn ghost task';
        btn.innerHTML = info.svg + '<span></span><span class="task-ctl">' +
            CTL.map( function ( d ) { return '<span class="icon-btn task-x" role="button" data-win="' + d[ 0 ] + '">' + d[ 3 ] + '</span>'; } ).join( '' ) +
            '</span>';
        btn.querySelector( 'span' ).textContent = info.name;
        btn.title = info.name;
        CTL.forEach( function ( d )
        {
            if( ! d[ 1 ] ) return;              // Scale / Resize: see paintScale
            var b = btn.querySelector( '[data-win="' + d[ 0 ] + '"]' );
            b.title = t( d[ 1 ], d[ 2 ] );
            b.setAttribute( 'aria-label', b.title );
        } );

        w.el = el; w.btn = btn; w.frame = el.querySelector( 'iframe' );
        wins.push( w );
        desk.appendChild( el );
        place( w, g );
        tasks.appendChild( btn );

        wire( w );
        if( url ) w.frame.src = url;
        focus( w );
        placeUnread();
        placeMail();
        retile();
        return w;
    }

    function reuse( w, url, nav )
    {
        focus( w );
        if( ! nav || ! url ) return;
        var u = new URL( url, location.href ), want = u.pathname + u.search + u.hash;
        // Chat is never reloaded (it may be in a call): it is told which chat to show.
        if( w.app === 'chat' )
        {
            try
            {
                var cw = w.frame.contentWindow;
                cw.navigator.serviceWorker.dispatchEvent( new cw.MessageEvent( 'message', { data: { open: u.href } } ) );
            }
            catch( e ) {}
            return;
        }
        if( w.url !== want ) w.frame.src = want;
    }

    function setTitle( w, text, tip )
    {
        w.el.querySelector( '.win-title' ).textContent = text;
        w.btn.querySelector( 'span' ).textContent = text;
        w.btn.title = tip || text;
    }

    function focus( w )
    {
        var back = w.el.hidden;     // brought back from the bar: it was minimised
        if( back ) w.el.hidden = false;
        w.el.style.zIndex = ++zTop;
        var was = front;
        front = w;
        paint();
        saveWins();
        if( back ) { queueMeasure( w ); retile(); }
        if( was && was !== w && was.app === 'chat' ) pokeUnread();
        if( was && was !== w && was.app === 'email' ) askMail();
    }

    function minimise( w )
    {
        w.el.hidden = true;
        if( front === w ) front = topmost();
        paint();
        saveWins();
        retile();
    }

    function close( w )
    {
        w.el.remove(); w.btn.remove();
        wins.splice( wins.indexOf( w ), 1 );
        if( front === w ) front = topmost();
        paint();
        placeUnread();
        placeMail();
        if( w.app === 'email' ) askMail();
        if( tiled ) { tiled.snaps.delete( w ); if( ! wins.length ) tiled = null; }
        paintTile();
        saveWins();
        retile();
    }

    function topmost()
    {
        var best = null;
        wins.forEach( function ( w ) { if( ! w.el.hidden && ( ! best || +w.el.style.zIndex > +best.el.style.zIndex ) ) best = w; } );
        return best;
    }

    function paint()
    {
        wins.forEach( function ( w )
        {
            var isFront = ( w === front && ! w.el.hidden );
            w.el.classList.toggle( 'focused', isFront );
            w.btn.classList.toggle( 'front', isFront );
            w.btn.classList.toggle( 'min', w.el.hidden );
            paintScale( w );
        } );
        paintTile();
    }

    function act( w, what )
    {
        if( what === 'min' )   minimise( w );
        if( what === 'max' )   setMax( w, ! isMax( w ) );
        if( what === 'close' ) close( w );
        if( what === 'scale' ) setScale( w, ! w.scale );
    }

    function wire( w )
    {
        var el = w.el;

        // The bar button: bring forward - or, when already in front, minimise. Its
        // window's buttons (in front only) do their own job.
        w.btn.addEventListener( 'click', function ( e )
        {
            var b = e.target.closest( '[data-win]' );
            if( b ) { act( w, b.getAttribute( 'data-win' ) ); return; }
            if( w === front && ! el.hidden ) minimise( w ); else focus( w );
        } );

        el.querySelector( '.win-bar' ).addEventListener( 'dblclick', function ( e )
        {
            if( ! e.target.closest( 'button' ) ) act( w, 'max' );
        } );

        el.addEventListener( 'pointerdown', function () { if( front !== w ) focus( w ); }, true );

        // Drag by the title bar; resize by the grips.
        el.addEventListener( 'pointerdown', function ( e )
        {
            if( e.button !== 0 ) return;
            var grip = e.target.closest( '.grip' );
            var wbar = ! grip && e.target.closest( '.win-bar' );
            if( ! grip && ! wbar ) return;
            if( wbar && ( e.target.closest( 'button' ) || el.classList.contains( 'max' ) ) ) return;
            drag( w, e, grip ? grip.getAttribute( 'data-dir' ) : '' );
        } );

        // Inside the frame (same origin): a press brings the window forward, the
        // document's name names it, and a new-tab open becomes a new desktop window.
        w.frame.addEventListener( 'load', function ()
        {
            var cw;
            try { cw = w.frame.contentWindow; cw.document; } catch( e ) { return; }
            if( ! cw ) return;
            // A signed-out app lands on the login page: that belongs to the whole desktop.
            if( /\/login\.html$/.test( cw.location.pathname ) ) { location.href = cw.location.href; return; }
            // kept without the origin: a site moved to https still finds its windows
            if( cw.location.href !== 'about:blank' ) { w.url = cw.location.pathname + cw.location.search + cw.location.hash; saveWins(); }
            w.el.classList.remove( 'chromeless' );
            cw.addEventListener( 'pointerdown', function () { closeMenu(); if( front !== w ) focus( w ); }, true );
            hookAlt( cw );
            hookInner( w, cw );
            // Taking the keys out of a frame drops its caret: kept here for giveKeys.
            cw.document.addEventListener( 'focusin', function ( e ) { w.lastFocus = e.target; }, true );
            // A plain link to the launcher (Planner's name) opens the menu instead.
            cw.document.addEventListener( 'click', function ( e )
            {
                var a = e.target.closest && e.target.closest( 'a[href]' );
                if( ! a || ! /^\/nayive\/(index\.html)?$/.test( new URL( a.href, cw.location.href ).pathname ) ) return;
                e.preventDefault();
                openMenu();
            }, true );
            hookOpen( cw );
            trackTitle( w, cw );
            adoptHead( w, cw );
            paint();
            // Scale: the new page is measured, and again each time it changes -
            // its data came in, a panel opened (see SCALE).
            new cw.MutationObserver( function () { if( w.scale && w.frame.contentWindow === cw ) queueMeasure( w ); } )
                .observe( cw.document.documentElement, { childList: true, subtree: true, characterData: true,
                                                         attributes: true, attributeFilter: [ 'class', 'style', 'hidden' ] } );
            if( w.scale ) queueMeasure( w );
        } );
    }

    // Frames inside the window's page (Planner's Calendar / Tasks / Habits): a
    // press there never reaches the page's own listener, so each inner page -
    // at any depth, also one that loads later - brings the window forward too.
    function hookInner( w, cw )
    {
        function hook( f )
        {
            if( f._deskHooked ) return;
            f._deskHooked = true;
            function on()
            {
                var icw;
                try { icw = f.contentWindow; icw.document; } catch( e ) { return; }
                if( ! icw || icw._deskHooked ) return;
                icw._deskHooked = true;
                icw.addEventListener( 'pointerdown', function () { closeMenu(); closeMore(); if( front !== w ) focus( w ); }, true );
                hookAlt( icw );
                hookInner( w, icw );
            }
            f.addEventListener( 'load', on );
            on();
        }
        function scan( root ) { if( root.tagName === 'IFRAME' ) hook( root ); else if( root.querySelectorAll ) root.querySelectorAll( 'iframe' ).forEach( hook ); }
        scan( cw.document.documentElement );
        new cw.MutationObserver( function ( recs )
        {
            recs.forEach( function ( r ) { r.addedNodes.forEach( scan ); } );
        } ).observe( cw.document.documentElement, { childList: true, subtree: true } );
    }

    // The bar button says which DOCUMENT the window shows: Write / Calc / Text
    // name it in their #fileLabel, the other apps in their page title.
    function trackTitle( w, cw )
    {
        var doc = cw.document, label = doc.getElementById( 'fileLabel' );
        function update()
        {
            if( w.frame.contentWindow !== cw ) return;
            var name = label ? label.textContent.trim() : '';
            // Chat's "(3) Chat": the count is already on the button's red disc.
            var tt   = doc.title && doc.title !== 'about:blank' ? doc.title.replace( /^\(\d+\+?\)\s*/, '' ) : '';
            var text = name || tt || w.name;
            setTitle( w, text, text === w.name ? w.name : w.name + ' - ' + text );
        }
        update();
        var mo = new cw.MutationObserver( update ), opt = { childList: true, characterData: true, subtree: true };
        if( label ) mo.observe( label, opt );
        var te = doc.querySelector( 'title' );
        if( te ) mo.observe( te, opt );
    }

    // Move (dir "") or resize (dir "n", "se"...) a window with the pointer that
    // pressed. Screen coordinates, because the press may come from INSIDE the
    // frame (the app's own top row), whose client coordinates move with it.
    // A move let go at the desk's left / right edge fills that half of it, at
    // the top edge the whole of it; dragging a half-window again gives it back
    // its old size.
    // The grabbing hand, from the press on a title bar until it is let go. An
    // app's own row lives in its frame, so the rule goes into that page too.
    function grabCursor( doc, on )
    {
        if( on && ! doc.getElementById( 'winGrabCss' ) )
        {
            var st = doc.createElement( 'style' );
            st.id = 'winGrabCss';
            st.textContent = 'html.win-grab, html.win-grab * { cursor: grabbing !important; }';
            doc.head.appendChild( st );
        }
        doc.documentElement.classList.toggle( 'win-grab', on );
    }

    function drag( w, e, dir )
    {
        var el = w.el, inFrame = e.target.ownerDocument !== document;
        // Inside a frame the page holds the pointer, not the element pressed: an
        // app may redraw its row mid-drag (Trips does) and take that element away.
        var tgt = inFrame ? e.target.ownerDocument.documentElement : e.target;
        var x0 = e.screenX, y0 = e.screenY;
        var L = w.g.l, T = w.g.t, W = w.g.w, H = w.g.h;
        var r = deskRect(), zone = '';
        var minW = w.scale ? 1 : MIN_W, minH = w.scale ? 1 : MIN_H;     // Scale on: no smallest size

        // Where the pointer is on the desk (a move only needs this for the edges).
        var dr = desk.getBoundingClientRect(), px, py;
        // (a page shrunk by Scale counts in its own, bigger pixels: times w.s)
        if( inFrame ) { var fr = w.frame.getBoundingClientRect(); px = fr.left + e.clientX * w.s - dr.left; py = fr.top + e.clientY * w.s - dr.top; }
        else          { px = e.clientX - dr.left; py = e.clientY - dr.top; }
        if( ! dir && w.pre )
        {
            var fx = ( px - L ) / W;
            W = w.pre.w; H = w.pre.h; L = Math.round( px - fx * W );
            w.pre = null;
            place( w, { l: L, t: T, w: W, h: H } );
            W = w.g.w; H = w.g.h;
        }

        e.preventDefault();
        try { tgt.setPointerCapture( e.pointerId ); } catch( err ) {}
        // No frame may swallow the pointer on the way - except the one that holds it.
        el.classList.add( 'dragging' );
        desk.classList.add( inFrame ? 'busy-frame' : 'busy' ); document.body.classList.add( 'busy' );
        if( inFrame ) tgt.ownerDocument.documentElement.style.userSelect = 'none';
        if( ! dir ) { grabCursor( document, true ); if( inFrame ) grabCursor( tgt.ownerDocument, true ); }

        function showZone( z )
        {
            zone = z;
            ghost.hidden = ! z;
            if( ! z ) return;
            var half = Math.round( r.w / 2 );
            ghost.style.left   = ( z === 'right' ? half : 0 ) + 'px';
            ghost.style.top    = '0px';
            ghost.style.width  = ( z === 'top' ? r.w : half ) + 'px';
            ghost.style.height = r.h + 'px';
        }

        function move( ev )
        {
            var dx = ev.screenX - x0, dy = ev.screenY - y0;
            if( ! dir )
            {
                // keep at least the top row reachable (all of a window smaller than that)
                var kx = Math.min( 80, W ), ky = Math.min( 38, H );
                moveTo( w, Math.min( r.w - kx, Math.max( kx - W, L + dx ) ), Math.min( r.h - ky, Math.max( 0, T + dy ) ) );
                var cx = px + dx, cy = py + dy;
                showZone( cx <= 6 ? 'left' : cx >= r.w - 6 ? 'right' : cy <= 6 ? 'top' : '' );
                return;
            }
            var nl = L, nt = T, nw = W, nh = H;
            if( dir.indexOf( 'e' ) >= 0 ) nw = Math.max( minW, W + dx );
            if( dir.indexOf( 's' ) >= 0 ) nh = Math.max( minH, H + dy );
            if( dir.indexOf( 'w' ) >= 0 ) { nw = Math.max( minW, W - dx ); nl = L + W - nw; }
            if( dir.indexOf( 'n' ) >= 0 ) { nh = Math.max( minH, H - dy ); nt = Math.max( 0, T + H - nh ); nh = T + H - nt; }
            place( w, { l: nl, t: nt, w: nw, h: nh } );
            // A shrunk window that cannot stretch further one way (NayiveTiling.fit's
            // cap) keeps the edge that is not being pulled where it was.
            if( dir.indexOf( 'w' ) >= 0 && w.g.w !== nw ) moveTo( w, nl + nw - w.g.w, w.g.t );
            if( dir.indexOf( 'n' ) >= 0 && w.g.h !== nh ) moveTo( w, w.g.l, nt + nh - w.g.h );
        }
        function up()
        {
            el.classList.remove( 'dragging' );
            desk.classList.remove( 'busy', 'busy-frame' ); document.body.classList.remove( 'busy' );
            if( inFrame ) tgt.ownerDocument.documentElement.style.userSelect = '';
            if( ! dir ) { grabCursor( document, false ); if( inFrame ) grabCursor( tgt.ownerDocument, false ); }
            tgt.removeEventListener( 'pointermove', move );
            tgt.removeEventListener( 'pointerup', up );
            tgt.removeEventListener( 'pointercancel', up );
            if( zone === 'top' ) { moveTo( w, L, T ); setMax( w, true ); }
            else if( zone )
            {
                w.pre = { w: W, h: H };
                var half = Math.round( r.w / 2 );
                place( w, { l: zone === 'right' ? half : 0, t: 0, w: zone === 'right' ? r.w - half : half, h: r.h } );
            }
            showZone( '' );
            saveWins();
        }
        tgt.addEventListener( 'pointermove', move );
        tgt.addEventListener( 'pointerup', up );
        tgt.addEventListener( 'pointercancel', up );
    }

    //------------------------------------------------------------------------//
    // THE WINDOW'S BUTTONS live on the bar, on the bar button of the window in
    // front (see .task-ctl): Scale / Resize, minimise, maximise, close. Scale /
    // Resize is two-state: its icon and tooltip say which way the window is now.
    var SVG_OPEN     = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">';
    var ICON_SCALE   = SVG_OPEN + '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M14 15H9v-5"/><path d="M16 3h5v5"/><path d="M21 3 9 15"/></svg>';
    var ICON_RESIZE  = SVG_OPEN + '<polyline points="5 11 5 5 11 5"/><polyline points="19 13 19 19 13 19"/><line x1="5" y1="5" x2="19" y2="19"/></svg>';
    var ICON_TILE    = SVG_OPEN + '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="12" y1="12" x2="21" y2="12"/></svg>';
    var CTL = [
        [ 'scale', '',                 '',         ICON_RESIZE ],
        [ 'min',   'desktop.minimise', 'Minimise', SVG_OPEN + '<line x1="5" y1="12" x2="19" y2="12"/></svg>' ],
        [ 'max',   'desktop.maximise', 'Maximise', SVG_OPEN + '<rect x="5" y="5" width="14" height="14" rx="2"/></svg>' ],
        [ 'close', 'ui.close',         'Close',    SVG_OPEN + '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>' ]
    ];

    function paintScale( w )
    {
        var b = w.btn.querySelector( '[data-win="scale"]' ), on = !! w.scale;
        if( ! b || b.getAttribute( 'aria-pressed' ) === String( on ) ) return;
        b.setAttribute( 'aria-pressed', String( on ) );
        b.innerHTML = on ? ICON_SCALE : ICON_RESIZE;
        b.title = on ? t( 'desktop.scaleOn',  'Scale: a smaller window shrinks everything in it' )
                     : t( 'desktop.scaleOff', 'Resize: a smaller window rearranges its content' );
        b.setAttribute( 'aria-label', b.title );
    }

    //------------------------------------------------------------------------//
    // THE APP'S OWN TOP ROW AS TITLE BAR. Every app opens with a row holding
    // its icon, its name and its toolbar; in a window that row drags the window
    // from any empty spot and maximises it on a double click. The row is the
    // first one that holds the app's icon - also when it is only a column
    // (Chat's list) or sits in a card (Trips). A page with no such row (a
    // document opened blank) keeps the desktop's own bar.

    var HEAD_SEL    = '.topbar, .header, .trip-header';
    var INTERACTIVE = 'button, a, input, select, textarea, label, [contenteditable], [role="button"], [tabindex]';

    function findHead( doc )
    {
        var list = doc.querySelectorAll( HEAD_SEL );
        for( var i = 0; i < list.length; i++ )
        {
            var r = list[ i ].getBoundingClientRect();
            if( r.height > 0 && list[ i ].querySelector( '.app-icon' ) ) return list[ i ];
        }
        return null;
    }

    function adoptHead( w, cw )
    {
        var doc = cw.document, head = null;

        // Find the row - and find it again. Some apps draw their row only once
        // their data is in, and some redraw it, so this runs on every change of
        // the page. Once found, the same row stays the title bar while it is on
        // the page: Trips keeps its header box when a trip is open, even though
        // the app icon is gone from it then.
        function ensure()
        {
            if( w.frame.contentWindow !== cw ) { mo.disconnect(); return; }
            if( ! head || ! head.isConnected ) head = findHead( doc );
            if( ! head ) return;
            if( ! w.el.classList.contains( 'chromeless' ) ) { w.el.classList.add( 'chromeless' ); paint(); }
        }
        // style / hidden too: an app that starts with its whole page hidden
        // (#app display: none until signed in) and then only UN-hides parts -
        // eMail with no account yet - adds no node at all, and its row would
        // never be found. Only those two attributes, so the rest of the app's
        // restyling does not wake this up.
        var mo = new cw.MutationObserver( ensure );
        mo.observe( doc.documentElement, { childList: true, subtree: true,
                                           attributes: true, attributeFilter: [ 'style', 'hidden' ] } );
        ensure();

        // A press only becomes a drag once it moves 4px: Calc, Write and Text
        // fill most of the row with their file name, which a plain click edits,
        // and Trips with its name, which a plain click takes to the menu.
        // The empty strip ABOVE the row drags too, and so does any empty spot
        // of a layer that covers the row (data-win-drag: Chat's call screen),
        // except its own boxes (data-win-nodrag: the picture in the corner).
        doc.addEventListener( 'pointerdown', function ( e )
        {
            if( e.button !== 0 || e.target.closest( INTERACTIVE ) || w.el.classList.contains( 'max' ) ) return;
            var cover = e.target.closest( '[data-win-drag]' );
            if( cover ? e.target.closest( '[data-win-nodrag]' ) : ! head ) return;
            if( ! cover && ! head.contains( e.target ) && e.clientY >= head.getBoundingClientRect().top ) return;
            var x0 = e.screenX, y0 = e.screenY;
            grabCursor( doc, true );                              // the hand shows on the press, not the 4px
            function move( ev )
            {
                if( Math.abs( ev.screenX - x0 ) + Math.abs( ev.screenY - y0 ) < 4 ) return;
                stop();
                drag( w, e, '' );
                // ...and the click that ends the drag must not edit the name. The
                // browser fires it right after pointerup, if at all: the eater
                // leaves on the next tick either way.
                function eat( c ) { c.stopPropagation(); c.preventDefault(); }
                doc.addEventListener( 'click', eat, true );
                doc.addEventListener( 'pointerup', function () { setTimeout( function () { doc.removeEventListener( 'click', eat, true ); }, 0 ); }, { capture: true, once: true } );
            }
            function stop()
            {
                grabCursor( doc, false );                         // drag() puts it back if a drag starts
                doc.removeEventListener( 'pointermove', move, true );
                doc.removeEventListener( 'pointerup', stop, true );
            }
            doc.addEventListener( 'pointermove', move, true );
            doc.addEventListener( 'pointerup', stop, true );
        } );
        doc.addEventListener( 'dblclick', function ( e )
        {
            if( head && head.contains( e.target ) && ! e.target.closest( INTERACTIVE ) ) act( w, 'max' );
        } );
    }

    // window.open from inside an app: a Nayive page opens as a desktop window; the
    // opener gets that window's frame, so Drive's "open blank now, point it at the
    // file later" still works. Anything else (a map, an outside site) keeps its tab.
    function hookOpen( cw )
    {
        var real = cw.open;
        cw.open = function ( url, target, features )
        {
            url = url || '';
            if( url && ! appOf( url ) ) return real.call( cw, url, target, features );
            var abs = url ? new URL( url, cw.location.href ).href : 'about:blank';
            var w = openApp( abs, { fresh: true } );
            return /noopener/.test( features || '' ) ? null : w.frame.contentWindow;
        };
    }

    //------------------------------------------------------------------------//
    // OPEN WINDOWS SURVIVE A RELOAD - their pages, places, sizes, order and
    // state, per device ("balata-desktop-wins"). Written a moment after each change.

    var WINS_KEY = 'balata-desktop-wins', saveTimer = 0, restoring = false;

    function saveWins()
    {
        if( restoring ) return;
        clearTimeout( saveTimer );
        saveTimer = setTimeout( function ()
        {
            var list = wins.filter( function ( w ) { return w.url; } )
                .sort( function ( a, b ) { return +a.el.style.zIndex - +b.el.style.zIndex; } )
                .map( function ( w )
                {
                    var rec = { url: w.url, l: px( w.g.l ), t: px( w.g.t ), w: px( w.g.w ), h: px( w.g.h ),
                                max: isMax( w ), min: !! w.el.hidden, pre: w.pre };
                    if( w.scale ) { rec.scale = true; rec.nat = w.nat; }
                    if( tiled && tiled.snaps.has( w ) ) rec.snap = tiled.snaps.get( w );
                    return rec;
                } );
            store( WINS_KEY, list );
            store( TILE_KEY, tiled ? { dw: tiled.dw, dh: tiled.dh } : null );
        }, 300 );
    }

    function restoreWins()
    {
        var list = store( WINS_KEY ) || [];
        var tl   = store( TILE_KEY );
        restoring = true;
        if( tl ) tiled = { snaps: new Map(), dw: tl.dw, dh: tl.dh };
        var minimised = [];
        list.forEach( function ( s )
        {
            if( ! s || ! s.url || ! appOf( s.url ) ) return;
            var w = openApp( s.url, { fresh: true, geom: s } );
            w.url = s.url;
            w.pre = s.pre || null;
            if( s.max ) { w.el.classList.add( 'max' ); place( w, w.g ); }
            if( s.min ) minimised.push( w );
            if( tiled && s.snap ) tiled.snaps.set( w, s.snap );
        } );
        minimised.forEach( function ( w ) { w.el.hidden = true; } );
        front = topmost();
        paint();
        restoring = false;
        if( tiled && ! wins.length ) tiled = null;
        // tiled on a desk of another size (the browser window changed meanwhile)
        if( tiled && ( desk.clientWidth !== tiled.dw || desk.clientHeight !== tiled.dh ) ) retile( true );
    }

    //------------------------------------------------------------------------//
    // SCALE - per window (w.scale), off by default. Off (Resize), a window is
    // what it always was: never smaller than MIN_W x MIN_H, and a smaller window
    // rearranges its page. On (Scale), there is no smallest size, and a window
    // made smaller shrinks like a picture of itself, chrome and all, from the
    // size it had at 1:1 (his call, 2026-09-28: the apps rearrange themselves
    // down to phone size, so "shrink only where scrollbars would appear" never
    // showed). That size is its NATURAL size (w.nat): the window stays laid out
    // at it and is drawn smaller by a CSS transform from its top-left corner
    // (NayiveTiling.fit). Clicks, typing and the apps' own menus keep working:
    // the browser maps them through the transform.
    //
    // w.nat is kept while the window is shrunk - moved, tiled, maximised and
    // restored - and let go when the window is pulled back out to it (1:1 again,
    // at whatever size it then gets) or Scale is switched. Maximised, it is
    // always 1:1 - the sure way back to a readable window; restored, it is
    // shrunk again as before. Laid out at a fixed size, a shrunk page never
    // re-wraps, so there is nothing to chase.
    //
    // One more reason to shrink: a page too WIDE for its window (a fixed-width
    // sheet) is measured (NayiveTiling.need) a moment after the window or the
    // page changes, and the window shrinks to show all of its width - the
    // natural width only ever grows that way. Height never counts: pages scroll.
    // "A moment" is two frames: some apps size parts of their page from
    // JavaScript on a resize, and a reading taken at once would see their old size.

    function isMax( w ) { return w.el.classList.contains( 'max' ); }
    function px( n )    { return Math.round( n * 100 ) / 100 + 'px'; }

    // Where a window shows on the desk: g = { l, t, w, h }, desk pixels. Every
    // change of a window's size comes through here; moveTo only moves it.
    function place( w, g )
    {
        g = { l: Math.round( g.l ), t: Math.round( g.t ), w: Math.max( 1, g.w ), h: Math.max( 1, g.h ) };
        var f = { s: 1, lw: g.w, lh: g.h };
        if( isMax( w ) ) { /* the CSS makes it the whole desk, 1:1; g is where it goes back to */ }
        else if( ! w.scale )
        {
            g.w = f.lw = Math.max( MIN_W, g.w );
            g.h = f.lh = Math.max( MIN_H, g.h );
        }
        else
        {
            // made smaller than it is at 1:1: that 1:1 size becomes the natural one
            if( ! w.nat && w.g && w.s === 1 && ( g.w < w.g.w || g.h < w.g.h ) )
                w.nat = { w: Math.max( MIN_W, w.g.w ), h: Math.max( MIN_H, w.g.h ) };
            if( ! w.nat && ( g.w < MIN_W || g.h < MIN_H ) ) w.nat = { w: MIN_W, h: MIN_H };
            if( w.nat )
            {
                var r = deskRect();
                f = NayiveTiling.fit( g.w, g.h, w.nat, { w: 2 * r.w, h: 2 * r.h } );
                if( f.s >= 1 ) w.nat = null;             // pulled back out to full size: 1:1 from here
                g.w = f.w; g.h = f.h;
            }
            queueMeasure( w );
        }
        w.g = g;
        w.s = f.s;
        var st = w.el.style;
        st.left  = px( g.l );  st.top    = px( g.t );
        st.width = px( f.lw ); st.height = px( f.lh );
        st.transform = f.s < 1 ? 'scale(' + f.s + ')' : '';
        if( f.s < 1 ) st.setProperty( '--win-s', f.s ); else st.removeProperty( '--win-s' );
    }

    function moveTo( w, l, t )
    {
        w.g.l = Math.round( l ); w.g.t = Math.round( t );
        w.el.style.left = px( w.g.l ); w.el.style.top = px( w.g.t );
    }

    // Maximise / restore: maximised is always 1:1; restored, a shrunk window is shrunk again as before.
    function setMax( w, on )
    {
        w.el.classList.toggle( 'max', on );
        place( w, w.g );
        saveWins();
    }

    // Scale on / off. Switched on, the window's size now is its natural one:
    // made smaller from here, it shrinks (and a page too wide for it shrinks at
    // once). Switched off, the page is 1:1 again and the window at least
    // MIN_W x MIN_H.
    function setScale( w, on )
    {
        w.scale = !! on;
        w.nat = null;
        place( w, w.g );
        paint();
        saveWins();
    }

    function queueMeasure( w )
    {
        if( w.measuring ) return;
        w.measuring = true;
        requestAnimationFrame( function () { requestAnimationFrame( function () { w.measuring = false; measure( w ); } ); } );
    }

    function measure( w )
    {
        if( ! w.scale || isMax( w ) || w.el.hidden || wins.indexOf( w ) < 0 ) return;
        var de;
        try { de = w.frame.contentDocument && w.frame.contentDocument.documentElement; } catch( e ) { return; }
        if( ! de ) return;
        var r = deskRect();
        var n = NayiveTiling.need( { outW:  w.el.offsetWidth, outH:  w.el.offsetHeight,     // laid-out size, not drawn
                                     viewW: de.clientWidth,   viewH: de.clientHeight,
                                     fullW: de.scrollWidth,   fullH: de.scrollHeight,
                                     deskW: r.w,              deskH: r.h } );
        // Only a page too wide for the window counts, and only to widen the natural size.
        var nat = w.nat || { w: MIN_W, h: Math.max( MIN_H, w.g.h ) };
        if( ! ( n.w > nat.w ) ) return;
        w.nat = { w: n.w, h: nat.h };
        place( w, w.g );
        saveWins();
    }

    //------------------------------------------------------------------------//
    // TILE / UNTILE - one switch for the whole desk. Tile deals the desk out
    // among the windows on it (minimised ones stay minimised), in the order of
    // their bar buttons (NayiveTiling.tile). Each window just gets a box: one
    // with Scale on shrinks to fit it, one without shows scrollbars, as always.
    // Untile puts every window back EXACTLY as it was before: place, size,
    // maximised, minimised, Scale and its factor. Whatever was done to them
    // while tiled is dropped. The stacking order is not put back: the window
    // in front stays in front.
    //
    // The "before" (tiled.snaps) is kept here, by the desktop, not by the
    // window, and it survives a reload (in each window's saved record). It is
    // taken for every window when Tile is switched on, and for a window opened
    // while tiled the first time the layout places it - so Untile sends that
    // one to where a new window opens.
    //
    // While tiled, opening, closing, minimising or bringing back a window deals
    // the desk out again (RETILE; false = a new window floats until the next
    // Tile), and so does a new desk size (the browser window, the bar).

    var RETILE   = true;
    var TILE_GAP = 0;               // pixels between two tiled windows
    var TILE_KEY = 'balata-desktop-tile';
    var tiled    = null;            // while tiled: { snaps: Map( window -> its state before ), dw, dh: the desk tiled }
    var retiling = false;

    function stateOf( w )
    {
        return { g: { l: w.g.l, t: w.g.t, w: w.g.w, h: w.g.h }, max: isMax( w ), min: !! w.el.hidden,
                 pre: w.pre ? { w: w.pre.w, h: w.pre.h } : null,
                 scale: !! w.scale, nat: w.nat ? { w: w.nat.w, h: w.nat.h } : null, s: w.s };
    }

    function tile()
    {
        var list = wins.filter( function ( w ) { return ! w.el.hidden; } );
        if( ! tiled && ! list.length ) return false;      // nothing on the desk to deal out
        if( ! tiled )
        {
            tiled = { snaps: new Map() };
            wins.forEach( function ( w ) { tiled.snaps.set( w, stateOf( w ) ); } );
        }
        var r = deskRect();
        tiled.dw = r.w; tiled.dh = r.h;
        NayiveTiling.tile( list.length, r.w, r.h, { gap: TILE_GAP, minW: MIN_W, minH: MIN_H } ).forEach( function ( g, i )
        {
            var w = list[ i ];
            if( ! tiled.snaps.has( w ) ) tiled.snaps.set( w, stateOf( w ) );
            // a maximised window shrinks (Scale) from the whole desk it showed
            if( isMax( w ) ) { w.el.classList.remove( 'max' ); w.g = { l: 0, t: 0, w: r.w, h: r.h }; w.nat = null; w.s = 1; }
            w.pre = null;
            place( w, g );
        } );
        paintTile();
        saveWins();
        return true;
    }

    function untile()
    {
        if( ! tiled ) return false;
        var snaps = tiled.snaps;
        tiled = null;
        snaps.forEach( function ( st, w )
        {
            if( wins.indexOf( w ) < 0 ) return;           // closed while tiled
            w.el.classList.toggle( 'max', !! st.max );
            w.el.hidden = !! st.min;
            w.pre   = st.pre || null;
            w.scale = !! st.scale;
            w.nat   = st.nat || null;
            w.g     = { l: st.g.l, t: st.g.t, w: st.g.w, h: st.g.h };   // exactly as before: no "made smaller" here
            place( w, st.g );
        } );
        if( ! front || front.el.hidden ) front = topmost();
        paint();
        saveWins();
        return true;
    }

    // Deal the desk out again, once, on the next frame. `always`: even with RETILE off.
    function retile( always )
    {
        if( ! tiled || restoring || retiling || ! ( RETILE || always ) ) return;
        retiling = true;
        requestAnimationFrame( function () { retiling = false; if( tiled ) tile(); } );
    }

    new ResizeObserver( function ()
    {
        if( tiled && ( desk.clientWidth !== tiled.dw || desk.clientHeight !== tiled.dh ) ) retile( true );
    } ).observe( desk );

    // THE SWITCH on the bar: "Free ()== Tile". A word picks its side, the switch
    // flips. The word Tile while tiled deals the desk out again - after windows
    // were moved or maximised by hand, say.
    var tileSw = document.getElementById( 'tileSw' ), tileChk = document.getElementById( 'tileChk' );

    function paintTile()
    {
        var idle = ! tiled && ! wins.some( function ( w ) { return ! w.el.hidden; } );
        tileChk.checked  = !! tiled;
        tileChk.disabled = idle;
        tileSw.classList.toggle( 'on', !! tiled );
        tileSw.classList.toggle( 'idle', idle );
    }

    tileChk.addEventListener( 'change', function () { if( tileChk.checked ) tile(); else untile(); paintTile(); } );
    tileSw.addEventListener( 'click', function ( e )
    {
        var word = e.target.closest( '.tile-word' );
        if( ! word || tileChk.disabled ) return;
        if( word.getAttribute( 'data-tile' ) === 'on' ) tile(); else untile();
        paintTile();
    } );
    paintTile();

    //------------------------------------------------------------------------//
    // MORE - the "⋮" after the clock (2026-09-28): the shared .top-menu
    // (NayiveUI.wireMenu), set just off the bar's edge: above it, or below it
    // when the bar is at the top.
    // Holds the Free/Tile switch, Lock now and the "?" help; more to come.

    var moreBtn = document.getElementById( 'moreBtn' ), moreMenu = document.getElementById( 'moreMenu' );
    var more = null;

    document.addEventListener( 'DOMContentLoaded', function ()     // ui.js is deferred
    {
        if( ! window.NayiveUI ) return;
        more = NayiveUI.wireMenu( { btn: moreBtn, menu: moreMenu, onPick: function ( b )
        {
            if( b.id === 'lockNowBtn' && window.NayiveLock ) NayiveLock.lock();
        } } );
        moreBtn.addEventListener( 'click', function ()             // after wireMenu's own: it placed it under the button
        {
            if( moreMenu.hidden ) return;
            var r = document.getElementById( 'bar' ).getBoundingClientRect();
            moreMenu.style.top = ( document.body.classList.contains( 'bar-top' )
                                   ? r.bottom + 6 : Math.max( 6, r.top - 6 - moreMenu.offsetHeight ) ) + 'px';
        } );
    } );

    // A press inside a window's frame never reaches this document.
    function closeMore() { if( more ) more.close(); }

    // A window by its place on the bar (0, 1...), its app's folder ("drive"), or itself.
    function winOf( which )
    {
        if( typeof which === 'number' ) return wins[ which ] || null;
        if( typeof which === 'string' ) return wins.filter( function ( w ) { return w.app === which; } )[ 0 ] || null;
        return wins.indexOf( which ) >= 0 ? which : null;
    }

    //------------------------------------------------------------------------//
    // THE MENU - the real launcher, framed. A tile opens its app as a window
    // instead of replacing the page; anything else inside it (gear, account,
    // theme) keeps working as it does in the launcher.
    //
    // It is loaded at once, hidden, not on the first click: a big screen never
    // shows the launcher page itself (it comes straight here), so the launcher's
    // start-up runs in this frame - signed out -> the sign-in page, the
    // account's language, a missing time zone, a new user's first password, the
    // notifications offer, the Android app's enrolment.

    var menuFrame = null, menuAuto = false;

    function ensureMenuFrame()
    {
        if( menuFrame ) return;
        menuFrame = document.createElement( 'iframe' );
        menuFrame.src = '../index.html';
        menuFrame.addEventListener( 'load', onMenuLoad );
        menu.appendChild( menuFrame );
    }

    function openMenu()
    {
        ensureMenuFrame();
        menu.hidden = false;
        menuBtn.classList.add( 'open' );
    }

    function closeMenu()
    {
        if( menu.hidden || menu.classList.contains( 'full' ) ) return;     // a launcher dialog is up
        menu.hidden = true;
        menuBtn.classList.remove( 'open' );
        // ...and Office's or Records' popup with it, or it is still open next time.
        try { var l = menuFrame.contentWindow.NayiveLauncher; if( l ) l.closePopups(); } catch( e ) {}
    }

    function onMenuLoad()
    {
        var cw = menuFrame.contentWindow, doc;
        try { doc = cw.document; } catch( e ) { return; }
        // Signed out, or anything that left the launcher: hand it to the whole page.
        if( ! /\/nayive\/(index\.html)?$/.test( cw.location.pathname ) ) { location.href = cw.location.href; return; }

        // The launcher centres itself in a full screen; in the menu it just fills the frame.
        // `in-desktop` keeps its phone layout off: the frame is narrow, the screen is not,
        // so the menu shows the very card of a big screen's launcher.
        doc.documentElement.classList.add( 'in-desktop' );
        var st = doc.createElement( 'style' );
        st.textContent = 'html,body{overflow:hidden auto;scrollbar-width:thin}.launcher{min-height:0;padding:0}.panel{border:0;border-radius:0;box-shadow:none;background:transparent}' +
                         '.desk-set-btn{position:absolute;left:30px;bottom:26px;transition:opacity .2s ease,visibility .2s}.desk-set-btn svg{width:20px;height:20px}' +
                         '.panel:has(.tools.open) .desk-set-btn{opacity:0;visibility:hidden}' +
                         // full screen for a dialog: the desk shows behind it, not the launcher's tiles
                         'html.desk-full,html.desk-full body{background:transparent}html.desk-full .launcher{visibility:hidden}';
        doc.head.appendChild( st );
        // The menu is exactly the launcher's panel, once that has laid out (not while hidden).
        var panel = doc.querySelector( '.panel' );
        if( panel ) new cw.ResizeObserver( function ()
        {
            var r = panel.getBoundingClientRect();
            if( ! r.width ) return;
            menu.style.width  = Math.ceil( r.width  + 2 ) + 'px';   // + the menu's 1px border, each side
            menu.style.height = Math.ceil( r.bottom + 2 ) + 'px';
        } ).observe( panel );

        // Desktop only: the desktop's settings, in the panel's bottom-left corner (the
        // launcher's "find my phone" has the bottom-right one). It steps aside while
        // the gear's row is open, as that one does.
        if( panel )
        {
            var setBtn = doc.createElement( 'button' );
            setBtn.type = 'button';
