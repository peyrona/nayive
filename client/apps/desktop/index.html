            setBtn.className = 'theme-btn desk-set-btn';
            setBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                               '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';
            setBtn.addEventListener( 'click', function () { openSettings( 'desk' ); } );
            panel.appendChild( setBtn );
            ( window.NayiveI18n && NayiveI18n.ready ? NayiveI18n.ready : Promise.resolve() ).then( function ()
            {
                setBtn.title = t( 'desktop.settings' );
                setBtn.setAttribute( 'aria-label', setBtn.title );
            } );
        }

        doc.addEventListener( 'click', function ( e )
        {
            var a = e.target.closest && e.target.closest( 'a.tile[href]' );   // the grid's, or a popup's
            if( ! a ) return;
            e.preventDefault();
            e.stopPropagation();
            closeMenu();
            appsReady.then( function () { openApp( new URL( a.getAttribute( 'href' ), cw.location.href ).href ); } );
        }, true );
        doc.addEventListener( 'keydown', function ( e ) { if( e.key === 'Escape' ) closeMenu(); } );
        hookAlt( cw );

        // A dialog of the launcher's opens: the menu takes the whole screen - and
        // shows itself if it was hidden (the start-up ones open on their own). When
        // the last one closes, it goes back to what it was. The launcher's own
        // help card is not one of these: it stays in the menu, as it always was.
        function menuSheets()
        {
            // shared dialogs (ui.js) open with a class; the launcher's own drop `hidden`
            var up = [].some.call( doc.querySelectorAll( '.sheet-backdrop' ), function ( b )
            {
                if( b.querySelector( '.intro-sheet' ) ) return false;
                return b.classList.contains( 'open' ) || ( ! b.hidden && cw.getComputedStyle( b ).display !== 'none' );
            } );
            if( up && ! menu.classList.contains( 'full' ) )
            {
                menuAuto = menu.hidden;
                menu.hidden = false;
                menu.classList.add( 'full' );
                doc.documentElement.classList.add( 'desk-full' );
                menuBtn.classList.add( 'open' );
            }
            else if( ! up && menu.classList.contains( 'full' ) )
            {
                menu.classList.remove( 'full' );
                doc.documentElement.classList.remove( 'desk-full' );
                if( menuAuto ) closeMenu();
                menuAuto = false;
            }
        }
        new cw.MutationObserver( menuSheets ).observe( doc.body, { attributes: true, attributeFilter: [ 'class', 'hidden' ], subtree: true, childList: true } );
        menuSheets();
    }

    ensureMenuFrame();
    menuBtn.addEventListener( 'click', function () { if( menu.hidden ) openMenu(); else closeMenu(); } );
    document.addEventListener( 'keydown', function ( e ) { if( e.key === 'Escape' ) closeMenu(); } );
    // An app's icon / name in a window asks for "home": that is this menu (shared/ui.js).
    window.NayiveDesktop = { menu: function () { if( menu.hidden ) openMenu(); else closeMenu(); } };

    // A press on the desk or the bar closes an open menu. A right-click on an empty
    // spot of the desk (not the bar) opens the desktop's settings - unless that very
    // press was the one closing the menu.
    var menuWasOpen = false;
    [ desk, bar ].forEach( function ( el )
    {
        el.addEventListener( 'pointerdown', function ( e )
        {
            if( e.target.closest( '#menuBtn' ) ) return;
            menuWasOpen = ! menu.hidden;
            closeMenu();
        } );
    } );
    desk.addEventListener( 'contextmenu', function ( e )
    {
        if( e.target !== desk ) return;
        e.preventDefault();
        if( ! menuWasOpen ) openSettings( 'desk' );
    } );

    //------------------------------------------------------------------------//
    // SWITCHER - Alt pressed and let go on its own (no other key, no press in
    // between) shows every window, the last used first, as Alt-Tab does on a
    // PC: Left / Right choose, Enter or a click switches, Escape (or Alt again,
    // or a press elsewhere) closes. Keys typed in a window never reach this
    // page, so each window's frame and the menu's are hooked too (hookAlt).
    // Only "Alt": AltGr (the right Alt of a Spanish keyboard: @ # [ ]) is typing.

    var switcher = document.getElementById( 'switcher' );
    var altAlone = false, swSel = 0, swBack = null;

    function hookAlt( cw )
    {
        cw.addEventListener( 'keydown', function ( e )
        {
            if( e.key !== 'Alt' ) altAlone = false;
            else if( ! e.repeat ) altAlone = true;
        }, true );
        cw.addEventListener( 'keyup', function ( e )
        {
            if( e.key !== 'Alt' || ! altAlone ) return;
            altAlone = false;
            e.preventDefault();          // Firefox shows its menu bar on a lone Alt
            if( switcher.hidden ) openSwitcher(); else closeSwitcher( true );
        }, true );
        cw.addEventListener( 'pointerdown', function ( e )
        {
            altAlone = false;
            if( ! switcher.hidden && ! ( cw === window && switcher.contains( e.target ) ) ) closeSwitcher( false );
        }, true );
        cw.addEventListener( 'blur', function () { altAlone = false; } );   // the system's own Alt-Tab
    }

    // Shown windows by how recently they were in front (z-order), then the minimised ones.
    function swList()
    {
        return wins.slice().sort( function ( a, b )
        {
            return ( a.el.hidden - b.el.hidden ) || ( +b.el.style.zIndex - +a.el.style.zIndex );
        } );
    }

    function openSwitcher()
    {
        if( ! wins.length || menu.classList.contains( 'full' ) || document.querySelector( '.sheet-backdrop.open' ) ) return;
        closeMenu();
        var list = swList();
        switcher.innerHTML = '';
        list.forEach( function ( w )
        {
            var b = document.createElement( 'button' );
            b.type = 'button';
            b.className = 'text-btn ghost sw-item' + ( w.el.hidden ? ' min' : '' );
            b.setAttribute( 'role', 'option' );
            b.innerHTML = w.svg + '<span></span>';
            b.querySelector( 'span' ).textContent = w.btn.querySelector( 'span' ).textContent;
            b.title = w.btn.title;
            b.swWin = w;
            switcher.appendChild( b );
        } );
        swBack = document.activeElement;     // a window's frame, most of the time
        switcher.hidden = false;
        // The window in front is first: Enter alone goes back to the one before it.
        swSelect( list.length > 1 && list[ 0 ] === front ? 1 : 0 );
    }

    function swSelect( i )
    {
        var items = switcher.children, n = items.length;
        swSel = ( i + n ) % n;
        [].forEach.call( items, function ( b, k )
        {
            b.classList.toggle( 'sel', k === swSel );
            b.setAttribute( 'aria-selected', k === swSel ? 'true' : 'false' );
        } );
        items[ swSel ].focus();       // the keys come here now, not to the window
    }

    // restore: give the keyboard back to where it was (Escape, Alt), not after a press elsewhere.
    function closeSwitcher( restore )
    {
        if( switcher.hidden ) return;
        switcher.hidden = true;
        switcher.innerHTML = '';
        if( restore && swBack && swBack !== document.body )
        {
            var w = wins.filter( function ( x ) { return x.frame === swBack; } )[ 0 ];
            if( w ) giveKeys( w );
            else try { swBack.focus(); } catch( e ) {}
        }
        swBack = null;
    }

    // The keyboard goes into the window, back to the field it was in: typing goes on there.
    function giveKeys( w )
    {
        try
        {
            w.frame.focus();
            w.frame.contentWindow.focus();
            var el = w.lastFocus;
            if( el && el.isConnected && el.ownerDocument === w.frame.contentDocument && el !== el.ownerDocument.body )
                el.focus( { preventScroll: true } );
        }
        catch( e ) {}
    }

    function swPick( w )
    {
        closeSwitcher( false );
        if( wins.indexOf( w ) < 0 ) return;
        focus( w );
        giveKeys( w );
    }

    switcher.addEventListener( 'keydown', function ( e )
    {
        var k = e.key;
        if( k === 'ArrowLeft' || k === 'ArrowRight' ) swSelect( swSel + ( k === 'ArrowLeft' ? -1 : 1 ) );
        else if( k === 'Tab' )                        swSelect( swSel + ( e.shiftKey ? -1 : 1 ) );
        else if( k === 'Enter' || k === ' ' )         swPick( switcher.children[ swSel ].swWin );
        else if( k === 'Escape' )                     closeSwitcher( true );
        else return;
        e.preventDefault();
        e.stopPropagation();
    } );
    switcher.addEventListener( 'click', function ( e )
    {
        var b = e.target.closest( '.sw-item' );
        if( b ) swPick( b.swWin );
    } );

    hookAlt( window );

    //------------------------------------------------------------------------//
    // THE SETTINGS DIALOG

    var back  = document.getElementById( 'setBackdrop' );
    var F = {
        start: document.getElementById( 'setStart' ), bar:  document.getElementById( 'setBar' ),
        barH:  document.getElementById( 'setBarH' ),  font: document.getElementById( 'setFont' ),
        dow:   document.getElementById( 'setDow' ),   date: document.getElementById( 'setDate' ),
        secs:  document.getElementById( 'setSecs' )
    };
    var barHOut = document.getElementById( 'setBarHOut' );

    function showTab( name )
    {
        [].forEach.call( back.querySelectorAll( '[data-tab]' ), function ( b )
        {
            var on = b.getAttribute( 'data-tab' ) === name;
            b.classList.toggle( 'is-active', on );
            b.setAttribute( 'aria-selected', on ? 'true' : 'false' );
        } );
        [].forEach.call( back.querySelectorAll( '[data-pane]' ), function ( p )
        {
            p.hidden = p.getAttribute( 'data-pane' ) !== name;
        } );
    }

    function openSettings( tab )
    {
        closeMenu();
        F.start.value = set.start; F.bar.value = set.bar; F.barH.value = set.barH; F.font.value = set.font;
        F.dow.value = set.dow; F.date.checked = !! set.date; F.secs.checked = !! set.secs;
        barHOut.textContent = set.barH + ' px';
        showTab( tab );
        if( window.NayiveUI ) NayiveUI.open( 'setBackdrop' );
        else back.classList.add( 'open' );
    }

    back.querySelector( '.set-tabs' ).addEventListener( 'click', function ( e )
    {
        var b = e.target.closest( '[data-tab]' );
        if( b ) showTab( b.getAttribute( 'data-tab' ) );
    } );

    Object.keys( F ).forEach( function ( k )
    {
        F[ k ].addEventListener( k === 'barH' ? 'input' : 'change', function ()
        {
            set.start = F.start.value; set.bar = F.bar.value; set.barH = +F.barH.value; set.font = F.font.value;
            set.dow = F.dow.value; set.date = F.date.checked; set.secs = F.secs.checked;
            barHOut.textContent = set.barH + ' px';
            saveSet();
            applyLayout();
            tick();
        } );
    } );

    //------------------------------------------------------------------------//
    // THE CLOCK - "<weekday> <yyyy-mm-dd> <hh:mm[:ss]>", weekday and date as the
    // settings say, the weekday in the interface language. A press opens the
    // countdown (below).

    var clock = document.getElementById( 'clock' ), clockTimer = 0;
    function pad( n ) { return ( n < 10 ? '0' : '' ) + n; }
    function isoDate( d ) { return d.getFullYear() + '-' + pad( d.getMonth() + 1 ) + '-' + pad( d.getDate() ); }
    function dayName( d, style )
    {
        var iso = d.getDay() || 7;
        return window.NayiveI18n ? NayiveI18n.weekday( iso, style ) : d.toLocaleDateString( undefined, { weekday: style } );
    }
    function tick()
    {
        clearTimeout( clockTimer );
        var now = new Date();
        var head = [];
        if( set.dow !== 'none' ) head.push( dayName( now, set.dow ) );
        if( set.date )           head.push( isoDate( now ) );
        clock.querySelector( 'span' ).textContent = head.join( ' ' );
        clock.querySelector( 'span' ).hidden = ! head.length;
        clock.querySelector( 'b' ).textContent =
            pad( now.getHours() ) + ':' + pad( now.getMinutes() ) + ( set.secs ? ':' + pad( now.getSeconds() ) : '' );
        clock.title = dayName( now, 'long' ) + ' ' + isoDate( now );
        clockTimer = setTimeout( tick, set.secs ? 1000 - now.getMilliseconds() + 20
                                                : 60000 - now.getSeconds() * 1000 - now.getMilliseconds() + 50 );
    }
    tick();
    // the weekday is written in the interface language: once more when that is in
    if( window.NayiveI18n && NayiveI18n.ready ) NayiveI18n.ready.then( tick );

    //------------------------------------------------------------------------//
    // THE COUNTDOWN - one at a time, on this device (localStorage), so it goes
    // on after a reload. Running = `end` (a wall-clock time, never a counter a
    // sleeping tab would slow down); paused = `left` (ms still to go); idle =
    // neither. `last` is the length last started, to offer it again. While one
    // runs or is paused, its chip sits on the bar just before the clock - the
    // time left (not the text) and small Pause / Play and Stop buttons.
    // Time's up (`done`): a few beeps, a system notice when the desktop is not on
    // screen, and NO dialog - the button stays on the bar with the text (or 0:00
    // when there is none) and a small x at its end that takes it away.

    var CD_KEY = 'balata-countdown';
    var cd = Object.assign( { end: 0, left: 0, done: false, text: '', last: 300 }, store( CD_KEY ) || {} );
    var cdChip = document.getElementById( 'cdChip' ), cdBack = document.getElementById( 'cdBackdrop' );
    var cdH = document.getElementById( 'cdH' ), cdM = document.getElementById( 'cdM' ), cdS = document.getElementById( 'cdS' );
    var cdText = document.getElementById( 'cdText' ), cdPlay = document.getElementById( 'cdPlay' );
    var cdPP = cdChip.querySelector( '.cd-pp' ), cdStop = cdChip.querySelector( '.cd-stop' ), cdX = cdChip.querySelector( '.cd-x' );
    var cdTimer = 0, audio = null;

    function cdSave() { store( CD_KEY, cd ); }
    function cdMs()   { return cd.end ? Math.max( 0, cd.end - Date.now() ) : cd.left; }
    function cdFmt( ms )
    {
        var s = Math.ceil( ms / 1000 ), h = Math.floor( s / 3600 ), m = Math.floor( s / 60 ) % 60;
        s %= 60;
        return ( h ? h + ':' + pad( m ) : m ) + ':' + pad( s );
    }

    function cdPaint()
    {
        var on = !! ( cd.end || cd.left ), left = cdFmt( cdMs() ), done = ! on && !! cd.done;
        cdChip.hidden = ! on && ! done;
        cdChip.classList.toggle( 'paused', on && ! cd.end );
        cdChip.classList.toggle( 'done', done );
        cdChip.querySelector( 'b' ).textContent = on ? left : done && ! cd.text ? cdFmt( 0 ) : '';
        cdChip.querySelector( '.cd-text' ).textContent = done ? cd.text : '';   // the text only once time is up
        cdChip.title = t( done ? 'desktop.cdDone' : 'desktop.countdown' );
        cdPP.hidden = cdStop.hidden = ! on;
        cdX.hidden = ! done;
        var pp = cd.end ? 'pause' : 'play';
        if( cdPP.getAttribute( 'data-icon' ) !== pp && window.NayiveUI )
        {
            cdPP.innerHTML = NayiveUI.icon( pp );
            cdPP.setAttribute( 'data-icon', pp );
        }
        if( ! cdStop.firstChild && window.NayiveUI ) cdStop.innerHTML = NayiveUI.icon( 'stop' );
        tip( cdPP, cd.end ? 'desktop.cdPause' : 'desktop.cdContinue' );
        tip( cdStop, 'desktop.cdStop' );
        tip( cdX, 'ui.close' );
    }

    function tip( el, key ) { el.title = t( key ); el.setAttribute( 'aria-label', el.title ); }

    function cdTick()
    {
        clearTimeout( cdTimer );
        if( cd.end && cd.end <= Date.now() ) { cdDone(); return; }
        cdPaint();
        if( cd.end ) cdTimer = setTimeout( cdTick, ( cd.end - Date.now() ) % 1000 + 20 );
    }

    // The AudioContext is made on a press (Start), or a browser keeps it silent.
    function wakeAudio()
    {
        var AC = window.AudioContext || window.webkitAudioContext;
        try { if( ! audio && AC ) audio = new AC(); if( audio && audio.state !== 'running' ) audio.resume(); } catch( e ) {}
    }
    // Only a context a press already woke: one made now (no press) would hold
    // the beeps and play them at the next Start.
    function beep()
    {
        if( ! audio || audio.state !== 'running' ) return;
        try
        {
            for( var i = 0; i < 6; i++ )           // 3 pairs of short beeps
            {
                var at = audio.currentTime + 0.05 + Math.floor( i / 2 ) * 0.8 + ( i % 2 ) * 0.22;
                var o = audio.createOscillator(), g = audio.createGain();
                o.frequency.value = 880;
                g.gain.setValueAtTime( 0.0001, at );
                g.gain.exponentialRampToValueAtTime( 0.25, at + 0.01 );
                g.gain.exponentialRampToValueAtTime( 0.0001, at + 0.16 );
                o.connect( g ); g.connect( audio.destination );
                o.start( at ); o.stop( at + 0.18 );
            }
        } catch( e ) {}
    }

    function cdDone()
    {
        var text = cd.text;
        cd.end = cd.left = 0;
        cd.done = true;
        cdSave();
        cdPaint();
        beep();
        try
        {
            if( document.hidden && window.Notification && Notification.permission === 'granted' )
                new Notification( t( 'desktop.cdDone' ), { body: text, icon: '../icons/icon-192.png' } );
        } catch( e ) {}
    }

    function cdOpen()
    {
        closeMenu();
        var s = cd.last > 0 ? cd.last : 300;
        cdH.value = Math.floor( s / 3600 ); cdM.value = Math.floor( s / 60 ) % 60; cdS.value = s % 60;
        cdText.value = cd.text;
        if( window.NayiveUI ) NayiveUI.open( 'cdBackdrop' );
        else cdBack.classList.add( 'open' );
    }

    function num( el, max ) { var n = Math.floor( +el.value ); return n > 0 ? Math.min( n, max ) : 0; }

    function cdStart()
    {
        var secs = num( cdH, 99 ) * 3600 + num( cdM, 59 ) * 60 + num( cdS, 59 );
        if( ! secs ) { cdH.focus(); return; }
        if( window.NayiveUI ) NayiveUI.undoSettle();       // a Stop's Undo must not come back over this one
        wakeAudio();
        cd = { end: Date.now() + secs * 1000, left: 0, done: false, text: cdText.value.trim(), last: secs };
        cdSave();
        if( window.NayiveUI ) NayiveUI.close( 'cdBackdrop' );
        cdTick();
    }

    clock.addEventListener( 'click', cdOpen );
    cdPlay.addEventListener( 'click', cdStart );
    [ cdH, cdM, cdS, cdText ].forEach( function ( el )
    {
        el.addEventListener( 'keydown', function ( e ) { if( e.key === 'Enter' ) { e.preventDefault(); cdStart(); } } );
    } );
    // The chip: Pause / Play, Stop (at once, no "are you sure") and, time's up,
    // the x that takes it away; anywhere else opens the dialog.
    cdChip.addEventListener( 'click', function ( e )
    {
        var b = e.target.closest( '[data-cd]' ), what = b && b.getAttribute( 'data-cd' );
        if( ! what ) { cdOpen(); return; }
        if( what === 'pp' )
        {
            if( cd.end ) { cd.left = Math.max( 1000, cd.end - Date.now() ); cd.end = 0; }
            else         { wakeAudio(); cd.end = Date.now() + cd.left; cd.left = 0; }
        }
        else                                                // stop / x
        {
            var was = { end: cd.end, left: cd.left, done: cd.done };
            cd.end = cd.left = 0; cd.done = false;
            // Undo: the same end moment (never one gone by meanwhile), the same
            // time left when paused, or the time's-up chip again. Not over a new one.
            if( window.NayiveUI ) NayiveUI.undoToast( t( what === 'stop' ? 'desktop.cdStopped' : 'ui.toast.removed' ), function ()
            {
                if( cd.end || cd.left ) return;
                if( was.end ) { if( was.end <= Date.now() ) return; wakeAudio(); cd.end = was.end; cd.done = false; }
                else if( was.left ) { cd.left = was.left; cd.done = false; }
                else cd.done = was.done;
                cdSave();
                cdTick();
            } );
        }
        cdSave();
        cdTick();
    } );
    // Another tab of the desktop started / paused / stopped it: follow.
    window.addEventListener( 'storage', function ( e )
    {
        if( e.key !== CD_KEY ) return;
        cd = Object.assign( { end: 0, left: 0, done: false, text: '', last: 300 }, store( CD_KEY ) || {} );
        cdTick();
    } );
    // First look once shared/ui.js (deferred) is in: a countdown that ended while
    // the desktop was closed still says so, on its chip.
    if( document.readyState === 'loading' ) document.addEventListener( 'DOMContentLoaded', cdTick );
    else cdTick();
    if( window.NayiveI18n && NayiveI18n.ready ) NayiveI18n.ready.then( cdPaint );

    //------------------------------------------------------------------------//
    // CHAT - shared/ui.js asks the server for the unread count (every minute,
    // on a push, on coming back) and tells us (nayive:chatunread). The red dot
    // sits on Chat's bar button with the count, or plain on the menu button
    // while Chat is not open; it blinks when the count goes up.

    var unreadDot = document.createElement( 'span' ), unread = -1;
    unreadDot.className = 'chat-dot';
    unreadDot.hidden = true;
    unreadDot.setAttribute( 'aria-hidden', 'true' );

    function placeUnread()
    {
        if( ! ( unread > 0 ) ) { unreadDot.hidden = true; return; }
        var chat = wins.filter( function ( w ) { return w.app === 'chat'; } )[ 0 ];
        showDot( unreadDot, chat ? chat.btn : menuBtn, unread );
    }
    // On an app's bar button the dot carries the count; on the menu button it is plain.
    function showDot( dot, host, n )
    {
        if( dot.parentNode !== host ) host.appendChild( dot );
        var counted = host !== menuBtn;
        dot.classList.toggle( 'has-count', counted );
        dot.textContent = counted ? ( n > 99 ? '99+' : String( n ) ) : '';
        dot.hidden = false;
    }
    document.addEventListener( 'nayive:chatunread', function ( e )
    {
        var before = unread;
        unread = e.detail || 0;
        placeUnread();
        if( before >= 0 && unread > before )
        {
            unreadDot.classList.remove( 'blink' );
            void unreadDot.offsetWidth;
            unreadDot.classList.add( 'blink' );
        }
    } );
    // Leaving the Chat window: what was read there should take the dot away now.
    function pokeUnread()
    {
        try { navigator.serviceWorker.dispatchEvent( new MessageEvent( 'message', { data: { chat: 'new' } } ) ); } catch( e ) {}
    }

    //------------------------------------------------------------------------//
    // EMAIL - the unread count of every account's Inbox (/api/mail/unread, the
    // launcher's eMail number): a plain blue dot on the menu button's top-left,
    // or the count on eMail's bar button while eMail is open. Asked at load, every
    // minute, on a mail push (sw.js), on coming back, and on leaving the eMail
    // window. It blinks when the count goes up. The admin (403) stops asking.

    var mailDot = document.createElement( 'span' ), mailN = -1, mailStopped = false, mailAsking = false;
    mailDot.className = 'chat-dot mail-dot';
    mailDot.hidden = true;
    mailDot.setAttribute( 'aria-hidden', 'true' );

    function placeMail()
    {
        if( ! ( mailN > 0 ) ) { mailDot.hidden = true; return; }
        var em = wins.filter( function ( w ) { return w.app === 'email'; } )[ 0 ];
        showDot( mailDot, em ? em.btn : menuBtn, mailN );
    }
    function askMail()
    {
        if( mailStopped || mailAsking || document.hidden ) return;
        mailAsking = true;
        fetch( '/api/mail/unread', { credentials: 'same-origin', headers: { Accept: 'application/json' } } )
            .then( function ( r )
            {
                if( r.status === 401 || r.status === 403 ) mailStopped = true;
                return r.ok ? r.json() : null;
            } )
            .then( function ( j )
            {
                if( ! j ) return;
                var before = mailN;
                mailN = j.n || 0;
                placeMail();
                if( before >= 0 && mailN > before )
                {
                    mailDot.classList.remove( 'blink' );
                    void mailDot.offsetWidth;
                    mailDot.classList.add( 'blink' );
                }
            } )
            .catch( function () {} )
            .then( function () { mailAsking = false; } );
    }
    askMail();
    setInterval( askMail, 60000 );
    document.addEventListener( 'visibilitychange', askMail );
    if( navigator.serviceWorker ) navigator.serviceWorker.addEventListener( 'message', function ( e )
    {
        if( e.data && e.data.mail === 'new' ) askMail();
    } );

    // A tapped notification: the worker (sw.js) hands its page to the desktop.
    function openTarget( url ) { appsReady.then( function () { openApp( url, { nav: true } ); } ); }
    if( navigator.serviceWorker ) navigator.serviceWorker.addEventListener( 'message', function ( e )
    {
        if( e.data && e.data.desktopOpen ) openTarget( e.data.desktopOpen );
    } );

    // "Space almost full" card (shared/ui.js): its "find big files" opens Drive here.
    document.addEventListener( 'nayive:bigfiles', function ( e )
    {
        e.preventDefault();
        openTarget( '/nayive/drive/index.html?big=1' );
    } );

    //------------------------------------------------------------------------//
    // SYNC - ONE connection status for the whole desktop, after the clock. Each
    // app keeps updating its own .sync-indicator (hidden in a window, app.css);
    // this copies the WORST of them, as Planner does for its panes. Worst first:
    // no class (red, not synced yet) > .offline (gold, changes queued) > .busy
    // (blue) > .synced (green). Looked at once a second rather than watched: an
    // app may redraw its dot (Trips redraws its whole header), and a window may
    // come and go. A window whose app has no dot (Games) does not count; with
    // none left the status hides.

    var syncDot = document.getElementById( 'syncIndicator' );

    function winDot( w )
    {
        try { return w.frame.contentDocument && w.frame.contentDocument.querySelector( '.sync-indicator' ); }
        catch( e ) { return null; }
    }
    function syncRank( el )
    {
        if( ! el ) return -1;
        var c = el.classList;
        return c.contains( 'offline' ) ? 2 : c.contains( 'busy' ) ? 1 : c.contains( 'synced' ) ? 0 : 3;
    }
    function mirrorSync()
    {
        var worst = null, worstRank = -1;
        wins.forEach( function ( w )
        {
            var el = winDot( w ), r = syncRank( el );
            if( r > worstRank ) { worstRank = r; worst = el; }
        } );
        syncDot.hidden = ! worst;
        if( ! worst ) return;
        [ 'synced', 'busy', 'offline' ].forEach( function ( cls ) { syncDot.classList.toggle( cls, worst.classList.contains( cls ) ); } );
        syncDot.title = worst.title || '';
    }
    setInterval( mirrorSync, 1000 );

    // A click refreshes every window: the app's own refresh (ui.js wireRefresh),
    // or - Planner, which has none of its own - a click on its dot, which
    // refreshes its panes.
    syncDot.addEventListener( 'click', function ()
    {
        wins.forEach( function ( w )
        {
            try
            {
                var cw = w.frame.contentWindow;
                if( cw && cw.nayiveRefresh ) cw.nayiveRefresh();
                else { var el = winDot( w ); if( el ) el.click(); }
            }
            catch( e ) { /* a window mid-navigation must not stop the others */ }
        } );
        setTimeout( mirrorSync, 300 );
    } );

    //------------------------------------------------------------------------//
    // HELP - the "?" after the clock opens the shared help card: one row per
    // thing on the bar, then what has no button (moving windows, Alt, settings).

    var CLOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

    // After DOMContentLoaded: ui.js is deferred, this script is not.
    document.addEventListener( 'DOMContentLoaded', function () { ( window.NayiveI18n && NayiveI18n.ready ? NayiveI18n.ready : Promise.resolve() ).then( function ()
    {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'desktop',
            title: 'Nayive',
            lead:  t( 'desktop.helpLead' ),
            buttons: [
                { sel: '#menuBtn',       icon: 'grid', text: t( 'desktop.helpMenu' ) },
                { svg: ICON_WIN,  name: t( 'desktop.helpWinName' ),    text: t( 'desktop.helpWin' ) },
                { svg: ICON_SCALE, name: t( 'desktop.helpScaleName' ), text: t( 'desktop.helpScale' ) },
                { icon: 'fullscr', name: t( 'desktop.helpMoveName' ),   text: t( 'desktop.helpMove' ) },
                { svg: ICON_TILE, name: t( 'desktop.tileOn' ),          text: t( 'desktop.helpTile' ) },
                { icon: 'forward', name: t( 'desktop.helpSwitchName' ), text: t( 'desktop.helpSwitch' ) },
                { sel: '#clock',         svg: CLOCK_SVG, name: t( 'desktop.tabClock' ), text: t( 'desktop.helpClock' ) },
                { sel: '#moreBtn',       icon: 'menudots', text: t( 'desktop.helpMore' ) },
                { sel: '#syncIndicator:not([hidden])', text: t( 'desktop.helpSync' ) },
                { icon: 'gear',    name: t( 'desktop.settings' ),       text: t( 'desktop.helpSettings' ) }
            ]
        } );
    } ); } );

    // SCALE and TILE for the buttons to come (the desktop has none for them yet).
    Object.assign( window.NayiveDesktop, {
        windows: function ()
        {
            return wins.map( function ( w )
            {
                return { app: w.app, name: w.btn.querySelector( 'span' ).textContent, scale: !! w.scale, factor: w.s,
                         max: isMax( w ), min: !! w.el.hidden, box: { l: w.g.l, t: w.g.t, w: w.g.w, h: w.g.h },
                         nat: w.nat, tiled: !! tiled && tiled.snaps.has( w ) };
            } );
        },
        open:       function ( url ) { return !! openApp( url, { fresh: true } ); },
        scale:      function ( which, on ) { var w = winOf( which ); if( w ) setScale( w, on === undefined ? ! w.scale : on ); return !! w; },
        tile:       tile,
        untile:     untile,
        toggleTile: function () { return tiled ? untile() : tile(); },
        isTiled:    function () { return !! tiled; }
    } );

    appsReady.then( restoreWins );
} )();
</script>
</body>
</html>
