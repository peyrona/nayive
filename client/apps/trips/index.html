<!-- index.html - Personal single-user travel planner (trips, stages, documents), backed by Gum's file-manager API -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Nayive's first script (old settings, whose page, error reports), then
         Ayni's language layer: it hides the page until the texts are in, and
         every inline script below may call Ayni.t(). -->
    <script src="../shared/i18n.js"></script>
    <script src="../shared/ayni/ayni-i18n.js" data-dict="../shared/i18n/" data-langs="es en pt fr de"></script>
    <title>Trips</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='5.5' cy='9' rx='2' ry='2.5'%3E%3C/ellipse%3E%3Cellipse cx='12' cy='6' rx='2.1' ry='2.6'%3E%3C/ellipse%3E%3Cellipse cx='18.5' cy='9' rx='2' ry='2.5'%3E%3C/ellipse%3E%3Cpath d='M12 12c-4.5 0-7.8 2-7.8 4.4 0 2 2.55 3.3 5.4 2.9 1.35-.2 1.5-.7 2.4-.7s1.05.5 2.4.7c2.85.4 5.4-.9 5.4-2.9C19.8 14 16.5 12 12 12z'%3E%3C/path%3E%3C/svg%3E">

    <!-- Shared colour scheme (dark default, opt-in light). Toggle lives in Drive / the launcher; this page just follows the saved choice. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/ayni/ayni-base.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-buttons.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-toasts.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-dialogs.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-menus.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-search.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-lists.css">
    <link rel="stylesheet" href="../shared/ayni/ayni-help.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ document.documentElement.dataset.theme = localStorage.getItem( 'ayni-theme' ) || ( matchMedia( '(prefers-color-scheme: dark)' ).matches ? 'dark' : 'light' ); }catch( e ){}</script>
    <script src="../shared/ayni/ayni-icons.js" defer></script>
    <script src="../shared/ayni/ayni-base.js" defer></script>
    <script src="../shared/ayni/ayni-buttons.js" defer></script>
    <script src="../shared/ayni/ayni-toasts.js" defer></script>
    <script src="../shared/ayni/ayni-dialogs.js" defer></script>
    <script src="../shared/ayni/ayni-menus.js" defer></script>
    <script src="../shared/ayni/ayni-search.js" defer></script>
    <script src="../shared/ayni/ayni-lists.js" defer></script>
    <script src="../shared/ayni/ayni-help.js" defer></script>
    <script src="../shared/locker.js"></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS; a no-op on the plain-HTTP LAN URL. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <!-- Leaflet - vendored so the page loads with no connection. The map itself needs
         live map tiles, so it is replaced by a placeholder when offline. -->
    <link rel="stylesheet" href="lib/leaflet_v1.9.4/leaflet.css">
    <script src="lib/leaflet_v1.9.4/leaflet.js"></script>
    <script>if( window.L ) L.Icon.Default.imagePath = 'lib/leaflet_v1.9.4/images/';</script>
    <!-- MapLibre GL + its Leaflet bridge draw the base map from vector tiles, so place
         names can follow the UI language (see shared/basemap.js). Deferred, and BEFORE the
         other deferred scripts, so all three exist by the time the app boots. -->
    <link rel="stylesheet" href="lib/maplibre-gl_v5.24.0/maplibre-gl.css">
    <script src="lib/maplibre-gl_v5.24.0/maplibre-gl.js" defer></script>
    <script src="lib/maplibre-gl-leaflet_v0.1.4/leaflet-maplibre-gl.js" defer></script>
    <script src="../shared/basemap.js" defer></script>

    <!-- Gum file-API helpers: HMAC signing, the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <script src="intro.js"></script>

    <!-- Offline-capable persistence: local last-known-good cache + write-behind sync. -->
    <script src="../shared/store.js" defer></script>

    <link rel="stylesheet" href="trips.css">
</head>

<body>
    <noscript>
        <h2 data-i18n="ui.needJs"></h2>
    </noscript>

    <div id="app" style="display: none;">
        <div class="trip-page">
            <div class="trip-layout">

                <div class="trip-main">
                    <div class="trip-panel">
                        <div id="tripHeader" class="trip-header"></div>
                        <div id="tripContent"></div>
                    </div>
                </div>

                <div id="routeResizer" class="pane-resizer route-resizer" role="separator" aria-orientation="vertical" data-i18n-attr="title:ui.dragResize"></div>

                <div class="route-panel" id="routePanel">
                    <div class="trip-panel">
                        <div id="routePanelBody"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <dialog class="panel" id="tripSheetBackdrop">
        <header><h2></h2></header>
        <div class="body" id="tripSheet"></div>
        <footer></footer>
    </dialog>

    <dialog class="panel" id="stageSheetBackdrop">
        <header><h2></h2></header>
        <div class="body" id="stageSheet"></div>
        <footer></footer>
    </dialog>

    <dialog class="panel map-dialog" id="mapSheetBackdrop">
        <div class="body" id="mapSheet"></div>
    </dialog>

    <dialog class="panel" id="setSheetBackdrop">
        <header><h2></h2></header>
        <div class="body" id="setSheet"></div>
        <footer></footer>
    </dialog>

    <dialog class="panel" id="discoverSheetBackdrop">
        <header><h2></h2></header>
        <div class="body" id="discoverSheet"></div>
        <footer></footer>
    </dialog>

    <dialog class="panel" id="filePickerSheetBackdrop">
        <header><h2></h2></header>
        <div class="body" id="filePickerSheet"></div>
        <footer></footer>
    </dialog>

    <input type="file" id="docUploadInput" style="display:none">

    <div id="printRoot"></div>

    <!-- The app, in load order. Plain scripts - no defer, no module: they share one
         global scope and run here, before the deferred ../shared/*.js, as the
         inline script they came from did. -->
    <script src="state.js"></script>
    <script src="currency.js"></script>
    <script src="location.js"></script>
    <script src="helpers.js"></script>
    <script src="init.js"></script>
    <script src="persistence.js"></script>
    <script src="actions.js"></script>
    <script src="drag.js"></script>
    <script src="pdf.js"></script>
    <script src="render.js"></script>
    <script src="sheets.js"></script>
    <script src="fields.js"></script>
    <script src="file-picker.js"></script>
    <script src="map.js"></script>
    <script src="journey-draw.js"></script>
    <script src="journey.js"></script>
    <script src="my-location.js"></script>
    <script src="route.js"></script>
    <script src="discover.js"></script>
</body>
</html>
