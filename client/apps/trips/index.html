         * means no shared trips, never a broken trip list. */
        // "shared/<slug>" -> the name of the user who shared it, filled by
        // sharedTripPaths() so the detail header can say who it came from.
        const sharedOwners = {};
        function sharedBy( trip ) { return sharedOwners[ tripBase( trip ) ] || ''; }

        async function sharedTripPaths()
        {
            try
            {
                const r = await fetch( window.location.origin + '/api/shares' );
                if( ! r.ok ) return [];
                const j = await r.json();
                return ( j.with_me || [] )
                    .filter( function( g ) { return g.app === 'trips' && ! g.gone; } )
                    .map( function( g ) { sharedOwners[ g.path ] = g.by; return g.path + '/trip.json'; } );
            }
            catch( _ ) { return []; }
        }

        // Writes ONE trip's full current state back to its own trip/{dirName}/trip.json.
        // Goes through the store: cached immediately, uploaded now or on reconnect.
        // The directory itself must already exist - see resolveNewTripDirName().
        function persistTrip( trip )
        {
            // A trip another user shared with us is never written back. Without
            // this the old hard-coded 'data/trips/' path would quietly create a
            // COPY of their trip inside our own home instead of failing.
            if( tripIsRO( trip ) ) return Promise.resolve();

            // `_pending` holds a not-yet-uploaded File on a document draft - never serialise it.
            return store.write( tripBase( trip ) + '/trip.json',
                JSON.stringify( trip, function( k, v ) { return k === '_pending' ? undefined : v; }, 2 ) );
        }

        // The in-folder file name an UPLOADED (or legacy) document occupies, or null for a link.
        function docStoredFile( doc )
        {
            if( docIsLink( doc ) ) return null;
            if( doc.file ) return doc.file;
            if( doc.kind === undefined && doc.name ) return slugify( doc.name ) + '.pdf';   // legacy scheme
            return null;
        }

        // True when saving would need to touch the trip folder (upload a picked file, or
        // delete the file of a document that was removed / turned into a link since the
        // sheet opened). Callers use it to require a connection only when it matters.
        function docFilesDirty( newDocs, oldDocs )
        {
            if( newDocs.some( function( d ) { return d._pending; } ) )
                return true;

            const kept = new Set( newDocs.map( docStoredFile ).filter( Boolean ) );
            return ( oldDocs || [] ).some( function( d )
            {
                const f = docStoredFile( d );
                return f && ! kept.has( f );
            });
        }

        // Uploads freshly-picked files and deletes the files of documents removed since the
        // sheet opened. `dirName`'s folder must already exist. Online only - guarded by callers.
        async function syncDocFiles( dirName, newDocs, oldDocs )
        {
            const kept = new Set( newDocs.map( docStoredFile ).filter( Boolean ) );

            for( const d of ( oldDocs || [] ) )
            {
                const f = docStoredFile( d );

                if( f && ! kept.has( f ) )
                {
                    try { await GumApi.deletePaths( 'data/trips/' + dirName + '/' + f ); }
                    catch( _ ) { /* never uploaded / already gone - not fatal */ }
                }
            }

            for( const d of newDocs )
            {
                if( ! d._pending ) continue;

                const bytes = new Uint8Array( await d._pending.arrayBuffer() );
                await GumApi.writeFileBytes( 'data/trips/' + dirName + '/' + d.file, bytes );
                delete d._pending;
            }
        }

        //------------------------------------------------------------------------//
        // OFFLINE DOCUMENTS - keep only the ACTIVE trip's PDFs on the device: the
        // trip happening today, or else the next one due to start. Other trips'
        // documents are still one tap away while online, just not worth the phone
        // storage. The service worker answers trips/**.pdf from this same cache.

        const TRIP_DOCS_CACHE = 'nayive-trips-docs';

        function pickActiveTrip( list )
        {
            const today = todayIso();

            const current = list.find( function( t )
            {
                return t.startDate && t.endDate && t.startDate <= today && today <= t.endDate;
            });

            if( current )
                return current;

            return list
                .filter( function( t ) { return t.startDate && t.startDate >= today; } )
                .sort( function( a, b ) { return a.startDate < b.startDate ? -1 : 1; } )[ 0 ] || null;
        }

        function tripDocUrls( trip )
        {
            const stageDocs = ( trip.stages || [] ).reduce( function( acc, st ) { return acc.concat( st.documents || [] ); }, [] );
            const allDocs   = ( trip.documents || [] ).concat( stageDocs );

            return allDocs
                .filter( function( d ) { return docHasFile( d ) && ! d._pending; } )
                .map( function( d ) { return new URL( docHref( trip, d ), document.baseURI ).toString(); } );
        }

        async function syncActiveTripDocs()
        {
            if( ! ( 'caches' in window ) || ! navigator.onLine )
                return;

            const active = pickActiveTrip( trips );
            const wanted = new Set( active ? tripDocUrls( active ) : [] );

            try
            {
                const cache = await caches.open( TRIP_DOCS_CACHE );

                for( const url of wanted )
                {
                    if( await cache.match( url ) )
                        continue;

                    try
                    {
                        const res = await fetch( url, { credentials: 'same-origin' } );
                        if( res.ok ) await cache.put( url, res.clone() );
                    }
                    catch( _ ) { /* a document that isn't on the server yet just 404s when tapped */ }
                }

                for( const req of await cache.keys() )
                {
                    if( ! wanted.has( req.url ) )
                        await cache.delete( req );
                }
            }
            catch( _ ) { /* Cache API unavailable - skip */ }
        }

        // Applies fn to the trip identified by tripId (fn returns the new trip object), updates
        // the UI immediately, and persists that one trip's file in the background - the pattern
        // for every STAGE-level change (add/edit/delete/reorder a stage, which never touches the
        // trip's own directory or name). Trip-level create/rename/delete are handled separately
        // in saveTrip()/deleteTrip() since those must manage the directory itself.
        function mutateTrip( tripId, fn )
        {
            let updated = null;

            trips = trips.map( function( t )
            {
                if( t.id !== tripId )
                    return t;

                updated = fn( t );
                return updated;
            });

            renderAll();

            // No optimistic rollback any more: persistTrip() caches the change
            // locally right away and the store re-uploads it on reconnect, so a
            // reload can't "silently undo" it even if the PUT fails now. The sync
            // dot (store-driven) shows offline / pending / error.
            if( updated )
                persistTrip( updated );
        }

        let syncState = 'synced';   // last known state - reapplied whenever renderHeader() rebuilds the indicator

        function setSyncStatus( sState )
        {
            syncState = sState;

            const el = document.getElementById( 'syncIndicator' );

            if( el )
                NayiveUI.applySyncState( el, sState );
        }

        // The header is rebuilt on every render, so the indicator is too - which is why the
        // click lands here and not in a one-off init. It is a <button>: the plug IS the
        // refresh control (it replaced the old "Recargar", which only reloaded the page).
        function buildSyncIndicator()
        {
            const sync = document.createElement( 'button' );
            sync.id = 'syncIndicator';
            sync.type = 'button';
            sync.className = 'sync-indicator';   // shared/ui.js fills in the plug glyph
            sync.addEventListener( 'click', function() { if( refresher ) refresher.refreshNow(); } );
            NayiveUI.applySyncState( sync, syncState );
            return sync;
        }

        // Picks the folder name for a BRAND NEW trip: "destination-year", or "-2", "-3"... if
        // that name is already used by another trip currently known in memory (which is always
        // kept in sync with disk - see loadTrips()/persistTrip()). Computed once at creation
        // time only; see the PERSISTENCE comment above for why it is never recomputed later.
        function resolveNewTripDirName( sDestination, sStartDate )
        {
            const base  = dirNameFor( sDestination, sStartDate );
            const taken = new Set( trips.map( function( t ) { return t.dirName; } ) );

            if( ! taken.has( base ) )
                return base;

            let n = 2;

            while( taken.has( base + '-' + n ) )
                n++;

            return base + '-' + n;
        }

        // What folder the trip currently open in the Add/Edit Trip sheet will be saved under -
        // the already-assigned, stable name when editing, or a live preview of what a brand new
        // trip would get right now (which can shift while typing, since it depends on what other
        // trips exist - that's fine, it's only ever committed for real at actual save time).
        function tripDraftDirNamePreview()
        {
            return isEditingTrip ? tripDraft.dirName : resolveNewTripDirName( tripDraft.destination, tripDraft.startDate );
        }

        //------------------------------------------------------------------------//
        // CONFIRM DIALOG - a small yes/no sheet used before every destructive delete
        // (trips and stages). Only its two buttons (or Escape) close it.

        let confirmOnYes = null;

        function openConfirm( sTitle, sMessage, sYesLabel, fnYes )
        {
            confirmOnYes = fnYes;

            const sheet = document.getElementById( 'confirmSheet' );
            sheet.innerHTML = '';

            const h2 = document.createElement( 'h2' );
            h2.textContent = sTitle;
            sheet.appendChild( h2 );

            const p = document.createElement( 'p' );
            p.className = 'confirm-msg';
            p.textContent = sMessage;
            sheet.appendChild( p );

            const actions = document.createElement( 'div' );
            actions.className = 'sheet-actions';

            const cancelBtn = document.createElement( 'button' );
            cancelBtn.className = 'btn btn-secondary';
            cancelBtn.title = NayiveUI.t( 'ui.cancel' );
            cancelBtn.appendChild( svgIcon( ICON_X, 17 ) );
            cancelBtn.addEventListener( 'click', closeConfirm );

            const yesBtn = document.createElement( 'button' );
            yesBtn.className = 'btn btn-danger';
            yesBtn.title = sYesLabel || NayiveUI.t( 'ui.delete' );
            yesBtn.appendChild( svgIcon( ICON_TRASH, 17 ) );
            yesBtn.addEventListener( 'click', function()
            {
                const fn = confirmOnYes;
                closeConfirm();
                if( fn ) fn();
            });

            actions.appendChild( cancelBtn );
            actions.appendChild( yesBtn );
            sheet.appendChild( actions );

            openSheet( 'confirmSheetBackdrop' );
        }

        function closeConfirm() { closeSheet( 'confirmSheetBackdrop' ); confirmOnYes = null; }

        //------------------------------------------------------------------------//
        // NAVIGATION

        function goToDetail( tripId ) { hoveredStageId = null; selectedTripId = tripId; view = 'detail'; renderAll(); refreshViewerPos( true ); }
        function goToList()           { hoveredStageId = null; view = 'list'; renderAll(); }

        function renderAll() { renderHeader(); renderContent(); renderRoutePanel(); }

        //------------------------------------------------------------------------//
        // SHEET HELPERS

        function openSheet( sId )  { NayiveUI.open( sId ); }     // impl in shared/ui.js
        function closeSheet( sId ) { NayiveUI.close( sId ); }

        //------------------------------------------------------------------------//
        // TRIP ACTIONS

        let tripDraft     = null;
        let isEditingTrip = false;

        function openAddTrip()
        {
            tripDraft = { id: null, destination: '', startDate: '', endDate: '', documents: [] };
            isEditingTrip = false;
            tripSaveError = '';
            tripSheetBusy = false;
            renderTripSheet();
            openSheet( 'tripSheetBackdrop' );
        }

        function openEditTrip()
        {
            const t = findTrip( selectedTripId );

            if( ! t )
                return;

            tripDraft = { ...t, documents: ( t.documents || [] ).map( function( d ) { return { ...d }; } ) };
            isEditingTrip = true;
            tripSaveError = '';
            tripSheetBusy = false;
            renderTripSheet();
            openSheet( 'tripSheetBackdrop' );
        }

        function closeTripSheet() { closeSheet( 'tripSheetBackdrop' ); tripDraft = null; tripSaveError = ''; tripSheetBusy = false; }

        function addTripDoc()      { tripDraft.documents.push( { id: newId(), name: '', type: 'passport' } ); renderTripSheet(); }

        // The "+" beside "Documentos" on the trip detail screen. The document rows live
        // in the trip sheet (that is where a name is typed and a type picked), so this
        // opens it with one blank row already waiting.
        function addTripDocFromDetail()
        {
            openEditTrip();
            if( tripDraft ) addTripDoc();
        }
        function removeTripDoc(id) { tripDraft.documents = tripDraft.documents.filter( function( d ) { return d.id !== id; } ); renderTripSheet(); }

        let tripSaveError = '';

        // Editing an already-saved trip goes through the store, so it works offline.
        // Creating one needs its directory made server-side first (Gum's file write
        // does NOT auto-create parents), so a brand-new trip needs a live connection.
        async function saveTrip()
        {
            if( ! tripDraft.destination.trim() || ! tripDraft.startDate || ! tripDraft.endDate )
                return;

            if( tripDraft.endDate < tripDraft.startDate )
            {
                tripSaveError = T( 'trips.endBeforeStart' );
                renderTripSheet();
                return;
            }

            tripSaveError = '';
            setTripSheetBusy( true );

            if( isEditingTrip )
            {
                const original = findTrip( tripDraft.id );
                const updated  = { ...tripDraft };   // dirName carried over unchanged from the original trip

                // The trip's own lat/lon only ever back the map's "no stages yet" fallback
                // pin, geocoded from this destination text (see ensureRouteCoords()) - if the
                // text just changed, drop the old coordinates rather than show a stale pin.
                if( original && original.destination !== updated.destination )
                {
                    delete updated.lat;
                    delete updated.lon;
                }

                // Attachments (upload a picked file / delete a removed one) need the network;
                // a text-only edit still saves offline through the store.
                if( docFilesDirty( updated.documents, original ? original.documents : [] ) )
                {
                    if( ! navigator.onLine )
                    {
                        tripSaveError = T( 'trips.filesNeedNet' );
                        setTripSheetBusy( false );
                        return;
                    }

                    try
                    {
                        await syncDocFiles( updated.dirName, updated.documents, original ? original.documents : [] );
                    }
                    catch( _ )
                    {
                        setSyncStatus( 'error' );
                        tripSaveError = T( 'trips.uploadFailed' );
                        setTripSheetBusy( false );
                        return;
                    }
                }

                persistTrip( updated );   // cached now, uploaded now or on reconnect
                trips = trips.map( function( t ) { return t.id === updated.id ? updated : t; } );

                const oldIds = ( original ? original.documents : [] ).map( function( d ) { return d.id; } );
                if( updated.documents.some( function( d ) { return oldIds.indexOf( d.id ) === -1; } ) )
                    expandSection( 'docs' );

                closeTripSheet();
                renderAll();
                syncActiveTripDocs();
                return;
            }

            try
            {
                const dirName = resolveNewTripDirName( tripDraft.destination, tripDraft.startDate );
                const created = { ...tripDraft, id: newId(), stages: [], dirName: dirName };

                await GumApi.makeDir( 'data/trips', dirName );
                await syncDocFiles( dirName, created.documents, [] );
                await persistTrip( created );

                trips = [ ...trips, created ];
                if( created.documents.length ) expandSection( 'docs' );
                closeTripSheet();
                renderAll();
                syncActiveTripDocs();
            }
            catch( _ )
            {
                setSyncStatus( 'error' );
                tripSaveError = navigator.onLine
                    ? T( 'trips.createFailed' )
                    : T( 'trips.createNeedsNet' );
                setTripSheetBusy( false );
            }
        }

        async function deleteTrip()
        {
            const trip = findTrip( selectedTripId );

            if( ! trip )
                return;

            setSyncStatus( 'saving' );

            try
            {
                await GumApi.deletePaths( 'data/trips/' + trip.dirName );
                await store.forget( 'data/trips/' + trip.dirName + '/trip.json' );
                trips = trips.filter( function( t ) { return t.id !== selectedTripId; } );
                setSyncStatus( 'synced' );
                syncActiveTripDocs();
            }
            catch( _ )
            {
                // Deletion failed server-side - the trip is untouched, so stay right where we
                // are instead of navigating away as if it had worked (that would read as success).
                setSyncStatus( 'error' );

                // Only touch the trip sheet's own busy/error UI when delete was actually triggered
                // from inside it (tripDraft is null when this came from the detail header's trash
                // icon instead - renderTripSheet() would crash reading a null tripDraft.destination).
                if( tripDraft )
                {
                    tripSaveError = T( 'trips.deleteFailed' );
                    setTripSheetBusy( false );
                }

                return;
            }

            view = 'list';
            closeTripSheet();
            renderAll();
        }

        //------------------------------------------------------------------------//
        // STAGE ACTIONS

        let stageDraft         = null;
        let editingStageId     = null;
        let stageSaveError     = '';
        let stageSheetBusy     = false;
        let stageDocsCollapsed = true;   // the doc list starts folded when a stage has >1 document

        function openAddStage()
        {
            stageDraft = { id: null, location: '', startDate: '', startTime: '', endDate: '', endTime: '', transport: 'other', tz: null, tzLabel: '', tzStatus: 'idle', lat: null, lon: null, accommodation: '', notes: '', enabled: true, documents: [] };
            editingStageId = null;
            stageSaveError = '';
            stageDocsCollapsed = true;
            renderStageSheet();
            openSheet( 'stageSheetBackdrop' );
        }

        function openEditStage( stageId )
        {
            const trip = findTrip( selectedTripId );
            const st   = trip.stages.find( function( s ) { return s.id === stageId; } );

            if( ! st )
                return;

            // Reuse whatever timezone this stage already has (found earlier, or from the sample
            // data) without re-querying the geocoder on every open - a fresh lookup only fires if
            // the user edits the location text again.
            stageDraft = {
                ...st,
                tzStatus: st.tz ? 'found' : 'idle',
                tzLabel: st.tzLabel || st.tz || '',
                documents: ( st.documents || [] ).map( function( d ) { return { ...d }; } )
            };
            editingStageId = stageId;
            stageSaveError = '';
            stageDocsCollapsed = true;
            renderStageSheet();
            openSheet( 'stageSheetBackdrop' );
        }

        function closeStageSheet() { closeSheet( 'stageSheetBackdrop' ); stageDraft = null; editingStageId = null; stageSaveError = ''; stageSheetBusy = false; }

        function addStageDoc()      { stageDraft.documents.push( { id: newId(), name: '', type: 'ticket' } ); stageDocsCollapsed = false; renderStageSheet(); }
        function removeStageDoc(id) { stageDraft.documents = stageDraft.documents.filter( function( d ) { return d.id !== id; } ); renderStageSheet(); }

        async function saveStage()
        {
            if( stageSheetBusy )
                return;

            if( ! stageDraft.location.trim() || ! stageDraft.startDate || ! stageDraft.endDate )
                return;

            if( stageDateTimeKey( stageDraft.endDate, stageDraft.endTime ) < stageDateTimeKey( stageDraft.startDate, stageDraft.startTime ) )
            {
                stageSaveError = T( 'trips.endBeforeStartTime' );
                renderStageSheet();
                return;
            }

            stageSaveError = '';

            // Stage documents live in the (already-existing) trip folder. Uploading or
            // deleting one needs the network; a text-only stage edit still saves offline.
            const parentTrip   = findTrip( selectedTripId );
            const originalStage = editingStageId && parentTrip
                ? parentTrip.stages.find( function( s ) { return s.id === stageDraft.id; } ) : null;
            const oldDocs = originalStage ? originalStage.documents : [];

            if( docFilesDirty( stageDraft.documents, oldDocs ) )
            {
                if( ! navigator.onLine )
                {
                    stageSaveError = T( 'trips.filesNeedNet' );
                    renderStageSheet();
                    return;
                }

                stageSheetBusy = true;
                renderStageSheet();

                try
                {
                    await syncDocFiles( parentTrip.dirName, stageDraft.documents, oldDocs );
                }
                catch( _ )
                {
                    stageSheetBusy = false;
                    stageSaveError = T( 'trips.uploadFailed' );
                    renderStageSheet();
                    return;
                }

                stageSheetBusy = false;
            }

            mutateTrip( selectedTripId, function( t )
            {
                let stages;

                if( editingStageId )
                {
                    stages = t.stages.map( function( st ) { return st.id === stageDraft.id ? { ...stageDraft } : st; } );
                }
                else
                {
                    // New stages are appended at the end - order is otherwise entirely
                    // manual (drag the grip handle, see reorderStage), never re-sorted
                    // automatically, so a reorder the user made is never silently undone.
                    stages = [ ...t.stages, { ...stageDraft, id: newId() } ];
                }

                return { ...t, stages };
            });

            closeStageSheet();
        }

        function deleteStage( stageId )
        {
            mutateTrip( selectedTripId, function( t )
            {
                return { ...t, stages: t.stages.filter( function( st ) { return st.id !== stageId; } ) };
            });
        }

        // The trash button on a stage card's document row. Same rules as removing the row in
        // the stage sheet and saving: an uploaded file is deleted too (needs the network),
        // a link just goes - the linked file stays in the user's files.
        async function deleteStageDoc( stageId, doc )
        {
            const trip  = findTrip( selectedTripId );
            const stage = trip && trip.stages.find( function( s ) { return s.id === stageId; } );
            if( ! stage ) return;

            const oldDocs = stage.documents;
            const newDocs = oldDocs.filter( function( x ) { return x !== doc; } );   // by identity: names can repeat

            if( docFilesDirty( newDocs, oldDocs ) )
            {
                if( ! navigator.onLine )
                {
                    NayiveUI.toast( T( 'trips.filesNeedNet' ) );
                    return;
                }

                await syncDocFiles( trip.dirName, newDocs, oldDocs );
            }

            mutateTrip( trip.id, function( t )
            {
                return { ...t, stages: t.stages.map( function( st ) { return st.id === stageId ? { ...st, documents: newDocs } : st; } ) };
            });
        }

        // The trash button on a trip-level document row (trip detail -> "Documentos").
        // Same rules as deleteStageDoc.
        async function deleteTripDoc( doc )
        {
            const trip = findTrip( selectedTripId );
            if( ! trip ) return;

            const oldDocs = trip.documents;
            const newDocs = oldDocs.filter( function( x ) { return x !== doc; } );   // by identity: names can repeat

            if( docFilesDirty( newDocs, oldDocs ) )
            {
                if( ! navigator.onLine )
                {
                    NayiveUI.toast( T( 'trips.filesNeedNet' ) );
                    return;
                }

                await syncDocFiles( trip.dirName, newDocs, oldDocs );
            }

            mutateTrip( trip.id, function( t ) { return { ...t, documents: newDocs }; } );
        }

        function deleteStageFromSheet()
        {
            const id = editingStageId;
            closeStageSheet();
            deleteStage( id );
        }

        // A stage is "enabled" unless it carries enabled === false. A disabled stage is
        // kept in the trip and the list (collapsed), but drops out of the route map. The
        // flag is deliberately generic - future features may hang more off it.
        function stageEnabled( st ) { return st.enabled !== false; }

        function toggleStage( stageId )
        {
            mutateTrip( selectedTripId, function( t )
            {
                return { ...t, stages: t.stages.map( function( st )
                {
                    return st.id === stageId ? { ...st, enabled: ! stageEnabled( st ) } : st;
                }) };
            });
        }

        // Drop `stageId` immediately before / after `targetStageId` in the itinerary.
        // Ids are numbers but arrive here as strings from dataset - compare as strings.
        function reorderStage( stageId, targetStageId, bBefore )
        {
            const sId = String( stageId );
            const tId = String( targetStageId );

            if( sId === tId )
                return;

            mutateTrip( selectedTripId, function( t )
            {
                const stages = [ ...t.stages ];
                const from   = stages.findIndex( function( st ) { return String( st.id ) === sId; } );

                if( from === -1 )
                    return t;

                const [ moved ] = stages.splice( from, 1 );

                let to = stages.findIndex( function( st ) { return String( st.id ) === tId; } );

                if( to === -1 )
                    return t;

                if( ! bBefore )
                    to += 1;

                stages.splice( to, 0, moved );

                return { ...t, stages };
            });
        }

        //------------------------------------------------------------------------//
        // STAGE DRAG & DROP - reorder within the itinerary (Pointer Events, so mouse,
        // touch and pen all work). Two ways in:
        //   - the grip icon before each title: drag starts on pointerdown (any pointer);
        //   - anywhere else on the card, mouse/pen only: press and move past a few px
        //     promotes to a drag; a plain press-release stays a click and opens the
        //     editor. Touch keeps using the grip so a swipe still scrolls the page.

        let stageDragCtx    = null;
        let stageDragEndedAt = 0;   // timestamp - the card click handler ignores clicks right after a drag

        // Grip handle: reorder immediately.
        function onStageDragStart( e, stageId )
        {
            e.preventDefault();
            beginStageDrag( e.pointerId, e.clientX, e.clientY, stageId, e.currentTarget );
        }

        // Card body (mouse / pen): arm on press, promote to a drag only once the
        // pointer travels past the click slop; otherwise let the click through.
        function onStageCardPointerDown( e, stageId, cardEl )
        {
            if( e.pointerType === 'touch' )                return;   // leave touch to scroll / the grip
            if( e.button !== 0 && e.pointerType === 'mouse' ) return;
            if( e.target.closest( 'a, button, .stage-drag' ) ) return;   // controls + grip handle themselves

            e.preventDefault();   // stop the press from selecting text mid-card

            const startX = e.clientX, startY = e.clientY, pid = e.pointerId;

            try { cardEl.setPointerCapture( pid ); } catch( _ ) {}

            function onMove( ev )
            {
                if( ev.pointerId !== pid ) return;

                if( Math.hypot( ev.clientX - startX, ev.clientY - startY ) < 6 )
                    return;   // still within click slop - keep waiting

                detach();
                beginStageDrag( pid, ev.clientX, ev.clientY, stageId, cardEl );
            }

            function onUp( ev )
            {
                if( ev.pointerId === pid ) detach();   // never moved far enough -> the card's click fires next
            }

            function detach()
            {
                cardEl.removeEventListener( 'pointermove',   onMove );
                cardEl.removeEventListener( 'pointerup',     onUp );
                cardEl.removeEventListener( 'pointercancel', onUp );
            }

            cardEl.addEventListener( 'pointermove',   onMove );
            cardEl.addEventListener( 'pointerup',     onUp );
            cardEl.addEventListener( 'pointercancel', onUp );
        }

        function beginStageDrag( pointerId, clientX, clientY, stageId, captureEl )
        {
            const itemEl = captureEl.closest( '.stage-item' );
            const rect   = itemEl.getBoundingClientRect();

            try { captureEl.setPointerCapture( pointerId ); } catch( _ ) {}

            const ghost = itemEl.cloneNode( true );
            ghost.classList.add( 'stage-drag-ghost' );
            ghost.style.width = rect.width + 'px';
            document.body.appendChild( ghost );
            positionStageGhost( ghost, clientX, clientY );

            stageDragCtx = { stageId: stageId, ghostEl: ghost, hoverItem: null, before: true };

            itemEl.classList.add( 'stage-dragging' );

            captureEl.addEventListener( 'pointermove',   onStageDragMove );
            captureEl.addEventListener( 'pointerup',     onStageDragEnd );
            captureEl.addEventListener( 'pointercancel', onStageDragCancel );
        }

        function positionStageGhost( ghost, clientX, clientY )
        {
            ghost.style.transform = 'translate(' + (clientX + 12) + 'px,' + (clientY - 16) + 'px)';
        }

        function stageItemUnder( clientX, clientY, ghost )
        {
            const prev = ghost.style.pointerEvents;
            ghost.style.pointerEvents = 'none';
            const el = document.elementFromPoint( clientX, clientY );
            ghost.style.pointerEvents = prev;

            return el ? el.closest( '.stage-item' ) : null;
        }

        function clearStageDropMarks()
        {
            document.querySelectorAll( '.stage-item.drop-before, .stage-item.drop-after' )
                .forEach( function( el ) { el.classList.remove( 'drop-before', 'drop-after' ); } );
        }

        function onStageDragMove( e )
        {
            if( ! stageDragCtx )
                return;

            positionStageGhost( stageDragCtx.ghostEl, e.clientX, e.clientY );
            clearStageDropMarks();

            const item = stageItemUnder( e.clientX, e.clientY, stageDragCtx.ghostEl );

            if( item && item.dataset.stageId !== String( stageDragCtx.stageId ) )
            {
                const r      = item.getBoundingClientRect();
                const before = e.clientY < r.top + r.height / 2;

                item.classList.add( before ? 'drop-before' : 'drop-after' );
                stageDragCtx.hoverItem = item;
                stageDragCtx.before    = before;
            }
            else
            {
                stageDragCtx.hoverItem = null;
            }
        }

        function onStageDragEnd( e )
        {
            if( ! stageDragCtx )
                return;

            const ctx = stageDragCtx;

            cleanupStageDrag( e.currentTarget );

            if( ctx.hoverItem )
                reorderStage( ctx.stageId, ctx.hoverItem.dataset.stageId, ctx.before );
            else
                renderAll();   // dropped nowhere useful - just repaint to clear the drag state
        }

        function onStageDragCancel( e )
        {
            if( ! stageDragCtx )
                return;

            cleanupStageDrag( e.currentTarget );
            renderAll();
        }

        function cleanupStageDrag( handle )
        {
            if( stageDragCtx )
                stageDragCtx.ghostEl.remove();

            clearStageDropMarks();

            handle.removeEventListener( 'pointermove',   onStageDragMove );
            handle.removeEventListener( 'pointerup',     onStageDragEnd );
            handle.removeEventListener( 'pointercancel', onStageDragCancel );

            stageDragCtx = null;
            stageDragEndedAt = Date.now();   // swallow the click the browser fires right after the drop
        }

        //------------------------------------------------------------------------//
        // CURRENCY CONVERTER

        let calcLocal      = '';
        let calcEur        = '';
        let currencyLookup = null;   // null while loading; see lookupExchangeRate() for shape
        let currencyContextName = '';   // place name shown in the sheet's "couldn't determine" note

        // codeArg/matchedArg/contextName are passed by a per-stage converter button; with no
        // args (the header button) the currency is derived from the trip's stages or destination.
        function openCurrency( codeArg, matchedArg, contextName )
        {
            const trip = findTrip( selectedTripId );

            if( ! trip )
                return;

            calcLocal      = '';
            calcEur        = '';
            currencyLookup = null;

            let code, matched;

            if( codeArg )
            {
                code    = codeArg;
                matched = matchedArg !== false;
                currencyContextName = contextName || trip.destination;
            }
            else if( (trip.stages || []).length )
            {
                const c = stageCurrency( trip.stages[ 0 ] );
                code    = c.code;
                matched = c.matched;
                currencyContextName = trip.stages[ 0 ].location || trip.destination;
            }
            else
            {
                const d = detectCurrency( trip.destination );
                code    = d.code;
                matched = d.matched;
                currencyContextName = trip.destination;
            }

            renderCurrencySheet();   // shows the loading state
            openSheet( 'currencySheetBackdrop' );

            const mySheetOpenAt = ++currencyLookupSeq;

            lookupExchangeRate( code, matched ).then( function( result )
            {
                if( mySheetOpenAt !== currencyLookupSeq )
                    return;   // sheet was reopened (or a different trip) before this resolved - discard

                currencyLookup = result;
                renderCurrencySheet();
            });
        }

        let currencyLookupSeq = 0;

        function calcOnLocalChange( sVal )
        {
            if( ! currencyLookup || ! currencyLookup.verified )
                return;   // no verified rate - the fields stay disabled, this should not fire

            const rate = currencyLookup.verified.rate;
            const n    = parseFloat( sVal );

            calcLocal = sVal;
            calcEur   = (sVal === '' || isNaN( n )) ? '' : String( round2( n / rate ) );
            renderCurrencySheet();
        }

        function calcOnEurChange( sVal )
        {
            if( ! currencyLookup || ! currencyLookup.verified )
                return;

            const rate = currencyLookup.verified.rate;
            const n    = parseFloat( sVal );

            calcEur   = sVal;
            calcLocal = (sVal === '' || isNaN( n )) ? '' : String( round2( n * rate ) );
            renderCurrencySheet();
        }

        //------------------------------------------------------------------------//
        // EXPORT TRIP -> PDF
        //
        // No PDF library: fill a hidden #printRoot with a clean, linear, light-theme
        // version of the whole trip and call window.print(). The user picks "Save as
        // PDF" (or a real printer) in the browser's own dialog. Works offline. The
        // print stylesheet (see <style>) hides #app and shows only #printRoot on paper.

        // `trip` is the one to print - the button lives on that trip's card in the list.
        async function exportTripPdf( trip )
        {
            if( ! trip )
                return;

            // Forecasts are fetched lazily as the stage cards render, so a trip printed from
            // the list may have loaded none of them. Fill in what is missing before building
            // the sheet (capped, so a slow API never holds up the print dialog).
            if( navigator.onLine )
                await preloadTripWeather( trip );

            const root = document.getElementById( 'printRoot' );
            root.innerHTML = '';
            const docNode = buildTripPrintDoc( trip );
            root.appendChild( docNode );

            // The browser's "Save as PDF" dialog seeds the file name from document.title,
            // so swap in the trip name while the dialog is open -> "<trip name>.pdf".
            const prevTitle = document.title;
            document.title  = pdfFileTitle( trip );

            function cleanup()
            {
                document.title = prevTitle;
                if( printMapInstance ) { printMapInstance.remove(); printMapInstance = null; }
                root.innerHTML  = '';
                root.style.cssText = '';   // drop the off-screen staging styles (see below)
            }

            // Clear the print DOM again once the dialog closes so it never lingers.
            window.addEventListener( 'afterprint', function done()
            {
                window.removeEventListener( 'afterprint', done );
                cleanup();
            });

            const initMap = docNode._initMap;

            if( initMap && navigator.onLine )
            {
                // Leaflet needs a laid-out container (a display:none element measures 0x0),
                // so stage #printRoot off-screen at roughly the printed text width while the
                // map builds, wait for its tiles, then open the dialog. The @media print
                // block resets these inline styles so the sheet still fills the page.
                root.style.cssText = 'display:block; position:fixed; left:-10000px; top:0; width:680px;';

                let printed = false;
                const go = function()
                {
                    if( printed ) return;
                    printed = true;
                    if( printMapInstance ) printMapInstance.invalidateSize();
                    setTimeout( function() { window.print(); }, 80 );
                };

                requestAnimationFrame( function() { initMap( go ); } );
                setTimeout( go, 4000 );   // hard cap - never leave the export hanging on slow tiles
            }
            else
            {
                // No map (offline, or nothing to plot): the original fast path.
                setTimeout( function() { window.print(); }, 60 );
            }
        }

        // Every forecast the printed sheet wants, fetched once into weatherCache.
        // stagePrintWeather() only ever reads that cache, so anything still missing when
        // the wait gives up simply prints without weather.
        async function preloadTripWeather( trip )
        {
            const jobs = ( trip.stages || [] )
                .filter( function( st ) { return stageEnabled( st ) && typeof st.lat === 'number' && typeof st.lon === 'number' && st.startDate; } )
                .map( function( st ) { return { key: st.lat.toFixed( 3 ) + ',' + st.lon.toFixed( 3 ) + ',' + st.startDate, st: st }; } )
                .filter( function( j ) { return ! weatherCache.has( j.key ); } )
                .map( function( j ) { return loadStageWeather( j.key, j.st.lat, j.st.lon, j.st.startDate ); } );

            if( ! jobs.length )
                return;

            await Promise.race( [ Promise.all( jobs ),
                                  new Promise( function( resolve ) { setTimeout( resolve, 2500 ); } ) ] );
        }

        // A file-name-safe version of the trip name for the exported PDF (drops the
        // characters an OS forbids in file names; the browser appends ".pdf" itself).
        function pdfFileTitle( trip )
        {
            const name = ( trip.destination || '' ).trim()
                             .replace( /[\/\\:*?"<>|]+/g, ' ' )
                             .replace( /\s+/g, ' ' )
                             .trim();
            return name || T( 'trips.trip' );
        }

        // Days a trip spans, inclusive of the first and last day.
        function tripDayCount( trip )
        {
            if( ! trip.startDate || ! trip.endDate ) return null;
            const ms = new Date( trip.endDate + 'T00:00:00' ) - new Date( trip.startDate + 'T00:00:00' );
            if( isNaN( ms ) || ms < 0 ) return null;
            return Math.round( ms / 86400000 ) + 1;
        }

        // How a document's bytes are attached, in words, for the print sheet.
        function docKindLabel( d )
        {
            if( docIsLink( d ) )            return T( 'trips.docLinked' );
            if( d && d._pending )           return T( 'trips.docUploadedPending' );
            if( d && (d.kind === 'upload' || d.file) ) return T( 'trips.docUploaded' );
            return T( 'trips.docNoFile' );
        }

        // The stored path of a document, or '' when it has no file yet.
        function docFullPath( trip, d )
        {
            if( docIsLink( d ) )  return d.path || '';
            if( docHasFile( d ) ) return docPath( tripBase( trip ), d );
            return '';
        }

        function prEl( sTag, sClass, sText )
        {
            const e = document.createElement( sTag );
            if( sClass ) e.className = sClass;
            if( sText != null ) e.textContent = sText;
            return e;
        }

        function stagePrintWeather( st )
        {
            if( typeof st.lat !== 'number' || typeof st.lon !== 'number' || ! st.startDate )
                return null;

            const w = weatherCache.get( st.lat.toFixed( 3 ) + ',' + st.lon.toFixed( 3 ) + ',' + st.startDate );

            if( ! w )
                return null;

            const temps = [];
            if( w.tmin != null ) temps.push( TF( 'trips.tempMin', { t: Math.round( w.tmin ) } ) );
            if( w.tmax != null ) temps.push( TF( 'trips.tempMax', { t: Math.round( w.tmax ) } ) );

            return [ WX_LABELS()[ w.bucket ], temps.join( ' · ' ) ].filter( Boolean ).join( ' · ' ) || null;
        }

        function prDocList( trip, docs )
        {
            const ul = prEl( 'ul', 'pr-doclist' );

            docs.forEach( function( d )
            {
                const li = prEl( 'li' );
                li.appendChild( prEl( 'div', 'pr-doc-name',
                    ( ( d.name && d.name.trim() ) || T( 'trips.docUntitled' ) ) + ' — ' + ( DOC_TYPE_LABELS()[ d.type ] || d.type || T( 'trips.docOther' ) ) ) );
                li.appendChild( prEl( 'div', 'pr-doc-kind', docKindLabel( d ) ) );

                const path = docFullPath( trip, d );
                li.appendChild( prEl( 'div', 'pr-doc-path', path || T( 'trips.docNoFileParen' ) ) );

                ul.appendChild( li );
            });

            return ul;
        }

        // A two-column key/value table for the print sheet. `rows` is [ [key, value], ... ];
        // a null / '' value drops the row.
        function prKvTable( rows )
        {
            const kv = prEl( 'table', 'pr-kv' );

            rows.forEach( function( r )
            {
                if( r[ 1 ] == null || r[ 1 ] === '' ) return;
                const tr = document.createElement( 'tr' );
                tr.appendChild( prEl( 'th', null, r[ 0 ] ) );
                tr.appendChild( prEl( 'td', null, r[ 1 ] ) );
                kv.appendChild( tr );
            });

            return kv;
        }

        function tripFolderPath( trip ) { return 'data/trips/' + trip.dirName + '/'; }

        function coordText( lat, lon )
        {
            return ( typeof lat === 'number' && typeof lon === 'number' )
                 ? lat.toFixed( 5 ) + ', ' + lon.toFixed( 5 )
                 : '';
        }

        function buildTripPrintDoc( trip )
        {
            const doc    = prEl( 'div', 'pr-doc' );
            const stages = trip.stages || [];

            const head = prEl( 'div', 'pr-head' );
            head.appendChild( prEl( 'h1', null, trip.destination || T( 'trips.trip' ) ) );
            // Nothing below the title: no date range, no folder path - the title alone.
            doc.appendChild( head );

            // -- Trip summary --
            const stageDocCount = stages.reduce( function( a, st ) { return a + (( st.documents || [] ).length); }, 0 );
            const days = tripDayCount( trip );

            const sumSec = prEl( 'section', 'pr-sec' );
            sumSec.appendChild( prEl( 'h2', null, T( 'trips.summary' ) ) );
            sumSec.appendChild( prKvTable( [
                [ T( 'trips.dates' ),               fmtRange( trip.startDate, trip.endDate ) ],
                [ T( 'trips.duration' ),             days != null ? TF( days === 1 ? 'trips.oneDay' : 'trips.nDays', { n: days } ) : '' ],
                [ T( 'trips.coords' ),          stages.length ? '' : coordText( trip.lat, trip.lon ) ],
                [ T( 'trips.stageCount' ),         String( stages.length ) ],
                [ T( 'trips.tripDocs' ), String( ( trip.documents || [] ).length ) ],
                [ T( 'trips.stageDocs' ), String( stageDocCount ) ]
            ] ) );
            doc.appendChild( sumSec );

            // -- Trip documents --
            const docsSec = prEl( 'section', 'pr-sec' );
            docsSec.appendChild( prEl( 'h2', null, T( 'trips.tripDocs' ) ) );
            if( trip.documents && trip.documents.length )
                docsSec.appendChild( prDocList( trip, trip.documents ) );
            else
                docsSec.appendChild( prEl( 'p', 'pr-empty', T( 'trips.noDocs' ) ) );
            doc.appendChild( docsSec );

            // -- Itinerary --
            const itinSec = prEl( 'section', 'pr-sec' );
            itinSec.appendChild( prEl( 'h2', null, T( 'trips.itinerary' ) ) );

            if( ! stages.length )
            {
                itinSec.appendChild( prEl( 'p', 'pr-empty', T( 'trips.noStagesOneLeg' ) ) );
            }
            else
            {
                const ol = prEl( 'ol', 'pr-stages' );

                stages.forEach( function( st, i )
                {
                    const li     = prEl( 'li', 'pr-stage' );
                    const isLast = i === stages.length - 1;

                    const h = prEl( 'div', 'pr-stage-head' );
                    h.appendChild( prEl( 'span', 'pr-num', String( i + 1 ) ) );
                    h.appendChild( prEl( 'span', 'pr-loc', st.location || T( 'trips.noLocation' ) ) );
                    // A stage's transport is how you travel onward from it, so the last stage has none.
                    if( ! isLast )
                        h.appendChild( prEl( 'span', 'pr-transport', TRANSPORT_LABELS()[ st.transport ] || T( 'trips.trOther' ) ) );
                    li.appendChild( h );

                    // "Salida" / "Llegada" are the journey's departure and arrival stamps
                    // (stage start/end time, on the stage start/end date). The plain date
                    // range lives in "Fechas"; the times move onto their own rows next to
                    // the transport mode.
                    const depTxt = st.startTime ? fmtDate( st.startDate ) + ' ' + st.startTime : '';
                    const arrTxt = st.endTime   ? fmtDate( st.endDate )   + ' ' + st.endTime   : '';
                    const cur      = stageCurrency( st );
                    const stDocs   = st.documents || [];

                    li.appendChild( prKvTable( [
                        [ T( 'trips.location' ),   st.location || T( 'trips.noLocation' ) ],
                        [ T( 'trips.dates' ),      fmtRange( fmtDate( st.startDate ), fmtDate( st.endDate ) ) ],
                        [ T( 'trips.timezone' ), [ st.tzLabel, st.tz && st.tz !== st.tzLabel ? '(' + st.tz + ')' : '' ].filter( Boolean ).join( ' ' ) || st.tz || '' ],
                        [ T( 'trips.coords' ), coordText( st.lat, st.lon ) ],
                        [ T( 'trips.transport' ),  isLast ? '' : ( TRANSPORT_LABELS()[ st.transport ] || T( 'trips.trOther' ) ) ],
                        [ T( 'trips.departure' ),      depTxt ],
                        [ T( 'trips.arrival' ),     arrTxt ],
                        [ T( 'trips.currency' ),      cur.code + ( cur.matched ? '' : ' (aproximada)' ) ],
                        [ T( 'trips.weather' ), stagePrintWeather( st ) ],
                        [ T( 'trips.lodging' ), st.accommodation && st.accommodation.trim() ? st.accommodation.trim() : '' ],
                        [ NayiveUI.t( 'ui.notes' ),       st.notes && st.notes.trim() ? st.notes.trim() : '' ],
                        [ T( 'trips.documents' ),  String( stDocs.length ) ]
                    ] ) );

                    if( stDocs.length )
                    {
                        const dw = prEl( 'div', 'pr-stage-docs' );
                        dw.appendChild( prEl( 'strong', null, T( 'trips.stageDocsColon' ) ) );
                        dw.appendChild( prDocList( trip, stDocs ) );
                        li.appendChild( dw );
                    }

                    ol.appendChild( li );
                });

                itinSec.appendChild( ol );
            }

            doc.appendChild( itinSec );

            // -- Appendix: every associated file path in one list --
            const files = [];
            ( trip.documents || [] ).forEach( function( d ) { files.push( [ T( 'trips.trip' ), d ] ); } );
            stages.forEach( function( st, i )
            {
                ( st.documents || [] ).forEach( function( d )
                {
                    files.push( [ TF( 'trips.stageN', { n: i + 1 } ) + ( st.location ? ' · ' + st.location : '' ), d ] );
                });
            });

            const filesSec = prEl( 'section', 'pr-sec' );
            filesSec.appendChild( prEl( 'h2', null, T( 'trips.linkedFiles' ) ) );

            if( ! files.length )
            {
                filesSec.appendChild( prEl( 'p', 'pr-empty', T( 'trips.noLinkedFiles' ) ) );
            }
            else
            {
                const tbl = prEl( 'table', 'pr-files' );
                const hr  = document.createElement( 'tr' );
                [ T( 'trips.belongsTo' ), T( 'trips.document' ), T( 'trips.fullPath' ) ].forEach( function( t ) { hr.appendChild( prEl( 'th', null, t ) ); } );
                tbl.appendChild( hr );

                files.forEach( function( f )
                {
                    const owner = f[ 0 ], d = f[ 1 ];
                    const tr = document.createElement( 'tr' );
                    tr.appendChild( prEl( 'td', null, owner ) );
                    tr.appendChild( prEl( 'td', null, (d.name && d.name.trim()) || T( 'trips.docUntitled' ) ) );
                    tr.appendChild( prEl( 'td', null, docFullPath( trip, d ) || T( 'trips.docNoFileParen' ) ) );
                    tbl.appendChild( tr );
                });

                filesSec.appendChild( tbl );
            }

            doc.appendChild( filesSec );

            // -- Route map, last: the whole route with every stage marked --
            const mapSec = buildPrintRouteMap( trip );
            if( mapSec )
            {
                doc.appendChild( mapSec );
                doc._initMap = mapSec._initMap || null;   // exportTripPdf() runs this once the node is laid out
            }

            doc.appendChild( prEl( 'div', 'pr-foot', TF( 'trips.generatedOn', { date: todayIso() } ) + ' · Trips — Nayive' ) );

            return doc;
        }

        // The Leaflet map built for the print sheet. Kept in one place so exportTripPdf()
        // can invalidateSize() it before printing and remove() it on afterprint.
        let printMapInstance = null;

        // The route-map section for the PDF's last page: the full route with a coloured
        // leg per hop and every stage marked and labelled. Returns null when the trip has
        // nothing to plot. The Leaflet map itself is built later, via section._initMap(),
        // because Leaflet must measure a container that is already laid out (exportTripPdf
        // stages #printRoot off-screen for exactly this).
        function buildPrintRouteMap( trip )
        {
            const pts = ( trip.stages || [] )
                .filter( function( st ) { return stageEnabled( st ) && typeof st.lat === 'number' && typeof st.lon === 'number'; } )
                .map( function( st, i ) { return { lat: st.lat, lon: st.lon, label: st.location, index: i + 1, transport: st.transport || 'other' }; } );

            const hasTripPin = ( trip.stages || [] ).length === 0 && typeof trip.lat === 'number' && typeof trip.lon === 'number';

            if( ! pts.length && ! hasTripPin )
                return null;

            const sec = prEl( 'section', 'pr-sec pr-map-sec' );
            sec.appendChild( prEl( 'h2', null, T( 'trips.routeMap' ) ) );

            if( ! navigator.onLine )
            {
                sec.appendChild( prEl( 'p', 'pr-empty', T( 'trips.mapNeedsNetPdf' ) ) );
                return sec;
            }

            // Legend: one entry per transport mode actually used between stages.
            const modes = [];
            pts.slice( 0, -1 ).forEach( function( p ) { if( modes.indexOf( p.transport ) === -1 ) modes.push( p.transport ); } );

            if( modes.length )
            {
                const legend = prEl( 'div', 'pr-map-legend' );
                modes.forEach( function( m )
                {
                    const it = prEl( 'span', 'pr-map-legend-item' );
                    const sw = prEl( 'span', 'pr-map-legend-swatch' );
                    sw.style.background = TRANSPORT_COLORS[ m ] || TRANSPORT_COLORS.other;
                    it.appendChild( sw );
                    it.appendChild( document.createTextNode( TRANSPORT_LABELS()[ m ] || T( 'trips.trOther' ) ) );
                    legend.appendChild( it );
                });
                sec.appendChild( legend );
            }

            const mapDiv = prEl( 'div', 'pr-map' );
            sec.appendChild( mapDiv );

            sec._initMap = function( onReady )
            {
                if( printMapInstance ) { printMapInstance.remove(); printMapInstance = null; }

                // A static snapshot: no zoom/pan controls, not interactive - it only has to print.
                const map = L.map( mapDiv, { zoomControl: false, attributionControl: true,
                                             dragging: false, scrollWheelZoom: false, doubleClickZoom: false } );
                printMapInstance = map;

                let fired = false;
                const ready = function() { if( fired ) return; fired = true; onReady(); };
                NayiveBaseMap.add( map, { print: true, onReady: ready } );

                if( pts.length )
                {
                    for( let i = 1; i < pts.length; i++ )
                    {
                        const mode = pts[ i - 1 ].transport;
                        L.polyline( [ [ pts[i-1].lat, pts[i-1].lon ], [ pts[i].lat, pts[i].lon ] ],
                            { color: TRANSPORT_COLORS[ mode ] || TRANSPORT_COLORS.other,
                              weight: 4, opacity: 0.9, dashArray: '8, 8', lineJoin: 'round' } ).addTo( map );
                    }

                    pts.forEach( function( p )
                    {
                        L.marker( [ p.lat, p.lon ] )
                            .bindTooltip( p.index + '. ' + ( p.label || '' ),
                                          { permanent: true, direction: 'top', offset: [ 0, -6 ] } )
                            .addTo( map );
                    });

                    map.fitBounds( pts.map( function( p ) { return [ p.lat, p.lon ]; } ), { padding: [ 34, 34 ], maxZoom: 12 } );
                }
                else
                {
                    map.setView( [ trip.lat, trip.lon ], 9 );
                    L.marker( [ trip.lat, trip.lon ] )
                        .bindTooltip( trip.destination || '', { permanent: true, direction: 'top', offset: [ 0, -6 ] } )
                        .addTo( map );
                }

                map.invalidateSize();
                setTimeout( ready, 2500 );   // fallback: 'load' may never fire if every tile is cached or errors
            };

            return sec;
        }

        //------------------------------------------------------------------------//
        // RENDERING - HEADER

        function renderHeader()
        {
            const header = document.getElementById( 'tripHeader' );
            header.innerHTML = '';

            // Trailing controls go in their own group so the whole button bar
            // wraps below the title as a unit when the header is too narrow.
            const actions = document.createElement( 'div' );
            actions.className = 'trip-header-actions';

            if( view === 'list' )
            {
                header.appendChild( svgIcon( ICON_TRIP, 26, 'app-icon' ) );

                const h1 = document.createElement( 'h1' );
                h1.className = 'app-title';
                h1.style.flex = '1 1 auto';
                h1.textContent = 'Trips';
                header.appendChild( h1 );

                const addBtn = document.createElement( 'button' );
                addBtn.className = 'icon-btn';
                addBtn.id    = 'addTripBtn';          // the help dialog points at it
                addBtn.title = T( 'trips.addTrip' );
                addBtn.appendChild( svgIcon( ICON_PLUS, 18 ) );
                addBtn.addEventListener( 'click', openAddTrip );
                actions.appendChild( addBtn );
                actions.appendChild( buildHelpBtn() );
                actions.appendChild( buildSyncIndicator() );
                header.appendChild( actions );
            }
            else
            {
                const trip = findTrip( selectedTripId );

                if( ! trip ) { view = 'list'; renderHeader(); return; }

                const backBtn = document.createElement( 'button' );
                backBtn.className = 'icon-btn';
                backBtn.title = T( 'trips.backToTrips' );
                backBtn.appendChild( svgIcon( ICON_ARROW_L, 17 ) );
                backBtn.addEventListener( 'click', goToList );
                header.appendChild( backBtn );

                const titleWrap = document.createElement( 'div' );
                titleWrap.className = 'trip-header-title';

                // The name and, on a trip somebody shared with us, the read-only pill
                // right after it: the pill says something about THIS trip, so it reads
                // next to its name instead of among the action buttons at the far end.
                const nameRow = document.createElement( 'div' );
                nameRow.className = 'trip-header-name';
                const h1 = document.createElement( 'h1' );
                h1.textContent = trip.destination;
                nameRow.appendChild( h1 );

                if( tripIsRO( trip ) ) nameRow.appendChild( NayiveUI.sharedBadge( sharedBy( trip ) ) );

                const sub = document.createElement( 'span' );
                sub.className = 'trip-header-sub';
                sub.textContent = fmtRange( trip.startDate, trip.endDate );
                titleWrap.appendChild( nameRow );
                titleWrap.appendChild( sub );
                header.appendChild( titleWrap );

                const mapBtn = document.createElement( 'button' );
                mapBtn.id = 'mapBtn';
                mapBtn.className = 'icon-btn';
                mapBtn.title = T( 'trips.routeMap' );
                mapBtn.appendChild( svgIcon( ICON_MAP, 17 ) );
                // Sheet opens BEFORE the map is built - Leaflet measures its container's size at
                // init, and a still-hidden (display:none) container measures as 0x0.
                mapBtn.addEventListener( 'click', function() { openSheet( 'mapSheetBackdrop' ); renderMapSheet(); } );
                actions.appendChild( mapBtn );

                // The currency converter lives in the header only when the whole trip uses one
                // currency (or has no stages yet). When stages span several currencies it moves
                // onto each stage card instead - see buildStageItem().
                if( currencyPlacement( trip ) === 'trip' )
                {
                    const calcBtn = document.createElement( 'button' );
                    calcBtn.className = 'icon-btn';
                    calcBtn.appendChild( svgIcon( ICON_CALCULATOR, 17 ) );
                    calcBtn.addEventListener( 'click', function() { openCurrency(); } );

                    // With no stages AND a destination that isn't a recognisable place, the
                    // converter can only fall back to a guessed EUR - worse than nothing for
                    // money. Disable it and say why. (A trip WITH stages keeps it: the sheet's
                    // own "couldn't determine the currency" disclaimer covers a vague title.)
                    const noStages     = ( trip.stages || [] ).length === 0;
                    const unknownPlace = ! detectCurrency( trip.destination ).matched;

                    if( noStages && unknownPlace )
                    {
                        calcBtn.disabled = true;
                        calcBtn.title = T( 'trips.fxNoCountry' );
                    }
                    else
                    {
                        calcBtn.title = T( 'trips.fxTitle' );
                    }

                    actions.appendChild( calcBtn );
                }

                // Share and export-PDF are NOT here: both sit on the trip's card in the
                // list (buildTripCard), where they act on a whole trip without opening it.

                // A trip another user shared with us can be read and mapped - never
                // changed. The server refuses every write on a shared/... path, so these
                // buttons simply are not built. (The read-only pill itself sits next to
                // the title, see above.)
                if( ! tripIsRO( trip ) )
                {
                    const editBtn = document.createElement( 'button' );
                    editBtn.className = 'icon-btn';
                    editBtn.title = T( 'trips.editTrip' );
                    editBtn.appendChild( svgIcon( ICON_PENCIL, 17 ) );
                    editBtn.addEventListener( 'click', openEditTrip );
                    actions.appendChild( editBtn );

                    const delBtn = document.createElement( 'button' );
                    delBtn.className = 'icon-btn danger';
                    delBtn.title = T( 'trips.deleteTrip' );
                    delBtn.appendChild( svgIcon( ICON_TRASH, 16 ) );
                    delBtn.addEventListener( 'click', function()
                    {
                        openConfirm( T( 'trips.deleteTrip' ), TF( 'trips.deleteTripBody', { name: trip.destination } ), NayiveUI.t( 'ui.delete' ), deleteTrip );
                    });
                    actions.appendChild( delBtn );

                    // The stages help: a shared trip has none of the buttons it explains.
                    actions.appendChild( buildHelpBtn() );
                }

                actions.appendChild( buildSyncIndicator() );
                header.appendChild( actions );
            }

            // The "?" answers about the screen you are on (see TRIPS_INTRO).
            if( window.TRIPS_INTRO && NayiveUI.setIntro )
                NayiveUI.setIntro( view === 'detail' ? TRIPS_INTRO.stages : TRIPS_INTRO.home );
        }

        // The toolbar "?" - opens whichever card NayiveUI.setIntro last picked.
        function buildHelpBtn()
        {
            const b = document.createElement( 'button' );
            b.className = 'icon-btn';
            b.type = 'button';
            b.title = NayiveUI.t( 'ui.help' );
            b.setAttribute( 'aria-label', NayiveUI.t( 'ui.help' ) );
            b.setAttribute( 'data-intro-open', '' );
            b.appendChild( svgIcon( ICON_HELP, 18 ) );
            return b;
        }

        //------------------------------------------------------------------------//
        // RENDERING - CONTENT (list / detail)

        function renderContent()
        {
            const content = document.getElementById( 'tripContent' );
            content.innerHTML = '';

            if( view === 'list' )
                content.appendChild( buildListView() );
            else
                content.appendChild( buildDetailView() );
        }

        function buildListView()
        {
            const wrap  = document.createElement( 'div' );
            const today = todayIso();

            const upcoming = trips.filter( function( t ) { return t.endDate >= today; } ).sort( function( a, b ) { return a.startDate.localeCompare( b.startDate, NayiveUI.lang() ); } );
            const past     = trips.filter( function( t ) { return t.endDate < today; } ).sort( function( a, b ) { return b.startDate.localeCompare( a.startDate, NayiveUI.lang() ); } );

            if( trips.length === 0 )
            {
                const note = document.createElement( 'div' );
                note.className = 'empty-list-note';
                note.textContent = T( 'trips.noTrips' );
                wrap.appendChild( note );
                return wrap;
            }

            if( upcoming.length )
            {
                wrap.appendChild( sectionLabel( T( 'trips.upcoming' ), false ) );
                upcoming.forEach( function( t ) { wrap.appendChild( buildTripCard( t, false ) ); } );
            }

            if( past.length )
            {
                wrap.appendChild( sectionLabel( T( 'trips.past' ), true ) );
                past.forEach( function( t ) { wrap.appendChild( buildTripCard( t, true ) ); } );
            }

            return wrap;
        }

        function sectionLabel( sText, bSpaced )
        {
            const el = document.createElement( 'div' );
            el.className = 'section-label' + (bSpaced ? ' spaced' : '');
            el.textContent = sText;
            return el;
        }

        // Whole days from today (local) until `isoDate`. 0 = today, negative = in the past.
        function daysUntil( isoDate )
        {
            if( ! isoDate ) return null;
            const ms = new Date( isoDate + 'T00:00:00' ) - new Date( todayIso() + 'T00:00:00' );
            return isNaN( ms ) ? null : Math.round( ms / 86400000 );
        }

        // The right-aligned countdown pill for an upcoming trip: "Faltan N días" until it
        // starts, "Empieza hoy", or "En curso" once the start date has passed. Past trips
        // (their end date is gone) get nothing.
        function tripCountdownPill( t, bPast )
        {
            if( bPast ) return null;

            const d = daysUntil( t.startDate );
            if( d == null ) return null;

            const txt = d <  0 ? T( 'trips.ongoing' )
                      : d === 0 ? T( 'trips.startsToday' )
                      : d === 1 ? T( 'trips.oneDayLeft' )
                      :           TF( 'trips.nDaysLeft', { n: d } );

            const p = pill( txt );
            p.classList.add( 'meta-pill-right' );
            return p;
        }

        function buildTripCard( t, bPast )
        {
            const totalDocs = t.documents.length + t.stages.reduce( function( a, st ) { return a + st.documents.length; }, 0 );
            const nStages   = t.stages.length;

            const card = document.createElement( 'div' );
            card.className = 'trip-card' + (bPast ? ' past' : '');
            // The card opens the trip - its own action buttons must not (same guard the
            // stage cards use).
            card.addEventListener( 'click', function( e )
            {
                if( e.target.closest( 'button' ) ) return;
                goToDetail( t.id );
            });

            const top = document.createElement( 'div' );
            top.className = 'trip-card-top';

            const avatar = document.createElement( 'div' );
            avatar.className = 'trip-avatar';
            avatar.appendChild( svgIcon( ICON_TRIP, 24 ) );
            top.appendChild( avatar );

            const info = document.createElement( 'div' );
            info.className = 'trip-info';
            const name = document.createElement( 'div' );
            name.className = 'trip-name';
            name.textContent = t.destination;
            const dates = document.createElement( 'div' );
            dates.className = 'trip-dates';
            dates.textContent = fmtRange( t.startDate, t.endDate );
            info.appendChild( name );
            info.appendChild( dates );
            top.appendChild( info );

            // The card's toolbar: this trip's own actions. No "open" button - the card
            // body itself opens the trip (see the click handler above).
            const actions = document.createElement( 'div' );
            actions.className = 'trip-card-actions';

            const pdfBtn = document.createElement( 'button' );
            pdfBtn.className = 'icon-btn sm trip-pdf-btn';     // the help dialog points at it
            pdfBtn.title = T( 'trips.exportPdf' );
            pdfBtn.appendChild( svgIcon( ICON_EXPORT, 17 ) );
            pdfBtn.addEventListener( 'click', function() { exportTripPdf( t ); } );
            actions.appendChild( pdfBtn );

            // A trip somebody shared with us is not ours to pass on - the server refuses
            // every write on a shared/... path. Printing it is fine, so only Share goes.
            if( ! tripIsRO( t ) )
            {
                const shareBtn = document.createElement( 'button' );
                shareBtn.className = 'icon-btn sm trip-share-btn';   // the help dialog points at it
                shareBtn.title = T( 'trips.shareTrip' );
                shareBtn.appendChild( svgIcon( ICON_SHARE, 17 ) );
                shareBtn.addEventListener( 'click', function()
                {
                    NayiveUI.shareSheet( { path: tripBase( t ), app: 'trips',
                                           title: t.destination || T( 'trips.trip' ) } );
                });
                actions.appendChild( shareBtn );
            }

            top.appendChild( actions );
            card.appendChild( top );

            const meta = document.createElement( 'div' );
            meta.className = 'trip-card-meta';
            meta.appendChild( pill( nStages   === 0 ? T( 'trips.noStages' )
                                  : nStages   === 1 ? T( 'trips.oneStage' ) : TF( 'trips.nStages', { n: nStages } ) ) );
            meta.appendChild( pill( totalDocs === 0 ? T( 'trips.noDocsShort' )
                                  : totalDocs === 1 ? T( 'trips.oneDoc' )   : TF( 'trips.nDocs',   { n: totalDocs } ) ) );

            const countdown = tripCountdownPill( t, bPast );
            if( countdown ) meta.appendChild( countdown );

            card.appendChild( meta );

            return card;
        }

        function pill( sText )
        {
            const el = document.createElement( 'span' );
            el.className = 'meta-pill';
            el.textContent = sText;
            return el;
        }

        function buildDetailView()
        {
            const trip = findTrip( selectedTripId );
            const wrap = document.createElement( 'div' );

            if( ! trip )
                return wrap;

            const tz     = viewerTz();
            const hereId = hereStageId( trip );

            // A shared trip lends its photo folder too (see sharedRef), so the row
            // is shown there as well - just without the pick / clear buttons.
            if( ! tripIsRO( trip ) || (trip.photosDir || '').trim() )
                wrap.appendChild( buildPhotosRow( trip ) );

            // "Documentos  (i) [+]" - the "+" opens the trip sheet on a fresh, blank
            // document row; the info dot is the one that used to sit in that sheet.
            const ro       = tripIsRO( trip );
            const docsCtls = ro ? [] : [ docsLabelInfoDot(),
                                         headingBtn( T( 'trips.addDoc' ), ICON_PLUS, addTripDocFromDetail ) ];

            const docsSec = collapsibleSection( T( 'trips.documents' ), true, 'docs', docsCtls );
            if( trip.documents.length )
                docsSec.body.appendChild( buildFileList( trip, trip.documents, deleteTripDoc ) );
            else
                docsSec.body.appendChild( emptyNote( T( 'trips.noDocsYet' ) ) );
            wrap.appendChild( docsSec.el );

            const itinSec = collapsibleSection( T( 'trips.itinerary' ), false, 'itin',
                                                ro ? [] : [ headingBtn( T( 'trips.addStage' ), ICON_PLUS, openAddStage ) ] );
            if( trip.stages.length )
            {
                const timeline = document.createElement( 'div' );
                timeline.className = 'timeline';
                trip.stages.forEach( function( st, i ) { timeline.appendChild( buildStageItem( trip, st, tz, i === trip.stages.length - 1, hereId ) ); } );
                itinSec.body.appendChild( timeline );
            }
            else
            {
                itinSec.body.appendChild( emptyNote( T( 'trips.noStagesOneLeg' ) ) );
            }

            wrap.appendChild( itinSec.el );

            return wrap;
        }

        // The "Fotos" row: one row holding the "Fotos" label (styled like the Documentos /
        // Itinerario headings, just inline - no row to spare), the folder path, and the
        // [pick] + [clear] buttons. The path is a pointer into the user's files/ tree
        // (trip.photosDir); nothing reads the pictures here - clicking the path opens that
        // folder in Drive in a new tab.
        function photoDirDisplay( sPath )
        {
            const parts = String( sPath || '' ).replace( /^\/+/, '' ).replace( /^files\//, '' ).split( '/' ).filter( Boolean );
            if( parts.length <= 2 ) return parts.join( '/' );
            return '…/' + parts.slice( -2 ).join( '/' );
        }

        function buildPhotosRow( trip )
        {
            const ro  = tripIsRO( trip );
            const row = document.createElement( 'div' );
            row.className = 'photos-row';

            const label = document.createElement( 'span' );
            label.className = 'photos-label';
            label.textContent = T( 'trips.photos' );
            row.appendChild( label );

            const dir  = (trip.photosDir || '').trim();
            const path = document.createElement( 'span' );

            if( dir )
            {
                path.className = 'photos-path';
                path.textContent = '"' + photoDirDisplay( dir ) + '"';
                // The row is called "Fotos", so it opens Photos — an album, not a
                // file list. On a shared trip that is the "shared/<slug>/~/..."
                // path the share lends us (read-only); on our own, the folder
                // itself. (It used to open Drive; Photos is the right tool, and it
                // is the same app in both cases.)
                path.title = ( ro ? photoDirDisplay( dir ) : dir ) + '\n' + T( 'trips.openInPhotos' );
                path.addEventListener( 'click', function()
                {
                    window.open( '../photos/index.html?dir=' +
                                 encodeURIComponent( sharedRef( tripBase( trip ), dir ) ),
                                 '_blank', 'noopener' );
                });
            }
            else
            {
                path.className = 'photos-path empty';
                path.textContent = T( 'trips.noFolder' );
            }

            row.appendChild( path );

            // Someone else's trip: look at the folder, never repoint it.
            if( ro ) return row;

            const btn = document.createElement( 'button' );
            btn.className = 'icon-btn';
            btn.title = T( 'trips.pickPhotoFolder' );
            btn.appendChild( svgIcon( ICON_FOLDER, 15 ) );
            btn.addEventListener( 'click', function()
