<!-- index.html - Personal single-user travel planner (trips, stages, documents), backed by Gum's file-manager API -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Trips</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cellipse cx='5.5' cy='9' rx='2' ry='2.5'%3E%3C/ellipse%3E%3Cellipse cx='12' cy='6' rx='2.1' ry='2.6'%3E%3C/ellipse%3E%3Cellipse cx='18.5' cy='9' rx='2' ry='2.5'%3E%3C/ellipse%3E%3Cpath d='M12 12c-4.5 0-7.8 2-7.8 4.4 0 2 2.55 3.3 5.4 2.9 1.35-.2 1.5-.7 2.4-.7s1.05.5 2.4.7c2.85.4 5.4-.9 5.4-2.9C19.8 14 16.5 12 12 12z'%3E%3C/path%3E%3C/svg%3E">

    <!-- Shared colour scheme (dark default, opt-in light). Toggle lives in Drive / the launcher; this page just follows the saved choice. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS; a no-op on the plain-HTTP LAN URL. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <!-- Leaflet - vendored so the page loads with no connection. The map itself needs
         live map tiles, so it is replaced by a placeholder when offline. -->
    <link rel="stylesheet" href="lib/leaflet_v1.9.4/leaflet.css">
    <script src="lib/leaflet_v1.9.4/leaflet.js"></script>
    <script>if( window.L ) L.Icon.Default.imagePath = 'lib/leaflet_v1.9.4/images/';</script>
    <!-- MapLibre GL + its Leaflet bridge draw the base map from vector tiles, so place
         names can follow the UI language (see shared/basemap.js). Deferred, and BEFORE the
         other deferred scripts, so all three exist by the time the app boots. -->
    <link rel="stylesheet" href="lib/maplibre-gl_v5.24.0/maplibre-gl.css">
    <script src="lib/maplibre-gl_v5.24.0/maplibre-gl.js" defer></script>
    <script src="lib/maplibre-gl-leaflet_v0.1.4/leaflet-maplibre-gl.js" defer></script>
    <script src="../shared/basemap.js" defer></script>

    <!-- Gum file-API helpers: HMAC signing, the access probe, retrying fetch. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Small shared UI helpers: backdrop open/close, toast, viewerTz. -->
    <script src="../shared/ui.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        var T = function ( k ) { return NayiveUI.t( k ); };

        // TWO help cards, like Split: the trip list and one open trip (its stages).
        // renderHeader() calls NayiveUI.setIntro with the card for the screen you
        // are on. The stage rows use named icons (not `sel`): a trip with no stages
        // yet has no stage buttons on screen.
        var stages = {
            app:   'trips',
            title: T( 'trips.itinerary' ),
            buttons: [
                { icon: 'plus',   name: T( 'trips.addStage' ),      text: T( 'trips.introStage' ) },
                { icon: 'edit',   name: T( 'trips.editStage' ),     text: T( 'trips.introEditStage' ) },
                { icon: 'eyeoff', name: T( 'trips.toggleStage' ),   text: T( 'trips.introToggleStage' ) },
                { icon: 'trash',  name: T( 'trips.deleteStage' ),   text: T( 'trips.introDeleteStage' ) },
                { icon: 'grip',   name: T( 'trips.introDragName' ), text: T( 'trips.introDrag' ) }
            ],
            tip: T( 'trips.introMap' )
        };

        var home = {
            app:   'trips',
            title: 'Trips',
            lead:  NayiveUI.t( 'trips.introLead' ),
            buttons: [
                { sel: '.trip-header-actions #addTripBtn', text: NayiveUI.t( 'trips.introAdd' ) },
                // Export and Share are on each trip card, so they show once the list has a trip.
                { sel: '.trip-card-actions .trip-pdf-btn',   text: NayiveUI.t( 'trips.introExport' ) },
                { sel: '.trip-card-actions .trip-share-btn', text: NayiveUI.t( 'trips.introShare' ) },
                { sel: '.trip-header-actions .sync-indicator', name: NayiveUI.t( 'ui.syncName' ),
                  text: NayiveUI.t( 'trips.introSync' ) }
            ]
        };

        window.TRIPS_INTRO = { home: home, stages: stages };
        NayiveUI.firstRun( home );
    } );
    </script>

    <!-- Offline-capable persistence: local last-known-good cache + write-behind sync. -->
    <script src="../shared/store.js" defer></script>

    <style>
        /* Base reset, .icon-btn (+ .danger), .app-icon, .sheet,
           .field, .section-label and the input look all come from
           ../shared/app.css. Only what is unique to Trips lives here. */

        .route-offline { padding: 22px 16px; border: 1px dashed var(--line); border-radius: var(--radius-m); color: var(--text-dim); font-size: .9rem; text-align: center; }

        /* Page shell - a custom two-column layout: the trip list on the left, a
           sticky route map on the right once the viewport is wide enough. Not
           the plain app.css .page/.card. */
        .trip-page { min-height: 100vh; width: 100%; background: var(--bg); display: flex; justify-content: center; padding: 28px 14px; }
        .trip-layout { display: flex; gap: 24px; align-items: flex-start; width: 100%; max-width: 460px; }
        .trip-main { flex: 1 1 460px; max-width: 460px; min-width: 0; }
        .trip-panel { background: var(--card); border-radius: var(--radius-l); padding: 22px 18px 18px; border: 1px solid var(--line); box-shadow: var(--elev-card); }

        .route-panel { display: none; flex: 1 1 400px; max-width: 1600px; position: sticky; top: 28px; }
        .route-panel .trip-panel { padding: 18px; }
        .route-placeholder { color: var(--text-dim); font-size: 0.86rem; text-align: center; padding: 60px 20px; }

        @media (min-width: 920px)
        {
            .trip-layout { max-width: 2084px; }
            .route-panel { display: block; }
            #mapBtn { display: none; }
        }

        @media (max-width: 480px)
        {
            .trip-page { padding: 0; }
            .trip-layout { max-width: 100%; }
            .trip-panel { border-radius: 0; border: none; box-shadow: none; min-height: 100vh; }
        }

        /* Header - like the app.css .header, but the <h1> doubles as the trip
           name when a trip is open (plain --text), and only shows --accent in
           its "Trips" app-title state. */
        /* One row while it fits; the button bar wraps below and the trip name
           always shows in full - matches app.css .topbar / .header. */
        .trip-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; row-gap: 4px; margin-bottom: 18px; }
        .trip-header h1 { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text); }
        .trip-header h1.app-title { color: var(--accent); }
        .trip-header-title { flex: 1 1 auto; min-width: min-content; display: flex; flex-direction: column; gap: 1px; }
        .trip-header-title h1 { white-space: normal; }
        /* Name + read-only pill on one line; the pill drops below on a narrow phone. */
        .trip-header-name { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .trip-header-sub { font-size: 0.8rem; color: var(--text-dim); }
        .trip-header-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; margin-left: auto; }

        .section-label.spaced { margin-top: 18px; }

        .trip-card { display: flex; flex-direction: column; gap: 10px; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .trip-card:hover { border-color: color-mix(in srgb, var(--text) 22%, transparent); }
        .trip-card.past { opacity: 0.7; }
        .trip-card-top { display: flex; align-items: center; gap: 12px; }
        /* Just the app icon (paw), no filled circle behind it - the coloured disc read
           like an avatar / status badge and was confusing. */
        .trip-avatar { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; color: var(--accent); flex: 0 0 auto; }
        .trip-info { flex: 1 1 auto; min-width: 0; }
        .trip-name { font-size: 1rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trip-dates { font-size: 0.82rem; color: var(--text-dim); margin-top: 2px; }
        .trip-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .meta-pill { font-size: 0.74rem; color: var(--text-dim); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 10px; }
        /* Countdown pill on the trip list card - same look, pushed to the right edge. */
        .meta-pill.meta-pill-right { margin-left: auto; }
        /* The trip's own toolbar, in the card's top row: share / export. On the card so
           a trip can be shared or printed without opening it first - opening it is the
           card body's job, so there is no button for it here. */
        .trip-card-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }

        .empty-list-note { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 60px 20px; }

        .detail-heading { font-size: 0.95rem; font-weight: 700; margin: 20px 2px 10px; }
        .detail-heading.first { margin-top: 2px; }
        .detail-heading.collapsible { display: flex; align-items: center; gap: 6px; width: 100%; padding: 0; background: none; border: 0; color: inherit; font: inherit; font-weight: 700; text-align: left; cursor: pointer; }
        /* The heading plus its own controls ("+", the info dot) on one line - the
           heading is a <button>, so they sit beside it, not inside it. Same 30px
           borderless buttons the "Fotos" row uses. */
        .detail-heading-row { display: flex; align-items: center; gap: 6px; margin: 20px 2px 10px; }
        .detail-heading-row.first { margin-top: 2px; }
        /* The heading sits at its own width so the "+" lands right AFTER the word,
           the way the folder button does after "Fotos" - not out at the far edge. */
        .detail-heading-row .detail-heading { flex: 0 1 auto; width: auto; min-width: 0; margin: 0; }
        .detail-heading-row .icon-btn { width: 30px; height: 30px; flex: 0 0 auto; }
        .detail-heading .sec-chevron { flex: none; transition: transform .15s ease; }
        .detail-section.collapsed .sec-chevron { transform: rotate(-90deg); }

        .file-list { display: flex; flex-direction: column; gap: 6px; }
        .file-row { display: flex; align-items: center; gap: 10px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: var(--text); }
        .file-row:hover { border-color: color-mix(in srgb, var(--text) 24%, transparent); }
        .file-icon { color: var(--accent); flex: 0 0 auto; display: flex; }
        .file-name { font-size: 0.85rem; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* A deletable row (stage card): the row is a plain box, the link fills it and
           the trash button sits at the right end - a button can't live inside an <a>. */
        .file-open { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; color: inherit; text-decoration: none; }
        .file-row .file-del { flex: 0 0 auto; margin: -4px -5px -4px auto; }

        .empty-note { color: var(--text-dim); font-size: 0.84rem; padding: 2px 2px 14px; }


        /* The node gutter is widened with a negative margin + matching extra padding,
           so the timeline circles get bigger (icon readable) WITHOUT stealing any
           width from the stage cards - the card's left edge stays exactly where it was. */
        .timeline { position: relative; margin: 2px 0 0 -8px; padding-left: 38px; }
        .timeline::before { content: ''; position: absolute; left: 14px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
        .stage-item { position: relative; margin-bottom: 14px; }
        .stage-item:last-child { margin-bottom: 0; }
        .stage-node { position: absolute; left: -38px; top: 1px; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent); }
        .stage-node svg { width: 17px; height: 17px; }
        .stage-node.here { background: var(--accent); color: var(--on-accent); }
        .stage-card { background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px 12px 11px; cursor: pointer; }
        .stage-card.here { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        .stage-card.disabled { background: var(--card2); opacity: 0.75; }
        .stage-item.disabled .stage-node { opacity: 0.4; }
        .stage-card a, .stage-card button { cursor: pointer; }
        .stage-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 7px; }
        .stage-card.disabled .stage-top { margin-bottom: 0; }
        .stage-drag { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; margin: -2px -2px -2px -4px; color: var(--text-dim); cursor: grab; touch-action: none; }
        .stage-drag:active { cursor: grabbing; }
        .stage-dragging { opacity: 0.35; }
        .stage-drag-ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; opacity: 0.9; box-shadow: 0 8px 24px rgba(0,0,0,0.28); border-radius: var(--radius-m); }
        .stage-drag-ghost .stage-node { display: none; }
        .stage-item.drop-before::before,
        .stage-item.drop-after::after { content: ''; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px; }
        .stage-item.drop-before::before { top: -8px; }
        .stage-item.drop-after::after { bottom: -8px; }
        .stage-loc { font-size: 0.95rem; font-weight: 700; }
        .stage-loc.disabled { color: var(--text-dim); font-weight: 600; opacity: 0.55; }
        .stage-clock { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; color: var(--text-dim); flex: 0 0 auto; white-space: nowrap; }
        .stage-clock svg { width: 12px; height: 12px; }
        .here-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: var(--radius-pill); padding: 3px 8px; flex: 0 0 auto; white-space: nowrap; }
        .here-badge svg { width: 11px; height: 11px; }
        .stage-actions { display: flex; gap: 2px; flex: 0 0 auto; margin-left: auto; justify-content: flex-end; }
        .stage-actions .icon-btn { width: 30px; height: 30px; }
        .stage-weather { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--text-dim); }
        .stage-weather .wx-min { color: #4a90d9; font-weight: 600; }
        .stage-weather .wx-max { color: #e07a5f; font-weight: 600; }
        .stage-weather svg { width: 18px; height: 18px; color: var(--text-dim); }
        .stage-row { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 5px; }
        .stage-row svg { flex: 0 0 auto; color: var(--text-dim); }
        .stage-daterow { flex-wrap: wrap; row-gap: 4px; }
        .stage-daterow-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
        .stage-daterow-right .icon-btn { width: 28px; height: 28px; }
        .stage-daterow-right .stage-weather { margin-left: 4px; }
        .stage-notes { font-size: 0.82rem; color: var(--text-dim); margin: 6px 0 8px; line-height: 1.4; white-space: pre-line; }
        .stage-docs { margin-top: 8px; }

        /* .sheet-backdrop / .sheet / .sheet-header / .field / inputs from app.css. */
        #mapSheet { max-width: 1600px; }

        /* trip form fields sit outside a .field (multi-value doc/loc rows) too - they
           just need width. */
        .doc-row input, .loc-input-wrap input { width: 100%; }

        /* .dt-field is the shared DATE / TIME FIELD block (shared/app.css). */

        .doc-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
        .doc-row select { flex: 0 0 auto; width: auto; min-width: 112px; }
        .doc-row .icon-btn { width: 34px; height: 34px; flex: 0 0 auto; }
        .doc-row-path { font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono); margin: -4px 0 8px 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Shown when a stage has at least one document: a chevron before the "Documentos"
           label that collapses/expands the rows */
        .doc-collapse-toggle { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; flex: 0 0 auto; background: transparent; border: none; padding: 0; cursor: pointer; color: var(--text-dim); }
        .doc-collapse-toggle .doc-collapse-chev { transition: transform 0.15s; }
        .doc-collapse-toggle.collapsed .doc-collapse-chev { transform: rotate(-90deg); }

        /* One document's attachment: sits where the name field used to be, in the [type][…][x] row */
        .doc-attach { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; }
        .doc-attach-btn { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px dashed var(--line); border-radius: var(--radius-pill); padding: 6px 11px; color: var(--text-dim); font-size: 0.78rem; cursor: pointer; font-family: inherit; }
        .doc-attach-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--text) 30%, transparent); }
        .doc-attach-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        /* "Documentos" label + a small "+" button to add a doc row (stage sheet) */
        .doc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .doc-head label { margin-bottom: 0; }
        .doc-head .doc-count { margin-left: 4px; color: var(--text-dim); font-weight: 400; }
        /* Plain --text-dim glyph, same as the trip screen's "+" and every other icon button */
        .doc-add-btn { width: 24px; height: 24px; flex: 0 0 auto; }
        .doc-add-btn svg { width: 14px; height: 14px; }
        .doc-attach-set { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; font-family: inherit; font-size: 0.78rem; text-align: left; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 6px 10px; cursor: pointer; }
        .doc-attach-set:hover { border-color: color-mix(in srgb, var(--text) 30%, transparent); }
        .doc-attach-set svg { flex: 0 0 auto; color: var(--accent); }
        .doc-attach-set .doc-attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doc-attach-set .doc-attach-pending { color: var(--text-dim); flex: 0 0 auto; }

        /* files/ tree picker (link an existing file, or pick a folder) */
        .filetree { max-height: 52vh; overflow: auto; padding: 6px; margin-top: 4px; }
        .ft-row { display: flex; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 0.86rem; color: var(--text); white-space: nowrap; }
        .ft-row:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
        .ft-row svg { flex: 0 0 auto; color: var(--text-dim); }
        .ft-row.ft-file svg { color: var(--accent); }
        .ft-caret { width: 14px; flex: 0 0 auto; display: inline-flex; justify-content: center; color: var(--text-dim); }
        .ft-empty { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 24px 12px; }

        /* Trip-level "Fotos" row, above Documentos - label, path and both buttons share one
           row (no separate heading line). .photos-label matches the "Documentos" /
           "Itinerario" heading type (size/weight) so it reads as the same kind of label. */
        .photos-row { display: flex; align-items: center; gap: 8px; margin: 2px 2px 14px; }
        .photos-label { font-size: 0.95rem; font-weight: 700; flex: 0 0 auto; }
        /* It's a link (opens the folder in Drive) so it gets the shared --link colour,
           not the plain text colour - matches the app's `a { color: var(--link) }` rule. */
        .photos-path { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--link); font-family: var(--font-mono); font-size: 0.78rem; cursor: pointer; }
        .photos-path:hover { text-decoration: underline; opacity: 0.8; }
        .photos-path.empty { color: var(--text-dim); font-family: inherit; font-style: italic; }
        .photos-row .icon-btn { width: 30px; height: 30px; flex: 0 0 auto; }


        /* "Ubicación" field: input (with an in-field "locate on map" button) + a gap + a round action button */
        .loc-row { display: flex; align-items: center; gap: 12px; }
        .loc-row .icon-btn { flex: 0 0 auto; }
        .loc-input-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
        .loc-input-wrap input[type=text] { width: 100%; padding-right: 40px; }
        .loc-map-btn { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); }   /* look: the shared .icon-btn.sm */
        /* Below the route-panel breakpoint the map isn't shown, so hide the in-field button. */
        @media (max-width: 919.98px)
        {
            .loc-map-btn { display: none; }
            .loc-input-wrap input[type=text] { padding-right: 10px; }
        }

        .confirm-msg { font-size: 0.9rem; color: var(--text); line-height: 1.45; margin: 0 0 18px; }

        .map-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin: 0 2px 8px; font-size: 0.72rem; color: var(--text-dim); }
        .map-legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .map-legend-swatch { width: 16px; height: 3px; border-radius: 2px; flex: 0 0 auto; }

        /* .sheet-actions / .sheet-actions-left / .btn / .btn-* live in ../shared/theme.css */

        .route-map { border: 1px solid var(--line); border-radius: var(--radius-m); width: 100%; max-width: 1600px; height: min(70vh, 1200px); background: var(--card2); }
        .map-caption { font-size: 0.76rem; color: var(--text-dim); margin: 10px 2px 0; text-align: center; }

        /* The OSM tiles are visually busy - mute them to a calm grey backdrop so the
           coloured trip route is the only thing that stands out. Applied to the tile
           layer only, so markers / route lines / popups keep their real colours. */
        .route-map .leaflet-tile-pane { filter: grayscale(0.92) contrast(0.9) brightness(1.05); }

        /* The route leg that leaves the stage card the pointer is over: it goes from dotted to
           SOLID, so you can see at a glance which hop of the trip that card is. One CSS rule on
           a class Leaflet's own <path> gets - no timer, nothing to stop when the map is rebuilt
           or removed. (It used to blink on and off as well; dropped 2026-09-05, too noisy.)
           `stroke-dasharray: none` beats Leaflet's dashArray because Leaflet writes it as an
           SVG *presentation attribute*, and any CSS rule outranks those. Leaflet's own value
           is left untouched, so dropping the class puts the dots straight back. */
        .route-map path.leg-active { stroke-dasharray: none; }

        /* Leaflet dark-theme overrides - its default controls/popups assume a light page */
        /* Leaflet's popup / zoom / attribution chrome is tokenised once in the shared
           LEAFLET CHROME block (shared/app.css); Photos' map gets the same. */
        .calc-rate { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 14px; line-height: 1.4; }
        .tz-status { font-size: 0.84rem; color: var(--text-dim); line-height: 1.4; }
        .tz-inline { margin: -6px 0 13px; }
        .tz-inline-label { font-weight: 600; }
        .calc-warn { font-size: 0.8rem; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); border-radius: var(--radius-s); padding: 10px 12px; margin: 0 0 14px; line-height: 1.4; }
        .calc-sources { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; }
        .calc-source-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: var(--text-dim); background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 7px 10px; }
        .calc-source-row span:first-child { color: var(--text); }
        input:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ---- Trip -> PDF (print) ------------------------------------------------ */
        /* #printRoot is filled by exportTripPdf() just before window.print(), then
           cleared on afterprint. It is display:none on screen and only shown for print. */
        #printRoot { display: none; }

        @media print
        {
            @page { margin: 14mm; }
            html, body { background: #fff !important; }
            #app, .sheet-backdrop, #docUploadInput { display: none !important; }
            /* On paper the sheet fills the page - undo the off-screen staging
               styles exportTripPdf() sets inline while the route map builds. */
            #printRoot { display: block !important; position: static !important; left: auto !important; top: auto !important; width: auto !important; }
            .leaflet-control-attribution { font-size: 8px; }
        }

        #printRoot { color: #111; background: #fff; font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #printRoot h1, #printRoot h2 { color: #111; }
        #printRoot .pr-head { border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 18px; }
        #printRoot .pr-head h1 { margin: 0 0 3px; font-size: 22px; }
        #printRoot .pr-dates { font-size: 13px; color: #444; }
        #printRoot .pr-sec { margin-bottom: 20px; }
        #printRoot .pr-sec > h2 { font-size: 13px; margin: 0 0 8px; padding-bottom: 3px; border-bottom: 1px solid #bbb; text-transform: uppercase; letter-spacing: .05em; }
        #printRoot .pr-empty { color: #666; font-style: italic; }
        #printRoot ul.pr-doclist { margin: 0; padding-left: 18px; }
        #printRoot ul.pr-doclist li { margin-bottom: 8px; }
        #printRoot .pr-doc-name { font-weight: 600; }
        #printRoot .pr-doc-kind { color: #555; font-size: 10.5px; }
        #printRoot .pr-doc-path { color: #555; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; word-break: break-all; }
        #printRoot .pr-folder { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; color: #555; margin-top: 3px; }
        #printRoot table.pr-files { border-collapse: collapse; width: 100%; font-size: 10.5px; margin-top: 2px; }
        #printRoot table.pr-files th { text-align: left; color: #555; font-weight: 600; padding: 3px 10px 3px 0; white-space: nowrap; vertical-align: top; border-bottom: 1px solid #bbb; }
        #printRoot table.pr-files td { padding: 3px 10px 3px 0; font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; vertical-align: top; border-bottom: 1px solid #e2e2e2; }
        #printRoot table.pr-files td:first-child { font-family: inherit; white-space: nowrap; }
        #printRoot ol.pr-stages { margin: 0; padding: 0; list-style: none; }
        #printRoot li.pr-stage { border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; page-break-inside: avoid; break-inside: avoid; }
        #printRoot .pr-stage-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
        #printRoot .pr-num { font-weight: 700; background: #111; color: #fff; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
        #printRoot .pr-loc { font-weight: 700; font-size: 14px; }
        #printRoot .pr-transport { color: #555; font-size: 11px; margin-left: auto; }
        #printRoot table.pr-kv { border-collapse: collapse; width: 100%; }
        #printRoot table.pr-kv th { text-align: left; width: 108px; vertical-align: top; color: #555; font-weight: 600; padding: 1px 8px 1px 0; white-space: nowrap; }
        #printRoot table.pr-kv td { vertical-align: top; padding: 1px 0; white-space: pre-line; }
        #printRoot .pr-stage-docs { margin-top: 6px; font-size: 11px; }
        #printRoot .pr-stage-docs .pr-doc-path { display: block; margin-left: 12px; }
        #printRoot .pr-foot { margin-top: 24px; padding-top: 8px; border-top: 1px solid #bbb; color: #666; font-size: 10.5px; }

        /* Route map on the last page. -webkit-print-color-adjust keeps the tiles and
           the coloured route legs from being dropped to greyscale by the print engine. */
        #printRoot .pr-map-sec { page-break-inside: avoid; break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        #printRoot .pr-map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10.5px; color: #555; margin: 0 0 6px; }
        #printRoot .pr-map-legend-item { display: inline-flex; align-items: center; gap: 5px; }
        #printRoot .pr-map-legend-swatch { width: 16px; height: 3px; border-radius: 2px; flex: none; }
        #printRoot .pr-map { width: 100%; height: 340px; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; background: #e8e8e8; }
        #printRoot .pr-map .leaflet-tile-pane { filter: grayscale(0.92) contrast(0.9) brightness(1.05); }
        #printRoot .pr-map .leaflet-tooltip { font-size: 10px; padding: 1px 5px; }
    </style>
</head>

<body>
    <noscript>
        <h2 data-i18n="ui.needJs"></h2>
    </noscript>

    <div id="app" style="display: none;">
        <div class="trip-page">
            <div class="trip-layout">

                <div class="trip-main">
                    <div class="trip-panel">
                        <div id="tripHeader" class="trip-header"></div>
                        <div id="tripContent"></div>
                    </div>
                </div>

                <div class="route-panel" id="routePanel">
                    <div class="trip-panel">
                        <div id="routePanelBody"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="sheet-backdrop" id="tripSheetBackdrop">
        <div class="sheet" id="tripSheet"></div>
    </div>

    <div class="sheet-backdrop" id="stageSheetBackdrop">
        <div class="sheet" id="stageSheet"></div>
    </div>

    <div class="sheet-backdrop" id="mapSheetBackdrop">
        <div class="sheet" id="mapSheet"></div>
    </div>

    <div class="sheet-backdrop" id="currencySheetBackdrop">
        <div class="sheet" id="currencySheet"></div>
    </div>

    <div class="sheet-backdrop" id="filePickerSheetBackdrop">
        <div class="sheet" id="filePickerSheet"></div>
    </div>

    <div class="sheet-backdrop" id="confirmSheetBackdrop">
        <div class="sheet" id="confirmSheet" style="max-width: 380px;"></div>
    </div>

    <input type="file" id="docUploadInput" style="display:none">

    <div id="printRoot"></div>

    <script>
        //------------------------------------------------------------------------//
        // STATE

        // Filled in on DOMContentLoaded: shared/gum-api.js and shared/store.js
        // now load deferred, so GumApi / NayiveStore are not defined while this
        // script is parsed. Every reader runs later (DCL or an event).
        let API_FILES;
        let store;             // offline-capable persistence, each trip.json goes through it (see ../shared/store.js)
        let refresher;         // shared/ui.js wireRefresh handle - the plug's click calls refreshNow()

        let trips          = [];
        let view           = 'list';   // 'list' | 'detail'
        let selectedTripId = null;
        let clockTimer     = null;

        //------------------------------------------------------------------------//
        // ICONS (static markup only - never interpolate user text into these)

        // Interface strings: every one of them lives in shared/i18n/*.json.
        const T  = k           => NayiveUI.t( k );
        const TF = ( k, vars ) => NayiveUI.tf( k, vars );

        const ICON_TRIP =
            '<ellipse cx="5.5" cy="9" rx="2" ry="2.5"></ellipse><ellipse cx="12" cy="6" rx="2.1" ry="2.6"></ellipse><ellipse cx="18.5" cy="9" rx="2" ry="2.5"></ellipse>' +
            '<path d="M12 12c-4.5 0-7.8 2-7.8 4.4 0 2 2.55 3.3 5.4 2.9 1.35-.2 1.5-.7 2.4-.7s1.05.5 2.4.7c2.85.4 5.4-.9 5.4-2.9C19.8 14 16.5 12 12 12z"></path>';
        const ICON_PLUS       = '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>';
        // "Go back" - same left arrow the shared dialog buttons use (NayiveUI ICONS.back).
        // An arrow, not a chevron: arrows navigate, chevrons only expand or step in
        // place (NayiveUI ICONS.back / ICONS.forward).
        const ICON_ARROW_L    = '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>';
        const ICON_CHEVRON_DOWN = '<polyline points="6 9 12 15 18 9"></polyline>';
        // Drag-reorder grip - six dots, filled (not stroked like the svgIcon() icons).
        const GRIP_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>';
        const ICON_PENCIL     = '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>';
        const ICON_TRASH      = '<line x1="4" y1="7" x2="20" y2="7"></line><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path>';
        const ICON_CHECK      = '<polyline points="4 12 9 17 20 6"></polyline>';
        const ICON_X          = '<line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>';
        const ICON_PIN        = '<path d="M12 21s-7-6.4-7-11a7 7 0 0 1 14 0c0 4.6-7 11-7 11z"></path><circle cx="12" cy="10" r="2.3"></circle>';
        const ICON_CALENDAR   = '<rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>';
        const ICON_CLOCK      = '<circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline>';
        const ICON_MAP        = '<path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"></path><line x1="9" y1="3" x2="9" y2="19"></line><line x1="15" y1="5" x2="15" y2="21"></line>';
        const ICON_CALCULATOR = '<rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line>' +
            '<circle cx="8" cy="10.5" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="12" cy="10.5" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="16" cy="10.5" r="0.9" fill="currentColor" stroke="none"></circle>' +
            '<circle cx="8" cy="14.5" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="12" cy="14.5" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="16" cy="14.5" r="0.9" fill="currentColor" stroke="none"></circle>' +
            '<circle cx="8" cy="18.5" r="0.9" fill="currentColor" stroke="none"></circle><circle cx="12" cy="18.5" r="0.9" fill="currentColor" stroke="none"></circle>';
        const ICON_FOLDER   = '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>';
        const ICON_FILE     = '<path d="M13 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><polyline points="13 2 13 8 19 8"></polyline>';
        const ICON_LINK     = '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path>';
        const ICON_UPLOAD   = '<path d="M12 16V4"></path><polyline points="7 9 12 4 17 9"></polyline><path d="M5 20h14"></path>';
        const ICON_EXPORT   = '<path d="M12 3v13"></path><polyline points="8 7 12 3 16 7"></polyline><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path>';
        const ICON_EYE      = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>';
        const ICON_EYE_OFF  = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>';
        const ICON_SHARE    = '<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>';
        const ICON_HELP     = '<circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line>';

        // Explains the "Enlazar" / "Subir" choice on every document row. Shown as an
        // info dot in the "Documentos" heading row - before the "+", in both the trip
        // detail and the stage sheet.


        function docsLabelInfoDot()
        {
            const dot = document.createElement( 'button' );
            dot.className = 'info-dot';
            dot.setAttribute( 'data-i18n-attr', 'data-info:trips.docsInfo' );
            return dot;
        }

        const TRANSPORT_ICONS = {
            flight: '<path d="M16 10h4a2 2 0 0 1 0 4h-4l-4 7h-3l2 -7h-4l-2 2h-3l2 -4l-2 -4h3l2 2h4l-2 -7h3z"></path>',
            train:  '<rect x="6" y="3" width="12" height="12" rx="4"></rect><line x1="6" y1="9" x2="18" y2="9"></line><line x1="9" y1="15" x2="7.5" y2="19"></line><line x1="15" y1="15" x2="16.5" y2="19"></line>',
            car:    '<path d="M3 13l1.6-5.2A2 2 0 0 1 6.5 6.3h11a2 2 0 0 1 1.9 1.5L21 13"></path><rect x="2" y="13" width="20" height="5" rx="1.5"></rect><circle cx="7" cy="18.3" r="1.6"></circle><circle cx="17" cy="18.3" r="1.6"></circle>',
            bus:    '<rect x="4" y="4" width="16" height="13" rx="2"></rect><line x1="4" y1="10" x2="20" y2="10"></line><line x1="9" y1="17" x2="9" y2="20"></line><line x1="15" y1="17" x2="15" y2="20"></line><circle cx="8" cy="19" r="1.2"></circle><circle cx="16" cy="19" r="1.2"></circle>',
            ship:   '<circle cx="12" cy="4.5" r="2"></circle><line x1="12" y1="6.5" x2="12" y2="20"></line><path d="M5 11.5a7 7 0 0 0 14 0"></path><line x1="4" y1="11.5" x2="8.5" y2="11.5"></line><line x1="15.5" y1="11.5" x2="20" y2="11.5"></line>',
            other:  '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline>'
        };

        // Transport picker options + the map colours each mode's route segment is drawn in.
        // Colours are all dark/saturated so they read clearly on top of OpenStreetMap's
        // pale land, blue water and green parks.
        // Built on demand: the names come from the dictionary, which lands after
        // this script has been parsed.
        const TRANSPORT_OPTIONS = () => [ [ 'bus',    T( 'trips.trBus' )   ], [ 'flight', T( 'trips.trPlane' ) ],
                                          [ 'ship',   T( 'trips.trShip' )  ], [ 'car',    T( 'trips.trCar' )   ],
                                          [ 'train',  T( 'trips.trTrain' ) ], [ 'other',  T( 'trips.trOther' ) ] ];
        const TRANSPORT_LABELS  = () => TRANSPORT_OPTIONS().reduce( function( m, o ) { m[ o[0] ] = o[1]; return m; }, {} );
        const TRANSPORT_COLORS  = {
            flight: '#d81b60',
            train:  '#ef6c00',
            car:    '#6a1b9a',
            bus:    '#00838f',
            ship:   '#1565c0',
            other:  '#37474f'
        };

        // Weather-forecast glyphs, keyed by the bucket wxBucket() maps a WMO code to.
        const WX_ICONS = {
            clear:  '<circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.6 4.6l1.5 1.5M17.9 17.9l1.5 1.5M4.6 19.4l1.5-1.5M17.9 6.1l1.5-1.5"></path>',
            partly: '<circle cx="8" cy="7.5" r="3"></circle><path d="M8 1.7v1.5M2.3 7.5h1.5M3.8 3.3l1 1"></path><path d="M17.5 20H8a4.2 4.2 0 0 1-.6-8.4 5.5 5.5 0 0 1 10.6 1.5A3.6 3.6 0 0 1 17.5 20z"></path>',
            cloud:  '<path d="M17.5 19H7a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6 1.6A3.9 3.9 0 0 1 17.5 19z"></path>',
            fog:    '<path d="M17.5 15H7a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6 1.6A3.9 3.9 0 0 1 17.5 15z"></path><path d="M4 19h16M7 22h12"></path>',
            rain:   '<path d="M17.5 16H7a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6 1.6A3.9 3.9 0 0 1 17.5 16z"></path><line x1="8" y1="19" x2="7" y2="22"></line><line x1="12" y1="19" x2="11" y2="22"></line><line x1="16" y1="19" x2="15" y2="22"></line>',
            snow:   '<path d="M17.5 16H7a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6 1.6A3.9 3.9 0 0 1 17.5 16z"></path><path d="M8 20h.01M12 21h.01M16 20h.01"></path>',
            storm:  '<path d="M17.5 15H7a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6 1.6A3.9 3.9 0 0 1 17.5 15z"></path><polyline points="13 15 10 20 13 20 10 24"></polyline>',
            none:   '<path d="M17.5 19H7a4.5 4.5 0 0 1-.9-8.9 6 6 0 0 1 11.6 1.6A3.9 3.9 0 0 1 17.5 19z"></path><line x1="4" y1="4" x2="20" y2="20"></line>'
        };

        function wxBucket( code )
        {
            if( code == null )                                    return 'cloud';
            if( code === 0 )                                      return 'clear';
            if( code <= 3 )                                       return 'partly';
            if( code === 45 || code === 48 )                      return 'fog';
            if( code >= 95 )                                      return 'storm';
            if( (code >= 71 && code <= 77) || code === 85 || code === 86 ) return 'snow';
            if( code >= 51 )                                      return 'rain';
            return 'cloud';
        }
        const WX_LABELS = () => ( { clear: T( 'trips.wxClear' ), partly: T( 'trips.wxPartly' ), cloud: T( 'trips.wxCloud' ),
                                   fog: T( 'trips.wxFog' ), rain: T( 'trips.wxRain' ), snow: T( 'trips.wxSnow' ), storm: T( 'trips.wxStorm' ) } );

        const DOC_TYPE_LABELS = () => ( { passport: T( 'trips.docPassport' ), visa: T( 'trips.docVisa' ),
                                          ticket: T( 'trips.docTicket' ), hotel: T( 'trips.docHotel' ), other: T( 'trips.docOther' ) } );

        const DOC_ICONS = {
            passport: '<rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="12" r="2"></circle><line x1="13" y1="10" x2="18" y2="10"></line><line x1="13" y1="13" x2="18" y2="13"></line>',
            visa:     '<path d="M12 3l7 3v6c0 4.8-3 8.4-7 9-4-.6-7-4.2-7-9V6l7-3z"></path><polyline points="9 12 11 14 15 10"></polyline>',
            booking:  '<rect x="3" y="6" width="18" height="12" rx="2"></rect><line x1="9" y1="6" x2="9" y2="18" stroke-dasharray="2.5 2.5"></line>',
            other:    '<path d="M13 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><polyline points="13 2 13 8 19 8"></polyline>'
        };

        function svgIcon( sPathsHtml, nSize, sExtraClass )
        {
            const wrap = document.createElement( 'span' );
            wrap.className = 'icon-wrap' + (sExtraClass ? ' ' + sExtraClass : '');
            wrap.style.display = 'inline-flex';
            wrap.innerHTML = '<svg width="' + nSize + '" height="' + nSize + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + sPathsHtml + '</svg>';
            return wrap;
        }

        //------------------------------------------------------------------------//
        // CURRENCY - the CODE is detected from the trip's destination text (never asked for);
        // the RATE is never hard-coded and never assumed. It is fetched live, on demand, from
        // two independent free services, cross-checked against each other, and openly reported
        // as unavailable when neither responds - this is money, so a guessed number is worse

        // Returns { code, matched }. matched === false means the destination text didn't match
        // anything and EUR is a fallback guess, not a determination - callers must disclose that,
        // never present it as if it were confidently known.
        function detectCurrency( sDestination )
        {
            const sText = (sDestination || '').toLowerCase();
            const keys  = Object.keys( PLACE_CURRENCY ).sort( function( a, b ) { return b.length - a.length; } );

            for( const key of keys )
            {
                const re = new RegExp( '\\b' + key.replace( /[.*+?^${}()|[\]\\]/g, '\\$&' ) + '\\b' );

                if( re.test( sText ) )

        }

        // A stage's currency, detected from its resolved country label (falls back to the
        // raw location text before geocoding lands).
        function stageCurrency( st ) { return detectCurrency( (st && (st.tzLabel || st.location)) || '' ); }

        // Where the currency converter belongs for this trip:
        //   'trip'  - one button in the header: no stages, or every stage uses one currency
        //   'stage' - a button on each stage card: the trip spans more than one currency
        function currencyPlacement( trip )
        {
            const stages = (trip && trip.stages) || [];

            if( stages.length === 0 )
                return 'trip';

            const codes = stages.map( function( s ) { return stageCurrency( s ).code; } );
            return codes.every( function( c ) { return c === codes[ 0 ]; } ) ? 'trip' : 'stage';

        //------------------------------------------------------------------------//
        // LIVE EXCHANGE RATE - a priority-ordered list of independent, free, no-key services.
        // Verification protocol (exact, per explicit instruction - do not "improve" this):
        //   1. Fetch sources in order, skipping any that return no data.
        //   2. Compare the 1st and 2nd sources that DID return data. If |rate1 - rate2| <= 0.01,
        //      the rate is verified (their average is used).
        //   3. Otherwise compare the 2nd and 3rd, then the 3rd and 4th, and so on - always the
        //      next CONSECUTIVE pair, never re-trying an earlier one against a later one.
        //   4. If the list runs out with no pair agreeing, say plainly that the rate could not
        //      be verified. Never fall back to a guessed or hard-coded number - this is money.
        const RATE_TOLERANCE_ABS = 0.01;   // absolute difference between two quoted rates, e.g. 172.40 vs 172.41 is fine, 172.40 vs 172.52 is not

        function ratesAgree( a, b )
        {
            return Math.abs( a - b ) <= RATE_TOLERANCE_ABS;
        }

        async function fetchRateFrankfurter( sCurrency )
        {
            const SOURCE = 'Frankfurter (ECB reference rates)';

            if( sCurrency === 'EUR' )
                return { ok: true, rate: 1, asOf: null, source: SOURCE };

            try
            {
                const res = await fetch( 'https://api.frankfurter.dev/v1/latest?base=EUR&symbols=' + encodeURIComponent( sCurrency ) );

                if( ! res.ok )
                    return { ok: false, source: SOURCE, reason: 'HTTP ' + res.status };

                const data = await res.json();
                const rate = data && data.rates ? data.rates[ sCurrency ] : undefined;

                if( typeof rate !== 'number' )
                    return { ok: false, source: SOURCE, reason: 'does not track ' + sCurrency };

                return { ok: true, rate: rate, asOf: data.date, source: SOURCE };
            }
            catch( _ )
            {
                return { ok: false, source: SOURCE, reason: 'network error' };
            }
        }

        async function fetchRateExchangerateApi( sCurrency )
        {
            const SOURCE = 'exchangerate-api.com (open access)';

            {
                const res = await fetch( 'https://open.er-api.com/v6/latest/EUR' );

                if( ! res.ok )
                    return { ok: false, source: SOURCE, reason: 'HTTP ' + res.status };

                const data = await res.json();

                if( data.result !== 'success' || ! data.rates )
                    return { ok: false, source: SOURCE, reason: 'lookup failed' };

                const rate = data.rates[ sCurrency ];

                if( typeof rate !== 'number' )
                    return { ok: false, source: SOURCE, reason: 'does not track ' + sCurrency };

                return { ok: true, rate: rate, asOf: data.time_last_update_utc, source: SOURCE };
            }
            catch( _ )
            {
                return { ok: false, source: SOURCE, reason: 'network error' };
            }
        }

        async function fetchRateFawaz( sCurrency )
        {
            const SOURCE = 'fawazahmed0/currency-api';

            try
            {
                const res = await fetch( 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json' );

                    return { ok: false, source: SOURCE, reason: 'HTTP ' + res.status };

                    return { ok: false, source: SOURCE, reason: 'does not track ' + sCurrency };

                return { ok: true, rate: rate, asOf: data.date, source: SOURCE };

        // Sources that return no data (network error, HTTP error, or that service simply
        // doesn't track this currency) are skipped entirely - they don't occupy a "slot".
        // Among the sources that DID return a value, compares the 1st against the 2nd; if
        // that fails, the 2nd against the 3rd; then the 3rd against the 4th, and so on -
        // always the next consecutive pair, never re-trying an earlier one. Stops at the
        // first pair that agrees.
        // Result shape: { code, matched, results, verified, compared }
        //   - results:  every fetch actually made, in order, each { ok, rate?, asOf?, source, reason? }
        //   - verified: null if unverified, else { rate, sourceA, sourceB } (rate = their average)
        //   - compared: every consecutive pair actually checked, each with its absolute
        //               difference - shown so a real disagreement is visible, not hidden
        async function lookupExchangeRate( sCurrency, bMatched )
        {
            const results    = [];
            const compared   = [];
            const successful = [];
            let   verified   = null;

            for( const fetchFn of RATE_SOURCE_FETCHERS )
            {
                const r = await fetchFn( sCurrency );
                results.push( r );

                if( ! r.ok )
                    continue;   // no data from this source - not a slot, just skip it

                successful.push( r );

                if( successful.length < 2 )
                    continue;

                const prev = successful[ successful.length - 2 ];
                const diff = Math.abs( prev.rate - r.rate );
                compared.push( { a: prev, b: r, diff: diff } );

                if( ratesAgree( prev.rate, r.rate ) )
                {
                    verified = { rate: (prev.rate + r.rate) / 2, sourceA: prev, sourceB: r };
                    break;
                }
                // else: this pair disagreed - the loop moves on and the NEXT source (if any)
                // will be compared against `r`, not against `prev` again
            }

            return { code: sCurrency, matched: bMatched, results: results, verified: verified, compared: compared };
        }

        //------------------------------------------------------------------------//
        // LOCATION - a stage's (or trip's) timezone AND map coordinates, both detected from its
        // free-text location via live geocoding, never asked for and never assumed: a location
        // that can't be resolved is reported as unresolved, not silently defaulted to UTC/0,0
        // or the viewer's own zone.

        // Two free, no-key lookups chained together: Nominatim (OSM's own geocoder) resolves the
        // free-text name to coordinates - unlike open-meteo's geocoder, it understands alt-language
        // names (e.g. Spanish "Bruselas"/"Gante" for Brussels/Ghent) instead of matching whatever
        // obscure namesake hamlet happens to share the literal spelling - then open-meteo's forecast
        // endpoint turns those coordinates into an IANA timezone.
        //
        // Nominatim's usage policy caps anonymous use at 1 request/second, so calls are serialized
        // through nominatimQueue rather than fired in parallel (a multi-stage trip geocodes several
        // locations at once via ensureRouteCoords()).
        let nominatimQueue = Promise.resolve();

        function queuedNominatimSearch( sQuery )
        {
            const run = function()
            {
                return fetch( 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=en&q=' + encodeURIComponent( sQuery ) )
                    .then( function( res ) { return new Promise( function( resolve ) { setTimeout( function() { resolve( res ); }, 1100 ); } ); } );
            };

            const result = nominatimQueue.then( run, run );
            nominatimQueue = result.catch( function() {} );
            return result;
        }

        // Returns one of:
        //   { timezone, label, lat, lon }  - resolved
        //   null                           - the services are reachable but returned no match
        //   { unreachable: true }          - could not reach a service (offline / 5xx)
        // The caller MUST NOT persist a "not found" (null -> lat:null) for the
        // unreachable case, or a stage geocoded once while offline is stuck
        // forever (retry only fires while lat === undefined).
        async function geocodeLocation( sQuery )
        {
            try
            {
                const geoRes = await queuedNominatimSearch( sQuery );

                if( ! geoRes.ok )
                    return { unreachable: true };

                const geoData = await geoRes.json();

                if( ! Array.isArray( geoData ) )
                    return { unreachable: true };

                const hit = geoData[ 0 ];

                if( ! hit )
                    return null;   // reachable, genuinely no match

                const lat = parseFloat( hit.lat );
                const lon = parseFloat( hit.lon );

                if( ! isFinite( lat ) || ! isFinite( lon ) )
                    return null;

                const tzRes = await fetch( 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&timezone=auto&daily=weathercode' );

                if( ! tzRes.ok )
                    return { unreachable: true };

                const tzData = await tzRes.json();

                if( ! tzData.timezone )
                    return { unreachable: true };

                const addr  = hit.address || {};
                const name  = hit.name || addr.city || addr.town || addr.village || sQuery;
                const extra = [ addr.state, addr.country ].filter( function( s ) { return s && s !== name; } );

                return { timezone: tzData.timezone, label: [ name ].concat( extra ).join( ', ' ), lat: lat, lon: lon };
            }
            catch( _ )
            {
                return { unreachable: true };   // fetch threw - offline / DNS / CORS
            }
        }

        //------------------------------------------------------------------------//
        // WEATHER - a stage's daily min/max temperature and sky for its start date, from
        // open-meteo (no key). Fetched once per (place, date), cached in memory. A date
        // within ~5 days of today or ahead uses the live forecast endpoint; anything
        // older uses the historical archive. Whatever can't be resolved shows as "—".

        const weatherCache   = new Map();   // "lat,lon,date" -> { tmin, tmax, bucket } | null
        const weatherPending = new Set();

        function fillStageWeather( el, st )
        {
            if( typeof st.lat !== 'number' || typeof st.lon !== 'number' || ! st.startDate )
            {
                el.hidden = true;
                return;
            }

            el.hidden = false;

            const key    = st.lat.toFixed( 3 ) + ',' + st.lon.toFixed( 3 ) + ',' + st.startDate;
            const cached = weatherCache.get( key );

            const paint = function( w )
            {
                el.innerHTML = '';

                const mn = document.createElement( 'span' );
                mn.className = 'wx-min';
                mn.textContent = w && w.tmin != null ? Math.round( w.tmin ) + '°' : '—';

                const mx = document.createElement( 'span' );
                mx.className = 'wx-max';
                mx.textContent = w && w.tmax != null ? Math.round( w.tmax ) + '°' : '—';

                el.appendChild( mn );
                el.appendChild( svgIcon( w ? WX_ICONS[ w.bucket ] : WX_ICONS.none, 15 ) );
                el.appendChild( mx );

                el.title = TF( w ? 'trips.forecastFor' : 'trips.noForecastFor', { date: st.startDate } );
            };

            if( cached !== undefined )
            {
                paint( cached );
                return;
            }

            paint( null );   // placeholder while the fetch is in flight
            loadStageWeather( key, st.lat, st.lon, st.startDate );
        }

        async function loadStageWeather( key, lat, lon, sDate )
        {
            if( weatherPending.has( key ) )
                return;

            weatherPending.add( key );

            let w = null;

            try   { w = await fetchWeather( lat, lon, sDate ); }
            catch ( _ ) { w = null; }

            weatherPending.delete( key );

            // Cache the outcome either way (null included) so a stage that has no data,
            // or one viewed while offline, isn't re-requested on every 30s re-render.
            // The 'online' handler clears the cache so it retries once back online.
            weatherCache.set( key, w );

            if( view === 'detail' && ! anySheetOpen() )
                renderContent();
        }

        async function fetchWeather( lat, lon, sDate )
        {
            const near = sDate >= addDaysIso( todayIso(), -5 );
            const base = near ? 'https://api.open-meteo.com/v1/forecast'
                              : 'https://archive-api.open-meteo.com/v1/archive';

            const url = base + '?latitude=' + lat + '&longitude=' + lon +
                        '&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto' +
                        '&start_date=' + sDate + '&end_date=' + sDate;

            const res = await fetch( url );

            if( ! res.ok )
                return null;

            const data = await res.json();
            const dy   = data && data.daily;

            if( ! dy || ! dy.time || ! dy.time.length )
                return null;

            const tmax = dy.temperature_2m_max ? dy.temperature_2m_max[ 0 ] : null;
            const tmin = dy.temperature_2m_min ? dy.temperature_2m_min[ 0 ] : null;
            const code = dy.weathercode         ? dy.weathercode[ 0 ]         : null;

            if( tmax == null && tmin == null )
                return null;

            return { tmin: tmin, tmax: tmax, bucket: wxBucket( code ) };
        }

        //------------------------------------------------------------------------//
        // DATE / TIME / TEXT HELPERS

        // Dates are stored and shown as ANSI yyyy-mm-dd.
        function fmtDate( sIso ) { return sIso; }
        function fmtRange( sStart, sEnd ) { return sStart + ' – ' + sEnd; }

        // Combines a date and an optional time into one lexicographically comparable key, so
        // a stage's end can be checked against its start even when only the date differs.
        function stageDateTimeKey( sDate, sTime ) { return sDate + 'T' + (sTime || '00:00'); }

        function newId() { return Date.now() + Math.floor( Math.random() * 1000 ); }
        function round2( n ) { return Math.round( n * 100 ) / 100; }
        function slugify( s ) { return (s || '').toLowerCase().trim().replace( /[^a-z0-9]+/g, '-' ).replace( /^-+|-+$/g, '' ) || 'item'; }

        // A safe, in-folder file name for an UPLOADED document: the original base name
        // slugified, its real extension kept, and a "-2", "-3"... suffix if another doc in
        // the same list already claims it (so two uploads never overwrite each other).
        function uniqueFileName( sOriginalName, aSiblingDocs )
        {
            const dot  = sOriginalName.lastIndexOf( '.' );
            const ext  = (dot > 0 ? sOriginalName.slice( dot + 1 ) : '').toLowerCase().replace( /[^a-z0-9]/g, '' );
            const base = slugify( dot > 0 ? sOriginalName.slice( 0, dot ) : sOriginalName );
            const make = function( n ) { return base + (n > 1 ? '-' + n : '') + (ext ? '.' + ext : ''); };
            const taken = new Set( (aSiblingDocs || []).map( function( d ) { return d.file; } ).filter( Boolean ) );

            let n = 1;
            while( taken.has( make( n ) ) ) n++;
            return make( n );
        }

        // Base name only ("destination-year") - resolveNewTripDirName() adds a "-2", "-3"...
        // suffix on collision at creation time; an already-saved trip's real folder is
        // trip.dirName, never this recomputed straight from its (possibly since-edited) fields.
        function dirNameFor( sDestination, sStartDate ) { return slugify( sDestination ) + '-' + (sStartDate ? sStartDate.slice( 0, 4 ) : 'new'); }

        // Where a document's bytes live, and the URL that serves them. A document is one of:
        //   kind 'link'   -> doc.path points straight into the user's files/ tree (not copied)
        //   kind 'upload' -> doc.file sits inside this trip's own folder
        //   (legacy, no kind) -> treated as an upload at "<slug(name)>.pdf", the old scheme
        // A trip's own folder. Ours live under data/trips/<dirName>; one another
        // user shared with us is reached through its "shared/<slug>" path instead
        // (see tripBase(), set when the trip is loaded).
        function docPath( base, doc )
        {
            if( doc && doc.kind === 'link' && doc.path ) return sharedRef( base, doc.path );
            const file = (doc && doc.file) || ( slugify( doc && doc.name ) + '.pdf' );
            return base + '/' + file;
        }

        // A trip somebody shared with us also lends the files it POINTS at outside
        // its own folder — its linked documents and its photo folder. They are ours
        // to read through "shared/<slug>/~/<the owner's path>" (lib/shares.py
        // extra_path). On one of our own trips the path is already ours: unchanged.
        function sharedRef( base, ownerPath )
        {
            return String( base || '' ).indexOf( 'shared/' ) === 0
                 ? base + '/~/' + String( ownerPath || '' ).replace( /^\/+/, '' )
                 : ownerPath;
        }
        function tripBase( trip )  { return trip && trip._base ? trip._base : 'data/trips/' + (trip && trip.dirName); }
        function tripIsRO( trip )  { return !! ( trip && trip._ro ); }
        function docHref( trip, doc )    { return GumApi.fileUrl( docPath( tripBase( trip ), doc ) ); }
        function docIsLink( doc )   { return doc && doc.kind === 'link'; }
        function docHasFile( doc )  { return !!( (doc && doc.kind === 'link' && doc.path) || (doc && doc.file) || (doc && doc._pending) ); }

        function viewerTz() { return NayiveUI.viewerTz(); }   // impl in shared/ui.js
        function localTimeIn( sTz )
        {
            try { return new Intl.DateTimeFormat( 'en-GB', { timeZone: sTz, hour: '2-digit', minute: '2-digit', hour12: false } ).format( new Date() ); }
            catch( _ ) { return '--:--'; }
        }

        function findTrip( id ) { return trips.find( function( t ) { return t.id === id; } ); }

        function todayIso()
        {
            const d = new Date();
            return d.getFullYear() + '-' + String( d.getMonth() + 1 ).padStart( 2, '0' ) + '-' + String( d.getDate() ).padStart( 2, '0' );
        }

        function addDaysIso( sIso, n )
        {
            const d = new Date( sIso + 'T00:00:00' );
            d.setDate( d.getDate() + n );
            return d.getFullYear() + '-' + String( d.getMonth() + 1 ).padStart( 2, '0' ) + '-' + String( d.getDate() ).padStart( 2, '0' );
        }

        //------------------------------------------------------------------------//
        // INITIALIZATION

        NayiveI18n.ready.then( function()
        {
            API_FILES = GumApi.API_FILES;
            store     = NayiveStore.createStore( { apiBase: API_FILES } );

            document.addEventListener( 'keydown', function( e )
            {
                if( e.key !== 'Escape' ) return;

                if(      document.getElementById( 'confirmSheetBackdrop'   ).classList.contains( 'open' ) ) closeConfirm();
                else if( document.getElementById( 'filePickerSheetBackdrop' ).classList.contains( 'open' ) ) closeFilePicker();
                else if( document.getElementById( 'stageSheetBackdrop'    ).classList.contains( 'open' ) ) closeStageSheet();
                else if( document.getElementById( 'tripSheetBackdrop'     ).classList.contains( 'open' ) ) closeTripSheet();
                else if( document.getElementById( 'mapSheetBackdrop'      ).classList.contains( 'open' ) ) closeSheet( 'mapSheetBackdrop' );
                else if( document.getElementById( 'currencySheetBackdrop' ).classList.contains( 'open' ) ) closeSheet( 'currencySheetBackdrop' );
            });

            // Crossing the 920px breakpoint toggles whether the route panel is visible at all
            // (see renderRoutePanel()) - re-render on the transition so resizing/rotating into
            // "wide" while a trip is open builds the live map instead of leaving it blank.
            wideMql.addEventListener( 'change', function() { if( view === 'detail' ) renderRoutePanel(); } );

            // The store's state machine drives the header plug for every read and write.
            store.onState( setSyncStatus );

            // The plug's click and the focus / visibilitychange re-reads, all on ONE guarded
            // path (shared/ui.js). Never while a sheet is open. The AUTOMATIC paths also stay
            // on the trip list: loadTrips() ends in renderAll(), which from the detail screen
            // tears down the open trip and its live Leaflet map - the same reason
            // refreshLiveClocks() leaves the route panel alone. A deliberate tap on the plug
            // ("plug") is different: it happens because the user WANTS fresh data, so it is
            // allowed from either screen.
            refresher = NayiveUI.wireRefresh(
            {
                store: store,
                read:  loadTrips,
                guard: function( force, why ) { return anySheetOpen() || ( why !== 'plug' && view !== 'list' ); }
            } );

            // A stage weather lookup that failed while offline is cached as "no data";
            // drop that cache on reconnect so the forecast fills in on the next render.
            window.addEventListener( 'online', function()
            {
                weatherCache.clear();
                if( view === 'detail' && ! anySheetOpen() ) renderContent();
            });

            clockTimer = setInterval( refreshLiveClocks, 30000 );

            // Background tabs get their timers throttled (sometimes to once a minute or less),
            // so the 30s interval alone can leave a stale time on screen for a while after the
            // user switches back. Force an immediate refresh the moment the tab becomes visible.
            // (The trip list's own re-read is wireRefresh's job, above.)
            document.addEventListener( 'visibilitychange', function()
            {
                if( document.visibilityState === 'visible' ) refreshLiveClocks();
            });

            // Probe the API, then load. On a failed probe the shared helper bounces to the
            // sign-in page only when we are really online with nothing cached; otherwise it
            // opens on the local cache and the store syncs once the connection is back.
            NayiveUI.bootWithStore( store, loadTrips );
        });

        function refreshLiveClocks()
        {
            // Only the open trip-detail screen shows live clocks / "you're here" state, and it
            // has no persistent focused input, so a full refresh here never steals keyboard focus
            // the way refreshing an open sheet's form mid-edit would. The route panel is
            // deliberately NOT rebuilt here: it shows no time-dependent content, and tearing down
            // a live Leaflet map + re-fetching its tiles every 30s would just flicker for nothing.
            if( view === 'detail' && ! anySheetOpen() )
            {
                renderContent();
                if( ! viewerPos || Date.now() - viewerPos.at > VIEWER_POS_MAX_AGE ) refreshViewerPos( false );
            }
        }

        // WHERE THE VIEWER IS - the device's own position, for the "you are here" badge.
        // A time zone is far too coarse for that (Madrid, Málaga and Marbella share one),
        // so a stage counts only when it is the CLOSEST located stage and within
        // HERE_RADIUS_KM. No position (refused, unknown, not asked yet) -> no badge.
        const HERE_RADIUS_KM     = 30;
        const VIEWER_POS_MAX_AGE = 5 * 60 * 1000;
        let viewerPos = null;   // { lat, lon, at } from the last fix

        function stageHasCoords( st ) { return stageEnabled( st ) && typeof st.lat === 'number' && typeof st.lon === 'number'; }

        // Reads the device position. Only a real tap (opening a trip) may raise the
        // browser's permission prompt - bMayPrompt; every other caller reads it quietly,
        // and only if permission was already granted. A trip with no located stage
        // never asks at all.
        function refreshViewerPos( bMayPrompt )
        {
            const trip = findTrip( selectedTripId );
            if( ! navigator.geolocation || ! trip || ! trip.stages.some( stageHasCoords ) ) return;

            function locate()
            {
                navigator.geolocation.getCurrentPosition(
                    function( pos )
                    {
                        viewerPos = { lat: pos.coords.latitude, lon: pos.coords.longitude, at: Date.now() };
                        if( view === 'detail' && ! anySheetOpen() ) renderContent();
                    },
                    function( err )
                    {
                        // Refused -> forget the old fix; merely unknown / slow -> keep it.
                        if( err.code === 1 && viewerPos ) { viewerPos = null; if( view === 'detail' && ! anySheetOpen() ) renderContent(); }
                    },
                    { enableHighAccuracy: false, timeout: 10000, maximumAge: VIEWER_POS_MAX_AGE } );
            }

            if( bMayPrompt ) { locate(); return; }
            if( ! navigator.permissions || ! navigator.permissions.query ) return;

            navigator.permissions.query( { name: 'geolocation' } )
                .then( function( p ) { if( p.state === 'granted' ) locate(); } )
                .catch( function() { /* browser without the geolocation permission name */ } );
        }

        // Great-circle distance (haversine), km.
        function distanceKm( lat1, lon1, lat2, lon2 )
        {
            const rad = Math.PI / 180;
            const a   = Math.pow( Math.sin( ( lat2 - lat1 ) * rad / 2 ), 2 )
                      + Math.cos( lat1 * rad ) * Math.cos( lat2 * rad ) * Math.pow( Math.sin( ( lon2 - lon1 ) * rad / 2 ), 2 );
            return 12742 * Math.asin( Math.sqrt( a ) );   // 12742 = Earth's diameter in km
        }

        // The id of the one stage the viewer is at, or null.
        function hereStageId( trip )
        {
            if( ! viewerPos ) return null;

            let best = null, bestKm = HERE_RADIUS_KM;
            trip.stages.filter( stageHasCoords ).forEach( function( st )
            {
                const km = distanceKm( viewerPos.lat, viewerPos.lon, st.lat, st.lon );
                if( km <= bestKm ) { best = st.id; bestKm = km; }
            });
            return best;
        }

        function anySheetOpen()
        {
            return ['tripSheetBackdrop', 'stageSheetBackdrop', 'mapSheetBackdrop', 'currencySheetBackdrop', 'filePickerSheetBackdrop', 'confirmSheetBackdrop']
                .some( function( id ) { return document.getElementById( id ).classList.contains( 'open' ); } );
        }

        //------------------------------------------------------------------------//
        // PERSISTENCE - each trip is its own directory under data/trips/ (data/trips/{dirName}/trip.json),
        // per explicit requirement: "each travel and all its associated files exist inside its
        // own dir". The file API has no "list a folder" call, only "GET the whole file tree",
        // so that's what discovers which trip directories exist on load. dirName is assigned
        // ONCE at creation (see resolveNewTripDirName) and stored on the trip itself - it is
        // NEVER recomputed from destination/date later, because collision-avoidance numbering
        // (japan-2026, japan-2026-2, ...) depends on what else exists at creation time, and
        // silently recomputing it later could point at the wrong folder.

        async function loadTrips()
        {
            // Which trip.json files to load. Online: the server's file tree. Offline
            // (or if that call fails): every trip.json the store already has cached.
            let paths = null;

            if( navigator.onLine )
            {
                try
                {
                    // Just the data/trips subtree (one call), never the whole
                    // account tree - that walked every photo folder too.
                    const tripAppNode = await GumApi.listDirRecursive( 'data/trips' );
                    const tripDirs = (tripAppNode.nodes || []).filter( function( n ) { return Array.isArray( n.nodes ); } );

                    paths = tripDirs
                        .filter( function( dn ) { return (dn.nodes || []).some( function( n ) { return n.path === dn.path + '/trip.json'; } ); } )
                        .map( function( dn ) { return dn.path + '/trip.json'; } );
                }
                catch( err )
                {
                    // No data/trips folder yet (a fresh account) = no trips, not
                    // "offline": don't fall back to the cache in that case.
                    paths = String( err && err.message ).indexOf( 'HTTP 404' ) !== -1 ? [] : null;
                }

                // Trips other people shared with us. They live in THEIR home and we
                // only ever read them (lib/shares.py + resolve_path). Outside the
                // try above on purpose: someone with no trips of their own takes
                // the 404 branch, and must still see what was shared with them.
                if( paths !== null ) paths = paths.concat( await sharedTripPaths() );
            }

            if( paths === null )
            {
                const cached = await store.listCached( 'data/trips/' );
                paths = cached.filter( function( p ) { return /\/trip\.json$/.test( p ); } );
            }

            const loaded = [];

            for( const path of paths )
            {
                const res = await store.read( path );

                if( res.body )
                {
                    try
                    {
                        const t = JSON.parse( res.body );
                        // Where this trip's documents live, and whether it is ours
                        // to change. A "shared/..." path is someone else's trip.
                        t._base = path.replace( /\/trip\.json$/, '' );
                        t._ro   = t._base.indexOf( 'shared/' ) === 0;
                        loaded.push( t );
                    }
                    catch( _ ) { /* one unreadable/corrupt trip.json must not take down the list */ }
                }
            }

            trips = loaded;
            applyOpenParam();

            if( paths.length === 0 )                 // nothing to read -> the store never emitted
                setSyncStatus( navigator.onLine ? 'synced' : 'offline' );

            renderAll();
            syncActiveTripDocs();   // background: keep only the current/next trip's PDFs on the device
        }

        /* Deep link: ?open=<trip folder> lands straight on that trip's detail
         * screen. Drive's "Compartido conmigo" uses it to open a shared trip
         * ("shared/<slug>"), but any trip folder works. Applied ONCE, right after
         * the first load: a later reload must not drag the user back here, and an
         * unknown folder just leaves the list on screen. */
        const OPEN_PARAM = new URLSearchParams( location.search ).get( 'open' ) || '';
        let openParamUsed = false;

        function applyOpenParam()
        {
            if( openParamUsed || ! OPEN_PARAM ) return;
            openParamUsed = true;

            const t = trips.find( function( x ) { return tripBase( x ) === OPEN_PARAM; } );
            if( t ) { selectedTripId = t.id; view = 'detail'; refreshViewerPos( false ); }   // no tap here: never prompt
        }

        /* Every trip.json another user shared with us: "shared/<slug>/trip.json".
         * A share is a row on the server (GET /api/shares); a failure here just
