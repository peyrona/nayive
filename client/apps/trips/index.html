            {
                // Same folder picker Photos / Music / Movies use (NayiveUI.pickFolder),
                // not the old files/ tree sheet - don't reinvent the wheel.
                NayiveUI.pickFolder( { title: T( 'trips.pickPhotoFolderNote' ) } ).then( function( sPath )
                {
                    if( ! sPath ) return;
                    mutateTrip( selectedTripId, function( t ) { return { ...t, photosDir: sPath }; } );
                });
            });
            row.appendChild( btn );

            if( dir )
            {
                const clearBtn = document.createElement( 'button' );
                clearBtn.className = 'icon-btn';
                clearBtn.title = T( 'trips.clearPhotoFolder' );
                clearBtn.appendChild( svgIcon( ICON_X, 15 ) );
                clearBtn.addEventListener( 'click', function()
                {
                    mutateTrip( selectedTripId, function( t ) { const u = { ...t }; delete u.photosDir; return u; } );
                });
                row.appendChild( clearBtn );
            }

            return row;
        }

        const collapsedSections = (function()
        {
            try { return JSON.parse( localStorage.getItem( 'trip-collapsed' ) || '{}' ); }
            catch( e ) { return {}; }
        })();

        function saveCollapsedSections()
        {
            try { localStorage.setItem( 'trip-collapsed', JSON.stringify( collapsedSections ) ); }
            catch( e ) {}
        }

        // Unfold a section (e.g. "Documentos" after a document was added, so the user
        // sees it there). Call before the redraw.
        function expandSection( sKey )
        {
            if( ! collapsedSections[ sKey ] ) return;
            collapsedSections[ sKey ] = false;
            saveCollapsedSections();
        }

        // A "Documentos" / "Itinerario" block: a heading that folds the body away, and -
        // like the "Fotos" row above them - room for one or two controls after the label.
        // `aControls` are appended NEXT TO the heading, not inside it: the heading is
        // itself a <button> and a button may not contain another one.
        function collapsibleSection( sText, bFirst, sKey, aControls )
        {
            const el = document.createElement( 'div' );
            el.className = 'detail-section';

            const row = document.createElement( 'div' );
            row.className = 'detail-heading-row' + (bFirst ? ' first' : '');

            const head = document.createElement( 'button' );
            head.type = 'button';
            head.className = 'detail-heading collapsible';
            head.appendChild( svgIcon( ICON_CHEVRON_DOWN, 16, 'sec-chevron' ) );
            head.appendChild( document.createTextNode( sText ) );
            row.appendChild( head );

            ( aControls || [] ).forEach( function( c ) { if( c ) row.appendChild( c ); } );

            const body = document.createElement( 'div' );
            body.className = 'section-body';

            let bCollapsed = !! collapsedSections[ sKey ];

            function apply()
            {
                el.classList.toggle( 'collapsed', bCollapsed );
                body.hidden = bCollapsed;
                head.setAttribute( 'aria-expanded', String( ! bCollapsed ) );
            }

            head.addEventListener( 'click', function()
            {
                bCollapsed = ! bCollapsed;
                collapsedSections[ sKey ] = bCollapsed;
                saveCollapsedSections();
                apply();
            });

            apply();
            el.appendChild( row );
            el.appendChild( body );
            return { el: el, body: body };
        }

        // A heading control, styled like the folder button on the "Fotos" row.
        function headingBtn( sTitle, sIcon, fnClick )
        {
            const b = document.createElement( 'button' );
            b.type = 'button';
            b.className = 'icon-btn';
            b.title = sTitle;
            b.setAttribute( 'aria-label', sTitle );
            b.appendChild( svgIcon( sIcon, 15 ) );
            b.addEventListener( 'click', fnClick );
            return b;
        }

        function emptyNote( sText )
        {
            const el = document.createElement( 'div' );
            el.className = 'empty-note';
            el.textContent = sText;
            return el;
        }

        // `fnDelete( doc )`, when given (and the trip is ours), adds a trash button at the
        // right end of every row.
        function buildFileList( trip, docs, fnDelete )
        {
            const list = document.createElement( 'div' );
            list.className = 'file-list';
            const canDelete = !! fnDelete && ! tripIsRO( trip );

            docs.forEach( function( d )
            {
                const has = docHasFile( d );
                const row = document.createElement( has && ! canDelete ? 'a' : 'div' );
                row.className = 'file-row';

                // With a delete button the link is an inner element, so the button is not inside it.
                const link = canDelete ? document.createElement( has ? 'a' : 'span' ) : row;
                if( canDelete )
                {
                    link.className = 'file-open';
                    row.appendChild( link );
                }

                if( has )
                {
                    link.href = docHref( trip, d );
                    link.target = '_blank';
                    link.rel = 'noopener';
                }

                const iconWrap = document.createElement( 'span' );
                iconWrap.className = 'file-icon';
                iconWrap.appendChild( svgIcon( docIsLink( d ) ? ICON_LINK : DOC_ICONS[ docTypeBucket( d.type ) ], 16 ) );
                link.appendChild( iconWrap );

                // One line: the file itself (with its extension), or "no attachment".
                const name = document.createElement( 'span' );
                name.className = 'file-name';
                name.textContent = ! has          ? T( 'trips.noAttachment' )
                                 : docIsLink( d ) ? d.path
                                 : ( d.file || docPath( tripBase( trip ), d ) );
                if( docIsLink( d ) )
                    link.title = tripIsRO( trip )
                               ? TF( 'trips.linkedFromOwner', { who: sharedBy( trip ) || T( 'trips.whoShares' ) } )
                               : T( 'trips.linkedFromFiles' );
                link.appendChild( name );

                if( canDelete )
                {
                    const delBtn = document.createElement( 'button' );
                    delBtn.className = 'icon-btn sm danger file-del';
                    delBtn.title = T( 'trips.deleteDoc' );
                    delBtn.appendChild( svgIcon( ICON_TRASH, 15 ) );
                    delBtn.addEventListener( 'click', function()
                    {
                        openConfirm( T( 'trips.deleteDoc' ), TF( 'trips.deleteStageBody', { name: name.textContent } ),
                                     NayiveUI.t( 'ui.delete' ), function() { fnDelete( d ); } );
                    });
                    row.appendChild( delBtn );
                }

                list.appendChild( row );
            });

            return list;
        }

        function docTypeBucket( sType )
        {
            if( sType === 'passport' ) return 'passport';
            if( sType === 'visa' )     return 'visa';
            if( sType === 'ticket' || sType === 'hotel' ) return 'booking';
            return 'other';
        }

        function buildStageItem( trip, st, sViewerTz, bIsLast, hereId )
        {
            const isHere  = hereId != null && st.id === hereId;
            const enabled = stageEnabled( st );

            const item = document.createElement( 'div' );
            item.className = 'stage-item' + (enabled ? '' : ' disabled');
            item.dataset.stageId = st.id;

            const node = document.createElement( 'div' );
            node.className = 'stage-node' + (isHere ? ' here' : '');
            // The node icon is this stage's onward transport (matches the map leg leaving it);
            // the final stage has no onward journey, so it shows a location pin instead.
            node.appendChild( svgIcon( bIsLast ? ICON_PIN : ( TRANSPORT_ICONS[ st.transport ] || TRANSPORT_ICONS.other ), 17 ) );
            item.appendChild( node );

            const card = document.createElement( 'div' );
            card.className = 'stage-card' + (isHere ? ' here' : '') + (enabled ? '' : ' disabled');

            const top = document.createElement( 'div' );
            top.className = 'stage-top';

            // Drag handle - grab it to reorder the stage within the itinerary. Shown on
            // every card, including a disabled (collapsed) one, so any stage can be moved.
            if( ! tripIsRO( trip ) )
            {
                const grip = document.createElement( 'span' );
                grip.className = 'stage-drag';
                grip.title = T( 'trips.dragToReorder' );
                grip.innerHTML = GRIP_SVG;
                grip.addEventListener( 'pointerdown', function( e ) { onStageDragStart( e, st.id ); } );
                top.appendChild( grip );
            }

            const loc = document.createElement( 'span' );
            loc.className = 'stage-loc' + (enabled ? '' : ' disabled');
            loc.textContent = st.location;
            top.appendChild( loc );

            // Only show the destination clock when its wall time differs from the viewer's
            // own local time (same offset -> no point repeating what the device clock says).
            const stageTime = st.tz ? localTimeIn( st.tz ) : '';
            if( enabled && stageTime && stageTime !== localTimeIn( sViewerTz ) )
            {
                const clock = document.createElement( 'span' );
                clock.className = 'stage-clock';
                clock.title = T( 'trips.localTimeNow' );
                clock.appendChild( svgIcon( ICON_CLOCK, 12 ) );
                clock.appendChild( document.createTextNode( ' ' + stageTime ) );
                top.appendChild( clock );
            }

            if( isHere && enabled )
            {
                const badge = document.createElement( 'span' );
                badge.className = 'here-badge';
                badge.appendChild( svgIcon( ICON_PIN, 11 ) );
                badge.appendChild( document.createTextNode( ' ' + T( 'trips.youAreHere' ) ) );
                top.appendChild( badge );
            }

            const actions = document.createElement( 'div' );
            actions.className = 'stage-actions';

            const editBtn = document.createElement( 'button' );
            editBtn.className = 'icon-btn';
            editBtn.title = T( 'trips.editStage' );
            editBtn.appendChild( svgIcon( ICON_PENCIL, 15 ) );
            editBtn.addEventListener( 'click', function() { openEditStage( st.id ); } );

            const delBtn = document.createElement( 'button' );
            delBtn.className = 'icon-btn danger';
            delBtn.title = T( 'trips.deleteStage' );
            delBtn.appendChild( svgIcon( ICON_TRASH, 15 ) );
            delBtn.addEventListener( 'click', function()
            {
                const label = ( st.location || '' ).trim() || T( 'trips.thisStage' );
                openConfirm( T( 'trips.deleteStage' ), TF( 'trips.deleteStageBody', { name: label } ), NayiveUI.t( 'ui.delete' ), function() { deleteStage( st.id ); } );
            });

            // The eye toggles this stage enabled/disabled - same control as a password field.
            const eyeBtn = document.createElement( 'button' );
            eyeBtn.className = 'icon-btn';
            eyeBtn.title = enabled ? T( 'trips.disableStage' ) : T( 'trips.enableStage' );
            eyeBtn.appendChild( svgIcon( enabled ? ICON_EYE : ICON_EYE_OFF, 15 ) );
            eyeBtn.addEventListener( 'click', function() { toggleStage( st.id ); } );

            // Edit + delete + eye all live in the top row (reordering is the drag handle
            // before the title). A disabled stage collapses to just grip + title + eye.
            if( ! tripIsRO( trip ) )
            {
                if( enabled )
                {
                    actions.appendChild( editBtn );
                    actions.appendChild( delBtn );
                }
                actions.appendChild( eyeBtn );
            }
            top.appendChild( actions );

            card.appendChild( top );

            // Clicking anywhere on the card (except a link, a button or the drag handle)
            // opens the stage editor. Press-and-drag on the card body reorders instead
            // (onStageCardPointerDown) - and leaves a fresh stageDragEndedAt so the
            // click the browser fires after a drop doesn't also open the editor.
            card.addEventListener( 'pointerdown', function( e ) { onStageCardPointerDown( e, st.id, card ); } );

            // Pointing at a card draws the leg it departs on as a solid line, so you can see on
            // the map which hop of the trip the card is. Mouse only - a touch screen has no
            // hover, and below 920px there is no map beside the list anyway (it opens in a sheet).
            card.addEventListener( 'mouseenter', function()
            {
                if( hoveredStageId && hoveredStageId !== st.id ) setLegActive( hoveredStageId, false );

                hoveredStageId = st.id;
                setLegActive( st.id, true );
            });
            card.addEventListener( 'mouseleave', function()
            {
                if( hoveredStageId === st.id ) hoveredStageId = null;
                setLegActive( st.id, false );
            });
            card.addEventListener( 'click', function( e )
            {
                if( tripIsRO( trip ) ) return;                      // someone else's trip: look, don't touch
                if( e.target.closest( 'a, button, .stage-drag' ) ) return;
                if( Date.now() - stageDragEndedAt < 350 ) return;   // just finished a reorder drag, not a click
                openEditStage( st.id );
            });

            // A disabled stage shows nothing but grip + title + eye - no dates, weather,
            // accommodation, notes or documents.
            if( ! enabled )
            {
                item.appendChild( card );
                return item;
            }

            const dtRow = document.createElement( 'div' );
            dtRow.className = 'stage-row stage-daterow';
            dtRow.appendChild( svgIcon( ICON_CALENDAR, 14 ) );
            const dtText = document.createElement( 'span' );
            const startTxt = fmtDate( st.startDate ) + ( st.startTime ? ' ' + st.startTime : '' );
            const endTxt   = fmtDate( st.endDate )   + ( st.endTime   ? ' ' + st.endTime   : '' );
            dtText.textContent = fmtRange( startTxt, endTxt );   // one date-range format in the app
            dtRow.appendChild( dtText );

            const dtRight = document.createElement( 'div' );
            dtRight.className = 'stage-daterow-right';

            // The (optional) per-stage converter, then the weather.
            if( currencyPlacement( trip ) === 'stage' )
            {
                const cur     = stageCurrency( st );
                const stCalc  = document.createElement( 'button' );
                stCalc.className = 'icon-btn';
                stCalc.title  = TF( 'trips.fxTitleCode', { code: cur.code } );
                stCalc.appendChild( svgIcon( ICON_CALCULATOR, 15 ) );
                stCalc.addEventListener( 'click', function() { openCurrency( cur.code, cur.matched, st.location ); } );
                dtRight.appendChild( stCalc );
            }

            // Weather forecast for the stage's start date - min temp, glyph, max temp.
            const wx = document.createElement( 'div' );
            wx.className = 'stage-weather';
            dtRight.appendChild( wx );
            fillStageWeather( wx, st );

            dtRow.appendChild( dtRight );
            card.appendChild( dtRow );

            if( st.accommodation && st.accommodation.trim() )
            {
                const row = document.createElement( 'div' );
                row.className = 'stage-row';
                row.appendChild( svgIcon( ICON_PIN, 14 ) );
                const t2 = document.createElement( 'span' );
                t2.textContent = st.accommodation;
                row.appendChild( t2 );
                card.appendChild( row );
            }

            if( st.notes && st.notes.trim() )
            {
                const notes = document.createElement( 'div' );
                notes.className = 'stage-notes';
                notes.textContent = st.notes;
                card.appendChild( notes );
            }

            if( st.documents.length )
            {
                const docsWrap = document.createElement( 'div' );
                docsWrap.className = 'stage-docs';
                docsWrap.appendChild( buildFileList( trip, st.documents, function( d ) { deleteStageDoc( st.id, d ); } ) );
                card.appendChild( docsWrap );
            }

            item.appendChild( card );
            return item;
        }

        //------------------------------------------------------------------------//
        // RENDERING - TRIP SHEET

        let tripSheetBusy = false;

        function setTripSheetBusy( b )
        {
            tripSheetBusy = b;
            renderTripSheet();   // safe here: only ever called right after a Save click or its
                                  // failure, never mid-keystroke, so there is no focus to preserve
        }

        function renderTripSheet()
        {
            const sheet = document.getElementById( 'tripSheet' );
            sheet.innerHTML = '';

            const h2 = document.createElement( 'h2' );
            h2.textContent = isEditingTrip ? T( 'trips.editTrip' ) : T( 'trips.newTrip' );
            sheet.appendChild( h2 );

            if( tripSaveError )
            {
                const err = document.createElement( 'p' );
                err.className = 'calc-warn';
                err.textContent = tripSaveError;
                sheet.appendChild( err );
            }

            sheet.appendChild( textField( T( 'trips.destination' ), T( 'trips.destinationPh' ), tripDraft.destination, function( v ) { tripDraft.destination = v; refreshTripDocPaths(); } ) );

            const dateRow = document.createElement( 'div' );
            dateRow.className = 'field-row';
            dateRow.appendChild( dateField( T( 'trips.startDate' ), tripDraft.startDate, function( v ) { tripDraft.startDate = v; refreshTripDocPaths(); } ) );
            dateRow.appendChild( dateField( T( 'trips.endDate' ), tripDraft.endDate, function( v ) { tripDraft.endDate = v; } ) );
            sheet.appendChild( dateRow );

            // No "Documentos (i) [+]" heading here any more: the "+" and the info dot
            // live beside the "Documentos" heading on the trip detail screen, which is
            // also where this sheet is opened from. The rows stay - this is where a
            // document gets its name and its type.
            const docsField = document.createElement( 'div' );
            docsField.className = 'field';

            tripDraft.documents.forEach( function( d )
            {
                docsField.appendChild( buildDocRow( d, function( v ) { d.type = v; }, function() { removeTripDoc( d.id ); }, tripDraftDirNamePreview, renderTripSheet, function() { return tripDraft.documents; } ) );
            });

            sheet.appendChild( docsField );

            const actions = document.createElement( 'div' );
            actions.className = 'sheet-actions';

            if( isEditingTrip )
            {
                const delBtn = document.createElement( 'button' );
                delBtn.className = 'btn btn-danger sheet-actions-left';
                delBtn.title = T( 'trips.deleteTrip' );
                delBtn.disabled = tripSheetBusy;
                delBtn.appendChild( svgIcon( ICON_TRASH, 17 ) );
                delBtn.addEventListener( 'click', function()
                {
                    openConfirm( T( 'trips.deleteTrip' ), TF( 'trips.deleteTripBody', { name: tripDraft.destination } ), NayiveUI.t( 'ui.delete' ), deleteTrip );
                });
                actions.appendChild( delBtn );
            }

            const cancelBtn = document.createElement( 'button' );
            cancelBtn.className = 'btn btn-secondary';
            cancelBtn.title = NayiveUI.t( 'ui.cancel' );
            cancelBtn.disabled = tripSheetBusy;
            cancelBtn.appendChild( svgIcon( ICON_X, 17 ) );
            cancelBtn.addEventListener( 'click', closeTripSheet );

            const saveBtn = document.createElement( 'button' );
            saveBtn.className = 'btn btn-primary';
            saveBtn.title = tripSheetBusy ? T( 'ui.sync.saving' ) : T( 'ui.save' );
            saveBtn.disabled = tripSheetBusy;
            saveBtn.appendChild( svgIcon( ICON_CHECK, 18 ) );
            saveBtn.addEventListener( 'click', saveTrip );

            actions.appendChild( cancelBtn );
            actions.appendChild( saveBtn );
            sheet.appendChild( actions );
        }

        // Updates the visible "will be stored at ..." preview under each UPLOAD document row
        // as the user types the destination/start date (a new trip's folder name shifts with
        // it), without rebuilding the sheet - that would drop the focused input's cursor.
        // Only upload rows have a .doc-row-path element; it carries data-doc-id so a link row
        // between two uploads doesn't throw off the matching.
        function refreshTripDocPaths()
        {
            const dirName = tripDraftDirNamePreview();

            tripDraft.documents.forEach( function( d )
            {
                const el = document.querySelector( '#tripSheet .doc-row-path[data-doc-id="' + d.id + '"]' );
                if( el ) el.textContent = docPath( 'data/trips/' + dirName, d );
            });
        }

        //------------------------------------------------------------------------//
        // RENDERING - STAGE SHEET

        // Debounced timezone auto-detection: fires ~600ms after typing stops in the Location
        // field, so a live geocoding lookup isn't fired on every keystroke. stageTzLookupSeq
        // guards against a slower, earlier lookup overwriting a faster, later one.
        let stageTzDebounceTimer = null;
        let stageTzLookupSeq     = 0;

        // Never call renderStageSheet() from these - they fire on every keystroke in Location
        // (via the debounce below) and rebuilding the whole sheet would drop that input's focus
        // mid-keystroke, same issue as the destination/document-name fields. They only ever
        // touch the #stageTzStatus element directly.
        function scheduleStageTzLookup()
        {
            clearTimeout( stageTzDebounceTimer );

            const loc = stageDraft.location.trim();

            if( ! loc )
            {
                stageDraft.tz = null;
                stageDraft.tzLabel = '';
                stageDraft.tzStatus = 'idle';
                stageDraft.lat = null;
                stageDraft.lon = null;
                refreshTzStatusDisplay();
                return;
            }

            stageDraft.tzStatus = 'loading';
            refreshTzStatusDisplay();

            stageTzDebounceTimer = setTimeout( runStageTzLookup, 600 );
        }

        async function runStageTzLookup()
        {
            const loc    = stageDraft.location.trim();
            const mySeq  = ++stageTzLookupSeq;
            const result = await geocodeLocation( loc );

            if( mySeq !== stageTzLookupSeq || ! stageDraft )
                return;   // superseded by a newer lookup, or the sheet was closed meanwhile

            if( result && result.unreachable )
            {
                // Offline / service down: keep whatever tz the stage already had,
                // don't wipe it to "not-found".
                stageDraft.tzStatus = 'offline';
            }
            else if( result )
            {
                stageDraft.tz = result.timezone;
                stageDraft.tzLabel = result.label;
                stageDraft.tzStatus = 'found';
                stageDraft.lat = result.lat;
                stageDraft.lon = result.lon;
            }
            else
            {
                stageDraft.tz = null;
                stageDraft.tzLabel = '';
                stageDraft.tzStatus = 'not-found';
                stageDraft.lat = null;
                stageDraft.lon = null;
            }

            refreshTzStatusDisplay();
        }

        function tzStatusText()
        {
            if( stageDraft.tzStatus === 'found' )
                return stageDraft.tz + ' (' + stageDraft.tzLabel + ')';

            if( stageDraft.tzStatus === 'loading' )
                return TF( 'trips.tzLooking', { place: stageDraft.location.trim() } );

            if( stageDraft.tzStatus === 'offline' )
                return TF( 'trips.tzOffline', { place: stageDraft.location.trim() } );

            if( stageDraft.tzStatus === 'not-found' )
                return TF( 'trips.tzFailed', { place: stageDraft.location.trim() } );

            return T( 'trips.typeLocationForTz' );
        }

        function refreshTzStatusDisplay()
        {
            const el = document.getElementById( 'stageTzStatus' );

            if( el )
                el.textContent = tzStatusText();
        }

        // One compact line: "Zona horaria: <status>" - kept out of a .field row so the
        // dialog stays as short as possible.
        function buildTzStatusField()
        {
            const p = document.createElement( 'p' );
            p.className = 'tz-status tz-inline';

            const label = document.createElement( 'span' );
            label.className = 'tz-inline-label';
            label.textContent = T( 'trips.timezone' ) + ': ';

            const status = document.createElement( 'span' );
            status.id = 'stageTzStatus';
            status.textContent = tzStatusText();

            p.appendChild( label );
            p.appendChild( status );
            return p;
        }

        function renderStageSheet()
        {
            const sheet = document.getElementById( 'stageSheet' );
            sheet.innerHTML = '';

            const h2 = document.createElement( 'h2' );
            h2.textContent = editingStageId ? T( 'trips.editStage' ) : T( 'trips.addStage' );
            sheet.appendChild( h2 );

            if( stageSaveError )
            {
                const err = document.createElement( 'p' );
                err.className = 'calc-warn';
                err.textContent = stageSaveError;
                sheet.appendChild( err );
            }

            const docRows = stageDraft.documents.map( function( d )
            {
                return buildDocRow( d, function( v ) { d.type = v; }, function() { removeStageDoc( d.id ); }, function() { return dirName; }, renderStageSheet, function() { return stageDraft.documents; } );

            if( docRows.length >= 1 )

                delBtn.addEventListener( 'click', function()

                    openConfirm( T( 'trips.deleteStage' ), TF( 'trips.deleteStageBody', { name: label } ), NayiveUI.t( 'ui.delete' ), deleteStageFromSheet );

        //------------------------------------------------------------------------//
        // FORM FIELD BUILDERS

        function textField( sLabel, sPlaceholder, sValue, fnOnChange )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';
            const label = document.createElement( 'label' );
            label.textContent = sLabel;
            const input = document.createElement( 'input' );
            input.type = 'text';
            input.placeholder = sPlaceholder;
            input.value = sValue;
            input.addEventListener( 'input', function() { fnOnChange( input.value ); } );
            field.appendChild( label );
            field.appendChild( input );
            return field;
        }

        function textAreaField( sLabel, sPlaceholder, sValue, fnOnChange, nRows )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';
            const label = document.createElement( 'label' );
            label.textContent = sLabel;
            const ta = document.createElement( 'textarea' );
            ta.placeholder = sPlaceholder;
            ta.value = sValue;
            if( nRows ) ta.rows = nRows;
            ta.addEventListener( 'input', function() { fnOnChange( ta.value ); } );
            field.appendChild( label );
            field.appendChild( ta );
            return field;
        }

        // "Ubicación": the text input carries an in-field "locate on the map" button on its
        // right edge (hidden below the route-panel breakpoint, where no map is shown); after
        // it, a round button that opens the Calendar app on this stage's start date.
        function locationField( sLabel, sPlaceholder, sValue, fnOnChange )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';
            const label = document.createElement( 'label' );
            label.textContent = sLabel;

            const row = document.createElement( 'div' );
            row.className = 'loc-row';

            const inputWrap = document.createElement( 'div' );
            inputWrap.className = 'loc-input-wrap';

            const input = document.createElement( 'input' );
            input.type = 'text';
            input.placeholder = sPlaceholder;
            input.value = sValue;
            input.addEventListener( 'input', function() { fnOnChange( input.value ); } );

            const mapBtn = document.createElement( 'button' );
            mapBtn.type = 'button';
            mapBtn.className = 'icon-btn sm loc-map-btn';
            mapBtn.title = T( 'trips.seeOnMap' );
            mapBtn.appendChild( svgIcon( ICON_MAP, 15 ) );
            mapBtn.addEventListener( 'click', function()
            {
                if( ! wideMql.matches )
                    return;   // no route map at this size (button is CSS-hidden too)

                const lat   = stageDraft && stageDraft.lat;
                const lon   = stageDraft && stageDraft.lon;
                const label = (stageDraft && stageDraft.location || '').trim() || T( 'trips.stage' );

                if( typeof lat !== 'number' || typeof lon !== 'number' )
                {
                    NayiveUI.toast( T( 'trips.notLocated' ) );
                    return;
                }

                // Close the dialog so the map is fully visible, then fly to the city.
                closeStageSheet();
                highlightStageOnMap( lat, lon, label );
            });

            inputWrap.appendChild( input );
            inputWrap.appendChild( mapBtn );

            const calBtn = document.createElement( 'button' );
            calBtn.type = 'button';
            calBtn.className = 'icon-btn';

            calBtn.appendChild( svgIcon( ICON_CALENDAR, 16 ) );
            calBtn.addEventListener( 'click', function()
            {
                const d = (stageDraft && stageDraft.startDate || '').trim();
                window.open( '../calendar/' + (d ? '?date=' + encodeURIComponent( d ) : ''), '_blank', 'noopener' );
            });

            row.appendChild( inputWrap );
            row.appendChild( calBtn );
            field.appendChild( label );
            field.appendChild( row );

        }

        function dateField( sLabel, sValue, fnOnChange )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';
            const label = document.createElement( 'label' );
            label.textContent = sLabel;
            const dt = document.createElement( 'div' );

            const input = document.createElement( 'input' );

            input.addEventListener( 'input', function()
            {
                fnOnChange( input.value );
                display.textContent = input.value || T( 'ui.dateHint' );
                display.classList.toggle( 'placeholder', ! input.value );
            });
            dt.appendChild( input );
            dt.appendChild( display );
            field.appendChild( label );
            field.appendChild( dt );
            return field;
        }

        function timeField( sLabel, sValue, fnOnChange )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';
            const label = document.createElement( 'label' );
            label.textContent = sLabel;
            const dt = document.createElement( 'div' );
            dt.className = 'dt-field';
            const input = document.createElement( 'input' );
            input.type = 'time';
            input.value = sValue;
            const display = document.createElement( 'span' );

            input.addEventListener( 'input', function()
            {
                fnOnChange( input.value );
                display.textContent = input.value || 'hh:mm';

            });
            dt.appendChild( input );
            dt.appendChild( display );
            field.appendChild( label );
            field.appendChild( dt );
            return field;
        }

        function selectField( sLabel, sValue, aOptions, fnOnChange )
        {
            const field = document.createElement( 'div' );
            field.className = 'field';
            const label = document.createElement( 'label' );
            label.textContent = sLabel;
            const select = document.createElement( 'select' );
            aOptions.forEach( function( opt )
            {
                const o = document.createElement( 'option' );
                o.value = opt[0];
                o.textContent = opt[1];
                if( opt[0] === sValue ) o.selected = true;
                select.appendChild( o );
            });
            select.addEventListener( 'change', function() { fnOnChange( select.value ); } );
            field.appendChild( label );
            field.appendChild( select );
            return field;
        }

        // One document editor row: [type ▼] [attachment] [x]. There is no free-text name
        // any more - the document's name is just its file's name (set on attach). The
        // attachment sits where the name field used to be: when set it's a pill showing the
        // path (click it to open the file in a new tab); when unset it's the link / upload
        // buttons. To point a document at a different file you remove it and add a new one.
        //   fnDirName  - resolver for the trip folder name (a new trip's shifts while typing)
        //   fnRerender - redraw the whole sheet after the attachment changes
        //   fnSiblings - the sibling document list (for unique upload file names)
        function buildDocRow( d, fnSetType, fnRemove, fnDirName, fnRerender, fnSiblings )
        {
            const wrap = document.createElement( 'div' );

            const row = document.createElement( 'div' );
            row.className = 'doc-row';

            const typeSelect = document.createElement( 'select' );
            [ ['passport',T( 'trips.docPassport' )], ['visa',T( 'trips.docVisa' )], ['ticket',T( 'trips.docTicket' )], ['hotel',T( 'trips.docHotel' )], ['other',T( 'trips.trOther' )] ].forEach( function( opt )
            {
                const o = document.createElement( 'option' );
                o.value = opt[0];
                o.textContent = opt[1];
                if( opt[0] === d.type ) o.selected = true;
                typeSelect.appendChild( o );
            });
            typeSelect.addEventListener( 'change', function() { fnSetType( typeSelect.value ); } );

            const attach = document.createElement( 'div' );
            attach.className = 'doc-attach';

            if( docIsLink( d ) )
            {
                attach.appendChild( docAttachSet( ICON_LINK, d.path, null, function() { docOpenInTab( d, fnDirName() ); } ) );
            }
            else if( d.file || d._pending )
            {
                attach.appendChild( docAttachSet( ICON_UPLOAD, d.file, d._pending ? T( 'trips.pending' ) : null, function() { docOpenInTab( d, fnDirName() ); } ) );
            }
            else
            {
                const linkBtn = document.createElement( 'button' );
                linkBtn.type = 'button';
                linkBtn.className = 'doc-attach-btn';
                linkBtn.appendChild( svgIcon( ICON_LINK, 13 ) );
                linkBtn.appendChild( document.createTextNode( T( 'trips.link' ) ) );
                linkBtn.disabled = ! navigator.onLine;
                linkBtn.title = navigator.onLine ? T( 'trips.linkExisting' ) : T( 'trips.needsNet' );
                linkBtn.addEventListener( 'click', function() { docAttachLink( d, fnRerender ); } );

                const upBtn = document.createElement( 'button' );
                upBtn.type = 'button';
                upBtn.className = 'doc-attach-btn';
                upBtn.appendChild( svgIcon( ICON_UPLOAD, 13 ) );
                upBtn.appendChild( document.createTextNode( NayiveUI.t( 'ui.upload' ) ) );
                upBtn.addEventListener( 'click', function() { docAttachUpload( d, fnSiblings, fnRerender ); } );

                attach.appendChild( linkBtn );
                attach.appendChild( upBtn );
            }

            // A trashcan, not an "x": this deletes the document row (and its upload),
            // it does not close or clear anything. Same icon every other delete uses.
            const removeBtn = document.createElement( 'button' );
            removeBtn.className = 'icon-btn danger';
            removeBtn.title = T( 'trips.remove' );
            removeBtn.appendChild( svgIcon( ICON_TRASH, 15 ) );
            removeBtn.addEventListener( 'click', fnRemove );

            row.appendChild( typeSelect );
            row.appendChild( attach );
            row.appendChild( removeBtn );
            wrap.appendChild( row );

            // "will be stored at" preview - only for an upload (a link needs no copy)
            if( ! docIsLink( d ) && (d.file || d._pending) )
            {
                const path = document.createElement( 'div' );
                path.className = 'doc-row-path';
                path.dataset.docId = d.id;
                path.textContent = docPath( 'data/trips/' + fnDirName(), d );
                wrap.appendChild( path );
            }

            return wrap;
        }

        // The set-attachment pill. It's a button: clicking it opens the attached file in
        // a new browser tab. To change the target, remove the document and add a new one.
        function docAttachSet( sIconPaths, sLabel, sTag, fnPick )
        {
            const box = document.createElement( 'button' );
            box.type = 'button';
            box.className = 'doc-attach-set';
            box.title = T( 'trips.openNewTab' );
            box.appendChild( svgIcon( sIconPaths, 13 ) );

            const name = document.createElement( 'span' );
            name.className = 'doc-attach-name';
            name.textContent = sLabel || '';
            box.appendChild( name );

            if( sTag )
            {
                const tag = document.createElement( 'span' );
                tag.className = 'doc-attach-pending';
                tag.textContent = sTag;
                box.appendChild( tag );
            }

            if( fnPick )
                box.addEventListener( 'click', fnPick );

            return box;
        }

        // Open an attached document in a new browser tab. A not-yet-saved upload only
        // exists in memory, so it's served from a temporary blob URL.
        function docOpenInTab( d, sDirName )
        {
            const url = d._pending ? URL.createObjectURL( d._pending )
                                   : GumApi.fileUrl( docPath( 'data/trips/' + sDirName, d ) );

            if( url )
                window.open( url, '_blank', 'noopener' );
        }

        function docAttachUpload( d, fnSiblings, fnRerender )
        {
            const input = document.getElementById( 'docUploadInput' );
            input.value = '';
            input.onchange = function()
            {
                const f = input.files && input.files[ 0 ];
                input.onchange = null;

                if( ! f )
                    return;

                const siblings = ( fnSiblings ? fnSiblings() : [] ).filter( function( x ) { return x !== d; } );

                d.kind = 'upload';
                d._pending = f;
                d.file = uniqueFileName( f.name, siblings );
                delete d.path;

                // No manual name field any more - the document's name follows its file.
                d.name = f.name.replace( /\.[^.]+$/, '' );

                fnRerender();
            };
            input.click();
        }

        function docAttachLink( d, fnRerender )
        {
            openFilePicker( function( sPath )
            {
                d.kind = 'link';
                d.path = sPath;
                delete d.file;
                delete d._pending;

                // No manual name field any more - the document's name follows its file.
                d.name = sPath.split( '/' ).pop().replace( /\.[^.]+$/, '' );

                fnRerender();
            });
        }

        //------------------------------------------------------------------------//
        // FILE PICKER - browse the user's own files/ tree to link an existing file
        // (passport, etc.). Uploads go through docAttachUpload instead.
        // (Folder picking is NOT here - the trip photos folder uses the shared
        //  NayiveUI.pickFolder sheet, same as Photos / Music / Movies.)

        let filePickerOnPick   = null;
        let filePickerFilesNode = null;   // null = loading, undefined = load failed, else the 'files' tree node
        let filePickerExpanded = null;

        async function openFilePicker( onPick )
        {
            filePickerOnPick      = onPick;
            filePickerFilesNode   = null;
            filePickerExpanded    = new Set();

            renderFilePickerSheet();
            openSheet( 'filePickerSheetBackdrop' );

            try
            {
                // The files/ subtree only (same node shape the old full tree gave).
                filePickerFilesNode = await GumApi.listDirRecursive( 'files' );
            }
            catch( err )
            {
                filePickerFilesNode = String( err && err.message ).indexOf( 'HTTP 404' ) !== -1
                                    ? { path: 'files', nodes: [] } : undefined;
            }

            renderFilePickerSheet();
        }

        function closeFilePicker() { closeSheet( 'filePickerSheetBackdrop' ); filePickerOnPick = null; }

        function renderFilePickerSheet()
        {
            const sheet = document.getElementById( 'filePickerSheet' );
            sheet.innerHTML = '';
            buildSheetHeader( T( 'trips.pickFile' ), 'filePickerSheetBackdrop', sheet );

            if( filePickerFilesNode === null )
            {
                const p = document.createElement( 'p' );
                p.className = 'calc-rate';
                p.textContent = T( 'trips.loadingFiles' );
                sheet.appendChild( p );
                return;
            }

            if( filePickerFilesNode === undefined )
            {
                const p = document.createElement( 'p' );
                p.className = 'calc-warn';
                p.textContent = T( 'trips.loadFilesFailed' );
                sheet.appendChild( p );
                return;
            }

            const box  = document.createElement( 'div' );
            box.className = 'filetree';
            const kids = filePickerFilesNode.nodes || [];

            if( ! kids.length )
            {
                const empty = document.createElement( 'div' );
                empty.className = 'ft-empty';
                empty.textContent = T( 'trips.noFilesInDrive' );
                box.appendChild( empty );
            }
            else
            {
                sortTreeNodes( kids ).forEach( function( n ) { appendFileNode( box, n, 0 ); } );
            }

            sheet.appendChild( box );
        }

        // Directories first, then files; each group alphabetical (case-insensitive).
        function sortTreeNodes( nodes )
        {
            return nodes.slice().sort( function( a, b )
            {
                const ad = Array.isArray( a.nodes ), bd = Array.isArray( b.nodes );
                if( ad !== bd ) return ad ? -1 : 1;
                return a.path.toLowerCase() < b.path.toLowerCase() ? -1 : 1;
            });
        }

        function appendFileNode( host, node, depth )
        {
            const isDir = Array.isArray( node.nodes );

            const row = document.createElement( 'div' );
            row.className = 'ft-row' + (isDir ? '' : ' ft-file');
            row.style.paddingLeft = (8 + depth * 16) + 'px';

            const caret = document.createElement( 'span' );
            caret.className = 'ft-caret';
            caret.textContent = isDir ? (filePickerExpanded.has( node.path ) ? '▾' : '▸') : '';
            row.appendChild( caret );

            row.appendChild( svgIcon( isDir ? ICON_FOLDER : ICON_FILE, 15 ) );

            const label = document.createElement( 'span' );
            label.textContent = node.path.split( '/' ).pop();
            row.appendChild( label );

            const pick = function()
            {
                const cb = filePickerOnPick;
                closeFilePicker();
                if( cb ) cb( node.path );
            };

            const toggle = function()
            {
                if( filePickerExpanded.has( node.path ) ) filePickerExpanded.delete( node.path );
                else filePickerExpanded.add( node.path );
                renderFilePickerSheet();
            };

            host.appendChild( row );

            if( isDir )
            {
                row.addEventListener( 'click', toggle );

                if( filePickerExpanded.has( node.path ) )
                    sortTreeNodes( node.nodes || [] ).forEach( function( c ) { appendFileNode( host, c, depth + 1 ); } );
            }
            else
            {
                row.addEventListener( 'click', pick );
            }
        }

        //------------------------------------------------------------------------//
        // RENDERING - MAP (side panel on wide screens, sheet on narrow ones) - a real Leaflet
        // map (OpenStreetMap data, free, no API key - see shared/basemap.js), plotting the
        // trip's stages by their geocoded coordinates. Coordinates are never guessed: a stage
        // that hasn't been geocoded yet, or couldn't be resolved, is simply left off the map and
        // disclosed via the warning note below it - same honesty rule as timezone/currency.

        // Two independent Leaflet instances can be alive at once (panel + sheet). Each slot
        // tracks its own so a re-render can .remove() the previous one first - Leaflet throws if
        // you try to re-init a map onto a container it already owns, and just wiping the
        // container's innerHTML would leak the old instance's tile requests/event listeners.
        let panelMapInstance = null;
        let sheetMapInstance = null;

        function destroyMap( sWhich )
        {
            const instance = sWhich === 'panel' ? panelMapInstance : sheetMapInstance;

            if( instance )
                instance.remove();

            if( sWhich === 'panel' ) panelMapInstance = null; else sheetMapInstance = null;
        }

        // The stage whose card the pointer is currently over, or null. Kept at module level
        // so buildRealMap() can restore the highlight after a re-render rebuilds the map.
        let hoveredStageId = null;

        // Highlight (or un-highlight) the route leg that LEAVES the given stage - the same leg
        // the stage's transport colours, and the same journey its node icon shows. The .leg-active
        // class does the rest in CSS: drawn solid instead of dotted. Applied to
        // whichever maps are alive (the wide-layout panel, the narrow-layout sheet, or both).
        // Silently does nothing when there is no such leg: the last stage departs nowhere, and
        // a disabled or not-yet-geocoded stage is not on the map at all.
        function setLegActive( sStageId, bOn )
        {
            [ panelMapInstance, sheetMapInstance ].forEach( function( map )
            {
                const leg = map && map.nayiveLegs && map.nayiveLegs[ sStageId ];
                const el  = leg && leg.getElement();

                if( el ) el.classList.toggle( 'leg-active', bOn );
            });
        }

        // Fly the always-on route panel map to a stage's coordinates and drop a labelled
        // popup there. Called from the "Ver en el mapa" button inside the Ubicación field
        // (only reachable on wide layouts, where the panel map exists).
        function highlightStageOnMap( lat, lon, sLabel )
        {
            const map = panelMapInstance;

            if( ! map )
            {
                NayiveUI.toast( T( 'trips.mapUnavailable' ) );
                return false;
            }

            const content = document.createElement( 'span' );
            content.textContent = sLabel;

            map.flyTo( [ lat, lon ], Math.max( map.getZoom(), 10 ), { duration: 0.6 } );
            L.popup( { autoClose: false, closeOnClick: false } )
                .setLatLng( [ lat, lon ] )
                .setContent( content )
                .openOn( map );

            return true;
        }

        function buildRealMap( trip, container, sWhich )
        {
            destroyMap( sWhich );

            const map = L.map( container, { zoomControl: true, attributionControl: true } );

            // The base map is visually busy, so `.route-map` desaturates it in CSS to a
            // calm grey backdrop - the trip route stays the only colour on the map.
            // Connected to Wi-Fi but no real internet -> navigator.onLine is still
            // true, so the map just fails. Swap the whole block for the offline
            // note the first time it can't load.
            let swapped = false;
            NayiveBaseMap.add( map, { onFail: function()
            {
                if( swapped ) return;
                swapped = true;

                const block = container.parentElement;   // the wrap div from buildRouteMapBlock
                destroyMap( sWhich );

                if( block )
                {
                    block.innerHTML = '';
                    const off = document.createElement( 'div' );
                    off.className = 'route-offline';
                    off.textContent = T( 'trips.mapNeedsNet' );
                    block.appendChild( off );
                }
            } } );

            const points = trip.stages
                .filter( function( st ) { return stageEnabled( st ) && typeof st.lat === 'number' && typeof st.lon === 'number'; } )
                .map( function( st, i ) { return { id: st.id, lat: st.lat, lon: st.lon, label: st.location, index: i + 1, transport: st.transport || 'other' }; } );

            // Every drawn leg, keyed by the id of the stage it DEPARTS from - that is what
            // setLegActive() looks up when the pointer enters a stage card.
            const legs = {};

            if( points.length )
            {
                const latlngs = points.map( function( p ) { return [ p.lat, p.lon ]; } );

                // One coloured leg per hop, coloured by the transport of the stage it
                // leaves from (a stage's transport is how you travel onward from it, the
                // journey next to its "Salida" field), so each mode reads as its own line.
                for( let i = 1; i < points.length; i++ )
                {
                    const mode = points[ i - 1 ].transport;
                    legs[ points[ i - 1 ].id ] =
                        L.polyline( [ [ points[i-1].lat, points[i-1].lon ], [ points[i].lat, points[i].lon ] ],
                            { color: TRANSPORT_COLORS[ mode ] || TRANSPORT_COLORS.other, weight: 4, opacity: 0.9, dashArray: '8, 8', lineJoin: 'round' } )
                            .bindTooltip( TRANSPORT_LABELS()[ mode ] || T( 'trips.leg' ), { sticky: true } )
                            .addTo( map );
                }

                points.forEach( function( p )
                {
                    L.marker( [ p.lat, p.lon ] ).bindPopup( TF( 'trips.stageN', { n: p.index } ) + ': ' + p.label ).addTo( map );
                });

                map.fitBounds( latlngs, { padding: [ 28, 28 ], maxZoom: 12 } );
            }
            // The trip's own name is only ever a map pin when there are NO stages - once a
            // trip has stages its name is just the trip's title, not a place on the map.
            else if( trip.stages.length === 0 && typeof trip.lat === 'number' && typeof trip.lon === 'number' )
            {
                map.setView( [ trip.lat, trip.lon ], 9 );
                L.marker( [ trip.lat, trip.lon ] ).bindPopup( trip.destination ).addTo( map );
            }
            else
            {
                map.setView( [ 20, 0 ], 2 );   // nothing resolved yet - filled in once geocoding lands, see ensureRouteCoords()
            }

            map.nayiveLegs = legs;

            if( sWhich === 'panel' ) panelMapInstance = map; else sheetMapInstance = map;

            // A background save (a geocode or a weather lookup landing) re-renders and rebuilds
            // this map from scratch, on brand-new polylines. If the pointer is still resting on a
            // stage card, put its highlight straight back so the rebuild is invisible to the user.
            if( hoveredStageId ) setLegActive( hoveredStageId, true );

            // The container may have been zero-sized at init (e.g. sheet still mid-transition) -
            // let layout settle for a frame, then have Leaflet recheck its size.
            requestAnimationFrame( function() { map.invalidateSize(); } );

            return map;
        }

        // Builds the map block AND appends it into `parentEl` itself (rather than just returning
        // it for the caller to append) - Leaflet reads the container's real layout size at init
        // (for fitBounds/setView), so the div must already be attached to the visible document
        // before buildRealMap() runs, not after.
        function buildRouteMapBlock( trip, sWhich, parentEl )
        {
            const wrap = document.createElement( 'div' );

            // The map needs live map tiles. Offline, skip Leaflet entirely
            // and show a note — the stages are still listed in the detail view.
            if( ! navigator.onLine )
            {
                destroyMap( sWhich );
                const off = document.createElement( 'div' );
                off.className = 'route-offline';
                off.textContent = T( 'trips.mapNeedsNet' );
                wrap.appendChild( off );
                parentEl.appendChild( wrap );
                return;
            }

            // Legend for the coloured route legs - only the transport modes this trip
            // actually uses to travel between stages. Each leg is coloured by the stage it
            // leaves from, so the last stage (nothing departs it) is skipped. Sits ABOVE
            // the map.
            const usedModes = [];
            const mapStages = trip.stages.filter( stageEnabled );
            mapStages.slice( 0, -1 ).forEach( function( st )
            {
                const m = st.transport || 'other';
                if( usedModes.indexOf( m ) === -1 ) usedModes.push( m );
            });

            if( usedModes.length )
            {
                const legend = document.createElement( 'div' );
                legend.className = 'map-legend';
                usedModes.forEach( function( m )
                {
                    const it = document.createElement( 'span' );
                    it.className = 'map-legend-item';
                    const sw = document.createElement( 'span' );
                    sw.className = 'map-legend-swatch';
                    sw.style.background = TRANSPORT_COLORS[ m ] || TRANSPORT_COLORS.other;
                    it.appendChild( sw );
                    it.appendChild( document.createTextNode( TRANSPORT_LABELS()[ m ] || T( 'trips.trOther' ) ) );
                    legend.appendChild( it );
                });
                wrap.appendChild( legend );
            }

            const mapDiv = document.createElement( 'div' );
            mapDiv.className = 'route-map';
            wrap.appendChild( mapDiv );

            const unresolved = trip.stages.filter( function( st ) { return stageEnabled( st ) && st.lat === null; } );

            if( unresolved.length )
            {
                const warn = document.createElement( 'p' );
                warn.className = 'calc-warn';
                warn.textContent = TF( 'trips.cantLocate', { places: unresolved.map( function( st ) { return st.location; } ).join( ', ' ) } );
                wrap.appendChild( warn );
            }

            const caption = document.createElement( 'p' );
            caption.className = 'map-caption';
            caption.textContent = T( 'trips.liveMap' );
            wrap.appendChild( caption );

            parentEl.appendChild( wrap );
            buildRealMap( trip, mapDiv, sWhich );
        }

        // Geocodes anything in `trip` that has never been looked up (lat === undefined - a stage
        // saved before the map feature existed, or one saved while its lookup was still in
        // flight): the trip's own destination (for the "no stages yet" pin) and every stage.
        // Whatever resolves is written straight to disk via mutateTrip, exactly like any other
        // edit - so each location is only ever geocoded once, not on every render/reload.
        const pendingGeocodes = new Set();

        function ensureRouteCoords( trip )
        {
            // Only geocode the trip's own name when it has no stages - with stages, the trip
            // name is a title, not a place, and must never become a map pin (even a city name).
            if( trip.stages.length === 0 && trip.lat === undefined && trip.destination.trim() )
                geocodeInto( trip.id, 'trip', null, trip.destination );

            trip.stages.forEach( function( st )
            {
                if( st.lat === undefined && st.location.trim() )
                    geocodeInto( trip.id, 'stage', st.id, st.location );
            });
        }

        async function geocodeInto( tripId, sKind, id, sQuery )
        {
            const key = tripId + ':' + sKind + ':' + id;

            if( pendingGeocodes.has( key ) )
                return;

            pendingGeocodes.add( key );
            const result = await geocodeLocation( sQuery );
            pendingGeocodes.delete( key );

            if( selectedTripId !== tripId )
                return;   // navigated away before this resolved - don't touch a trip that isn't open any more

            if( result && result.unreachable )
                return;   // offline / service down - leave lat === undefined so it retries later

            const coords = result ? { lat: result.lat, lon: result.lon } : { lat: null, lon: null };

            if( sKind === 'trip' )
            {
                mutateTrip( tripId, function( t ) { return { ...t, lat: coords.lat, lon: coords.lon }; } );
            }
            else
            {
                mutateTrip( tripId, function( t )
                {
                    const stages = t.stages.map( function( st ) { return st.id === id ? { ...st, lat: coords.lat, lon: coords.lon } : st; } );
                    return { ...t, stages };
                });
            }
        }

        function renderMapSheet()
        {
            const trip  = findTrip( selectedTripId );
            const sheet = document.getElementById( 'mapSheet' );
            sheet.innerHTML = '';

            if( ! trip )
                return;

            ensureRouteCoords( trip );

            buildSheetHeader( T( 'trips.route' ), 'mapSheetBackdrop', sheet );
            buildRouteMapBlock( trip, 'sheet', sheet );
        }

        // Title + lone "close" for sheets whose only control is close. The close
        // button follows the shared Nayive convention: NayiveUI.applySheetButtons()
        // moves it to the sheet's top-right corner. (Sheets with other actions
        // keep their close in a .sheet-actions row.) Appends into `sheet`.
        function buildSheetHeader( title, backdropId, sheet )
        {
            const header = document.createElement( 'div' );
            header.className = 'sheet-header';

            const h2 = document.createElement( 'h2' );
            h2.textContent = title;
            header.appendChild( h2 );
            sheet.appendChild( header );

            const actions = document.createElement( 'div' );
            actions.className = 'sheet-actions';

            const closeBtn = document.createElement( 'button' );
            closeBtn.type = 'button';
            closeBtn.setAttribute( 'data-act', 'close' );
            closeBtn.title = NayiveUI.t( 'ui.close' );
            closeBtn.addEventListener( 'click', function() { closeSheet( backdropId ); } );
            actions.appendChild( closeBtn );
            sheet.appendChild( actions );

            NayiveUI.applySheetButtons( sheet );
        }

        const wideMql = window.matchMedia( '(min-width: 920px)' );

        function renderRoutePanel()
        {
            const body = document.getElementById( 'routePanelBody' );
            const trip = view === 'detail' ? findTrip( selectedTripId ) : null;

            if( ! trip )
            {
                destroyMap( 'panel' );
                body.innerHTML = '';
                const placeholder = document.createElement( 'div' );
                placeholder.className = 'route-placeholder';
                placeholder.textContent = T( 'trips.openTripForRoute' );
                body.appendChild( placeholder );
                return;
            }

            ensureRouteCoords( trip );

            if( ! wideMql.matches )
            {
                // Hidden by CSS below 920px (the map opens in a sheet instead, via the header's
                // map button) - skip building a live tile map into an invisible container:
                // Leaflet can't size itself at display:none, and the tiles would load for nothing
                // anyone can see. ensureRouteCoords() above still ran, so the sheet has data ready.
                destroyMap( 'panel' );
                body.innerHTML = '';
                return;
            }

            body.innerHTML = '';
            buildRouteMapBlock( trip, 'panel', body );
        }

        //------------------------------------------------------------------------//
        // RENDERING - CURRENCY SHEET

        function renderCurrencySheet()
        {
            const trip  = findTrip( selectedTripId );
            const sheet = document.getElementById( 'currencySheet' );
            sheet.innerHTML = '';

            if( ! trip )
                return;

            buildSheetHeader( T( 'trips.currency' ), 'currencySheetBackdrop', sheet );

            if( ! currencyLookup )
            {
                const loading = document.createElement( 'p' );
                loading.className = 'calc-rate';
                loading.textContent = T( 'trips.fxChecking' );
                sheet.appendChild( loading );
                return;
            }

            const lookup = currencyLookup;

            if( ! lookup.matched )
            {
                const notMatched = document.createElement( 'p' );
                notMatched.className = 'calc-warn';
                notMatched.textContent = TF( 'trips.fxNoCurrency', { place: currencyContextName || trip.destination } );
                sheet.appendChild( notMatched );
            }

            const sourceList = document.createElement( 'div' );
            sourceList.className = 'calc-sources';
            lookup.results.forEach( function( r )
            {
                const row = document.createElement( 'div' );
                row.className = 'calc-source-row';
                const name = document.createElement( 'span' );
                name.textContent = r.source;
                const val = document.createElement( 'span' );
                val.textContent = r.ok ? TF( 'trips.fxRate', { rate: r.rate.toFixed( 4 ), code: lookup.code } )
                                       : TF( 'trips.fxUnavailable', { reason: r.reason } );
                row.appendChild( name );
                row.appendChild( val );
                sourceList.appendChild( row );
            });
            sheet.appendChild( sourceList );

            if( lookup.verified )
            {
                const asOf = lookup.verified.sourceA.asOf || lookup.verified.sourceB.asOf;
                const rateNote = document.createElement( 'p' );
                rateNote.className = 'calc-rate';
                rateNote.textContent = TF( 'trips.fxVerified', {
                    a: lookup.verified.sourceA.source, b: lookup.verified.sourceB.source,
                    tol: RATE_TOLERANCE_ABS, rate: lookup.verified.rate.toFixed( 4 ), code: lookup.code } )
                    + ( asOf ? TF( 'trips.fxAsOf', { date: asOf } ) : '' ) + '.';
                sheet.appendChild( rateNote );
            }
            else
            {
                const warn = document.createElement( 'p' );
                warn.className = 'calc-warn';
                warn.textContent = lookup.compared.length
                    ? TF( 'trips.fxUnverified', { tol: RATE_TOLERANCE_ABS } )
                    : T( 'trips.fxNoSource' );
                sheet.appendChild( warn );
            }

            const localField = document.createElement( 'div' );
            localField.className = 'field';
            const localLabel = document.createElement( 'label' );
            localLabel.textContent = TF( 'trips.amountIn', { name: currencyName( lookup.code ), code: lookup.code } );
            const localInput = document.createElement( 'input' );
            localInput.type = 'number';
            localInput.placeholder = '0.00';
            localInput.value = calcLocal;
            localInput.disabled = ! lookup.verified;
            localInput.addEventListener( 'input', function() { calcOnLocalChange( localInput.value ); } );
            localField.appendChild( localLabel );
            localField.appendChild( localInput );
            sheet.appendChild( localField );

            const eurField = document.createElement( 'div' );
            eurField.className = 'field';
            const eurLabel = document.createElement( 'label' );
            eurLabel.textContent = T( 'trips.amountInEur' );
            const eurInput = document.createElement( 'input' );
            eurInput.type = 'number';
            eurInput.placeholder = '0.00';
            eurInput.value = calcEur;
            eurInput.disabled = ! lookup.verified;
            eurInput.addEventListener( 'input', function() { calcOnEurChange( eurInput.value ); } );
            eurField.appendChild( eurLabel );
            eurField.appendChild( eurInput );
            sheet.appendChild( eurField );
        }

    </script>
</body>
</html>
