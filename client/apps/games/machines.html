<!-- machines.html - Machines, one of the games of index.html.

     Not a page of its own: index.html fetches this file at boot and takes
     out its three parts: the style goes into its head, the pane into
     #gameHost, and the script runs, reaching the helpers the games share
     through window.NayiveGames.

     This file is only the frame: the toolbar, the board's box, the row of
     pieces. The game itself is four scripts that load the first time it is
     opened, and never before: the physics engine alone is 700 KB, and nobody
     who plays Sudoku should wait for it. -->
    <style>
        /* ---- Machines -------------------------------------------------------
           A build-and-run puzzle: put pieces on the board, press Run, and the
           machine has to drop the ball into the basket. One <canvas> draws it
           all (machines-board.js); this is the box around it.

           The pieces are a row under the board, or a column beside it when the
           screen lies on its side: the board is wide (24 x 15), so a column
           costs it less than a row there. */
        .machines        { height: 100%; display: grid; grid-template: minmax( 0, 1fr ) auto / minmax( 0, 1fr ); }

        /* The BOX is what has a size; the canvas only follows it (see fit()). */
        .mch-stage       { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
        .mch-canvas      { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

        /* What the open tool does, or what will not work, over the board's top
           left. It lets every press through to the board under it. */
        .mch-note        { position: absolute; left: 8px; top: 8px; right: 8px; pointer-events: none; font-size: 0.85rem; }
        .mch-note span   { display: inline-block; padding: 3px 8px; border: 1px solid var(--line); border-radius: var(--radius-s);
                           background: var(--card); color: var(--text); }
        .mch-note span:empty { display: none; }

        /* How the run ended, over the board but not covering it: the machine
           stays in sight, frozen where it ended. */
        .mch-win         { position: absolute; left: 50%; top: 18%; transform: translateX( -50% ); z-index: 1;
                           display: flex; align-items: center; gap: 10px; max-width: calc( 100% - 16px ); box-sizing: border-box;
                           padding: 8px 10px 8px 16px; border: 1px solid var(--line); border-radius: var(--radius-m);
                           background: var(--card); box-shadow: var(--shadow, 0 4px 16px rgb( 0 0 0 / 0.18 )); pointer-events: none; }
        .mch-win p       { margin: 0; font-weight: 600; color: var(--danger); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mch-win.is-won p { color: var(--ok); }
        .mch-win .btn    { pointer-events: auto; }

        /* The pieces: the shared round .btn, with the count still left in its corner. */
        .mch-tools       { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
                           padding: 6px 8px calc( 6px + env( safe-area-inset-bottom ) );
                           border-top: 1px solid var(--line); background: var(--card); }
        .mch-tool        { position: relative; }
        /* A finger gets the full 44 px, drawn: the pieces sit 4 px apart, too close for the shared invisible pad. */
        html.touch .mch-tool { --btn: 44px; }
        .mch-tool svg    { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
                           stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
        .mch-tool i      { position: absolute; top: -3px; right: -3px; min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box;
                           border-radius: 8px; background: var(--card2); border: 1px solid var(--line);
                           font: 600 10px/13px system-ui, sans-serif; font-style: normal; color: var(--text-dim); pointer-events: none; }
        .mch-tool i:empty { display: none; }

        @media (orientation: landscape)
        {
            .machines    { grid-template: minmax( 0, 1fr ) / auto minmax( 0, 1fr ); }
            .mch-tools   { grid-row: 1; grid-column: 1; display: grid; grid-template-columns: repeat( 2, auto );
                           align-content: start; overflow-y: auto; padding: 6px 6px 6px calc( 6px + env( safe-area-inset-left ) );
                           border-top: 0; border-right: 1px solid var(--line); }
            html.touch .mch-tools { grid-template-columns: repeat( 3, auto ); }
            .mch-stage   { grid-row: 1; grid-column: 2; }
        }

        /* The level code: one board as text, wide enough to read a piece a line. */
        .mch-code-dialog { width: min( 640px, calc( 100vw - 24px ) ); }
        .mch-code        { width: 100%; box-sizing: border-box; min-height: 260px; font: 12px/1.45 ui-monospace, monospace; white-space: pre; }
    </style>

            <!-- Machines. The toolbar (moved into the header at boot): the two
                 modes, then the level (play) or the board menu (design), then
                 Clear and Run. Under it the board, and the pieces. -->
            <section class="game-pane" data-pane="machines">
                <div class="machines">
                    <div class="view-bar" data-options="machines">
                        <div class="tb-modes">
                            <button class="btn sm" id="mchPlay" type="button" aria-pressed="true" data-i18n-attr="data-tip:games.machinesPlay, aria-label:games.machinesPlay">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h6v-5h6v-5h6V4"></path></svg>
                            </button>
                            <button class="btn sm" id="mchDesign" type="button" aria-pressed="false" data-i18n-attr="data-tip:games.machinesDesign, aria-label:games.machinesDesign">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                            </button>
                        </div>

                        <div class="game-stats">
                            <span class="game-stat" id="mchPager">
                                <button class="btn sm" id="mchPrev" type="button" data-i18n-attr="data-tip:games.machinesPrev, aria-label:games.machinesPrev">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
                                </button>
                                <b id="mchLevel">1 / 1</b>
                                <button class="btn sm" id="mchNext" type="button" data-i18n-attr="data-tip:games.machinesNext, aria-label:games.machinesNext">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
                                </button>
                            </span>
                            <button class="btn sm" id="mchBoard" type="button" aria-haspopup="menu" hidden data-i18n-attr="data-tip:games.machinesBoard, aria-label:games.machinesBoard">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                            </button>
                        </div>

                        <div class="tb-actions">
                            <button class="btn sm" id="mchClear" type="button" data-i18n-attr="data-tip:games.machinesClear, aria-label:games.machinesClear">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21l-4.3-4.3a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"></path><line x1="22" y1="21" x2="7" y2="21"></line><line x1="5" y1="11" x2="14" y2="20"></line></svg>
                            </button>
                            <button class="btn sm primary" id="mchRun" type="button" data-i18n-attr="data-tip:games.machinesRun, aria-label:games.machinesRun">
                                <svg data-ic="run" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5a1 1 0 0 1 1.5-.87l9 6.5a1 1 0 0 1 0 1.74l-9 6.5A1 1 0 0 1 8 18.5z"></path></svg>
                                <svg data-ic="stop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg>
                            </button>
                        </div>
                    </div>

                    <div class="mch-stage" id="mchStage">
                        <canvas class="mch-canvas" id="mchCanvas" data-i18n-attr="aria-label:games.machinesBoardArea"></canvas>
                        <div class="mch-note"><span id="mchNote"></span></div>
                        <div class="mch-win" id="mchWin" role="status" hidden>
                            <p id="mchWinText"></p>
                            <button class="btn text sm bordered" id="mchWinNext" type="button" hidden><span data-i18n="games.machinesNext"></span></button>
                        </div>
                        <div class="game-cover" id="mchCover">
                            <p class="game-cover-t" id="mchCoverTitle" data-i18n="games.machinesLoading"></p>
                            <button class="btn text primary" id="mchRetry" type="button" hidden><span data-i18n="games.machinesRetry"></span></button>
                        </div>
                    </div>

                    <nav class="mch-tools" id="mchTools" data-i18n-attr="aria-label:games.machinesPieces"></nav>
                </div>
            </section>

    <script>
    ( function ()
    {
        'use strict';

        var T = NayiveGames.T;

        var Machines = ( function ()
        {
            // In this order: the engine, the rules, the levels, the board.
            // Downloaded together, run in order (async = false).
            var FILES = [ 'lib/nape_v3.43.5.min.js', 'machines-sim.js', 'machines-levels.js', 'machines-board.js' ];

            function init()
            {
                var cover = document.getElementById( 'mchCover' ), retry = document.getElementById( 'mchRetry' );
                var title = document.getElementById( 'mchCoverTitle' );
                var loading = null, live = false, done = {};

                function script( src )
                {
                    return new Promise( function ( ok, no )
                    {
                        var s = document.createElement( 'script' );
                        s.src = src;
                        s.async = false;
                        s.onload = ok;
                        s.onerror = function () { s.remove(); no( new Error( src + ' did not load' ) ); };
                        document.head.appendChild( s );
                    } );
                }

                // Once. A failed load can be tried again; the scripts that did load are not loaded twice.
                function load()
                {
                    if( loading ) return;
                    title.textContent = T( 'games.machinesLoading' );
                    retry.hidden = true;
                    loading = Promise.all( FILES.filter( function ( f ) { return ! done[ f ]; } ).map( function ( f )
                    {
                        return script( f ).then( function () { done[ f ] = true; } );
                    } ) ).then( function ()
                    {
                        if( ! window.MachinesBoard ) { delete done[ 'machines-board.js' ]; throw new Error( 'machines-board.js did not start' ); }
                        cover.hidden = true;
                        if( live ) window.MachinesBoard.enter();
                    } ).catch( function ( e )
                    {
                        console.error( e );
                        loading = null;
                        title.textContent = T( 'games.machinesLoadFailed' );
                        retry.hidden = false;
                    } );
                }

                retry.addEventListener( 'click', load );

                function enter()
                {
                    live = true;
                    if( window.MachinesBoard ) window.MachinesBoard.enter();
                    else load();
                }

                function leave()
                {
                    live = false;
                    if( window.MachinesBoard ) window.MachinesBoard.leave();
                }

                return { enter: enter, leave: leave };
            }

            return { init: init };
        } )();

        NayiveGames.add( 'machines', Machines );
    } )();
    </script>
