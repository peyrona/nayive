<!-- g2048.html - 2048, one of the six games of index.html.

     Not a page of its own: index.html fetches this file at boot and takes
     out its three parts: the style goes into its head, the pane into
     #gameHost, and the script runs, reaching the helpers the six games
     share through window.NayiveGames. -->
    <style>
        /* ---- 2048 ---------------------------------------------------------
           A 4x4 grid and one move( dir ). The game is turn-based, so there is
           no canvas and no loop: every render answers one key or one swipe.

           The board is sized off ONE length, --board, so the squares and the
           numerals inside them scale together. It is the
           smallest of three limits - a comfortable maximum, the phone's width,
           and the height of a short landscape window - which is what keeps the
           whole game on screen without the host ever having to scroll.

           The tile ramp: 2 and 4 are mixed out of the theme's own tokens, so
           they sit a faint step above the board in either colour scheme. From
           8 up they are fixed colours with near-white numerals - the sequence
           is something a player reads by sight, and it would stop being one if
           it changed with the theme. */
        .g2048
        {
            /* --board is the room the pane ACTUALLY has, not a guess at it.
               .g2048-area is a SIZE CONTAINER holding nothing but the board, so
               100cqw and 100cqh are exactly the width and the height left over
               once the header and the hint have taken theirs - which is what
               the old `min( 420px, 90vw, 56vh )` was trying to estimate, and
               why the board came out small on a desktop: the 420px cap won on
               every window wide enough to be a PC.

               The floor is for a window too short to hold even that: under it
               the area scrolls, the way it always did, instead of shrinking the
               board to nothing. */
            --board: max( 180px, min( 100cqw, 100cqh ) );
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; height: 100%; padding: 16px; box-sizing: border-box;
        }
        /* NOTHING but the board goes in here. Anything else inside a size
           container eats into the very height the board is measured against -
           which is why the hint stays outside it, as a sibling. */
        .g2048-area
        {
            flex: 1 1 auto; min-height: 0; align-self: stretch; overflow: auto;
            display: flex; container-type: size;
        }

        .g2048-board
        {
            position: relative; box-sizing: border-box; margin: auto;
            width: var(--board); aspect-ratio: 1;
            /* The ROWS have to be spelled out too. Left to `auto` they are
               sized by what is in them and the leftover height is then handed
               out in equal SHARES, not equal sizes - so a row holding a numeral
               came out taller than an empty one and no square was square. It
               never showed at 420px; at the size the board is now it is the
               first thing you see.

               The gap and the padding are off --board for the same kind of
               reason: a percentage here resolves against the PARENT's width,
               not the board's, so it stayed 45px wide while the board shrank. */
            display: grid;
            grid-template-columns: repeat( 4, 1fr );
            grid-template-rows:    repeat( 4, 1fr );
            gap: calc( var(--board) * 0.024 ); padding: calc( var(--board) * 0.024 );
            border-radius: var(--radius-m); background: var(--card2);
            touch-action: none; -webkit-user-select: none; user-select: none;
        }
        .g2048-cell
        {
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-s);
            background: color-mix( in srgb, var(--text) 7%, transparent );
            font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
            font-size: calc( var(--board) * 0.115 );
        }
        /* Three, four and five digits in the same square as one. */
        .g2048-cell.is-mid   { font-size: calc( var(--board) * 0.098 ); }
        .g2048-cell.is-wide  { font-size: calc( var(--board) * 0.076 ); }
        .g2048-cell.is-xwide { font-size: calc( var(--board) * 0.060 ); }

        .g2048-cell[data-v="2"]     { background: color-mix( in srgb, var(--text) 17%, var(--card2) ); color: var(--text-dim); }
        .g2048-cell[data-v="4"]     { background: color-mix( in srgb, var(--text) 32%, var(--card2) ); color: var(--text); }
        .g2048-cell[data-v="8"]     { background: #2E7D74; color: #FBF7F0; }
        .g2048-cell[data-v="16"]    { background: #2F8B5C; color: #FBF7F0; }
        .g2048-cell[data-v="32"]    { background: #5E9633; color: #FBF7F0; }
        .g2048-cell[data-v="64"]    { background: #8C9526; color: #FBF7F0; }
        .g2048-cell[data-v="128"]   { background: #C0951F; color: #FBF7F0; }
        .g2048-cell[data-v="256"]   { background: #D07E1E; color: #FBF7F0; }
        .g2048-cell[data-v="512"]   { background: #C85F27; color: #FBF7F0; }
        .g2048-cell[data-v="1024"]  { background: #C0432F; color: #FBF7F0; }
        .g2048-cell[data-v="2048"]  { background: #B33C6E; color: #FBF7F0; }
        .g2048-cell[data-v="4096"]  { background: #8E4BB0; color: #FBF7F0; }
        .g2048-cell[data-v="8192"]  { background: #5A57C0; color: #FBF7F0; }
        .g2048-cell[data-v="max"]   { background: #3C6FC4; color: #FBF7F0; }

        /* The tile that was just dealt grows in, the ones that merged give a
           short pop. Both classes are re-applied on every render with one
           reflow in between (see render): without it the browser never sees
           the class leave, and a square that merges twice running would not
           replay the animation. */
        .g2048-cell.is-new    { animation: g2048-in  0.14s ease-out; }
        .g2048-cell.is-merged { animation: g2048-pop 0.14s ease-out; }
        @keyframes g2048-in  { from { transform: scale( 0.3 ); opacity: 0; } }
        @keyframes g2048-pop { 50%  { transform: scale( 1.14 ); } }

        .g2048-hint   { margin: 0; text-align: center; font-size: 0.78rem; color: var(--text-faint); }
    </style>

            <!-- 2048. The sixteen squares are built in JS (they are all the
                 same and only their numbers change), so the board opens empty
                 here; the overlay sits over it, not over the header, so the
                 game buttons stay live when a game is finished. -->
            <section class="game-pane" data-pane="g2048">
                <div class="g2048">
                    <div class="view-bar" data-options="g2048">
                        <div class="game-stats">
                            <span class="game-stat" data-i18n-attr="title:games.score">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg>
                                <b id="g2048Score">0</b>
                            </span>
                            <span class="game-stat" data-i18n-attr="title:games.best">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v5a4 4 0 0 1-8 0z"></path><path d="M8 4.5H5.5V7a3 3 0 0 0 3 3"></path><path d="M16 4.5h2.5V7a3 3 0 0 1-3 3"></path><line x1="12" y1="12" x2="12" y2="17"></line><line x1="8.5" y1="20.5" x2="15.5" y2="20.5"></line><path d="M9.5 20.5c0-2 1-3.5 2.5-3.5s2.5 1.5 2.5 3.5"></path></svg>
                                <b id="g2048Best">0</b>
                            </span>
                        </div>

                        <div class="tb-actions">
                            <button class="icon-btn sm" id="g2048Pause" type="button" data-i18n-attr="title:games.pause, aria-label:games.pause">
                                <svg data-ic="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"></rect><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"></rect></svg>
                                <svg data-ic="play" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5.5a1 1 0 0 1 1.5-.87l9 6.5a1 1 0 0 1 0 1.74l-9 6.5A1 1 0 0 1 8 18.5z"></path></svg>
                            </button>
                            <button class="icon-btn sm" id="g2048New" type="button" data-i18n-attr="title:games.newGame, aria-label:games.newGame">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"></path><polyline points="21 3 21 8 16 8"></polyline><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path><polyline points="3 21 3 16 8 16"></polyline></svg>
                            </button>
                        </div>
                    </div>

                    <div class="g2048-area">
                        <div class="g2048-board" id="g2048Board">
                            <div class="game-cover g2048-over" id="g2048Over" hidden>
                                <p class="game-cover-t" id="g2048OverTitle"></p>
                                <p class="game-cover-s" id="g2048OverScore"></p>
                                <button class="text-btn" id="g2048OverBtn" type="button"></button>
                            </div>
                        </div>
                    </div>

                    <p class="g2048-hint" data-i18n="games.hint2048"></p>
                </div>
            </section>

    <script>
    ( function ()
    {
        'use strict';

        // The shell's helpers (index.html, "THE SIX GAMES"): the same eleven
        // in every game, whether it uses them all or not.
        var T           = NayiveGames.T,
            TF          = NayiveGames.TF,
            STEP        = NayiveGames.STEP,
            clock       = NayiveGames.clock,
            keyBusy     = NayiveGames.keyBusy,
            pauseButton = NayiveGames.pauseButton,
            keepBest    = NayiveGames.keepBest,
            gameLoop    = NayiveGames.gameLoop,
            arcade      = NayiveGames.arcade,
            saveBest    = NayiveGames.saveBest,
            saveTime    = NayiveGames.saveTime;

        //------------------------------------------------------------------------//
        // 2048
        //
        // A 4x4 array and one move( dir ). It is turn-based, so there is no
        // loop and no canvas: every render answers one key or one swipe.

        var G2048 = ( function ()
        {
            var SIZE  = 4;
            var CELLS = SIZE * SIZE;
            var GOAL  = 2048;
            var SWIPE = 24;                    // px before a drag counts as a swipe and not a tap

            var grid  = [];                    // CELLS numbers, 0 is an empty square
            var score = 0;
            var best  = 0;
            var won   = false;                 // the 2048 tile has been reached; play goes on
            var over  = false;
            // 2048 has no clock, so a pause here only takes the board off the
            // screen and stops the arrows. It is in the toolbar anyway, because
            // a button that is there in five games of six and missing in the
            // sixth reads as a bug rather than as a decision.
            var paused = false;
            var live  = false;                 // is this the pane on screen? (the arrow keys)

            var cells = [];
            var boardEl, overEl, overTitleEl, overScoreEl, overBtnEl, scoreEl, bestEl, pauseBtn;
            var sx = 0, sy = 0, tracking = false;

            //---- the rules ---------------------------------------------------

            // One lane, sliding towards index 0 - the whole game is here. Every
            // tile merges AT MOST ONCE per move and merges resolve from the
            // leading edge, which is why [2,2,2,2] gives [4,4] and never [8].
            function slide( line )
            {
                var vals = line.filter( function ( v ) { return v !== 0; } );
                var out = [], hits = [], gained = 0, i;

                for( i = 0; i < vals.length; i++ )
                {
                    if( vals[ i ] === vals[ i + 1 ] )
                    {
                        out.push( vals[ i ] * 2 );
                        hits.push( true );
                        gained += vals[ i ] * 2;
                        i++;                       // both tiles are spent
                    }
                    else { out.push( vals[ i ] ); hits.push( false ); }
                }
                while( out.length < SIZE ) { out.push( 0 ); hits.push( false ); }

                return { line: out, merged: hits, gained: gained,
                         moved: out.some( function ( v, k ) { return v !== line[ k ]; } ) };
            }

            // The four lanes of one direction, each already ordered from the
            // leading edge - so slide() never has to know which way it is going.
            function lanes( dir )
            {
                var res = [], i, j, idx;

                for( i = 0; i < SIZE; i++ )
                {
                    idx = [];
                    for( j = 0; j < SIZE; j++ )
                        idx.push( dir === 'left'  ? i * SIZE + j
                                : dir === 'right' ? i * SIZE + ( SIZE - 1 - j )
                                : dir === 'up'    ? j * SIZE + i
                                :                   ( SIZE - 1 - j ) * SIZE + i );
                    res.push( idx );
                }
                return res;
            }

            // Is there any move left: an empty square, or two equal neighbours.
            function canMove()
            {
                var r, c, v;

                for( r = 0; r < SIZE; r++ )
                    for( c = 0; c < SIZE; c++ )
                    {
                        v = grid[ r * SIZE + c ];
                        if( v === 0 ) return true;
                        if( c + 1 < SIZE && grid[ r * SIZE + c + 1 ] === v ) return true;
                        if( r + 1 < SIZE && grid[ ( r + 1 ) * SIZE + c ] === v ) return true;
                    }
                return false;
            }

            // Nine 2s for every 4, in a square picked at random. Returns where.
            function spawn()
            {
                var free = [], i;

                for( i = 0; i < CELLS; i++ ) if( grid[ i ] === 0 ) free.push( i );
                if( ! free.length ) return -1;

                var at = free[ Math.floor( Math.random() * free.length ) ];
                grid[ at ] = Math.random() < 0.9 ? 2 : 4;
                return at;
            }

            //---- a turn ------------------------------------------------------

            function move( dir )
            {
                if( over || paused ) return;

                var next = grid.slice(), gained = 0, moved = false, merged = [];

                lanes( dir ).forEach( function ( idx )
                {
                    var r = slide( idx.map( function ( k ) { return grid[ k ]; } ) );

                    r.line.forEach( function ( v, j )
                    {
                        next[ idx[ j ] ] = v;
                        if( r.merged[ j ] ) merged.push( idx[ j ] );
                    } );

                    gained += r.gained;
                    moved   = moved || r.moved;
                } );

                if( ! moved ) return;              // a move that changes nothing deals no tile

                grid   = next;
                score += gained;
                if( score > best ) { best = score; saveBest( 'g2048', best ); }

                render( [ spawn() ], merged );

                // The goal is shown once and then the game carries on. Checking
                // it first can hide a board that is also finished, so hideOver()
                // asks again when the player taps through.
                if( ! won && grid.indexOf( GOAL ) !== -1 ) { won = true; showOver( 'win' ); }
                else if( ! canMove() ) { over = true; showOver( 'lost' ); }
            }

            function newGame()
            {
                var i;

                grid  = [];
                for( i = 0; i < CELLS; i++ ) grid.push( 0 );
                score = 0;
                won   = false;
                over  = false;
                paused = false;

                overEl.hidden = true;
                paintPause();
                render( [ spawn(), spawn() ], [] );
            }

            //---- the screen --------------------------------------------------

            function render( fresh, merged )
            {
                cells.forEach( function ( el, i )
                {
                    var v = grid[ i ];

                    el.textContent = v ? String( v ) : '';
                    el.dataset.v   = v ? ( v > 8192 ? 'max' : String( v ) ) : '';
                    el.className   = 'g2048-cell'
                                   + ( v >= 10000 ? ' is-xwide' : v >= 1000 ? ' is-wide' : v >= 100 ? ' is-mid' : '' );
                } );

                // One reflow between taking the animation classes off and putting
                // them back on: without it the browser only ever sees the end
                // state and a square that merges twice running never replays.
                void boardEl.offsetWidth;

                fresh.forEach( function ( i ) { if( i >= 0 ) cells[ i ].classList.add( 'is-new' ); } );
                merged.forEach( function ( i ) { cells[ i ].classList.add( 'is-merged' ); } );

                scoreEl.textContent = String( score );
                bestEl.textContent  = String( best );
            }

            //---- pausing -----------------------------------------------------
            //
            // It borrows the overlay the win and the game over already use - one
            // card over the board, three sets of words - so `kind` gains a third
            // value and the button below it knows which of the three it is.

            function paintPause()
            {
                pauseButton( pauseBtn, paused, over );
            }

            function pause()
            {
                if( paused || over ) return;

                paused = true;
                overTitleEl.textContent = T( 'games.paused' );
                overScoreEl.textContent = TF( 'games.scoreIs', { n: score } );
                overBtnEl.textContent   = T( 'games.resume' );
                overBtnEl.dataset.kind  = 'paused';
                overEl.hidden = false;
                paintPause();
            }

            function resume()
            {
                if( ! paused ) return;

                paused = false;
                overEl.hidden = true;
                paintPause();
            }

            function showOver( kind )
            {
                overTitleEl.textContent = T( kind === 'win' ? 'games.win2048' : 'games.gameOver' );
                overScoreEl.textContent = TF( 'games.scoreIs', { n: score } );
                overBtnEl.textContent   = T( kind === 'win' ? 'games.keepGoing' : 'games.newGame' );
                overBtnEl.dataset.kind  = kind;
                overEl.hidden = false;
                paintPause();
            }

            // "Seguir jugando" after the 2048 tile - unless that same move also
            // finished the board, which the win overlay would otherwise hide.
            function keepGoing()
            {
                overEl.hidden = true;
                if( ! canMove() ) { over = true; showOver( 'lost' ); }
            }

            //---- input -------------------------------------------------------

            var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };

            function onKey( e )
            {
                var dir = KEYS[ e.key ];

                if( ! dir || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( keyBusy( e ) ) return;

                e.preventDefault();                // otherwise the arrows scroll the page
                move( dir );
            }

            // touch-action: none on the board is what stops the browser scrolling
            // or zooming with the same finger.
            function onTouchStart( e )
            {
                tracking = e.touches.length === 1;
                if( ! tracking ) return;
                sx = e.touches[ 0 ].clientX;
                sy = e.touches[ 0 ].clientY;
            }

            function onTouchEnd( e )
            {
                if( ! tracking ) return;
                tracking = false;

                var t  = e.changedTouches[ 0 ];
                var dx = t.clientX - sx;
                var dy = t.clientY - sy;

                if( Math.abs( dx ) < SWIPE && Math.abs( dy ) < SWIPE ) return;   // a tap, not a swipe

                move( Math.abs( dx ) > Math.abs( dy ) ? ( dx > 0 ? 'right' : 'left' )
                                                      : ( dy > 0 ? 'down'  : 'up'   ) );
            }

            //---- mounting ----------------------------------------------------

            function enter()
            {
                if( live ) return;
                live = true;
                document.addEventListener( 'keydown', onKey );
            }

            function leave()
            {
                live = false;
                document.removeEventListener( 'keydown', onKey );
            }

            // The record only ever goes UP, and the two sides are merged with a
            // max rather than letting the newer one win: the plug re-reads the
            // file on focus and on a tap, and that answer can be older than the
            // game being played right now (our own write may still be queued).
            // A record beaten on the phone is picked up here; one beaten here is
            // never thrown away.
            function adoptBest( n )
            {
                best = keepBest( best, n, bestEl );
                return best;
            }

            function init()
            {
                var i, el;

                boardEl     = document.getElementById( 'g2048Board' );
                overEl      = document.getElementById( 'g2048Over' );
                overTitleEl = document.getElementById( 'g2048OverTitle' );
                overScoreEl = document.getElementById( 'g2048OverScore' );
                overBtnEl   = document.getElementById( 'g2048OverBtn' );
                scoreEl     = document.getElementById( 'g2048Score' );
                bestEl      = document.getElementById( 'g2048Best' );
                pauseBtn    = document.getElementById( 'g2048Pause' );

                // Sixteen identical squares: they belong to the board, not to the
                // markup, so they are built here and only their numbers change.
                for( i = 0; i < CELLS; i++ )
                {
                    el = document.createElement( 'div' );
                    el.className = 'g2048-cell';
                    boardEl.insertBefore( el, overEl );
                    cells.push( el );
                }

                boardEl.addEventListener( 'touchstart', onTouchStart, { passive: true } );
                boardEl.addEventListener( 'touchend',   onTouchEnd,   { passive: true } );

                document.getElementById( 'g2048New' ).addEventListener( 'click', newGame );
                pauseBtn.addEventListener( 'click', function () { if( paused ) resume(); else pause(); } );

                overBtnEl.addEventListener( 'click', function ()
                {
                    if     ( overBtnEl.dataset.kind === 'win'    ) keepGoing();
                    else if( overBtnEl.dataset.kind === 'paused' ) resume();
                    else newGame();
                } );

                newGame();
                return { enter: enter, leave: leave };
            }

            return { init: init, adoptBest: adoptBest };
        } )();

        NayiveGames.add( 'g2048', G2048 );
    } )();
    </script>
