<!-- index.html - Games: the small games that run entirely in the browser.

     This file is the shell: the header, the Games screen (the six cards),
     the code the six games share and the store over data/games/games.json
     that holds each game's record. Each game is a file of its own beside
     it - sudoku.html, g2048.html, mines.html, invaders.html, asteroids.html
     and tetris.html - with its own style, pane and script. All six are
     fetched and mounted at boot (see THE SIX GAMES below), so the page that
     runs is the same one this file was when it held them all.

     The header is the whole navigation: on the Games screen it is only the
     app name; open a game and the name becomes the game's (a click on it is
     the way back) and the game's own toolbar takes the middle. The
     { enter, leave } pair every game registers is what keeps exactly one of
     them live. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Games</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='6' y1='11' x2='10' y2='11'/%3E%3Cline x1='8' y1='9' x2='8' y2='13'/%3E%3Cline x1='15' y1='12' x2='15.01' y2='12'/%3E%3Cline x1='18' y1='10' x2='18.01' y2='10'/%3E%3Cpath d='M17.32 5H6.68a4 4 0 0 0-3.98 3.59c-.08.67-.7 5.87-.7 7.41a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.54-.62-6.74-.7-7.41A4 4 0 0 0 17.32 5z'/%3E%3C/svg%3E">

    <!-- Shared colour scheme. Apply the saved choice before first paint to avoid a flash. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <!-- Offline-capable persistence: local last-known-good cache + write-behind sync. -->
    <script src="../shared/store.js" defer></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS (and localhost). -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <style>
        /* The shell (.app / .topbar / .icon-btn / .empty-state) is all in
           ../shared/app.css. Only what is unique to Games lives here: the
           header, the Games screen and what the six games share. Each game's
           own rules are in its file. */

        /* TOOL SHELL (see APP SHELL in app.css): .app is height: 100%, so the
           page under it has to be too, and the page itself never scrolls -
           .game-host does. It is what lets a game centre itself in the pane
           instead of piling up under the header. */
        html, body { height: 100%; overflow: hidden; }

        /* THE HEADER IS THE WHOLE NAVIGATION, and it has two states.

               [gamepad] Games                                       [?] [plug]
               [gamepad] Minesweeper  | [9x9][16][30] * 10 0:00 -- [new] | [?] [plug]

           On the Games screen it is only the app name; open a game and the
           NAME becomes the game's, and the game's own toolbar takes the middle.
           There are no game buttons in the header any more - the six cards in
           the pane below are the way in, and the name is the way back.

           Centring the middle group takes two things. First the two outer
           blocks share the slack equally (both `flex: 1 1 0`), which replaces
           app.css's `margin-left: auto` on .topbar-actions - an auto margin
           there would shove the group left of centre. That alone still leaves
           it 6px off, because the left side also carries 36px the right side
           does not: the 20px app icon, its 6px margin and the title's 10px one.
           So the right block opens with a 36px counterweight, and the group
           lands dead centre.

           The counterweight has to be PADDING on the right block. Putting it
           inside as a `::before` spacer does nothing: that block's width comes
           from flex-grow, not from its content, so a spacer within it never
           moves its edge. Nor can the padding be made to shrink - a wrapping
           flex row breaks onto a new line BEFORE it shrinks anything - so the
           phone block below simply takes it back off.

           A toolbar is wider than the six buttons it replaces (Minesweeper's is
           the widest: three levels, three counters and "new game"), so on a
           phone the header wraps to a second row with some games open. That
           costs nothing in height overall - the pane below gave up exactly this
           row to hand it over - and it is the reason .game-options is allowed
           to wrap as a UNIT and never inside itself. */
        .topbar h1 { flex: 1 1 0; min-width: 0; }

        /* The app name is plain text and the launcher link app.css wires
           (.nayive-home-link); the GAME name is a <button> inside the same h1,
           and shared/ui.js's home handler steps aside for any button in the
           header - so the two live in one element with no flag to keep in step.
           The name is cut with an ellipsis and never by counting characters:
           the six names are translated (Venator pyrobolorum is the long one)
           and a cut that is right in English is wrong in Latin. */
        .topbar h1.has-game                     { color: var(--text); cursor: default; }
        .topbar h1.has-game:hover               { text-decoration: none; }
        .game-title
        {
            display: block; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            padding: 0; border: 0; background: none; cursor: pointer;
            font: inherit; color: var(--accent); text-align: left;
        }
        .game-title:hover { text-decoration: underline; text-underline-offset: 3px; }

        /* The middle: the open game's toolbar, between two rules. It wraps to a
           row of its own before anything inside it does - nowrap on the slot,
           and the .view-bar inside it gives up the padding and the bottom line
           it wears in a pane, where it is a row across the top of the board. */
        .game-options
        {
            display: flex; align-items: stretch; gap: 6px;
            flex: 0 1 auto; min-width: 0; max-width: 100%;
        }
        .game-options .tb-sep   { width: 1px; align-self: stretch; margin: 4px 0; background: var(--line); flex: 0 0 auto; }
        .game-options-slot      { display: flex; align-items: center; min-width: 0; }
        .game-options .view-bar { padding: 0; border-bottom: 0; flex-wrap: nowrap; gap: var(--space-2); }
        /* In a pane the counters take the slack between the two button groups;
           in the header the whole group sits at its own width, or it would push
           the rules out to the edges of an empty row. */
        .game-options .game-stats { flex: 0 0 auto; }

        .topbar .topbar-actions { flex: 1 1 0; margin-left: 0; justify-content: flex-end; padding-left: 36px; }

        /* THE GAMES SCREEN - the launcher's own tile, one level down: the icon
           over the name, the whole card the way in, and no ">" on it. */
        .games-home
        {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100%; padding: 24px 16px; box-sizing: border-box;
        }
        .games-grid { display: grid; grid-template-columns: repeat( 3, 1fr ); gap: 14px 20px; justify-items: center; }
        .game-tile
        {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            width: clamp( 88px, 27vw, 118px ); padding: 16px 8px 12px;
            border: 0; border-radius: var(--radius-l); background: none; cursor: pointer;
            color: var(--text); font: inherit;
            transition: background .12s ease, transform .1s ease;
        }
        .game-tile:hover  { background: color-mix( in srgb, var(--accent) 12%, transparent ); }
        .game-tile:active { transform: scale( 0.95 ); }
        .game-tile svg    { width: 40px; height: 40px; color: var(--accent); flex: 0 0 auto; }
        .game-tile span   { font-size: 0.85rem; color: var(--text-dim); text-align: center; line-height: 1.2; }
        .game-tile:hover span { color: var(--text); }

        /* PHONE (the one breakpoint, see TWO LAYOUT MODES in app.css). A 390px
           row cannot hold the app name AND a toolbar, and sharing the slack
           between them is the wrong answer: the h1 has a 0 flex-basis, so it
           gives up ALL of its width and the game's name - the thing that says
           where you are - is what disappears. So the phone stops centring and
           takes TWO rows instead:

               [gamepad] Minesweeper                         [?] [plug]
                         | [9x9][16x16][30x16]  * 10  0:00  -- [new] |

           `flex: 1 0 100%` is the row of its own (the .bar-info trick, see
           app.css) and `order: 1` is what puts it under the "?" instead of
           pushing it onto a third line - it comes BEFORE .topbar-actions in the
           markup, where the centred desktop layout needs it. The counterweight
           and the shared slack go with the centring; the actions take their
           auto margin back and sit at the right edge of row 1.

           The Games screen keeps ONE row: the block is [hidden] there. */
        @media (max-width: 640px)
        {
            .topbar h1                { flex: 1 1 auto; }
            .topbar .topbar-actions   { flex: 0 0 auto; margin-left: auto; padding-left: 0; }
            .game-options             { order: 1; flex: 1 0 100%; justify-content: center; gap: 4px; }
            .game-options .view-bar   { gap: 10px; }
            .game-options .game-stats { gap: 10px; }
            .games-grid               { gap: 8px 6px; }
            .game-tile                { width: 100%; max-width: 116px; padding: 12px 4px 10px; }
        }

        /* The work area: one pane per game, only the active one shown. It fills
           what the header leaves and scrolls by itself (tool shell, see app.css). */
        .game-host         { flex: 1 1 auto; min-height: 0; overflow: auto; }
        .game-pane         { display: none; height: 100%; }
        .game-pane.is-open { display: block; }

        /* THE COVER - what sits over a game that is not running: "ready",
           "paused" and "game over", and it is the same card in all six. Over the
           PLAY AREA and never over the header, so the game's name (the way back)
           and its toolbar stay live and an unfinished game can be left the way
           any other pane is left.

           It was written out four times - .g2048-over, .inv-over, .ast-over and
           .tet-over, the same nine lines each - before Minesweeper and Sudoku
           were going to make it six. The per-game class stays on the element for
           the few rules that really are its own; everything here is shared.

           `cursor: pointer` is not: the three canvas games take a click anywhere
           on the card, because on a phone the whole card is the target you
           actually hit, and the other three have a real button in the middle. */
        .game-cover
        {
            position: absolute; inset: 0; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            padding: 16px; box-sizing: border-box; text-align: center;
            border-radius: var(--radius-m);
            background: color-mix( in srgb, var(--card2) 86%, transparent );
        }
        .game-cover.tappable { cursor: pointer; }
        /* The two timed games cover the board SOLIDLY, and the others do not.
           86% of --card2 over a small canvas hides it; over a 440px Sudoku grid
           it does not, and a board that can still be read with the clock stopped
           is not a pause, it is free thinking time. Nothing is lost by hiding it
           whole - there is no animation to keep an eye on underneath. */
        .game-cover.solid    { cursor: pointer; background: var(--bg); }
        .game-cover-t { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--text); }
        .game-cover-s { margin: 0; font-size: 0.85rem; color: var(--text-dim); }

        /* The counters take the slack between the two button groups, so they
           read as centred while the groups stay pinned to the two edges. This
           is NOT the shared .bar-info: that one is `flex: 1 0 100%`, a row of
           its own under the toolbar, and these belong on the line.

           It is .game-stats and not .mines-stats because Sudoku's toolbar
           carries the same pair - a clock and a record - in the same place. */
        .game-stats       { display: flex; align-items: center; justify-content: center; gap: 16px;
                            flex: 1 1 auto; min-width: 0; font-size: 0.85rem; color: var(--text-dim);
                            font-variant-numeric: tabular-nums; }
        .game-stat        { display: inline-flex; align-items: center; gap: 5px; }
        .game-stat svg    { width: 15px; height: 15px; flex: 0 0 auto; }
        .game-stat b      { font-weight: 600; color: var(--text); }

        /* PHONE: the counters close up. Every game's, not only
           Minesweeper's, whose phone block it used to sit in. */
        @media (max-width: 640px)
        {
            .game-stats            { gap: 12px; }
        }


    </style>
</head>

<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <header class="topbar">
            <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"></line><line x1="8" y1="9" x2="8" y2="13"></line><line x1="15" y1="12" x2="15.01" y2="12"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59c-.08.67-.7 5.87-.7 7.41a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.54-.62-6.74-.7-7.41A4 4 0 0 0 17.32 5z"></path></svg>
            <h1 id="appTitle">Games</h1>


            <!-- The game's own toolbar lands here when a game is open: the six
                 games' .view-bars are MOVED into the slot at boot, and only the
                 open game's is on screen. The two .tb-sep rules are what set the
                 group apart from the app name on one side and the "?" on the
                 other - the header is a single row of three unrelated things,
                 and without them the score reads as part of the title. The
                 whole block is [hidden] on the Games screen, rules and all. -->
            <div class="game-options" id="gameOptions" hidden>
                <span class="tb-sep"></span>
                <div class="game-options-slot" id="gameOptionsSlot"></div>
                <span class="tb-sep"></span>
            </div>

            <div class="topbar-actions">
                <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </button>
                <button id="syncIndicator" class="sync-indicator" type="button" data-i18n-attr="title:ui.sync.synced"></button>
            </div>
        </header>

        <!-- The Games screen, and after it one pane per game, each added at
             boot from the game's own file (see mount()) - and only one of the
             seven is ever open. -->
        <div class="game-host" id="gameHost">
            <!-- THE GAMES SCREEN. The app opens here and every game comes
                 back here, so it is the one pane that is not a game: six cards,
                 the same shape as the launcher's own tiles (icon over name), and
                 the card itself opens the game - there is no ">" button on it.
                 The header carries no game buttons at all now; this grid IS the
                 way in, and the app name it replaces is the way back. -->
            <section class="game-pane is-open" data-pane="home">
                <div class="games-home">
                    <div class="games-grid">
                        <button class="game-tile" type="button" data-game="sudoku">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="18" y1="18" x2="18.01" y2="18"></line></svg>
                            <span data-i18n="games.sudoku"></span>
                        </button>
                        <button class="game-tile" type="button" data-game="g2048">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"></rect><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"></rect><rect x="3.5" y="13" width="17" height="7.5" rx="1.5"></rect></svg>
                            <span data-i18n="games.g2048"></span>

                        <button class="game-tile" type="button" data-game="mines">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="13.5" r="7.5"></circle><path d="M14.5 6.5 16.3 4.7a2.4 2.4 0 0 1 3.4 0l1.6 1.6a2.4 2.4 0 0 1 0 3.4L19.5 11.5"></path><line x1="22" y1="2" x2="20.5" y2="3.5"></line></svg>

    </div>

    <div id="toast" class="toast"></div>

    <script>
    ( function ()
    {
        'use strict';

        var T  = function ( k ) { return NayiveUI.t( k ); };
        var TF = function ( k, v ) { return NayiveUI.tf( k, v ); };

        var FILE  = 'data/games/games.json';   // the whole app in one file: the best score of each game
        var store = null;                      // built in boot(), once the deferred scripts have run

        var tiles   = null;                    // the six cards on the Games screen
        var panes   = null;
        var titleEl = null;                    // the <h1>: the app name, or the open game's
        var optsEl  = null;                    // the header's middle: the open game's toolbar
        var slotEl  = null;
        var current = '';                      // '' while the Games screen is up

        //------------------------------------------------------------------------//
        // HOW A GAME MOUNTS INTO ITS PANE
        //
        // A game registers { enter, leave } under its card's data-game name.
        // showGame() calls leave() on the pane going off screen and enter() on
        // the one coming on, so exactly one game is ever live. 2048 and Sudoku
        // both use it to own the keyboard only while theirs is the pane on
        // screen - and so does Tetris; the three of them answer the same arrow
        // keys, so without it the hidden ones would move too. The three canvas
        // games use it to stop their LOOP as well, without which the aliens keep
        // marching, the rocks keep drifting and the pieces keep falling behind
        // whatever pane is on screen, and six games end up running at once.
        // Every pane has an entry here now.
        //
        // THE GAMES SCREEN IS THE SEVENTH PANE and the one that is not a game:
        // it has no entry in GAMES, so leaving it costs nothing and arriving at
        // it is only a pane switch. It is also the only state in which the
        // header carries no toolbar - which is why showGame() and goHome() are
        // the two halves of one thing, and why both go through paint().

        var GAMES = {};

        // The header follows the pane. `name` is '' for the Games screen.
        function paint( name )
        {
            var game = !! name;
            var bar  = game ? slotEl.querySelector( '[data-options="' + name + '"]' ) : null;

            // The h1 holds a <button> while a game is open. shared/ui.js's
            // launcher link is on the h1 itself and steps aside for any button
            // inside the header, so the two never fight over the same click.
            titleEl.classList.toggle( 'has-game', game );
            if( game )
            {
                titleEl.innerHTML = '';
                titleEl.appendChild( gameTitleBtn( T( 'games.' + name ) ) );
            }
            else
            {
                titleEl.textContent = 'Games';
            }

            Array.prototype.forEach.call( slotEl.children, function ( el )
            {
                el.hidden = el !== bar;
            } );

            // A game with no toolbar at all would leave the two rules floating
            // around an empty box, so the whole block goes with it.
            optsEl.hidden = ! bar;
        }

        function gameTitleBtn( name )
        {
            var b = document.createElement( 'button' );

            b.type      = 'button';
            b.className = 'game-title';
            b.textContent = name;
            // title and NOT aria-label: this button has text, and an aria-label
            // would replace it - the page's <h1> would read "Back to all the
            // games" instead of the name of the game you are looking at. The
            // suite's icon-only buttons carry both because they have no text.
            b.title     = T( 'games.backToGames' );
            b.addEventListener( 'click', goHome );

            return b;
        }

        function showGame( name )
        {
            if( current && current !== name && GAMES[ current ] && GAMES[ current ].leave )
                GAMES[ current ].leave();

            current = name;
            panes.forEach( function ( p ) { p.classList.toggle( 'is-open', p.dataset.pane === name ); } );
            paint( name );

            if( GAMES[ name ] && GAMES[ name ].enter ) GAMES[ name ].enter();
        }

        // Back to the six cards. leave() first, and for the same reason
        // showGame() calls it: a canvas game left running behind the Games
        // screen would still hold the arrow keys and still burn a frame budget.
        function goHome()
        {
            if( current && GAMES[ current ] && GAMES[ current ].leave )
                GAMES[ current ].leave();

            current = '';
            panes.forEach( function ( p ) { p.classList.toggle( 'is-open', p.dataset.pane === 'home' ); } );
            paint( '' );
        }

        // m:ss, clamped at 99:59 - the shape both timed games print. Their
        // clocks are their own (two timestamps each, see seconds()); only the
        // formatting is shared.
        function clock( s )
        {
            s = Math.min( Math.max( s, 0 ), 99 * 60 + 59 );
            return Math.floor( s / 60 ) + ':' + NayiveUI.pad2( s % 60 );
        }


        // A key press no game may answer. Two rules, both of them the whole
        // suite's rather than any one game's: a sheet is over the app - the help
        // dialog, the install prompt, "session expired" - and it has swallowed
        // the keys; or the caret is in a field. Five of the six games asked this
        // in the same two lines before anything else, and now ask it in one.
        function keyBusy( e )
        {
            var el = e.target;

            if( document.querySelector( '.sheet-backdrop.open' ) ) return true;
            return !! ( el && ( el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable ) );
        }

        // The toolbar's play / pause button, in all six games. It is one button
        // wearing two glyphs, and the state it is in has to reach three places:
        // which glyph shows, what the tooltip says, and whether it can be
        // pressed at all (a game that has not started and a game that is over
        // are both nothing to pause).
        //
        // toggleAttribute and NOT `.hidden`: an <svg> is an SVGElement, which
        // has no `hidden` IDL property - assigning to it makes an expando and
        // the [hidden] rule never moves. Two of the three canvas games had it
        // the wrong way round and their button never became a play triangle;
        // there is one copy of it now, and it is the right one.
        function pauseButton( btn, paused, disabled )
        {
            btn.disabled = ! ! disabled;
            btn.title    = T( paused ? 'games.resume' : 'games.pause' );
            btn.setAttribute( 'aria-label', btn.title );
            btn.querySelector( '[data-ic="pause"]' ).toggleAttribute( 'hidden', !! paused );
            btn.querySelector( '[data-ic="play"]'  ).toggleAttribute( 'hidden', ! paused );
        }

        // A record only ever goes UP. The plug re-reads the file on focus and on
        // a tap, and that answer can be OLDER than the game being played right
        // now - our own write may still be in the outbox - so a score beaten on
        // the phone is picked up here and one beaten here is never thrown away.
        // The four games that keep a score all merge it this way; the two that
        // keep a time point the same rule the other way (see adoptTimes).
        function keepBest( have, n, el )
        {
            var best = n > have ? n : have;

            el.textContent = String( best );
            return best;
        }

        //------------------------------------------------------------------------//
        // THE CANVAS GAMES' LOOP
        //
        // The frames drive an accumulator and nothing else: the game always
        // advances in whole 1/60 s steps, so it plays the same on a 60 Hz laptop
        // and a 120 Hz phone, and a frame the browser was late with is made up
        // by taking two steps rather than by moving everything twice as far.
        //
        // The contract is two functions and no arguments - step() moves the
        // world on by exactly STEP, draw() paints whatever state it is in - so a
        // game keeps its own constants in whatever unit suits it.
        //
        // Space Invaders wrote this and kept it to itself while it was the only
        // canvas game; it moved out here when Asteroids became the second, the
        // same way clock() sat inside Minesweeper until Sudoku needed it.
        var STEP = 1000 / 60;                  // one game step, in milliseconds

        function gameLoop( step, draw )
        {
            var raf = 0, last = 0, acc = 0;

            function frame( now )
            {
                var dt;

                // Asked for FIRST, so that a halt() from inside step() - which
                // is how a finished game stops itself - really does stop the
                // loop instead of being overwritten a line later.
                raf = requestAnimationFrame( frame );

                dt   = last ? now - last : STEP;   // the first frame is one step, not the gap since the last one
                last = now;

                // A quarter of a second is the most that is ever made up at
                // once. Without the cap, a tab that was away for a minute would
                // run 3600 steps in one frame - and the game would be over
                // before it was drawn.
                if( dt > 250 ) dt = 250;

                acc += dt;
                while( acc >= STEP ) { step(); acc -= STEP; }

                draw();
            }

            return {
                run:  function () { if( raf ) return; last = 0; acc = 0; raf = requestAnimationFrame( frame ); },
                halt: function () { if( raf ) cancelAnimationFrame( raf ); raf = 0; }
            };
        }


        //------------------------------------------------------------------------//
        // THE ARCADE SHELL  - what the three canvas games have in common
        //
        // Space Invaders, Asteroids and Tetris are one shape: a <canvas>, a
        // gameLoop(), and four still states behind one overlay - ready, paused
        // and over, plus playing, which is the one with nothing over it. Every
        // part of that shape was written three times, and by the third it was
        // byte for byte the same, so it is written once here instead:
        //
        //   - play / pause / resume, and the rule that a hidden tab or an
        //     unfocused window pauses a game but never resumes it;
        //   - the overlay's three sets of words, and the pause button's two
        //     icons;
        //   - enter / leave: the arrow keys are owned only while the pane is on
        //     screen, and leaving stops the loop, lets go of every held key and
        //     writes the record;
        //   - the wiring each init() did by hand - the overlay, the tap on the
        //     play area, the pause and "new game" buttons, the held-key row,
        //     visibilitychange, blur, the theme change and the ResizeObserver.
        //
        // What it deliberately does NOT own is `state`. Each game asks
        // `state === 'playing'` inside its step(), its draw() and its onKey(),
        // dozens of times over, and threading an accessor through all of that
        // would cost far more than the four functions here save. So the game
        // keeps the variable and hands over the two lines that touch it.
        //
        // It DOES own `live`, which each game read exactly once (in onKey), and
        // the loop, which a game reaches through `A.loop` when its own step()
        // has to halt it.
        //
        // Invaders is the one that is not quite the other two: it can pause out
        // of `dying` and `wave` as well as `playing`, and comes back to
        // whichever it was. That is what `runs` and `held` are for; the other
        // two pass nothing and take the default.

        function arcade( o )
        {
            var loop    = gameLoop( o.step, o.draw );
            var noop    = function () {};
            var live    = false;                   // is this the pane on screen?
            var held    = '';                      // the state a pause interrupted
            var runs    = o.runs  || [ 'playing' ];
            var flush   = o.flush || noop;         // Invaders writes its record as it goes
            var palette = o.palette || noop;
            var fit     = o.fit     || noop;
            var els     = o.els;

            function overlay()
            {
                var state = o.getState();
                var title = '', sub = '', btn = '';

                if( state === 'ready' )
                {
                    title = T( o.readyKey );
                    btn   = T( 'games.play' );
                }
                else if( state === 'paused' )
                {
                    title = T( 'games.paused' );
                    sub   = TF( 'games.scoreIs', { n: o.score() } );
                    btn   = T( 'games.resume' );
                }
                else if( state === 'over' )
                {
                    title = T( 'games.gameOver' );
                    sub   = TF( 'games.scoreIs', { n: o.score() } );
                    btn   = T( 'games.newGame' );
                }

                els.overTitle.textContent = title;
                els.overSub.textContent   = sub;
                els.overSub.hidden        = ! sub;
                els.overBtn.textContent   = btn;
                els.over.hidden           = ! btn;

                pauseButton( els.pause, state === 'paused', state === 'ready' || state === 'over' );
            }

            // The overlay's button, a tap on the play area, the first key press
            // and the toolbar's "new game" all arrive here.
            function play()
            {
                var state = o.getState();

                if( state === 'paused' ) { resume(); return; }
                if( state !== 'ready' && state !== 'over' ) return;

                if( state === 'over' ) o.reset();

                o.setState( 'playing' );
                overlay();
                loop.run();
                els.canvas.focus();            // ...or the next space re-clicks the button behind it
            }

            function pause()
            {
                var state = o.getState();

                if( runs.indexOf( state ) < 0 ) return;

                held = state;
                o.setState( 'paused' );
                loop.halt();
                o.clearKeys();
                flush();
                overlay();
                o.draw();
            }

            function resume()
            {
                if( o.getState() !== 'paused' ) return;

                o.setState( held || 'playing' );
                overlay();
                loop.run();
                els.canvas.focus();
            }

            function toggle() { if( o.getState() === 'paused' ) resume(); else pause(); }

            function enter()
            {
                live = true;
                palette();
                fit();
                o.draw();

                document.addEventListener( 'keydown', o.onKey );
                document.addEventListener( 'keyup',   o.onKeyUp );
            }

            function leave()
            {
                live = false;
                pause();
                o.clearKeys();
                flush();

                document.removeEventListener( 'keydown', o.onKey );
                document.removeEventListener( 'keyup',   o.onKeyUp );
            }

            // Everything each init() used to wire by hand. It is called at the
            // END of the game's own init(), once every element it names exists.
            function wire( opt )
            {
                opt = opt || {};

                // A tap on the play area starts or resumes the game - the
                // overlay's button is small, and on a phone the thumb is already
                // there. It never moves anything: a mis-tap while playing must
                // not cost a placement.
                //
                // Invaders passes `tap: false` and wires the canvas itself: the
                // same finger that starts the game also DRAGS the ship, so the
                // press has to be one handler that knows both jobs.
                if( opt.tap !== false )
                    els.canvas.addEventListener( 'pointerdown', function ( e )
                    {
                        e.preventDefault();
                        if( opt.focusOnTap ) els.canvas.focus();
                        play();
                    } );

                // One listener for the whole overlay, not just its button: on a
                // phone the whole card is the target you actually hit.
                els.over.addEventListener( 'click', play );
                els.pause.addEventListener( 'click', toggle );
                if( els.newGame )
                    els.newGame.addEventListener( 'click', function () { o.reset(); play(); } );

                // The held-key row (Asteroids and Tetris). The keys are held
                // down rather than tapped, so every way a pointer can leave one
                // has to let it go - up, cancel and leave all arrive at the same
                // handler, which reads the event type.
                if( opt.pads )
                    Array.prototype.slice.call( document.querySelectorAll( opt.pads.sel ) ).forEach( function ( b )
                    {
                        opt.pads.keep( b );

                        b.addEventListener( 'pointerdown',   opt.pads.on );
                        b.addEventListener( 'pointerup',     opt.pads.on );
                        b.addEventListener( 'pointercancel', opt.pads.on );
                        b.addEventListener( 'pointerleave',  opt.pads.on );
                        b.addEventListener( 'contextmenu',   function ( e ) { e.preventDefault(); } );
                    } );

                // Nothing runs behind a hidden tab or an unfocused window - and
                // neither of them RESUMES the game either: it waits behind the
                // pause overlay for the player to come back to it.
                document.addEventListener( 'visibilitychange', function () { if( document.hidden ) pause(); } );
                window.addEventListener( 'blur', pause );

                // The scheme can change from another tab (theme.js listens to
                // "storage"), and a canvas colour is a copy, not a var() link.
                window.addEventListener( 'balata:themechange', function () { palette(); o.draw(); } );

                if( window.ResizeObserver ) new ResizeObserver( fit ).observe( els.canvas );
                else window.addEventListener( 'resize', fit );
            }

            return {
                loop: loop, overlay: overlay, play: play, pause: pause,
                resume: resume, enter: enter, leave: leave, wire: wire,
                isLive: function () { return live; }
            };
        }

        //------------------------------------------------------------------------//
        // THE SIX GAMES - one file each
        //
        // Every game is a file of its own beside this one, holding its style,
        // its pane and its script, so one game can be changed without
        // scrolling past the other five. All six are fetched at boot, at the
        // same time as the dictionary, and mounted before start() - which then
        // finds exactly the page it did when they were all in here.
        //
        // A game's script reaches the helpers above through window.NayiveGames
        // and hands its module back with NayiveGames.add( name, module ).

        var FILES = [ 'sudoku', 'g2048', 'mines', 'invaders', 'asteroids', 'tetris' ];   // the cards' order
        var MODS  = {};                        // name -> the module its file handed back
        var G2048, Mines, Sudoku, Invaders, Asteroids, Tetris;

        window.NayiveGames = {
            T: T, TF: TF, STEP: STEP, clock: clock, keyBusy: keyBusy,
            pauseButton: pauseButton, keepBest: keepBest, gameLoop: gameLoop,
            arcade: arcade, saveBest: saveBest, saveTime: saveTime,
            add: function ( name, mod ) { MODS[ name ] = mod; }
        };

        var fetched = Promise.all( FILES.map( function ( name )
        {
            return fetch( name + '.html' ).then( function ( r )
            {
                if( ! r.ok ) throw new Error( name + '.html: HTTP ' + r.status );
                return r.text();
            } );
        } ) );

        // The style goes into <head>, after this file's own; the pane into
        // #gameHost; and the script is made again, because a parsed script
        // element never runs. The sourceURL line is what names the file in the console
        // and the debugger.
        function mount( name, text )
        {
            var doc  = new DOMParser().parseFromString( text, 'text/html' );
            var pane = doc.querySelector( 'section.game-pane' );
            var js   = document.createElement( 'script' );

            Array.prototype.forEach.call( doc.querySelectorAll( 'style' ), function ( s ) { document.head.appendChild( s ); } );
            document.getElementById( 'gameHost' ).appendChild( pane );
            NayiveI18n.applyI18n( pane );      // now, not when the observer gets to it: init() may read it

            js.textContent = doc.querySelector( 'script' ).textContent + '\n//# sourceURL=' + name + '.html';
            document.body.appendChild( js );

            // An error inside the game's script goes to the console and not to
            // here, so say which file it was rather than fail later in init().
            if( ! MODS[ name ] ) throw new Error( name + '.html did not register its game' );
        }

        //------------------------------------------------------------------------//
        // PERSISTENCE - one file, one record per game:
        //
        //     { "best":  { "g2048": 12345, "invaders": 3120, "asteroids": 8400,
        //                  "tetris": 24500 },
        //       "times": { "easy": 47, "medium": 210, "hard": 999,
        //                  "sudokuEasy": 421, "sudokuMedium": 903 } }
        //
        // Two maps because there are two kinds of record: 2048 and the three
        // canvas games keep a SCORE, where more is better, and Minesweeper and
        // Sudoku keep a TIME per difficulty, where less is. Each is merged its
        // own way (see adoptBest / adoptTimes).
        //
        // The two timed games share the one `times` map and each reads only the
        // keys it knows: Minesweeper was first and took the bare easy / medium /
        // hard, so Sudoku's carry its name. A third timed game only has to pick
        // a prefix of its own.
        //
        // The board itself is not saved. A game is one sitting, and writing it
        // would PUT the whole file on every arrow key; only the record outlives
        // the visit.

        var data   = { best: {}, times: {} };   // the file as last read, kept whole so
                                                // another game's record is never written over
        var loaded = false;          // false = we do not know what is in the file

        async function loadData()
        {
            var res = await store.read( FILE );

            if( res.source === 'empty' )
            {
                data   = { best: {}, times: {} };   // no games.json yet - a safe first run
                loaded = true;
            }
            else if( res.body !== null )
            {
                try
                {
                    var parsed = JSON.parse( res.body );

                    data = ( parsed && typeof parsed === 'object' && ! Array.isArray( parsed ) ) ? parsed : {};
                    if( ! data.best  || typeof data.best  !== 'object' ) data.best  = {};
                    if( ! data.times || typeof data.times !== 'object' ) data.times = {};
                    loaded = true;
                }
                catch ( e )
                {
                    // A damaged file reads as "no record" and is never written over.
                    data   = { best: {}, times: {} };
                    loaded = false;
                }
            }
            // else: the server was unreachable AND nothing is cached (res.source
            // is 'unknown', or 'unauth' with no cached copy). Leave what we have
            // alone and stay unloaded - writing now is exactly what would
            // overwrite the real file with an empty one.

            // Both directions at once: a record set on another device is
            // adopted, and one set here since the last read is written back.
            saveBest( 'g2048',    G2048.adoptBest(    Number( data.best.g2048    ) || 0 ) );
            saveBest( 'invaders', Invaders.adoptBest( Number( data.best.invaders ) || 0 ) );
            saveBest( 'asteroids', Asteroids.adoptBest( Number( data.best.asteroids ) || 0 ) );
            saveBest( 'tetris',    Tetris.adoptBest(    Number( data.best.tetris    ) || 0 ) );

            var mineTimes = Mines.adoptTimes( data.times );
            Object.keys( mineTimes ).forEach( function ( k ) { saveTime( k, mineTimes[ k ] ); } );

            var sudokuTimes = Sudoku.adoptTimes( data.times );
            Object.keys( sudokuTimes ).forEach( function ( k ) { saveTime( k, sudokuTimes[ k ] ); } );
        }

        // Writes the local copy now and queues the upload; the store flushes it
        // on a short timer, on reconnect or on tab focus. Fire-and-forget.
        function saveBest( game, score )
        {
            if( ! loaded ) return;                         // we do not know the file: do not write it
            if( score <= ( Number( data.best[ game ] ) || 0 ) ) return;

            data.best[ game ] = score;
            store.write( FILE, JSON.stringify( data, null, 2 ) );
        }

        // The same, for the other kind of record: a time, where the merge is a
        // MINIMUM. A missing or damaged entry reads as NaN, which is not
        // finite, so a first record always wins - and a real 0 does not read as
        // "no record yet" the way `|| 0` made it.
        function saveTime( level, secs )
        {
            var have = Number( data.times[ level ] );

            if( ! loaded ) return;
            if( isFinite( have ) && secs >= have ) return;

            data.times[ level ] = secs;
            store.write( FILE, JSON.stringify( data, null, 2 ) );
        }

        //------------------------------------------------------------------------//
        // BOOT

        function start()
        {
            tiles   = Array.prototype.slice.call( document.querySelectorAll( '.game-tile[data-game]' ) );
            panes   = Array.prototype.slice.call( document.querySelectorAll( '.game-pane' ) );
            titleEl = document.getElementById( 'appTitle' );
            optsEl  = document.getElementById( 'gameOptions' );
            slotEl  = document.getElementById( 'gameOptionsSlot' );

            tiles.forEach( function ( b )
            {
                b.addEventListener( 'click', function () { showGame( b.dataset.game ); } );
            } );

            // Escape is the way back on a keyboard - the same thing the game's
            // name does with a click, from any of the six and whatever the game
            // is doing. goHome() calls leave(), so the loop stops, the held keys
            // are let go and the record is written, exactly as it is when the
            // name is clicked.
            //
            // keyBusy() is what keeps it out of the way of everything else that
            // answers Escape: a sheet over the app (the help dialog, the install
            // prompt, "session expired") closes itself instead of dropping the
            // game behind it, and a field with the caret in it keeps its own.
            // On the Games screen there is nothing to go back from, so `current`
            // being empty ends it before any of that.
            //
            // It used to be the second pause key in Invaders and Tetris. It is
            // not any more - `p` is, in both - because a key that means "out of
            // here" everywhere else in the suite cannot mean "wait a moment" in
            // two of six games.
            document.addEventListener( 'keydown', function ( e )
            {
                if( e.key !== 'Escape' || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( ! current || keyBusy( e ) ) return;

                e.preventDefault();
                goHome();
            } );

            GAMES.sudoku   = Sudoku.init();
            GAMES.g2048    = G2048.init();
            GAMES.mines    = Mines.init();
            GAMES.invaders = Invaders.init();
            GAMES.asteroids = Asteroids.init();
            GAMES.tetris   = Tetris.init();

            // The six toolbars are written inside their panes - that is where
            // they are read, next to the board they act on - and MOVED into the
            // header here, after every init() has taken its references. A moved
            // node keeps its listeners and its id, so nothing above knows.
            Array.prototype.slice.call( document.querySelectorAll( '.view-bar[data-options]' ) )
                 .forEach( function ( bar ) { slotEl.appendChild( bar ); } );

            goHome();

            NayiveUI.firstRun( {
                app:   'games',
                title: 'Games',
                lead:  [ T( 'games.introLead' ), T( 'games.introBack' ) ],
                buttons: [
                    { sel: '.game-tile[data-game="sudoku"]',    text: T( 'games.introSudoku' ) },
                    { sel: '.game-tile[data-game="g2048"]',     text: T( 'games.intro2048' ) },
                    { sel: '.game-tile[data-game="mines"]',     text: T( 'games.introMines' ) },
                    { sel: '.game-tile[data-game="invaders"]',  text: T( 'games.introInvaders' ) },
                    { sel: '.game-tile[data-game="asteroids"]', text: T( 'games.introAsteroids' ) },
                    { sel: '.game-tile[data-game="tetris"]',    text: T( 'games.introTetris' ) },
                    { sel: '#syncIndicator', name: T( 'ui.syncName' ), text: T( 'games.introSync' ) }
                ]
            } );
        }

        Promise.all( [ NayiveI18n.ready, fetched ] ).then( function ( got )
        {
            FILES.forEach( function ( name, i ) { mount( name, got[ 1 ][ i ] ); } );

            G2048     = MODS.g2048;
            Mines     = MODS.mines;
            Sudoku    = MODS.sudoku;
            Invaders  = MODS.invaders;
            Asteroids = MODS.asteroids;
            Tetris    = MODS.tetris;

            store = NayiveStore.createStore( { apiBase: GumApi.API_FILES } );

            start();

            // The store's state machine drives the header plug for every read
            // and write.
            store.onState( NayiveUI.syncIndicator() );

            // The plug's click and the focus / visibilitychange re-reads, all on
            // one guarded path (shared/ui.js). loadData() only ever raises the
            // best figure, so a re-read can never disturb a game in progress -
            // the default guard (any open sheet) is enough here.
            NayiveUI.wireRefresh( { store: store, read: loadData } );

            // Probe the API, then read. On a failed probe the shared helper
            // bounces to the sign-in page only when we are really online with
            // nothing cached; otherwise it opens on the local cache and the
            // store syncs once the connection is back.
            NayiveUI.bootWithStore( store, loadData );
        } );
    } )();
    </script>

</body>
</html>
