                    </div>
                </div>
            </section>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
    ( function ()
    {
        'use strict';

        var T  = function ( k ) { return NayiveUI.t( k ); };
        var TF = function ( k, v ) { return NayiveUI.tf( k, v ); };

        var FILE  = 'data/games/games.json';   // the whole app in one file: the best score of each game
        var store = null;                      // built in boot(), once the deferred scripts have run

        var tiles   = null;                    // the nine cards on the Games screen
        var panes   = null;
        var titleEl = null;                    // the <h1>: the app name, or the open game's
        var optsEl  = null;                    // the header's middle: the open game's toolbar
        var slotEl  = null;
        var current = '';                      // '' while the Games screen is up

        //------------------------------------------------------------------------//
        // HOW A GAME MOUNTS INTO ITS PANE
        //
        // A game registers { enter, leave } under its card's data-game name.
        // showGame() calls leave() on the pane going off screen and enter() on
        // the one coming on, so exactly one game is ever live. 2048 and Sudoku
        // both use it to own the keyboard only while theirs is the pane on
        // screen - and so does Tetris; the three of them answer the same arrow
        // keys, so without it the hidden ones would move too. The three canvas
        // games use it to stop their LOOP as well, without which the aliens keep
        // marching, the rocks keep drifting and the pieces keep falling behind
        // whatever pane is on screen, and nine games end up running at once.
        // Every pane has an entry here now.
        //
        // THE GAMES SCREEN IS THE TENTH PANE and the one that is not a game:
        // it has no entry in GAMES, so leaving it costs nothing and arriving at
        // it is only a pane switch. It is also the only state in which the
        // header carries no toolbar - which is why showGame() and goHome() are
        // the two halves of one thing, and why both go through paint().

        var GAMES = {};

        // The header follows the pane. `name` is '' for the Games screen.
        function paint( name )
        {
            var game = !! name;
            var bar  = game ? slotEl.querySelector( '[data-options="' + name + '"]' ) : null;

            // The h1 holds a <button> while a game is open. shared/ui.js's
            // launcher link is on the h1 itself and steps aside for any button
            // inside the header, so the two never fight over the same click.
            titleEl.classList.toggle( 'has-game', game );
            document.getElementById( 'gamesBack' ).hidden = ! game;
            if( game )
            {
                titleEl.innerHTML = '';
                titleEl.appendChild( gameTitleBtn( T( 'games.' + name ) ) );
            }
            else
            {
                titleEl.textContent = 'Games';
            }

            Array.prototype.forEach.call( slotEl.children, function ( el )
            {
                el.hidden = el !== bar;
            } );

            // A game with no toolbar at all would leave the two rules floating
            // around an empty box, so the whole block goes with it.
            optsEl.hidden = ! bar;
        }

        function gameTitleBtn( name )
        {
            var b = document.createElement( 'button' );

            b.type      = 'button';
            b.className = 'game-title';
            b.textContent = name;
            // title and NOT aria-label: this button has text, and an aria-label
            // would replace it - the page's <h1> would read "Back to all the
            // games" instead of the name of the game you are looking at. The
            // suite's icon-only buttons carry both because they have no text.
            b.title     = T( 'games.backToGames' );
            b.addEventListener( 'click', goHome );

            return b;
        }

        function showGame( name )
        {
            if( current && current !== name && GAMES[ current ] && GAMES[ current ].leave )
                GAMES[ current ].leave();

            current = name;
            panes.forEach( function ( p ) { p.classList.toggle( 'is-open', p.dataset.pane === name ); } );
            paint( name );

            if( GAMES[ name ] && GAMES[ name ].enter ) GAMES[ name ].enter();
        }

        // Back to the nine cards. leave() first, and for the same reason
        // showGame() calls it: a canvas game left running behind the Games
        // screen would still hold the arrow keys and still burn a frame budget.
        function goHome()
        {
            if( current && GAMES[ current ] && GAMES[ current ].leave )
                GAMES[ current ].leave();

            current = '';
            panes.forEach( function ( p ) { p.classList.toggle( 'is-open', p.dataset.pane === 'home' ); } );
            paint( '' );
        }

        // m:ss, clamped at 99:59 - the shape both timed games print. Their
        // clocks are their own (two timestamps each, see seconds()); only the
        // formatting is shared.
        function clock( s )
        {
            s = Math.min( Math.max( s, 0 ), 99 * 60 + 59 );
            return Math.floor( s / 60 ) + ':' + NayiveUI.pad2( s % 60 );
        }


        // A key press no game may answer. Two rules, both of them the whole
        // suite's rather than any one game's: a sheet is over the app - the help
        // dialog, the install prompt, "session expired" - and it has swallowed
        // the keys; or the caret is in a field. Five of the six games asked this
        // in the same two lines before anything else, and now ask it in one.
        function keyBusy( e )
        {
            var el = e.target;

            if( document.querySelector( '.sheet-backdrop.open' ) ) return true;
            return !! ( el && ( el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable ) );
        }

        // The toolbar's play / pause button, in all nine games. It is one button
        // wearing two glyphs, and the state it is in has to reach three places:
        // which glyph shows, what the tooltip says, and whether it can be
        // pressed at all (a game that has not started and a game that is over
        // are both nothing to pause).
        //
        // toggleAttribute and NOT `.hidden`: an <svg> is an SVGElement, which
        // has no `hidden` IDL property - assigning to it makes an expando and
        // the [hidden] rule never moves. Two of the three canvas games had it
        // the wrong way round and their button never became a play triangle;
        // there is one copy of it now, and it is the right one.
        function pauseButton( btn, paused, disabled )
        {
            btn.disabled = ! ! disabled;
            btn.title    = T( paused ? 'games.resume' : 'games.pause' );
            btn.setAttribute( 'aria-label', btn.title );
            btn.querySelector( '[data-ic="pause"]' ).toggleAttribute( 'hidden', !! paused );
            btn.querySelector( '[data-ic="play"]'  ).toggleAttribute( 'hidden', ! paused );
        }

        // A record only ever goes UP. The plug re-reads the file on focus and on
        // a tap, and that answer can be OLDER than the game being played right
        // now - our own write may still be in the outbox - so a score beaten on
        // the phone is picked up here and one beaten here is never thrown away.
        // The four games that keep a score all merge it this way; the two that
        // keep a time point the same rule the other way (see adoptTimes).
        function keepBest( have, n, el )
        {
            var best = n > have ? n : have;

            el.textContent = String( best );
            return best;
        }

        //------------------------------------------------------------------------//
        // THE CANVAS GAMES' LOOP
        //
        // The frames drive an accumulator and nothing else: the game always
        // advances in whole 1/60 s steps, so it plays the same on a 60 Hz laptop
        // and a 120 Hz phone, and a frame the browser was late with is made up
        // by taking two steps rather than by moving everything twice as far.
        //
        // The contract is two functions and no arguments - step() moves the
        // world on by exactly STEP, draw() paints whatever state it is in - so a
        // game keeps its own constants in whatever unit suits it.
        //
        // Space Invaders wrote this and kept it to itself while it was the only
        // canvas game; it moved out here when Asteroids became the second, the
        // same way clock() sat inside Minesweeper until Sudoku needed it.
        var STEP = 1000 / 60;                  // one game step, in milliseconds

        function gameLoop( step, draw )
        {
            var raf = 0, last = 0, acc = 0;

            function frame( now )
            {
                var dt;

                // Asked for FIRST, so that a halt() from inside step() - which
                // is how a finished game stops itself - really does stop the
                // loop instead of being overwritten a line later.
                raf = requestAnimationFrame( frame );

                dt   = last ? now - last : STEP;   // the first frame is one step, not the gap since the last one
                last = now;

                // A quarter of a second is the most that is ever made up at
                // once. Without the cap, a tab that was away for a minute would
                // run 3600 steps in one frame - and the game would be over
                // before it was drawn.
                if( dt > 250 ) dt = 250;

                acc += dt;
                while( acc >= STEP ) { step(); acc -= STEP; }

                draw();
            }

            return {
                run:  function () { if( raf ) return; last = 0; acc = 0; raf = requestAnimationFrame( frame ); },
                halt: function () { if( raf ) cancelAnimationFrame( raf ); raf = 0; }
            };
        }


        //------------------------------------------------------------------------//
        // THE ARCADE SHELL  - what the three canvas games have in common
        //
        // Space Invaders, Asteroids and Tetris are one shape: a <canvas>, a
        // gameLoop(), and four still states behind one overlay - ready, paused
        // and over, plus playing, which is the one with nothing over it. Every
        // part of that shape was written three times, and by the third it was
        // byte for byte the same, so it is written once here instead:
        //
        //   - play / pause / resume, and the rule that a hidden tab or an
        //     unfocused window pauses a game but never resumes it;
        //   - the overlay's three sets of words, and the pause button's two
        //     icons;
        //   - enter / leave: the arrow keys are owned only while the pane is on
        //     screen, and leaving stops the loop, lets go of every held key and
        //     writes the record;
        //   - the wiring each init() did by hand - the overlay, the tap on the
        //     play area, the pause and "new game" buttons, the held-key row,
        //     visibilitychange, blur, the theme change and the ResizeObserver.
        //
        // What it deliberately does NOT own is `state`. Each game asks
        // `state === 'playing'` inside its step(), its draw() and its onKey(),
        // dozens of times over, and threading an accessor through all of that
        // would cost far more than the four functions here save. So the game
        // keeps the variable and hands over the two lines that touch it.
        //
        // It DOES own `live`, which each game read exactly once (in onKey), and
        // the loop, which a game reaches through `A.loop` when its own step()
        // has to halt it.
        //
        // Invaders is the one that is not quite the other two: it can pause out
        // of `dying` and `wave` as well as `playing`, and comes back to
        // whichever it was. That is what `runs` and `held` are for; the other
        // two pass nothing and take the default.

        function arcade( o )
        {
            var loop    = gameLoop( o.step, o.draw );
            var noop    = function () {};
            var live    = false;                   // is this the pane on screen?
            var held    = '';                      // the state a pause interrupted
            var runs    = o.runs  || [ 'playing' ];
            var flush   = o.flush || noop;         // puts the record up at a pause (each game's own)
            var palette = o.palette || noop;
            var fit     = o.fit     || noop;
            var els     = o.els;

            function overlay()
            {
                var state = o.getState();
                var title = '', sub = '', btn = '';

                if( state === 'ready' )
                {
                    title = T( o.readyKey );
                    btn   = T( 'games.play' );
                }
                else if( state === 'paused' )
                {
                    title = T( 'games.paused' );
                    sub   = TF( 'games.scoreIs', { n: o.score() } );
                    btn   = T( 'games.resume' );
                }
                else if( state === 'over' )
                {
                    title = T( 'games.gameOver' );
                    sub   = TF( 'games.scoreIs', { n: o.score() } );
                    btn   = T( 'games.newGame' );
                }

                els.overTitle.textContent = title;
                els.overSub.textContent   = sub;
                els.overSub.hidden        = ! sub;
                els.overBtn.textContent   = btn;
                els.over.hidden           = ! btn;

                pauseButton( els.pause, state === 'paused', state === 'ready' || state === 'over' );
            }

            // The overlay's button, a tap on the play area, the first key press
            // and the toolbar's "new game" all arrive here.
            function play()
            {
                var state = o.getState();

                if( state === 'paused' ) { resume(); return; }
                if( state !== 'ready' && state !== 'over' ) return;

                if( state === 'over' ) o.reset();

                o.setState( 'playing' );
                overlay();
                loop.run();
                Sfx.play( 'start' );
                els.canvas.focus();            // ...or the next space re-clicks the button behind it
            }

            function pause()
            {
                var state = o.getState();

                if( runs.indexOf( state ) < 0 ) return;

                held = state;
                o.setState( 'paused' );
                loop.halt();
                o.clearKeys();
                flush();
                overlay();
                o.draw();

                // The thrust or the saucer stops with the game. The pause itself
                // is only heard when the player can have asked for it: leave()
                // arrives here with `live` already false, a hidden tab with
                // document.hidden and a blur with the window no longer focused.
                Sfx.hush();
                if( live && ! document.hidden && document.hasFocus() ) Sfx.play( 'pause' );
            }

            function resume()
            {
                if( o.getState() !== 'paused' ) return;

                o.setState( held || 'playing' );
                overlay();
                loop.run();
                els.canvas.focus();
                Sfx.play( 'resume' );
            }

            function toggle() { if( o.getState() === 'paused' ) resume(); else pause(); }

            function enter()
            {
                live = true;
                palette();
                fit();
                o.draw();

                document.addEventListener( 'keydown', o.onKey );
                document.addEventListener( 'keyup',   o.onKeyUp );
            }

            function leave()
            {
                live = false;
                pause();
                loop.halt();                   // pause() skips "over", whose dust would still settle behind the Games screen
                o.clearKeys();
                flush();

                document.removeEventListener( 'keydown', o.onKey );
                document.removeEventListener( 'keyup',   o.onKeyUp );
            }

            // Everything each init() used to wire by hand. It is called at the
            // END of the game's own init(), once every element it names exists.
            function wire( opt )
            {
                opt = opt || {};

                // A tap on the play area starts or resumes the game - the
                // overlay's button is small, and on a phone the thumb is already
                // there. It never moves anything: a mis-tap while playing must
                // not cost a placement.
                //
                // Invaders passes `tap: false` and wires the canvas itself: the
                // same finger that starts the game also DRAGS the ship, so the
                // press has to be one handler that knows both jobs.
                if( opt.tap !== false )
                    els.canvas.addEventListener( 'pointerdown', function ( e )
                    {
                        e.preventDefault();
                        if( opt.focusOnTap ) els.canvas.focus();
                        play();
                    } );

                // One listener for the whole overlay, not just its button: on a
                // phone the whole card is the target you actually hit.
                els.over.addEventListener( 'click', play );
                els.pause.addEventListener( 'click', toggle );
                if( els.newGame )
                    els.newGame.addEventListener( 'click', function () { o.reset(); play(); } );

                // The held-key row (Asteroids and Tetris). The keys are held
                // down rather than tapped, so every way a pointer can leave one
                // has to let it go - up, cancel and leave all arrive at the same
                // handler, which reads the event type.
                if( opt.pads )
                    Array.prototype.slice.call( document.querySelectorAll( opt.pads.sel ) ).forEach( function ( b )
                    {
                        opt.pads.keep( b );

                        b.addEventListener( 'pointerdown',   opt.pads.on );
                        b.addEventListener( 'pointerup',     opt.pads.on );
                        b.addEventListener( 'pointercancel', opt.pads.on );
                        b.addEventListener( 'pointerleave',  opt.pads.on );
                        b.addEventListener( 'contextmenu',   function ( e ) { e.preventDefault(); } );
                    } );

                // Nothing runs behind a hidden tab or an unfocused window - and
                // neither of them RESUMES the game either: it waits behind the
                // pause overlay for the player to come back to it.
                document.addEventListener( 'visibilitychange', function () { if( document.hidden ) pause(); } );
                window.addEventListener( 'blur', pause );

                // The scheme can change from another tab (theme.js listens to
                // "storage"), and a canvas colour is a copy, not a var() link.
                window.addEventListener( 'balata:themechange', function () { palette(); o.draw(); } );

                if( window.ResizeObserver ) new ResizeObserver( fit ).observe( els.canvas );
                else window.addEventListener( 'resize', fit );
            }

            return {
                loop: loop, overlay: overlay, play: play, pause: pause,
                resume: resume, enter: enter, leave: leave, wire: wire,
                isLive: function () { return live; }
            };
        }

        //------------------------------------------------------------------------//
        // THE SOUNDS
        //
        // Every sound in the nine games is MADE here, with the Web Audio API, and
        // not one of them is a recording: an oscillator or a burst of noise,
        // shaped by an envelope and now and then a filter. So there is no file to
        // fetch, precache or licence, the games still sound with no connection,
        // and every sound is the suite's own.
        //
        // A game says WHAT happened - sfx.play( 'merge', [ 64 ] ) - and never how
        // it sounds. The recipes are all in SOUNDS below, side by side, so they
        // are heard as one set and kept at one loudness.
        //
        // Four rules come with it:
        //
        //   1. the AudioContext is made on the first press or key, never before.
        //      A browser will not start sound that no gesture asked for, and a
        //      context made at boot would only sit "suspended" and complain.
        //      Every press in the page wakes it - in the capture phase, so before
        //      the game's own handler asks for a sound - which is also what
        //      brings it back after a hidden tab or a phone call stopped it;
        //   2. the speaker in the header silences all of it, and the choice is
        //      kept on THIS device (localStorage), not in games.json: a phone on
        //      a bus and a laptop at home want different answers;
        //   3. the same sound asked for twice within GAP ms plays once. A mine
        //      field opening in a flood, or three rocks breaking in one step,
        //      would otherwise be a roar;
        //   4. a sound that LASTS - the thrust, the flying saucer - is held, not
        //      started: hold() is called on every step it goes on, and the moment
        //      the calls stop it fades out by itself, on the audio thread. A game
        //      paused, left or hidden mid-thrust cannot leave it hissing behind
        //      the Games screen, because nothing has to remember to stop it.

        var Sfx = ( function ()
        {
            var KEY    = 'nayive-games-sound';     // 'off' = silenced; anything else is on
            var VOLUME = 0.5;                       // the master gain every recipe is written against
            var GAP    = 25;                        // ms - the same sound again this soon is dropped (rule 3)

            var ctx  = null, out = null, hiss = null;   // the context, the master gain, 1 s of white noise
            var on   = true;
            var t0   = 0;                           // "now" for the recipe being played, in context seconds
            var last = {};                          // name -> when it last played (Date.now)
            var held = {};                          // name -> the held sound that is sounding (rule 4)

            try { on = localStorage.getItem( KEY ) !== 'off'; } catch ( e ) {}

            // resume() and suspend() answer a promise in every browser but old
            // Safari, and a refused one is nothing to report.
            function settle( p ) { if( p && p.catch ) p.catch( function () {} ); }

            // Rule 1. Cheap enough to run on every press: once the context is
            // up and running it returns at the first line.
            function wake()
            {
                var AC = window.AudioContext || window.webkitAudioContext, comp, data, i;

                if( ! on || ( ctx && ctx.state === 'running' ) ) return;

                if( ctx ) { settle( ctx.resume() ); return; }
                if( ! AC ) return;

                try { ctx = new AC(); } catch ( e ) { ctx = null; return; }

                // A compressor in front of the speakers: a march step, a shot
                // and an explosion can all land in the same step, and summed they
                // would clip.
                comp = ctx.createDynamicsCompressor();
                comp.threshold.value = -14;
                comp.ratio.value     = 6;
                comp.connect( ctx.destination );

                out = ctx.createGain();
                out.gain.value = VOLUME;
                out.connect( comp );

                // One second of white noise, made once and started at a random
                // point each time: every explosion, crunch and hiss is this,
                // filtered.
                hiss = ctx.createBuffer( 1, ctx.sampleRate, ctx.sampleRate );
                data = hiss.getChannelData( 0 );
                for( i = 0; i < data.length; i++ ) data[ i ] = Math.random() * 2 - 1;
            }

            //---- the three primitives ----------------------------------------

            // The envelope every sound wears: up to `vol` in `a` seconds, held
            // there until `hold`, then an exponential fall to silence at `end`.
            // An exponential ramp can never reach 0, hence the 0.0001 at both
            // ends.
            function env( g, t, vol, a, hold, end )
            {
                g.setValueAtTime( 0.0001, t );
                g.exponentialRampToValueAtTime( vol, t + a );
                if( hold > a ) g.setValueAtTime( vol, t + hold );
                g.exponentialRampToValueAtTime( 0.0001, t + end );
            }

            // The optional filter between a source and its envelope: lp, hp or
            // bp is its kind and its frequency, `sweep` where the frequency ends
            // up by the end of the sound.
            function through( node, o, t )
            {
                var f;

                if( ! o.lp && ! o.hp && ! o.bp ) return node;

                f = ctx.createBiquadFilter();
                f.type = o.lp ? 'lowpass' : o.hp ? 'highpass' : 'bandpass';
                f.frequency.setValueAtTime( o.lp || o.hp || o.bp, t );
                if( o.sweep ) f.frequency.exponentialRampToValueAtTime( o.sweep, t + o.dur );
                f.Q.value = o.q || 0.8;
                node.connect( f );
                return f;
            }

            // One oscillator: `f` Hz, sliding to `to` over `glide` seconds (the
            // whole sound if not given), a `type` wave, `vol` loud, `dur` long,
            // starting `at` seconds in.
            function tone( o )
            {
                var t = t0 + ( o.at || 0 ), osc = ctx.createOscillator(), g = ctx.createGain();

                osc.type = o.type || 'triangle';
                osc.frequency.setValueAtTime( o.f, t );
                if( o.to ) osc.frequency.exponentialRampToValueAtTime( o.to, t + ( o.glide || o.dur ) );

                env( g.gain, t, o.vol, o.a || 0.005, o.hold || 0, o.dur );
                through( osc, o, t ).connect( g );
                g.connect( out );

                osc.start( t );
                osc.stop( t + o.dur + 0.05 );
            }

            // A burst of the noise, through its filter. The same options.
            function noise( o )
            {
                var t = t0 + ( o.at || 0 ), src = ctx.createBufferSource(), g = ctx.createGain();

                src.buffer = hiss;
                src.loop   = true;

                env( g.gain, t, o.vol, o.a || 0.003, o.hold || 0, o.dur );
                through( src, o, t ).connect( g );
                g.connect( out );

                src.start( t, Math.random() * 0.9 );
                src.stop( t + o.dur + 0.05 );
            }

            //---- notes -------------------------------------------------------

            function hz( midi ) { return 440 * Math.pow( 2, ( midi - 69 ) / 12 ); }

            // The k-th step up a major pentatonic scale, in semitones. It is the
            // scale with no wrong note in it, which is what lets 2048 and Sudoku
            // play whatever the board hands them and still sound like a tune.
            var PENTA = [ 0, 2, 4, 7, 9 ];

            function penta( k ) { return 12 * Math.floor( k / 5 ) + PENTA[ k % 5 ]; }

            // A run of notes (MIDI numbers), `gap` seconds apart, each one tone( o ).
            function notes( list, gap, o )
            {
                list.forEach( function ( n, i )
                {
                    var p = {}, k;

                    for( k in o ) p[ k ] = o[ k ];
                    p.f  = hz( n );
                    p.at = ( o.at || 0 ) + i * gap;
                    tone( p );
                } );
            }

            // Something blowing up, `s` from 0 (a pebble) to 1 (a ship): a roar
            // of noise closing down from bright to dull, a thump under it and a
            // crackle on top. Mines, rocks and ships are all this, at a size.
            function blast( s, at )
            {
                at = at || 0;
                noise( { lp: 700 + 3200 * s, sweep: 90, q: 0.7, dur: 0.25 + 0.95 * s, vol: 0.9, at: at } );
                noise( { hp: 2600, dur: 0.05 + 0.1 * s, vol: 0.35, at: at } );
                tone ( { f: 70 + 90 * s, to: 32, type: 'sine', dur: 0.2 + 0.4 * s, vol: 0.2 + 0.5 * s, at: at } );
            }

            // The pop of two 2048 tiles becoming one: a sine that bends up into
            // its note, and a glint an octave above it.
            function pop( m, at )
            {
                tone( { f: hz( m ) * 0.7, to: hz( m ), glide: 0.04, type: 'sine', dur: 0.2, vol: 0.75, at: at } );
                tone( { f: hz( m + 12 ), type: 'triangle', dur: 0.07, vol: 0.15, at: at } );
            }

            //---- the recipes -------------------------------------------------

            var SOUNDS = {

                // The whole suite. `on` answers the speaker being switched back
                // on - the one sound that is about the button and not a game.
                on:     function () { notes( [ 72, 79 ], 0.07, { type: 'sine', dur: 0.14, vol: 0.4 } ); },
                start:  function () { notes( [ 67, 74, 79 ], 0.06, { type: 'triangle', dur: 0.13, vol: 0.35 } ); },
                pause:  function () { notes( [ 76, 69 ], 0.08, { type: 'sine', dur: 0.15, vol: 0.35 } ); },
                resume: function () { notes( [ 69, 76 ], 0.08, { type: 'sine', dur: 0.15, vol: 0.35 } ); },

                // A board finished: a major arpeggio up to a held top note.
                win: function ()
                {
                    notes( [ 60, 64, 67, 72, 76 ], 0.075, { type: 'triangle', dur: 0.22, vol: 0.35 } );
                    tone( { f: hz( 84 ), type: 'triangle', dur: 1, hold: 0.25, vol: 0.35, at: 0.375 } );
                    tone( { f: hz( 79 ), type: 'sine',     dur: 1, hold: 0.25, vol: 0.2,  at: 0.375 } );
                },

                // ...and a record: the same, and a sparkle over the held note.
                record: function ()
                {
                    SOUNDS.win();
                    notes( [ 91, 96, 100, 103, 108 ], 0.05, { type: 'sine', dur: 0.3, vol: 0.14, at: 0.55 } );
                },

                // Game over: three notes down and a fourth that sags as it fades.
                over: function ()
                {
                    notes( [ 67, 63, 60 ], 0.16, { type: 'triangle', dur: 0.24, vol: 0.35 } );
                    tone( { f: hz( 55 ), to: hz( 53 ), type: 'triangle', dur: 0.9, hold: 0.3, vol: 0.35, at: 0.48 } );
                },

                // 2048. A move that slides tiles is a short swish; one that
                // merges them pops instead, once per merged VALUE (the biggest
                // three, lowest first) - and the note climbs with the tile, 4 at
                // the bottom and 2048 two octaves up, so a good move is heard as
                // well as seen. A move that changes nothing only bumps.
                slide: function () { noise( { bp: 1700, sweep: 500, q: 1.1, dur: 0.1, vol: 2.4 } ); },
                merge: function ( vals )
                {
                    vals.forEach( function ( v, i )
                    {
                        pop( 60 + penta( Math.max( 0, Math.round( Math.log( v ) / Math.LN2 ) - 2 ) ), i * 0.06 );
                    } );
                },
                bump:  function () { tone( { f: 220, to: 150, type: 'triangle', dur: 0.09, vol: 1 } ); },

                // Minesweeper. One square is a dry click; a field opening at
                // once is a ripple up, longer the more of it there was. A flag
                // goes up with a flick and comes down with the same flick
                // backwards.
                open: function ()
                {
                    tone ( { f: 1300, to: 700, type: 'triangle', dur: 0.04, vol: 0.85 } );
                    noise( { hp: 3000, dur: 0.03, vol: 1.1 } );
                },
                flood: function ( n )
                {
                    var k = Math.min( 9, 3 + Math.floor( n / 10 ) ), list = [], i;

                    for( i = 0; i < k; i++ ) list.push( 72 + penta( i ) );
                    notes( list, 0.03, { type: 'sine', dur: 0.14, vol: 0.2 } );
                    noise( { bp: 900, sweep: 3600, q: 0.9, dur: 0.06 + k * 0.03, vol: 0.45 } );
                },
                flag:   function () { tone( { f: 520, to: 1250, type: 'triangle', dur: 0.08, vol: 1 } ); },
                unflag: function () { tone( { f: 1250, to: 520, type: 'triangle', dur: 0.08, vol: 0.85 } ); },
                mine:   function ()
                {
                    blast( 1 );
                    notes( [ 62, 57 ], 0.2, { type: 'triangle', dur: 0.32, vol: 0.25, at: 0.75 } );
                },

                // Sudoku. A digit is a soft wooden note - and the digit IS the
                // note, 1 to 9 up the pentatonic scale, so filling in a row plays
                // a small tune of its own. The pencil scratches, the rubber rubs.
                // A digit that repeats in its row, column or box buzzes: it is
                // what the red already says, never a check against the answer.
                // A row, a column or a box filled with nothing repeated chimes.
                digit: function ( v )
                {
                    var f = hz( 60 + penta( v - 1 ) );

                    tone ( { f: f,       type: 'sine', dur: 0.25, vol: 0.45 } );
                    tone ( { f: f * 3.9, type: 'sine', dur: 0.05, vol: 0.08 } );
                    noise( { bp: 2500, q: 2, dur: 0.02, vol: 0.25 } );
                },
                pencil: function ()
                {
                    noise( { hp: 5000, dur: 0.035, vol: 0.8 } );
                    noise( { hp: 5000, dur: 0.03,  vol: 0.55, at: 0.05 } );
                },
                rub: function ()
                {
                    noise( { bp: 1500, sweep: 700, q: 1.5, dur: 0.09, vol: 1.2 } );
                    noise( { bp: 1100, sweep: 600, q: 1.5, dur: 0.09, vol: 1, at: 0.1 } );
                },
                clash: function ()
                {
                    tone( { f: 185, type: 'sawtooth', lp: 900, dur: 0.24, vol: 0.14, at: 0.08 } );
                    tone( { f: 196, type: 'sawtooth', lp: 900, dur: 0.24, vol: 0.14, at: 0.08 } );
                },
                unit: function () { notes( [ 84, 88, 91 ], 0.06, { type: 'sine', dur: 0.4, vol: 0.2, at: 0.1 } ); },

                // Space Invaders. The march is two low notes taking turns, one
                // per step of the formation - its tread, and it quickens with it
                // because march() itself plays it. Square waves, because the
                // notes are so low that a phone speaker only has the overtones
                // to play them with.
                march:  function ( k ) { tone( { f: k ? 87 : 104, to: k ? 72 : 86, type: 'square', lp: 700, dur: 0.1, vol: 0.6 } ); },
                laser:  function () { tone( { f: 1800, to: 320, type: 'sawtooth', lp: 4000, dur: 0.13, vol: 0.65 } ); },
                zap:    function ()
                {
                    noise( { bp: 1800, sweep: 400, q: 1.5, dur: 0.16, vol: 3 } );
                    tone ( { f: 700, to: 140, type: 'square', lp: 2000, dur: 0.12, vol: 0.3 } );
                },
                saucer: function ()
                {
                    notes( [ 96, 91, 96, 100 ], 0.045, { type: 'square', lp: 3000, dur: 0.09, vol: 0.14 } );
                    blast( 0.3 );
                },
                crumble: function () { noise( { lp: 1100, dur: 0.07, vol: 1.8 } ); },
                clink:   function () { tone( { f: 2400, to: 1800, type: 'triangle', dur: 0.04, vol: 0.75 } ); },
                wave:    function () { notes( [ 67, 71, 74, 79, 83, 86 ], 0.06, { type: 'square', lp: 2500, dur: 0.13, vol: 0.25 } ); },

                // A ship lost - Invaders' and Asteroids' alike: the biggest
                // blast, and a whine falling through it.
                crash: function ()
                {
                    blast( 1 );
                    tone( { f: 600, to: 50, type: 'square', lp: 1500, dur: 0.9, vol: 0.09 } );
                },

                // Asteroids. A softer shot than the invaders' laser; a rock
                // breaks with a blast its own size (the big ones boom, the small
                // ones crack); a spare ship rings; a new ship warps in.
                pew:  function ()
                {
                    tone( { f: 1300, to: 260, type: 'triangle', dur: 0.1, vol: 0.8 } );
                    tone( { f: 2600, to: 520, type: 'square', lp: 3500, dur: 0.05, vol: 0.09 } );
                },
                rock: function ( gen ) { blast( [ 0.75, 0.45, 0.2 ][ gen ] || 0.2 ); },
                life: function () { notes( [ 84, 88, 91, 96 ], 0.06, { type: 'sine', dur: 0.35, vol: 0.25 } ); },
                warp: function () { tone( { f: 220, to: 880, type: 'sine', dur: 0.3, vol: 0.4 } ); },
                rocks: function () { notes( [ 60, 67, 72 ], 0.09, { type: 'triangle', dur: 0.25, vol: 0.25 } ); },

                // Tetris. A step sideways ticks, a turn flicks up, a piece that
                // lands knocks, a hard drop swooshes into the knock. Full rows
                // ring as they flash - one note more for each row, and four rows
                // at once get the whole run and a held chord - and a new level
                // climbs.
                shift: function () { tone( { f: 330, type: 'square', lp: 1200, dur: 0.035, vol: 0.5 } ); },
                turn:  function () { tone( { f: 520, to: 780, type: 'triangle', dur: 0.06, vol: 0.85 } ); },
                lock:  function ()
                {
                    tone ( { f: 150, to: 90, type: 'triangle', dur: 0.1, vol: 1 } );
                    noise( { lp: 900, dur: 0.05, vol: 1 } );
                },
                drop:  function () { noise( { lp: 3000, sweep: 400, dur: 0.09, vol: 2 } ); },
                lines: function ( n )
                {
                    var run = [ 72, 76, 79, 84, 88, 91, 96 ];

                    if( n < 4 )
                    {
                        notes( run.slice( 0, n + 1 ), 0.055, { type: 'square', lp: 2800, dur: 0.15, vol: 0.27 } );
                        noise( { bp: 3000, dur: 0.15, vol: 0.75 } );
                        return;
                    }
                    notes( run, 0.045, { type: 'square', lp: 2800, dur: 0.15, vol: 0.2 } );
                    notes( [ 84, 88, 91 ], 0, { type: 'triangle', dur: 0.8, hold: 0.2, vol: 0.2, at: 0.32 } );
                    noise( { bp: 1200, sweep: 6000, q: 0.7, dur: 0.45, vol: 0.4 } );
                },
                level: function () { notes( [ 79, 84, 88, 91 ], 0.05, { type: 'sine', dur: 0.2, vol: 0.25 } ); }
            };

            // The two sounds that last (rule 4). make( g ) starts what the sound
            // is made of, playing into the gain `g`, and returns what has to be
            // stopped later.
            var HOLDS = {

                // Asteroids' thrust: low rumbling noise.
                thrust: { level: 0.65, make: function ( g )
                {
                    var src = ctx.createBufferSource(), f = ctx.createBiquadFilter();

                    src.buffer = hiss; src.loop = true;
                    f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.9;
                    src.connect( f ); f.connect( g );
                    src.start();
                    return [ src ];
                } },

                // Space Invaders' flying saucer: a note wobbling nine times a
                // second, for as long as it is on the screen.
                ufo: { level: 0.065, make: function ( g )
                {
                    var osc = ctx.createOscillator(), lfo = ctx.createOscillator(), depth = ctx.createGain(), f = ctx.createBiquadFilter();

                    osc.type = 'square'; osc.frequency.value = 560;
                    lfo.frequency.value = 9; depth.gain.value = 140;
                    f.type = 'lowpass'; f.frequency.value = 1600;
                    lfo.connect( depth ); depth.connect( osc.frequency );
                    osc.connect( f ); f.connect( g );
                    osc.start(); lfo.start();
                    return [ osc, lfo ];
                } }
            };

            //---- what the games call -----------------------------------------

            // `later` puts the sound that many seconds off - a win after the
            // move that won it, a game over after the crash.
            function play( name, arg, later )
            {
                var now = Date.now();

                if( ! on || ! ctx ) return;
                if( now - ( last[ name ] || 0 ) < GAP ) return;     // rule 3
                last[ name ] = now;

                t0 = ctx.currentTime + ( later || 0 );
                try { SOUNDS[ name ]( arg ); } catch ( e ) {}       // a sound is never worth a broken game
            }

            // Rule 4: called on every step the sound goes on. Each call pushes
            // the fade back; the first step without one lets it happen, and a
            // moment later the nodes are let go.
            function hold( name )
            {
                var h = held[ name ], d = HOLDS[ name ], g, t;

                if( ! on || ! ctx || ! d ) return;

                if( ! h )
                {
                    g = ctx.createGain();
                    g.gain.value = 0;
                    g.connect( out );
                    try { h = held[ name ] = { gain: g, stop: d.make( g ), timer: 0 }; }
                    catch ( e ) { return; }
                }

                t = ctx.currentTime;
                g = h.gain.gain;
                g.cancelScheduledValues( t );
                g.setTargetAtTime( d.level, t, 0.02 );
                g.setTargetAtTime( 0, t + 0.12, 0.04 );

                clearTimeout( h.timer );
                h.timer = setTimeout( function () { release( name, 0 ); }, 600 );
            }

            // The held sound is let go: faded out over `fade` seconds (0 when it
            // has faded by itself already) and its nodes stopped after that.
            function release( name, fade )
            {
                var h = held[ name ], t = ctx.currentTime;

                if( ! h ) return;
                delete held[ name ];
                clearTimeout( h.timer );

                h.gain.gain.cancelScheduledValues( t );
                h.gain.gain.setTargetAtTime( 0, t, fade / 4 || 0.001 );
                h.stop.forEach( function ( s ) { try { s.stop( t + fade + 0.02 ); } catch ( e ) {} } );
            }

            // Every held sound off NOW, without waiting for the missed step: a
            // pause, a pane switch, the speaker turned off. A short fade all the
            // same - a sound cut dead clicks.
            function hush()
            {
                Object.keys( held ).forEach( function ( name ) { release( name, 0.06 ); } );
            }

            function set( v )
            {
                on = !! v;
                try { localStorage.setItem( KEY, on ? 'on' : 'off' ); } catch ( e ) {}

                if( ! on ) { if( ctx ) { hush(); settle( ctx.suspend() ); } return; }

                wake();
                play( 'on' );
            }

            [ 'pointerdown', 'pointerup', 'touchend', 'keydown' ].forEach( function ( type )
            {
                document.addEventListener( type, wake, true );
            } );

            // A hidden tab stops the audio thread along with the game; the next
            // press wakes it (rule 1).
            document.addEventListener( 'visibilitychange', function ()
            {
                if( ! document.hidden || ! ctx || ctx.state !== 'running' ) return;
                hush();
                settle( ctx.suspend() );
            } );

            return { play: play, hold: hold, hush: hush, set: set, isOn: function () { return on; } };
        } )();

        //------------------------------------------------------------------------//
        // THE NINE GAMES - one file each
        //
        // Every game is a file of its own beside this one, holding its style,
        // its pane and its script, so one game can be changed without
        // scrolling past the other eight. All nine are fetched at boot, at the
        // same time as the dictionary, and mounted before start() - which then
        // finds exactly the page it did when they were all in here.
        //
        // A game's script reaches the helpers above through window.NayiveGames
        // and hands its module back with NayiveGames.add( name, module ).

        var FILES = [ 'sudoku', 'g2048', 'mines', 'invaders', 'asteroids', 'tetris', 'solitaire', 'checkers', 'chess' ];   // the cards' order
        var MODS  = {};                        // name -> the module its file handed back
        var G2048, Mines, Sudoku, Invaders, Asteroids, Tetris, Chess, Solitaire, Checkers;

        window.NayiveGames = {
            T: T, TF: TF, STEP: STEP, clock: clock, keyBusy: keyBusy,
            pauseButton: pauseButton, keepBest: keepBest, gameLoop: gameLoop,
            arcade: arcade, saveBest: saveBest, saveTime: saveTime, sfx: Sfx,
            add: function ( name, mod ) { MODS[ name ] = mod; }
        };

        // One game that does not load (a 404, a cut connection) is null here,
        // and only its own card goes - the other eight still open.
        var fetched = Promise.all( FILES.map( function ( name )
        {
            return fetch( name + '.html' ).then( function ( r )
            {
                if( ! r.ok ) throw new Error( name + '.html: HTTP ' + r.status );
                return r.text();
            } ).catch( function ( e ) { console.error( e ); return null; } );
        } ) );

        // What stands in for a game whose file failed: start() and loadData()
        // then run exactly as they do with all nine, and nobody can reach it
        // because its card is gone.
        function missingGame( name )
        {
            var tile = document.querySelector( '.game-tile[data-game="' + name + '"]' );

            if( tile ) tile.remove();        // removed, not hidden: the help lists the cards it finds
            MODS[ name ] = {
                init:       function () { return {}; },
                adoptBest:  function ( n ) { return n; },
                adoptTimes: function () { return {}; }
            };
        }

        // The style goes into <head>, after this file's own; the pane into
        // #gameHost; and the script is made again, because a parsed script
        // element never runs. The sourceURL line is what names the file in the console
        // and the debugger.
        function mount( name, text )
        {
            var doc  = new DOMParser().parseFromString( text, 'text/html' );
            var pane = doc.querySelector( 'section.game-pane' );
            var js   = document.createElement( 'script' );

            Array.prototype.forEach.call( doc.querySelectorAll( 'style' ), function ( s ) { document.head.appendChild( s ); } );
            document.getElementById( 'gameHost' ).appendChild( pane );
            NayiveI18n.applyI18n( pane );      // now, not when the observer gets to it: init() may read it

            js.textContent = doc.querySelector( 'script' ).textContent + '\n//# sourceURL=' + name + '.html';
            document.body.appendChild( js );

            // An error inside the game's script goes to the console and not to
            // here, so say which file it was rather than fail later in init().
            if( ! MODS[ name ] ) throw new Error( name + '.html did not register its game' );
        }

        //------------------------------------------------------------------------//
        // PERSISTENCE - one file, one record per game:
        //
        //     { "best":  { "g2048": 12345, "invaders": 3120, "asteroids": 8400,
        //                  "tetris": 24500 },
        //       "times": { "easy": 47, "medium": 210, "hard": 999,
        //                  "sudokuEasy": 421, "sudokuMedium": 903 } }
        //
        // Two maps because there are two kinds of record: 2048 and the three
        // canvas games keep a SCORE, where more is better, and Minesweeper and
        // Sudoku keep a TIME per difficulty, where less is. Each is merged its
        // own way (see adoptBest / adoptTimes).
        //
        // The three timed games share the one `times` map and each reads only
        // the keys it knows: Minesweeper was first and took the bare easy /
        // medium / hard, so Sudoku's carry its name and Solitaire's carry its
        // own - solitaire1 and solitaire3, one per draw mode, because turning
        // one card over is a different game from turning three. A fourth timed
        // game only has to pick a prefix of its own.
        //
        // Chess and Checkers have no line here at all. They end in a RESULT
        // and not in a number to beat, so there is nothing of either to write
        // and nothing for loadData() to merge - the two games of the nine that
        // ask the server for nothing whatever.
        //
        // The board itself is not saved. A game is one sitting, and writing it
        // would PUT the whole file on every arrow key; only the record outlives
        // the visit.

        var data   = { best: {}, times: {} };   // the file as last read, kept whole so
                                                // another game's record is never written over
        var loaded = false;          // false = we do not know what is in the file

        async function loadData()
        {
            var res = await store.read( FILE );

            if( res.source === 'empty' )
            {
                data   = { best: {}, times: {} };   // no games.json yet - a safe first run
                loaded = true;
            }
            else if( res.body !== null )
            {
                try
                {
                    var parsed = JSON.parse( res.body );

                    data = ( parsed && typeof parsed === 'object' && ! Array.isArray( parsed ) ) ? parsed : {};
                    if( ! data.best  || typeof data.best  !== 'object' ) data.best  = {};
                    if( ! data.times || typeof data.times !== 'object' ) data.times = {};
                    loaded = true;
                }
                catch ( e )
                {
                    // A damaged file reads as "no record" and is never written over.
                    data   = { best: {}, times: {} };
                    loaded = false;
                }
            }
            // else: the server was unreachable AND nothing is cached (res.source
            // is 'unknown', or 'unauth' with no cached copy). Leave what we have
            // alone and stay unloaded - writing now is exactly what would
            // overwrite the real file with an empty one.

            adoptAll();
        }

        // Both directions at once: a record set on another device is
        // adopted, and one set here since the last read is written back.
        function adoptAll()
        {
            saveBest( 'g2048',    G2048.adoptBest(    Number( data.best.g2048    ) || 0 ) );
            saveBest( 'invaders', Invaders.adoptBest( Number( data.best.invaders ) || 0 ) );
            saveBest( 'asteroids', Asteroids.adoptBest( Number( data.best.asteroids ) || 0 ) );
            saveBest( 'tetris',    Tetris.adoptBest(    Number( data.best.tetris    ) || 0 ) );

            var mineTimes = Mines.adoptTimes( data.times );
            Object.keys( mineTimes ).forEach( function ( k ) { saveTime( k, mineTimes[ k ] ); } );

            var sudokuTimes = Sudoku.adoptTimes( data.times );
            Object.keys( sudokuTimes ).forEach( function ( k ) { saveTime( k, sudokuTimes[ k ] ); } );

            var solTimes = Solitaire.adoptTimes( data.times );
            Object.keys( solTimes ).forEach( function ( k ) { saveTime( k, solTimes[ k ] ); } );
        }

        // Two devices saved from the same copy (shared/store.js MERGE): each
        // record keeps the better of the two - the higher score, the shorter
        // time - and any other key takes the side that changed it. null = a
        // side that is not an object: nothing is merged over it.
        function mergeGames( path, base, mine, theirs )
        {
            var parse = function ( t )
            {
                try { var v = JSON.parse( t ); return ( v && typeof v === 'object' && ! Array.isArray( v ) ) ? v : null; }
                catch ( e ) { return null; }
            };
            var m = parse( mine ), t = parse( theirs ), b = base == null ? null : parse( base );
            if( ! m || ! t ) return null;

            var pickEach = function ( x, y, better )
            {
                var out = Object.assign( {}, y || {}, x || {} );
                Object.keys( y || {} ).forEach( function ( k )
                {
                    var a = Number( ( x || {} )[ k ] ), c = Number( y[ k ] );
                    if( ! isFinite( a ) || ( isFinite( c ) && better( c, a ) ) ) out[ k ] = y[ k ];
                } );
                return out;
            };
            var merged = NayiveStore.mergeFields( b, m, t );
            merged.best  = pickEach( m.best,  t.best,  function ( c, a ) { return c > a; } );
            merged.times = pickEach( m.times, t.times, function ( c, a ) { return c < a; } );
            return JSON.stringify( merged, null, 2 );
        }

        // Writes the local copy now and queues the upload; the store flushes it
        // on a short timer, on reconnect or on tab focus. Fire-and-forget.
        function saveBest( game, score )
        {
            if( ! loaded ) return;                         // we do not know the file: do not write it
            if( score <= ( Number( data.best[ game ] ) || 0 ) ) return;

            data.best[ game ] = score;
            store.write( FILE, JSON.stringify( data, null, 2 ) );
        }

        // The same, for the other kind of record: a time, where the merge is a
        // MINIMUM. A missing or damaged entry reads as NaN, which is not
        // finite, so a first record always wins - and a real 0 does not read as
        // "no record yet" the way `|| 0` made it.
        function saveTime( level, secs )
        {
            var have = Number( data.times[ level ] );

            if( ! loaded ) return;
            if( isFinite( have ) && secs >= have ) return;

            data.times[ level ] = secs;
            store.write( FILE, JSON.stringify( data, null, 2 ) );
        }

        //------------------------------------------------------------------------//
        // BOOT

        function start()
        {
            tiles   = Array.prototype.slice.call( document.querySelectorAll( '.game-tile[data-game]' ) );
            panes   = Array.prototype.slice.call( document.querySelectorAll( '.game-pane' ) );
            titleEl = document.getElementById( 'appTitle' );
            optsEl  = document.getElementById( 'gameOptions' );
            slotEl  = document.getElementById( 'gameOptionsSlot' );

            tiles.forEach( function ( b )
            {
                b.addEventListener( 'click', function () { showGame( b.dataset.game ); } );
            } );

            // Escape is the way back on a keyboard - the same thing the game's
            // name does with a click, from any of the nine and whatever the game
            // is doing. goHome() calls leave(), so the loop stops, the held keys
            // are let go and the record is written, exactly as it is when the
            // name is clicked.
            //
            // keyBusy() is what keeps it out of the way of everything else that
            // answers Escape: a sheet over the app (the help dialog, the install
            // prompt, "session expired") closes itself instead of dropping the
            // game behind it, and a field with the caret in it keeps its own.
            // On the Games screen there is nothing to go back from, so `current`
            // being empty ends it before any of that.
            //
            // It used to be the second pause key in Invaders and Tetris. It is
            // not any more - `p` is, in both - because a key that means "out of
            // here" everywhere else in the suite cannot mean "wait a moment" in
            // two of six games.
            // The speaker. Its tooltip says what a press DOES, the way the
            // pause button's does: "turn the sound off" while it is on.
            var soundBtn = document.getElementById( 'gamesSound' );

            function paintSound()
            {
                var on = Sfx.isOn();

                soundBtn.title = T( on ? 'games.soundOff' : 'games.soundOn' );
                soundBtn.setAttribute( 'aria-label', soundBtn.title );
                soundBtn.querySelector( '[data-ic="on"]'  ).toggleAttribute( 'hidden', ! on );
                soundBtn.querySelector( '[data-ic="off"]' ).toggleAttribute( 'hidden', on );
            }

            soundBtn.addEventListener( 'click', function () { Sfx.set( ! Sfx.isOn() ); paintSound(); } );
            document.getElementById( 'gamesBack' ).addEventListener( 'click', goHome );
            paintSound();

            document.addEventListener( 'keydown', function ( e )
            {
                if( e.key !== 'Escape' || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( ! current || keyBusy( e ) ) return;

                e.preventDefault();
                goHome();
            } );

            GAMES.sudoku   = Sudoku.init();
            GAMES.g2048    = G2048.init();
            GAMES.mines    = Mines.init();
            GAMES.invaders = Invaders.init();
            GAMES.asteroids = Asteroids.init();
            GAMES.tetris   = Tetris.init();
            GAMES.chess    = Chess.init();
            GAMES.solitaire = Solitaire.init();
            GAMES.checkers = Checkers.init();

            // The nine toolbars are written inside their panes - that is where
            // they are read, next to the board they act on - and MOVED into the
            // header here, after every init() has taken its references. A moved
            // node keeps its listeners and its id, so nothing above knows.
            Array.prototype.slice.call( document.querySelectorAll( '.view-bar[data-options]' ) )
                 .forEach( function ( bar ) { slotEl.appendChild( bar ); } );

            goHome();

            NayiveUI.firstRun( {
                app:   'games',
                title: 'Games',
                lead:  [ T( 'games.introLead' ), T( 'games.introBack' ) ],
                buttons: [
                    { sel: '.game-tile[data-game="sudoku"]',    text: T( 'games.introSudoku' ) },
                    { sel: '.game-tile[data-game="g2048"]',     text: T( 'games.intro2048' ) },
                    { sel: '.game-tile[data-game="mines"]',     text: T( 'games.introMines' ) },
                    { sel: '.game-tile[data-game="invaders"]',  text: T( 'games.introInvaders' ) },
                    { sel: '.game-tile[data-game="asteroids"]', text: T( 'games.introAsteroids' ) },
                    { sel: '.game-tile[data-game="tetris"]',    text: T( 'games.introTetris' ) },
                    { sel: '.game-tile[data-game="solitaire"]', text: T( 'games.introSolitaire' ) },
                    { sel: '.game-tile[data-game="checkers"]',  text: T( 'games.introCheckers' ) },
                    { sel: '.game-tile[data-game="chess"]',     text: T( 'games.introChess' ) },
                    { sel: '#gamesSound',                       text: T( 'games.introSound' ) },
                    { sel: '#syncIndicator', name: T( 'ui.syncName' ), text: T( 'games.introSync' ) }
                ]
            } );
        }

        Promise.all( [ NayiveI18n.ready, fetched ] ).then( function ( got )
        {
            FILES.forEach( function ( name, i )
            {
                try
                {
                    if( got[ 1 ][ i ] === null ) throw new Error( name + '.html did not load' );
                    mount( name, got[ 1 ][ i ] );
                }
                catch ( e )
                {
                    console.error( e );
                    missingGame( name );
                }
            } );

            G2048     = MODS.g2048;
            Mines     = MODS.mines;
            Sudoku    = MODS.sudoku;
            Invaders  = MODS.invaders;
            Asteroids = MODS.asteroids;
            Tetris    = MODS.tetris;
            Chess     = MODS.chess;
            Solitaire = MODS.solitaire;
            Checkers  = MODS.checkers;

            store = NayiveStore.createStore( { apiBase: GumApi.API_FILES, conflicts: true, merge: mergeGames } );

            // Another device's records merged in: this file from now on, and
            // each game adopts its new best.
            store.onMerged( function ( path, body )
            {
                if( path !== FILE ) return;
                try { data = JSON.parse( body ); } catch ( e ) { return; }
                if( ! data.best  || typeof data.best  !== 'object' ) data.best  = {};
                if( ! data.times || typeof data.times !== 'object' ) data.times = {};
                loaded = true;
                adoptAll();
            } );

            start();

            // The store's state machine drives the header plug for every read
            // and write.
            store.onState( NayiveUI.syncIndicator() );

            // The plug's click and the focus / visibilitychange re-reads, all on
            // one guarded path (shared/ui.js). loadData() only ever raises the
            // best figure, so a re-read can never disturb a game in progress -
            // the default guard (any open sheet) is enough here.
            NayiveUI.wireRefresh( { store: store, read: loadData } );

            // Probe the API, then read. On a failed probe the shared helper
            // bounces to the sign-in page only when we are really online with
            // nothing cached; otherwise it opens on the local cache and the
            // store syncs once the connection is back.
            NayiveUI.bootWithStore( store, loadData );
        } ).catch( function ( e ) { console.error( e ); } );
    } )();
    </script>

</body>
</html>
