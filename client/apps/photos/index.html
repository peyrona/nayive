/* ---------------------------------------------------------------------------
 * GRID (contact sheet)
 *
 * A folder can hold thousands of photos. The grid is built a few day-groups at
 * a time; a 1px sentinel near the bottom, watched with an IntersectionObserver,
 * pulls in the next batch as you scroll. Each thumbnail is <img loading="lazy">
 * (see sceneInner), so only the ones actually on screen are ever downloaded.
 * Clicks are handled once, by delegation on #grid (wired further down).
 * -------------------------------------------------------------------------*/
let gridObs = null;

function tileCap( p )  { return p.time + ( p.place ? " · " + p.place : "" ); }
function tileBits( p )
{
    const bits = [ dayLabel( p.day ) + " " + p.time ];
    if( p.place )      bits.push( p.place );
    if( p.size )       bits.push( fmtSize( p.size ) );
    return bits.join( " · " );
}
function tileHtml( p )
{
    const cap  = esc( tileCap( p ) );
    // .tmeta is shown only in list view (CSS); .cap only in grid view.
    // A <div>, not a <button>: the item browser puts its pick tick and ⋮
    // (buttons) inside it.
    return '<div class="tile" data-id="' + esc( p.id ) + '" title="' + cap + '">'
         + sceneHtml( p, true )
         + '<span class="geo-dot' + ( p.lat != null ? "" : " no" ) + '"></span>'
         + ( noteFor( p.id ) ? NOTE_MARK : "" )
         + '<span class="cap">' + cap + "</span>"
         + '<span class="tmeta"><b>' + esc( p.name ) + "</b><i>" + esc( tileBits( p ) ) + "</i></span>"
         + "</div>";
}

// A HEIC / HEIF: listed, so it is not just missing, but no browser here can
// draw it - a tap offers Download or Drive instead (openUnshown).
const NO_SHOW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
function unshown()
{
    const q = st.q.trim().toLowerCase();
    return q ? UNSHOWN.filter( u => u.name.toLowerCase().indexOf( q ) !== -1 ) : UNSHOWN;
}
function unshownTileHtml( u )
{
    const why = esc( NayiveUI.t( 'photos.cantShow' ) );
    return '<button class="tile no-show" data-heic="' + esc( u.path ) + '" title="' + esc( u.name ) + '">'
         + '<span class="scene is-photo no-show-art">' + NO_SHOW_SVG + '<small>' + why + '</small></span>'
         + '<span class="cap">' + esc( u.name ) + '</span>'
         + '<span class="tmeta"><b>' + esc( u.name ) + '</b><i>' + why + '</i></span>'
         + '</button>';
}
async function openUnshown( path )
{
    const name = baseName( path );
    const pick = await NayiveUI.confirm( {
        title:     name,
        body:      NayiveUI.t( 'photos.cantShowBody' ),
        confirm:   NayiveUI.t( 'photos.openInDrive' ),
        other:     NayiveUI.t( 'ui.download' ),
        otherIcon: 'download'
    } );
    if( pick === true ) location.href = '../drive/index.html?sel=' + encodeURIComponent( path );
    else if( pick === 'other' )
    {
        const a = document.createElement( 'a' );
        a.href = GumApi.fileUrl( path );
        a.download = name;
        document.body.appendChild( a );
        a.click();
        a.remove();
    }
}

// What the grid on screen was built from (see refreshGrid).
let gridShape = "";
function shapeOf( list ) { return list.map( p => p.id + "|" + p.day ).join( "\n" ); }

/* The scan (dates) and the geocoder (places) change what the tiles say. When
 * the photos and their days still stand in the same order, only the captions
 * are repainted - a rebuild threw anyone scrolled down back to the top. When
 * the order did change, the grid is rebuilt at the same scroll position. */
function refreshGrid()
{
    if( shapeOf( photos() ) !== gridShape ) { renderGrid( $( "#grid" ).scrollTop ); return; }
    $$( "#grid .tile[data-id]" ).forEach( el =>
    {
        const p = photoById( el.dataset.id );
        if( ! p ) return;
        el.title = tileCap( p );
        el.querySelector( ".cap" ).textContent = tileCap( p );
        el.querySelector( ".tmeta i" ).textContent = tileBits( p );
        el.querySelector( ".geo-dot" ).classList.toggle( "no", p.lat == null );
    } );
}

// `keepTop`: a scroll position to come back to (refreshGrid).
function renderGrid( keepTop )
{
    const list = photos();
    gridShape = shapeOf( list );

    const grid = $( "#grid" );
    if( gridObs ) { gridObs.disconnect(); gridObs = null; }
    grid.innerHTML = "";
    const odd = unshown();
    if( ! list.length && ! odd.length )
    {
        if( st.q.trim() ) setGridMsg( NayiveUI.tf( "photos.noMatch", { q: st.q.trim() } ) );
        return;
    }

    // list is already sorted by ts - split it into consecutive day-groups
    const groups = [];
    for( const p of list )
    {
        const g = groups[ groups.length - 1 ];
        if( g && g.day === p.day ) g.items.push( p );
        else groups.push( { day: p.day, items: [ p ] } );
    }

    const sentinel = document.createElement( "div" );
    sentinel.style.height = "1px";
    grid.appendChild( sentinel );

    let gi = 0;
    function addBatch()
    {
        const frag = document.createDocumentFragment();
        const end  = Math.min( groups.length, gi + 4 );
        for( ; gi < end; gi++ )
        {
            const g = groups[ gi ];
            const h = document.createElement( "div" );
            h.className = "day-h";
            h.innerHTML = esc( dayLabel( g.day ) ) + "<span>" + esc( NayiveUI.tf( "photos.nPhotos", { n: g.items.length } ) ) + "</span>";
            const shots = document.createElement( "div" );
            shots.className = "shots";
            shots.innerHTML = g.items.map( tileHtml ).join( "" );
            frag.appendChild( h );
            frag.appendChild( shots );
        }
        // The HEIC / HEIF tiles come last, after the final day.
        if( gi >= groups.length && odd.length && ! grid.querySelector( ".no-show" ) )
        {
            const h = document.createElement( "div" );
            h.className = "day-h";
            h.innerHTML = "HEIC<span>" + esc( NayiveUI.tf( "photos.nPhotos", { n: odd.length } ) ) + "</span>";
            const shots = document.createElement( "div" );
            shots.className = "shots";
            shots.innerHTML = odd.map( unshownTileHtml ).join( "" );
            frag.appendChild( h );
            frag.appendChild( shots );
        }
        grid.insertBefore( frag, sentinel );
        if( gi >= groups.length && gridObs ) { gridObs.disconnect(); gridObs = null; sentinel.remove(); }
    }

    gridObs = new IntersectionObserver( es =>
    {
        if( ! es.some( e => e.isIntersecting ) ) return;
        addBatch();
        // Still in view (short days, a tall screen)? The observer only speaks
        // on a change, so it would stall here: observing again makes it report
        // the sentinel once more, and the next batch comes in.
        if( gridObs ) { gridObs.unobserve( sentinel ); gridObs.observe( sentinel ); }
    }, { root: grid, rootMargin: "800px" } );
    gridObs.observe( sentinel );

    addBatch();                 // first batch straight away
    if( keepTop )
    {
        while( gi < groups.length && grid.scrollHeight < keepTop + grid.clientHeight ) addBatch();
        grid.scrollTop = keepTop;
    }
}

/* ---------------------------------------------------------------------------
 * MAP (real Leaflet map)
 * -------------------------------------------------------------------------*/
// Leaflet plus the base map (shared/basemap.js and MapLibre GL, vendored with
// Leaflet in trips/lib/), loaded on first use. Only Leaflet and basemap.js are
// required: without MapLibre the base map falls back to the OSM pictures.
let leafletPromise = null;
function ensureLeaflet()
{
    if( leafletPromise ) return leafletPromise;
    const lib = "../trips/lib/";
    const css = href =>
    {
        const l = document.createElement( "link" );
        l.rel = "stylesheet"; l.href = href;
        document.head.appendChild( l );
    };
    const js = src => new Promise( ( resolve, reject ) =>
    {
        const s = document.createElement( "script" );
        s.src = src; s.onload = resolve; s.onerror = () => reject( new Error( src ) );
        document.head.appendChild( s );
    } );
    css( lib + "leaflet_v1.9.4/leaflet.css" );
    css( lib + "maplibre-gl_v5.24.0/maplibre-gl.css" );
    leafletPromise = js( lib + "leaflet_v1.9.4/leaflet.js" )
        .then( () =>
        {
            try { window.L.Icon.Default.imagePath = lib + "leaflet_v1.9.4/images/"; } catch( _ ) {}
            const gl = js( lib + "maplibre-gl_v5.24.0/maplibre-gl.js" )
                .then( () => js( lib + "maplibre-gl-leaflet_v0.1.4/leaflet-maplibre-gl.js" ) )
                .catch( () => {} );
            return Promise.all( [ js( "../shared/basemap.js" ), gl ] );
        } )
        .catch( e => { leafletPromise = null; throw e; } );
    return leafletPromise;
}

async function drawMap()
{
    const geo = PHOTOS.filter( p => p.lat != null );
    updateNoGeoChip();
    $( "#mapEmpty" ).hidden = ! st.geoReady || geo.length > 0;

    if( ! geo.length )
    {
        if( st.map ) { st.map.remove(); st.map = null; st.markers = []; }
        return;
    }

    try { await ensureLeaflet(); }
    catch( _ )
    {
        $( "#mapEmpty" ).textContent = NayiveUI.t( 'photos.mapFailed' );
        $( "#mapEmpty" ).hidden = false;
        return;
    }
    if( st.mode !== "map" ) return;

    if( ! st.map )
    {
        st.map = L.map( "lmap", { zoomControl: true, attributionControl: true } );
        NayiveBaseMap.add( st.map );
    }

    st.markers.forEach( m => m.remove() );
    st.markers = CLUSTERS.map( c =>
    {
        const icon = L.divIcon( {
            className: "", iconSize: [ 34, 30 ], iconAnchor: [ 17, 15 ],
            html: '<div class="mk">' + c.items.length + "</div>",
        } );
        const m = L.marker( [ c.lat, c.lon ], { icon, title: c.place || NayiveUI.tf( "photos.nPhotos", { n: c.items.length } ) } );
        m.on( "click", () => openCluster( c.id ) );
        return m.addTo( st.map );
    } );

    const b = L.latLngBounds( geo.map( p => [ p.lat, p.lon ] ) );
    st.map.fitBounds( b.pad( 0.25 ), { maxZoom: 16, animate: false } );
    setTimeout( () => { if( st.map ) st.map.invalidateSize(); }, 60 );
}

function updateNoGeoChip()
{
    const noN = PHOTOS.filter( p => p.lat == null ).length;
    const chip = $( "#nogeoChip" );
    chip.hidden = ! st.geoReady || noN === 0;
    chip.textContent = NayiveUI.tf( "photos.nNoPlace", { n: noN } );
}

function openCluster( id )
{
    let list, title;
    if( id === "__none" )
    {
        list  = PHOTOS.filter( p => p.lat == null );
        title = NayiveUI.t( 'photos.noPlace' );
        st.cluster = "__none";
    }
    else
    {
        const c = CLUSTERS[ id ];
        if( ! c ) return;
        list  = c.items.slice();
        title = c.place || NayiveUI.tf( "photos.nPhotos", { n: c.items.length } );
        st.cluster = id;
        if( st.map ) st.map.panTo( [ c.lat, c.lon ], { animate: true } );
    }
    if( ! list.length ) return;

    $( "#stripTitle" ).textContent = title + "  ·  " + list.length;
    $( "#stripScroll" ).innerHTML = list.map( p =>
        '<button class="tile" data-id="' + esc( p.id ) + '" title="' + esc( p.time + ( p.place ? " · " + p.place : "" ) ) + '">' + sceneHtml( p, true ) + '<span class="cap">' + esc( p.time ) + "</span></button>" ).join( "" );
    $$( "#stripScroll .tile" ).forEach( el => el.addEventListener( "click", () => openLb( el.dataset.id, list ) ) );
    $( "#strip" ).classList.add( "open" );

function closeStrip()
{

}

/* ---------------------------------------------------------------------------
 * LIGHTBOX
 * -------------------------------------------------------------------------*/
// The lightbox holds the photo's id (st.lbId), not only its place in the
// list: the scan re-sorts the photos under it, and ?photo= (Chat's "Abrir en
// Fotos") then jumped to another one.
function openLb( id, list )
{
    st.list = list || photos();
    st.lb   = Math.max( 0, st.list.findIndex( p => p.id === id ) );
    st.lbId = id;
    paintLb();
    $( "#lb" ).classList.add( "open" );
}
function paintLb()
{
    const at = st.list.findIndex( p => p.id === st.lbId );
    if( at !== -1 ) st.lb = at;
    const p = st.list[ st.lb ];
    if( ! p ) return;
    st.lbId = p.id;
    paintScene( $( "#lbScene" ), p );
    $( "#lbTitle" ).textContent = p.place || p.name;
    $( "#lbMeta" ).textContent  = dayLabel( p.day ) + " · " + p.time;
    $( "#lbMap" ).style.display = ( p.cluster != null ) ? "" : "none";
    const c = noteFor( p.id );
    $( "#lbNote" ).hidden = ! c;
    $( "#lbNoteText" ).textContent = c;
}
function lbStep( d )
{
    if( ! st.list.length ) return;
    st.lb   = ( st.lb + d + st.list.length ) % st.list.length;
    st.lbId = st.list[ st.lb ].id;
    paintLb();
}
function closeLb() { $( "#lb" ).classList.remove( "open" ); }

/* ---------------------------------------------------------------------------
 * PASE (automatic playback)
 * -------------------------------------------------------------------------*/
function startPase( idx, autoplay )
{
    const list = photos();
    if( ! list.length ) return;
    st.paseStarted = true;
    st.paseIdx = idx % list.length;
    st.ab = false;
    $( "#paseA" ).className = "pase-photo"; $( "#paseB" ).className = "pase-photo";
    $( "#paseA" ).innerHTML = ""; $( "#paseB" ).innerHTML = "";
    renderTicks( list );
    showPase();
    setPlaying( autoplay !== false );
}
function renderTicks( list )
{
    const box = $( "#paseTicks" );
    box.innerHTML = "";
    if( list.length < 2 ) return;
    list.forEach( ( p, i ) =>
    {
        if( i > 0 && p.day !== list[ i - 1 ].day )
        {
            const t = document.createElement( "div" );
            t.className = "pase-tick";
            t.style.left = ( i / ( list.length - 1 ) * 100 ) + "%";
            box.appendChild( t );
        }
    } );
}
function showPase()
{
    const list = photos();
    const p    = list[ st.paseIdx ];
    if( ! p ) return;
    const cur  = st.ab ? $( "#paseB" ) : $( "#paseA" );
    const nxt  = st.ab ? $( "#paseA" ) : $( "#paseB" );

    nxt.innerHTML = sceneHtml( p );
    nxt.style.setProperty( "--dwell", ( st.speed / 1000 ) + "s" );
    nxt.classList.toggle( "pase-kb", ! reduced() );
    const sc = nxt.querySelector( ".scene" );
    if( sc && ! reduced() )
    {
        sc.style.transform = "scale(1)";
        requestAnimationFrame( () => requestAnimationFrame( () => { sc.style.transform = "scale(1.09)"; } ) );
    }
    nxt.classList.add( "show" );
    cur.classList.remove( "show" );
    st.ab = ! st.ab;

    $( "#paseTitle" ).textContent = p.place || p.name;
    $( "#paseMeta" ).textContent  = dayLabel( p.day ) + " · " + p.time;
    $( "#paseCount" ).textContent = ( st.paseIdx + 1 ) + " / " + list.length;
    $( "#paseProg" ).style.width  = ( ( st.paseIdx + 1 ) / list.length * 100 ) + "%";

    const c = noteFor( p.id );
    $( "#paseNote" ).hidden = ! c;
    $( "#paseNote" ).textContent = c;
}
function paseStep( d )
{
    const list = photos();
    if( ! list.length ) return;
    st.paseIdx = ( st.paseIdx + d + list.length ) % list.length;
    showPase();
    if( st.playing ) armTimer();
}
function armTimer()
{
    clearTimeout( st.timer );
    st.timer = setTimeout( () => paseStep( 1 ), st.speed );
}
function setPlaying( on )
{
    st.playing = on;
    $( "#pPlay" ).innerHTML = on
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    if( on ) armTimer();
    else clearTimeout( st.timer );
}

/* ---------------------------------------------------------------------------
 * EDITAR : the photo opens in Image (apps/image), a window of its own - a
 * desktop window or a browser tab; on a phone, in place of this page (Back
 * comes back here).
 *
 * Its saves come back as file news (GumApi.onFilesChanged), as any other
 * page's do: a photo written over gets its new size + mtime (so a new
 * thumbnail) and a fresh copy; any other change in this folder (a "Save a
 * copy", a file binned or put back) re-reads the folder; the notes file,
 * the notes. Read while this page is hidden, the news waits for it to show.
 * -------------------------------------------------------------------------*/
const PHONE         = matchMedia( "(max-width: 640px)" );
const COMMENTS_FILE = "data/photos/comments.json";     // NayiveMedia's notes sidecar

function editPhoto( id )
{
    const p = photos().find( x => x.id === id );
    if( ! p ) return;
    if( DEMO ) { NayiveUI.toast( NayiveUI.t( 'photos.demoNoEdit' ) ); return; }
    if( EDIT_EXT.indexOf( extOf( p.name ) ) === -1 )
    {
        NayiveUI.toast( NayiveUI.t( 'photos.cantEdit' ) );
        openLb( id, photos() );
        return;
    }
    const url = "../image/index.html?file=" + encodeURIComponent( p.path );
    if( PHONE.matches ) location.href = url;
    else                window.open( url, "_blank" );
}

let newsPaths   = new Set();
let newsFolders = false;     // something was binned, renamed or made
let newsTimer   = 0;
let newsWaiting = false;     // news came while hidden

function onFilesNews( msg )
{
    if( DEMO ) return;
    const mine = ( msg.paths || [] ).filter( p => typeof p === "string" &&
                   ( p === COMMENTS_FILE || p.slice( 0, p.lastIndexOf( "/" ) ) === DIR ) );
    if( ! mine.length ) return;
    mine.forEach( p => newsPaths.add( p ) );
    if( msg.folders ) newsFolders = true;
    if( document.hidden ) { newsWaiting = true; return; }
    clearTimeout( newsTimer );
    newsTimer = setTimeout( applyNews, 400 );     // a burst of saves = one refresh
}

async function applyNews()
{
    const paths = [ ...newsPaths ], folders = newsFolders;
    newsPaths   = new Set();
    newsFolders = false;

    if( paths.includes( COMMENTS_FILE ) ) await loadComments();

    const shown = p => IMG_EXT.indexOf( extOf( p ) ) !== -1 || HEIC_EXT.indexOf( extOf( p ) ) !== -1;
    const files = paths.filter( p => p !== COMMENTS_FILE && shown( p ) );
    const known = files.map( f => PHOTOS.find( x => x.path === f ) );
    if( folders || known.some( p => ! p ) ) { await loadFolder( null, true ); return; }

    for( const p of known ) { p.bust = Date.now(); await refreshStat( p ); }
    renderGrid();
    if( st.cluster != null ) openCluster( st.cluster );
    if( $( "#lb" ).classList.contains( "open" ) ) paintLb();
}

document.addEventListener( "visibilitychange", () =>
{
    if( ! newsWaiting || document.hidden ) return;
    newsWaiting = false;
    applyNews();
} );

/* ---------------------------------------------------------------------------
 * MODES
 * -------------------------------------------------------------------------*/
function setMode( m )
{
    // A slideshow of nothing (an empty folder, a search that matches no photo)
    // is not started: it stayed blank until a reload.
    if( m === "pase" && ! photos().length )
    {
        NayiveUI.toast( PHOTOS.length ? NayiveUI.tf( "photos.noMatch", { q: st.q.trim() } ) : NayiveUI.t( 'photos.noPhotos' ) );
        return;
    }
    st.mode = m;
    // The map and the slideshow pick nothing: a selection made on the grid ends.
    if( browse && m !== "grid" && m !== "lista" && m !== "editar" ) browse.clear();
    // "grid" and "lista" are the same pane (#grid), just laid out differently;
    // "lista" adds body.view-list, which the #grid CSS keys off.
    const sheet = ( m === "grid" || m === "lista" || m === "editar" );
    $( "#grid" ).hidden = ! sheet;
    $( "#map" ).hidden  = m !== "map";
    $( "#pase" ).hidden = m !== "pase";
    $( "#editHint" ).hidden = m !== "editar";
    document.body.classList.toggle( "pase", m === "pase" );
    document.body.classList.toggle( "view-list", m === "lista" );
    $$( ".tb-modes .icon-btn" ).forEach( b =>
    {
        const on = b.dataset.mode === m;
        b.classList.toggle( "is-active", on );
        b.setAttribute( "aria-selected", on );
    } );

    if( m !== "map" ) closeStrip();

    if( m === "pase" )
    {
        if( ! st.paseStarted ) startPase( 0, true );
        else setPlaying( true );
    }
    else setPlaying( false );

    if( m === "map" ) drawMap();
}

/* ---------------------------------------------------------------------------
 * WIRING
 * -------------------------------------------------------------------------*/
$$( ".tb-modes .icon-btn" ).forEach( b => b.addEventListener( "click", () => setMode( b.dataset.mode ) ) );

// Header search: filter the sheet by file name or comment (see photos()). Also re-labels

{

NayiveMedia.wireSearchToggle();                        // the search fold

// Reload: re-list the folder from the server (picks up added / removed files).
$( "#reloadBtn" ).addEventListener( "click", () =>
{

// A HEIC / HEIF tile (not a photo the browser can pick: it has no data-id)
// still answers one click. The photo tiles are the item browser's (see ITEM
// BROWSER below): a click picks, a double-click / Enter / a tap opens.

$( "#grid" ).addEventListener( "click", e =>
{

} );

// The crumb changes the folder Photos remembers, then re-opens on it. In DEMO
// (not signed in) there is nothing to change, so it does nothing.
NayiveMedia.wireCrumbPicker( { app: "photos", allowRoot: true, when: () => ! DEMO } );

$( "#addBtn"   ).addEventListener( "click", () => $( "#addInput" ).click() );
$( "#shareBtn" ).addEventListener( "click", () =>
{
    // The album we are looking at, shared read-only with another user of this
    // server. DEMO / already-shared folders never get here (the button is hidden).
    NayiveUI.shareSheet( { path: DIR, app: "photos", title: dirLabel(), canAdd: true } );
} );

$( "#lbPrev" ).addEventListener( "click", () => lbStep( -1 ) );
$( "#lbNext" ).addEventListener( "click", () => lbStep( 1 ) );

// Phone: a swipe left / right on the photo steps through the list (the arrow
// buttons stay for mouse users). A mostly-vertical drag is left alone.
( function ()
{
    const zone = $( "#lb .lb-photo" );
    let x0 = null, y0 = null;
    zone.addEventListener( "touchstart", e => { const t = e.touches[ 0 ]; x0 = t.clientX; y0 = t.clientY; }, { passive: true } );
    zone.addEventListener( "touchend", e =>
    {
        if( x0 == null ) return;
        const t = e.changedTouches[ 0 ], dx = t.clientX - x0, dy = t.clientY - y0;
        x0 = y0 = null;
        if( Math.abs( dx ) > 48 && Math.abs( dx ) > Math.abs( dy ) * 1.5 ) lbStep( dx < 0 ? 1 : -1 );
    }, { passive: true } );
} )();
$( "#lbX" ).addEventListener( "click", closeLb );
$( "#lbMap" ).addEventListener( "click", () =>
{
    const p = st.list[ st.lb ];
    closeLb();
    setMode( "map" );
    if( p && p.cluster != null ) openCluster( p.cluster );
} );
$( "#lbPlay" ).addEventListener( "click", () =>
{
    const startId = st.list[ st.lb ].id;
    closeLb();
    setMode( "pase" );
    startPase( Math.max( 0, photos().findIndex( p => p.id === startId ) ), true );
} );

$( "#pPrev" ).addEventListener( "click", () => paseStep( -1 ) );
$( "#pNext" ).addEventListener( "click", () => paseStep( 1 ) );
$( "#pPlay" ).addEventListener( "click", () => setPlaying( ! st.playing ) );
$( "#pSpeed" ).addEventListener( "click", () =>
{
    st.speed = st.speed === 3000 ? 6000 : st.speed === 6000 ? 12000 : 3000;
    $( "#pSpeed" ).textContent = ( st.speed / 1000 ) + " s";
    if( st.playing ) armTimer();
} );
$( "#paseX" ).addEventListener( "click", () => setMode( "grid" ) );

document.addEventListener( "keydown", e =>
{
    if( $( "#lb" ).classList.contains( "open" ) )
    {
        // preventDefault: the same Esc must not also clear the picked photos.
        if( e.key === "Escape" ) { e.preventDefault(); closeLb(); }
        if( e.key === "ArrowLeft" ) lbStep( -1 );
        if( e.key === "ArrowRight" ) lbStep( 1 );
        return;
    }
    if( st.mode === "pase" )
    {
        if( e.key === "Escape" ) setMode( "grid" );
        if( e.key === " " ) { e.preventDefault(); setPlaying( ! st.playing ); }
        if( e.key === "ArrowLeft" ) paseStep( -1 );
        if( e.key === "ArrowRight" ) paseStep( 1 );
    }
} );

/* ---------------------------------------------------------------------------
 * ITEM BROWSER + ALBUMS  (shared/browser.js, docs/item-browser-plan.md)
 *
 * The photo tiles are picked like any list: a click picks one, Ctrl / Shift
 * add, a double-click / Enter / a tap opens it (the lightbox; in Editar mode
 * the editor), a long-press starts picking on a phone. ONE action list
 * (photoActions) feeds the header's selection group, the menu (right-click,
 * a tile's ⋮, the header ⋮) and the keys.
 *
 * The albums are the photo folder (ROOT) and its sub-folders, in the shared
 * tree. A click opens an album by opening this page again at ?dir= (&root=
 * keeps the tree's top): the loads, scans and sweeps above all read DIR, so
 * the folder is never swapped under one of them half-way. Photos dropped on
 * an album move there; an album has its own menu (albumMenu).
 *
 * Moves, copies and the bin are Drive's own calls in Drive's order
 * (drive/move-copy.js, drive/actions.js): GumApi.rename / the server's copy /
 * GumApi.binPaths, then NayiveMedia.remapPaths / copyPaths / purgePaths, so
 * the notes and the scan caches follow the photos. Moves and the bin have an
 * Undo; when the open album itself moved or went, the page opens where it is
 * now (or the album above) and the Undo comes along (carryUndo).
 * -------------------------------------------------------------------------*/
let browse   = null;          // NayiveUI.browser on #grid
let treeView = null;          // NayiveUI.tree in #treePane
let ROOT     = null;          // the tree's top folder (albumRoot)
let ALBUMS   = null;          // ROOT's node of GumApi.dirTree(): { path, nodes }
let albumIndexShown = false;  // #grid holds the album cards (renderAlbums)

const TREE_OPEN_KEY = "photos-tree-open";        // localStorage: the open albums
const CARRY_KEY     = "photos-carry-undo";       // sessionStorage: an Undo across a re-open
const MAP_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg>';

let treeOpen = new Set();
try { treeOpen = new Set( JSON.parse( localStorage.getItem( TREE_OPEN_KEY ) || "[]" ) ); } catch( _ ) {}
function saveTreeOpen() { try { localStorage.setItem( TREE_OPEN_KEY, JSON.stringify( [ ...treeOpen ] ) ); } catch( _ ) {} }

// `path` is `top` or lives inside it.
function under( path, top ) { return path === top || path.indexOf( top + "/" ) === 0; }

// The tree's top: the &root= it was opened with, else the folder Photos
// remembers (data/photos/config.json) - when the open album is inside it;
// else the open album itself (opened from Drive on a folder of its own, or
// an album someone shared with us).
async function albumRoot()
{
    const asked = PARAMS.get( "root" );
    if( asked && under( DIR, asked ) ) return asked;
    if( RO ) return DIR;
    try
    {
        const cfg = await GumApi.readJson( "data/photos/config.json" );
        const f   = cfg && typeof cfg.folder === "string" ? ( cfg.folder.replace( /\/+$/, "" ) || "files" ) : "";
        if( f && under( DIR, f ) ) return f;
    }
    catch( _ ) {}
    return DIR;
}

// This page, opened on another album (the tree's top goes along).
function albumUrl( path )
{
    return "?dir=" + encodeURIComponent( path ) + ( path !== ROOT ? "&root=" + encodeURIComponent( ROOT ) : "" );
}

function albumName( path ) { return path === "files" ? NayiveUI.t( "ui.filesRoot" ) : ( path === DIR && RO ? dirLabel() : baseName( path ) ); }

// ROOT's node in the folders-only tree of the whole account (one call).
function findDir( node, path )
{
    if( ! node ) return null;
    if( node.path === path ) return node;
    for( const n of node.nodes || [] )
        if( Array.isArray( n.nodes ) && ( n.path === "" || under( path, n.path ) ) ) return findDir( n, path );
    return null;
}

let albumsSeq = 0;
async function loadAlbums()
{
    const my = ++albumsSeq;
    let top = null;
    try { top = findDir( await GumApi.dirTree(), ROOT ); } catch( _ ) { return; }
    if( my !== albumsSeq || ! top ) return;
    ALBUMS = top;
    if( treeView ) treeView.render();
}

// The tree's rows: ROOT and its sub-folders, by name.
function albumNodes()
{
    if( ! ALBUMS ) return [];
    const byName = ( a, b ) => baseName( a.path ).localeCompare( baseName( b.path ), NayiveUI.lang(), { sensitivity: "base", numeric: true } );
    const mk = ( n, top ) => ( {
        id:     n.path,
        name:   albumName( n.path ),
        kids:   ( n.nodes || [] ).filter( k => Array.isArray( k.nodes ) ).sort( byName ).map( k => mk( k, false ) ),
        noDrag: top || RO
    } );
    return [ mk( ALBUMS, true ) ];
}

// Items (photos or albums) may go into `dest`: not into themselves, not where
// they already are, never into an album someone shared with us.
function canDropOn( ids, dest )
{
    if( RO || DEMO || ! ids || ! ids.length || NayiveUI.isShared( dest ) ) return false;
    return ids.every( p => ! under( dest, p ) && NayiveMedia.dirOf( p ) !== dest );
}

function wireTree()
{
    $( "#treePane" ).hidden = false;
    $( "#paneResizer" ).hidden = false;
    $( "#treeBtn" ).hidden = false;
    // The open album shows, its albums above it open.
    treeOpen.add( ROOT );
    for( let p = DIR; p && p !== ROOT && under( p, ROOT ); p = NayiveMedia.dirOf( p ) ) treeOpen.add( NayiveMedia.dirOf( p ) );

    treeView = NayiveUI.tree( {
        host:    $( "#tree" ),
        pane:    $( "#treePane" ),
        roots:   albumNodes,
        isOpen:  id => treeOpen.has( id ),
        setOpen: ( id, v ) => { if( v ) treeOpen.add( id ); else treeOpen.delete( id ); saveTreeOpen(); },
        current: () => DIR,
        go:      id => { if( id !== DIR ) location.href = albumUrl( id ); },
        menu:    ( id, x, y, anchor ) => NayiveUI.menuAt( x, y, albumMenu( id ), { anchor: anchor } ),
        drag:    id => ( id === ROOT || RO || DEMO ) ? null : [ id ],
        drop:    { can:  ( ids, dest ) => canDropOn( ids, dest ) ? "inside" : false,
                   drop: ( ids, dest ) => { movePaths( ids, dest ); } }
    } );
    $( "#treeBtn" ).addEventListener( "click", () => treeView.openSheet() );
    NayiveUI.paneResizer( $( "#paneResizer" ), $( "#treePane" ),
    {
        min: 150, max: 420, def: 220, key: "photos-tree-w", off: () => PHONE.matches,
        set: w => document.documentElement.style.setProperty( "--tree-w", w + "px" )
    } );
}

// An album's menu (right-click, its ⋮, a long-press in the tree). The top
// album only makes new ones: it is the folder Photos is set to.
function albumMenu( path )
{
    const off = RO || DEMO, top = path === ROOT;
    return [
        { id: "newAlbum", label: NayiveUI.t( "photos.newAlbum" ), icon: "folderplus", disabled: off, run: () => newAlbum( path ) },
        { sep: true },
        { id: "rename",   label: NayiveUI.t( "ui.rename" ),  icon: "edit",  disabled: off || top, run: () => renameAlbum( path ) },
        { id: "move",     label: NayiveUI.t( "ui.moveTo" ),  icon: "move",  disabled: off || top, run: () => pickAlbumFor( [ path ], "move" ) },
        { sep: true },
        { id: "bin",      label: NayiveUI.t( "ui.toTrash" ), icon: "trash", disabled: off || top, danger: true, run: () => binPaths( [ path ] ) }
    ];
}

// The photo actions: ONE list for the header group, the menu and the keys.
function photoActions()
{
    const one  = ids => ids.length === 1;
    const mine = () => ! RO && ! DEMO;
    return [
        { id: "open", label: NayiveUI.t( "ui.open" ), icon: "external", key: "Enter", group: 0, when: one,
          run: ids => openPhoto( ids[ 0 ] ) },
        { id: "edit", label: NayiveUI.t( "photos.editInImage" ), icon: "edit", key: "E", bar: 4, group: 0, where: mine,
          when: ids => one( ids ) && EDIT_EXT.indexOf( extOf( ids[ 0 ] ) ) !== -1, run: ids => editPhoto( ids[ 0 ] ) },
        { id: "share", label: NayiveUI.t( "ui.share" ), icon: "share", bar: 1, phone: 1, group: 1, where: mine, when: one,
          run: ids => NayiveUI.shareSheet( { path: ids[ 0 ], app: "file", title: baseName( ids[ 0 ] ), canAdd: false } ) },
        { id: "download", label: NayiveUI.t( "ui.download" ), icon: "download", key: "Ctrl+D", bar: 2, group: 1,
          where: () => ! DEMO, when: () => ! dlBusy, run: downloadPaths },
        { id: "move", label: NayiveUI.t( "photos.moveToAlbum" ), icon: "move", bar: 3, phone: 1, group: 2, where: mine,
          run: ids => pickAlbumFor( ids, "move" ) },
        { id: "copyTo", label: NayiveUI.t( "photos.copyToAlbum" ), icon: "copy", group: 2, where: mine,
          run: ids => pickAlbumFor( ids, "copy" ) },
        { id: "map", label: NayiveUI.t( "photos.seeOnMap" ), icon: MAP_PIN, group: 2,
          when: ids => ids.every( id => { const p = photoById( id ); return !! p && p.cluster != null; } ), run: showOnMap },
        { id: "bin", label: NayiveUI.t( "ui.toTrash" ), icon: "trash", key: NayiveUI.isMac ? [ "Del", "Backspace" ] : "Del",
          bar: 9, phone: 1, group: 3, danger: true, where: mine, run: ids => binPaths( ids ) }
    ];
}

// Right-click on empty space: what you add here.
function areaActions()
{
    return [
        { id: "upload", label: NayiveUI.t( "photos.uploadHere" ), icon: "upload", where: () => ! $( "#addBtn" ).hidden,
          run: () => $( "#addInput" ).click() },
        { id: "newAlbum", label: NayiveUI.t( "photos.newAlbum" ), icon: "folderplus", where: () => ! RO && ! DEMO,
          run: () => newAlbum( DIR ) }
    ];
}

function wireBrowser()
{
    browse = NayiveUI.browser( {
        list:    $( "#grid" ),
        row:     ".tile[data-id]",
        bar:     $( "#selActions" ),
        actions: photoActions(),
        area:    areaActions(),
        tree:    treeView,
        // Not while a photo is full screen, nor on the map or in the slideshow.
        active:  () => ! $( "#lb" ).classList.contains( "open" ) && ( st.mode === "grid" || st.mode === "lista" || st.mode === "editar" ),
        grid:    () => st.mode !== "lista",
        open:    id => openPhoto( id ),
        search:  () => $( "#searchToggle" ).click(),
        drag:    { can: () => ! RO && ! DEMO, text: ids => ids.map( baseName ).join( "\n" ) }
    } );
}

// Open: the lightbox - or, in Editar mode, the editor (as a tap there did).
function openPhoto( id )
{
    if( st.mode === "editar" && ! RO ) editPhoto( id );
    else openLb( id, photos() );
}

function showOnMap( ids )
{
    const p = photoById( ids[ 0 ] );
    browse.clear();
    setMode( "map" );
    if( p && p.cluster != null ) openCluster( p.cluster );
}

// Download: the server sends it, one photo as it is, several as one .zip
// (server/go/api_download.go) - the same call Drive's Download makes, the
// list in a body when a big pick does not fit the address (postPaths).
let dlBusy = false;
async function downloadPaths( paths )
{
    if( dlBusy || ! paths.length ) return;
    dlBusy = true;
    try
    {
        const r = JSON.parse( await NayiveMedia.postPaths( "/api/download", paths ) );
        const a = document.createElement( "a" );
        a.href     = "/api/download?id=" + encodeURIComponent( r.id );
        a.download = r.name || "";
        document.body.appendChild( a );
        a.click();
        a.remove();
    }
    catch( err )
    {
        NayiveUI.toast( NayiveUI.t( err && err.tooMany ? "drive.pickTooMany" :
                                    err && err.status === 413 ? "drive.compressTooMany" : "drive.downloadFailed" ) );
    }
    finally { dlBusy = false; }
}

// A name for a new album or a rename: a small dialog (shared/ui.js askText).
// Resolves the trimmed name, or null.
function askName( title, value, okTitle )
{
    return NayiveUI.askText( { title: title, value: value, okTitle: okTitle, okClass: "name-ok",
                               placeholder: NayiveUI.t( "photos.albumName" ) } );
}
function okName( name ) { return !! name && name !== "." && name !== ".." && ! /[\/\\]/.test( name ); }

async function newAlbum( parent )
{
    if( RO || DEMO ) return;
    const name = await askName( NayiveUI.t( "photos.newAlbum" ), "", NayiveUI.t( "photos.newAlbum" ) );
    if( name == null ) return;
    if( ! okName( name ) ) { NayiveUI.toast( NayiveUI.t( "drive.createFolderFailed" ) ); return; }
    setSync( "saving" );
    try { await GumApi.makeDir( parent, name ); }
    catch( _ ) { setSync( "synced" ); NayiveUI.toast( NayiveUI.t( "drive.createFolderFailed" ) ); return; }
    setSync( "synced" );
    treeOpen.add( parent );
    saveTreeOpen();
    if( albumIndexShown && parent === DIR ) reloadView();
    else loadAlbums();
}

// The names already in `dest` (one listing) - Drive's destNameSet. Empty on
// failure: the server's own clash guard is the real backstop.
async function destNameSet( dest )
{
    try { return await GumApi.namesIn( dest ); }
    catch( _ ) { return new Set(); }
}

// Where `path` is after the moves in `pairs` ([ old, new ]) - Drive's followPath.
function followPath( path, pairs )
{
    for( const pr of pairs )
    {
        if( path === pr[ 0 ] )                    return pr[ 1 ];
        if( path.indexOf( pr[ 0 ] + "/" ) === 0 ) return pr[ 1 ] + path.slice( pr[ 0 ].length );
    }
    return path;
}

// "Move to album…" / "Copy to album…" (and an album's "Move to…"): the shared
// picker with the albums tree.
async function pickAlbumFor( paths, mode )
{
    if( ! paths.length ) return;
    const what = paths.length === 1 ? '"' + baseName( paths[ 0 ] ) + '"' : NayiveUI.tf( "drive.nItems", { n: paths.length } );
    const dest = await NayiveUI.pickNode( {
        title:    NayiveUI.t( mode === "move" ? "drive.moveTo" : "drive.copyTo" ),
        okLabel:  NayiveUI.t( mode === "move" ? "drive.move" : "ui.copy" ),
        roots:    albumNodes,
        current:  DIR,
        lit:      null,
        disabled: id => mode === "move" ? ! canDropOn( paths, id ) : ( NayiveUI.isShared( id ) || paths.some( p => under( id, p ) ) ),
        note:     lit => lit === null ? NayiveUI.tf( "drive.pickDest", { what: what } )
                                      : NayiveUI.tf( mode === "move" ? "drive.moveWhatTo" : "drive.copyWhatTo", { what: what, dst: albumName( lit ) } )
    } );
    if( dest === null ) return;
    if( mode === "move" ) await movePaths( paths, dest );
    else                  await copyPaths( paths, dest );
}

// Move photos or albums into `dest` - Drive's doMove: the names already
// there are found first, and Replace (theirs to the bin) or Skip is asked.
let moveBusy = false;
async function movePaths( paths, dest )
{
    if( moveBusy || ! paths.length ) return;
    moveBusy = true;
    try
    {
        const names = await destNameSet( dest );
        const items = [];
        let skipped = 0;
        for( const p of paths )
        {
            if( NayiveMedia.dirOf( p ) === dest ) { skipped++; continue; }     // already there
            items.push( { from: p, to: dest + "/" + baseName( p ), clash: names.has( baseName( p ) ) } );
        }
        const clashes = items.filter( it => it.clash );
        let replace = false;
        if( clashes.length )
            replace = await NayiveUI.confirm( {
                title:   NayiveUI.t( "drive.clashesTitle" ),
                body:    ( clashes.length === 1 ? NayiveUI.tf( "drive.oneClashDest", { name: baseName( clashes[ 0 ].from ) } )
                                                : NayiveUI.tf( "drive.nClashesDest", { n: clashes.length } ) ) +
                         "\n\n" + NayiveUI.t( "drive.clashesHint" ),
                confirm: NayiveUI.t( "drive.replace" ), cancel: NayiveUI.t( "drive.skip" ), danger: true } ) === true;
        await runMoves( items, replace, skipped, null, "drive.moveFailed" );
    }
    finally { moveBusy = false; }
}

// Rename an album. A name already taken beside it is refused: the server
// never renames onto an existing item.
async function renameAlbum( path )
{
    if( RO || DEMO || path === ROOT ) return;
    const old  = baseName( path );
    const name = await askName( NayiveUI.t( "ui.rename" ), old, NayiveUI.t( "ui.rename" ) );
    if( name == null || name === old ) return;
    if( ! okName( name ) ) { NayiveUI.toast( NayiveUI.tf( "drive.renameFailed", { err: name } ) ); return; }
    const parent = NayiveMedia.dirOf( path );
    if( ( await destNameSet( parent ) ).has( name ) ) { NayiveUI.toast( NayiveUI.t( "drive.nameExistsTitle" ) ); return; }
    if( moveBusy ) return;
    moveBusy = true;
    try { await runMoves( [ { from: path, to: parent + "/" + name, clash: false } ], false, 0, NayiveUI.t( "ui.toast.renamed" ), "drive.renameFailed" ); }
    finally { moveBusy = false; }
}

// The moves themselves: `items` = [ { from, to, clash } ]. Drive's order: a
// clash being replaced goes to the bin first, then GumApi.rename; whatever
// did move takes its sidecars along (NayiveMedia.remapPaths) - after a
// failure too. Each step is what the Undo walks back (runUndo).
async function runMoves( items, replace, skipped, okMsg, failKey )
{
    setSync( "saving" );
    const steps = [], remapped = [];
    let moved = 0, canUndo = true, failed = null;
    try
    {
        for( const it of items )
        {
            if( it.clash && ! replace ) { skipped++; continue; }
            const step = { from: it.from, to: it.to, moved: false, bin: null };
            steps.push( step );
            if( it.clash )
            {
                step.bin = await GumApi.binPaths( [ it.to ] );     // the one in the way -> the bin
                if( ! step.bin ) canUndo = false;                   // an old server: no way back
            }
            await GumApi.rename( it.from, it.to );
            step.moved = true;
            remapped.push( [ it.from, it.to ] );
            moved++;
        }
    }
    catch( err ) { failed = err; }
    await NayiveMedia.remapPaths( remapped );          // best-effort, never throws
    setSync( "synced" );

    const done = steps.filter( s => s.moved || s.bin );
    const undo = done.length && canUndo ? { kind: "moves", steps: done } : null;
    const msg  = failed ? NayiveUI.tf( failKey, { err: failed && failed.message || failed } )
               : okMsg || ( NayiveUI.tf( "drive.nMoved", { n: moved } ) + ( skipped ? " · " + NayiveUI.tf( "drive.nSkipped", { n: skipped } ) : "" ) );
    settle( remapped.map( r => r[ 0 ] ), followPath( DIR, remapped ), msg, undo );
}

// Copy photos (or an album) into `dest` - Drive's doCopy: one server copy per
// item, disk to disk, under a free name; the notes come along (copyPaths).
async function copyPaths( paths, dest )
{
    setSync( "saving" );
    const copied = [];
    let files = 0, failed = null;
    try
    {
        const taken = await destNameSet( dest );
        for( const p of paths )
        {
            const name = NayiveUI.uniqueName( baseName( p ), taken );
            taken.add( name );
            const to  = dest + "/" + name;
            const q   = new URLSearchParams( { from: p, "new": to } ).toString();
            const res = JSON.parse( await GumApi.fetchText( GumApi.API_FILES + "?" + q, { method: "POST" } ) );
            files += ( res && res.files ) || 0;
            copied.push( [ p, to ] );
        }
    }
    catch( err ) { failed = err; }
    await NayiveMedia.copyPaths( copied );
    setSync( "synced" );
    if( failed ) NayiveUI.toast( failed.status === 507 ? NayiveUI.t( "ui.room.none" )
                                                       : NayiveUI.tf( "drive.copyFailed", { err: failed && failed.message || failed } ) );
    else NayiveUI.toast( NayiveUI.tf( "drive.nCopied", { n: files } ) );
    if( copied.length && dest === DIR ) reloadView();
    else if( copied.length ) loadAlbums();
}

// To the bin, at once (no question: the toast's Undo brings it back) -
// Drive's confirmDelete: in batches (NayiveMedia.binInBatches: Ctrl+A in a
// big album passed the server's address cap), each batch's scan entries and
// thumbnails purged (the notes stay for a restore). A batch that fails stops
// there: what went before it is shown gone, with its Undo.
let binBusy = false;
async function binPaths( paths )
{
    if( binBusy || ! paths.length || RO || DEMO ) return;
    binBusy = true;
    setSync( "saving" );
    const { ids, went, failed } = await NayiveMedia.binInBatches( paths );
    binBusy = false;
    setSync( "synced" );
    if( ! went.length ) { NayiveUI.toast( NayiveUI.t( "drive.trashFailed" ) ); return; }
    // The open album (or one it is in) went: the album above it opens.
    const gone = went.find( p => under( DIR, p ) );
    settle( went, gone ? NayiveMedia.dirOf( gone ) : DIR, NayiveUI.t( failed ? "drive.trashFailed" : "ui.toast.binned" ),
            ids && ids.length ? { kind: "bin", ids: ids } : null );
}

// After a move or the bin: show the truth. `next` is where the open album is
// now - another place re-opens the page there, the Undo carried along.
function settle( gone, next, msg, undo )
{
    if( next !== DIR ) { carryUndo( msg, undo ); location.href = albumUrl( next ); return; }
    if( albumIndexShown ) reloadView();
    else { dropPhotos( gone ); loadAlbums(); }
    if( undo ) NayiveUI.undoToast( msg, () => { runUndo( undo ).then( () => reloadView() ); } );
    else       NayiveUI.toast( msg );
}

// Photos that left this album: off the screen, without a reload (the scroll
// stays where it is).
function dropPhotos( paths )
{
    const gone = new Set( paths );
    const before = PHOTOS.length + UNSHOWN.length;
    PHOTOS  = PHOTOS.filter( p => ! gone.has( p.path ) );
    UNSHOWN = UNSHOWN.filter( u => ! gone.has( u.path ) );
    if( PHOTOS.length + UNSHOWN.length === before ) return;
    browse.clear();
    buildClusters();
    if( ! PHOTOS.length && ! UNSHOWN.length ) setGridMsg( NayiveUI.t( "photos.noPhotosYet" ) );
    else renderGrid( $( "#grid" ).scrollTop );
    setCrumb();
    updateNoGeoChip();
    if( st.mode === "map" ) drawMap();
}

// The open album read again (after an Undo, a copy into it, a new album on
// the album index). The page is opened again when the album changed kind
// (album cards <-> photos): the toolbar is set for one or the other.
async function reloadView()
{
    let folder = null;
    try { folder = await GumApi.listDir( DIR ); } catch( _ ) {}
    loadAlbums();
    const kids  = ( folder && folder.nodes ) || [];
    const subs  = kids.filter( n => Array.isArray( n.nodes ) );
    const index = !! folder && subs.length > 0 && ! kids.some( n => n.nodes == null && IMG_EXT.indexOf( extOf( n.path ) ) !== -1 );
    if( index !== albumIndexShown ) { location.reload(); return; }
    if( index ) renderAlbums( subs );
    else        await loadFolder( folder, true );       // a reload of our own change: no sweep
}

// The Undo of a move or of the bin - Drive's undoMoves / undoBin: moved
// items go back (in reverse), their sidecars with them, BEFORE what a
// "Replace" binned is restored (or it would land as "name (2)").
async function runUndo( undo )
{
    setSync( "saving" );
    let err = null, res = null;
    if( undo.kind === "bin" )
    {
        try { res = await NayiveMedia.restoreInBatches( undo.ids ); } catch( e ) { err = e; }
    }
    else
    {
        const back = [], ids = [];
        for( const s of undo.steps.slice().reverse() )
        {
            if( s.moved )
            {
                try { await GumApi.rename( s.to, s.from ); }
                catch( e ) { err = err || e; continue; }
                back.push( [ s.to, s.from ] );
            }
            if( s.bin ) ids.push.apply( ids, s.bin );
        }
        await NayiveMedia.remapPaths( back );
        if( ids.length )
        {
            try { res = await NayiveMedia.restoreInBatches( ids ); } catch( e ) { err = err || e; }
        }
    }
    setSync( "synced" );
    if( err ) NayiveUI.toast( undo.kind === "bin" ? NayiveUI.t( "drive.restoreFailed" )
                                                  : NayiveUI.tf( "drive.moveFailed", { err: err && err.message || err } ) );
    else if( res && res.renamed && res.renamed.length ) NayiveUI.toast( NayiveUI.tf( "drive.restoredAs", { name: res.renamed[ 0 ] } ) );
    else if( res ) NayiveUI.toast( NayiveUI.t( "drive.restored" ) );
    return ! err;
}

// The open album moved or went: its Undo rides along to the page opened next
// (sessionStorage: this tab only), shown there for a short while.
function carryUndo( msg, undo )
{
    try { sessionStorage.setItem( CARRY_KEY, JSON.stringify( { msg: msg, undo: undo, back: DIR, ts: Date.now() } ) ); } catch( _ ) {}
}
function offerCarriedUndo()
{
    let c = null;
    try { c = JSON.parse( sessionStorage.getItem( CARRY_KEY ) || "null" ); sessionStorage.removeItem( CARRY_KEY ); } catch( _ ) {}
    if( ! c || typeof c.msg !== "string" || ! ( Date.now() - c.ts < 30000 ) ) return;
    if( ! c.undo ) { NayiveUI.toast( c.msg ); return; }
    NayiveUI.undoToast( c.msg, async () =>
    {
        if( await runUndo( c.undo ) && typeof c.back === "string" ) location.href = albumUrl( c.back );
        else reloadView();
    } );
}

/* ---------------------------------------------------------------------------
 * BOOT
 * -------------------------------------------------------------------------*/
async function boot()
{
    if( ! DIR )
    {
        const picked = await NayiveUI.launcherFolder( {
            app: "photos", allowRoot: true, noRedirect: true,
            title: NayiveUI.t( 'photos.whereFolder' ),
            note:  NayiveUI.t( 'photos.whereFolderNote' ),
            rootLabel: NayiveUI.t( "ui.fp.allFiles" )
        } );
        if( picked ) { DIR = picked; DEMO = false; }
        else
        {
            // No folder. Never the made-up Lisbon trip: offline or with the
            // session gone it passed for his own photos (and asked Nominatim
            // five times). Signed out: to the sign-in page, as every app;
            // offline / a server error: say so; the picker cancelled: say how.
            let who = null;
            try { who = await GumApi.probeAccess(); }
            catch( err )
            {
                if( err && err.status === 401 ) { GumApi.loginRedirect(); return; }
            }
            DEMO = false;                        // the crumb's folder picker works
            setGridMsg( NayiveUI.t( who ? 'photos.needFolder' : 'photos.loadFailed' ) );
            return;
        }
    }

    // The albums tree (its rows come in the background: the photos do not
    // wait for them) and the item browser on the grid.
    ROOT   = await albumRoot();
    ALBUMS = { path: ROOT, nodes: [] };
    wireTree();
    wireBrowser();
    loadAlbums();

    // Before the first loadFolder(), which decides what the toolbar shows.
    CAN_ADD = await NayiveUI.canAddTo( DIR );

    const folder = await NayiveMedia.loadFolderTree( DIR, setGridMsg, false );
    if( ! folder )
    {
        // A shared album that answers 403 was most likely taken back: its
        // thumbs and GPS go now (enrich(), which normally does it, never runs).
        if( RO ) purgeRevokedShares().then( sweepThumbs );
        return;
    }

    // Album index: a folder that only holds sub-folders (one album per trip,
    // say) shows those first; picking one re-opens Photos at ?dir=<that album>.
    const kids = ( folder && folder.nodes ) || [];
    const subs = kids.filter( n => Array.isArray( n.nodes ) );
    const imgs = kids.filter( n => n.nodes == null && IMG_EXT.indexOf( extOf( n.path ) ) !== -1 );
    if( subs.length && ! imgs.length ) { renderAlbums( subs ); offerCarriedUndo(); return; }

    await loadFolder( folder );
    GumApi.onFilesChanged( onFilesNews );        // Image saved a photo here, Drive changed the folder...
    offerCarriedUndo();                          // the open album moved / went a moment ago: its Undo

    // ?photo=<path> (Chat's "Abrir en Fotos"): that photo, straight in the lightbox.
    const want = PARAMS.get( "photo" );
    if( want && PHOTOS.some( p => p.id === want ) ) openLb( want );
}
// shared/gum-api.js, shared/ui.js and shared/photo.js load deferred now, so
// wait for them (deferred scripts all run before DOMContentLoaded) before
// boot() touches GumApi / NayiveUI / NayivePhoto.
NayiveI18n.ready.then( () =>
{
    // The install nudge lives in the launcher only (it is a full dialog now, too
    // much to throw at someone in the middle of their photos). The launcher's
    // settings row also has an "Instalar app" button for asking on purpose.
    boot();
} );

/* ---------------------------------------------------------------------------
 * ALBUM INDEX  - sub-folders of the chosen folder, shown as cards. No EXIF, no
 * map, no slideshow here: it is just a way in to one album.
 * -------------------------------------------------------------------------*/
function renderAlbums( subs )
{
    albumIndexShown = true;
    $( ".tb-modes" ).hidden = true;                // no gallery modes on the album index
    $( ".topbar-actions .search-wrap" ).hidden = true;
    $( "#searchToggle" ).hidden = true;
    $( "#reloadBtn" ).hidden = true;
    $( "#editHint" ).hidden = true;
    $( "#addBtn" ).hidden = true;               // pick an album first, then upload into it

    setCrumbPath( dirLabel() );
    $( "#subStrip" ).textContent = NayiveUI.t( 'photos.pickAlbum' );

    const FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3.6a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

    const box = document.createElement( "div" );
    box.className = "albums";
    subs.sort( ( a, b ) => a.path.toLowerCase() < b.path.toLowerCase() ? -1 : 1 )
        .forEach( n =>
        {
            const card = document.createElement( "button" );
            card.type = "button";
            card.className = "album-card";
            card.innerHTML = FOLDER_SVG + '<span class="a-name"></span>';
            card.querySelector( ".a-name" ).textContent = baseName( n.path );
            card.addEventListener( "click", () => { location.href = albumUrl( n.path ); } );
            box.appendChild( card );
        } );

    const grid = $( "#grid" );
    grid.innerHTML = "";
    grid.appendChild( box );
}
</script>
</body>
</html>
