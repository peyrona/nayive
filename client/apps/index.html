<!-- index.html - Launcher for the Nayive single-page apps. A 3-column grid of the
     apps (Photos / Music / Movies are folder viewers: opened from here they use the
     folder each remembers in its own data/<app>/config.json, asking once via
     NayiveUI.pickFolder the first time; Write, Calc and Text open from the Office tile's popup,
     Contacts, Bookmarks and Passwords from the Records one),
     centred in the viewport, with a settings row below: a gear button that, when pressed,
     rolls from the centre to the left edge while the other tool buttons unfold into place
     to its right, one after another (right-to-left as the gear rolls out, mirrored on the
     way back) - the shared colour-scheme (dark / light) toggle, an account button
     (opens the "Mi cuenta" dialog: the sign-in password, language, timezone, trip
     reminder, this device's notifications and more - see its script; its bottom
     row, on the left, holds the palette button that opens the "Esquemas de color"
     dialog - create / edit custom dark + light schemes; shared/theme.js applies the
     active one everywhere), the install button and the "Cerrar sesión" button. Pressing the gear again - or clicking
     anything else in the launcher - plays it all in reverse. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- A BIG SCREEN STARTS ON THE DESKTOP (desktop/index.html), as this device's
         "Open the desktop" says (balata-desktop's `mode`; the desktop's "⋮" menu
         and My account set it):
           auto   (the default) at least 1024 x 600 with a mouse or touchpad;
           always at least 1024 x 600 either way up (a tablet held upright too),
                  with or without a mouse;
           never  the simple view, always.
         Never inside a frame (the desktop's own menu IS this page), never on a
         phone, never with a query or hash (?here=, enrolment...: this page acts on it), and
         never for an account that must pick its password first (login.html's
         "nayive-must-set": the desktop's apps would all be refused).
         nayiveDeskMode / nayiveWantDesk are used again below (My account, MOUSE CHIP);
         the desktop keeps its own copy of the rule (see its OPEN THE DESKTOP). -->
    <script>
    function nayiveDeskMode()
    {
        try { var m = ( JSON.parse( localStorage.getItem( 'balata-desktop' ) || 'null' ) || {} ).mode; }
        catch( e ) {}
        return m === 'always' || m === 'never' ? m : 'auto';
    }
    function nayiveWantDesk( mode )
    {
        var mq = function ( q ) { return window.matchMedia( q ).matches; };
        if( mode === 'never' || mq( '(max-width: 640px)' ) ) return false;
        if( mode === 'always' ) return mq( '(min-width: 1024px) and (min-height: 600px)' ) || mq( '(min-width: 600px) and (min-height: 1024px)' );
        return mq( '(min-width: 1024px) and (min-height: 600px) and (any-pointer: fine)' );
    }
    try
    {
        if( window.top === window && ! location.search && ! location.hash &&
            sessionStorage.getItem( 'nayive-must-set' ) !== '1' &&
            nayiveWantDesk( nayiveDeskMode() ) ) location.replace( 'desktop/' );
    }
    catch( e ) {}
    </script>
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="shared/i18n.js"></script>
    <title>Apps</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <!-- Shared colour scheme (shared/theme.js: the account's dark / light schemes) — same as every other Nayive app. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="shared/theme.css">
    <link rel="stylesheet" href="shared/app.css">
    <script src="shared/ui.js" defer></script>
    <script src="shared/store.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'launcher',
            title: NayiveUI.t( 'launcher.introTitle' ),
            lead:  NayiveUI.t( 'launcher.introLead' ),
            autoShow:    true,
            dismissible: true,
            buttons: [
                { sel: '#chatBtn',           name: 'Chat', text: NayiveUI.t( 'launcher.introChat' ) },
                { sel: '#mailBtn',           name: 'eMail', text: NayiveUI.t( 'launcher.introMail' ) },
                { sel: '#findBtn',           name: NayiveUI.t( 'find.title' ), text: NayiveUI.t( 'launcher.introFind' ) },
                { section: NayiveUI.t( 'launcher.introSettings' ) },
                { sel: '#gearBtn',           text: NayiveUI.t( 'launcher.introGear' ) },
                { sel: '[data-theme-toggle]', name: NayiveUI.t( 'ui.theme' ), text: NayiveUI.t( 'launcher.introTheme' ) },
                { sel: '#accountBtn',        text: NayiveUI.t( 'launcher.introAccount' ) },
                { sel: '#installBtn',        text: NayiveUI.t( 'launcher.introInstall' ) },
                { sel: '#logoutBtn',         text: NayiveUI.t( 'launcher.introLogout' ) }
            ],
            tip: NayiveUI.t( 'launcher.introTip' )
        } );
    } );
    </script>
    <script>try{
        var _r = document.documentElement;
        if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) _r.setAttribute( 'data-theme', 'light' );
        var _d = JSON.parse( localStorage.getItem( 'balata-schemes' ) || 'null' );
        if( _d && _d.schemes ){
            var _id = _r.getAttribute( 'data-theme' ) === 'light' ? _d.activeLight : _d.activeDark, _s = null;
            for( var _i = 0; _i < _d.schemes.length; _i++ ) if( _d.schemes[ _i ].id === _id ) _s = _d.schemes[ _i ];
            if( _s && _s.tokens ) [ '--bg', '--card', '--card2', '--line', '--accent', '--on-accent' ].forEach( function ( k ){ if( _s.tokens[ k ] ) _r.style.setProperty( k, _s.tokens[ k ] ); } );
        }
    }catch( e ){}</script>
    <script src="shared/theme.js" defer></script>
    <script src="shared/locker.js"></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS; a no-op on the plain-HTTP LAN URL.
         This one service worker (apps/sw.js) also serves the tasks / calendar / contact / planner shells offline. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nayive">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( 'sw.js' ).catch( function () {} ); } );

        // Offer to install the PWA (so photos can be shared straight into it).
        // Runs on every launcher load - so on every login - until the app is
        // installed or the user clicks "No mostrar más". Waits a moment so it
        // doesn't fight the first paint; NayiveUI decides whether to actually
        // show anything (installed / declined / unsupported).
        window.addEventListener( 'load', function () {
            setTimeout( function () { if( window.NayiveUI ) NayiveUI.offerInstall(); }, 1500 );
        } );
        window.addEventListener( 'beforeinstallprompt', function () {
            setTimeout( function () { if( window.NayiveUI ) NayiveUI.offerInstall(); }, 300 );
        } );

        // The "Instalar app" button in the settings row: opens the same dialog by
        // hand (ignores the snooze), so installing is never lost after "No mostrar
        // más". Already installed -> the button leaves the DOM, and with it the
        // help list's row for it.
        NayiveI18n.ready.then( function () {
            var b = document.getElementById( 'installBtn' );
            if( ! b ) return;
            if( window.NayiveUI && NayiveUI.isStandalone() ) { b.remove(); return; }
            b.addEventListener( 'click', function () {
                if( window.NayiveUI ) NayiveUI.offerInstall( { manual: true } );
            } );
            window.addEventListener( 'appinstalled', function () { b.remove(); } );
        } );
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body
        {
            margin: 0;
            font-family: var(--font-sans);
            color: var(--text);
            background: var(--bg);
        }

        .launcher
        {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .panel
        {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 32px 30px 26px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--card);
            box-shadow: 0 16px 40px var(--shadow);
        }

        .grid
        {
            position: relative;               /* holds the engraved logo */
            isolation: isolate;               /* ...which sits under the tiles */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 24px;
            --engrave-groove: color-mix(in srgb, var(--card) 55%, #000);
            --engrave-lit:    color-mix(in srgb, var(--card) 88%, #fff);
        }
        :root[data-theme="light"] .grid
        {
            --engrave-groove: color-mix(in srgb, var(--card) 87%, #000);
            --engrave-lit:    color-mix(in srgb, var(--card) 40%, #fff);
        }

        /* The logo behind the apps, as if engraved in the panel (2026-09-21):
           its lines only (icons/logo-lines.svg) - a groove a shade darker than
           the card, with its lower edge catching the light 1px below. Mixed
           from --card, so a custom scheme gets the same faint depth. Nothing
           moves, nothing takes a click. */
        .grid::before,
        .grid::after
        {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            -webkit-mask: url(icons/logo-lines.svg) center / contain no-repeat;
                    mask: url(icons/logo-lines.svg) center / contain no-repeat;
        }
        .grid::before { background: var(--engrave-lit); transform: translateY(1px); }
        .grid::after  { background: var(--engrave-groove); }
        @media (forced-colors: active) { .grid::before, .grid::after { display: none; } }

        .tile
        {
            position: relative;               /* holds Chat's and eMail's unread badges */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: clamp(88px, 27vw, 110px);
            padding: 16px 8px 12px;
            border-radius: var(--radius-l);
            color: var(--text);
            text-decoration: none;
            transition: background .12s ease, transform .1s ease;
        }
        .tile:hover  { background: color-mix(in srgb, var(--accent) 12%, transparent); }
        .tile:active { transform: scale(0.95); }

        .tile svg { width: 40px; height: 40px; color: var(--accent); flex: 0 0 auto; }

        .tile span
        {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.2;
        }
        .tile:hover span { color: var(--text); }

        /* The desktop's menu: Office's and Records' corner caret, a bit bigger than the toolbar's. */
        :root.in-desktop .tile.has-popup::after { right: 4px; bottom: 4px; border-width: 4px 4px 0; }

        /* The settings row and "Buscar mi móvil" are shared .icon-btn buttons;
           only their size is local - the row's geometry is built on 42px. */
        .tools .icon-btn, .find-btn { width: 42px; height: 42px; }

        /* Settings row: the gear sits dead-centre on its own. Pressing it rolls the gear
           along to the left border - it spins the whole way - while the other tool
           buttons (theme, account, install, logout) unfold into place to its
           right, one after another. Colour schemes live in the account
           dialog's bottom row (2026-09-19). Pressing it again plays the whole thing in reverse. */
        .tools
        {
            position: relative;               /* containing block for the absolutely-placed gear */
            container-type: inline-size;       /* lets the gear park itself at 50cqw (row centre) */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;                  /* last resort on a very narrow screen: a second line */
            row-gap: 10px;
            width: 100%;
            min-height: 42px;
            padding-left: 0;
            overflow: hidden;                 /* clips the extras while they widen into place */
            transition: padding-left .55s ease-in-out;
        }
        .tools.open { padding-left: 42px; }    /* leaves room for the gear at the left edge */

        /* The gear is taken out of the flex flow so it can glide from the centre to the
           left border on its own - and, being sized only by itself, it can never be
           squeezed out of round. It rests at row-centre (closed) or the left edge (open);
           the roll between the two is run from JS (script at the end of <body>) so it
           plays even when the OS has "reduce motion" on. */
        #gearBtn
        {
            position: absolute;
            left: 0;
            top: 21px;                        /* half a 42px line - NOT 50%: the row is two lines
                                                 tall when it wraps, and the gear belongs on the first */
            transform: translateX(calc(50cqw - 50%)) translateY(-50%);   /* parked at row centre */
            z-index: 1;
        }
        #gearBtn svg { width: 20px; height: 20px; }
        #gearBtn[aria-expanded="true"]        /* the "pressed" look - unchanged */
        {
            color: var(--text);
            background: color-mix(in srgb, var(--accent) 24%, var(--card2));
            border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        }
        .tools.open #gearBtn { transform: translateX(0) translateY(-50%); }   /* at the left edge */

        /* Inset ring so .tools' overflow:hidden can't swallow the keyboard focus outline. */
        .tools .icon-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

        /* Each extra button is a zero-width slot until the row opens, then it widens in.
           Staggered delays make them arrive (and, on close, leave) one after another. */
        .tool-extra
        {
            flex: 0 0 auto;
            width: 42px;
            min-width: 0;                     /* let it actually collapse to nothing */
            /* The gap gives way before the row does. 10px when there is room; on a narrow
               viewport (Android "Display size" / Chrome page zoom shrink it to ~320 CSS px
               or less) it tightens to 4px, which keeps all the buttons on one line.
               cqw is the row's content box, so the gear's 42px slot is already excluded. */
            margin-left: clamp(4px, calc((100cqw - 4 * 42px) / 4), 10px);
            overflow: hidden;
            transition: width .24s ease, margin-left .24s ease, opacity .2s ease, visibility .24s;
        }
        .tools:not(.open) .tool-extra
        {
            width: 0;
            margin-left: 0;
            opacity: 0;
            visibility: hidden;
        }

        /* The extras appear in step with the rolling gear. On OPEN the gear rolls
           right-to-left, so the buttons show up right-to-left too: the right-most
           (Cerrar sesión) first, the left-most (Tema) last - a button is never
           revealed on the left of the gear before the gear has rolled past its
           slot. On CLOSE the gear rolls left-to-right and the order is mirrored: the
           left-most button leaves first, the right-most last.
           nth-child counts the gear as child 1, so the four extras are 2..5. */
        .tools.open       .tool-extra:nth-child(5) { transition-delay: 0s;   }
        .tools.open       .tool-extra:nth-child(4) { transition-delay: .11s; }
        .tools.open       .tool-extra:nth-child(3) { transition-delay: .21s; }
        .tools.open       .tool-extra:nth-child(2) { transition-delay: .32s; }
        .tools:not(.open) .tool-extra:nth-child(2) { transition-delay: 0s;   }
        .tools:not(.open) .tool-extra:nth-child(3) { transition-delay: .11s; }
        .tools:not(.open) .tool-extra:nth-child(4) { transition-delay: .21s; }
        .tools:not(.open) .tool-extra:nth-child(5) { transition-delay: .32s; }

        .tool-extra svg { width: 20px; height: 20px; }

        /* Chat's and eMail's unread counts: a red disc on the tile's icon, top-right. */
        .chat-badge
        {
            position: absolute; top: 6px; right: calc(50% - 32px);
            min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700;
            color: var(--on-accent); background: var(--danger); border: 2px solid var(--card);
        }


        /* Office and Records are <button> tiles (they open a popup, not a page). */
        button.tile { border: 0; background: none; font: inherit; cursor: pointer; }
        #passwordsTile { cursor: pointer; }   /* no href: no app yet, see its click */

        /* "Buscar mi móvil" (2026-09-21, his ask: the panel's bottom-right corner).
           The settings row's own round .icon-btn, on that row's line at the right
           edge - not a floating button over the content. Always there since
           2026-09-23, but disabled - dimmed and deaf, like the shared
           .icon-btn:disabled - until there is something to find (a phone with the
           Android app, or a last known position). It steps aside while the
           settings row is open: the row's buttons need that end of the line. */
        .find-btn { position: absolute; right: 30px; bottom: 26px; transition: opacity .2s ease, visibility .2s; }
        .find-btn svg { width: 20px; height: 20px; }
        .panel:has(.tools.open) .find-btn { opacity: 0; visibility: hidden; }

        /* Office's and Records' popups: the shared .top-menu card, laid out as ONE
           row of tiles the size of the grid's (the ids outweigh the phone rule's
           width: 100%). */
        #officeMenu, #recordsMenu           { flex-direction: row; gap: 4px; min-width: 0; }
        #officeMenu .tile, #recordsMenu .tile { width: clamp(88px, 27vw, 110px); }

        /* Its dialog, and Mi cuenta's list of phones: rows like .scm-row, not buttons. */
        .find-row
        {
            display: flex; align-items: center; gap: 8px;
            background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
            padding: 8px 6px 8px 12px; font-size: 0.88rem;
        }
        .find-row .find-txt { flex: 1 1 auto; min-width: 0; }
        .find-row b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .find-row small { display: block; color: var(--text-dim); font-size: 0.8rem; }
        .find-row small.find-live { color: var(--accent); }
        .find-note { font-size: 0.8rem; color: var(--text-dim); margin: 10px 0 0; }
        /* Mi cuenta: under each phone, its photo upload switch and folder. */
        .dev-media { padding: 0 6px 0 12px; margin-bottom: 8px; }
        .dev-media .scm-check-row { margin: 6px 0; }
        .dev-media .folder-pick[hidden] { display: none; }

        /* Phone (see TWO LAYOUT MODES in shared/app.css): the panel fills the
           width - 30px padding + 24px column gaps + 27vw tiles made it 426px wide
           on a 390px screen, so the page scrolled sideways and the build date was
           cut off. Tiles now share the panel's width three-up.
           Not in the desktop's menu (html.in-desktop): that frame is narrow, the
           screen is not, so it keeps the big-screen card. */
        @media (max-width: 640px)
        {
            :root:not(.in-desktop) .launcher { padding: 16px 10px; }
            :root:not(.in-desktop) .panel    { width: 100%; max-width: 420px; padding: 22px 12px 26px; gap: 22px; }
            :root:not(.in-desktop) .grid     { width: 100%; gap: 8px 4px; justify-items: center; }
            :root:not(.in-desktop) .tile     { width: 100%; max-width: 110px; padding: 12px 4px 10px; }
            :root:not(.in-desktop) .find-btn { right: 12px; }
        }

        /* ---- eye toggle inside a password field (Mi cuenta dialog) ---- */
        .pw-wrap { position: relative; margin: 10px 0; }
        .pw-wrap .scm-input { margin: 0; padding-right: 42px; }
        /* An on / off row: text · (i) · the shared .switch at the end. */
        .scm-check-row { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
        .scm-check-row[hidden] { display: none; }
        .scm-check { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 0.88rem; cursor: pointer; }
        .scm-check-row .scm-check { margin: 0; }
        .scm-check-row > .switch { margin-left: auto; }
        .pw-eye
        {
            position: absolute; top: 0; right: 0; height: 100%;
            width: 38px; display: flex; align-items: center; justify-content: center;
            border: none; background: none; padding: 0; cursor: pointer; color: var(--text-dim);
        }
        .pw-eye:hover { color: var(--text); }
        .pw-eye svg { width: 18px; height: 18px; }

        /* ---- The three dialogs (Esquemas de color, Mi cuenta, Buscar mi móvil) ----
           The shared shell: app.css .sheet-backdrop / .sheet, opened and closed with
           NayiveUI.open / close, so shared/ui.js gives them its Escape, focus, drag
           and "a dialog is open" guards. Esquemas sits AFTER Mi cuenta in the page:
           opened from it, it is the top one (drawn over it, closed first by Escape). */
        .scm-h
        {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-faint); margin: 18px 0 8px;
        }

        .scm-list { display: flex; flex-direction: column; gap: 6px; }
        .scm-row
        {
            display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
            background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
            padding: 8px 10px; color: var(--text); font: inherit; font-size: 0.88rem; cursor: pointer;
        }
        .scm-row.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
        .scm-sw { display: flex; flex: 0 0 auto; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
        .scm-sw i { width: 10px; height: 18px; display: block; }
        .scm-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .scm-kind { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
        .scm-badge
        {
            font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em;
            background: var(--accent); color: var(--on-accent); border-radius: var(--radius-pill); padding: 1px 7px;
        }

        /* Look from app.css (FORM FIELD); only width and the gap are local. */
        .scm-input { width: 100%; margin: 10px 0; }

        .scm-seg { display: flex; align-items: center; gap: 6px; }   /* two .pill buttons */

        /* Name field and the Dark / Light switch share one row; both take the row's height. */
        .scm-name-row { display: flex; align-items: stretch; gap: 8px; margin: 10px 0; }
        .scm-name-row .scm-input { flex: 1 1 auto; min-width: 0; width: auto; margin: 0; }
        .scm-name-row .scm-seg { flex: 0 0 auto; }

        .scm-tok { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
        .scm-tok input[type="color"]
        {
            width: 32px; height: 32px; flex: 0 0 auto; border: none; background: none; padding: 0;
            border-radius: 7px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line);
        }
        .scm-tok input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .scm-tok input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }
        .scm-tok code { flex: 1 1 auto; font-size: 0.82rem; color: var(--text-dim); font-family: ui-monospace, Menlo, Consolas, monospace; }
        .scm-tok input[type="text"]      /* the shared field look (app.css); a hex code's layout only */
        {
            width: 96px; flex: 0 0 auto; text-align: center; text-transform: uppercase;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }
        .scm-tok input[type="text"].bad { border-color: var(--danger); color: var(--danger); }
        /* Action row + buttons: shared .sheet-actions / .btn (../shared/theme.css). */
        .scm-msg { font-size: 0.8rem; color: var(--danger); margin: 10px 0 0; }
        .scm-msg[hidden] { display: none; }

        .scm-assign { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; font-size: 0.88rem; }
        .scm-assign.scm-assign-inline { justify-content: flex-start; }   /* spinner sits right after the label, not pushed to the edge */
        .scm-assign select { max-width: 190px; }   /* the shared field look (app.css) */
        /* Colour schemes: the dark and light pickers share one row, half each. */
        .scm-assign-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 8px 0; }
        .scm-assign-row .scm-assign { margin: 0; min-width: 0; }
        .scm-assign-row .scm-assign select { flex: 1 1 auto; min-width: 0; max-width: none; }
        /* The zone list is the widest select in the dialog, and on a narrow phone
           it left too little for its own label ("Fuseau horaire" wrapped). Cap it
           at a share of the row instead, so the label always gets one line. */
        #tzSel { max-width: min( 190px, 55% ); }
        /* My account: narrower than the shared 460px sheet (his call, 2026-10-02). */
        #pwBackdrop .sheet { max-width: 380px; }
    </style>
</head>

    <div id="toast" class="toast"></div>

    <script>
        // MOUSE CHIP - "Open the desktop" on Auto (see the <head>): a mouse or
        // touchpad plugged into a big screen offers the desktop, in the shared
        // toast with a button. Never a move on its own: left alone, it goes.
        // Not in the desktop's own menu (a frame), not while this page acts on
        // a query or hash, not for an account that must pick its password.
        ( function ()
        {
            if( window.top !== window || ! window.matchMedia ) return;
            var fine = window.matchMedia( '(any-pointer: fine)' );
            function onChange()
            {
                try { if( sessionStorage.getItem( 'nayive-must-set' ) === '1' ) return; } catch( e ) {}
                if( ! fine.matches || ! window.NayiveUI || location.search || location.hash ||
                    nayiveDeskMode() !== 'auto' || ! nayiveWantDesk( 'auto' ) ) return;
                NayiveUI.undoToast( NayiveUI.t( 'desktop.toDeskAsk' ), function () { location.replace( 'desktop/' ); },
                                    { label: NayiveUI.t( 'desktop.toDeskGo' ), ms: 10000 } );
            }
            if( fine.addEventListener ) fine.addEventListener( 'change', onChange );
        } )();

        // The Chat and eMail tiles' unread counts (Chat: all chats not muted;
        // eMail: every account's Inbox), now and whenever the launcher comes
        // back on screen. The admin has neither: the tile goes invisible but
        // keeps its slot, so the grid does not shift.
        [ [ 'chatBtn', '/api/chat/unread' ], [ 'mailBtn', '/api/mail/unread' ] ].forEach( function ( tile )
        {
            var btn = document.getElementById( tile[ 0 ] );
            if( ! btn ) return;
            var badge = btn.querySelector( '.chat-badge' );
            function refresh()
            {
                fetch( tile[ 1 ], { credentials: 'same-origin', headers: { Accept: 'application/json' } } )
                    .then( function ( r )
                    {
                        // 403: the admin, who has no Chat / eMail - or an account
                        // refused only until it picks its password: keep the tile.
                        if( r.status === 403 )
                            return r.json().catch( function () { return {}; } ).then( function ( j )
                            {
                                if( ! j.must_set_password ) btn.style.visibility = 'hidden';
                                return null;
                            } );
                        return r.ok ? r.json() : null;
                    } )
                    .then( function ( j )
                    {
                        if( ! j ) return;
                        var n = j.n || 0;
                        badge.textContent = n > 99 ? '99+' : String( n );
                        badge.hidden = ! n;
                    } )
                    .catch( function () {} );
            }
            refresh();
            document.addEventListener( 'visibilitychange', function () { if( ! document.hidden ) refresh(); } );
            // a push while the launcher is on screen (sw.js: { chat: "new" } / { mail: "new" })
            var kind = tile[ 0 ] === 'mailBtn' ? 'mail' : 'chat';
            if( navigator.serviceWorker )
                navigator.serviceWorker.addEventListener( 'message', function ( e ) { if( e.data && e.data[ kind ] === 'new' ) refresh(); } );
        } );
    </script>

    <script>
        // Office's and Records' popups (2026-09-23): Write / Calc / Text and
        // Contacts / Bookmarks / Passwords, on the shared "more" menu
        // (NayiveUI.wireMenu). Two clicks never reach that one's closing, so
        // they close a card here, on the window, in the capture phase (before
        // anybody can stop them): a pick in the card - it closes itself on a
        // <button> only, these are links, and the desktop's menu
        // (desktop/index.html) stops link clicks on the document - and a press
        // on the OTHER popup's tile, whose button stops its own click.
        NayiveI18n.ready.then( function ()
        {
            if( ! window.NayiveUI ) return;
            var pops = [ [ 'officeBtn', 'officeMenu' ], [ 'recordsBtn', 'recordsMenu' ] ].map( function ( ids )
            {
                return { btn:  document.getElementById( ids[ 0 ] ),
                         card: document.getElementById( ids[ 1 ] ),
                         menu: NayiveUI.wireMenu( { btn: ids[ 0 ], menu: ids[ 1 ] } ) };
            } ).filter( function ( p ) { return p.menu; } );

            // Passwords: no app yet, so a note instead. No href (the desktop
            // would open it as an app), so it closes its card itself.
            var pwTile = document.getElementById( 'passwordsTile' );
            if( pwTile ) pwTile.addEventListener( 'click', function ()
            {
                pops.forEach( function ( p ) { p.menu.close(); } );
                NayiveUI.alert( { title: NayiveUI.t( 'launcher.notYet' ) } );
            } );

            window.addEventListener( 'click', function ( e )
            {
                var t = e.target;
                pops.forEach( function ( p )
                {
                    var pick  = p.card.contains( t ) && t.closest( 'a[href]' );
                    var other = pops.some( function ( q ) { return q !== p && q.btn.contains( t ); } );
                    if( pick || other ) p.menu.close();
                } );
            }, true );

            // The launcher going away closes them too: its page hidden (another
            // app, another tab) or, on the desktop, its menu shut - every way
            // the desktop shuts it (desktop/index.html, closeMenu) calls this.
            function closeAll() { pops.forEach( function ( p ) { p.menu.close(); } ); }
            document.addEventListener( 'visibilitychange', function () { if( document.hidden ) closeAll(); } );
            window.NayiveLauncher = { closePopups: closeAll };
        } );
    </script>

    <script>
        ( function ()
        {
            var tools = document.getElementById( 'tools' );
            var gear  = document.getElementById( 'gearBtn' );
            if( ! tools || ! gear ) return;

            // Roll the gear between its two resting spots (row-centre <-> left edge). It turns
            // like a wheel: one full turn, counter-clockwise on the way out to the left,
            // clockwise on the way back. Rotation shares the keyframes with the travel so the
            // two stay in step (a wheel that isn't slipping). Driven here rather than via a CSS
            // transition so it runs even when the OS has "reduce motion" on; CSS holds the
            // resting spots. While it rolls the gear sweeps over the other buttons, so it's
            // made click-through for the duration - otherwise a click meant for a tool button
            // hits the gear and toggles the row shut.
            var rollSeq = 0;
            function rollGear( open )
            {
                if( ! gear.animate ) return;
                var cx  = ( tools.clientWidth - gear.offsetWidth ) / 2;   // centre offset from the left edge
                var deg = open ? -360 : 360;                             // out = counter-clockwise, back = clockwise
                var mine = ++rollSeq;
                var anim = gear.animate(
                    [ { transform: 'translateX(' + ( open ? cx : 0 ) + 'px) translateY(-50%) rotate(0deg)' },
                      { transform: 'translateX(' + ( open ? 0 : cx ) + 'px) translateY(-50%) rotate(' + deg + 'deg)' } ],
                    { duration: 700, easing: 'cubic-bezier(.65, 0, .35, 1)' } );

                gear.style.pointerEvents = 'none';
                anim.onfinish = anim.oncancel = function () { if( mine === rollSeq ) gear.style.pointerEvents = ''; };
            }

            function setOpen( open )
            {
                rollGear( open );
                tools.classList.toggle( 'open', open );
                gear.setAttribute( 'aria-expanded', open ? 'true' : 'false' );
            }

            gear.addEventListener( 'click', function () { setOpen( ! tools.classList.contains( 'open' ) ); } );

            // Clicking anything else in the launcher - a tool button in the row, or one of the
            // app tiles - rolls the row back to its original state (the lone, centred gear).
            // Runs in the capture phase, before the button's own handler fires: the theme
            // toggle rewrites its own <svg> on click, which would orphan e.target and defeat a
            // later bubble-phase check. The gear is skipped so it keeps toggling the row.
            var panel = document.querySelector( '.panel' );
            panel.addEventListener( 'click', function ( e )
            {
                var btn = e.target.closest( 'a, button' );
                if( btn && btn !== gear && tools.classList.contains( 'open' ) ) setOpen( false );
            }, true );

            document.addEventListener( 'keydown', function ( e )
            {
                if( e.key === 'Escape' && tools.classList.contains( 'open' ) && ! scmBack.classList.contains( 'open' ) ) setOpen( false );
            } );

            /* ---- "Esquemas de color" ---------------------------------- */
            var KEY   = 'balata-schemes';
            var NKEYS = [ '--bg', '--card', '--card2', '--line', '--accent' ];   // what the dialog edits
            // The highlight colour: theme.css's accent per mode, used when a scheme has
            // none of its own. Its text colour (--on-accent) is never typed - onAccent()
            // picks theme.css's dark or light ink, whichever reads better on it.
            var ACCENT     = { dark: '#1f80b1', light: '#61410a' };
            var INK        = { dark: '#0D0F17', light: '#F9F9FB' };
            var LOW_ACCENT = 3;   // accent contrast on page / cards / fields below this -> warn
            var HEX   = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/;
            // The built-in schemes' names are DATA, not interface text: they are
            // written into localStorage (and the user can rename them), so they stay
            // literal in every language - like "Beige" beside them.
            // Bump SEED_VERSION whenever a built-in changes or is added: load() then
            // brings stored data up to date (see upgrade()).
            var SEED_VERSION = 4;
            var SEED  = {
                schemes: [
                    { id: 'dark-default',  name: 'Oscuro', kind: 'dark',  tokens: { '--bg': '#1E1F23', '--card': '#25272B', '--card2': '#2F3034', '--line': '#424349', '--accent': '#1F80B1', '--on-accent': '#0D0F17' } },
                    { id: 'dark-noche',    name: 'Noche',  kind: 'dark',  tokens: { '--bg': '#101722', '--card': '#18202C', '--card2': '#212B38', '--line': '#353F4E', '--accent': '#16A085', '--on-accent': '#0D0F17' } },
                    { id: 'light-default', name: 'Beige',  kind: 'light', tokens: { '--bg': '#D8D0C0', '--card': '#E3DCCC', '--card2': '#F2ECDF', '--line': '#86714B', '--accent': '#61410A', '--on-accent': '#F9F9FB' } },
                    { id: 'light-niebla',  name: 'Niebla', kind: 'light', tokens: { '--bg': '#D4DBD9', '--card': '#DFE5E3', '--card2': '#F0F5F3', '--line': '#76847F', '--accent': '#0A4061', '--on-accent': '#F9F9FB' } }
                ],
                activeDark: 'dark-default',
                activeLight: 'light-default',
                seedVersion: SEED_VERSION
            };
            // The built-ins as older versions shipped them: a stored copy still equal
            // to one of these was never edited, so upgrade() may refresh it.
            var SEED_OLD = {
                'dark-default':  [ { '--bg': '#1E1F23', '--card': '#25272B', '--card2': '#2F3034', '--line': '#343539' },
                                   { '--bg': '#1E1F23', '--card': '#25272B', '--card2': '#2F3034', '--line': '#424349', '--accent': '#16A085' },
                                   { '--bg': '#1E1F23', '--card': '#25272B', '--card2': '#2F3034', '--line': '#424349', '--accent': '#0876A6' } ],
                'light-default': [ { '--bg': '#D8D0C0', '--card': '#E0D9CB', '--card2': '#F2ECDF', '--line': '#735C2E' },
                                   { '--bg': '#D8D0C0', '--card': '#E3DCCC', '--card2': '#F2ECDF', '--line': '#86714B', '--accent': '#0A6151' } ],
                'light-niebla':  [ { '--bg': '#D4DBD9', '--card': '#DFE5E3', '--card2': '#F0F5F3', '--line': '#76847F', '--accent': '#0A6151' } ]
            };
            // The SEED_VERSION that first shipped each built-in (1 when not listed).
            var SEED_BORN = { 'dark-noche': 2, 'light-niebla': 2 };

            var root     = document.documentElement;
            var openBtn  = document.getElementById( 'schemesBtn' );
            var scmBack  = document.getElementById( 'scmBackdrop' );
            var listEl   = document.getElementById( 'scmList' );
            var nameEl   = document.getElementById( 'scmName' );
            var titleEl  = document.getElementById( 'scmEditTitle' );
            var kindDark = document.getElementById( 'scmKindDark' );
            var kindLite = document.getElementById( 'scmKindLight' );
            var saveBtn  = document.getElementById( 'scmSave' );
            var newBtn   = document.getElementById( 'scmSaveNew' );
            var delBtn   = document.getElementById( 'scmDelete' );
            var msgEl    = document.getElementById( 'scmMsg' );
            var selDark  = document.getElementById( 'scmActiveDark' );
            var selLite  = document.getElementById( 'scmActiveLight' );
            var closeBtn = document.getElementById( 'scmCloseBtn' );
            var accentMsg = document.getElementById( 'scmAccentMsg' );

            var col = {}, hex = {};
            scmBack.querySelectorAll( '.scm-tok input[type="color"]' ).forEach( function ( el ){ col[ el.dataset.k ] = el; } );
            scmBack.querySelectorAll( '.scm-tok input[type="text"]'  ).forEach( function ( el ){ hex[ el.dataset.k ] = el; } );

            var data      = load();
            var editingId = null;
            var draft     = null;

            function load()
            {
                try
                {
                    var d = JSON.parse( localStorage.getItem( KEY ) || 'null' );
                    if( d && d.schemes && d.schemes.some( isDark ) && d.schemes.some( isLight ) ) return upgrade( d );
                }
                catch ( e ) { /* ignore */ }
                return JSON.parse( JSON.stringify( SEED ) );
            }
            // Stored data from an older SEED_VERSION: add the built-ins it lacks
            // (only NEW ones - an old built-in the user deleted stays deleted) and
            // refresh an old built-in the user never edited. Saved at once, so every
            // other app picks the new tones up through theme.js.
            function upgrade( d )
            {
                var from = d.seedVersion || 1;
                if( from >= SEED_VERSION ) return d;
                SEED.schemes.forEach( function ( s )
                {
                    var have = null, last = -1;
                    for( var i = 0; i < d.schemes.length; i++ )
                    {
                        if( d.schemes[ i ].id === s.id )     have = d.schemes[ i ];
                        if( d.schemes[ i ].kind === s.kind ) last = i;
                    }
                    if( have )
                    {
                        if( ( SEED_OLD[ s.id ] || [] ).some( function ( o ){ return sameTokens( have.tokens, o ); } ) ) have.tokens = JSON.parse( JSON.stringify( s.tokens ) );
                    }
                    else if( ( SEED_BORN[ s.id ] || 1 ) > from ) d.schemes.splice( last + 1, 0, JSON.parse( JSON.stringify( s ) ) );
                } );
                d.seedVersion = SEED_VERSION;
                try { localStorage.setItem( KEY, JSON.stringify( d ) ); } catch ( e ) {}
                return d;
            }
            function sameTokens( a, b ){ return Object.keys( b ).every( function ( k ){ return String( ( a && a[ k ] ) || '' ).toLowerCase() === b[ k ].toLowerCase(); } ); }
            // A scheme's editable tokens, with the mode's default accent when it has no accent yet.
            function tokensOf( s ){ var t = {}; NKEYS.forEach( function ( k ){ t[ k ] = ( s.tokens && s.tokens[ k ] ) || ( k === '--accent' ? ACCENT[ s.kind ] : '' ); } ); return t; }
            // What gets stored: the edited tokens plus the derived --on-accent.
            function toStore( t ){ var o = {}; NKEYS.forEach( function ( k ){ o[ k ] = t[ k ]; } ); o[ '--on-accent' ] = onAccent( t[ '--accent' ] ); return o; }
            function lum( h )
            {
                var n = parseInt( h.slice( 1 ), 16 ), w = [ 0.2126, 0.7152, 0.0722 ];
                return [ n >> 16 & 255, n >> 8 & 255, n & 255 ].reduce( function ( sum, v, i )
                {
                    v /= 255;
                    return sum + w[ i ] * ( v <= 0.03928 ? v / 12.92 : Math.pow( ( v + 0.055 ) / 1.055, 2.4 ) );
                }, 0 );
            }
            function contrast( a, b ){ var x = lum( a ), y = lum( b ); return ( Math.max( x, y ) + 0.05 ) / ( Math.min( x, y ) + 0.05 ); }
            function onAccent( a ){ return contrast( a, INK.dark ) >= contrast( a, INK.light ) ? INK.dark : INK.light; }
            function isDark( s ){ return s.kind === 'dark'; }
            function isLight( s ){ return s.kind === 'light'; }
            function persist(){ try { localStorage.setItem( KEY, JSON.stringify( data ) ); } catch ( e ) {} }
            function find( id ){ for( var i = 0; i < data.schemes.length; i++ ) if( data.schemes[ i ].id === id ) return data.schemes[ i ]; return null; }
            function firstOfKind( k ){ for( var i = 0; i < data.schemes.length; i++ ) if( data.schemes[ i ].kind === k ) return data.schemes[ i ]; return null; }
            function countKind( k, exceptId ){ return data.schemes.filter( function ( s ){ return s.kind === k && s.id !== exceptId; } ).length; }
            function reconcile()
            {
                if( ! find( data.activeDark )  || find( data.activeDark ).kind  !== 'dark'  ) data.activeDark  = firstOfKind( 'dark' ).id;
                if( ! find( data.activeLight ) || find( data.activeLight ).kind !== 'light' ) data.activeLight = firstOfKind( 'light' ).id;
            }
            function loadDraft()
            {
                var s = find( editingId ) || firstOfKind( 'dark' );
                editingId = s.id;
                draft = { name: s.name, kind: s.kind, tokens: tokensOf( s ) };
            }
            function norm( h )
            {
                h = h.trim().toLowerCase();
                if( h && h[ 0 ] !== '#' ) h = '#' + h;
                if( h.length === 4 ) h = '#' + h[ 1 ] + h[ 1 ] + h[ 2 ] + h[ 2 ] + h[ 3 ] + h[ 3 ];
                return h;
            }
            function flash( t ){ if( window.NayiveUI ) NayiveUI.toast( t ); }
            function showMsg( t ){ msgEl.textContent = t; msgEl.hidden = false; }
            function clearMsg(){ msgEl.hidden = true; }

            // Paint the draft on :root so the whole launcher previews it live.
            function previewDraft()
            {
                if( draft.kind === 'light' ) root.setAttribute( 'data-theme', 'light' );
                else                         root.removeAttribute( 'data-theme' );
                NKEYS.forEach( function ( k ){ root.style.setProperty( k, draft.tokens[ k ] ); } );
                root.style.setProperty( '--on-accent', onAccent( draft.tokens[ '--accent' ] ) );
            }

            function render()
            {
                // scheme list
                listEl.innerHTML = '';
                data.schemes.forEach( function ( s )
                {
                    var b = document.createElement( 'button' );
                    b.type = 'button';
                    b.className = 'scm-row' + ( s.id === editingId ? ' sel' : '' );
                    b.dataset.id = s.id;
                    var isActive = s.id === data.activeDark || s.id === data.activeLight;
                    var st = tokensOf( s );
                    b.innerHTML =
                        '<span class="scm-sw">' + NKEYS.map( function ( k ){ return '<i style="background:' + st[ k ] + '"></i>'; } ).join( '' ) + '</span>' +
                        '<span class="scm-name"></span>' +
                        '<span class="scm-kind">' + ( s.kind === 'dark' ? NayiveUI.t( 'scm.darkWord' ) : NayiveUI.t( 'scm.lightWord' ) ) + '</span>' +
                        ( isActive ? '<span class="scm-badge" data-i18n="scm.activeBadge"></span>' : '' );
                    b.querySelector( '.scm-name' ).textContent = s.name;
                    listEl.appendChild( b );
                } );

                if( document.activeElement !== nameEl ) nameEl.value = draft.name;
                // Into the title's own span: the info dot beside it stays.
                // Its data-i18n goes, so a later translation pass keeps the name.
                var titleSpan = titleEl.querySelector( 'span' );
                titleSpan.removeAttribute( 'data-i18n' );
                titleSpan.textContent = NayiveUI.tf( 'scm.editing', { name: draft.name || NayiveUI.t( 'scm.unnamed' ) } );
                kindDark.setAttribute( 'aria-pressed', draft.kind === 'dark'  ? 'true' : 'false' );
                kindLite.setAttribute( 'aria-pressed', draft.kind === 'light' ? 'true' : 'false' );
                kindDark.classList.toggle( 'is-active', draft.kind === 'dark' );
                kindLite.classList.toggle( 'is-active', draft.kind === 'light' );

                NKEYS.forEach( function ( k )
                {
                    if( document.activeElement !== col[ k ] ) col[ k ].value = draft.tokens[ k ];
                    if( document.activeElement !== hex[ k ] ) { hex[ k ].value = draft.tokens[ k ].toUpperCase(); hex[ k ].classList.remove( 'bad' ); }
                } );

                delBtn.disabled = countKind( find( editingId ).kind, editingId ) === 0;

                // Warn (never block) when the highlight is hard to see on the scheme's tones.
                var worst = Math.min( contrast( draft.tokens[ '--accent' ], draft.tokens[ '--bg' ] ),
                                      contrast( draft.tokens[ '--accent' ], draft.tokens[ '--card' ] ),
                                      contrast( draft.tokens[ '--accent' ], draft.tokens[ '--card2' ] ) );
                accentMsg.hidden = worst >= LOW_ACCENT;
                if( ! accentMsg.hidden ) accentMsg.textContent = NayiveUI.tf( 'scm.accentLow', { ratio: worst.toFixed( 1 ) } );

                fillSelect( selDark, 'dark', data.activeDark );
                fillSelect( selLite, 'light', data.activeLight );

                previewDraft();
            }

            function fillSelect( sel, kind, activeId )
            {
                sel.innerHTML = '';
                data.schemes.filter( function ( s ){ return s.kind === kind; } ).forEach( function ( s )
                {
                    var o = document.createElement( 'option' );
                    o.value = s.id; o.textContent = s.name;
                    if( s.id === activeId ) o.selected = true;
                    sel.appendChild( o );
                } );
            }

            function openDialog()
            {
                editingId = ( root.getAttribute( 'data-theme' ) === 'light' ) ? data.activeLight : data.activeDark;
                loadDraft();
                clearMsg();
                NayiveUI.open( 'scmBackdrop' );
                render();
            }
            function closeDialog() { NayiveUI.close( 'scmBackdrop' ); }

            // However it closes - its x, or Escape through shared/ui.js (which
            // closes the top dialog without asking) - the live preview goes.
            new MutationObserver( function ()
            {
                if( scmBack.classList.contains( 'open' ) ) return;
                NKEYS.forEach( function ( k ){ root.style.removeProperty( k ); } );
                root.style.removeProperty( '--on-accent' );
                if( window.BalataTheme ) window.BalataTheme.refresh();
            } ).observe( scmBack, { attributes: true, attributeFilter: [ 'class' ] } );

            openBtn.addEventListener( 'click', openDialog );
            closeBtn.addEventListener( 'click', closeDialog );

            listEl.addEventListener( 'click', function ( e )
            {
                var row = e.target.closest( '.scm-row' );
                if( ! row ) return;
                editingId = row.dataset.id;
                loadDraft();
                clearMsg();
                render();
            } );

            nameEl.addEventListener( 'input', function (){ draft.name = this.value; render(); } );

            [ kindDark, kindLite ].forEach( function ( btn )
            {
                btn.addEventListener( 'click', function ()
                {
                    var k = this.dataset.kind;
                    if( k === draft.kind ) return;
                    var savedKind = find( editingId ).kind;
                    if( savedKind !== k && countKind( savedKind, editingId ) === 0 )
                    {
                        showMsg( NayiveUI.tf( 'scm.needOne', { kind: savedKind === 'dark' ? NayiveUI.t( 'scm.darkWord' ) : NayiveUI.t( 'scm.lightWord' ) } ) );
                        return;
                    }
                    // Keep the default accent right for the new mode; a chosen colour stays.
                    if( draft.tokens[ '--accent' ].toLowerCase() === ACCENT[ draft.kind ] ) draft.tokens[ '--accent' ] = ACCENT[ k ];
                    draft.kind = k;
                    clearMsg();
                    render();
                } );
            } );

            NKEYS.forEach( function ( k )
            {
                col[ k ].addEventListener( 'input', function (){ draft.tokens[ k ] = this.value.toLowerCase(); render(); } );
                hex[ k ].addEventListener( 'input', function ()
                {
                    var v = norm( this.value );
                    if( HEX.test( v ) ) { draft.tokens[ k ] = v; this.classList.remove( 'bad' ); render(); }
                    else this.classList.add( 'bad' );
                } );
                hex[ k ].addEventListener( 'blur', render );
            } );

            saveBtn.addEventListener( 'click', function ()
            {
                var s = find( editingId );
                s.name   = draft.name.trim() || s.name;
                s.kind   = draft.kind;
                s.tokens = toStore( draft.tokens );
                reconcile();
                loadDraft();
                persist(); clearMsg(); flash( NayiveUI.t( 'ui.saved' ) ); render();
            } );

            newBtn.addEventListener( 'click', function ()
            {
                var id = 's' + Date.now().toString( 36 ) + Math.random().toString( 36 ).slice( 2, 5 );
                data.schemes.push( {
                    id: id,
                    name: draft.name.trim() || NayiveUI.t( 'scm.newScheme' ),
                    kind: draft.kind,
                    tokens: toStore( draft.tokens )
                } );
                editingId = id;
                loadDraft();
                persist(); clearMsg(); flash( NayiveUI.t( 'scm.created' ) ); render();
            } );

            delBtn.addEventListener( 'click', function ()
            {
                if( delBtn.disabled ) return;
                var s = find( editingId );
                var at = data.schemes.indexOf( s ), wasDark = data.activeDark === s.id, wasLight = data.activeLight === s.id;
                data.schemes = data.schemes.filter( function ( x ){ return x.id !== s.id; } );
                reconcile();
                editingId = ( firstOfKind( s.kind ) || data.schemes[ 0 ] ).id;
                loadDraft();
                persist(); clearMsg(); render();
                // Undo: the scheme back in its place, and in use again if it was.
                NayiveUI.undoToast( NayiveUI.t( 'ui.toast.deleted' ), function ()
                {
                    if( find( s.id ) ) return;
                    data.schemes.splice( Math.min( at, data.schemes.length ), 0, s );
                    if( wasDark )  data.activeDark  = s.id;
                    if( wasLight ) data.activeLight = s.id;
                    persist();
                    if( ! scmBack.classList.contains( 'open' ) ) { if( window.BalataTheme ) window.BalataTheme.refresh(); return; }
                    editingId = s.id;
                    loadDraft(); clearMsg(); render();
                } );
            } );

            selDark.addEventListener( 'change', function (){ data.activeDark  = this.value; persist(); render(); } );
            selLite.addEventListener( 'change', function (){ data.activeLight = this.value; persist(); render(); } );

            // Keep the in-memory model consistent, but don't write to localStorage until
            // the user actually changes something - a fresh install stays 100% theme.css.
            reconcile();
        } )();
    </script>

    <!-- "Mi cuenta" dialog: the sign-in password (POST /api/password), the
         language (/api/lang), the timezone (/api/tz), the automatic theme,
         "Open the desktop" (this device), this device's notifications
         (/api/push) and the list of phones. The trip reminder moved to
         Trips › Settings (2026-10-02). -->
    <script>
        ( function ()
        {
            var openBtn = document.getElementById( 'accountBtn' );
            var back    = document.getElementById( 'pwBackdrop' );
            var curEl   = document.getElementById( 'pwCurrent' );
            var newEl   = document.getElementById( 'pwNew' );
            var msgEl   = document.getElementById( 'pwMsg' );
            var saveBtn = document.getElementById( 'pwSave' );
            var cancel  = document.getElementById( 'pwCancel' );
            var pushChk   = document.getElementById( 'pushChk' );
            var pushWrap  = document.getElementById( 'pushChkWrap' );
            var pushMsgEl = document.getElementById( 'pushMsg' );
            var langSel = document.getElementById( 'langSel' );
            var langMsg = document.getElementById( 'langMsg' );
            var tzSel   = document.getElementById( 'tzSel' );
            var tzMsg   = document.getElementById( 'tzMsg' );
            var autoChk = document.getElementById( 'autoThemeChk' );
            var autoMsg = document.getElementById( 'autoThemeMsg' );
            var curWrap = curEl.closest( '.pw-wrap' );
            if( ! openBtn || ! back ) return;

            // "mandatory" = a brand-new user who signed in with a blank password.
            // They must pick one here before the dialog will close.
            var mandatory = false;

            // Set just before the language change reloads the page; the boot
            // script at the end of this file reads it once and reopens this
            // dialog, so changing the language does not throw the user out of
            // the settings they were in the middle of.
            var REOPEN_KEY = 'balata-acct-reopen';

            // Interface language. It belongs to the ACCOUNT (POST /api/lang), so
            // a choice made on the phone reaches the PC; shared/i18n.js keeps a
            // copy on this device to paint with, and reloads so every string
            // re-renders. See NayiveI18n.adopt and server/go/users.go UserLang.
            if( langSel && window.NayiveI18n )
            {
                // The CHOICE, not the language in use: with nothing stored the
                // box sits on "por defecto" even though the UI is in some
                // language. Picking it again clears the choice. By the time the
                // dialog opens the boot probe has already copied the account's
                // language down here, so this shows the account's answer.
                langSel.value = NayiveI18n.saved() || '';
                langSel.addEventListener( 'change', function ()
                {
                    var code = langSel.value;
                    langSel.disabled = true;
                    say( langMsg, '' );

                    // The SERVER first. Switch this device on a save that
                    // failed and the next boot reads the old value back from
                    // /api/whoami and silently undoes the choice - the user
                    // would see their language revert with no explanation.
                    fetch( '/api/lang?value=' + encodeURIComponent( code ),
                           { method: 'POST', credentials: 'same-origin' } )
                        .then( function ( r ) { if( ! r.ok ) throw new Error( 'lang' ); } )
                        .then( function ()
                        {
                            langSel.disabled = false;

                            // setLang() reloads, so this dialog would vanish and
                            // the user would have to dig it out again to change
                            // anything else. Leave a note for the boot script to
                            // reopen it (per TAB, so another tab is unaffected),
                            // and take the note back if nothing is reloading
                            // after all - it would pop the dialog open on some
                            // unrelated reload later.
                            try { sessionStorage.setItem( REOPEN_KEY, '1' ); } catch ( e ) {}
                            if( ! NayiveI18n.setLang( code ) )
                                try { sessionStorage.removeItem( REOPEN_KEY ); } catch ( e ) {}
                        } )
                        .catch( function ()
                        {
                            langSel.disabled = false;
                            langSel.value = NayiveI18n.saved() || '';
                            say( langMsg, NayiveUI.t( 'acct.langFailed' ), false );
                        } );
                } );
            }

            // The eyes on the two password fields (shared/ui.js, deferred: at
            // DOMContentLoaded it is there).
            document.addEventListener( 'DOMContentLoaded', function ()
            {
                back.querySelectorAll( '.pw-eye' ).forEach( function ( btn )
                {
                    var input = document.getElementById( btn.dataset.eye );
                    if( input ) NayiveUI.pwEye( btn, input );
                } );
            } );

            // One row's message line under its setting: hidden when empty,
            // green when ok, red otherwise.
            function say( el, t, ok )
            {
                el.textContent = t;
                el.hidden = ! t;
                el.style.color = ok ? 'var(--ok, var(--accent))' : 'var(--danger)';
            }

            // --- timezone ------------------------------------------------- //
            // A timezone belongs to the PERSON, not to the server: it decides
            // what a floating "10:00" in the calendar means and which clock a
            // reminder prints. Stored on the ACCOUNT (POST /api/tz), so the
            // zone follows the person to every device - and is picked from a
            // list, never typed, so an unknown zone can't be saved.
            var tzSaved = null;            // last value confirmed by the server

            // Every zone the browser knows (NayiveUI.timeZones; ancient browsers
            // get a short list) plus, below, whatever is already saved, which is
            // enough to see and keep the current value.
            function fillZones( current )
            {
                var zones = NayiveUI.timeZones().slice();
                // The saved zone ALWAYS gets an entry, even when this browser's
                // list has never heard of it (an old IANA alias, a newer server).
                // Without this the box would silently snap to the first option
                // and the next stray change would overwrite a good value.
                if( current && zones.indexOf( current ) === -1 ) zones.unshift( current );

                tzSel.textContent = '';
                zones.forEach( function ( z )
                {
                    var o = document.createElement( 'option' );
                    o.value = z; o.textContent = z;
                    tzSel.appendChild( o );
                } );
                tzSel.value = current || '';
            }

            async function loadTz()
            {
                say( tzMsg, '' );
                try
                {
                    var r = await fetch( '/api/tz', { credentials: 'same-origin' } );
                    var d = await r.json();
                    if( r.ok ) tzSaved = d.tz || '';
                }
                catch ( e ) { /* keep whatever we had */ }
                fillZones( tzSaved || NayiveUI.viewerTz() );
            }

            tzSel.addEventListener( 'change', async function ()
            {
                var z = tzSel.value;
                tzSel.disabled = true;
                try
                {
                    var r = await fetch( '/api/tz?value=' + encodeURIComponent( z ),
                                         { method: 'POST', credentials: 'same-origin' } );
                    var d = await r.json().catch( function (){ return {}; } );
                    if( r.ok ) { tzSaved = d.tz || ''; tzSel.value = tzSaved; say( tzMsg, '' ); }
                    else { fillZones( tzSaved ); say( tzMsg, NayiveUI.t( 'acct.tzFailed' ) ); }
                }
                catch ( e ) { fillZones( tzSaved ); say( tzMsg, NayiveUI.t( 'login.noServer' ) ); }
                tzSel.disabled = false;
            } );

            // --- automatic light / dark ------------------------------------ //
            // shared/theme.js does the sun arithmetic and owns the storage; all
            // this dialog does is turn it on and hand it a pair of coordinates.
            // Asking for the location needs a real click, which is exactly what
            // ticking the box is - so it is asked for here and nowhere else.
            function autoState()
            {
                if( ! window.BalataTheme || ! window.BalataTheme.isAuto() ) return '';
                return window.BalataTheme.hasGeo() ? 'acct.themeAutoGeo' : 'acct.themeAutoNoGeo';
            }

            function askGeo()
            {
                if( ! navigator.geolocation )
                {
                    say( autoMsg, NayiveUI.t( 'acct.themeAutoNoGeo' ), false );
                    return;
                }

                say( autoMsg, NayiveUI.t( 'acct.themeAutoLocating' ), true );

                navigator.geolocation.getCurrentPosition(
                    function ( pos )
                    {
                        window.BalataTheme.setGeo( pos.coords.latitude, pos.coords.longitude );
                        say( autoMsg, NayiveUI.t( 'acct.themeAutoGeo' ), true );
                    },
                    function ()
                    {
                        // Refused, or the device simply does not know where it
                        // is. Auto mode stays ON: theme.js falls back to the
                        // sun of the time zone's main city.
                        say( autoMsg, NayiveUI.t( 'acct.themeAutoNoGeo' ), false );
                    },
                    { timeout: 10000, maximumAge: 24 * 3600 * 1000 } );
            }

            // People travel, and a stale set of coordinates would keep flipping
            // the theme on the old continent's clock. Refresh quietly whenever
            // the dialog is opened - but ONLY when permission is already
            // granted, so opening "Mi cuenta" can never raise a fresh prompt.
            function refreshGeoQuietly()
            {
                if( ! navigator.permissions || ! navigator.permissions.query ) return;

                navigator.permissions.query( { name: 'geolocation' } ).then( function ( st )
                {
                    if( st.state !== 'granted' ) return;

                    navigator.geolocation.getCurrentPosition(
                        function ( pos ) { window.BalataTheme.setGeo( pos.coords.latitude, pos.coords.longitude ); },
                        function () { /* keep what we had */ },
                        { timeout: 10000, maximumAge: 6 * 3600 * 1000 } );
                } ).catch( function () { /* browser without the geolocation permission name */ } );
            }

            // The first time this device opens the dialog, automatic starts ON
            // (his call, 2026-09-19). No location prompt for that: it needs a
            // tick on the box, so until then the time zone's sun drives it.
            var AUTO_OFFERED = 'balata-theme-auto-offered';

            function loadAuto()
            {
                if( ! window.BalataTheme ) { autoWrap().hidden = true; return; }

                var first = false;
                try
                {
                    first = localStorage.getItem( AUTO_OFFERED ) !== '1';
                    localStorage.setItem( AUTO_OFFERED, '1' );
                }
                catch ( e ) { /* no storage: leave the mode as it is */ }
                if( first && ! window.BalataTheme.isAuto() ) window.BalataTheme.setAuto( true );

                var on = window.BalataTheme.isAuto();
                autoChk.checked = on;

                // Turned on by us just now: the time-zone fallback is the
                // expected state, not a failure, so it is not shown in red.
                var key = autoState();
                say( autoMsg, key ? NayiveUI.t( key ) : '', key === 'acct.themeAutoGeo' || first );

                if( on && window.BalataTheme.hasGeo() ) refreshGeoQuietly();
            }

            function autoWrap() { return document.getElementById( 'autoThemeWrap' ); }

            autoChk.addEventListener( 'change', function ()
            {
                if( ! window.BalataTheme ) return;

                if( ! autoChk.checked ) { window.BalataTheme.setAuto( false ); say( autoMsg, '' ); return; }

                // On FIRST, so the theme is already following the fallback
                // window even if the location request is refused or times out.
                window.BalataTheme.setAuto( true );

            // --- native OS notifications (Web Push) ------------------------- //
            // PER DEVICE, not per account: the browser owns the subscription, so
            // the user turns this on once on each phone, tablet and PC. The
            // server only ever sees an endpoint + two keys (see /api/push).
            var pushState = {
                vapid: '', why: '', subscribed: false, sub: null,
                supported: ( 'serviceWorker' in navigator ) && ( 'PushManager' in window )
                           && ( 'Notification' in window )

            // base64url -> Uint8Array. applicationServerKey will not take the string.
            function b64ToU8( s )
            {
                var pad = '='.repeat( ( 4 - s.length % 4 ) % 4 );
                var raw = atob( ( s + pad ).replace( /-/g, '+' ).replace( /_/g, '/' ) );
                var out = new Uint8Array( raw.length );
                for( var i = 0; i < raw.length; i++ ) out[ i ] = raw.charCodeAt( i );
                return out;
            }

            // Does this subscription still match the server's VAPID key? If the
            // key was regenerated, the push service will reject every message
            // for it forever - and nothing would ever say so.
            function sameKey( sub, b64 )
            {
                try
                {
                    var a = new Uint8Array( sub.options.applicationServerKey );
                    var b = b64ToU8( b64 );
                    if( a.length !== b.length ) return false;
                    for( var i = 0; i < a.length; i++ ) if( a[ i ] !== b[ i ] ) return false;
                    return true;
                }
                catch ( e ) { return true; }        // can't tell -> don't nag the user
            }

            async function pushGet( endpoint )
            {
                var q = endpoint ? '?endpoint=' + encodeURIComponent( endpoint ) : '';
                var r = await fetch( '/api/push' + q, { credentials: 'same-origin' } );
                return { ok: r.ok, data: await r.json().catch( function (){ return {}; } ) };
            }

            async function postSub( sub )
            {
                var r = await fetch( '/api/push',
                {
                    method:      'POST',
                    headers:     { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    // No window_minutes: Planner › Settings owns it; the server keeps it.
                    // tz: a floating event rings at THIS device's clock (reminders.go).
                    body: JSON.stringify( { subscription:    sub.toJSON(),
                                            lang:  ( NayiveUI.lang ? NayiveUI.lang() : 'es' ),
                                            label: navigator.platform || '',
                                            tz:    NayiveUI.viewerTz() } )
                } );
                var d = await r.json().catch( function (){ return {}; } );
                if( r.ok )
                {
                    pushState.subscribed = true;
                    pushNote( sub );

                    // subscription (after a sign-out) must reach it now, not at
                    // the next launcher load - or a call rings here twice.
                    if( window.NayiveDevices ) NayiveDevices.moveEndpoint();

            // account. healPush() below compares against it.
            var PUSH_NOTE = 'nayive-push-note';

            function pushNote( sub )

                {
                    if( ! sub ) { localStorage.removeItem( PUSH_NOTE ); return; }

                        ep:   sub.endpoint,
                        lang: NayiveUI.lang ? NayiveUI.lang() : 'es',
                        tz:   NayiveUI.viewerTz(),
                        who:  ( window.NayiveStore && NayiveStore.me ) || '' } ) );
                }
                catch ( e ) {}
            }

            // The SELF-HEAL on every launcher load (loadPush below runs only
            // with Mi cuenta). A new endpoint (the browser renewed it - sw.js
            // resubscribe, whose POST may have met an expired session and
            // cannot know the language), another language (a change reloads
            // the page), another time zone (a trip), or no subscription left although this account had one
            // here (Firefox renews with no oldSubscription): registered again.
            // Nothing changed = no request at all.
            async function healPush()
            {
