<!-- index.html - Launcher for the Nayive single-page apps. A 3-column grid of the
     apps (Photos / Music / Movies are folder viewers: opened from here they use the
     folder each remembers in its own data/<app>/config.json, asking once via
     NayiveUI.pickFolder the first time; Write, Calc and Text open from the Office tile's popup,
     Contacts, Bookmarks and Passwords from the Records one),
     centred in the viewport, with a settings row below: a gear button that, when pressed,
     rolls from the centre to the left edge while the other tool buttons unfold into place
     to its right, one after another (right-to-left as the gear rolls out, mirrored on the
     way back) - the shared colour-scheme (dark / light) toggle, an account button
     (opens the "Mi cuenta" dialog: the sign-in password, language, timezone, trip
     reminder, this device's notifications and more - see its script; its bottom
     row, on the left, holds the palette button that opens the "Esquemas de color"
     dialog - create / edit custom dark + light schemes; shared/theme.js applies the
     active one everywhere), the install button and the "Cerrar sesión" button. Pressing the gear again - or clicking
     anything else in the launcher - plays it all in reverse. -->

    <!-- Installable / offline-capable. Only takes effect over HTTPS; a no-op on the plain-HTTP LAN URL.
         This one service worker (apps/sw.js) also serves the tasks / calendar / contact / planner shells offline. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nayive">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( 'sw.js' ).catch( function () {} ); } );

        // Offer to install the PWA (so photos can be shared straight into it).
        // Runs on every launcher load - so on every login - until the app is
        // installed or the user clicks "No mostrar más". Waits a moment so it
        // doesn't fight the first paint; NayiveUI decides whether to actually
        // show anything (installed / declined / unsupported).
        window.addEventListener( 'load', function () {
            setTimeout( function () { if( window.NayiveUI ) Ayni.pwa.offerInstall(); }, 1500 );
            // Chrome / Edge in the Android app, or a limited browser: the note (NayiveUI
            // decides). Not inside the desktop's menu frame: the desktop shows its own.
            setTimeout( function () { if( window.NayiveUI && Ayni.pwa.warnBrowser && window.top === window ) Ayni.pwa.warnBrowser(); }, 1500 );
        } );
        window.addEventListener( 'beforeinstallprompt', function () {
            setTimeout( function () { if( window.NayiveUI ) Ayni.pwa.offerInstall(); }, 300 );
        } );

        // The "Instalar app" button in the settings row: opens the same dialog by
        // hand (ignores the snooze), so installing is never lost after "No mostrar
        // más". Already installed -> the button leaves the DOM, and with it the
        // help list's row for it.
        Ayni.i18n.ready.then( function () {
            var b = document.getElementById( 'installBtn' );
            if( ! b ) return;
            if( window.NayiveUI && Ayni.pwa.isStandalone() ) { b.remove(); return; }
            b.addEventListener( 'click', function () {
                if( window.NayiveUI ) Ayni.pwa.offerInstall( { manual: true } );
            } );
            window.addEventListener( 'appinstalled', function () { b.remove(); } );
        } );
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body
        {
            margin: 0;
            font-family: var(--font-sans);
            color: var(--text);
            background: var(--bg);
        }

        .launcher
        {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .apps-panel
        {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 32px 30px 26px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--card);
            box-shadow: 0 16px 40px var(--shadow);
        }

        .grid
        {
            position: relative;               /* holds the engraved logo */
            isolation: isolate;               /* ...which sits under the tiles */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 24px;
            --engrave-groove: color-mix(in srgb, var(--card) 55%, #000);
            --engrave-lit:    color-mix(in srgb, var(--card) 88%, #fff);
        }
        :root[data-theme="light"] .grid
        {
            --engrave-groove: color-mix(in srgb, var(--card) 87%, #000);
            --engrave-lit:    color-mix(in srgb, var(--card) 40%, #fff);
        }

        /* The logo behind the apps, as if engraved in the panel (2026-09-21):
           its lines only (icons/logo-lines.svg) - a groove a shade darker than
           the card, with its lower edge catching the light 1px below. Mixed
           from --card, so a custom scheme gets the same faint depth. Nothing
           moves, nothing takes a click. */
        .grid::before,
        .grid::after
        {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            -webkit-mask: url(icons/logo-lines.svg) center / contain no-repeat;
                    mask: url(icons/logo-lines.svg) center / contain no-repeat;
        }
        .grid::before { background: var(--engrave-lit); transform: translateY(1px); }
        .grid::after  { background: var(--engrave-groove); }
        @media (forced-colors: active) { .grid::before, .grid::after { display: none; } }

        /* The settings row's buttons are shared .btn buttons; only their
           size is local - the row's geometry is built on 42px. */
        #tools .btn { width: 42px; height: 42px; }

        /* Settings row: the gear sits dead-centre on its own. Pressing it rolls the gear
           along to the left border - it spins the whole way - while the other tool
           buttons (theme, account, install, logout) unfold into place to its
           right, one after another. Colour schemes live in the account
           dialog's bottom row (2026-09-19). Pressing it again plays the whole thing in reverse. */
        #tools
        {
            position: relative;               /* containing block for the absolutely-placed gear */
            container-type: inline-size;       /* lets the gear park itself at 50cqw (row centre) */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;                  /* last resort on a very narrow screen: a second line */
            row-gap: 10px;
            width: 100%;
            min-height: 42px;
            padding-left: 0;
            overflow: hidden;                 /* clips the extras while they widen into place */
            transition: padding-left .55s ease-in-out;
        }
        #tools.open { padding-left: 42px; }    /* leaves room for the gear at the left edge */

        /* The gear is taken out of the flex flow so it can glide from the centre to the
           left border on its own - and, being sized only by itself, it can never be
           squeezed out of round. It rests at row-centre (closed) or the left edge (open);
           the roll between the two is run from JS (script at the end of <body>) so it
           plays even when the OS has "reduce motion" on. */
        #gearBtn
        {
            position: absolute;
            left: 0;
            top: 21px;                        /* half a 42px line - NOT 50%: the row is two lines
                                                 tall when it wraps, and the gear belongs on the first */
            transform: translateX(calc(50cqw - 50%)) translateY(-50%);   /* parked at row centre */
            z-index: 1;
        }
        #gearBtn svg { width: 20px; height: 20px; }
        #gearBtn[aria-expanded="true"]        /* the "pressed" look - unchanged */
        {
            color: var(--text);
            background: color-mix(in srgb, var(--accent) 24%, var(--card2));
            border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        }
        #tools.open #gearBtn { transform: translateX(0) translateY(-50%); }   /* at the left edge */

        /* Inset ring so .tools' overflow:hidden can't swallow the keyboard focus outline. */
        #tools .btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

        /* Each extra button is a zero-width slot until the row opens, then it widens in.
           Staggered delays make them arrive (and, on close, leave) one after another. */
        .tool-extra
        {
            flex: 0 0 auto;
            width: 42px;
            min-width: 0;                     /* let it actually collapse to nothing */
            /* The gap gives way before the row does. 10px when there is room; on a narrow
               viewport (Android "Display size" / Chrome page zoom shrink it to ~320 CSS px
               or less) it tightens to 4px, which keeps all the buttons on one line.
               cqw is the row's content box, so the gear's 42px slot is already excluded. */
            margin-left: clamp(4px, calc((100cqw - 4 * 42px) / 4), 10px);
            overflow: hidden;
            transition: width .24s ease, margin-left .24s ease, opacity .2s ease, visibility .24s;
        }
        #tools:not(.open) .tool-extra
        {
            width: 0;
            margin-left: 0;
            opacity: 0;
            visibility: hidden;
        }

        /* The extras appear in step with the rolling gear. On OPEN the gear rolls
           right-to-left, so the buttons show up right-to-left too: the right-most
           (Cerrar sesión) first, the left-most (Tema) last - a button is never
           revealed on the left of the gear before the gear has rolled past its
           slot. On CLOSE the gear rolls left-to-right and the order is mirrored: the
           left-most button leaves first, the right-most last.
           nth-child counts the gear as child 1, so the four extras are 2..5. */
        #tools.open       .tool-extra:nth-child(5) { transition-delay: 0s;   }
        #tools.open       .tool-extra:nth-child(4) { transition-delay: .11s; }
        #tools.open       .tool-extra:nth-child(3) { transition-delay: .21s; }
        #tools.open       .tool-extra:nth-child(2) { transition-delay: .32s; }
        #tools:not(.open) .tool-extra:nth-child(2) { transition-delay: 0s;   }
        #tools:not(.open) .tool-extra:nth-child(3) { transition-delay: .11s; }
        #tools:not(.open) .tool-extra:nth-child(4) { transition-delay: .21s; }
        #tools:not(.open) .tool-extra:nth-child(5) { transition-delay: .32s; }

        .tool-extra svg { width: 20px; height: 20px; }

        /* Chat's and eMail's unread counts: a disc on the tile's icon, top-right.
           Chat red, eMail blue - the desktop bar's mail dot colour (2026-10-09).
           Planner green: today's events still to come (2026-10-28). */
        .chat-badge
        {
            position: absolute; top: 6px; right: calc(50% - 32px);
            min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700;
            color: var(--on-accent); background: var(--danger); border: 2px solid var(--card);
        }
        #mailBtn .chat-badge { background: var(--busy); }
        #plannerBtn .chat-badge { background: var(--ok); }


        /* Office's and Records' popups: an Ayni tool group (.panel.popup.tools), laid out as ONE
           row of tiles the size of the grid's (the ids outweigh the phone rule's
           width: 100%). Tools has four: two by two. */
        #officeMenu, #recordsMenu, #moreMenu  { flex-direction: row; gap: 4px; min-width: 0; }
        #officeMenu .btn.large, #recordsMenu .btn.large, #moreMenu .btn.large { width: clamp(88px, 27vw, 110px); }
        #moreMenu { flex-wrap: wrap; justify-content: center; max-width: calc(2 * clamp(88px, 27vw, 110px) + 1 * 4px + 2 * 6px + 2px); }

        /* Its dialog, and Mi cuenta's list of phones: rows like .acct-row, not buttons. */
        .find-row
        {
            display: flex; align-items: center; gap: 8px;
            background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
            padding: 8px 6px 8px 12px; font-size: 0.88rem;
        }
        .find-row .find-txt { flex: 1 1 auto; min-width: 0; }
        .find-row b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .find-row small { display: block; color: var(--text-dim); font-size: 0.8rem; }
        .find-row small.find-live { color: var(--accent); }
        .find-note { font-size: 0.8rem; color: var(--text-dim); margin: 10px 0 0; }
        /* Mi cuenta: under each phone, its photo upload switch and folder. */
        .dev-media { padding: 0 6px 0 12px; margin-bottom: 8px; }
        .dev-media .acct-check-row { margin: 6px 0; }
        .dev-media .folder-pick[hidden] { display: none; }

        /* Phone (see TWO LAYOUT MODES in shared/app.css): the panel fills the
           width - 30px padding + 24px column gaps + 27vw tiles made it 426px wide
           on a 390px screen, so the page scrolled sideways and the build date was
           cut off. Tiles now share the panel's width three-up.
           Not in the desktop's menu (html.in-desktop): that frame is narrow, the
           screen is not, so it keeps the big-screen card. */
        @media (max-width: 640px)
        {
            :root:not(.in-desktop) .launcher { padding: 16px 10px; }
            :root:not(.in-desktop) .apps-panel { width: 100%; max-width: 420px; padding: 22px 12px 26px; gap: 22px; }
            :root:not(.in-desktop) .grid     { width: 100%; gap: 8px 4px; justify-items: center; }
            :root:not(.in-desktop) .btn.large { width: 100%; max-width: 110px; padding: 12px 4px 10px; }
        }

        /* An on / off row: text · (i) · the shared .switch at the end. */
        .acct-check-row { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
        .acct-check-row[hidden] { display: none; }
        .acct-check { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 0.88rem; cursor: pointer; }
        .acct-check-row .acct-check { margin: 0; }
        .acct-check-row > .switch { margin-left: auto; }

        /* ---- The three dialogs (Esquemas de color, Mi cuenta, Buscar mi móvil) ----
           Ayni's dialog.panel, opened with showModal() and closed with close(), so
           Ayni gives them its Escape, focus and moving, and "a dialog is open"
           guards see them. Esquemas, opened from Mi cuenta, is the innermost one
           (drawn over it, closed first by Escape). */
        .acct-h
        {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-faint); margin: 18px 0 8px;
        }

        .acct-list { display: flex; flex-direction: column; gap: 6px; }
        .acct-msg { font-size: 0.8rem; color: var(--danger); margin: 10px 0 0; }
        .acct-msg[hidden] { display: none; }

        .acct-assign { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; font-size: 0.88rem; }
        .acct-assign.acct-assign-inline { justify-content: flex-start; }   /* spinner sits right after the label, not pushed to the edge */
        .acct-assign .picker { min-width: 120px; max-width: 190px; }   /* Ayni's list picker */
        /* Colour schemes: the dark and light pickers share one row, half each. */
        .acct-assign-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 8px 0; }
        .acct-assign-row .acct-assign { margin: 0; min-width: 0; }
        .acct-assign-row .acct-assign .picker { flex: 1 1 auto; min-width: 0; max-width: none; }
        /* The zone list is the widest select in the dialog, and on a narrow phone
           it left too little for its own label ("Fuseau horaire" wrapped). Cap it
           at a share of the row instead, so the label always gets one line. */
        #tzSel { max-width: min( 190px, 55% ); }
        /* My account: narrower than the shared 460px dialog (his call, 2026-10-02). */
        #pwBackdrop, #pwChangeBackdrop { max-width: min(380px, calc(100vw - 32px)); }
    </style>

    <div class="launcher">

      <div class="apps-panel">

        <div class="grid">
            <!-- 4 rows of 3 (2026-10-28): Planner+Chat+eMail / Office+Records+Tools / Photos+Music+Movies /

            <!-- Planner: today's events still to come ride on its icon (2026-10-28). -->
            <a class="btn large" id="plannerBtn" href="planner/index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                <span>Planner</span>

    <script>
        // MOUSE CHIP - "Open the desktop" on Auto (see the <head>): a mouse or
        // touchpad plugged into a big screen offers the desktop, in the shared
        // toast with a button. Never a move on its own: left alone, it goes.
        // Not in the desktop's own menu (a frame), not while this page acts on
        // a query or hash, not for an account that must pick its password.
        ( function ()
        {
            if( window.top !== window || ! window.matchMedia ) return;
            var fine = window.matchMedia( '(any-pointer: fine)' );
            function onChange()
            {
                try { if( sessionStorage.getItem( 'nayive-must-set' ) === '1' ) return; } catch( e ) {}
                if( ! fine.matches || ! window.NayiveUI || location.search || location.hash ||
                    ayniDeskMode() !== 'auto' || ! ayniWantDesk( 'auto' ) ) return;
                Ayni.toast( 'info', Ayni.t( 'desktop.toDeskAsk' ),
                            { action: { label: Ayni.t( 'desktop.toDeskGo' ), icon: 'apps', run: function () { location.replace( 'desktop/' ); } } } );
            }
            if( fine.addEventListener ) fine.addEventListener( 'change', onChange );
        } )();

        // The Chat and eMail tiles' unread counts (Chat: all chats not muted;
        // eMail: every account's Inbox), now and whenever the launcher comes
        // back on screen. The admin has neither: the tile goes invisible but
        // keeps its slot, so the grid does not shift. Planner's is today's
        // events still to come on this device's clock (2026-10-28): it also
        // asks every minute, as events go by; the admin just gets 0.
        var zone = Ayni.dates.zone( '' );
        [ [ 'chatBtn', '/api/chat/unread' ], [ 'mailBtn', '/api/mail/unread' ],
          [ 'plannerBtn', '/api/calendar/today?tz=' + encodeURIComponent( zone ) ] ].forEach( function ( tile )
        {
            var btn = document.getElementById( tile[ 0 ] );
            if( ! btn ) return;
            var badge = btn.querySelector( '.chat-badge' );
            function refresh()
            {
                fetch( tile[ 1 ], { credentials: 'same-origin', headers: { Accept: 'application/json' } } )
                    .then( function ( r )
                    {
                        // 403: the admin, who has no Chat / eMail - or an account
                        // refused only until it picks its password: keep the tile.
                        if( r.status === 403 )
                            return r.json().catch( function () { return {}; } ).then( function ( j )
                            {
                                if( ! j.must_set_password ) btn.style.visibility = 'hidden';
                                return null;
                            } );
                        return r.ok ? r.json() : null;
                    } )
                    .then( function ( j )
                    {
                        if( ! j ) return;
                        var n = j.n || 0;
                        badge.textContent = n > 99 ? '99+' : String( n );
                        badge.hidden = ! n;
                    } )
                    .catch( function () {} );
            }
            refresh();
            document.addEventListener( 'visibilitychange', function () { if( ! document.hidden ) refresh(); } );
            if( tile[ 0 ] === 'plannerBtn' )
            {
                setInterval( function () { if( ! document.hidden ) refresh(); }, 60000 );
                return;
            }
            // a push while the launcher is on screen (sw.js: { chat: "new" } / { mail: "new" })
            var kind = tile[ 0 ] === 'mailBtn' ? 'mail' : 'chat';
            if( navigator.serviceWorker )
                navigator.serviceWorker.addEventListener( 'message', function ( e ) { if( e.data && e.data[ kind ] === 'new' ) refresh(); } );
        } );
    </script>

    <script>
        // Office's, Records' and Tools' popups (2026-09-23; Tools 2026-10-28):
        // Write / Calc / Text, Contacts / Bookmarks / Passwords and Find my
        // devices / Split / Language / Calculator, as Ayni tool groups (the
        // tile opens its popup: popovertarget; Ayni places it, above the tile
        // when there is no room below, and closes it on a pick, a press
        // outside, Escape or a scroll). The desktop's menu (desktop/index.html)
        // stops link clicks on the document before they reach the popup, so a
        // pick closes its card here, on the window, in the capture phase.
        Ayni.i18n.ready.then( function ()
        {
            var cards = [ 'officeMenu', 'recordsMenu', 'moreMenu' ].map( function ( id ) { return document.getElementById( id ); } );
            window.addEventListener( 'click', function ( e )
            {
                var a = e.target.closest( 'a[href]' ), card = a && a.closest( '.panel.popup.tools' );
                if( card && card.matches( ':popover-open' ) ) card.hidePopover();
            }, true );

            // The launcher going away closes them too: its page hidden (another
            // app, another tab) or, on the desktop, its menu shut - every way
            // the desktop shuts it (desktop/index.html, closeMenu) calls this.
            function closeAll() { cards.forEach( function ( c ) { if( c.matches( ':popover-open' ) ) c.hidePopover(); } ); }
            document.addEventListener( 'visibilitychange', function () { if( document.hidden ) closeAll(); } );
            window.NayiveLauncher = { closePopups: closeAll };
        } );
    </script>

    <script>
        ( function ()
        {
            var tools = document.getElementById( 'tools' );
            var gear  = document.getElementById( 'gearBtn' );
            if( ! tools || ! gear ) return;

            // Roll the gear between its two resting spots (row-centre <-> left edge). It turns
            // like a wheel: one full turn, counter-clockwise on the way out to the left,
            // clockwise on the way back. Rotation shares the keyframes with the travel so the
            // two stay in step (a wheel that isn't slipping). Driven here rather than via a CSS
            // transition so it runs even when the OS has "reduce motion" on; CSS holds the
            // resting spots. While it rolls the gear sweeps over the other buttons, so it's
            // made click-through for the duration - otherwise a click meant for a tool button
            // hits the gear and toggles the row shut.
            var rollSeq = 0;
            function rollGear( open )
            {
                if( ! gear.animate ) return;
                var cx  = ( tools.clientWidth - gear.offsetWidth ) / 2;   // centre offset from the left edge
                var deg = open ? -360 : 360;                             // out = counter-clockwise, back = clockwise
                var mine = ++rollSeq;
                var anim = gear.animate(
                    [ { transform: 'translateX(' + ( open ? cx : 0 ) + 'px) translateY(-50%) rotate(0deg)' },
                      { transform: 'translateX(' + ( open ? 0 : cx ) + 'px) translateY(-50%) rotate(' + deg + 'deg)' } ],
                    { duration: 700, easing: 'cubic-bezier(.65, 0, .35, 1)' } );

                gear.style.pointerEvents = 'none';
                anim.onfinish = anim.oncancel = function () { if( mine === rollSeq ) gear.style.pointerEvents = ''; };
            }

            function setOpen( open )
            {
                rollGear( open );
                tools.classList.toggle( 'open', open );
                gear.setAttribute( 'aria-expanded', open ? 'true' : 'false' );
            }

            gear.addEventListener( 'click', function () { setOpen( ! tools.classList.contains( 'open' ) ); } );

            // Clicking anything else in the launcher - a tool button in the row, or one of the
            // app tiles - rolls the row back to its original state (the lone, centred gear).
            // Runs in the capture phase, before the button's own handler fires: the theme
            // toggle rewrites its own <svg> on click, which would orphan e.target and defeat a
            // later bubble-phase check. The gear is skipped so it keeps toggling the row.
            var panel = document.querySelector( '.apps-panel' );
            panel.addEventListener( 'click', function ( e )
            {
                var btn = e.target.closest( 'a, button' );
                if( btn && btn !== gear && tools.classList.contains( 'open' ) ) setOpen( false );
            }, true );

            document.getElementById( 'schemesBtn' ).addEventListener( 'click', function () { Ayni.schemeDialog(); } );

            document.addEventListener( 'keydown', function ( e )
            {
                if( e.key === 'Escape' && tools.classList.contains( 'open' ) && ! ( document.getElementById( 'scmBackdrop' ) || {} ).open ) setOpen( false );
            } );
        } )();
    </script>

    <!-- "Mi cuenta" dialog: the sign-in password (POST /api/password), the
         language (/api/lang), the timezone (/api/tz), the automatic theme,
         "Open the desktop" (this device), this device's notifications
         (/api/push) and the list of phones. The trip reminder moved to
         Trips › Settings (2026-10-02). -->
    <script>
        ( function ()
        {
            var openBtn = document.getElementById( 'accountBtn' );
            var back    = document.getElementById( 'pwBackdrop' );        // My account
            var pwBack  = document.getElementById( 'pwChangeBackdrop' );  // Change password
            var curEl   = document.getElementById( 'pwCurrent' );
            var newEl   = document.getElementById( 'pwNew' );
            var msgEl   = document.getElementById( 'pwMsg' );
            var saveBtn = document.getElementById( 'pwSave' );
            var cancel  = document.getElementById( 'pwCancel' );
            var pushChk   = document.getElementById( 'pushChk' );
            var pushWrap  = document.getElementById( 'pushChkWrap' );
            var pushMsgEl = document.getElementById( 'pushMsg' );
            var langSel = document.getElementById( 'langSel' );
            var langMsg = document.getElementById( 'langMsg' );
            var tzSel   = document.getElementById( 'tzSel' );
            var tzMsg   = document.getElementById( 'tzMsg' );
            var autoChk = document.getElementById( 'autoThemeChk' );
            var autoMsg = document.getElementById( 'autoThemeMsg' );
            var curWrap = curEl.closest( '.input-group' );
            if( ! openBtn || ! back ) return;

            // "mandatory" = a brand-new user who signed in with a blank password.
            // They must pick one in Change password before it will close.
            var mandatory = false;

            // Set just before the language change reloads the page; the boot
            // script at the end of this file reads it once and reopens this
            // dialog, so changing the language does not throw the user out of
            // the settings they were in the middle of.
            var REOPEN_KEY = 'balata-acct-reopen';

            // Interface language. It belongs to the ACCOUNT (POST /api/lang), so
            // a choice made on the phone reaches the PC; shared/i18n.js keeps a
            // copy on this device to paint with, and reloads so every string
            // re-renders. See Ayni.i18n.setLang and server/go/users.go UserLang.
            // (The CHOICE, not the language in use: with nothing stored the
            // box sits on "por defecto" even though the UI is in some
            // language. Picking it again clears the choice. By the time the
            // dialog opens the boot probe has already copied the account's
            // language down here, so this shows the account's answer. Set once
            // Ayni's list picker is there, below.)

            // The SERVER first (Ayni.autoSave: the box is off while it
            // saves, and back on the old value with langMsg on a failure).
            // Switch this device on a save that failed and the next boot reads
            // the old value back from /api/whoami and silently undoes the
            // choice - the user would see their language revert with no
            // explanation.
            function saveLang( code )
            {
                return fetch( '/api/lang?value=' + encodeURIComponent( code ),
                              { method: 'POST', credentials: 'same-origin' } )
                    .then( function ( r ) { if( ! r.ok ) throw new Error( 'lang' ); } );
            }

            function langSaved( code )
            {
                // setLang() reloads, so this dialog would vanish and the user
                // would have to dig it out again to change anything else.
                // Leave a note for the boot script to reopen it (per TAB, so
                // another tab is unaffected), and take the note back if nothing
                // is reloading after all - it would pop the dialog open on some
                // unrelated reload later.
                try { sessionStorage.setItem( REOPEN_KEY, '1' ); } catch ( e ) {}
                if( ! Ayni.i18n.setLang( code ) )
                    try { sessionStorage.removeItem( REOPEN_KEY ); } catch ( e ) {}
            }

            // (The eyes on the two password fields are Ayni's [data-reveal].)
            document.addEventListener( 'DOMContentLoaded', function ()
            {
                // Language and time zone save themselves (shared/ui.js is
                // deferred: here it is there).
                // Both are Ayni list pickers, there once Ayni has started.
                Ayni.ready.then( function ()
                {
                    if( langSel )
                    {
                        Ayni.picker( langSel ).set( Ayni.i18n.saved() || '' );
                        Ayni.autoSave( langSel, saveLang, { msg: langMsg, fail: Ayni.t( 'acct.langFailed' ), done: langSaved } );
                    }
                    tzCtl = Ayni.autoSave( tzSel, saveTz, { msg: tzMsg, fail: Ayni.t( 'acct.tzFailed' ), done: tzDone } );
                } );
            } );

            // One row's message line under its setting: hidden when empty,
            // green when ok, red otherwise.
            function say( el, t, ok )
            {
                el.textContent = t;
                el.hidden = ! t;
                el.style.color = ok ? 'var(--ok, var(--accent))' : 'var(--danger)';
            }

            // --- timezone ------------------------------------------------- //
            // A timezone belongs to the PERSON, not to the server: it decides
            // what a floating "10:00" in the calendar means and which clock a
            // reminder prints. Stored on the ACCOUNT (POST /api/tz), so the
            // zone follows the person to every device - and is picked from a
            // list, never typed, so an unknown zone can't be saved.
            var tzSaved = null;            // last value confirmed by the server
            var tzCtl   = null;            // its Ayni.autoSave

            // Every zone the browser knows (Ayni.dates.zones; ancient browsers
            // get a short list) plus, below, whatever is already saved, which is
            // enough to see and keep the current value.
            function fillZones( current )
            {
                var zones = Ayni.dates.zones().slice();
                // The saved zone ALWAYS gets an entry, even when this browser's
                // list has never heard of it (an old IANA alias, a newer server).
                // Without this the box would silently snap to the first option
                // and the next stray change would overwrite a good value.
                if( current && zones.indexOf( current ) === -1 ) zones.unshift( current );

                var pk = Ayni.picker( tzSel );
                pk.options = zones;
                pk.set( current || '' );
            }

            async function loadTz()
            {
                say( tzMsg, '' );
                try
                {
                    var r = await fetch( '/api/tz', { credentials: 'same-origin' } );
                    var d = await r.json();
                    if( r.ok ) tzSaved = d.tz || '';
                }
                catch ( e ) { /* keep whatever we had */ }
                fillZones( tzSaved || Ayni.dates.zone() );
                if( tzCtl ) tzCtl.saved( Ayni.picker( tzSel ).value );
            }

            // Ayni.autoSave runs it on change; a failure puts the box back
            // and says acct.tzFailed in tzMsg.
            async function saveTz( z )
            {
                var r = await fetch( '/api/tz?value=' + encodeURIComponent( z ),
                                     { method: 'POST', credentials: 'same-origin' } );
                var d = await r.json().catch( function (){ return {}; } );
                if( ! r.ok ) throw new Error( 'tz' );
                tzSaved = d.tz || '';
            }

            // The server's spelling of the zone wins.
            function tzDone()
            {
                Ayni.picker( tzSel ).set( tzSaved );
                tzCtl.saved( tzSaved );
            }

            // --- automatic light / dark ------------------------------------ //
            // shared/theme.js does the sun arithmetic and owns the storage; all
            // this dialog does is turn it on and hand it a pair of coordinates.
            // Asking for the location needs a real click, which is exactly what
            // ticking the box is - so it is asked for here and nowhere else.
            function autoState()
            {
                if( ! window.Ayni || Ayni.theme.mode() !== 'sun' ) return '';
                return Ayni.theme.hasPlace() ? '' : 'acct.themeAutoNoGeo';
            }

            function askGeo()
            {
                if( ! navigator.geolocation )
                {
                    say( autoMsg, Ayni.t( 'acct.themeAutoNoGeo' ), false );
                    return;
                }

                say( autoMsg, Ayni.t( 'acct.themeAutoLocating' ), true );

                // Refused, or the device simply does not know where it is: auto
                // mode stays ON, on the sun of the time zone's main city.
                Ayni.theme.askPlace().then( function ( got )
                {
                    say( autoMsg, got ? '' : Ayni.t( 'acct.themeAutoNoGeo' ), false );
                } );
            }

            // Automatic (Ayni's Sun mode) is only ever turned on by its tick: new
            // users follow the system's light / dark (his call, 2026-10-28, which
            // replaced "automatic starts ON the first time", 2026-09-19).
            function loadAuto()
            {
                if( ! window.Ayni ) { autoWrap().hidden = true; return; }

                var on = Ayni.theme.mode() === 'sun';
                autoChk.checked = on;

                var key = autoState();
                say( autoMsg, key ? Ayni.t( key ) : '', false );

                if( on && Ayni.theme.hasPlace() ) Ayni.theme.refreshPlace();
            }

            function autoWrap() { return document.getElementById( 'autoThemeWrap' ); }

            autoChk.addEventListener( 'change', function ()
            {
                if( ! window.Ayni ) return;

                // Off keeps what shows now, as a choice by hand.
                if( ! autoChk.checked ) { Ayni.setTheme( Ayni.isDark() ? 'dark' : 'light' ); say( autoMsg, '' ); return; }

                // On FIRST, so the theme is already following the fallback
                // window even if the location request is refused or times out.
                Ayni.setTheme( 'sun' );
                askGeo();
            } );

            // --- native OS notifications (Web Push) ------------------------- //
            // PER DEVICE, not per account: the browser owns the subscription, so
            // the user turns this on once on each phone, tablet and PC. The
            // server only ever sees an endpoint + two keys (see /api/push).
            var pushState = {
                vapid: '', why: '', subscribed: false, sub: null,
                supported: ( 'serviceWorker' in navigator ) && ( 'PushManager' in window )
                           && ( 'Notification' in window )
            };

            // base64url -> Uint8Array, and "made with this key?": shared/ui.js (deferred:
            // this script runs first, so looked up at call time).
            function b64ToU8( s )        { return Ayni.pwa.b64ToU8( s ); }
            function sameKey( sub, b64 ) { return Ayni.pwa.samePushKey( sub, b64 ); }

            async function pushGet( endpoint )
            {
                var q = endpoint ? '?endpoint=' + encodeURIComponent( endpoint ) : '';
                var r = await fetch( '/api/push' + q, { credentials: 'same-origin' } );
                return { ok: r.ok, data: await r.json().catch( function (){ return {}; } ) };
            }

            async function postSub( sub )
            {
                var r = await fetch( '/api/push',
                {
                    method:      'POST',
                    headers:     { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    // No window_minutes: Planner › Settings owns it; the server keeps it.
                    // tz: a floating event rings at THIS device's clock (reminders.go).
                    body: JSON.stringify( { subscription:    sub.toJSON(),
                                            lang:  Ayni.i18n.lang(),
                                            label: navigator.platform || '',
                                            tz:    Ayni.dates.zone() } )
                } );
                var d = await r.json().catch( function (){ return {}; } );
                if( r.ok )
                {
                    pushState.subscribed = true;
                    pushNote( sub );
                    // This phone's app row names this Chrome's endpoint: a new
                    // subscription (after a sign-out) must reach it now, not at
                    // the next launcher load - or a call rings here twice.
                    if( window.NayiveDevices ) NayiveDevices.moveEndpoint();
                }
                return { ok: r.ok, data: d };
            }

            // What this device last registered: its endpoint, language and
            // account. healPush() below compares against it.
            var PUSH_NOTE = 'nayive-push-note';

            function pushNote( sub )
            {
                try
                {
                    if( ! sub ) { localStorage.removeItem( PUSH_NOTE ); return; }
                    localStorage.setItem( PUSH_NOTE, JSON.stringify( {
                        ep:   sub.endpoint,
                        lang: Ayni.i18n.lang(),
                        tz:   Ayni.dates.zone(),
                        who:  ( window.AyniStore && AyniStore.me ) || '' } ) );
                }
                catch ( e ) {}
            }

            // The SELF-HEAL on every launcher load (loadPush below runs only
            // with Mi cuenta). A new endpoint (the browser renewed it - sw.js
            // resubscribe, whose POST may have met an expired session and
            // cannot know the language), another language (a change reloads
            // the page), another time zone (a trip), or no subscription left although this account had one
            // here (Firefox renews with no oldSubscription): registered again.
            // Nothing changed = no request at all.
            async function healPush()
            {
                if( ! pushState.supported || Notification.permission !== 'granted' ) return;
                try
                {
                    var note = JSON.parse( localStorage.getItem( PUSH_NOTE ) || 'null' );
                    var who  = ( window.AyniStore && AyniStore.me ) || '';
                    var lang = Ayni.i18n.lang();
                    var reg  = await navigator.serviceWorker.getRegistration();
                    if( ! reg || ! reg.pushManager ) return;
                    var sub  = await reg.pushManager.getSubscription();
                    if( sub )
                    {
                        if( note && note.ep === sub.endpoint && note.lang === lang && note.who === who &&
                            note.tz === Ayni.dates.zone() ) return;   // a trip to another zone re-posts
                        await postSub( sub );
                        return;
                    }
                    if( ! note || note.who !== who ) return;
                    var first = await pushGet( '' );
                    if( ! first.ok || ! first.data.vapid_public ) return;
                    sub = await reg.pushManager.subscribe( { userVisibleOnly: true,
                                                             applicationServerKey: b64ToU8( first.data.vapid_public ) } );
                    await postSub( sub );
                }
                catch ( e ) {}
            }

            // Runs every time the sheet opens. Fetching the VAPID key HERE is
            // load-bearing: enablePush must not await anything before it calls
            // requestPermission (see there).
            //
            // It is also the SELF-HEAL. If this browser holds a subscription the
            // server has forgotten - a restored backup, or a
            // pushsubscriptionchange whose POST hit an expired session - it is
            // quietly registered again instead of going silent forever.
            async function loadPush()
            {
                say( pushMsgEl, '' );
                if( ! pushState.supported ) { renderPush(); return; }
                try
                {
                    var first = await pushGet( '' );
                    if( ! first.ok )
                    {
                        pushState.vapid = '';
                        pushState.why   = Ayni.t( 'ui.loadFailed' );
                        say( pushMsgEl, pushState.why );
                        renderPush();
                        return;
                    }
                    pushState.vapid          = first.data.vapid_public || '';

                    var reg = await navigator.serviceWorker.ready;
                    var sub = await reg.pushManager.getSubscription();
                    pushState.sub = sub;

                    if( ! sub ) { pushState.subscribed = false; }
                    else if( pushState.vapid && ! sameKey( sub, pushState.vapid ) )
                    {
                        try { await sub.unsubscribe(); } catch ( e ) {}
                        pushState.sub = null;
                        pushState.subscribed = false;
                        say( pushMsgEl, Ayni.t( 'acct.notifsStale' ) );
                    }
                    else
                    {
                        var mine = await pushGet( sub.endpoint );
                        pushState.subscribed = !! mine.data.subscribed;
                        if( ! pushState.subscribed ) await postSub( sub );
                    }
                }
                catch ( e ) { /* leave the section in whatever state we reached */ }
                renderPush();
            }

            function renderPush()
            {
                if( ! pushChk ) return;

                // iOS BEFORE the support test, for the same reason enablePush
                // tests it first. In a Safari TAB there is no PushManager at
                // all, so the plain support test would answer "this browser
                // does not support notifications" - a dead end, when the true
                // answer is "install Nayive on the Home Screen and it works".
                // installMode() says "ios" only on iOS and NOT installed.
                if( Ayni.pwa.installMode && Ayni.pwa.installMode() === 'ios' )
                {
                    if( pushWrap ) pushWrap.hidden = true;
                    say( pushMsgEl, Ayni.t( 'acct.notifsIos' ) );
                    return;
                }

                if( ! pushState.supported )
                {
                    // Hide the whole label - hiding only the box leaves its text stranded.
                    if( pushWrap ) pushWrap.hidden = true;
                    say( pushMsgEl, Ayni.t( 'acct.notifsUnsupported' ) );
                    return;
                }
                var blocked = ( Notification.permission === 'denied' );
                if( pushWrap ) pushWrap.hidden = false;
                pushChk.disabled = blocked;
                pushChk.checked  = pushState.subscribed;
                if( blocked ) say( pushMsgEl, Ayni.t( 'acct.notifsBlocked' ) );
            }

            // The click handler. The order of the first steps is NOT negotiable.
            async function enablePush()
            {
                say( pushMsgEl, '' );

                // iOS FIRST, before any permission call. Outside an installed
                // PWA, requestPermission() resolves to "denied" - and denied is
                // STICKY, so one naive attempt would permanently poison this
                // user's ability to ever turn notifications on. installMode()
                // returns "ios" only when we are on iOS and NOT installed.
                if( Ayni.pwa.installMode && Ayni.pwa.installMode() === 'ios' )
                {
                    say( pushMsgEl, Ayni.t( 'acct.notifsIos' ) );
                    renderPush();
                    if( Ayni.pwa.offerInstall ) Ayni.pwa.offerInstall( { manual: true } );
                    return;
                }
                if( ! pushState.supported )
                    { say( pushMsgEl, Ayni.t( 'acct.notifsUnsupported' ) ); renderPush(); return; }
                if( Notification.permission === 'denied' )
                    { renderPush(); return; }
                if( ! pushState.vapid )
                    { say( pushMsgEl, pushState.why || Ayni.t( 'ui.saveFailed' ) ); renderPush(); return; }

                // requestPermission MUST be the first await in this handler. Any
                // await before it spends the user activation and the browser
                // refuses the prompt without ever showing it.
                var perm = await Notification.requestPermission();
                if( perm !== 'granted' ) { renderPush(); return; }

                try
                {
                    var reg = await navigator.serviceWorker.ready;
                    var sub = await reg.pushManager.subscribe(
                                    { userVisibleOnly: true,
                                      applicationServerKey: b64ToU8( pushState.vapid ) } );
                    var res = await postSub( sub );
                    if( res.ok ) pushState.sub = sub;
                    else
                    {
                        try { await sub.unsubscribe(); } catch ( e ) {}   // leave no orphan
                        pushState.subscribed = false;
                        say( pushMsgEl, Ayni.t( 'ui.saveFailed' ) );
                    }
                }
                // Say what the browser said: "No se pudo guardar." alone left
                // nothing to go on when a phone refused (2026-09-19).
                catch ( e )
                {
                    var why = e && e.name ? ' (' + e.name + ( e.message ? ': ' + e.message : '' ) + ')' : '';
                    say( pushMsgEl, Ayni.t( 'ui.saveFailed' ) + why );
                }
                renderPush();
            }

            async function disablePush()
            {
                say( pushMsgEl, '' );
                var sub = pushState.sub;
                var ep  = sub && sub.endpoint;
                try { if( sub ) await sub.unsubscribe(); } catch ( e ) {}
                try
                {
                    if( ep ) await fetch( '/api/push?endpoint=' + encodeURIComponent( ep ),
                                          { method: 'DELETE', credentials: 'same-origin' } );
                }
                catch ( e ) {}

                    // desktop again.

                    curWrap.hidden = false;
                    cancel.hidden  = false;
                }
                catch ( e ) { say( msgEl, Ayni.t( 'login.noServer' ) ); Ayni.setBusy( saveBtn, false ); return; }

                close();
            } );
        } )();

    <script>

            sessionStorage.removeItem( 'balata-acct-reopen' );

        // only here first, then what this browser keeps, THIS phone's link too.
        document.getElementById( 'logoutBtn' ).addEventListener( 'click', function ( e )
        {
            e.preventDefault();
            NayiveUI.signOut( { unlinkPhone: true } );
        } );

        fetch( '/api/whoami', { credentials: 'same-origin' } )
            .then( function ( r ) {
                if( r.status === 401 ) { location.href = '/nayive/login.html'; return null; }
                return r.json().catch( function () { return null; } );
            } )
            .then( function ( me ) {
                if( ! me || ! me.user ) return;

                // The ACCOUNT's language beats this device's, so a language
                // picked on the phone lands here. adopt() reloads when it
                // changes anything - then there is nothing else worth doing on
                // a page that is on its way out. See Ayni.i18n.setLang.
                if( window.Ayni && Ayni.i18n.setLang( me.lang ) ) return;

                // goes up now (shared/ayni/ayni-store.js PARKED SAVES; deferred: whoami
                // can answer before it has run).

                // No timezone on this account yet: adopt THIS browser's, once.
                // The browser knows the real answer (the OS zone) - an IP lookup
                // only guesses it, and guesses wrong behind a VPN. Until it is
                // stored, a floating "10:00" in the calendar and every reminder
                // clock fall back to the server's own zone, which is nobody's.
                // Only ever fills a BLANK; changing it later is the "Mi cuenta"

        // 2. "?here=<find>": the answer to a "¿Dónde estás?" push (the iPhone
        //    path) - send where this device is, once, and clean the address.
        // 3. The round button in the panel's bottom-right corner and its dialog.
        //    Disabled until there is something to find: a phone with the app,
        //    or a last known position.

                if( d < 3600 )  return TF( 'find.agoMin',  { n: Math.floor( d / 60 ) } );
                if( d < 86400 ) return TF( 'find.agoHour', { n: Math.floor( d / 3600 ) } );
                return TF( 'find.agoDay', { n: Math.floor( d / 86400 ) } );
            }
            var SRC = { nayive: 'find.srcNayive', gpslogger: 'find.srcGpslogger', overland: 'find.srcOverland',
                        owntracks: 'find.srcOwntracks', photo: 'find.srcPhoto', browser: 'find.srcBrowser', phone: 'find.srcBrowser' };
            function where( p, withSource )
            {
                var bits = [ ago( p.at ) ];
                if( withSource && SRC[ p.source ] ) bits.push( T( SRC[ p.source ] ) );
                if( p.acc ) bits.push( TF( 'find.acc', { m: Math.round( p.acc ) } ) );
                return bits.join( ' · ' );
            }
            function mapLink( p )
            {
                var u = 'https://www.openstreetmap.org/?mlat=' + p.lat + '&mlon=' + p.lon + '#map=17/' + p.lat + '/' + p.lon;
                return '<a class="btn" target="_blank" rel="noopener noreferrer" href="' + esc( u ) +
                       '" data-tip="' + esc( T( 'find.map' ) ) + '" aria-label="' + esc( T( 'find.map' ) ) + '">' + ICON.map + '</a>';
            }
            function btn( act, id, icon, label, danger )
            {
                return '<button type="button" class="btn' + ( danger ? ' danger' : '' ) + '" data-act-find="' + act +
                       '" data-id="' + esc( id ) + '" data-tip="' + esc( label ) + '" aria-label="' + esc( label ) + '">' + icon + '</button>';
            }
            function row( title, lines, actions )
            {
                return '<div class="find-row"><div class="find-txt"><b>' + esc( title ) + '</b>' +
                       lines.map( function ( l ) { return '<small' + ( l.live ? ' class="find-live"' : '' ) + '>' + esc( l.t ) + '</small>'; } ).join( '' ) +
                       '</div>' + ( actions || '' ) + '</div>';
            }
            function seenLine( d ) { return d.online ? T( 'find.online' ) : TF( 'find.seen', { ago: ago( d.seen ) } ); }

            // ---- 3. the button and its dialog --------------------------------
            var state   = null;       // the last GET /api/device
            var gone    = {};         // phone ids removed with the Undo still on show: not drawn
            var others  = 0;          // devices with notifications, this one aside
            var findBtn = document.getElementById( 'findBtn' );
            var back    = document.getElementById( 'findBackdrop' );
            var pollT   = 0;

            function worthIt( s ) { return !! ( s && ( ( s.devices && s.devices.length ) || s.last ) ); }

            function refreshButton()
            {
                return api( 'GET', '' ).then( function ( j )
                {
                    if( j._status !== 200 ) return;          // the admin (403), or signed out
                    state = j;
                    findBtn.setAttribute( 'aria-disabled', worthIt( j ) ? 'false' : 'true' );
                    if( isOpen() ) render();
                } ).catch( function () {} );
            }

            function latestFind( device )
            {
                var fs = ( state && state.finds ) || [];
                for( var i = 0; i < fs.length; i++ ) if( fs[ i ].device === device ) return fs[ i ];   // newest first
                return null;
            }

            function render()
            {
                if( ! state ) return;
                var phones = ( state.devices || [] ).filter( function ( d ) { return ! gone[ d.id ]; } );
                document.getElementById( 'findPhonesWrap' ).hidden = ! phones.length;
                document.getElementById( 'findPhones' ).innerHTML = phones.map( function ( d )
                {
                    var f = latestFind( d.id ), lines = [ { t: seenLine( d ) } ], acts = '';
                    if( f && f.state === 'ringing' )
                    {
                        lines.push( { t: T( 'find.ringing' ), live: true } );
                        acts = btn( 'stop', f.id, ICON.stop, T( 'find.stop' ) );
                    }
                    else
                    {
                        if( f ) lines.push( { t: T( { stopped: 'find.stopped', cancelled: 'find.cancelled', timeout: 'find.timeout' }[ f.state ] || 'find.stopped' ) + ' · ' + ago( ( f.ended || f.since ) / 1000 ) } );
                        acts = btn( 'ring', d.id, ICON.ring, T( 'find.ring' ) );
                    }
                    if( f && f.pos )
                    {
                        lines.push( { t: T( 'find.here' ) + ' · ' + where( f.pos, false ), live: true } );
                        acts = mapLink( f.pos ) + acts;
                    }
                    return row( d.name, lines, acts );
                } ).join( '' );

                var last = state.last;
                document.getElementById( 'findLast' ).innerHTML = last
                    ? row( ago( last.at ), [ { t: where( last, true ).split( ' · ' ).slice( 1 ).join( ' · ' ) || ' ' } ], mapLink( last ) )
                    : '<p class="find-note">' + esc( T( 'find.none' ) ) + '</p>';

                document.getElementById( 'findAskWrap' ).hidden = others <= 0;
                var asked = null, fs = state.finds || [];
                for( var i = 0; i < fs.length; i++ ) if( fs[ i ].state === 'asked' ) { asked = fs[ i ]; break; }
                var askLines = [];
                if( asked && asked.pos ) askLines.push( { t: T( 'find.answered' ) + ' · ' + where( asked.pos, false ), live: true } );
                else if( asked )         askLines.push( { t: T( 'find.asked' ) } );
                document.getElementById( 'findAsk' ).innerHTML =
                    row( T( 'find.ask' ), askLines, ( asked && asked.pos ? mapLink( asked.pos ) : '' ) + btn( 'ask', '', ICON.ask, T( 'find.ask' ) ) );
            }

            // Poll only while something is moving: a phone ringing, a question
            // not answered yet. Otherwise the dialog is still.
            function busy()
            {
                var fs = ( state && state.finds ) || [];
                var now = Date.now();
                return fs.some( function ( f )
                {
                    return f.state === 'ringing' || ( ! f.pos && now - f.since < 10 * 60 * 1000 &&
                        ( f.state === 'asked' || now - ( f.ended || f.since ) < 60 * 1000 ) );
                } );
            }
            function poll()
            {
                clearTimeout( pollT );
                if( ! isOpen() ) return;
                refreshButton().then( function () { if( isOpen() && busy() ) pollT = setTimeout( poll, 3000 ); } );
            }

            function openFind()
            {
                myEndpoint().then( function ( ep )
                {
                    others = ( state && state.push ) || 0;
                    if( ep ) others--;                      // this browser is not "another device"
                    render();
                    document.getElementById( 'findBackdrop' ).showModal();
                    poll();
                } );
            }
            function isOpen()    { return back.open; }
            function closeFind() { document.getElementById( 'findBackdrop' ).close(); clearTimeout( pollT ); }

            findBtn.addEventListener( 'click', openFind );

            // Escape reaches it through Ayni, which clicks this x.
            document.getElementById( 'findClose' ).addEventListener( 'click', closeFind );

            back.addEventListener( 'click', function ( e )
            {
                var b = e.target.closest( '[data-act-find]' );
                if( ! b ) return;
                var act = b.getAttribute( 'data-act-find' ), id = b.getAttribute( 'data-id' );
                Ayni.setBusy( b, T( 'ui.wait' ) );
                var req = act === 'ring' ? api( 'POST', '/find', { id: id } )
                        : act === 'stop' ? api( 'POST', '/find/' + encodeURIComponent( id ) + '/stop' )
                        : myEndpoint().then( function ( ep ) { return api( 'POST', '/find', { ask: true, endpoint: ep } ); } );
                req.then( function ( j )
                {
                    if( act === 'ask' && j._status === 200 && ! j.asked ) Ayni.toast( 'warn', T( 'find.askedNone' ) );
                    else if( j._status !== 200 ) Ayni.toast( 'err', T( 'ui.saveFailed' ) );
                    poll();
                } ).catch( function () { Ayni.toast( 'err', T( 'login.noServer' ) ); Ayni.setBusy( b, false ); } );
            } );

            // ---- 4. Mi cuenta ----------------------------------------------
            var devWrap = document.getElementById( 'devWrap' );
            var devList = document.getElementById( 'devList' );
            var devs    = [];         // the phones of the last GET
            function loadAccount()
            {
                api( 'GET', '' ).then( function ( j )
                {
                    devs = ( j._status === 200 && j.devices ) || [];
                    drawAccount();
                } ).catch( function () {} );
            }
            function drawAccount()
            {
                var ds = devs.filter( function ( d ) { return ! gone[ d.id ]; } );
                devWrap.hidden = ! ds.length;
                devList.innerHTML = ds.map( function ( d )
                {
                    return row( d.name, [ { t: seenLine( d ) } ], btn( 'remove', d.id, Ayni.icon( 'trash' ), T( 'dev.remove' ), true ) ) +
                           mediaRow( d );
                } ).join( '' );
            }
            // "Upload new photos and videos" (server/go/api_device_media.go): the
            // switch, and - while on - the folder for what no trip takes.
            function mediaRow( d )
            {
                var id = 'devMedia-' + d.id;
                return '<div class="dev-media">' +
                       '<div class="acct-check-row">' +
                           '<label class="acct-check" for="' + esc( id ) + '"><span>' + esc( T( 'dev.media' ) ) + '</span></label>' +
                           '<button class="info-tip" type="button" data-help="' + esc( T( 'dev.mediaInfo' ) ) + '"></button>' +
                           '<label class="switch"><input role="switch" type="checkbox" id="' + esc( id ) + '" data-dev-media="' + esc( d.id ) + '"' +
                               ( d.media ? ' checked' : '' ) + '></label>' +
                       '</div>' +
                       '<button type="button" class="folder-pick" data-dev-dir="' + esc( d.id ) + '" data-tip="' + esc( T( 'dev.mediaDir' ) ) +
                           '" aria-label="' + esc( T( 'dev.mediaDir' ) ) + '"' + ( d.media ? '' : ' hidden' ) + '>' +
                           '<span class="fp-btn-ic">' + Ayni.icon( 'folder' ) + '</span>' +
                           '<span class="fp-btn-nm">' + esc( dirLabel( d.mediaDir ) ) + '</span></button>' +
                       '</div>';
            }
            // "files/Camera" -> "Archivos / Camera", as Drive shows it.
            function dirLabel( dir )
            {
                var parts = String( dir || 'files/Camera' ).split( '/' );
                parts[ 0 ] = T( 'ui.filesRoot' );
                return parts.join( ' / ' );
            }
            function devById( id ) { return devs.filter( function ( d ) { return d.id === id; } )[ 0 ]; }
            function saveMedia( id, body, undo )
            {
                api( 'PUT', '/' + encodeURIComponent( id ), body ).then( function ( j )
                {
                    if( j._status !== 200 ) { undo(); Ayni.toast( 'err', T( 'ui.saveFailed' ) ); }
                } ).catch( function () { undo(); Ayni.toast( 'err', T( 'login.noServer' ) ); } );
            }
            devList.addEventListener( 'change', function ( e )
            {
                var box = e.target.closest( '[data-dev-media]' );
                if( ! box ) return;
                var d = devById( box.getAttribute( 'data-dev-media' ) );
                if( ! d ) return;
                var on = box.checked;
                d.media = on;
                drawAccount();
                saveMedia( d.id, { media: on }, function () { d.media = ! on; drawAccount(); } );
            } );
            // The folder picker needs AyniNet (shared/ayni/ayni-net.js), which this page
            // does not load up front: fetched on the first tap.
            var gumLoad = null;
            function needGum()
            {
                if( window.AyniNet ) return Promise.resolve();
                if( ! gumLoad )
                    gumLoad = new Promise( function ( resolve, reject )
                    {
                        var sc = document.createElement( 'script' );
                        sc.src = 'shared/ayni/ayni-net.js';
                        sc.onload = resolve;
                        sc.onerror = function () { gumLoad = null; reject( new Error( 'gum-api' ) ); };
                        document.head.appendChild( sc );
                    } );
                return gumLoad;
            }
            devList.addEventListener( 'click', function ( e )
            {
                var b = e.target.closest( '[data-dev-dir]' );
                if( ! b ) return;
                var d = devById( b.getAttribute( 'data-dev-dir' ) );
                if( ! d ) return;
                needGum().then( function () { return NayiveUI.pickFolder( { title: T( 'dev.mediaDir' ) } ); } ).then( function ( picked )
                {
                    if( ! picked || picked === d.mediaDir ) return;
                    var had = d.mediaDir;
                    d.mediaDir = picked;
                    drawAccount();
                    saveMedia( d.id, { mediaDir: picked }, function () { d.mediaDir = had; drawAccount(); } );
                } ).catch( function () { Ayni.toast( 'err', T( 'login.noServer' ) ); } );
            } );
            function redraw() { drawAccount(); if( isOpen() ) render(); }
            // A delete inside a dialog acts at once: no second question. Its token
            // dies (the phone must enrol again), so the row only hides now; the
            // real DELETE goes when the Undo is gone for good.
            devList.addEventListener( 'click', function ( e )
            {
                var b = e.target.closest( '[data-act-find="remove"]' );
                if( ! b ) return;
                var id = b.getAttribute( 'data-id' );
                gone[ id ] = true;
                redraw();
                Ayni.toast( 'ok', T( 'dev.removed' ), { undo: function () { delete gone[ id ]; redraw(); }, final: function () { removeNow( id ); } } );
            } );
            // The DELETE first: a closing page sends only a fetch started at once.
            // This browser's own record goes too, before the answer (a closing
            // page never reads it), and comes back if the server says no.
            function removeNow( id )
            {
                var req  = api( 'DELETE', '/' + encodeURIComponent( id ) );
                var had  = get( 'nayive-device' ), mine = parse( 'nayive-device' );
                if( mine && mine.id === id ) put( 'nayive-device', null ); else had = null;
                function failed( m )
                {
                    if( had && ! get( 'nayive-device' ) ) put( 'nayive-device', had );
                    delete gone[ id ];
                    redraw();
                    Ayni.toast( 'err', m );
                }
                req.then( function ( j )
                {
                    if( j._status !== 204 && j._status !== 404 ) { failed( T( 'ui.saveFailed' ) ); return; }
                    loadAccount();              // `gone` keeps its id: a phone that enrols again gets a new one
                    refreshButton();
                } ).catch( function () { failed( T( 'login.noServer' ) ); } );
            }
            window.NayiveDevices = {
                loadAccount:  loadAccount,
                moveEndpoint: function () { var k = parse( 'nayive-device' ); if( k ) moveEndpoint( k ); }
            };

            // ---- start -----------------------------------------------------
            Ayni.i18n.ready.then( function ()
            {
                enrol();
                answerHere();
                refreshButton();
            } );
            document.addEventListener( 'visibilitychange', function () { if( ! document.hidden ) refreshButton(); } );
        } )();
    </script>
</body>
</html>
