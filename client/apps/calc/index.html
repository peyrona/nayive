<!-- index.html - Calc: a spreadsheet editor (xlsx / csv) over the user's files. Handsontable + HyperFormula. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Calc</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%2316A085'%3E%3Cg transform='translate(-213.2 -558.1) scale(1.8891 3.2191)'%3E%3Cg transform='translate(37.3 3.7)'%3E%3Cpath d='m 159.5,210.8 v 7.2 h 25.2 v 16.5 H 159.5 V 300 h -21.5 v -65.6 h -19.9 v -16.5 h 19.9 v -5.7 q 0,-14.8 6.2,-20.5 6.2,-5.7 22.9,-5.7 h 17.7 v 16.5 h -16.8 q -4.8,0 -6.6,1.8 -1.7,1.8 -1.8,6.5 z'/%3E%3Cg transform='translate(67.4 112.5) scale(.625)'%3E%3Cpath d='m 243.4,186.2 q -9.7,17.5 -14.4,33.9 -4.7,16.4 -4.7,32.8 0,16.3 4.7,32.8 4.7,16.5 14.4,34.1 h -16.7 q -11.6,-16.9 -17.3,-33.3 -5.6,-16.5 -5.6,-33.5 0,-17 5.6,-33.5 5.7,-16.6 17.3,-33.3 z'/%3E%3Cpath d='M 329.9,218 302.2,257.2 332.3,300 H 307.2 L 291.1,272.4 275.1,300 h -25 l 30.3,-42.8 -27.9,-39.3 h 25 l 13.6,24.5 13.7,-24.5 z'/%3E%3Cpath d='m 338.9,186.2 h 16.7 q 11.6,16.7 17.2,33.3 5.7,16.5 5.7,33.5 0,17.1 -5.6,33.5 -5.6,16.4 -17.3,33.3 h -16.7 q 9.7,-17.6 14.4,-34.1 4.7,-16.6 4.7,-32.8 0,-16.4 -4.7,-32.8 -4.7,-16.4 -14.4,-33.9 z'/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/svg%3E">

    <!-- Shared colour scheme (light default, opt-in dark). The toggle lives in the launcher; this page just follows the saved choice. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>

    <!-- Vendored libs (all pinned, no build step). Order matters: classic scripts run before the deferred module script below. -->
    <script src="lib/handsontable_v18.0.0.full.min.js"></script>
    <link rel="stylesheet" href="lib/handsontable_v18.0.0.min.css">
    <link rel="stylesheet" href="lib/handsontable-theme-main_v18.0.0.min.css">
    <script src="lib/hyperformula_v3.4.0.full.min.js"></script>

    <!-- The file API client: the access probe, retrying fetch, file ops. -->
    <script src="../shared/gum-api.js" defer></script>
    <!-- Shared UI helpers: sheets, toast, sync plug, i18n. -->
    <script src="../shared/ui.js" defer></script>

    <!-- The pull-down menu bar (Archivo, Edición, Ver…) and the switch that
         remembers whether the user wants it or the icon toolbar. Shared with Write. -->
    <script src="../shared/menubar.js" defer></script>
    <!-- What the three editors share: paths, the file label, the Open browser, the phone menu. -->
    <!-- A document locked with a password: AES-GCM, the key never leaves the tab. -->
    <script src="../shared/crypt.js" defer></script>
    <script src="../shared/office.js" defer></script>
    <!-- Offline-capable persistence: local cache + write outbox (see STATE). -->
    <script src="../shared/store.js" defer></script>
    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'calc',
            title: 'Calc',
            lead:  NayiveUI.t( 'calc.introLead' ),
            buttons: [
                { sel: '#chromeMenusBtn', text: NayiveUI.t( 'calc.chromeNote' ) },
                { sel: '#fmtBtn',       text: NayiveUI.t( 'calc.introToolbar' ) },
                { sel: '#moreBtn',      text: NayiveUI.t( 'calc.introFileMenu' ) },
                { sel: '#moreToolsBtn', text: NayiveUI.t( 'calc.introMoreBar' ) },
                { sel: '#fmtBoldBtn', name: NayiveUI.t( 'calc.introFormatName' ), text: NayiveUI.t( 'calc.introFormat' ) },
                { sel: '#fmtTableBtn',     name: NayiveUI.t( 'calc.introRowsColsName' ), text: NayiveUI.t( 'calc.introRowsCols' ) },
                { sel: '#fmtAlignBtn',     text: NayiveUI.t( 'calc.introAlign' ) },
                { sel: '#fmtSortBtn',      text: NayiveUI.t( 'calc.introSort' ) },
                { sel: '#fmtFreezeGrpBtn', text: NayiveUI.t( 'calc.introFreeze' ) },
                { sel: '#fxBtn',     text: NayiveUI.t( 'calc.introFx' ) },
                { sel: '#undoBtn',   text: NayiveUI.t( 'calc.introUndo' ) },
                { sel: '#redoBtn',   text: NayiveUI.t( 'calc.introRedo' ) },
                { sel: '#newBtn',     text: NayiveUI.t( 'write.introNew' ) },
                { sel: '#openBtn',    text: NayiveUI.t( 'calc.introOpen' ) },
                { sel: '#importBtn',  text: NayiveUI.t( 'calc.introImport' ) },
                { sel: '#saveAsBtn',  text: NayiveUI.t( 'calc.introSaveAs' ) },
                { sel: '#restoreBtn', text: NayiveUI.t( 'write.introRestore' ) },
                { sel: '#lockBtn',    text: NayiveUI.t( 'write.introLock' ) },
                { sel: '#scBtn',      text: NayiveUI.t( 'write.introShortcuts' ) }
            ]
        } );
    } );
    </script>

    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <div class="topbar">
            <svg class="app-icon" width="20" height="20" viewBox="0 0 512 512" fill="currentColor"><g transform="translate(-213.2 -558.1) scale(1.8891 3.2191)"><g transform="translate(37.3 3.7)"><path d="m 159.5,210.8 v 7.2 h 25.2 v 16.5 H 159.5 V 300 h -21.5 v -65.6 h -19.9 v -16.5 h 19.9 v -5.7 q 0,-14.8 6.2,-20.5 6.2,-5.7 22.9,-5.7 h 17.7 v 16.5 h -16.8 q -4.8,0 -6.6,1.8 -1.7,1.8 -1.8,6.5 z"></path><g transform="translate(67.4 112.5) scale(.625)"><path d="m 243.4,186.2 q -9.7,17.5 -14.4,33.9 -4.7,16.4 -4.7,32.8 0,16.3 4.7,32.8 4.7,16.5 14.4,34.1 h -16.7 q -11.6,-16.9 -17.3,-33.3 -5.6,-16.5 -5.6,-33.5 0,-17 5.6,-33.5 5.7,-16.6 17.3,-33.3 z"></path><path d="M 329.9,218 302.2,257.2 332.3,300 H 307.2 L 291.1,272.4 275.1,300 h -25 l 30.3,-42.8 -27.9,-39.3 h 25 l 13.6,24.5 13.7,-24.5 z"></path><path d="m 338.9,186.2 h 16.7 q 11.6,16.7 17.2,33.3 5.7,16.5 5.7,33.5 0,17.1 -5.6,33.5 -5.6,16.4 -17.3,33.3 h -16.7 q 9.7,-17.6 14.4,-34.1 4.7,-16.6 4.7,-32.8 0,-16.4 -4.7,-32.8 -4.7,-16.4 -14.4,-33.9 z"></path></g></g></g></svg>
            <h1>Calc</h1>
            <span id="fileLabel" class="file-label field-edit-text is-editable" data-i18n="ui.untitled" data-i18n-attr="title:text.clickRename"></span>
            <input id="fileNameInput" class="file-label-input field-edit" type="text" style="display:none" autocomplete="off">

            <!-- Phone only (see the phone block in the CSS below): "Aa" folds the
                 toolbar away, "⋮" holds the file buttons. wireStaticUI() moves the
                 toolbar's "?" in here too while the phone layout is on. -->
            <div id="topActions" class="topbar-actions">
                <button id="fmtBtn" class="icon-btn" type="button" aria-expanded="true" data-i18n-attr="title:calc.toolbar, aria-label:calc.toolbar">Aa</button>
                <button id="moreBtn" class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-attr="title:ui.moreOptions, aria-label:ui.moreOptions">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="12" cy="19" r="1.9"></circle></svg>
                </button>
            </div>

            <!-- Calc's two chromes, the way Calendar switches day / week / month:
                 two icon buttons in the header, the current one filled with the
                 accent. Tooltips only - a label here would push the file name off
                 a phone. -->
            <button id="chromeToolbarBtn" class="icon-btn chrome-btn" type="button" data-chrome="toolbar" data-i18n-attr="title:ui.chromeToolbar, aria-label:ui.chromeToolbar">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7.5" width="19" height="9" rx="2"></rect><rect x="5.2" y="10.4" width="3.2" height="3.2" rx="0.6" fill="currentColor" stroke="none"></rect><rect x="10.4" y="10.4" width="3.2" height="3.2" rx="0.6" fill="currentColor" stroke="none"></rect><rect x="15.6" y="10.4" width="3.2" height="3.2" rx="0.6" fill="currentColor" stroke="none"></rect></svg>
            </button>
            <button id="chromeMenusBtn" class="icon-btn chrome-btn" type="button" data-chrome="menus" data-i18n-attr="title:ui.chromeMenus, aria-label:ui.chromeMenus">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="5.5" x2="21" y2="5.5"></line><rect x="5.5" y="9.5" width="11" height="10.5" rx="1.6"></rect><line x1="8.2" y1="13.2" x2="13.8" y2="13.2" stroke-width="1.6"></line><line x1="8.2" y1="16.5" x2="13.8" y2="16.5" stroke-width="1.6"></line></svg>
            </button>

            <!-- "Guardado 12:04" (shared/office.js, AUTOSAVE). -->
            <span id="savedAt" class="saved-at"></span>

            <div id="syncIndicator" class="sync-indicator" data-i18n-attr="title:ui.sync.synced"></div>
        </div>

        <!-- Phone "⋮" menu. Built by wireStaticUI() from the real buttons in the
             toolbar (glyph + title cloned), and each entry just clicks the button
             it came from - so there is still ONE set of handlers. -->
        <div id="topMenu" class="top-menu" hidden></div>

        <!-- Ayuda menu - Estadísticas · Atajos de teclado · Botones de la barra.
             Built by wireStaticUI() from the real buttons in #helpTools, the
             same way as the "⋮" menu above. -->
        <div id="helpMenu" class="top-menu" hidden></div>

        <!-- The pull-down bar. Built and wired by shared/menubar.js from the
             MENUS table in the script below; empty (and hidden) in toolbar mode.
             In menu mode the name box moves in here, at the right end - it is the
             one toolbar control that has no menu entry, because you type into it. -->
        <div id="menuBar" role="menubar" hidden></div>

        <!-- Same left-to-right order as Write's toolbar, so a button shared by the
             two apps sits in the same place: font, letters, colours, table, insert,
             alignment + clear, undo / redo, help.

             Four runs of near-identical buttons sit in .popup cards below this
             file instead of on the bar - rows/columns, sort, alignment and
             freeze - each behind one .has-popup button here. The buttons in
             those cards are the real ones: same ids, same handlers, same
             "active" light (shared/office.js, groupPopup).

             The FILE buttons are not on the bar at all: they live in #fileTools
             below, hidden, and reach the user through the header's "..." menu -
             on a PC as much as on a phone. File last, as in Write. -->
        <div id="fmtToolbar">
            <select id="fmtFontFamily" class="tb-select fmt-select-font" data-i18n-attr="title:calc.fontFamily">
                <option value="">Calibri</option>
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="'Courier New'">Courier New</option>
                <option value="Verdana">Verdana</option>
            </select>
            <select id="fmtFontSize" class="tb-select fmt-select-narrow" data-i18n-attr="title:calc.fontSize">
                <option value="">11</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="14">14</option>
                <option value="16">16</option>
                <option value="18">18</option>
                <option value="20">20</option>
                <option value="24">24</option>
                <option value="28">28</option>
                <option value="36">36</option>
            </select>
            <div class="fmt-sep"></div>
            <button id="fmtBoldBtn" class="fmt-btn fmt-keep" data-i18n-attr="title:calc.bold">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M7.8 19c-.3 0-.5 0-.6-.2l-.2-.5V5.7c0-.2 0-.4.2-.5l.6-.2h5c1.5 0 2.7.3 3.5 1 .7.6 1.1 1.4 1.1 2.5a3 3 0 0 1-.6 1.9c-.4.6-1 1-1.6 1.2.4.1.9.3 1.3.6s.8.7 1 1.2c.4.4.5 1 .5 1.6 0 1.3-.4 2.3-1.3 3-.8.7-2.1 1-3.8 1H7.8Zm5-8.3c.6 0 1.2-.1 1.6-.5.4-.3.6-.7.6-1.3 0-1.1-.8-1.7-2.3-1.7H9.3v3.5h3.4Zm.5 6c.7 0 1.3-.1 1.7-.4.4-.4.6-.9.6-1.5s-.2-1-.7-1.4c-.4-.3-1-.4-2-.4H9.4v3.8h4Z"/></svg>
            </button>
            <button id="fmtItalicBtn" class="fmt-btn" data-i18n-attr="title:calc.italic">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="m16.7 4.7-.1.9h-.3c-.6 0-1 0-1.4.3-.3.3-.4.6-.5 1.1l-2.1 9.8v.6c0 .5.4.8 1.4.8h.2l-.2.8H8l.2-.8h.2c1.1 0 1.8-.5 2-1.5l2-9.8.1-.5c0-.6-.4-.8-1.4-.8h-.3l.2-.9h5.8Z"/></svg>
            </button>
            <button id="fmtUnderlineBtn" class="fmt-btn" data-i18n-attr="title:calc.underline">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M16 5c.6 0 1 .4 1 1v5.5a4 4 0 0 1-.4 1.8l-1 1.4a5.3 5.3 0 0 1-5.5 1 5 5 0 0 1-1.6-1c-.5-.4-.8-.9-1.1-1.4a4 4 0 0 1-.4-1.8V6c0-.6.4-1 1-1s1 .4 1 1v5.5c0 .3 0 .6.2 1l.6.7a3.3 3.3 0 0 0 2.2.8 3.4 3.4 0 0 0 2.2-.8c.3-.2.4-.5.6-.8l.2-.9V6c0-.6.4-1 1-1ZM8 17h8c.6 0 1 .4 1 1s-.4 1-1 1H8a1 1 0 0 1 0-2Z"/></svg>
            </button>
            <div class="fmt-sep"></div>
            <label class="fmt-color-btn" style="--fmt-bar:#E7E7E8" data-i18n-attr="title:calc.fontColor">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><g fill-rule="evenodd"><path class="fmt-color-bar" d="M3 18h18v3H3z"/><path d="M8.7 16h-.8a.5.5 0 0 1-.5-.6l2.7-9c.1-.3.3-.4.5-.4h2.8c.2 0 .4.1.5.4l2.7 9a.5.5 0 0 1-.5.6h-.8a.5.5 0 0 1-.4-.4l-.7-2.2c0-.3-.3-.4-.5-.4h-3.4c-.2 0-.4.1-.5.4l-.7 2.2c0 .3-.2.4-.4.4Zm2.6-7.6-.6 2a.5.5 0 0 0 .5.6h1.6a.5.5 0 0 0 .5-.6l-.6-2c0-.3-.3-.4-.5-.4h-.4c-.2 0-.4.1-.5.4Z"/></g></svg>
                <input id="fmtFontColor" type="color" value="#e7e7e8">
            </label>
            <label class="fmt-color-btn fmt-keep" style="--fmt-bar:#202124" data-i18n-attr="title:calc.fillColor">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><g fill-rule="evenodd"><path class="fmt-color-bar" d="M3 18h18v3H3z"/><path fill-rule="nonzero" d="M7.7 16.7H3l3.3-3.3-.7-.8L10.2 8l4 4.1-4 4.2c-.2.2-.6.2-.8 0l-.6-.7-1.1 1.1zm5-7.5L11 7.4l3-2.9a2 2 0 0 1 2.6 0L18 6c.7.7.7 2 0 2.7l-2.9 2.9-1.8-1.8-.5-.6"/></g></svg>
                <input id="fmtFillColor" type="color" value="#202124">
            </label>
            <div class="fmt-sep"></div>
            <button id="fmtTableBtn" class="fmt-btn has-popup" type="button" data-i18n-attr="title:calc.grpTable, aria-label:calc.grpTable">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="nonzero" d="M12 13c.5 0 1 .4 1 .9V16h2a1 1 0 0 1 .1 2H13v2a1 1 0 0 1-2 .1V18H9a1 1 0 0 1-.1-2H11v-2c0-.6.4-1 1-1Zm6 7a1 1 0 0 1 0-2h1v-6H5v6h1a1 1 0 0 1 0 2H4a1 1 0 0 1-1-1V6c0-1.1.9-2 2-2h14a2 2 0 0 1 2 2v13c0 .5-.4 1-.9 1H18ZM11 6H5v4h6V6Zm8 0h-6v4h6V6Z"/></svg>
            </button>
            <button id="fmtMergeBtn" class="fmt-btn" data-i18n-attr="title:calc.mergeCells">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8"></rect><rect x="13" y="3" width="8" height="8"></rect><rect x="3" y="13" width="18" height="8"></rect></svg>
            </button>
            <button id="fmtBorderBtn" class="fmt-btn fmt-keep" data-i18n-attr="title:calc.borders">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
            </button>
            <div class="fmt-sep"></div>
            <button id="fxBtn" class="fmt-btn fmt-keep" style="font-size: 1.05rem;" data-i18n-attr="title:calc.insertFx">&sum;</button>
            <button id="fmtSortBtn" class="fmt-btn has-popup" type="button" data-i18n-attr="title:calc.grpSort, aria-label:calc.grpSort">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="11" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><polyline points="17 8 20 5 20 19"></polyline><polyline points="17 8 20 5 23 8"></polyline></svg>
            </button>
            <div class="fmt-sep"></div>
            <button id="fmtAlignBtn" class="fmt-btn has-popup" type="button" data-i18n-attr="title:calc.grpAlign, aria-label:calc.grpAlign">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M5 5h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 1 1 0-2Zm0 4h8c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 1 1 0-2Zm0 8h8c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 0 1 0-2Zm0-4h14c.6 0 1 .4 1 1s-.4 1-1 1H5a1 1 0 0 1 0-2Z"/></svg>
            </button>
            <button id="fmtFreezeGrpBtn" class="fmt-btn has-popup" type="button" data-i18n-attr="title:calc.grpFreeze, aria-label:calc.grpFreeze">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"></rect><line x1="9" y1="3" x2="9" y2="21" stroke-width="3"></line></svg>
            </button>
            <select id="fmtNumFormat" class="tb-select fmt-select-numfmt fmt-keep" data-i18n-attr="title:calc.numFormat">
                <option value="general" data-i18n="calc.nfGeneral"></option>
                <option value="numero" data-i18n="calc.nfNumber"></option>
                <option value="moneda" data-i18n="calc.nfCurrency"></option>
                <option value="porcentaje" data-i18n="calc.nfPercent"></option>
                <option value="fecha" data-i18n="calc.nfDate"></option>
            </select>
            <button id="fmtClearBtn" class="fmt-btn" data-i18n-attr="title:calc.clearFormat">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path><line x1="5" y1="19" x2="19" y2="5"></line></svg>
            </button>
            <div class="fmt-sep"></div>
            <button id="undoBtn" class="fmt-btn fmt-keep" data-i18n-attr="title:ui.undo">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 8H12c3.7 0 6.2 2 6.8 5.1.6 2.7-.4 5.6-2.3 6.8a1 1 0 0 1-1-1.8c1.1-.6 1.8-2.7 1.4-4.6-.5-2.1-2.1-3.5-4.9-3.5H6.4l3.3 3.3a1 1 0 1 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 1.4L6.4 8Z" fill-rule="nonzero"/></svg>
            </button>

        <div id="helpTools" hidden>

        <div id="formulaRow">

        <div class="popup-row">
                <button id="fmtFreezeBtn" class="pop-btn" data-i18n-attr="title:calc.freezeCols">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"></rect><line x1="9" y1="3" x2="9" y2="21" stroke-width="3"></line></svg>
                </button>
                <button id="fmtFreezeRowBtn" class="pop-btn" data-i18n-attr="title:calc.freezeRows">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"></rect><line x1="3" y1="9" x2="21" y2="9" stroke-width="3"></line></svg>
                </button>
        </div>
    </div>

    <div id="borderPopup" class="popup" data-i18n-attr="aria-label:calc.borders">
        <div class="popup-row">
            <button type="button" class="pop-btn" data-pos="all" data-i18n-attr="title:calc.bAll">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-pos="outer" data-i18n-attr="title:calc.bOutline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21" opacity="0.25"></line><line x1="3" y1="12" x2="21" y2="12" opacity="0.25"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-pos="inner" data-i18n-attr="title:calc.bInner">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" opacity="0.25"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-pos="none" data-i18n-attr="title:calc.bNone">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" opacity="0.4"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></svg>
            </button>
        </div>
        <div class="popup-row">
            <button type="button" class="pop-btn" data-pos="top" data-i18n-attr="title:calc.bTop">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><g opacity="0.25"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></g><line x1="3" y1="3" x2="21" y2="3"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-pos="bottom" data-i18n-attr="title:calc.bBottom">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><g opacity="0.25"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></g><line x1="3" y1="21" x2="21" y2="21"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-pos="left" data-i18n-attr="title:calc.bLeft">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><g opacity="0.25"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></g><line x1="3" y1="3" x2="3" y2="21"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-pos="right" data-i18n-attr="title:calc.bRight">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><g opacity="0.25"><rect x="3" y="3" width="18" height="18"></rect><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line></g><line x1="21" y1="3" x2="21" y2="21"></line></svg>
            </button>
        </div>
        <div class="popup-row popup-row-sep">
            <button type="button" class="pop-btn" data-weight="thin" data-i18n-attr="title:calc.bThin">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="12" x2="21" y2="12"></line></svg>
            </button>
            <button type="button" class="pop-btn" data-weight="medium" data-i18n-attr="title:calc.bMedium">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="10" width="18" height="4" rx="1"></rect></svg>
            </button>
            <label class="pop-btn" id="borderColorLabel" data-i18n-attr="title:calc.bColor">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><g fill-rule="evenodd"><path class="pop-color-bar" d="M3 18h18v3H3z"></path><path fill-rule="nonzero" d="M7.7 16.7H3l3.3-3.3-.7-.8L10.2 8l4 4.1-4 4.2c-.2.2-.6.2-.8 0l-.6-.7-1.1 1.1zm5-7.5L11 7.4l3-2.9a2 2 0 0 1 2.6 0L18 6c.7.7.7 2 0 2.7l-2.9 2.9-1.8-1.8-.5-.6"></path></g></svg>
                <input type="color" id="borderColor" value="#8b8e93">
            </label>
        </div>
    </div>

    <!-- Number-format dialog — one per non-"General" category, fields adapt to the category -->
    <div id="numFmtBackdrop" class="sheet-backdrop">
        <div class="sheet">
            <h2 id="numFmtTitle" data-i18n="calc.numFormat"></h2>

            <div class="field" data-nf="numero moneda porcentaje">
                <label for="nfDecimals" data-i18n="calc.decimals"></label>
                <select id="nfDecimals">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="6">6</option>
                    <option value="8">8</option>
                    <option value="10">10</option>
                </select>
            </div>

            <div class="field" data-nf="numero moneda">
                <label class="check"><input type="checkbox" id="nfThousands" checked> <span data-i18n="calc.thousands"></span></label>
            </div>

            <div class="field" data-nf="numero moneda">
                <label class="check"><input type="checkbox" id="nfRedNeg"> <span data-i18n="calc.redNegatives"></span></label>
            </div>

            <div class="field" data-nf="moneda">
                <label for="nfCurrency" data-i18n="calc.currencySymbol"></label>
                <input type="text" id="nfCurrency" value="€" autocomplete="off" maxlength="4">
            </div>

            <div class="field" data-nf="moneda">
                <label for="nfCurrencyPos" data-i18n="calc.symbolPosition"></label>
                <select id="nfCurrencyPos">
                    <option value="after" data-i18n="calc.symbolAfter"></option>
                    <option value="before" data-i18n="calc.symbolBefore"></option>
                </select>
            </div>

            <div class="field" data-nf="fecha">
                <label for="nfDatePattern" data-i18n="calc.pattern"></label>
                <select id="nfDatePattern">
                    <option value="yyyy-mm-dd">2026-12-31</option>
                    <option value="yyyy-mm-dd hh:mm">2026-12-31 14:30</option>
                    <option value="dd/mm/yyyy">31/12/2026</option>
                    <option value="d/m/yy">31/12/26</option>
                    <option value="dd/mm/yyyy hh:mm">31/12/2026 14:30</option>
                    <option value="hh:mm">14:30</option>
                    <option value="hh:mm:ss">14:30:00</option>
                </select>
            </div>

            <div class="field">
                <label data-i18n="calc.preview"></label>
                <div id="nfPreview" class="nf-preview">-1234.56</div>
            </div>

            <div class="sheet-actions">
                <button id="numFmtCloseBtn"   data-act="close" data-i18n-attr="title:ui.close"></button>
                <button id="numFmtConfirmBtn" data-act="primary" data-i18n-attr="title:calc.apply"></button>
            </div>
        </div>
    </div>

    <!-- Bottom-centre transient toast (shared .toast styling from theme.css) -->
    <!-- The pull-down panels: one for an open menu, one for its submenu.
         .top-menu gives them the card and shadow (shared/app.css). -->
    <div id="menuPanel" class="top-menu menu-panel" role="menu" hidden></div>
    <div id="menuSub"   class="top-menu menu-panel" role="menu" hidden></div>

    <div id="toast" class="toast"></div>

    <script type="module" src="calc.js"></script>
</body>
</html>
