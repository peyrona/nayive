    <!-- What the three editors share: paths, the file label, the Open browser, the phone menu. -->

    <script>
    NayiveI18n.ready.then( function () {
        if( ! window.NayiveUI ) return;
        NayiveUI.firstRun( {
            app:   'calc',
            title: 'Calc',
            lead:  NayiveUI.t( 'calc.introLead' ),
            buttons: [
                { sel: '#chromeMenusBtn', text: NayiveUI.t( 'calc.chromeNote' ) },
                { sel: '#fmtBtn',       text: NayiveUI.t( 'calc.introToolbar' ) },
                { sel: '#moreBtn',      text: NayiveUI.t( 'calc.introFileMenu' ) },
                { sel: '#moreToolsBtn', text: NayiveUI.t( 'calc.introMoreBar' ) },
                { sel: '#importBtn', text: NayiveUI.t( 'calc.introImport' ) },
                { sel: '#openBtn',   text: NayiveUI.t( 'calc.introOpen' ) },
                { sel: '#saveAsBtn', text: NayiveUI.t( 'calc.introSaveAs' ) },
                { sel: '#undoBtn',   text: NayiveUI.t( 'calc.introUndo' ) },
                { sel: '#redoBtn',   text: NayiveUI.t( 'calc.introRedo' ) },
                { sel: '#fxBtn',     text: NayiveUI.t( 'calc.introFx' ) },
                { sel: '#insRowBtn', name: NayiveUI.t( 'calc.introRowsColsName' ), text: NayiveUI.t( 'calc.introRowsCols' ) },
                { sel: '#fmtBoldBtn', name: NayiveUI.t( 'calc.introFormatName' ), text: NayiveUI.t( 'calc.introFormat' ) }
            ]
        } );
    } );

    <style>
        /* A spreadsheet needs the grid, its headers and the surrounding chrome to sit on
           clearly different surfaces. The shared palette's neutral tokens (--bg / --card /
           --card2) are only a few percent apart — fine for a card layout, too flat for a
           dense grid, and worst in the light (beige) scheme where the whole screen ended up
           one colour. So calc derives its own surfaces from those tokens. They are
           color-mix()es of the shared tokens, not fixed values, so a custom colour scheme
           still shifts them. */
        :root
        {
            --calc-paper:      var(--bg);                                            /* cell background   */
            --calc-chrome:     var(--card);                                          /* the two toolbars  */
            --calc-header:     var(--card2);                                         /* row / col headers */
            --calc-header-hi:  color-mix(in srgb, var(--accent) 22%, var(--card2));  /* selected header   */
            --calc-grid-line:  var(--line);
        }
        :root[data-theme="light"]
        {
            --calc-paper:      color-mix(in srgb, var(--card2) 60%, #FFFFFF);        /* near-white paper  */
            --calc-chrome:     var(--card);
            --calc-header:     color-mix(in srgb, var(--card) 72%, var(--line));     /* tan, frames grid  */
            --calc-header-hi:  color-mix(in srgb, var(--accent) 18%, var(--card));
            --calc-grid-line:  color-mix(in srgb, var(--line) 38%, var(--card2));    /* soft tan rules    */
        }

        /* Handsontable v18's theme is built on CSS custom properties — the semantic tokens
           below are redeclared to calc's surfaces so the grid follows the shared colour
           scheme. Applied to both HT theme classes: the JS swaps the class (…-main-dark /
           …-main) on theme change so HT's own light-dark() internals resolve too. */
        .ht-theme-main-dark, .ht-theme-main
        {
            --ht-background-color: var(--calc-paper);
            --ht-background-secondary-color: var(--calc-chrome);
            --ht-foreground-color: var(--text);
            --ht-foreground-secondary-color: var(--text-dim);
            --ht-border-color: var(--calc-grid-line);
            --ht-accent-color: var(--accent);
            --ht-header-background-color: var(--calc-header);
            --ht-header-foreground-color: var(--text-dim);
            --ht-header-highlighted-background-color: var(--calc-header-hi);
            --ht-header-highlighted-foreground-color: var(--text);
            /* Row headers (1, 2, 3…) carry their own token set in HT's theme; left alone
               they keep the defaults — --calc-chrome background, full-strength text, a
               fixed grey highlight — so the row strip looks unlike the column strip.
               Mirror every column-header token onto its row-header twin. */
            --ht-header-row-background-color: var(--calc-header);
            --ht-header-row-foreground-color: var(--text-dim);
            --ht-header-row-highlighted-background-color: var(--calc-header-hi);
            --ht-header-row-highlighted-foreground-color: var(--text);
            --ht-row-header-even-background-color: var(--calc-header);
            --ht-row-header-odd-background-color: var(--calc-header);
            --ht-cell-selection-background-color: color-mix(in srgb, var(--accent) 22%, transparent);
            --ht-cell-selection-border-color: var(--accent);
            --ht-cell-editor-background-color: var(--calc-paper);
            --ht-cell-editor-foreground-color: var(--text);
            --ht-cell-editor-border-color: var(--accent);
        }

        #gridHost.ht-theme-main-dark, #gridHost.ht-theme-main { background-color: var(--calc-paper); }

        /* "Select all" affordance in the row-0 / col-0 corner cell. Clicking that cell
           already selects the whole sheet (Handsontable default); this is just the visual
           cue for it — a small lower-right triangle, the mark Sheets/Excel use. The glyph
           is pointer-transparent so the click still lands on the <th>. */
        #gridHost .ht_clone_top_inline_start_corner thead th { position: relative; cursor: pointer; }
        #gridHost .ht_clone_top_inline_start_corner thead th::after
        {
            content: ""; position: absolute; right: 1px; bottom: 1px;
            width: 0; height: 0; pointer-events: none;
            border-bottom: 8px solid var(--text-dim);
            border-left: 8px solid transparent;
            transition: border-bottom-color 0.12s ease;
        }
        #gridHost .ht_clone_top_inline_start_corner thead th:hover::after { border-bottom-color: var(--accent); }

        /* Base reset, .app shell, .topbar, .icon-btn, .sheet, .field and the
           input look all come from ../shared/app.css. Calc overrides the page
           scroll and adds its chrome + the hand-built formatting toolbar. */
        html, body { height: 100%; overflow: hidden; }

        .topbar { background: var(--calc-chrome); }

        .sync-indicator { margin-left: 4px; }   /* base rule + states in ../shared/theme.css */

        /* Formatting toolbar — Handsontable's free tier has no built-in cell-formatting UI
           (only alignment ships free in its context menu), so bold/colors are hand-built here. */
        /* It WRAPS, at every width: a button that does not fit goes to the next
           row. Never a horizontal scrollbar - a tool you have to scroll sideways
           to reach is a tool you do not know is there. The grid takes whatever
           height is left (#gridHost is the flex child that grows). */
        #fmtToolbar
        {
            display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
            padding: 4px 10px; background: var(--calc-chrome);
            border-bottom: 1px solid var(--line); flex: 0 0 auto;
            overflow-x: visible;
        }
        #fmtToolbar .fmt-sep { width: 1px; align-self: stretch; margin: 4px 6px; background: var(--line); flex: 0 0 auto; }
        /* Toolbar buttons: a distinct component from the header .icon-btn - 30px
           rounded squares with an accent-tinted hover (they act on the cells). */
        .fmt-btn, .fmt-color-btn
        {
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px; flex: 0 0 auto;
            border-radius: var(--radius-s); border: none; background: transparent; color: var(--text-dim);
            cursor: pointer; padding: 0; font-weight: 700; font-size: 0.95rem; font-family: inherit;
        }
        .fmt-btn:hover, .fmt-color-btn:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
        .fmt-btn.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--text); }
        .fmt-btn.is-active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--text); }
        /* Text/fill colour buttons — the same TinyMCE 'text-color' / 'highlight-bg-color'
           glyphs the Write app shows; the bar under each glyph tracks the current colour.
           The real <input type=color> is visually hidden but still opened by a click
           anywhere on the label — kept out of .fmt-btn so its mousedown isn't cancelled. */
        .fmt-color-btn { position: relative; }
        .fmt-color-btn .fmt-color-bar { fill: var(--fmt-bar, currentColor); }
        .fmt-color-btn input[type=color]
        {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
            border: 0; opacity: 0; overflow: hidden; clip: rect(0 0 0 0);
        }
        /* The three format drop-downs are .tb-select (TOOLBAR SELECT in app.css),
           the same control Text's editor bar uses. Only their widths are Calc's. */
        .fmt-select-narrow { width: 52px; }
        .fmt-select-font { width: 104px; }
        .fmt-select-numfmt { width: 92px; }

        /* The bottom bar: sheet tabs on the left, the selection's totals on the
           right — the one place a spreadsheet is allowed chrome below the grid.
           Always present; the tab strip inside it only appears with 2+ sheets. */
        #statusBar
        {
            display: flex; align-items: stretch; gap: 8px;
            background: var(--calc-chrome); border-top: 1px solid var(--line);
            flex: 0 0 auto; min-height: 26px;
        }
        #sheetTabs
        {
            display: flex; align-items: stretch; gap: 2px;
            padding: 3px 8px; flex: 1 1 auto; overflow-x: auto; min-width: 0;
        }
        #sheetTabs[hidden] { display: none; }
        /* With no tabs the totals still sit on the right of the bar. */
        #sheetTabs[hidden] + #selStats { margin-left: auto; }
        #selStats
        {
            display: flex; align-items: center; gap: 14px;
            padding: 3px 12px; flex: 0 0 auto;
            color: var(--text-dim); font-size: 0.8rem; white-space: nowrap;
        }
        #selStats b { color: var(--text); font-weight: 600; }
        #selStats:empty { display: none; }
        .sheet-tab
        {
            flex: 0 0 auto; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            padding: 5px 12px; border: none; border-radius: var(--radius-s) var(--radius-s) 0 0;
            background: transparent; color: var(--text-dim);
            font-family: inherit; font-size: 0.85rem; cursor: pointer;
        }
        .sheet-tab:hover   { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--text); }
        .sheet-tab.is-active
        {
            background: var(--calc-paper); color: var(--text); font-weight: 600;
            box-shadow: inset 0 2px 0 var(--accent);
        }

        /* Name box — the "A1" at the head of the toolbar. Types a reference and
           jumps to it, so a big sheet does not have to be scrolled by hand. */
        #nameBox
        {
            width: 88px; flex: 0 0 auto; height: 30px;
            padding: 0 8px; border-radius: var(--radius-s);
            border: 1px solid var(--line); background: var(--calc-paper); color: var(--text);
            font-family: inherit; font-size: 0.85rem; text-align: center;
        }
        #nameBox:focus { outline: none; border-color: var(--accent); }

        /* A linked cell. The underline says "link"; the colour is the accent so it
           reads as one in either scheme. Ctrl/Cmd-click follows it — a plain click
           still selects and edits the cell, which is what a spreadsheet must do. */
        #gridHost td.has-link { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

        /* The cells a formula being typed points at (POINTING in the script).
           Inset shadows, because the renderer owns the inline background and
           borders - a shadow sits on top of both without touching either. */
        #gridHost td.pt
        {
            box-shadow: inset 0 var(--pt-t, 0px) 0 var(--accent),
                        inset calc(-1 * var(--pt-r, 0px)) 0 0 var(--accent),
                        inset 0 calc(-1 * var(--pt-b, 0px)) 0 var(--accent),
                        inset var(--pt-l, 0px) 0 0 var(--accent),
                        inset 0 0 0 999px color-mix(in srgb, var(--accent) 12%, transparent);
        }
        #gridHost td.pt-t { --pt-t: 2px; }
        #gridHost td.pt-b { --pt-b: 2px; }
        #gridHost td.pt-l { --pt-l: 2px; }
        #gridHost td.pt-r { --pt-r: 2px; }

        /* Grid host */
        #gridHost { flex: 1 1 auto; min-height: 0; overflow: hidden; }   /* Handsontable virtualizes its own scroll */

        /* Phone (see TWO LAYOUT MODES in shared/app.css): the toolbar wraps onto
           more rows instead of scrolling sideways - a scrolling bar hides half its
           buttons with no hint they exist - and its buttons grow to finger size. */
        /* ---- Phone-only header controls ------------------------------------
           Both live in the .topbar-actions group and only show at <=640px.
             "Aa"  #fmtBtn   - folds the toolbar away while you type.
             "⋮"   #moreBtn  - the file buttons, which leave the toolbar.
           #fmtBtn is a TEXT button, not an icon one: "Aa" says "formato" at a
           glance. (Note it is the HEADER toggle - not one of the .fmt-btn
           toolbar buttons, in spite of the name.) .is-active (shared app.css)
           marks it while the toolbar is showing. */
        #fmtBtn, #moreBtn { display: none; }
        #fmtBtn
        {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        /* The "⋮" menu: .top-menu / .menu-item from app.css, anchored by shared/ui.js. */

        /* The toolbar's own "⋮": opens the rest of it in place. Phone only, and
           last in the DOM so it is last in the row. */
        #moreToolsBtn { display: none; }
        #moreToolsBtn[aria-expanded="true"] { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--text); }

        /* ---- MENU MODE (see PULL-DOWN MENUS in the script) -------------------
           The user picks ONE chrome: the icon toolbar, or the classic
           "Archivo · Edición · Ver …" bar. #menuBar, .menu-top and .menu-panel
           are styled once in shared/app.css; what belongs to Calc is only what
           has to disappear.

           The toolbar collapses to height 0 with visibility:hidden - never
           display:none. The menu entries WORK BY CLICKING THOSE VERY BUTTONS, so
           they have to stay in the layout; a display:none button delivers no
           click, and the two <select>s and the colour pickers could not be set.

           "Aa" folds a row that is already gone and "⋮" repeats the Archivo
           menu, so both come off the header here. */
        #app.is-menus #fmtToolbar
        {
            height: 0; min-height: 0; padding-top: 0; padding-bottom: 0;
            overflow: hidden; border-bottom-width: 0; visibility: hidden;
        }
        #app.is-menus #fmtBtn,
        #app.is-menus #moreBtn { display: none; }

        /* The name box is the one control with no menu entry - you type a cell
           into it. In menu mode it rides at the right end of the menu bar, where
           Excel's own name box has always been within reach. */
        #menuBar #nameBox { margin-left: auto; visibility: visible; }

        /* Phone (see TWO LAYOUT MODES in shared/app.css): the toolbar was FOUR
           rows - 159px, a fifth of the screen before the keyboard is even up.
           Now it is ONE row that folds away.
             - the row keeps the seven controls a phone actually reaches for
               (the .fmt-keep ones, listed in the markup); everything else waits
               behind "⋮" (#moreToolsBtn), which opens the WHOLE toolbar in place
               and closes again. Chosen by how often a thing is used, not by
               where it sits in the bar. Rows, columns, merge and freeze are
               safe back there: a long press on the grid opens Handsontable's
               own menu with all of them.
             - the file buttons (import / open / save-as) move to the header's
               "⋮" menu, and the "?" is MOVED into the header by wireStaticUI()
               so help stays reachable while the toolbar is folded (one single
               [data-intro-open] on the page - a second copy would misdirect
               the coach marks).
             - #fmtBtn ("Aa") folds / unfolds; the toolbar also folds itself the
               moment a cell editor opens, which is when the keyboard arrives. */
        @media (max-width: 640px)
        {
            #fmtBtn, #moreBtn { display: flex; }
            #moreToolsBtn     { display: inline-flex; }

            #fmtToolbar { padding: 4px 2px; }
            #fmtToolbar .fmt-sep { margin: 4px 2px; }
            .fmt-btn, .fmt-color-btn { width: 36px; height: 36px; }

            /* Collapsed: only the favourites (the .fmt-keep ones). They wrap like
               everything else - nine controls do not fit on one 360px line, and
               a row that cannot wrap would simply hide the last of them (the
               page clips, it does not scroll). Two short rows, and the whole
               strip still folds away the moment you type. */
            #fmtToolbar:not(.is-open) > :not(.fmt-keep) { display: none; }

            /* Folded away while you type. */
            #fmtToolbar.is-folded
            {
                height: 0; min-height: 0; padding-top: 0; padding-bottom: 0;
                overflow: hidden; border-bottom-width: 0; visibility: hidden;
            }
        }

        /* ---- WHAT FLOATS OVER THE GRID ------------------------------------
           Handsontable paints the frozen headers as separate CLONE layers, and
           they climb high: row numbers 120, the bottom pair 130 / 150, the
           column letters 160, the top-left corner 180 - and its move / resize
           guides reach 210. Every one of them beats the shared overlays
           (menu 150, sheet 100, popup / toast 200, coach 300), so anything of
           ours that opens over the grid has to be lifted clear of 210. Same
           order as app.css, just moved up.

             .top-menu   the "⋮" popup AND the pull-down panels (#menuPanel,
                         #menuSub). At 150 a panel was drawn BEHIND A, B, C.
             others      a dialog reaching the row-number column had its left
                         edge covered on a phone. */
        .top-menu              { z-index: 400; }
        .sheet-backdrop        { z-index: 500; }
        .info-popup, .toast    { z-index: 600; }
        .coach-overlay         { z-index: 700; }

        .fx-list { max-height: 320px; overflow-y: auto; margin-bottom: 14px; }

        /* The loss gate's bullet list. Plain text, no icons — the point is that
           the user reads every line before deciding. */
        .lossy-list { margin: 0 0 14px; padding-left: 20px; max-height: 260px; overflow-y: auto; }
        .lossy-list li { margin: 3px 0; color: var(--text); line-height: 1.45; }
        .fx-item
        {
            display: block; width: 100%; text-align: left; padding: 8px 12px;
            border: none; background: transparent;
            color: var(--text); cursor: pointer; font-family: inherit; font-size: 0.88rem;
        }
        .fx-item:hover { background: color-mix(in srgb, var(--text) 9%, transparent); }
        .fx-item b { color: var(--accent); }
        .fx-item span { display: block; font-size: 0.76rem; color: var(--text-dim); margin-top: 2px; }
        .fx-empty { padding: 12px; font-size: 0.85rem; color: var(--text-dim); text-align: center; }

        /* Open dialog: .open-crumb / .open-list from app.css; the file label too. */

        /* Anchored popup (border picker) — floats over the grid, not a modal */
        .popup
        {
            position: fixed; z-index: 200; display: none;
            background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-m);
            padding: 6px; box-shadow: var(--elev-dialog);
        }
        .popup.open { display: block; }
        .popup-row { display: flex; gap: 2px; }
        .popup-row + .popup-row { margin-top: 2px; }
        .popup-row-sep { margin-top: 5px; padding-top: 6px; border-top: 1px solid var(--line); }
        .pop-btn
        {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; flex: 0 0 auto; position: relative;
            border-radius: var(--radius-s); border: none; background: transparent; color: var(--text-dim);
            cursor: pointer; padding: 0;
        }
        .pop-btn:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
        .pop-btn.active { background: color-mix(in srgb, var(--accent) 24%, transparent); color: var(--text); }
        .pop-btn input[type=color]
        {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
            border: 0; opacity: 0; overflow: hidden; clip: rect(0 0 0 0);
        }
        .pop-color-bar { fill: var(--border-bar, var(--text-dim)); }

        /* Checkbox rows in the number-format dialog */
        .field label.check
        {
            display: flex; align-items: center; gap: 8px; margin-bottom: 0;
            font-size: 0.9rem; color: var(--text); cursor: pointer;
        }
        .field label.check input { width: auto; }

        .nf-preview
        {
            padding: 10px 11px; border: 1px dashed var(--line); border-radius: var(--radius-s);
            background: var(--card2); color: var(--text); font-family: var(--font-mono);
        }

        /* Right-click context menu. HT renders it as its own themed Handsontable on <body>;
           the .ht-theme-* token block near the top of this sheet already colours it. Each
           row's glyph is injected by cmItem() (see the script) into .htItemWrapper. */
        .htContextMenu .cm-ico
        {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; margin-right: 10px; vertical-align: -3px;
            flex: 0 0 auto; color: var(--text-dim);
        }
        .htContextMenu .cm-ico svg { width: 16px; height: 16px; display: block; }

        /* A custom renderer makes HT tag the cell .htCustomMenuRenderer, which its own
           stylesheet then excludes from the hover / keyboard-current / pointer styling.
           Restore all three so an icon'd row still behaves like a normal menu item. */
        .htContextMenu .ht_master td.htCustomMenuRenderer:not(.htDisabled) { cursor: pointer; }
        .htContextMenu td.htCustomMenuRenderer:not(.htDisabled):hover
        {
            background: color-mix(in srgb, var(--accent) 14%, transparent) !important;
        }
        .htContextMenu td.htCustomMenuRenderer:not(.htDisabled):hover .cm-ico { color: var(--text); }
        .htContextMenu td.htCustomMenuRenderer.current:not([aria-expanded="true"]):not(.htDisabled)
        {
            box-shadow: inset 0 0 0 1px var(--accent);
        }
        .htContextMenu td.htCustomMenuRenderer.htDisabled .cm-ico { opacity: 0.45; }
    </style>

    <script type="module">
        // Nothing is drawn from JS before the dictionary is in: without an
        // in-source fallback, an early render would paint the bare keys.
        await NayiveI18n.ready;

        import
        {
            read, write, createWorkbook, appendSheet,
            decodeRange, encodeRange, encodeCell, decodeCell,
            formatNumber
        }
        from './lib/xlsx-format_v2.4.1.js';

        //------------------------------------------------------------------------//
        // STATE

        // Folder for "Guardar como". Drive opens Calc with ?dir=<folder> so a new
        // sheet saves in the folder the user is in; from the launcher (no ?dir=)
        // it defaults to the user's files/ root.
        const O = NayiveOffice;   // paths, the file label, the Open browser (../shared/office.js)

        // Folder for "Guardar como": Drive's ?dir=<folder>, else the files/ root.
        const APP_DIR = O.appDirFromUrl();

        // Extensions the "Abrir documento" browser shows. xlsx / csv open
        // straight away; a file in CONVERT_EXTS (LibreOffice Calc .ods, legacy
        // .xls, …) would be converted to .xlsx on the server first — that isn't
        // wired up yet, so CONVERT_EXTS is empty and only the two appear.
        const OPEN_EXTS     = [ 'xlsx', 'csv' ];
        const CONVERT_EXTS  = [];
        const OPENABLE_EXTS = OPEN_EXTS.concat( CONVERT_EXTS );

        // The browser never walks above the user's files/ root (the first path
        // segment of APP_DIR — "files" when Calc is opened from the launcher).
        const OPEN_ROOT = APP_DIR.split( '/' )[ 0 ] || 'files';

        const AUTOSAVE_DELAY_MS = 2500;

        // Sample serial (2026-12-31 14:30) for the number-format dialog's live preview.
        const NF_SAMPLE_DATE = Math.round( ( Date.UTC( 2026, 11, 31 ) - Date.UTC( 1899, 11, 30 ) ) / 86400000 ) + 14.5 / 24;

        let currentPath   = null;   // path relative to the file-manager root, or null = untitled
        // True when the open sheet belongs to another user (a "shared/..." path):
        // read it, never write it. Autosave is off and "Guardar" becomes
        // "Guardar como", into a file of our own.
        let readOnly      = false;
        let pendingName   = null;   // name typed/imported before the first save (no currentPath yet)
        let table          = null;  // Handsontable instance

        //--------------------------------------------------------------------//
        // THE OPEN WORKBOOK
        //
        // Everything that has to survive a save lives on a SHEET ENTRY, never as
        // a loose global: the file is rewritten from scratch on every autosave,
        // so anything the model does not carry is destroyed the moment the user
        // types. Widths, heights, frozen panes, hidden rows/cols, comments and
        // the untouched xlsx parts all hang off the same entry, and a second
        // sheet is just a second entry — add a FIELD here, not a new global.
        //
        // `activeSheet` is the entry the grid is currently showing. It is
        // re-pointed in exactly one place (setActiveSheet), so the sheet tabs
        // will have nothing new to wire up.

        function newSheet( name )
        {
            return {
                name       : name || 'Hoja1',
                data       : [ [ '' ] ],
                cellStyles : {},                 // { "A1": {bold,size,color,bg,align,…} }
                merges     : [],                 // [{row,col,rowspan,colspan}, …]
                cols       : [],                 // px widths,  sparse by column index
                rows       : [],                 // px heights, sparse by row index
                // The file's own units, kept so an untouched column is written back
                // byte-identical instead of drifting a little on every save. Cleared
                // for a column/row the moment the user drags its edge.
                colsSrc    : [],                 // Excel character widths
                rowsSrc    : [],                 // points
                autofilter : null,               // { ref } — the filter buttons' range
                margins    : null,               // page margins, for printing
                hidden     : 0,                  // 0 visible, 1 hidden, 2 very hidden
                freeze     : { rows: 0, cols: 0 },
                hiddenRows : [],
                hiddenCols : [],
                comments   : {},                 // { "A1": "text" }
                links      : {},                 // { "A1": { target, tooltip } }
                raw        : null                // xlsx fragments Calc cannot model, kept verbatim
            };
        }

        function newDoc()
        {
            return {
                sheets   : [ newSheet() ],
                active   : 0,
                names    : null,     // workbook-level defined names (cross-sheet ranges)
                lossy    : [],       // what THIS file has that a save would destroy
                lossyAck : false,    // the user chose "continue anyway" for this file
                srcZip   : null      // the bytes we opened, for the parts we cannot rebuild
            };
        }

        let doc         = newDoc();
        let activeSheet = doc.sheets[ 0 ];

        // True only while initGrid is drawing a sheet. Handsontable reports the work
        // of loading a file — padding the grid out to minRows/minCols, attaching the
        // notes a file carried — through the same hooks a real edit uses, and some of
        // them (afterSetCellMeta) carry no `source` to tell the two apart. Without
        // this, opening a file with a comment in it scheduled a save of that file.
        let gridBooting = false;

        function setActiveSheet( i )
        {
            doc.active  = i;
            activeSheet = doc.sheets[ i ];
        }
        let nfCategory     = null;   // number-format category the numFmt dialog is currently editing
        let borderWeight     = 'thin';   // sticky border-popup choices
        let borderColorValue = '8B8E93';
        let autosaveTimer  = null;

        // Offline-capable persistence (../shared/store.js), same as Write. Every
        // save lands in a local IndexedDB cache and a write outbox BEFORE the PUT
        // is attempted, so a caducated session or a dropped connection can no
        // longer lose the sheet: it goes up on the next flush (reconnect, tab
        // focus, or right after signing in again). binary:true - the bodies here
        // are .xlsx/.ods bytes, not text.
        // Interface strings: every one of them lives in shared/i18n/*.json.
        const T  = k           => NayiveUI.t( k );
        const TF = ( k, vars ) => NayiveUI.tf( k, vars );

        const store = NayiveStore.createStore( { apiBase: GumApi.API_FILES, binary: true } );

        // The name in the top bar (click to rename) and the Open browser: shared
        // widgets, this app only supplies the policy (see commitRename / openPickedFile).
        const fileLabel = O.fileLabel( { onCommit: commitRename } );
        const browser   = O.openBrowser( { root: OPEN_ROOT, canOpen: isOpenable, onOpen: openPickedFile,
                                           emptyKey: 'calc.noSheets' } );

        // "Guardar como" asks where the sheet goes: a first save must never
        // guess the folder. Shared widget, this app only supplies the default.
        const dirField  = O.folderField();

        // The header plug: store states straight from store.onState, plus the
        // app's own 'saving' / 'error' moments (a rename in flight, a bad encode).
        const setSyncStatus = NayiveUI.syncIndicator();

        //--------------------------------------------------------------------//
        // PHONE CHROME  (see the phone block in the CSS above)
        //
        // Two moves, both phone-only: the toolbar is ONE row of favourites with a
        // "⋮" that opens the rest in place, and the whole strip folds away the
        // moment a cell editor opens (the keyboard is about to take half the
        // screen). The header's "Aa" brings it back. The file buttons move to the
        // header's "⋮" menu, built from the real buttons by shared/office.js.

        const PHONE = window.matchMedia( '(max-width: 640px)' );

        const fileMenu = O.fileMenu( { btn: 'moreBtn', menu: 'topMenu', ids: [ 'importBtn', 'openBtn', 'saveAsBtn' ] } );

        // Folding sets height:0 rather than display:none - Handsontable sizes
        // itself to the space left over and re-renders on resize either way.
        const fold = O.foldingToolbar( { toolbar: 'fmtToolbar', afterChange: function() { if( table ) table.refreshDimensions(); } } );

        // Once at start-up and again whenever the phone is turned. The split
        // itself is pure CSS, so this only does what CSS cannot: move the "?",
        // close the menus, unfold.
        function applyPhoneChrome()
        {
            // The "?" moves to the header on a phone, where the toolbar folds away
            // while you type - but NEVER in menu mode: the Ayuda menu is right
            // there, and one "?" in two places at once is one too many. (The
            // coach marks skip a "?" they cannot see and try again later, so
            // hiding it costs nothing - shared/ui.js, coachTargets.)
            const headerHelp = PHONE.matches && ! CHROME.on();

            O.placeHelpButton( headerHelp, 'topActions', 'fmtToolbar', 'moreToolsBtn', 'syncIndicator' );
            fileMenu.close();
            fold.setMore( false );
            if( ! PHONE.matches ) fold.setOpen( true );
        }

        function wireStaticUI()
        {
            registerUiLocale();

            // ---- phone chrome (see PHONE CHROME above) ----
            applyPhoneChrome();
            PHONE.addEventListener( 'change', applyPhoneChrome );

            document.getElementById( 'importBtn'        ).addEventListener( 'click', function() { document.getElementById( 'importInput' ).click(); } );
            document.getElementById( 'importInput'      ).addEventListener( 'change', function( e ) { handleImportFile( e.target.files[0] ); e.target.value = ''; } );
            document.getElementById( 'openBtn'          ).addEventListener( 'click', function() { browser.open( APP_DIR ); } );
            document.getElementById( 'saveAsBtn'        ).addEventListener( 'click', openSaveAs );
            document.getElementById( 'saveAsConfirmBtn' ).addEventListener( 'click', confirmSaveAs );
            document.getElementById( 'saveName'         ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) confirmSaveAs(); } );
            // The dialogs' × buttons and Escape are wired once for every app by shared/ui.js.

            // Border popup: position buttons are actions; weight/colour are sticky mode choices.
            document.getElementById( 'borderPopup' ).addEventListener( 'mousedown', function( e )
            {
                if( ! e.target.closest( '#borderColorLabel' ) ) e.preventDefault();   // keep the grid selection; let the colour picker open
            });
            document.getElementById( 'borderPopup' ).addEventListener( 'click', function( e )
            {
                const posBtn = e.target.closest( '[data-pos]' );
                if( posBtn ) { applyBorder( posBtn.dataset.pos ); return; }

                const wBtn = e.target.closest( '[data-weight]' );
                if( wBtn ) { borderWeight = wBtn.dataset.weight; syncBorderPopupState(); }
            });
            document.getElementById( 'borderColor' ).addEventListener( 'input', function( e )
            {
                borderColorValue = e.target.value.replace( '#', '' ).toUpperCase();
                syncBorderPopupState();
            });

            document.getElementById( 'numFmtCloseBtn'   ).addEventListener( 'click', cancelNumFmt );
            document.getElementById( 'numFmtConfirmBtn' ).addEventListener( 'click', confirmNumFmt );
            [ 'nfDecimals', 'nfThousands', 'nfRedNeg', 'nfCurrency', 'nfCurrencyPos', 'nfDatePattern' ].forEach( function( id )
            {
                document.getElementById( id ).addEventListener( 'input', updateNumFmtPreview );
            });

            // Outside click / ESC dismiss the border popup and any open dialog.
            document.addEventListener( 'click', function( e )
            {
                const pop = document.getElementById( 'borderPopup' );
                if( pop.classList.contains( 'open' ) && ! pop.contains( e.target ) && ! e.target.closest( '#fmtBorderBtn' ) )
                    closeBorderPopup();
            });
            document.addEventListener( 'keydown', function( e )
            {
                // Ctrl/Cmd+S: save now (an untitled sheet goes to "Guardar como"), as in Text and Write.
                if( ( e.ctrlKey || e.metaKey ) && e.key.toLowerCase() === 's' )
                {
                    e.preventDefault();
                    saveNow();
                    return;
                }
                // Ctrl/Cmd+B, I, U format the selection — unless something is being
                // typed into, where they belong to the text.
                //
                // "Is a text field focused?" is the wrong test here: Handsontable
                // keeps focus in a hidden <textarea> whenever the grid is active, so
                // a plain input/textarea check never lets these through at all. What
                // actually matters is whether the CELL EDITOR is open, plus the name
                // box, which is a real input of ours outside the grid.
                if( ( e.ctrlKey || e.metaKey ) && ! e.altKey && 'biu'.indexOf( e.key.toLowerCase() ) !== -1 )
                {
                    if( e.target && e.target.id === 'nameBox' ) return;
                    if( ! table || ! lastSelection ) return;

                    const editor = table.getActiveEditor && table.getActiveEditor();
                    if( editor && typeof editor.isOpened === 'function' && editor.isOpened() ) return;

                    e.preventDefault();
                    toggleStyleField( { b: 'bold', i: 'italic', u: 'underline' }[ e.key.toLowerCase() ] );
                    return;
                }
                // Escape on the border popup; the "⋮" menu and every dialog are closed by shared/ui.js.
                if( e.key === 'Escape' && document.getElementById( 'borderPopup' ).classList.contains( 'open' ) )
                {
                    e.preventDefault();
                    closeBorderPopup();
                }
            });

            document.getElementById( 'undoBtn'  ).addEventListener( 'click', function() { table.undo(); } );
            document.getElementById( 'redoBtn'  ).addEventListener( 'click', function() { table.redo(); } );

            document.getElementById( 'fxBtn'        ).addEventListener( 'click', openFxPicker );
            document.getElementById( 'fxSearch'     ).addEventListener( 'input', function( e ) { renderFxList( e.target.value ); } );

            // The loss gate's three ways out. The "x" (and Escape) are wired by
            // shared/ui.js and mean "do not write" — the edit stays in the grid,
            // the file on disk is untouched, and the dialog comes back on the next
            // save. So only the other two need a handler here.
            document.getElementById( 'lossyAnywayBtn' ).addEventListener( 'click', function()
            {
                doc.lossyAck = true;                 // for this file, until it is closed
                NayiveUI.close( 'lossyBackdrop' );
                saveNow();
            } );
            document.getElementById( 'lossyCopyBtn' ).addEventListener( 'click', function()
            {
                NayiveUI.close( 'lossyBackdrop' );
                openSaveAs();                        // a copy Calc CAN write, original intact
            } );
            document.getElementById( 'fxList'       ).addEventListener( 'click', function( e )
            {
                const btn = e.target.closest( '.fx-item' );
                if( btn ) insertFunction( btn.dataset.fn );
            });

            document.getElementById( 'insRowBtn' ).addEventListener( 'click', function() { if( lastSelection ) table.alter( 'insert_row_below', lastSelection.r1 ); } );
            document.getElementById( 'delRowBtn' ).addEventListener( 'click', function() { if( lastSelection ) table.alter( 'remove_row', lastSelection.r1, lastSelection.r2 - lastSelection.r1 + 1 ); } );
            document.getElementById( 'insColBtn' ).addEventListener( 'click', function() { if( lastSelection ) table.alter( 'insert_col_end', lastSelection.c1 ); } );
            document.getElementById( 'delColBtn' ).addEventListener( 'click', function() { if( lastSelection ) table.alter( 'remove_col', lastSelection.c1, lastSelection.c2 - lastSelection.c1 + 1 ); } );

            document.getElementById( 'fmtFontFamily' ).addEventListener( 'change', function( e ) { setOrClearStyleField( 'fontFamily', e.target.value ); } );
            document.getElementById( 'fmtFontSize'   ).addEventListener( 'change', function( e ) { setOrClearStyleField( 'size', e.target.value ? Number( e.target.value ) : null ); } );

            document.getElementById( 'fmtBoldBtn'        ).addEventListener( 'click', function() { toggleStyleField( 'bold' ); } );
            document.getElementById( 'fmtItalicBtn'      ).addEventListener( 'click', function() { toggleStyleField( 'italic' ); } );
            document.getElementById( 'fmtUnderlineBtn'   ).addEventListener( 'click', function() { toggleStyleField( 'underline' ); } );
            document.getElementById( 'fmtBorderBtn'      ).addEventListener( 'click', function( e )
            {
                e.stopPropagation();
                const pop = document.getElementById( 'borderPopup' );
                if( pop.classList.contains( 'open' ) ) closeBorderPopup();
                else                                   openBorderPopup();
            });
            document.getElementById( 'fmtAlignLeftBtn'   ).addEventListener( 'click', function() { setStyleField( 'align', 'left'   ); } );
            document.getElementById( 'fmtAlignCenterBtn' ).addEventListener( 'click', function() { setStyleField( 'align', 'center' ); } );
            document.getElementById( 'fmtAlignRightBtn'  ).addEventListener( 'click', function() { setStyleField( 'align', 'right'  ); } );
            document.getElementById( 'fmtValignTopBtn'   ).addEventListener( 'click', function() { setStyleField( 'valign', 'top'    ); } );
            document.getElementById( 'fmtValignMiddleBtn').addEventListener( 'click', function() { setStyleField( 'valign', 'middle' ); } );
            document.getElementById( 'fmtValignBottomBtn').addEventListener( 'click', function() { setStyleField( 'valign', 'bottom' ); } );
            document.getElementById( 'fmtWrapBtn'        ).addEventListener( 'click', function() { toggleStyleField( 'wrap' ); } );
            document.getElementById( 'fmtClearBtn'       ).addEventListener( 'click', clearSelectionStyle );
            document.getElementById( 'fmtFontColor'      ).addEventListener( 'input', function( e ) { setStyleField( 'color', e.target.value.replace( '#', '' ).toUpperCase() ); setColorBar( e.target ); } );
            document.getElementById( 'fmtFillColor'      ).addEventListener( 'input', function( e ) { setStyleField( 'bg',    e.target.value.replace( '#', '' ).toUpperCase() ); setColorBar( e.target ); } );
            document.getElementById( 'fmtNumFormat'      ).addEventListener( 'change', function( e )
            {
                if( e.target.value === 'general' ) setOrClearStyleField( 'numFmt', '' );
                else                               openNumFmtDialog( e.target.value );
            });

            document.getElementById( 'fmtMergeBtn' ).addEventListener( 'click', toggleMergeSelection );
            document.getElementById( 'nameBox' ).addEventListener( 'keydown', function( e )
            {
                if( e.key === 'Enter' )  { e.preventDefault(); gotoReference( e.target.value ); }
                if( e.key === 'Escape' ) { e.preventDefault(); refreshNameBox(); table.listen(); }
            } );
            document.getElementById( 'nameBox' ).addEventListener( 'blur', refreshNameBox );

            document.getElementById( 'sortAscBtn'      ).addEventListener( 'click', function() { sortByColumn( false ); } );
            document.getElementById( 'sortDescBtn'     ).addEventListener( 'click', function() { sortByColumn( true  ); } );

            document.getElementById( 'fmtFreezeBtn'    ).addEventListener( 'click', toggleFreezeColumns );
            document.getElementById( 'fmtFreezeRowBtn' ).addEventListener( 'click', toggleFreezeRows );

            // Toolbar buttons must not steal focus from the grid — mousedown would blur the
            // active cell/clear its selection before the click handler ever runs.
            document.querySelectorAll( '.fmt-btn' ).forEach( function( btn ) { btn.addEventListener( 'mousedown', function( e ) { e.preventDefault(); } ); } );

            // ---- toolbar or pull-down menus (see PULL-DOWN MENUS below) ----
            // The bar itself was built and wired when `menus` was created; this
            // only hangs the two header buttons and paints the remembered choice.
            CHROME.wire();
            CHROME.apply();
        }

        // Handsontable only ships an en-US dictionary here, so the one the app uses
        // is built at runtime: start from en-US and translate the phrases this
        // app's context menu can surface, from shared/i18n/*.json. Anything not
        // listed stays as en-US. Registered under the fixed code HT_LOCALE
        // whatever the language is, so `language:` below never has to change.
        const HT_LOCALE = 'nayive';

        function registerUiLocale()
        {
            const en = Handsontable.languages.getLanguageDictionary( 'en-US' );

            const t =
            {
                'Insert row above'    : T( 'calc.ht.insRowAbove' ),
                'Insert row below'    : T( 'calc.ht.insRowBelow' ),
                'Insert column left'  : T( 'calc.ht.insColLeft' ),
                'Insert column right' : T( 'calc.ht.insColRight' ),
                'Remove row'          : T( 'calc.ht.rmRow' ),
                'Remove rows'         : T( 'calc.ht.rmRows' ),
                'Remove column'       : T( 'calc.ht.rmCol' ),
                'Remove columns'      : T( 'calc.ht.rmCols' ),
                'Undo'                : T( 'ui.undo' ),
                'Redo'                : T( 'ui.redo' ),
                'Copy'                : T( 'ui.copy' ),
                'Cut'                 : T( 'ui.cut' ),
                'Merge cells'         : T( 'calc.mergeCells' ),
                'Unmerge cells'       : T( 'calc.ht.unmerge' ),
                'Freeze column'       : T( 'calc.ht.freezeCol' ),
                'Unfreeze column'     : T( 'calc.ht.unfreezeCol' ),
                'Borders'             : T( 'calc.borders' ),
                'Top'                 : T( 'calc.ht.top' ),
                'Right'               : T( 'calc.ht.right' ),
                'Bottom'              : T( 'calc.ht.bottom' ),
                'Left'                : T( 'calc.ht.left' ),
                'Remove border(s)'    : T( 'calc.ht.rmBorders' ),
                'Add comment'         : T( 'calc.ht.addComment' ),
                'Edit comment'        : T( 'calc.ht.editComment' ),
                'Delete comment'      : T( 'calc.ht.delComment' ),
                'Read-only comment'   : T( 'calc.ht.roComment' ),
                'No available options': T( 'calc.ht.noOptions' ),
                'OK'                  : T( 'ui.accept' ),
                'Cancel'              : T( 'ui.cancel' )
            };

            const dict = {};

            Object.keys( en ).forEach( function( key )
            {
                const val = en[ key ];
                dict[ key ] = Array.isArray( val )
                            ? val.map( function( s ) { return t[ s ] || s; } )
                            : ( t[ val ] || val );
            });

            dict.languageCode = HT_LOCALE;

            Handsontable.languages.registerLanguageDictionary( dict );
        }

        //------------------------------------------------------------------------//
        // IMPORT (local file from this device — distinct from Open, which browses
        // documents already saved on the server) and the inline filename rename

        async function handleImportFile( file )
        {
            if( ! file ) return;

            try
            {
                const buf  = new Uint8Array( await file.arrayBuffer() );
                const d    = await decodeToDoc( buf, O.extOf( file.name ) );

                currentPath = null;
                readOnly    = false;
                pendingName = file.name;
                fileLabel.set( file.name );
                initGrid( d );
            }
            catch( _ )
            {
                NayiveUI.toast( T( 'text.importFailed' ) );
            }
        }

        // Same as handleImportFile, but the source is a file already on the server
        // (any folder). Opened as a new untitled sheet — Drive uses this to hand a
        // .xlsx / .csv over to Calc with its import action pre-triggered.
        async function importServerFile( path )
        {
            try
            {
                const buf  = await GumApi.readFileBytes( path );
                const name = O.baseName( path );
                const d    = await decodeToDoc( buf, O.extOf( name ) );

                currentPath = null;
                readOnly    = false;
                pendingName = name;
                fileLabel.set( name );
                initGrid( d );
            }
            catch( _ )
            {
                NayiveUI.toast( T( 'text.importFailed' ) );
            }
        }

        // The file label was edited. Untitled: the first name IS the first save,
        // so it goes through "Guardar como" - a first save has to ask for a
        // folder, and a sheet always gets a spreadsheet extension. Named:
        // rename in place,
        // keeping the current extension whatever was typed, so a stray or wrong
        // one can't make the file look like another format.
        async function commitRename( raw )
        {
            const name = O.safeName( raw );
            if( ! name ) return;

            if( ! currentPath )
            {
                const ext = OPEN_EXTS.indexOf( O.extOf( name ) ) !== -1 ? '' : '.xlsx';
                pendingName = name + ext;
                fileLabel.set( pendingName );
                openSaveAs();
                return;
            }

            const ext     = O.extOf( currentPath );
            const base    = name.replace( /\.[a-z0-9]+$/i, '' );
            const newName = ext ? base + '.' + ext : base;
            const newPath = ( O.dirName( currentPath ) || APP_DIR ) + '/' + newName;

            if( newPath === currentPath ) return;

            setSyncStatus( 'saving' );

            try
            {
                await flushPendingSave();            // the latest cells under the OLD name first
                await store.flush();                 // get any queued write onto the OLD path
                await GumApi.rename( currentPath, newPath );
                await store.forget( currentPath );   // only now is the old cache entry stale

                currentPath = newPath;
                fileLabel.set( O.relLabel( newPath, APP_DIR, OPEN_ROOT ) );
                setSyncStatus( 'synced' );
            }
            catch( _ )
            {
                setSyncStatus( 'error' );
                NayiveUI.toast( T( 'text.renameFailed' ) );
            }
        }

        //------------------------------------------------------------------------//
        // GRID

        let lastSelection = null;   // {r1,c1,r2,c2} — captured on selection, since toolbar buttons steal focus

        // Handsontable's theme class follows the shared colour scheme. The --ht-* variables in
        // the stylesheet are wired to the app tokens for both classes; swapping the class here
        // also lets HT's own light-dark() internals (scrollbars, menus) resolve to the right side.
        function htThemeName()
        {
            return document.documentElement.dataset.theme === 'light' ? 'ht-theme-main' : 'ht-theme-main-dark';
        }

        // Handsontable's free context menu is text-only. cmItem() wraps a menu entry in a
        // renderer that keeps HT's own label — including the state-dependent ones (Merge /
        // Unmerge, Freeze / Unfreeze, Add / Edit comment) — and just prefixes the matching
        // glyph, drawn from the same icon vocabulary as the formatting toolbar. The paired
        // CSS in the <style> block ('.cm-ico', plus the .htCustomMenuRenderer hover/cursor
        // rules HT drops for custom-rendered items) finishes the look.
        function cmIcon( body )
        {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
                 + 'stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
        }

        const CM_ICONS =
        {
            row_above       : cmIcon( '<path d="M4 20h16M4 15h16"/><path d="M12 3v7"/><path d="M8.5 6.5 12 3l3.5 3.5"/>' ),
            row_below       : cmIcon( '<path d="M4 4h16M4 9h16"/><path d="M12 21v-7"/><path d="M8.5 17.5 12 21l3.5-3.5"/>' ),
            col_left        : cmIcon( '<path d="M20 4v16M15 4v16"/><path d="M3 12h7"/><path d="M6.5 8.5 3 12l3.5 3.5"/>' ),
            col_right       : cmIcon( '<path d="M4 4v16M9 4v16"/><path d="M21 12h-7"/><path d="M17.5 8.5 21 12l-3.5 3.5"/>' ),
            remove_row      : cmIcon( '<path d="M3 12h5M16 12h5"/><path d="M9.5 9.5 14.5 14.5M14.5 9.5 9.5 14.5"/>' ),
            remove_col      : cmIcon( '<path d="M12 3v5M12 16v5"/><path d="M9.5 9.5 14.5 14.5M14.5 9.5 9.5 14.5"/>' ),
            mergeCells      : cmIcon( '<rect x="3" y="4" width="8" height="7"/><rect x="13" y="4" width="8" height="7"/><rect x="3" y="14" width="18" height="7"/>' ),
            undo            : cmIcon( '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12H8"/>' ),
            redo            : cmIcon( '<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h6"/>' ),
            cut             : cmIcon( '<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>' ),
            copy            : cmIcon( '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' ),
            freeze_column   : cmIcon( '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18" stroke-width="3"/>' ),
            unfreeze_column : cmIcon( '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18" stroke-width="3" stroke-dasharray="2.5 3"/>' ),
            commentsAddEdit : cmIcon( '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/>' ),
            commentsRemove  : cmIcon( '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9 10h6"/>' )
        };

        function cmItem( key )
        {
            return {
                renderer : function( hot, wrapper, row, col, prop, itemValue )
                {
                    // `ownerDoc`, not `doc` — the module's `doc` is the open workbook.
                    const ownerDoc = wrapper.ownerDocument;
                    const icon     = ownerDoc.createElement( 'span' );
                    icon.className = 'cm-ico';
                    icon.innerHTML = CM_ICONS[ key ] || '';

                    wrapper.appendChild( icon );
                    wrapper.appendChild( ownerDoc.createTextNode(
                        typeof itemValue === 'string' ? itemValue : String( itemValue == null ? '' : itemValue ) ) );

                    return wrapper;
                }
            };
        }

        //------------------------------------------------------------------------//
        // SHEET TABS
        //
        // One Handsontable, several sheet entries: switching swaps what the grid is
        // showing rather than building a second grid. The order below matters —
        // HyperFormula is told which sheet it is writing into BEFORE the new data
        // arrives, or loadData() pours this sheet's cells into the one just left.

        function renderSheetTabs()
        {
            const strip   = document.getElementById( 'sheetTabs' );
            const visible = doc.sheets.filter( function( sh ) { return ! sh.hidden; } );

            strip.hidden = visible.length < 2;      // a one-sheet file looks untouched
            strip.innerHTML = '';

            if( strip.hidden ) return;

            doc.sheets.forEach( function( sh, i )
            {
                if( sh.hidden ) return;

                const b = document.createElement( 'button' );
                b.type      = 'button';
                b.className = 'sheet-tab' + ( i === doc.active ? ' is-active' : '' );
                b.textContent = sh.name;
                b.title       = sh.name;
                b.setAttribute( 'role', 'tab' );
                b.setAttribute( 'aria-selected', i === doc.active ? 'true' : 'false' );
                b.addEventListener( 'click', function() { switchToSheet( i ); } );

                strip.appendChild( b );
            });
        }

        function switchToSheet( i )
        {
            if( ! table || i === doc.active || ! doc.sheets[ i ] ) return;

            stashActiveSheet();          // the sheet being left keeps everything it had
            setActiveSheet( i );

            gridBooting = true;          // redrawing is not editing

            // The engine has to know the new sheet's name before its rows arrive.
            table.updateSettings( {
                formulas          : { sheetName: activeSheet.name },
                mergeCells        : activeSheet.merges,
                fixedRowsTop      : activeSheet.freeze.rows,
                fixedColumnsStart : activeSheet.freeze.cols
            } );

            table.loadData( activeSheet.data && activeSheet.data.length ? activeSheet.data : [ [ '' ] ] );

            // Notes go on AFTER the rows: loadData throws away all cell meta, so a
            // `cell:` passed with the settings above would be wiped a line later.
            Object.keys( activeSheet.comments ).forEach( function( addr )
            {
                const rc = decodeCell( addr );
                table.setCellMeta( rc.r, rc.c, 'comment', { value: activeSheet.comments[ addr ] } );
            });

            // The hidden lists are per sheet, and the plugins keep the ones from the
            // sheet we just left, so clear before applying.
            const hc = table.getPlugin( 'hiddenColumns' );
            const hr = table.getPlugin( 'hiddenRows' );
            hc.showColumns( hc.getHiddenColumns() || [] );
            hr.showRows(    hr.getHiddenRows()    || [] );
            if( activeSheet.hiddenCols.length ) hc.hideColumns( activeSheet.hiddenCols.slice() );
            if( activeSheet.hiddenRows.length ) hr.hideRows(    activeSheet.hiddenRows.slice() );

            lastSelection = null;
            table.render();
            table.selectCell( 0, 0 );

            gridBooting = false;

            renderSheetTabs();
            updateToolbarActiveState();
        }

        //------------------------------------------------------------------------//
        // SORT
        //
        // Deliberately NOT Handsontable's columnSorting plugin. That one reorders
        // the VIEW and leaves the source data alone, so a sheet sorted, saved and
        // reopened comes back in its old order — the sort silently does not stick.
        // This moves the rows themselves, and everything addressed by row number
        // (styles, notes, heights, hidden flags) moves with them.
        //
        // Two things it refuses rather than get wrong: a range with merged cells,
        // and a range with formulas — moving a row changes what =B2*2 points at,
        // and rewriting formulas is a different and much larger job.

        function lastUsedRow( data )
        {
            for( let r = data.length - 1; r >= 0; r-- )
            {
                const row = data[ r ] || [];
                for( let c = 0; c < row.length; c++ )
                    if( row[ c ] !== '' && row[ c ] !== null && row[ c ] !== undefined ) return r;
            }
            return -1;
        }

        function sortByColumn( descending )
        {
            if( ! lastSelection || ! table ) return;

            const data = table.getSourceData();
            const col  = lastSelection.c1;

            // A selection of several rows sorts exactly those. A single cell sorts
            // the whole column below row 1, keeping row 0 as the header.
            const multi = lastSelection.r2 > lastSelection.r1;
            const first = multi ? lastSelection.r1 : 1;
            const last  = multi ? lastSelection.r2 : lastUsedRow( data );

            if( last <= first ) return;

            const touchesMerge = activeSheet.merges.some( function( m )
            {
                return m.row <= last && ( m.row + m.rowspan - 1 ) >= first;
            });
            if( touchesMerge ) { NayiveUI.toast( T( 'calc.sortMerged' ) ); return; }

            for( let r = first; r <= last; r++ )
            {
                const row = data[ r ] || [];
                for( let c = 0; c < row.length; c++ )
                    if( typeof row[ c ] === 'string' && row[ c ].charAt( 0 ) === '=' )
                    { NayiveUI.toast( T( 'calc.sortFormulas' ) ); return; }
            }

            const order = [];
            for( let r = first; r <= last; r++ ) order.push( r );

            const blank = function( v ) { return v === '' || v === null || v === undefined; };

            // Array.prototype.sort is stable, so equal keys keep their old order.
            order.sort( function( ra, rb )
            {
                const a = ( data[ ra ] || [] )[ col ];
                const b = ( data[ rb ] || [] )[ col ];

                if( blank( a ) && blank( b ) ) return 0;
                if( blank( a ) ) return 1;        // blanks sink, whichever way we sort
                if( blank( b ) ) return -1;

                const na = ( typeof a === 'number' ) ? a : Number( a );
                const nb = ( typeof b === 'number' ) ? b : Number( b );
                const aNum = typeof a !== 'boolean' && isFinite( na ) && String( a ).trim() !== '';
                const bNum = typeof b !== 'boolean' && isFinite( nb ) && String( b ).trim() !== '';

                let cmp;
                if( aNum && bNum )      cmp = na - nb;
                else if( aNum )         cmp = -1;                       // numbers before text
                else if( bNum )         cmp = 1;
                else                    cmp = String( a ).localeCompare( String( b ), NayiveI18n.locale() );

                return descending ? -cmp : cmp;
            } );

            applyRowOrder( first, last, order );
        }

        // Rewrite rows `first`..`last` in the order given, carrying everything that
        // is keyed by row number along with them.
        function applyRowOrder( first, last, order )
        {
            const data = table.getSourceData();

            // old row -> new row
            const moveTo = {};
            order.forEach( function( oldRow, i ) { moveTo[ oldRow ] = first + i; } );

            const rows = data.map( function( row ) { return row.slice(); } );
            order.forEach( function( oldRow, i ) { rows[ first + i ] = ( data[ oldRow ] || [] ).slice(); } );

            // Styles are addressed "A7", so each one in range moves to its row's
            // new address. Built fresh so nothing is overwritten mid-move.
            const styles = {};
            Object.keys( activeSheet.cellStyles ).forEach( function( addr )
            {
                const rc = decodeCell( addr );
                const to = ( rc.r >= first && rc.r <= last ) ? moveTo[ rc.r ] : rc.r;
                styles[ encodeCell( { r: to, c: rc.c } ) ] = activeSheet.cellStyles[ addr ];
            });
            activeSheet.cellStyles = styles;

            // Notes live in cell meta while the sheet is on screen, so they are read
            // from there rather than from the last stash.
            const notes = {};
            ( table.getCellsMeta() || [] ).forEach( function( meta )
            {
                if( ! meta || ! meta.comment || ! meta.comment.value ) return;
                const to = ( meta.row >= first && meta.row <= last ) ? moveTo[ meta.row ] : meta.row;
                notes[ encodeCell( { r: to, c: meta.col } ) ] = meta.comment.value;
            });
            activeSheet.comments = notes;

            const heights = [], heightsSrc = [], hidden = [];
            activeSheet.rows.forEach( function( px, r )
            {
                if( px != null ) heights[ ( r >= first && r <= last ) ? moveTo[ r ] : r ] = px;
            });
            activeSheet.rowsSrc.forEach( function( pt, r )
            {
                if( pt != null ) heightsSrc[ ( r >= first && r <= last ) ? moveTo[ r ] : r ] = pt;
            });
            ( table.getPlugin( 'hiddenRows' ).getHiddenRows() || [] ).forEach( function( r )
            {
                hidden.push( ( r >= first && r <= last ) ? moveTo[ r ] : r );
            });

            activeSheet.rows       = heights;
            activeSheet.rowsSrc    = heightsSrc;
            activeSheet.hiddenRows = hidden;

            gridBooting = true;                  // redrawing is not editing

            table.loadData( rows );

            Object.keys( activeSheet.comments ).forEach( function( addr )
            {
                const rc = decodeCell( addr );
                table.setCellMeta( rc.r, rc.c, 'comment', { value: activeSheet.comments[ addr ] } );
            });

            const hr = table.getPlugin( 'hiddenRows' );
            hr.showRows( hr.getHiddenRows() || [] );
            if( hidden.length ) hr.hideRows( hidden.slice() );

            table.render();

            gridBooting = false;

            // loadData is not an undoable edit, so the save has to be asked for.
            scheduleAutosave();
        }

        //------------------------------------------------------------------------//
        // NAME BOX AND SELECTION TOTALS
        //
        // Both hang off one thing: whatever is selected. afterSelectionEnd already
        // fires for every way a selection can change, so both are refreshed there.

        function refreshNameBox()
        {
            const box = document.getElementById( 'nameBox' );
            if( ! box || box === document.activeElement ) return;   // don't fight what is being typed

            if( ! lastSelection ) { box.value = ''; return; }

            const a = encodeCell( { r: lastSelection.r1, c: lastSelection.c1 } );
            const b = encodeCell( { r: lastSelection.r2, c: lastSelection.c2 } );

            box.value = ( a === b ) ? a : ( a + ':' + b );
        }

        // "B12", "b12", "B2:D5", or "Notas!A1" to land on another sheet.
        function gotoReference( raw )
        {
            const text = String( raw || '' ).trim();
            if( ! text ) return;

            let ref = text;
            const bang = text.lastIndexOf( '!' );

            if( bang !== -1 )
            {
                const wanted = text.slice( 0, bang ).replace( /^'|'$/g, '' );
                const i      = doc.sheets.findIndex( function( sh ) { return sh.name === wanted; } );

                if( i === -1 ) { NayiveUI.toast( T( 'calc.gotoNoSheet' ) ); return; }

                ref = text.slice( bang + 1 );
                if( i !== doc.active ) switchToSheet( i );
            }

            // decodeRange happily returns nonsense for nonsense, so the result is
            // checked rather than trusted.
            let r;
            try { r = decodeRange( ref.toUpperCase().replace( /\$/g, '' ) ); }
            catch( _ ) { r = null; }

            if( ! r || ! isFinite( r.s.r ) || ! isFinite( r.s.c ) || r.s.r < 0 || r.s.c < 0 )
            {
                NayiveUI.toast( T( 'calc.gotoBadRef' ) );
                return;
            }

            const lastRow = table.countRows() - 1;
            const lastCol = table.countCols() - 1;
            const r1 = Math.min( r.s.r, lastRow ), c1 = Math.min( r.s.c, lastCol );
            const r2 = Math.min( isFinite( r.e.r ) ? r.e.r : r.s.r, lastRow );
            const c2 = Math.min( isFinite( r.e.c ) ? r.e.c : r.s.c, lastCol );

            table.selectCell( r1, c1, r2, c2 );
            table.listen();
        }

        // Sum, average and count of the selection, off the COMPUTED values — a
        // formula cell should count for what it shows, not for its source text.
        function refreshSelStats()
        {
            const el = document.getElementById( 'selStats' );
            if( ! el ) return;

            if( ! lastSelection || ! table ) { el.innerHTML = ''; return; }

            let sum = 0, numbers = 0, filled = 0;

            for( let r = lastSelection.r1; r <= lastSelection.r2; r++ )
            {
                for( let c = lastSelection.c1; c <= lastSelection.c2; c++ )
                {
                    const v = table.getDataAtCell( r, c );
                    if( v === null || v === undefined || v === '' ) continue;

                    filled++;

                    const n = ( typeof v === 'number' ) ? v : Number( String( v ).replace( ',', '.' ) );
                    if( typeof v !== 'boolean' && isFinite( n ) && String( v ).trim() !== '' ) { sum += n; numbers++; }
                }
            }

            if( ! filled ) { el.innerHTML = ''; return; }

            // NayiveI18n.locale() is the tag the rest of Nayive hands Intl: the
            // INTERFACE language, not whatever the browser happens to be set to.
            const fmt  = function( n ) { return n.toLocaleString( NayiveI18n.locale(), { maximumFractionDigits: 2 } ); };
            const cell = function( label, value ) { return '<span>' + label + ' <b>' + value + '</b></span>'; };

            const parts = [];

            if( numbers )
            {
                parts.push( cell( T( 'calc.statSum' ), fmt( sum ) ) );
                parts.push( cell( T( 'calc.statAvg' ), fmt( sum / numbers ) ) );
            }
            parts.push( cell( T( 'calc.statCount' ), String( filled ) ) );

            el.innerHTML = parts.join( '' );
        }

        // The active sheet's notes, in the shape Handsontable's `cell` setting wants.
        function commentCells()
        {
            return Object.keys( activeSheet.comments ).map( function( addr )
            {
                const rc = decodeCell( addr );
                return { row: rc.r, col: rc.c, comment: { value: activeSheet.comments[ addr ] } };
            } );
        }

        // Draw the workbook `d` (see THE OPEN WORKBOOK above). Everything the grid
        // needs now comes off the active sheet entry, so the sheet tabs will call
        // this with a different `active` and nothing else changes.
        function initGrid( d )
        {
            if( table ) table.destroy();

            gridBooting = true;

            doc = d || newDoc();
            setActiveSheet( Math.min( doc.active || 0, doc.sheets.length - 1 ) );

            const el = document.getElementById( 'gridHost' );
            el.innerHTML = '';
            el.className = htThemeName();

            lastSelection = null;
            point         = null;

            table = new Handsontable( el,
            {
                licenseKey  : 'non-commercial-and-evaluation',
                themeName   : htThemeName(),
                language    : HT_LOCALE,   // registered at load by registerUiLocale()
                data        : ( activeSheet.data && activeSheet.data.length ) ? activeSheet.data : [[ '' ]],
                minRows     : 100,
                minCols     : 26,
                rowHeaders  : true,
                colHeaders  : true,
                // 'alignment' is deliberately excluded: it writes Handsontable's own className,
                // not the `activeSheet.cellStyles` map this app tracks, so it would look applied but vanish
                // on save/reopen — the toolbar's align buttons are the persisted path instead.
                // 'borders' and 'paste' were dropped: HT18 has no predefined 'paste' item and
                // the CustomBorders plugin isn't enabled (calc has its own border picker), so
                // both rendered as dead, un-actioned rows. Object form + cmItem() so every
                // remaining entry carries an icon (see CM_ICONS above).
                contextMenu : { items : {
                                 row_above       : cmItem( 'row_above' ),
                                 row_below       : cmItem( 'row_below' ),
                                 col_left        : cmItem( 'col_left' ),
                                 col_right       : cmItem( 'col_right' ),
                                 sep1            : '---------',
                                 remove_row      : cmItem( 'remove_row' ),
                                 remove_col      : cmItem( 'remove_col' ),
                                 sep2            : '---------',
                                 mergeCells      : cmItem( 'mergeCells' ),
                                 sep3            : '---------',
                                 undo            : cmItem( 'undo' ),
                                 redo            : cmItem( 'redo' ),
                                 sep4            : '---------',
                                 cut             : cmItem( 'cut' ),
                                 copy            : cmItem( 'copy' ),
                                 sep5            : '---------',
                                 freeze_column   : cmItem( 'freeze_column' ),
                                 unfreeze_column : cmItem( 'unfreeze_column' ),
                                 sep6            : '---------',
                                 commentsAddEdit : cmItem( 'commentsAddEdit' ),
                                 commentsRemove  : cmItem( 'commentsRemove' )
                                } },
                comments    : true,
                // Keep the selection (and its green highlight) visible while the user works
                // the external toolbar / border popup — otherwise clicking any control blurs it.
                outsideClickDeselects: false,
                manualColumnFreeze: true,
                manualColumnResize: true,
                manualRowResize   : true,
                // Widths/heights come off the sheet entry, so a file opens at the
                // size it was saved at instead of a flat 100px everywhere. Functions
                // rather than arrays: a sheet is 26+ columns wide and only a few of
                // them carry a stored width.
                colWidths   : function( i ) { return activeSheet.cols[ i ] || DEFAULT_COL_PX; },
                rowHeights  : function( r ) { return activeSheet.rows[ r ] || undefined; },
                fixedRowsTop      : activeSheet.freeze.rows,
                fixedColumnsStart : activeSheet.freeze.cols,
                // Empty on purpose — the real lists are applied after construction,
                // see below. Both keys still have to be here to switch the plugins on.
                hiddenColumns     : { columns: [], indicators: true },
                hiddenRows        : { rows:    [], indicators: true },
                // The comments plugin reads its text out of per-cell meta, so the
                // notes the file carried are handed over as the initial meta.
                cell        : commentCells(),
                mergeCells  : activeSheet.merges,
                renderer    : styledRenderer,
                // The engine's sheet carries the real name, so a formula written as
                // ='Ventas'!B2 matches whichever sheet is on the grid.
                formulas    : { engine: HyperFormula, sheetName: activeSheet.name || 'Hoja1' },
                width       : '100%',
                height      : '100%',
                afterChange       : function( changes, source ) { if( source !== 'loadData' && source !== 'updateData' ) scheduleAutosave(); },
                // Phone: the cell editor opening is the on-screen keyboard
                // arriving — give the grid the toolbar's 159px back. Selecting
                // a cell does NOT fold it, so formatting a selection stays one
                // tap. "Aa" in the header brings it back.
                afterBeginEditing : function() { if( PHONE.matches && fold.isOpen() ) fold.setOpen( false ); pointEditorOpened(); },
                // A formula being typed takes clicks, drags and arrow keys as
                // references to other cells (see POINTING below).
                beforeOnCellMouseDown : pointMouseDown,
                beforeOnCellMouseOver : pointMouseOver,
                beforeKeyDown         : pointKeyDown,
                // `source` matters here exactly as it does in afterChange above.
                // Handsontable pads a freshly loaded sheet up to minRows/minCols and
                // reports those as real row/col insertions with source 'auto' — so an
                // unguarded hook scheduled an autosave the moment ANY file smaller than
                // 100x26 was opened, and Calc rewrote it 2.5s later with nobody having
                // typed a thing. Every save-time loss (other sheets, column widths,
                // charts…) therefore fired on mere OPEN. A real insert — the toolbar's
                // alter() calls and the context menu alike — carries no source at all.
                afterCreateRow    : function( i, n, source ) { if( source !== 'auto' ) scheduleAutosave(); },
                afterRemoveRow    : scheduleAutosave,
                afterCreateCol    : function( i, n, source ) { if( source !== 'auto' ) scheduleAutosave(); },
                afterRemoveCol    : scheduleAutosave,
                afterUndo         : scheduleAutosave,
                afterRedo         : scheduleAutosave,
                // A dragged column edge is a real edit now that widths are saved.
                // Writing or clearing a note only ever touches cell meta — without this
                // a comment could be typed and would never reach the file.
                afterSetCellMeta  : function( row, col, key ) { if( key === 'comment' ) scheduleAutosave(); },
                afterOnCellMouseDown : function( event, coords ) { if( coords && coords.row >= 0 && coords.col >= 0 ) followLinkAt( coords.row, coords.col, event ); },
                afterColumnResize : function( newSize, column ) { activeSheet.cols[ column ] = newSize; activeSheet.colsSrc[ column ] = null; scheduleAutosave(); },
                afterRowResize    : function( newSize, row    ) { activeSheet.rows[ row ]    = newSize; activeSheet.rowsSrc[ row ]    = null; scheduleAutosave(); },
                afterMergeCells   : function( cellRange, mergeParent ) { trackMerge( mergeParent ); scheduleAutosave(); },
