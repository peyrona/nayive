                afterUnmergeCells : function( cellRange ) { untrackMerge( cellRange ); scheduleAutosave(); },
                afterRender       : function()
                {
                    // Tooltip for the corner "select all" glyph (styled in the <style> block).
                    // HT rebuilds the header DOM on render, so re-apply after each one.
                    const corner = el.querySelector( '.ht_clone_top_inline_start_corner thead th' );
                    if( corner && ! corner.title ) corner.title = T( 'calc.selectAll' );
                },
                afterSelectionEnd : function( row, col, row2, col2 )
                {
                    lastSelection = { r1: Math.min( row, row2 ), c1: Math.min( col, col2 ), r2: Math.max( row, row2 ), c2: Math.max( col, col2 ) };
                    updateToolbarActiveState();
                    refreshNameBox();
                    refreshSelStats();
                }
            });

            // Hidden rows/columns are applied HERE, not through the settings above:
            // the plugins only accept indexes that exist in the data they were built
            // with, and a sheet is padded out to minRows/minCols afterwards. A file
            // whose hidden column sits past its last written column — the common case,
            // since hiding a column tends to leave it empty — was silently shown.
            if( activeSheet.hiddenCols.length ) table.getPlugin( 'hiddenColumns' ).hideColumns( activeSheet.hiddenCols.slice() );
            if( activeSheet.hiddenRows.length ) table.getPlugin( 'hiddenRows'    ).hideRows(    activeSheet.hiddenRows.slice() );
            if( activeSheet.hiddenCols.length || activeSheet.hiddenRows.length ) table.render();

            // Selects A1 by default, like every other spreadsheet app — without this,
            // lastSelection stays null until the user clicks a cell, and every toolbar
            // button (fx, insert row/col, merge, formatting…) silently no-ops until then.
            table.selectCell( 0, 0 );
            table.listen();          // give the grid keyboard focus so you can type into A1 at once

            // Every other sheet goes into HyperFormula so ='Notas'!A1 resolves, and
            // the tab strip appears only when there is more than one sheet to show.
            registerSheetsInEngine();
            renderSheetTabs();

            gridBooting = false;     // from here on, a hook firing really is the user
        }

        // Handsontable's MergeCells plugin exposes no "get all current merges" call, so the
        // merge list is tracked independently here via the after(Un)mergeCells hooks — this
        // also fixes a jspreadsheet-era gap where a mid-session merge was silently lost on save.
        function trackMerge( m )
        {
            activeSheet.merges = activeSheet.merges.filter( function( e ) { return ! ( e.row === m.row && e.col === m.col ); } );
            activeSheet.merges.push( { row: m.row, col: m.col, rowspan: m.rowspan, colspan: m.colspan } );
        }

        function untrackMerge( cellRange )
        {
            const row = cellRange.from.row;
            const col = cellRange.from.col;
            activeSheet.merges = activeSheet.merges.filter( function( e ) { return ! ( e.row === row && e.col === col ); } );
        }

        // Delegates to Handsontable's own text renderer, then paints the style this app
        // tracks in `activeSheet.cellStyles` — cells are recycled DOM nodes, so unset properties must be
        // explicitly cleared or they'd leak onto whatever cell is rendered into that node next.
        function styledRenderer( instance, td, row, col, prop, value, cellProperties )
        {
            Handsontable.renderers.getRenderer( 'text' )( instance, td, row, col, prop, value, cellProperties );

            const style = activeSheet.cellStyles[ encodeCell( { r: row, c: col } ) ];

            td.style.fontWeight      = ( style && style.bold )      ? 'bold'      : '';
            td.style.fontStyle       = ( style && style.italic )    ? 'italic'    : '';
            td.style.textDecoration  = ( style && style.underline ) ? 'underline' : '';
            td.style.color           = ( style && style.color )      ? '#' + style.color : '';
            td.style.backgroundColor = ( style && style.bg )         ? '#' + style.bg    : '';
            td.style.textAlign       = ( style && style.align )      ? style.align       : '';
            td.style.verticalAlign   = ( style && style.valign )     ? style.valign      : '';
            td.style.whiteSpace      = ( style && style.wrap )       ? 'normal'          : '';
            td.style.fontFamily      = ( style && style.fontFamily ) ? style.fontFamily  : '';
            td.style.fontSize        = ( style && style.size )       ? style.size + 'pt' : '';

            const bd   = style && style.border;
            const bObj = ( bd === true ) ? { top: true, right: true, bottom: true, left: true, style: 'thin' } : bd;
            const bw   = ( bObj && bObj.style === 'medium' ) ? '2px' : '1px';
            const bc   = ( bObj && bObj.color ) ? ( '#' + bObj.color ) : 'var(--text-dim)';

            td.style.borderTop    = ( bObj && bObj.top )    ? ( bw + ' solid ' + bc ) : '';
            td.style.borderRight  = ( bObj && bObj.right )  ? ( bw + ' solid ' + bc ) : '';
            td.style.borderBottom = ( bObj && bObj.bottom ) ? ( bw + ' solid ' + bc ) : '';
            td.style.borderLeft   = ( bObj && bObj.left )   ? ( bw + ' solid ' + bc ) : '';

            if( style && style.numFmt && typeof value === 'number' && isFinite( value ) )
            {
                try { td.textContent = formatNumber( style.numFmt, value ); } catch( _ ) { /* keep raw text */ }
            }

            // Mark a linked cell. Cells are recycled DOM nodes, so this has to be
            // set AND cleared on every render like every other style above.
            const link = activeSheet.links[ encodeCell( { r: row, c: col } ) ];
            td.classList.toggle( 'has-link', !! ( link && link.target ) );
            if( link && link.target ) td.title = ( link.tooltip || link.target ) + ' — ' + T( 'calc.linkHint' );
            else if( td.title ) td.title = '';

            // The cells a formula being typed points at (see POINTING below).
            const pb = pointedBounds();
            const pt = !! pb && row >= pb.r1 && row <= pb.r2 && col >= pb.c1 && col <= pb.c2;
            td.classList.toggle( 'pt',   pt );
            td.classList.toggle( 'pt-t', pt && row === pb.r1 );
            td.classList.toggle( 'pt-b', pt && row === pb.r2 );
            td.classList.toggle( 'pt-l', pt && col === pb.c1 );
            td.classList.toggle( 'pt-r', pt && col === pb.c2 );
        }

        // Ctrl/Cmd-click on a linked cell follows the link. Plain click is left
        // alone: in a spreadsheet the first job of a click is to select the cell.
        function followLinkAt( row, col, event )
        {
            if( ! event || ! ( event.ctrlKey || event.metaKey ) ) return;

            const link = activeSheet.links[ encodeCell( { r: row, c: col } ) ];
            if( ! link || ! link.target ) return;

            event.preventDefault();

            // "#Hoja2!A1" is a jump inside the workbook, not a URL.
            if( link.target.charAt( 0 ) === '#' ) { gotoReference( link.target.slice( 1 ) ); return; }

            // Anything that is not plainly http(s) or mailto is not opened: a
            // file:// or javascript: target in someone else's spreadsheet is not
            // something to hand the browser on a click.
            if( ! /^(https?:|mailto:)/i.test( link.target ) ) { NayiveUI.toast( T( 'calc.linkBlocked' ) ); return; }

            window.open( link.target, '_blank', 'noopener,noreferrer' );
        }

        //------------------------------------------------------------------------//
        // POINTING WHILE A FORMULA IS TYPED
        //
        // What every spreadsheet does: while a cell's "=…" is being typed, a click
        // on another cell puts its address into the formula instead of moving
        // there. A drag puts a range (A1:C4), a column or row header the whole
        // column or row (A:A, 3:3), and Shift+click stretches the range from where
        // it started. The arrow keys do the same while the formula is being typed
        // (Shift+arrow stretches) - but not after F2 or a double-click, where they
        // move the caret, as in Excel.
        //
        // Only where a reference can go: right after "=", "(", ",", ";", ":" or an
        // operator. Anywhere else a click commits the cell and moves on, as it
        // always did. A click right after a reference just put in REPLACES it, so
        // a wrong click is fixed by clicking the right cell.
        //
        // Handsontable is kept out of those clicks and keys with its own
        // stopImmediatePropagation (the flag its handlers check), and the
        // mousedown's default is prevented so the editor keeps focus and caret.

        const POINT_AFTER = /[=(,;:+\-*\/^&<>]\s*$/;
        const POINT_KEYS  = { ArrowUp: [ -1, 0 ], ArrowDown: [ 1, 0 ], ArrowLeft: [ 0, -1 ], ArrowRight: [ 0, 1 ] };

        let point        = null;    // { from, to, value, anchor, head, bounds } - the reference last put in
        let pointDrag    = false;   // the mouse button is down on a pointing click
        let pointWriting = false;   // the 'input' event is ours, not the user typing

        // The release is NOT kept from Handsontable: its own document-level
        // mouseup is what clears its "button is down" flag, and left set, the
        // next plain mouse move drag-selects and closes the editor.
        document.addEventListener( 'mouseup', function() { pointDrag = false; } );

        // The open cell editor, when what it holds is a formula.
        function formulaEditor()
        {
            const ed = table && table.getActiveEditor();
            if( ! ed || ! ed.isOpened() || ! ed.TEXTAREA ) return null;
            return ed.TEXTAREA.value.charAt( 0 ) === '=' ? ed : null;
        }

        // The reference last put in stays "live" while nothing was typed after it:
        // the same text, and the caret still at its end.
        function livePoint( ta )
        {
            return point && point.value === ta.value &&
                   ta.selectionStart === point.to && ta.selectionEnd === point.to ? point : null;
        }

        function canPoint( ta )
        {
            return !! livePoint( ta ) || POINT_AFTER.test( ta.value.slice( 0, ta.selectionStart ) );
        }

        // r = -1 is a column header, c = -1 a row header.
        function kindOf( p ) { return p.r < 0 ? 'col' : p.c < 0 ? 'row' : 'cell'; }

        function pointBounds( a, b )
        {
            const kind = kindOf( a );
            const b2   = {
                r1: Math.min( a.r, b.r ), r2: Math.max( a.r, b.r ),
                c1: Math.min( a.c, b.c ), c2: Math.max( a.c, b.c ), kind: kind };

            if( kind === 'col' ) { b2.r1 = 0; b2.r2 = table.countRows() - 1; }
            if( kind === 'row' ) { b2.c1 = 0; b2.c2 = table.countCols() - 1; }

            return b2;
        }

        function colLetters( c ) { return encodeCell( { r: 0, c: c } ).replace( /\d+$/, '' ); }

        // "B3", "B3:D7", "B:D" or "3:5".
        function pointText( k )
        {
            if( k.kind === 'col' ) return colLetters( k.c1 ) + ':' + colLetters( k.c2 );
            if( k.kind === 'row' ) return ( k.r1 + 1 ) + ':' + ( k.r2 + 1 );

            const a = encodeCell( { r: k.r1, c: k.c1 } );
            const b = encodeCell( { r: k.r2, c: k.c2 } );
            return a === b ? a : a + ':' + b;
        }

        // Put the reference at the caret - or in place of the live one.
        function putPoint( ed, anchor, head )
        {
            const ta   = ed.TEXTAREA;
            const live = livePoint( ta );
            const from = live ? live.from : ta.selectionStart;
            const to   = live ? live.to   : ta.selectionEnd;
            const k    = pointBounds( anchor, head );
            const ref  = pointText( k );

            ta.value = ta.value.slice( 0, from ) + ref + ta.value.slice( to );

            const end = from + ref.length;
            if( document.activeElement !== ta ) ta.focus();
            ta.setSelectionRange( end, end );

            // The editor grows to fit, exactly as when the text is typed.
            pointWriting = true;
            ta.dispatchEvent( new Event( 'input', { bubbles: true } ) );
            pointWriting = false;

            point = { from: from, to: end, value: ta.value, anchor: anchor, head: head, bounds: k };
            table.render();                                  // styledRenderer outlines the cells
        }

        function clearPoint()
        {
            pointDrag = false;
            if( ! point ) return;

            point = null;
            if( table ) table.render();
        }

        // What styledRenderer outlines: the live reference, while its editor is open.
        function pointedBounds()
        {
            if( ! point ) return null;

            const ed = table.getActiveEditor();
            return ed && ed.isOpened() ? point.bounds : null;
        }

        // Typing anything after the reference (or moving the caret off it) ends
        // it: the next click adds a new one instead of replacing it.
        function pointEditorOpened()
        {
            clearPoint();

            const ed = table.getActiveEditor();
            const ta = ed && ed.TEXTAREA;
            if( ! ta || ta.dataset.pointWired ) return;

            ta.dataset.pointWired = '1';
            for( const type of [ 'input', 'keyup', 'mouseup' ] )
                ta.addEventListener( type, function() { if( point && ! pointWriting && ! livePoint( ta ) ) clearPoint(); } );
        }

        function pointMouseDown( e, coords )
        {
            pointDrag = false;
            if( coords.row < 0 && coords.col < 0 ) return;       // the corner stays "select all"

            const ed = formulaEditor();
            if( ! ed || ! canPoint( ed.TEXTAREA ) ) return;

            Handsontable.dom.stopImmediatePropagation( e );
            e.preventDefault();

            const at   = { r: coords.row, c: coords.col };
            const live = livePoint( ed.TEXTAREA );
            const from = e.shiftKey && live && kindOf( live.anchor ) === kindOf( at ) ? live.anchor : at;

            putPoint( ed, from, at );
            pointDrag = true;
        }

        function pointMouseOver( e, coords )
        {
            if( ! pointDrag ) return;

            Handsontable.dom.stopImmediatePropagation( e );

            const ed   = formulaEditor();
            const live = ed && livePoint( ed.TEXTAREA );
            if( ! live ) { pointDrag = false; return; }

            // A column drag follows the columns, a row drag the rows; a cell drag
            // ignores the headers.
            const kind = kindOf( live.anchor );
            if( kind === 'col'  && coords.col < 0 ) return;
            if( kind === 'row'  && coords.row < 0 ) return;
            if( kind === 'cell' && ( coords.row < 0 || coords.col < 0 ) ) return;

            if( live.head.r === coords.row && live.head.c === coords.col ) return;

            putPoint( ed, live.anchor, { r: coords.row, c: coords.col } );
        }

        function pointKeyDown( e )
        {
            if( e.key === 'Enter' || e.key === 'Escape' || e.key === 'Tab' )
            {
                if( point ) setTimeout( clearPoint, 0 );       // once the editor has closed
                return;
            }

            const d = POINT_KEYS[ e.key ];
            if( ! d || e.ctrlKey || e.metaKey || e.altKey ) return;

            const ed = formulaEditor();
            if( ! ed || ed.isInFullEditMode() || ! canPoint( ed.TEXTAREA ) ) return;

            Handsontable.dom.stopImmediatePropagation( e );
            e.preventDefault();

            // The first arrow starts from the cell being typed into, the next
            // ones from wherever the reference got to.
            const live = livePoint( ed.TEXTAREA );
            const from = live && kindOf( live.head ) === 'cell' ? live.head : { r: ed.row, c: ed.col };
            const head = { r: Math.min( Math.max( from.r + d[ 0 ], 0 ), table.countRows() - 1 ),
                           c: Math.min( Math.max( from.c + d[ 1 ], 0 ), table.countCols() - 1 ) };
            const anch = e.shiftKey && live && kindOf( live.anchor ) === 'cell' ? live.anchor : head;

            putPoint( ed, anch, head );
            table.scrollViewportTo( { row: head.r, col: head.c } );
        }

        //------------------------------------------------------------------------//
        // FORMATTING TOOLBAR

        function forEachSelectedCell( fn )
        {
            if( ! lastSelection ) return;

            for( let r = lastSelection.r1; r <= lastSelection.r2; r++ )
                for( let c = lastSelection.c1; c <= lastSelection.c2; c++ )
                    fn( encodeCell( { r: r, c: c } ) );
        }

        function toggleStyleField( field )
        {
            if( ! lastSelection ) return;

            // Mirror the anchor cell's current state, so a mixed selection turns fully on.
            const anchorAddr = encodeCell( { r: lastSelection.r1, c: lastSelection.c1 } );
            const turnOn      = ! ( activeSheet.cellStyles[ anchorAddr ] && activeSheet.cellStyles[ anchorAddr ][ field ] );

            forEachSelectedCell( function( addr )
            {
                activeSheet.cellStyles[ addr ] = activeSheet.cellStyles[ addr ] || {};
                activeSheet.cellStyles[ addr ][ field ] = turnOn;
            });

            table.render();
            updateToolbarActiveState();
            scheduleAutosave();
        }

        function setStyleField( field, value )
        {
            if( ! lastSelection ) return;

            forEachSelectedCell( function( addr )
            {
                activeSheet.cellStyles[ addr ] = activeSheet.cellStyles[ addr ] || {};
                activeSheet.cellStyles[ addr ][ field ] = value;
            });

            table.render();
            updateToolbarActiveState();
            scheduleAutosave();
        }

        function clearSelectionStyle()
        {
            if( ! lastSelection ) return;

            forEachSelectedCell( function( addr ) { delete activeSheet.cellStyles[ addr ]; } );

            table.render();
            updateToolbarActiveState();
            scheduleAutosave();
        }

        // Like setStyleField, but an empty/null value clears the field instead of storing
        // it — used by the select-based controls (font, size, number format) whose first
        // option means "back to default", not a literal value to persist.
        function setOrClearStyleField( field, value )
        {
            if( ! lastSelection ) return;

            forEachSelectedCell( function( addr )
            {
                if( value === '' || value == null )
                {
                    if( activeSheet.cellStyles[ addr ] ) delete activeSheet.cellStyles[ addr ][ field ];
                }
                else
                {
                    activeSheet.cellStyles[ addr ] = activeSheet.cellStyles[ addr ] || {};
                    activeSheet.cellStyles[ addr ][ field ] = value;
                }
            });

            table.render();
            updateToolbarActiveState();
            scheduleAutosave();
        }

        // Paints the small bar under the text/fill colour glyphs to match the picked
        // colour — same visual cue TinyMCE's own colour buttons give in the Write app.
        function setColorBar( input )
        {
            const btn = input.closest( '.fmt-color-btn' );
            if( btn ) btn.style.setProperty( '--fmt-bar', input.value );
        }

        function updateToolbarActiveState()
        {
            const anchorAddr = lastSelection ? encodeCell( { r: lastSelection.r1, c: lastSelection.c1 } ) : null;
            const style      = anchorAddr ? activeSheet.cellStyles[ anchorAddr ] : null;

            document.getElementById( 'fmtBoldBtn'         ).classList.toggle( 'active', !! ( style && style.bold )      );
            document.getElementById( 'fmtItalicBtn'       ).classList.toggle( 'active', !! ( style && style.italic )    );
            document.getElementById( 'fmtUnderlineBtn'    ).classList.toggle( 'active', !! ( style && style.underline ) );
            document.getElementById( 'fmtBorderBtn'       ).classList.toggle( 'active', !! ( style && style.border )    );
            document.getElementById( 'fmtWrapBtn'         ).classList.toggle( 'active', !! ( style && style.wrap )      );
            document.getElementById( 'fmtAlignLeftBtn'    ).classList.toggle( 'active', !! style && style.align  === 'left'   );
            document.getElementById( 'fmtAlignCenterBtn'  ).classList.toggle( 'active', !! style && style.align  === 'center' );
            document.getElementById( 'fmtAlignRightBtn'   ).classList.toggle( 'active', !! style && style.align  === 'right'  );
            document.getElementById( 'fmtValignTopBtn'    ).classList.toggle( 'active', !! style && style.valign === 'top'    );
            document.getElementById( 'fmtValignMiddleBtn' ).classList.toggle( 'active', !! style && style.valign === 'middle' );
            document.getElementById( 'fmtValignBottomBtn' ).classList.toggle( 'active', !! style && style.valign === 'bottom' );

            document.getElementById( 'fmtFontColor'  ).value = '#' + ( ( style && style.color ) || 'E7E7E8' );
            document.getElementById( 'fmtFillColor'  ).value = '#' + ( ( style && style.bg )    || '202124' );
            setColorBar( document.getElementById( 'fmtFontColor' ) );
            setColorBar( document.getElementById( 'fmtFillColor' ) );
            document.getElementById( 'fmtFontFamily' ).value = ( style && style.fontFamily ) || '';
            document.getElementById( 'fmtFontSize'   ).value = ( style && style.size )        || '';
            document.getElementById( 'fmtNumFormat'  ).value = numFmtCategory( style && style.numFmt );

            document.getElementById( 'fmtFreezeBtn'    ).classList.toggle( 'active', table.getSettings().fixedColumnsStart > 0 );
            document.getElementById( 'fmtFreezeRowBtn' ).classList.toggle( 'active', table.getSettings().fixedRowsTop      > 0 );
        }

        // Merged range membership has no direct query API, so the anchor cell's
        // address is looked up in the same activeSheet.merges list save/load already tracks.
        function toggleMergeSelection()
        {
            if( ! lastSelection ) return;

            const plugin  = table.getPlugin( 'mergeCells' );
            const already = activeSheet.merges.some( function( m ) { return m.row === lastSelection.r1 && m.col === lastSelection.c1; } );

            // No args: both methods default to the grid's own current selection, which
            // still matches `lastSelection` here since toolbar buttons never blur it.
            if( already ) plugin.unmergeSelection();
            else           plugin.mergeSelection();

            scheduleAutosave();
        }

        // manualColumnFreeze's freezeColumn()/unfreezeColumn() move one column at a time —
        // not what "freeze up to the selection" needs, so this sets the underlying
        // fixedColumnsStart grid setting directly instead (the plugin only adds the
        // interactive drag-to-freeze divider; the setting itself is what the renderer
        // actually reads, and it's what the right-click freeze_column/unfreeze_column
        // menu items end up changing too, one column at a time).
        function toggleFreezeColumns()
        {
            if( ! lastSelection ) return;

            const frozen = table.getSettings().fixedColumnsStart > 0;

            table.updateSettings( { fixedColumnsStart: frozen ? 0 : ( lastSelection.c1 + 1 ) } );

            updateToolbarActiveState();
            scheduleAutosave();
        }

        // The same move for rows. fixedRowsTop is the setting the renderer reads and
        // the one encodeFromGrid writes into the file's frozen pane, so a frozen
        // header row now survives a save like a frozen column always did.
        function toggleFreezeRows()
        {
            if( ! lastSelection ) return;

            const frozen = table.getSettings().fixedRowsTop > 0;

            table.updateSettings( { fixedRowsTop: frozen ? 0 : ( lastSelection.r1 + 1 ) } );

            updateToolbarActiveState();
            scheduleAutosave();
        }

        //------------------------------------------------------------------------//
        // BORDER PICKER — an anchored icon-only popup. Position buttons apply
        // immediately to the selection; weight/colour are sticky choices. Borders are
        // written per side into `activeSheet.cellStyles` (the same tracked map every other format
        // control uses) so they round-trip through save/reopen rather than living only
        // in Handsontable's own customBorders plugin.

        function openBorderPopup()
        {
            if( ! lastSelection ) return;

            const pop  = document.getElementById( 'borderPopup' );

            // In menu mode the toolbar button is collapsed to a zero-height
            // sliver, so the menu row that ran the entry is the honest anchor.
            const rect = menus.anchorRect( '#fmtBorderBtn', CHROME.on(), 'menuBar' );

            pop.style.top  = ( rect.bottom + 4 ) + 'px';
            pop.style.left = rect.left + 'px';
            pop.classList.add( 'open' );

            // nudge back inside the viewport if the button sits near the right edge
            const pr = pop.getBoundingClientRect();
            if( pr.right > window.innerWidth - 8 )
                pop.style.left = Math.max( 8, window.innerWidth - 8 - pr.width ) + 'px';

            syncBorderPopupState();
        }

        function closeBorderPopup()
        {
            document.getElementById( 'borderPopup' ).classList.remove( 'open' );
        }

        // Reflects the sticky weight choice and the colour swatch in the popup.
        function syncBorderPopupState()
        {
            document.querySelectorAll( '#borderPopup [data-weight]' ).forEach( function( b )
            {
                b.classList.toggle( 'active', b.dataset.weight === borderWeight );
            });

            document.getElementById( 'borderColor' ).value = '#' + borderColorValue;
            document.getElementById( 'borderColorLabel' ).style.setProperty( '--border-bar', '#' + borderColorValue );
        }

        // Which sides a given cell in the selection gets, for the picked preset.
        function borderSidesFor( pos, r, c, sel )
        {
            switch( pos )
            {
                case 'all':
                    return [ 'top', 'right', 'bottom', 'left' ];

                case 'outer':
                {
                    const out = [];
                    if( r === sel.r1 ) out.push( 'top' );
                    if( r === sel.r2 ) out.push( 'bottom' );
                    if( c === sel.c1 ) out.push( 'left' );
                    if( c === sel.c2 ) out.push( 'right' );
                    return out;
                }

                case 'inner':
                {
                    const out = [];
                    if( r !== sel.r2 ) out.push( 'bottom' );
                    if( c !== sel.c2 ) out.push( 'right' );
                    return out;
                }

                case 'top':    return ( r === sel.r1 ) ? [ 'top' ]    : [];
                case 'bottom': return ( r === sel.r2 ) ? [ 'bottom' ] : [];
                case 'left':   return ( c === sel.c1 ) ? [ 'left' ]   : [];
                case 'right':  return ( c === sel.c2 ) ? [ 'right' ]  : [];

                default:       return [];
            }
        }

        function applyBorder( pos )
        {
            if( ! lastSelection ) { closeBorderPopup(); return; }

            const weight = borderWeight;
            const color  = borderColorValue;
            const sel    = lastSelection;

            for( let r = sel.r1; r <= sel.r2; r++ )
            {
                for( let c = sel.c1; c <= sel.c2; c++ )
                {
                    const addr = encodeCell( { r: r, c: c } );

                    if( pos === 'none' )
                    {
                        if( activeSheet.cellStyles[ addr ] ) delete activeSheet.cellStyles[ addr ].border;
                        continue;
                    }

                    const cur  = ( activeSheet.cellStyles[ addr ] && typeof activeSheet.cellStyles[ addr ].border === 'object' ) ? activeSheet.cellStyles[ addr ].border : {};
                    const next = { top: cur.top, right: cur.right, bottom: cur.bottom, left: cur.left };

                    borderSidesFor( pos, r, c, sel ).forEach( function( side ) { next[ side ] = true; } );

                    [ 'top', 'right', 'bottom', 'left' ].forEach( function( side ) { if( ! next[ side ] ) delete next[ side ]; } );

                    if( ! Object.keys( next ).length ) continue;   // this cell isn't on the picked edge

                    next.style = weight;
                    next.color = color;

                    activeSheet.cellStyles[ addr ] = activeSheet.cellStyles[ addr ] || {};
                    activeSheet.cellStyles[ addr ].border = next;
                }
            }

            table.render();
            updateToolbarActiveState();
            scheduleAutosave();
            closeBorderPopup();
        }

        //------------------------------------------------------------------------//
        // NUMBER-FORMAT DIALOG — each dropdown category except "General" opens here to
        // fine-tune the Excel format code stored in `activeSheet.cellStyles[*].numFmt` (rendered by
        // the SSF engine in styledRenderer, carried into xlsx by objToXlsxStyle).

        // Best-effort mapping of a stored format code back to a dropdown category, so the
        // control shows the right label as the selection moves between cells.
        function numFmtCategory( code )
        {
            if( ! code )              return 'general';
            if( /%/.test( code ) )    return 'porcentaje';

            const bare = code.replace( /"[^"]*"/g, '' );   // drop quoted literals first

            if( /[ymdhs]/i.test( bare ) && ! /[0#]/.test( bare ) ) return 'fecha';
            if( /["$€£¥]/.test( code ) )                           return 'moneda';

            return 'numero';
        }

        function openNumFmtDialog( cat )
        {
            if( ! lastSelection ) return;

            nfCategory = cat;

            document.getElementById( 'numFmtTitle' ).textContent =
            ({
                numero    : T( 'calc.fmtNumber' ),
                moneda    : T( 'calc.fmtCurrency' ),
                porcentaje: T( 'calc.fmtPercent' ),
                fecha     : T( 'calc.fmtDate' )
            })[ cat ] || T( 'calc.numFormat' );

            document.querySelectorAll( '#numFmtBackdrop .field[data-nf]' ).forEach( function( row )
            {
                row.style.display = ( row.dataset.nf.split( ' ' ).indexOf( cat ) !== -1 ) ? '' : 'none';
            });

            updateNumFmtPreview();
            NayiveUI.open( 'numFmtBackdrop' );
        }

        // Assembles an Excel number-format code from the dialog's current field values.
        function buildNumFmtCode()
        {
            const decimals = Number( document.getElementById( 'nfDecimals' ).value );
            const decPart  = decimals > 0 ? ( '.' + '0'.repeat( decimals ) ) : '';

            if( nfCategory === 'porcentaje' )
                return '0' + decPart + '%';

            if( nfCategory === 'fecha' )
                return document.getElementById( 'nfDatePattern' ).value;

            const thousands = document.getElementById( 'nfThousands' ).checked;
            const redNeg    = document.getElementById( 'nfRedNeg'    ).checked;

            let num = ( thousands ? '#,##0' : '0' ) + decPart;

            if( nfCategory === 'moneda' )
            {
                const sym = document.getElementById( 'nfCurrency'    ).value.trim() || '€';
                const pos = document.getElementById( 'nfCurrencyPos' ).value;

                num = ( pos === 'before' ) ? ( '"' + sym + '" ' + num ) : ( num + ' "' + sym + '"' );
            }

            // `[Red]-<code>` keeps the minus sign; a bare `[Red]<code>` negative section drops it.
            return redNeg ? ( num + ';[Red]-' + num ) : num;
        }

        function updateNumFmtPreview()
        {
            const code = buildNumFmtCode();
            const el   = document.getElementById( 'nfPreview' );

            // A negative sample so "Negativos en rojo" visibly changes the preview
            // (the SSF engine only returns text, so the red colour is applied here).
            const sample = ( nfCategory === 'fecha' )      ? NF_SAMPLE_DATE
                         : ( nfCategory === 'porcentaje' ) ? -0.1256
                                                           : -1234.56;

            try        { el.textContent = formatNumber( code, sample ); }
            catch( _ ) { el.textContent = code; }

            const redNeg = document.getElementById( 'nfRedNeg' ).checked && ( nfCategory === 'numero' || nfCategory === 'moneda' );
            el.style.color = redNeg ? 'var(--danger)' : '';
        }

        function confirmNumFmt()
        {
            setOrClearStyleField( 'numFmt', buildNumFmtCode() );
            NayiveUI.close( 'numFmtBackdrop' );
        }

        // Closing without applying must also put the dropdown back to the selected cell's
        // real category — the change event that opened the dialog already moved it off.
        function cancelNumFmt()
        {
            NayiveUI.close( 'numFmtBackdrop' );

            const anchor = lastSelection ? encodeCell( { r: lastSelection.r1, c: lastSelection.c1 } ) : null;
            const st     = anchor ? activeSheet.cellStyles[ anchor ] : null;

            document.getElementById( 'fmtNumFormat' ).value = numFmtCategory( st && st.numFmt );
        }

        //------------------------------------------------------------------------//
        // FUNCTION PICKER (fx) — a curated list of the functions HyperFormula already
        // executes; this only adds a way to browse/insert them without typing from memory.

        const FUNCTIONS =
        [
            { name: 'SUM',         desc: T( 'calc.fxSum' ) },
            { name: 'AVERAGE',     desc: T( 'calc.fxAverage' ) },
            { name: 'COUNT',       desc: T( 'calc.fxCount' ) },
            { name: 'COUNTA',      desc: T( 'calc.fxCounta' ) },
            { name: 'MAX',         desc: T( 'calc.fxMax' ) },
            { name: 'MIN',         desc: T( 'calc.fxMin' ) },
            { name: 'IF',          desc: T( 'calc.fxIf' ) },
            { name: 'IFERROR',     desc: T( 'calc.fxIfError' ) },
            { name: 'AND',         desc: T( 'calc.fxAnd' ) },
            { name: 'OR',          desc: T( 'calc.fxOr' ) },
            { name: 'NOT',         desc: T( 'calc.fxNot' ) },
            { name: 'SUMIF',       desc: T( 'calc.fxSumIf' ) },
            { name: 'COUNTIF',     desc: T( 'calc.fxCountIf' ) },
            { name: 'ROUND',       desc: T( 'calc.fxRound' ) },
            { name: 'ABS',         desc: T( 'calc.fxAbs' ) },
            { name: 'SQRT',        desc: T( 'calc.fxSqrt' ) },
            { name: 'POWER',       desc: T( 'calc.fxPower' ) },
            { name: 'CONCATENATE', desc: T( 'calc.fxConcat' ) },
            { name: 'LEN',         desc: T( 'calc.fxLen' ) },
            { name: 'TRIM',        desc: T( 'calc.fxTrim' ) },
            { name: 'UPPER',       desc: T( 'calc.fxUpper' ) },
            { name: 'LOWER',       desc: T( 'calc.fxLower' ) },
            { name: 'TODAY',       desc: T( 'calc.fxToday' ) },
            { name: 'NOW',         desc: T( 'calc.fxNow' ) },
            { name: 'VLOOKUP',     desc: T( 'calc.fxVlookup' ) },
            { name: 'INDEX',       desc: T( 'calc.fxIndex' ) },
            { name: 'MATCH',       desc: T( 'calc.fxMatch' ) }
        ];

        function openFxPicker()
        {
            if( ! lastSelection ) return;

            document.getElementById( 'fxSearch' ).value = '';
            renderFxList( '' );
            NayiveUI.open( 'fxBackdrop' );
            document.getElementById( 'fxSearch' ).focus();
        }

        function renderFxList( filterText )
        {
            const list = document.getElementById( 'fxList' );
            const q    = filterText.trim().toUpperCase();
            const rows = FUNCTIONS.filter( function( f ) { return ! q || f.name.indexOf( q ) !== -1; } );

            list.innerHTML = rows.length
                ? rows.map( function( f ) { return '<button type="button" class="fx-item" data-fn="' + f.name + '"><b>' + f.name + '</b><span>' + f.desc + '</span></button>'; } ).join( '' )
                : '<div class="fx-empty" data-i18n="calc.noFxMatch"></div>';
        }

        // Wraps the current selection as the function's argument when it spans more than
        // one cell (mirrors a common range like SUM(A1:A10)); a single-cell selection
        // just inserts empty parentheses for the user to fill in by hand.
        function insertFunction( name )
        {
            if( ! lastSelection ) return;

            const isRange = lastSelection.r1 !== lastSelection.r2 || lastSelection.c1 !== lastSelection.c2;
            const arg     = isRange
                ? encodeCell( { r: lastSelection.r1, c: lastSelection.c1 } ) + ':' + encodeCell( { r: lastSelection.r2, c: lastSelection.c2 } )
                : '';

            table.setDataAtCell( lastSelection.r1, lastSelection.c1, '=' + name + '(' + arg + ')' );

            NayiveUI.close( 'fxBackdrop' );
        }

        //------------------------------------------------------------------------//
        // THE LOSS GATE
        //
        // Calc rewrites the whole file on every save, out of a model that does not
        // hold everything an .xlsx can carry (see detectLossy). Until it does, the
        // honest move is to say so BEFORE the first write instead of quietly
        // dropping the user's charts. Raised once per open file, from the two
        // places a write can start: the debounced autosave and Ctrl+S.

        function lossyDialogIsOpen()
        {
            const el = document.getElementById( 'lossyBackdrop' );
            return !! el && el.classList.contains( 'open' );
        }

        // True = "do not write". Opens the dialog the first time it says so.
        function lossyBlocked()
        {
            if( ! doc.lossy.length || doc.lossyAck ) return false;

            if( ! lossyDialogIsOpen() )
            {
                const list = document.getElementById( 'lossyList' );
                list.innerHTML = doc.lossy.map( function( k )
                {
                    const li = document.createElement( 'li' );
                    li.textContent = T( k );
                    return li.outerHTML;
                } ).join( '' );

                NayiveUI.open( 'lossyBackdrop' );
            }

            return true;
        }

        function scheduleAutosave()
        {
            if( gridBooting ) return;     // drawing a file is not editing it — see initGrid
            if( readOnly ) return;        // someone else's sheet - never write over it
            if( ! currentPath ) return;   // untitled sheets must be named via "Guardar como" first
            if( lossyBlocked() ) return;  // the dialog decides; no timer is armed meanwhile

            clearTimeout( autosaveTimer );
            autosaveTimer = setTimeout( function() { autosaveTimer = null; writeCurrent( currentPath ); }, AUTOSAVE_DELAY_MS );
        }

        // Flushes an unsaved edit immediately — used when the tab is closed/hidden,
        // since the debounced autosave timer above would otherwise be lost with it.
        function flushPendingSave()
        {
            if( ! autosaveTimer || ! currentPath ) return Promise.resolve();

            clearTimeout( autosaveTimer );
            autosaveTimer = null;
            return writeCurrent( currentPath );
        }

        // Ctrl-S: save now. A shared (read-only) or untitled sheet goes to "Guardar como".
        function saveNow()
        {
            if( readOnly )
            {
                NayiveUI.toast( T( 'text.notYours' ) );
                openSaveAs();
                return;
            }
            if( ! currentPath ) { openSaveAs(); return; }

            clearTimeout( autosaveTimer );
            autosaveTimer = null;
            writeCurrent( currentPath );
        }

        document.addEventListener( 'visibilitychange', function() { if( document.visibilityState === 'hidden' ) flushPendingSave(); } );
        window.addEventListener( 'pagehide', flushPendingSave );

        // Re-skin the grid live when the shared colour scheme is toggled (from Drive / the launcher).
        window.addEventListener( 'balata:themechange', function()
        {
            if( ! table ) return;
            const name = htThemeName();
            document.getElementById( 'gridHost' ).className = name;
            table.useTheme( name );
            table.render();
        } );

        //------------------------------------------------------------------------//
        // OPEN  (the shared folder browser - shared/office.js - lists the files Calc
        // can open; see OPEN_EXTS)

        function isOpenable( path ) { return OPENABLE_EXTS.indexOf( O.extOf( path ) ) !== -1; }

        // Open a file the user picked: xlsx / csv directly, anything else
        // via a server-side conversion to .xlsx first.
        async function openPickedFile( path )
        {
            if( OPEN_EXTS.indexOf( O.extOf( path ) ) !== -1 )
            {
                await openDocument( path );
                return;
            }

            const nativePath = await convertForOpen( path );
            if( nativePath ) await openDocument( nativePath );
        }

        // Convert a non-native spreadsheet (LibreOffice Calc .ods, legacy .xls,
        // …) to .xlsx on the server, save it next to the original and return its
        // path. The LibreOffice-backed endpoint isn't deployed yet, so
        // CONVERT_EXTS is empty and this is never reached.
        async function convertForOpen( path )
        {
            NayiveUI.toast( T( 'write.formatUnsupported' ) + '.' );
            return null;
        }

        //------------------------------------------------------------------------//
        // DOCUMENT ACTIONS

        async function openDocument( path )
        {
            await flushPendingSave();   // don't lose a debounced autosave for the sheet we're leaving

            const res = await O.readViaStore( store, path );   // the store drives the sync dot; toasts on trouble
            if( res.body === null ) return;

            let d;

            try { d = await decodeToDoc( res.body, O.extOf( path ) ); }
            catch( _ )
            {
                setSyncStatus( 'error' );
                NayiveUI.toast( T( 'ui.openFailed' ) );
                return;
            }

            currentPath = path;
            readOnly    = NayiveUI.isShared( path );
            fileLabel.set( O.relLabel( path, APP_DIR, OPEN_ROOT ) + ( readOnly ? T( 'text.readOnlySuffix' ) : '' ) );
            initGrid( d );
        }

        function openSaveAs()
        {
            const name = currentPath ? O.baseName( currentPath ) : ( pendingName || 'hoja.xlsx' );
            const ext  = O.extOf( name );

            document.getElementById( 'saveName'   ).value = name;
            document.getElementById( 'saveFormat' ).value = OPEN_EXTS.indexOf( ext ) !== -1 ? ext : 'xlsx';

            // Someone else's sheet: our copy goes to a folder of ours, never back
            // to the folder of theirs it was read from.
            dirField.set( ( ! readOnly && currentPath && O.dirName( currentPath ) ) || APP_DIR );

            NayiveUI.open( 'saveAsBackdrop' );
            document.getElementById( 'saveName' ).focus();
            document.getElementById( 'saveName' ).select();
        }

        async function confirmSaveAs()
        {
            let   name = O.safeName( document.getElementById( 'saveName' ).value );
            const fmt  = document.getElementById( 'saveFormat' ).value;

            if( ! name ) return;

            if( ! new RegExp( '\\.' + fmt + '$', 'i' ).test( name ) )
                name += '.' + fmt;

            NayiveUI.close( 'saveAsBackdrop' );
            await saveAs( dirField.get() + '/' + name );
        }

        // Write the grid to `path` and make that the open sheet.
        async function saveAs( path )
        {
            await flushPendingSave();   // finish any autosave to the old name before we change identity

            await writeCurrent( path );

            currentPath = path;
            readOnly    = false;
            pendingName = null;
            fileLabel.set( O.relLabel( path, APP_DIR, OPEN_ROOT ) );

            // What we just wrote came out of Calc's own model, so it holds nothing
            // the next save could destroy. The original keeps its charts.
            doc.lossy    = [];
            doc.lossyAck = false;
        }

        async function writeCurrent( path )
        {
            // The hard stop. Ctrl+S and the pagehide flush both reach here without
            // going through scheduleAutosave. Writing somewhere NEW is always let
            // through — that is exactly the "save a copy" way out of the dialog.
            if( path === currentPath && lossyBlocked() ) return;

            let bytes;

            // Only the encoding can fail here - a bad grid, an unsupported
            // format. The write itself cannot: store.write caches the bytes and
            // queues the PUT before it even tries the network, then drives the
            // sync dot through store.onState. A dead session or a lost
            // connection leaves the write in the outbox, which is exactly what
            // saves the user's work.
            try { bytes = await encodeFromGrid( O.extOf( path ) ); }
            catch( _ )
            {
                setSyncStatus( 'error' );
                NayiveUI.toast( T( 'calc.saveFileFailed' ) );
                return;
            }

            await store.write( path, bytes );
        }

        //------------------------------------------------------------------------//
        // FORMAT CODECS (xlsx / csv via xlsx-format)
        //
        // Unlike the plain-AOA approach, this bridge carries formulas, cell styling
        // (bold, colors, alignment) and merged cells both ways — not just raw values.
        // Formulas ride through the cell's raw source value as a leading '=' string,
        // which Handsontable's Formulas plugin (HyperFormula) auto-detects, and
        // getSourceData() hands back the same way on save (getData() would return
        // the *computed* value instead).
        //
        // Known gap: xlsx-format has no "xls"/"ods" support (xlsx/xlsm/csv/tsv/html
        // only — dropped ODS import/export when we switched off SheetJS).
        // Italic/underline were added to the vendored codec's font read/write path
        // (lib/xlsx-format_v2.4.1.js: parseFonts, normalizeFont, writeFont) so they
        // round-trip like bold — the library's original xlsx.js/SheetJS lineage only
        // ever wrote <b/>, not <i/>/<u/>.

        // What a save would destroy. Each entry is an i18n key; the gate in
        // scheduleAutosave / writeCurrent turns them into one plain-language
        // dialog. Two sources: the parsed workbook, for the things the codec
        // does model, and the raw zip parts, for the things it silently drops.
        function detectLossy( wb )
        {
            const lossy = [];

            const zip = wb._zip;
            if( ! zip || ! zip.files ) return lossy;

            const names = Object.keys( zip.files );
            const has   = function( frag ) { return names.some( function( n ) { return n.indexOf( frag ) !== -1; } ); };

            // Charts, the drawings and pictures they sit on, tables, conditional
            // formatting and data validation are all carried over verbatim now
            // (see captureRawSheet and the codec's preserveSourceParts), so they
            // are deliberately NOT listed here. What is left is what a save still
            // destroys.
            //
            // Pivot tables hang off the workbook, not off a sheet: their caches
            // live in xl/pivotCache/ and are wired up in workbook.xml.rels, which
            // Calc rewrites. Same for links out to another workbook.
            if( has( 'xl/pivotCache' ) || has( 'xl/pivotTables' ) ) lossy.push( 'calc.lossyPivots' );
            if( has( 'xl/externalLinks/' ) )                        lossy.push( 'calc.lossyLinks' );

            const dec = new TextDecoder();
            let sheetXml = '';
            names.forEach( function( n )
            {
                if( n.indexOf( 'xl/worksheets/sheet' ) === 0 ) sheetXml += dec.decode( zip.files[ n ] );
            });

            if( sheetXml.indexOf( '<sheetProtection' ) !== -1 ) lossy.push( 'calc.lossyProtection' );

            return lossy;
        }

        // Excel and the grid measure the same things in different units, so every
        // width and height crosses these four functions and nowhere else.
        //   column width : Excel counts '0' characters of the default font (7px each,
        //                  plus 5px of cell padding); Handsontable counts pixels.
        //   row height   : Excel counts points; Handsontable counts pixels (96/72).
        const colCharsToPx = function( ch ) { return Math.round( ch * 7 ) + 5; };
        const colPxToChars = function( px ) { return Math.max( 0, ( px - 5 ) / 7 ); };
        const rowPtToPx    = function( pt ) { return Math.round( pt / 0.75 ); };
        const rowPxToPt    = function( px ) { return px * 0.75; };

        const DEFAULT_COL_PX = 100;

        // The relationship types of the parts Calc keeps but cannot model.
        const REL_DRAWING = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing';
        const REL_TABLE   = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/table';

        // Which file in the archive holds which sheet. The names are in workbook.xml
        // and the file paths behind them in workbook.xml.rels — sheet order and file
        // numbering do not have to agree, so this reads the mapping rather than
        // assuming sheet 2 lives in sheet2.xml.
        function sheetPartsByName( zip )
        {
            const out = {};
            if( ! zip || ! zip.files ) return out;

            const dec  = new TextDecoder();
            const book = zip.files[ 'xl/workbook.xml' ];
            const rels = zip.files[ 'xl/_rels/workbook.xml.rels' ];
            if( ! book || ! rels ) return out;

            const target = {};
            String( dec.decode( rels ) ).replace( /<Relationship\b[^>]*>/g, function( tag )
            {
                const id = /Id="([^"]+)"/.exec( tag );
                const tg = /Target="([^"]+)"/.exec( tag );
                if( id && tg ) target[ id[ 1 ] ] = tg[ 1 ].replace( /^\//, '' ).replace( /^(?!xl\/)/, 'xl/' );
                return tag;
            } );

            String( dec.decode( book ) ).replace( /<sheet\b[^>]*>/g, function( tag )
            {
                const nm = /name="([^"]*)"/.exec( tag );
                const id = /r:id="([^"]+)"/.exec( tag );
                if( nm && id && target[ id[ 1 ] ] ) out[ decodeXmlText( nm[ 1 ] ) ] = target[ id[ 1 ] ];
                return tag;
            } );

            return out;
        }

        function decodeXmlText( t )
        {
            return String( t ).replace( /&lt;/g, '<' ).replace( /&gt;/g, '>' )
                              .replace( /&quot;/g, '"' ).replace( /&apos;/g, "'" )
                              .replace( /&amp;/g, '&' );
        }

        // The bits of a sheet Calc keeps verbatim because it has no model for them:
        // the conditional-formatting and data-validation blocks, and the parts the
        // sheet points at (the drawing its charts and pictures live on, its tables).
        function captureRawSheet( zip, partPath )
        {
            if( ! zip || ! zip.files || ! partPath || ! zip.files[ partPath ] ) return null;

            const dec = new TextDecoder();
            const xml = dec.decode( zip.files[ partPath ] );
            const raw = { cf: '', dv: '', refs: [] };

            ( xml.match( /<conditionalFormatting[\s>][\s\S]*?<\/conditionalFormatting>/g ) || []
            ).forEach( function( frag ) { raw.cf += frag; } );

            const dv = /<dataValidations[\s>][\s\S]*?<\/dataValidations>/.exec( xml );
            if( dv ) raw.dv = dv[ 0 ];

            // Sheet-level <extLst> is deliberately NOT carried: it holds x14 blocks
            // whose namespace prefixes are declared on the source's <worksheet> root,
            // and Calc writes its own root. Copying it would make the file invalid.

            const i = partPath.lastIndexOf( '/' );
            const relsPath = partPath.slice( 0, i + 1 ) + '_rels/' + partPath.slice( i + 1 ) + '.rels';
            const relsBuf  = zip.files[ relsPath ];
            if( relsBuf )
            {
                const byId = {};
                String( dec.decode( relsBuf ) ).replace( /<Relationship\b[^>]*>/g, function( tag )
                {
                    const id = /Id="([^"]+)"/.exec( tag );
                    const tg = /Target="([^"]+)"/.exec( tag );
                    const ty = /Type="([^"]+)"/.exec( tag );
                    if( id && tg && ty ) byId[ id[ 1 ] ] = { target: tg[ 1 ], type: ty[ 1 ] };
                    return tag;
                } );

                // A .rels Target is usually RELATIVE to the part that owns it
                // ("../drawings/drawing1.xml"), and only sometimes absolute. Resolve
                // it to one absolute archive path: it is both the key the part is
                // copied under and a Target the writer can emit as-is.
                const resolvePart = function( target )
                {
                    if( target.charAt( 0 ) === '/' ) return target.slice( 1 );

                    const base = partPath.slice( 0, partPath.lastIndexOf( '/' ) + 1 ).split( '/' ).filter( Boolean );
                    target.split( '/' ).forEach( function( seg )
                    {
                        if( seg === '.' || seg === '' ) return;
                        if( seg === '..' ) base.pop();
                        else base.push( seg );
                    });
                    return base.join( '/' );
                };

                const take = function( re, tag, type )
                {
                    let m;
                    while( ( m = re.exec( xml ) ) !== null )
                    {
                        const rel = byId[ m[ 1 ] ];
                        if( ! rel || rel.type !== type ) continue;

                        const part = resolvePart( rel.target );

                        // Never point at something we cannot actually copy: a
                        // relationship to a missing part makes the file unreadable.
                        if( ! zip.files[ part ] ) continue;

                        raw.refs.push( { tag: tag, target: '/' + part, type: type } );
                    }
                };

                take( /<drawing[^>]*r:id="([^"]+)"/g,   'drawing',   REL_DRAWING );
                take( /<tablePart[^>]*r:id="([^"]+)"/g, 'tablePart', REL_TABLE );
            }

            return ( raw.cf || raw.dv || raw.refs.length ) ? raw : null;
        }

        // Turn one parsed worksheet into a sheet entry (see THE OPEN WORKBOOK).
        function worksheetToSheet( ws, name )
        {
            const sh    = newSheet( name );
            const range = ws[ '!ref' ] ? decodeRange( ws[ '!ref' ] ) : { s: { r: 0, c: 0 }, e: { r: 0, c: 0 } };

            sh.data = [];

            // ALWAYS start at A1, whatever the used range says. A sheet whose content
            // begins at, say, B2 has a !ref of "B2:H12", and reading from there while
            // pushing rows into a plain array put file cell B2 at grid cell A1 — the
            // whole sheet slid one row up and one column left, and everything keyed by
            // address (styles, notes, column widths, merges, hidden columns) then
            // pointed at the wrong cells. Saving wrote the shifted copy back. Most
            // real spreadsheets have a blank first row or column, so this was the
            // common case, not the odd one.
            const endRow = Math.max( 0, range.e.r );
            const endCol = Math.max( 0, range.e.c );

            for( let r = 0; r <= endRow; r++ )
            {
                const row = [];

                for( let c = 0; c <= endCol; c++ )
                {
                    const addr = encodeCell( { r: r, c: c } );
                    const cell = ws[ addr ];

                    row.push( cellToValue( cell ) );

                    const style = xlsxStyleToObj( cell && cell.s );
                    if( style ) sh.cellStyles[ addr ] = style;

                    // A note and a link are cell facts the grid can show, so they
                    // belong on the sheet entry like everything else.
                    if( cell && cell.c && cell.c.length ) sh.comments[ addr ] = cell.c.map( function( n ) { return n.t || ''; } ).join( '\n' ).trim();
                    if( cell && cell.l && cell.l.Target ) sh.links[ addr ] = { target: cell.l.Target, tooltip: cell.l.Tooltip || '' };
                }

                sh.data.push( row );
            }

            sh.merges = ( ws[ '!merges' ] || [] ).map( function( rng )
            {
                return { row: rng.s.r, col: rng.s.c, rowspan: rng.e.r - rng.s.r + 1, colspan: rng.e.c - rng.s.c + 1 };
            });

            // Column widths and hidden columns share one array in the file.
            ( ws[ '!cols' ] || [] ).forEach( function( col, i )
            {
                if( ! col ) return;
                if( col.width  ) { sh.cols[ i ] = colCharsToPx( col.width ); sh.colsSrc[ i ] = col.width; }
                if( col.hidden ) sh.hiddenCols.push( i );
            });

            ( ws[ '!rows' ] || [] ).forEach( function( row, r )
            {
                if( ! row ) return;
                if( row.hpt    ) { sh.rows[ r ] = rowPtToPx( row.hpt ); sh.rowsSrc[ r ] = row.hpt; }
                if( row.hidden ) sh.hiddenRows.push( r );
            });

            // A frozen pane is a split with state 'frozen'; xSplit/ySplit count the
            // columns/rows held still on the left/top.
            const view = ( ws[ '!views' ] || [] ).filter( function( v ) { return v && v.state === 'frozen'; } )[ 0 ];
            if( view ) sh.freeze = { rows: view.ySplit || 0, cols: view.xSplit || 0 };

            // Carried through untouched: the codec models both, and rebuilding the
            // worksheet from scratch would otherwise drop them.
            sh.autofilter = ws[ '!autofilter' ] || null;
            sh.margins    = ws[ '!margins' ]    || null;

            return sh;
        }

        // Read a file into the workbook model. Still one sheet on the grid — the
        // tabs come later — but the doc shape, the source bytes and the loss list
        // are all in place from here on.
        async function decodeToDoc( buf, ext )
        {
            const wb = await read( buf, { type: 'array', cellFormula: true, cellStyles: true, keepZip: true } );

            const d = newDoc();

            d.srcZip = wb._zip || null;
            d.lossy  = detectLossy( wb );

            d.names = ( wb.Workbook && wb.Workbook.Names ) || null;

            const names = ( wb.SheetNames && wb.SheetNames.length ) ? wb.SheetNames : [ 'Hoja1' ];
            const state = ( wb.Workbook && wb.Workbook.Sheets ) || [];

            const parts = sheetPartsByName( d.srcZip );

            d.sheets = names.map( function( name, i )
            {
                const sh = worksheetToSheet( wb.Sheets[ name ] || {}, name );
                sh.hidden = ( state[ i ] && state[ i ].Hidden ) || 0;
                sh.raw    = captureRawSheet( d.srcZip, parts[ name ] );
                return sh;
            });

            // Open on the first sheet the user can actually see.
            d.active = Math.max( 0, d.sheets.findIndex( function( sh ) { return ! sh.hidden; } ) );

            return d;
        }

        // Copy everything the grid owns back onto the active sheet entry. Called
        // before a save and before leaving a sheet — after it, every sheet in the
        // document is described the same way and nothing depends on the grid.
        function stashActiveSheet()
        {
            if( ! table ) return;

            activeSheet.data   = table.getSourceData().map( function( row ) { return row.slice(); } );
            activeSheet.values = table.getData();     // HyperFormula's answers, for the cached <v>

            activeSheet.hiddenCols = ( table.getPlugin( 'hiddenColumns' ).getHiddenColumns() || [] ).slice();
            activeSheet.hiddenRows = ( table.getPlugin( 'hiddenRows'    ).getHiddenRows()    || [] ).slice();

            const set = table.getSettings();
            activeSheet.freeze = { rows: set.fixedRowsTop || 0, cols: set.fixedColumnsStart || 0 };

            activeSheet.comments = {};
            ( table.getCellsMeta() || [] ).forEach( function( meta )
            {
                if( meta && meta.comment && meta.comment.value )
                    activeSheet.comments[ encodeCell( { r: meta.row, c: meta.col } ) ] = meta.comment.value;
            });
        }

        function formulaEngine()
        {
            const plugin = table && table.getPlugin( 'formulas' );
            return ( plugin && plugin.engine ) || null;
        }

        // Handsontable hands HyperFormula only the sheet it is showing. Every OTHER
        // sheet has to be put in by hand or a cross-sheet formula — ='Notas'!A1 —
        // resolves to #REF, and that is most of the point of holding several sheets.
        function registerSheetsInEngine()
        {
            const hf = formulaEngine();
            if( ! hf ) return;

            doc.sheets.forEach( function( sh, i )
            {
                if( i === doc.active ) return;   // the grid's own sheet is already in

                try
                {
                    if( ! hf.doesSheetExist( sh.name ) ) hf.addSheet( sh.name );
                    hf.setSheetContent( hf.getSheetId( sh.name ), sh.data );
                }
                catch( _ ) { /* a name HyperFormula refuses is not worth losing the file over */ }
            });
        }

        // The computed values of a sheet that is not on screen, for its cached <v>.
        function engineValues( sh )
        {
            const hf = formulaEngine();
            if( ! hf ) return null;

            try { return hf.getSheetValues( hf.getSheetId( sh.name ) ); }
            catch( _ ) { return null; }
        }

        // One sheet entry -> one worksheet. Reads nothing but `sh`, so the sheet
        // being written does not have to be the one on screen.
        function sheetToWorksheet( sh )
        {
            const aoa = sh.data || [];
            const out = sh.values || engineValues( sh ) || [];

            const ws = {};

            let maxRow = 0;
            let maxCol = 0;

            aoa.forEach( function( row, r )
            {
                row.forEach( function( raw, c )
                {
                    if( raw === '' || raw == null ) return;

                    const addr  = encodeCell( { r: r, c: c } );
                    const cell  = valueToCell( raw );
                    const style = objToXlsxStyle( sh.cellStyles[ addr ] );

                    // A formula is written with its last result beside it. Excel
                    // recalculates on open and never notices, but anything that
                    // trusts the stored value — LibreOffice's converters, a
                    // preview pane, a script reading the file — showed 0 for every
                    // formula in the sheet without this.
                    if( cell.f ) cacheFormulaResult( cell, out[ r ] && out[ r ][ c ] );

                    if( style ) cell.s = style;

                    ws[ addr ] = cell;

                    if( r > maxRow ) maxRow = r;
                    if( c > maxCol ) maxCol = c;
                });
            });

            // A cell can hold nothing but a fill, a border or a merge anchor. The loop
            // above skips empty values, so those cells used to reach the file with no
            // style at all — the colours and boxes a user painted simply vanished.
            Object.keys( sh.cellStyles ).forEach( function( addr )
            {
                if( ws[ addr ] ) return;

                const style = objToXlsxStyle( sh.cellStyles[ addr ] );
                if( ! style ) return;

                const rc = decodeCell( addr );
                ws[ addr ] = { t: 's', v: '', s: style };

                if( rc.r > maxRow ) maxRow = rc.r;
                if( rc.c > maxCol ) maxCol = rc.c;
            });

            // Hyperlinks. The codec grew a writer for these (writeWorksheetXml), so
            // the model's links go back onto the cells and out to the file.
            Object.keys( sh.links ).forEach( function( addr )
            {
                const link = sh.links[ addr ];
                if( ! link || ! link.target ) return;

                // A link can sit on a cell with no value of its own.
                if( ! ws[ addr ] ) ws[ addr ] = { t: 's', v: '' };

                ws[ addr ].l = link.tooltip ? { Target: link.target, Tooltip: link.tooltip }
                                            : { Target: link.target };
            });

            // The file keeps notes as a list of [address, [note, …]] pairs, and the
            // '!legacy' flag is what makes the VML part Excel needs get written.
            const notes = Object.keys( sh.comments ).map( function( addr )
            {
                return [ addr, [ { t: sh.comments[ addr ], a: 'Calc' } ] ];
            });

            if( notes.length )
            {
                ws[ '!comments' ] = notes;
                ws[ '!legacy' ]   = true;
            }

            ws[ '!ref' ] = encodeRange( { s: { r: 0, c: 0 }, e: { r: maxRow, c: maxCol } } );

            if( sh.merges.length )
            {
                ws[ '!merges' ] = sh.merges.map( function( m )
                {
                    return { s: { r: m.row, c: m.col }, e: { r: m.row + m.rowspan - 1, c: m.col + m.colspan - 1 } };
                });
            }

            // Column widths / row heights / hidden flags, back into the two arrays
            // the file format keeps them in. Read the hidden lists off the plugins,
            // not off the sheet entry, so a hide/show made during this session counts.
            const hiddenCols = sh.hiddenCols;
            const hiddenRows = sh.hiddenRows;
            const cols = [];
            const rows = [];

            for( let c = 0; c <= Math.max( maxCol, sh.cols.length - 1 ); c++ )
            {
                const px     = sh.cols[ c ];
                const hidden = hiddenCols.indexOf( c ) !== -1;
                if( ! px && ! hidden ) continue;

                // An untouched column goes back with the exact figure it came in
                // with; only a column the user actually dragged is recomputed.
                const chars = ( sh.colsSrc[ c ] != null ) ? sh.colsSrc[ c ]
                                                                   : colPxToChars( px || DEFAULT_COL_PX );
                cols[ c ] = hidden ? { width: chars, hidden: true } : { width: chars };
            }
            for( let r = 0; r <= Math.max( maxRow, sh.rows.length - 1 ); r++ )
            {
                const px     = sh.rows[ r ];
                const hidden = hiddenRows.indexOf( r ) !== -1;
                if( ! px && ! hidden ) continue;

                const hpt = ( sh.rowsSrc[ r ] != null ) ? sh.rowsSrc[ r ]
                                                                 : rowPxToPt( px || 20 );
                rows[ r ] = hidden ? { hpt: hpt, hidden: true } : { hpt: hpt };
            }

            if( cols.length ) ws[ '!cols' ] = cols;
            if( rows.length ) ws[ '!rows' ] = rows;

            const fr = sh.freeze.rows;
            const fc = sh.freeze.cols;
            if( fr || fc ) ws[ '!views' ] = [ { state: 'frozen', xSplit: fc, ySplit: fr } ];

            if( sh.autofilter ) ws[ '!autofilter' ] = sh.autofilter;
            if( sh.margins )    ws[ '!margins' ]    = sh.margins;
            if( sh.raw )        ws[ '!raw' ]        = sh.raw;

            // The sheet keeps the name it was opened with. createWorkbook used to be
            // handed a hard-coded 'Sheet1', so every file came back renamed.
            return ws;
        }

        async function encodeFromGrid( ext )
        {
            stashActiveSheet();

            // Every sheet the file arrived with goes back into it, in order and
            // under its own name. Only the active one has a grid behind it; the
            // rest are written straight out of the model.
            const wb = createWorkbook( null );

            doc.sheets.forEach( function( sh )
            {
                appendSheet( wb, sheetToWorksheet( sh ), sh.name || 'Hoja1' );
            });

            // A sheet hidden in the original stays hidden.
            const sheetState = doc.sheets.map( function( sh ) { return { Hidden: sh.hidden || 0 }; } );

            const bookType = ( ext === 'csv' ) ? 'csv' : 'xlsx';

            // Named ranges are workbook-level, so they hang off the workbook, not
            // the sheet. A formula like =SUMA(Ventas) breaks without them.
            //
            // Only the ones that still point at a sheet we are writing, though: a
            // name reading 'Notas'!$A$1 in a file we are saving without the Notas
            // sheet is a dangling reference, and Excel offers to repair the file
            // over it. Names with no sheet qualifier always travel.
            const names = ( doc.names || [] ).filter( function( n )
            {
                if( ! n || ! n.Ref ) return false;

                const m = /^'?([^'!]+)'?!/.exec( n.Ref );
                if( ! m ) return true;

                return doc.sheets.some( function( sh ) { return sh.name === m[ 1 ]; } );
            });

            wb.Workbook = { Sheets: sheetState };
            if( names.length ) wb.Workbook.Names = names;

            return await write( wb, { type: 'array', bookType: bookType, cellStyles: true,
                                      preserve: doc.srcZip } );
        }

        function cellToValue( cell )
        {
            if( ! cell ) return '';
            if( cell.f ) return '=' + cell.f;
            if( cell.t === 'd' && cell.w ) return cell.w;
            return cell.v === undefined ? '' : cell.v;
        }

        // Put HyperFormula's answer into the cell as the cached <v>. Errors are left
        // out on purpose: a stale "#DIV/0!" written as a value would outlive the
        // condition that caused it.
        function cacheFormulaResult( cell, value )
        {
            if( value === null || value === undefined || value === '' ) return;

            if( typeof value === 'number'  && isFinite( value ) ) { cell.t = 'n'; cell.v = value; return; }
            if( typeof value === 'boolean' )                      { cell.t = 'b'; cell.v = value; return; }

            const text = String( value );
            if( text.charAt( 0 ) === '#' ) return;      // an error result, not a value

            cell.t = 's';
            cell.v = text;
        }

        function valueToCell( raw )
        {
            if( typeof raw === 'string' && raw.startsWith( '=' ) && raw.length > 1 )
                return { t: 'n', f: raw.slice( 1 ) };

            if( typeof raw === 'number'  ) return { t: 'n', v: raw };
            if( typeof raw === 'boolean' ) return { t: 'b', v: raw };

            return { t: 's', v: String( raw ) };
        }

        function xlsxStyleToObj( s )
        {
            if( ! s ) return null;

            const o = {};

            if( s.font )
            {
                if( s.font.bold )                      o.bold       = true;
                if( s.font.italic )                     o.italic     = true;
                if( s.font.underline )                  o.underline  = true;
                if( s.font.name )                       o.fontFamily = s.font.name;
                if( s.font.size )                       o.size       = s.font.size;
                if( s.font.color && s.font.color.rgb )  o.color      = s.font.color.rgb.slice( -6 ).toUpperCase();
            }

            if( s.fill && s.fill.fgColor && s.fill.fgColor.rgb )
                o.bg = s.fill.fgColor.rgb.slice( -6 ).toUpperCase();

            if( s.alignment && s.alignment.horizontal ) o.align  = s.alignment.horizontal;
            if( s.alignment && s.alignment.vertical )   o.valign = s.alignment.vertical;
            if( s.alignment && s.alignment.wrapText )   o.wrap   = true;

            if( s.numFmt ) o.numFmt = s.numFmt;

            // Border round-trips per side, with a thin/medium weight and an optional colour —
            // matching what the toolbar's border dialog can set. The vendored codec only
            // handles 'thin'/'medium', so a heavier weight a source file carries is coerced.
            if( s.border )
            {
                const b = {};

                [ 'top', 'right', 'bottom', 'left' ].forEach( function( side )
                {
                    const bs = s.border[ side ];
                    if( ! bs || ! bs.style ) return;

                    b[ side ] = true;
                    b.style   = ( bs.style === 'medium' ) ? 'medium' : 'thin';
                    if( bs.color && bs.color.rgb ) b.color = bs.color.rgb.slice( -6 ).toUpperCase();
                });

                if( Object.keys( b ).length ) o.border = b;
            }

            return Object.keys( o ).length ? o : null;
        }

        function objToXlsxStyle( o )
        {
            if( ! o ) return null;

            const style = {};

            if( o.bold || o.italic || o.underline || o.size || o.color || o.fontFamily )
            {
                style.font = {};
                if( o.bold )       style.font.bold      = true;
                if( o.italic )     style.font.italic    = true;
                if( o.underline )  style.font.underline = true;
                if( o.fontFamily ) style.font.name       = o.fontFamily;
                if( o.size )        style.font.size       = o.size;
                if( o.color )       style.font.color      = { rgb: o.color };
            }

            if( o.bg ) style.fill = { patternType: 'solid', fgColor: { rgb: o.bg } };

            if( o.align || o.valign || o.wrap )
            {
                style.alignment = {};
                if( o.align )  style.alignment.horizontal = o.align;
                if( o.valign ) style.alignment.vertical   = o.valign;
                if( o.wrap )   style.alignment.wrapText   = true;
            }

            if( o.numFmt ) style.numFmt = o.numFmt;

            if( o.border && typeof o.border === 'object' )
            {
                const side = { style: o.border.style || 'thin' };
                if( o.border.color ) side.color = { rgb: o.border.color };

                style.border = {};
                if( o.border.top )    style.border.top    = side;
                if( o.border.right )  style.border.right  = side;
                if( o.border.bottom ) style.border.bottom = side;
                if( o.border.left )   style.border.left   = side;
            }
            else if( o.border )   // legacy boolean from an older save
            {
                const side = { style: 'thin' };
                style.border = { top: side, right: side, bottom: side, left: side };
            }

            return Object.keys( style ).length ? style : null;
        }

        //------------------------------------------------------------------------//
        // PULL-DOWN MENUS
        //
        // Calc has TWO chromes and the user picks one: the icon toolbar it always
        // had, or the classic "Archivo · Edición · Ver · Insertar · Formato ·
        // Datos · Ayuda" bar of the old spreadsheets. Two header buttons switch
        // between them (.chrome-btn) and the choice is remembered - in this
        // browser and in the account, so another device opens the same way.
        //
        // THE GOLDEN RULE: a menu entry never re-implements anything. It clicks
        // the real (collapsed) toolbar button, or calls the very function that
        // button is wired to. So there is still ONE set of handlers, exactly as
        // the phone's "⋮" menu does it.
        //
        // The bar, the panels, the hover-to-slide behaviour and the switch itself
        // all live in shared/menubar.js - Write uses the same code. What is here
        // is only Calc's own table of menus.

        const CALC_CFG = 'data/calc/config.json';

        async function readCalcCfg()
        {
            try { return ( await GumApi.readJson( CALC_CFG ) ) || {}; }
            catch( _ ) { return {}; }
        }

        async function writeCalcCfg( patch )
        {
            const cfg = await readCalcCfg();
            Object.assign( cfg, patch );
            try { await GumApi.writeJson( CALC_CFG, cfg ); } catch( _ ) {}
            return cfg;
        }

        // The key combos shown on the right of an entry. Calc's shortcuts are the
        // handful wired in wireStaticUI() plus the ones Handsontable itself
        // handles (copy / cut / paste, undo / redo).
        const MOD = navigator.platform.indexOf( 'Mac' ) === 0 ? '⌘' : 'Ctrl+';
        const SC  =
        {
            save: MOD + 'S', bold: MOD + 'B', italic: MOD + 'I', underline: MOD + 'U',
            undo: MOD + 'Z', redo: MOD + 'Y', cut: MOD + 'X', copy: MOD + 'C', paste: MOD + 'V'
        };

        // The style of the cell the selection is anchored on - the same one the
        // toolbar reads to light its buttons up, so a tick and a lit button can
        // never disagree.
        function selStyle()
        {
            if( ! lastSelection ) return null;
            return activeSheet.cellStyles[ encodeCell( { r: lastSelection.r1, c: lastSelection.c1 } ) ] || null;
        }

        function styleOn( field, value )
        {
            return function()
            {
                const st = selStyle();
                if( ! st ) return false;
                return value === undefined ? !! st[ field ] : st[ field ] === value;
            };
        }

        function haveSelection() { return !! lastSelection; }
