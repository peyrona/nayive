<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Machines PoC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../client/apps/shared/ayni/ayni-base.css">
<style>
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
                 font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
    #app       { height: 100dvh; display: grid; grid-template: auto 1fr auto / 1fr; }
    header     { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--card);
                 border-bottom: 1px solid var(--line); min-width: 0; }
    h1         { font-size: 16px; margin: 0; white-space: nowrap; }
    select, .act { font: inherit; font-size: 14px; color: var(--text); background: var(--card2);
                 border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 12px; }
    select     { min-width: 44px; width: 0; flex: 1 1 60px; max-width: 340px; }
    .act       { flex: 0 0 auto; cursor: pointer; }
    .act.go    { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
    .act[hidden] { display: none; }
    .gap       { flex: 1 1 0; }
    #stage     { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
    canvas     { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    #note      { position: absolute; left: 8px; top: 8px; right: 8px; pointer-events: none; font-size: 14px; }
    #note span { display: inline-block; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
    #note span:empty { display: none; }
    #meters    { position: absolute; left: 8px; bottom: 6px; pointer-events: none; font: 11px ui-monospace, monospace;
                 color: var(--text-dim); }
    #win       { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none;
                 background: var(--ok); color: var(--card2); font-size: 20px; font-weight: 600;
                 padding: 10px 22px; border-radius: 10px; white-space: nowrap; }
    #win[hidden] { display: none; }
    #tools     { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
                 background: var(--card); border-top: 1px solid var(--line); justify-content: center; }
    #tools.off { opacity: .45; pointer-events: none; }
    .tool      { position: relative; width: 60px; height: 50px; padding: 2px 0 0; font: inherit; font-size: 11px;
                 color: var(--text-dim); background: transparent; border: 1px solid transparent; border-radius: 8px;
                 cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tool svg  { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2;
                 stroke-linecap: round; stroke-linejoin: round; }
    .tool[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
    .tool[hidden] { display: none; }
    .tool i    { position: absolute; top: 1px; right: 4px; font-style: normal; font-size: 10px; }
    @media (max-width: 520px)
    {
        h1     { display: none; }
        header { gap: 4px; }
        .act   { padding: 0 8px; }
        .gap   { display: none; }
    }
    @media (orientation: landscape) and (max-height: 520px)
    {
        #app   { grid-template: auto 1fr / auto 1fr; }
        header { grid-column: 1 / -1; padding: 2px 8px; }
        h1     { display: none; }
        #tools { grid-row: 2; grid-column: 1; width: 124px; align-content: flex-start; overflow-y: auto;
                 border-top: 0; border-right: 1px solid var(--line); padding: 4px; touch-action: pan-y; }
        #stage { grid-row: 2; grid-column: 2; }
    }
</style>
</head>
<body>
<div id="app">
    <header>
        <h1>Machines</h1>
        <select id="scene" aria-label="Test room"></select>
        <button class="act" id="solution">Solution</button>
        <button class="act" id="clear">Clear</button>
        <span class="gap"></span>
        <button class="act" id="pause" hidden>Pause</button>
        <button class="act go" id="run">Run</button>
    </header>
    <div id="stage">
        <canvas id="view" aria-label="Machine building board"></canvas>
        <div id="note"><span id="noteText"></span></div>
        <div id="meters"></div>
        <div id="win" hidden></div>
    </div>
    <nav id="tools" aria-label="Pieces"></nav>
</div>
<script src="vendor/nape.min.js"></script>
<script src="sim.js"></script>
<script src="scenes.js"></script>
<script src="ui.js"></script>
</body>
</html>
