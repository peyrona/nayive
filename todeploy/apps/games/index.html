                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="15"></line><polyline points="6 9 12 15 18 9"></polyline><line x1="5" y1="20" x2="19" y2="20"></line></svg>
                        </button>
                    </div>

                    <p class="tet-hint" data-i18n="games.hintTetris"></p>
                </div>
            </section>
        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
    ( function ()
    {
        'use strict';

        var T  = function ( k ) { return NayiveUI.t( k ); };
        var TF = function ( k, v ) { return NayiveUI.tf( k, v ); };

        var FILE  = 'data/games/games.json';   // the whole app in one file: the best score of each game
        var store = null;                      // built in boot(), once the deferred scripts have run

        var tiles   = null;                    // the six cards on the Games screen
        var panes   = null;
        var titleEl = null;                    // the <h1>: the app name, or the open game's
        var optsEl  = null;                    // the header's middle: the open game's toolbar
        var slotEl  = null;
        var current = '';                      // '' while the Games screen is up

        //------------------------------------------------------------------------//
        // HOW A GAME MOUNTS INTO ITS PANE
        //
        // A game registers { enter, leave } under its card's data-game name.
        // showGame() calls leave() on the pane going off screen and enter() on
        // the one coming on, so exactly one game is ever live. 2048 and Sudoku
        // both use it to own the keyboard only while theirs is the pane on
        // screen - and so does Tetris; the three of them answer the same arrow
        // keys, so without it the hidden ones would move too. The three canvas
        // games use it to stop their LOOP as well, without which the aliens keep
        // marching, the rocks keep drifting and the pieces keep falling behind
        // whatever pane is on screen, and six games end up running at once.
        // Every pane has an entry here now.
        //
        // THE GAMES SCREEN IS THE SEVENTH PANE and the one that is not a game:
        // it has no entry in GAMES, so leaving it costs nothing and arriving at
        // it is only a pane switch. It is also the only state in which the
        // header carries no toolbar - which is why showGame() and goHome() are
        // the two halves of one thing, and why both go through paint().

        var GAMES = {};

        // The header follows the pane. `name` is '' for the Games screen.
        function paint( name )
        {
            var game = !! name;
            var bar  = game ? slotEl.querySelector( '[data-options="' + name + '"]' ) : null;

            // The h1 holds a <button> while a game is open. shared/ui.js's
            // launcher link is on the h1 itself and steps aside for any button
            // inside the header, so the two never fight over the same click.
            titleEl.classList.toggle( 'has-game', game );
            if( game )
            {
                titleEl.innerHTML = '';
                titleEl.appendChild( gameTitleBtn( T( 'games.' + name ) ) );
            }
            else
            {
                titleEl.textContent = 'Games';
            }

            Array.prototype.forEach.call( slotEl.children, function ( el )
            {
                el.hidden = el !== bar;
            } );

            // A game with no toolbar at all would leave the two rules floating
            // around an empty box, so the whole block goes with it.
            optsEl.hidden = ! bar;
        }

        function gameTitleBtn( name )
        {
            var b = document.createElement( 'button' );

            b.type      = 'button';
            b.className = 'game-title';
            b.textContent = name;
            // title and NOT aria-label: this button has text, and an aria-label
            // would replace it - the page's <h1> would read "Back to all the
            // games" instead of the name of the game you are looking at. The
            // suite's icon-only buttons carry both because they have no text.
            b.title     = T( 'games.backToGames' );
            b.addEventListener( 'click', goHome );

            return b;
        }

        function showGame( name )
        {
            if( current && current !== name && GAMES[ current ] && GAMES[ current ].leave )
                GAMES[ current ].leave();

            current = name;
            panes.forEach( function ( p ) { p.classList.toggle( 'is-open', p.dataset.pane === name ); } );
            paint( name );

            if( GAMES[ name ] && GAMES[ name ].enter ) GAMES[ name ].enter();
        }

        // Back to the six cards. leave() first, and for the same reason
        // showGame() calls it: a canvas game left running behind the Games
        // screen would still hold the arrow keys and still burn a frame budget.
        function goHome()
        {
            if( current && GAMES[ current ] && GAMES[ current ].leave )
                GAMES[ current ].leave();

            current = '';
            panes.forEach( function ( p ) { p.classList.toggle( 'is-open', p.dataset.pane === 'home' ); } );
            paint( '' );
        }

        // m:ss, clamped at 99:59 - the shape both timed games print. Their
        // clocks are their own (two timestamps each, see seconds()); only the
        // formatting is shared.
        function clock( s )
        {
            s = Math.min( Math.max( s, 0 ), 99 * 60 + 59 );
            return Math.floor( s / 60 ) + ':' + NayiveUI.pad2( s % 60 );
        }


        // A key press no game may answer. Two rules, both of them the whole
        // suite's rather than any one game's: a sheet is over the app - the help
        // dialog, the install prompt, "session expired" - and it has swallowed
        // the keys; or the caret is in a field. Five of the six games asked this
        // in the same two lines before anything else, and now ask it in one.
        function keyBusy( e )
        {
            var el = e.target;

            if( document.querySelector( '.sheet-backdrop.open' ) ) return true;
            return !! ( el && ( el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable ) );
        }

        // The toolbar's play / pause button, in all six games. It is one button
        // wearing two glyphs, and the state it is in has to reach three places:
        // which glyph shows, what the tooltip says, and whether it can be
        // pressed at all (a game that has not started and a game that is over
        // are both nothing to pause).
        //
        // toggleAttribute and NOT `.hidden`: an <svg> is an SVGElement, which
        // has no `hidden` IDL property - assigning to it makes an expando and
        // the [hidden] rule never moves. Two of the three canvas games had it
        // the wrong way round and their button never became a play triangle;
        // there is one copy of it now, and it is the right one.
        function pauseButton( btn, paused, disabled )
        {
            btn.disabled = ! ! disabled;
            btn.title    = T( paused ? 'games.resume' : 'games.pause' );
            btn.setAttribute( 'aria-label', btn.title );
            btn.querySelector( '[data-ic="pause"]' ).toggleAttribute( 'hidden', !! paused );
            btn.querySelector( '[data-ic="play"]'  ).toggleAttribute( 'hidden', ! paused );
        }

        // A record only ever goes UP. The plug re-reads the file on focus and on
        // a tap, and that answer can be OLDER than the game being played right
        // now - our own write may still be in the outbox - so a score beaten on
        // the phone is picked up here and one beaten here is never thrown away.
        // The four games that keep a score all merge it this way; the two that
        // keep a time point the same rule the other way (see adoptTimes).
        function keepBest( have, n, el )
        {
            var best = n > have ? n : have;

            el.textContent = String( best );
            return best;
        }

        //------------------------------------------------------------------------//
        // THE CANVAS GAMES' LOOP
        //
        // The frames drive an accumulator and nothing else: the game always
        // advances in whole 1/60 s steps, so it plays the same on a 60 Hz laptop
        // and a 120 Hz phone, and a frame the browser was late with is made up
        // by taking two steps rather than by moving everything twice as far.
        //
        // The contract is two functions and no arguments - step() moves the
        // world on by exactly STEP, draw() paints whatever state it is in - so a
        // game keeps its own constants in whatever unit suits it.
        //
        // Space Invaders wrote this and kept it to itself while it was the only
        // canvas game; it moved out here when Asteroids became the second, the
        // same way clock() sat inside Minesweeper until Sudoku needed it.
        var STEP = 1000 / 60;                  // one game step, in milliseconds

        function gameLoop( step, draw )
        {
            var raf = 0, last = 0, acc = 0;

            function frame( now )
            {
                var dt;

                // Asked for FIRST, so that a halt() from inside step() - which
                // is how a finished game stops itself - really does stop the
                // loop instead of being overwritten a line later.
                raf = requestAnimationFrame( frame );

                dt   = last ? now - last : STEP;   // the first frame is one step, not the gap since the last one
                last = now;

                // A quarter of a second is the most that is ever made up at
                // once. Without the cap, a tab that was away for a minute would
                // run 3600 steps in one frame - and the game would be over
                // before it was drawn.
                if( dt > 250 ) dt = 250;

                acc += dt;
                while( acc >= STEP ) { step(); acc -= STEP; }

                draw();
            }

            return {
                run:  function () { if( raf ) return; last = 0; acc = 0; raf = requestAnimationFrame( frame ); },
                halt: function () { if( raf ) cancelAnimationFrame( raf ); raf = 0; }
            };
        }


        //------------------------------------------------------------------------//
        // THE ARCADE SHELL  - what the three canvas games have in common
        //
        // Space Invaders, Asteroids and Tetris are one shape: a <canvas>, a
        // gameLoop(), and four still states behind one overlay - ready, paused
        // and over, plus playing, which is the one with nothing over it. Every
        // part of that shape was written three times, and by the third it was
        // byte for byte the same, so it is written once here instead:
        //
        //   - play / pause / resume, and the rule that a hidden tab or an
        //     unfocused window pauses a game but never resumes it;
        //   - the overlay's three sets of words, and the pause button's two
        //     icons;
        //   - enter / leave: the arrow keys are owned only while the pane is on
        //     screen, and leaving stops the loop, lets go of every held key and
        //     writes the record;
        //   - the wiring each init() did by hand - the overlay, the tap on the
        //     play area, the pause and "new game" buttons, the held-key row,
        //     visibilitychange, blur, the theme change and the ResizeObserver.
        //
        // What it deliberately does NOT own is `state`. Each game asks
        // `state === 'playing'` inside its step(), its draw() and its onKey(),
        // dozens of times over, and threading an accessor through all of that
        // would cost far more than the four functions here save. So the game
        // keeps the variable and hands over the two lines that touch it.
        //
        // It DOES own `live`, which each game read exactly once (in onKey), and
        // the loop, which a game reaches through `A.loop` when its own step()
        // has to halt it.
        //
        // Invaders is the one that is not quite the other two: it can pause out
        // of `dying` and `wave` as well as `playing`, and comes back to
        // whichever it was. That is what `runs` and `held` are for; the other
        // two pass nothing and take the default.

        function arcade( o )
        {
            var loop    = gameLoop( o.step, o.draw );
            var noop    = function () {};
            var live    = false;                   // is this the pane on screen?
            var held    = '';                      // the state a pause interrupted
            var runs    = o.runs  || [ 'playing' ];
            var flush   = o.flush || noop;         // Invaders writes its record as it goes
            var palette = o.palette || noop;
            var fit     = o.fit     || noop;
            var els     = o.els;

            function overlay()
            {
                var state = o.getState();
                var title = '', sub = '', btn = '';

                if( state === 'ready' )
                {
                    title = T( o.readyKey );
                    btn   = T( 'games.play' );
                }
                else if( state === 'paused' )
                {
                    title = T( 'games.paused' );
                    sub   = TF( 'games.scoreIs', { n: o.score() } );
                    btn   = T( 'games.resume' );
                }
                else if( state === 'over' )
                {
                    title = T( 'games.gameOver' );
                    sub   = TF( 'games.scoreIs', { n: o.score() } );
                    btn   = T( 'games.newGame' );
                }

                els.overTitle.textContent = title;
                els.overSub.textContent   = sub;
                els.overSub.hidden        = ! sub;
                els.overBtn.textContent   = btn;
                els.over.hidden           = ! btn;

                pauseButton( els.pause, state === 'paused', state === 'ready' || state === 'over' );
            }

            // The overlay's button, a tap on the play area, the first key press
            // and the toolbar's "new game" all arrive here.
            function play()
            {
                var state = o.getState();

                if( state === 'paused' ) { resume(); return; }
                if( state !== 'ready' && state !== 'over' ) return;

                if( state === 'over' ) o.reset();

                o.setState( 'playing' );
                overlay();
                loop.run();
                els.canvas.focus();            // ...or the next space re-clicks the button behind it
            }

            function pause()
            {
                var state = o.getState();

                if( runs.indexOf( state ) < 0 ) return;

                held = state;
                o.setState( 'paused' );
                loop.halt();
                o.clearKeys();
                flush();
                overlay();
                o.draw();
            }

            function resume()
            {
                if( o.getState() !== 'paused' ) return;

                o.setState( held || 'playing' );
                overlay();
                loop.run();
                els.canvas.focus();
            }

            function toggle() { if( o.getState() === 'paused' ) resume(); else pause(); }

            function enter()
            {
                live = true;
                palette();
                fit();
                o.draw();

                document.addEventListener( 'keydown', o.onKey );
                document.addEventListener( 'keyup',   o.onKeyUp );
            }

            function leave()
            {
                live = false;
                pause();
                o.clearKeys();
                flush();

                document.removeEventListener( 'keydown', o.onKey );
                document.removeEventListener( 'keyup',   o.onKeyUp );
            }

            // Everything each init() used to wire by hand. It is called at the
            // END of the game's own init(), once every element it names exists.
            function wire( opt )
            {
                opt = opt || {};

                // A tap on the play area starts or resumes the game - the
                // overlay's button is small, and on a phone the thumb is already
                // there. It never moves anything: a mis-tap while playing must
                // not cost a placement.
                //
                // Invaders passes `tap: false` and wires the canvas itself: the
                // same finger that starts the game also DRAGS the ship, so the
                // press has to be one handler that knows both jobs.
                if( opt.tap !== false )
                    els.canvas.addEventListener( 'pointerdown', function ( e )
                    {
                        e.preventDefault();
                        if( opt.focusOnTap ) els.canvas.focus();
                        play();
                    } );

                // One listener for the whole overlay, not just its button: on a
                // phone the whole card is the target you actually hit.
                els.over.addEventListener( 'click', play );
                els.pause.addEventListener( 'click', toggle );
                if( els.newGame )
                    els.newGame.addEventListener( 'click', function () { o.reset(); play(); } );

                // The held-key row (Asteroids and Tetris). The keys are held
                // down rather than tapped, so every way a pointer can leave one
                // has to let it go - up, cancel and leave all arrive at the same
                // handler, which reads the event type.
                if( opt.pads )
                    Array.prototype.slice.call( document.querySelectorAll( opt.pads.sel ) ).forEach( function ( b )
                    {
                        opt.pads.keep( b );

                        b.addEventListener( 'pointerdown',   opt.pads.on );
                        b.addEventListener( 'pointerup',     opt.pads.on );
                        b.addEventListener( 'pointercancel', opt.pads.on );
                        b.addEventListener( 'pointerleave',  opt.pads.on );
                        b.addEventListener( 'contextmenu',   function ( e ) { e.preventDefault(); } );
                    } );

                // Nothing runs behind a hidden tab or an unfocused window - and
                // neither of them RESUMES the game either: it waits behind the
                // pause overlay for the player to come back to it.
                document.addEventListener( 'visibilitychange', function () { if( document.hidden ) pause(); } );
                window.addEventListener( 'blur', pause );

                // The scheme can change from another tab (theme.js listens to
                // "storage"), and a canvas colour is a copy, not a var() link.
                window.addEventListener( 'balata:themechange', function () { palette(); o.draw(); } );

                if( window.ResizeObserver ) new ResizeObserver( fit ).observe( els.canvas );
                else window.addEventListener( 'resize', fit );
            }

            return {
                loop: loop, overlay: overlay, play: play, pause: pause,
                resume: resume, enter: enter, leave: leave, wire: wire,
                isLive: function () { return live; }
            };
        }

        //------------------------------------------------------------------------//
        // 2048
        //
        // A 4x4 array and one move( dir ). It is turn-based, so there is no
        // loop and no canvas: every render answers one key or one swipe.

        var G2048 = ( function ()
        {
            var SIZE  = 4;
            var CELLS = SIZE * SIZE;
            var GOAL  = 2048;
            var SWIPE = 24;                    // px before a drag counts as a swipe and not a tap

            var grid  = [];                    // CELLS numbers, 0 is an empty square
            var score = 0;
            var best  = 0;
            var won   = false;                 // the 2048 tile has been reached; play goes on
            var over  = false;
            // 2048 has no clock, so a pause here only takes the board off the
            // screen and stops the arrows. It is in the toolbar anyway, because
            // a button that is there in five games of six and missing in the
            // sixth reads as a bug rather than as a decision.
            var paused = false;
            var live  = false;                 // is this the pane on screen? (the arrow keys)

            var cells = [];
            var boardEl, overEl, overTitleEl, overScoreEl, overBtnEl, scoreEl, bestEl, pauseBtn;
            var sx = 0, sy = 0, tracking = false;

            //---- the rules ---------------------------------------------------

            // One lane, sliding towards index 0 - the whole game is here. Every
            // tile merges AT MOST ONCE per move and merges resolve from the
            // leading edge, which is why [2,2,2,2] gives [4,4] and never [8].
            function slide( line )
            {
                var vals = line.filter( function ( v ) { return v !== 0; } );
                var out = [], hits = [], gained = 0, i;

                for( i = 0; i < vals.length; i++ )
                {
                    if( vals[ i ] === vals[ i + 1 ] )
                    {
                        out.push( vals[ i ] * 2 );
                        hits.push( true );
                        gained += vals[ i ] * 2;
                        i++;                       // both tiles are spent
                    }
                    else { out.push( vals[ i ] ); hits.push( false ); }
                }
                while( out.length < SIZE ) { out.push( 0 ); hits.push( false ); }

                return { line: out, merged: hits, gained: gained,
                         moved: out.some( function ( v, k ) { return v !== line[ k ]; } ) };
            }

            // The four lanes of one direction, each already ordered from the
            // leading edge - so slide() never has to know which way it is going.
            function lanes( dir )
            {
                var res = [], i, j, idx;

                for( i = 0; i < SIZE; i++ )
                {
                    idx = [];
                    for( j = 0; j < SIZE; j++ )
                        idx.push( dir === 'left'  ? i * SIZE + j
                                : dir === 'right' ? i * SIZE + ( SIZE - 1 - j )
                                : dir === 'up'    ? j * SIZE + i
                                :                   ( SIZE - 1 - j ) * SIZE + i );
                    res.push( idx );
                }
                return res;
            }

            // Is there any move left: an empty square, or two equal neighbours.
            function canMove()
            {
                var r, c, v;

                for( r = 0; r < SIZE; r++ )
                    for( c = 0; c < SIZE; c++ )
                    {
                        v = grid[ r * SIZE + c ];
                        if( v === 0 ) return true;
                        if( c + 1 < SIZE && grid[ r * SIZE + c + 1 ] === v ) return true;
                        if( r + 1 < SIZE && grid[ ( r + 1 ) * SIZE + c ] === v ) return true;
                    }
                return false;
            }

            // Nine 2s for every 4, in a square picked at random. Returns where.
            function spawn()
            {
                var free = [], i;

                for( i = 0; i < CELLS; i++ ) if( grid[ i ] === 0 ) free.push( i );
                if( ! free.length ) return -1;

                var at = free[ Math.floor( Math.random() * free.length ) ];
                grid[ at ] = Math.random() < 0.9 ? 2 : 4;
                return at;
            }

            //---- a turn ------------------------------------------------------

            function move( dir )
            {
                if( over || paused ) return;

                var next = grid.slice(), gained = 0, moved = false, merged = [];

                lanes( dir ).forEach( function ( idx )
                {
                    var r = slide( idx.map( function ( k ) { return grid[ k ]; } ) );

                    r.line.forEach( function ( v, j )
                    {
                        next[ idx[ j ] ] = v;
                        if( r.merged[ j ] ) merged.push( idx[ j ] );
                    } );

                    gained += r.gained;
                    moved   = moved || r.moved;
                } );

                if( ! moved ) return;              // a move that changes nothing deals no tile

                grid   = next;
                score += gained;
                if( score > best ) { best = score; saveBest( 'g2048', best ); }

                render( [ spawn() ], merged );

                // The goal is shown once and then the game carries on. Checking
                // it first can hide a board that is also finished, so hideOver()
                // asks again when the player taps through.
                if( ! won && grid.indexOf( GOAL ) !== -1 ) { won = true; showOver( 'win' ); }
                else if( ! canMove() ) { over = true; showOver( 'lost' ); }
            }

            function newGame()
            {
                var i;

                grid  = [];
                for( i = 0; i < CELLS; i++ ) grid.push( 0 );
                score = 0;
                won   = false;
                over  = false;
                paused = false;

                overEl.hidden = true;
                paintPause();
                render( [ spawn(), spawn() ], [] );
            }

            //---- the screen --------------------------------------------------

            function render( fresh, merged )
            {
                cells.forEach( function ( el, i )
                {
                    var v = grid[ i ];

                    el.textContent = v ? String( v ) : '';
                    el.dataset.v   = v ? ( v > 8192 ? 'max' : String( v ) ) : '';
                    el.className   = 'g2048-cell'
                                   + ( v >= 10000 ? ' is-xwide' : v >= 1000 ? ' is-wide' : v >= 100 ? ' is-mid' : '' );
                } );

                // One reflow between taking the animation classes off and putting
                // them back on: without it the browser only ever sees the end
                // state and a square that merges twice running never replays.
                void boardEl.offsetWidth;

                fresh.forEach( function ( i ) { if( i >= 0 ) cells[ i ].classList.add( 'is-new' ); } );
                merged.forEach( function ( i ) { cells[ i ].classList.add( 'is-merged' ); } );

                scoreEl.textContent = String( score );
                bestEl.textContent  = String( best );
            }

            //---- pausing -----------------------------------------------------
            //
            // It borrows the overlay the win and the game over already use - one
            // card over the board, three sets of words - so `kind` gains a third
            // value and the button below it knows which of the three it is.

            function paintPause()
            {
                pauseButton( pauseBtn, paused, over );
            }

            function pause()
            {
                if( paused || over ) return;

                paused = true;
                overTitleEl.textContent = T( 'games.paused' );
                overScoreEl.textContent = TF( 'games.scoreIs', { n: score } );
                overBtnEl.textContent   = T( 'games.resume' );
                overBtnEl.dataset.kind  = 'paused';
                overEl.hidden = false;
                paintPause();
            }

            function resume()
            {
                if( ! paused ) return;

                paused = false;
                overEl.hidden = true;
                paintPause();
            }

            function showOver( kind )
            {
                overTitleEl.textContent = T( kind === 'win' ? 'games.win2048' : 'games.gameOver' );
                overScoreEl.textContent = TF( 'games.scoreIs', { n: score } );
                overBtnEl.textContent   = T( kind === 'win' ? 'games.keepGoing' : 'games.newGame' );
                overBtnEl.dataset.kind  = kind;
                overEl.hidden = false;
                paintPause();
            }

            // "Seguir jugando" after the 2048 tile - unless that same move also
            // finished the board, which the win overlay would otherwise hide.
            function keepGoing()
            {
                overEl.hidden = true;
                if( ! canMove() ) { over = true; showOver( 'lost' ); }
            }

            //---- input -------------------------------------------------------

            var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };

            function onKey( e )
            {
                var dir = KEYS[ e.key ];

                if( ! dir || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( keyBusy( e ) ) return;

                e.preventDefault();                // otherwise the arrows scroll the page
                move( dir );
            }

            // touch-action: none on the board is what stops the browser scrolling
            // or zooming with the same finger.
            function onTouchStart( e )
            {
                tracking = e.touches.length === 1;
                if( ! tracking ) return;
                sx = e.touches[ 0 ].clientX;
                sy = e.touches[ 0 ].clientY;
            }

            function onTouchEnd( e )
            {
                if( ! tracking ) return;
                tracking = false;

                var t  = e.changedTouches[ 0 ];
                var dx = t.clientX - sx;

                           'X..X...X..X',
                           'X.XXXXXXX.X',
                           'XXX.XXX.XXX',
                           'XXXXXXXXXXX',
                           '.XXXXXXXXX.',
                           '..X.....X..',
                           '.X.......X.' ] ],

                octo:  [ [ '....XXXX....',
                           '.XXXXXXXXXX.',
                           'XXXXXXXXXXXX',
                           'XXX..XX..XXX',
                           'XXXXXXXXXXXX',
                           '...XX..XX...',
                           '..XX.XX.XX..',
                           'XX........XX' ],
                         [ '....XXXX....',
                           '.XXXXXXXXXX.',
                           'XXXXXXXXXXXX',
                           'XXX..XX..XXX',
                           'XXXXXXXXXXXX',
                           '..XXX..XXX..',
                           '.XX..XX..XX.',
                           '..XX....XX..' ] ],

                boom:  [ '...X...X...',
                         'X..X...X..X',
                         '.X.......X.',
                         '..XX...XX..',
                         'XX..XXX..XX',
                         '..XX...XX..',
                         '.X.......X.',
                         'X..X...X..X' ],

                ship:  [ '......X......',
                         '.....XXX.....',
                         '.....XXX.....',
                         '.XXXXXXXXXXX.',
                         'XXXXXXXXXXXXX',
                         'XXXXXXXXXXXXX',
                         'XXXXXXXXXXXXX',
                         'XXXXXXXXXXXXX' ],

                wreck: [ '....X...X....',
                         'X.....X....X.',
                         '.X...X...X...',
                         '..X.XXXXX.X..',
                         '.XXXXXXXXXXX.',
                         'XXXXXXXXXXXXX',
                         'XXXXXXXXXXXXX',
                         'XXX.XXXXX.XXX' ],

                ufo:   [ '.....XXXXXX.....',
                         '...XXXXXXXXXX...',
                         '..XXXXXXXXXXXX..',
                         '.XX.XX.XX.XX.XX.',
                         'XXXXXXXXXXXXXXXX',
                         '..XXX..XX..XXX..',
                         '...X........X...' ],

                // The bunkers are the same idea one size up: 2x2 blocks rather
                // than single pixels, because they are chipped away one block
                // at a time and a grid of 88 booleans is what a hit looks up.
                bunker:[ '...XXXXX...',
                         '..XXXXXXX..',
                         '.XXXXXXXXX.',
                         'XXXXXXXXXXX',
                         'XXXXXXXXXXX',
                         'XXXXXXXXXXX',
                         'XXX.....XXX',
                         'XX.......XX' ]
            };

            var SPR = {};                          // ART, compiled into runs

            //---- state -------------------------------------------------------

            // ready | playing | dying | wave | paused | over. Only "playing",
            // "dying" and "wave" run the loop; the other three sit behind the
            // overlay.
            var state = 'ready';               // ready | playing | dying | wave | paused | over
            var aliens = [], bombs = [], bunkers = [], shot = null, ufo = null;
            var px = 0, alive = 0, dir = 1, frame = 0;
            var score = 0, best = 0, lives = 0, wave = 1, record = false;
            var marchTick = 0, bombTick = 0, ufoTick = 0, dieTick = 0, waveTick = 0;

            var keyL = false, keyR = false, firing = false;
            var touching = false, dragFrom = 0, dragShip = 0, targetX = 0;

            var scale = 1, fitted = 0, font = 'sans-serif', C = {};

            var canvasEl, ctx, overEl, overTitleEl, overSubEl, overBtnEl;
            var scoreEl, bestEl, waveEl, pauseBtn, lifeEls = [];

            //---- geometry helpers --------------------------------------------

            // One bitmap -> { w, h, runs }, where a run is one horizontal strip
            // of set pixels: { x, y, w }. Done once, at init.
            function sprite( rows )
            {
                var runs = [], y, x, start;

                for( y = 0; y < rows.length; y++ )
                {
                    x = 0;
                    while( x < rows[ y ].length )
                    {
                        if( rows[ y ].charAt( x ) !== 'X' ) { x++; continue; }

                        start = x;
                        while( x < rows[ y ].length && rows[ y ].charAt( x ) === 'X' ) x++;
                        runs.push( { x: start, y: y, w: x - start } );
                    }
                }

                return { w: rows[ 0 ].length, h: rows.length, runs: runs };
            }

            function hits( ax, ay, aw, ah, bx, by, bw, bh )
            {
                return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
            }

            //---- building a wave ---------------------------------------------

            function buildAliens()
            {
                var top = START_Y + Math.min( ( wave - 1 ) * 8, 40 );   // each wave is dealt lower
                var r, c, type, s;

                aliens = [];
                alive  = TOTAL;
                dir    = 1;
                frame  = 0;

                for( r = 0; r < ROWS; r++ )
                    for( c = 0; c < COLS; c++ )
                    {
                        type = r === 0 ? 0 : r < 3 ? 1 : 2;
                        s    = SPR.alien[ type ][ 0 ];

                        aliens.push( { type: type, row: r, col: c, alive: true, boom: 0, w: s.w,
                                       x: START_X + c * CELL_W + Math.round( ( CELL_W - s.w ) / 2 ),
                                       y: top + r * CELL_H } );
                    }
            }

            function buildBunkers()
            {
                bunkers = BUNKER_X.map( function ( bx )
                {
                    return { x: bx, y: BUNKER_Y, cells: ART.bunker.map( function ( row )
                    {
                        return row.split( '' ).map( function ( ch ) { return ch === 'X'; } );
                    } ) };
                } );
            }

            // Everything a wave starts with. The bunkers are rebuilt too: the
            // aliens chew through them on the way down (see chew()), so a wave
            // that began with the last one's rubble would be unwinnable by
            // about the fifth.
            function setWave()
            {
                buildAliens();
                buildBunkers();

                px        = ( W - SPR.ship.w ) / 2;
                shot      = null;
                ufo       = null;
                bombs     = [];
                marchTick = marchEvery();
                bombTick  = bombDelay();
                ufoTick   = UFO_EVERY;
            }

            //---- the rules ---------------------------------------------------

            // How many steps between two moves of the formation. The fewer are
            // left the faster they come, which is the whole tension of the game
            // - and each wave winds the same curve a notch tighter.
            function marchEvery()
            {
                var n = ( 3 + 27 * ( alive - 1 ) / ( TOTAL - 1 ) ) * Math.pow( 0.9, wave - 1 );
                return Math.max( 2, Math.round( n ) );
            }

            function bombDelay()
            {
                var lo = Math.max( 14, 70 - wave * 6 );
                var hi = Math.max( lo + 20, 170 - wave * 14 );
                return lo + Math.floor( Math.random() * ( hi - lo ) );
            }

            function maxBombs() { return Math.min( 4, 1 + Math.ceil( wave / 2 ) ); }

            // One sideways move of the whole formation, or - when the leading
            // edge has run out of room - a drop and a turn. The edges are the
            // bounding box of what is still ALIVE, so clearing the left column
            // buys the rest of them that much more room, exactly as it should.
            function march()
            {
                var lo = W, hi = 0, drop = false, i, a;

                for( i = 0; i < aliens.length; i++ )
                {
                    a = aliens[ i ];
                    if( ! a.alive ) continue;
                    if( a.x < lo ) lo = a.x;
                    if( a.x + a.w > hi ) hi = a.x + a.w;
                }
                if( lo > hi ) return;                                   // none left

                if( dir > 0 && hi + MARCH_DX > W - EDGE ) drop = true;
                if( dir < 0 && lo - MARCH_DX < EDGE )     drop = true;

                for( i = 0; i < aliens.length; i++ )
                {
                    a = aliens[ i ];
                    if( ! a.alive ) continue;

                    if( drop ) a.y += MARCH_DROP;
                    else       a.x += dir * MARCH_DX;

                    // Down at the player's line the invasion is over, however
                    // many lives are left: that is what losing this game IS.
                    if( a.y + 8 >= SHIP_Y ) { gameOver(); return; }
                }

                if( drop ) { dir = -dir; chew(); }
                frame ^= 1;                                             // the legs move with the step
            }

            // A bomb comes off the LOWEST alien of a random column - the one
            // that actually has a clear line to the ship.
            function dropBomb()
            {
                var low = {}, cols = [], i, a, k;

                for( i = 0; i < aliens.length; i++ )
                {
                    a = aliens[ i ];
                    if( ! a.alive ) continue;
                    if( ! low[ a.col ] || a.y > low[ a.col ].y ) low[ a.col ] = a;
                }
                for( k in low ) if( low.hasOwnProperty( k ) ) cols.push( low[ k ] );
                if( ! cols.length ) return;

                a = cols[ Math.floor( Math.random() * cols.length ) ];
                bombs.push( { x: a.x + Math.round( a.w / 2 ) - 1, y: a.y + 8 } );
            }

            // A bunker is a grid of blocks, so a hit is one index lookup and not
            // a shape test. `spread` is how many blocks either side go with it:
            // a bomb blows a wider hole than a shot does. A shot that arrives
            // where a block has already gone passes straight through - which is
            // what makes a bunker wear out rather than simply break.
            function hitBunker( x, y, spread )
            {
                var i, b, c, r, k, gone = false;

                for( i = 0; i < bunkers.length; i++ )
                {
                    b = bunkers[ i ];
                    if( x < b.x || x >= b.x + BCOLS * BLOCK ) continue;
                    if( y < b.y || y >= b.y + BROWS * BLOCK ) continue;

                    c = Math.floor( ( x - b.x ) / BLOCK );
                    r = Math.floor( ( y - b.y ) / BLOCK );
                    if( ! b.cells[ r ][ c ] ) continue;

                    for( k = c - spread; k <= c + spread; k++ )
                        if( k >= 0 && k < BCOLS ) b.cells[ r ][ k ] = false;

                    gone = true;
                }

                return gone;
            }

            // A shot covers six units in one step and a block is two, so asking
            // only where it ENDS steps clean over a block on the way. The tip's
            // whole path is sampled instead.
            function sweep( x, from, to, spread )
            {
                var a = Math.min( from, to ), b = Math.max( from, to ), y;

                for( y = a; y < b; y += BLOCK )
                    if( hitBunker( x, y, spread ) ) return true;

                return hitBunker( x, b, spread );
            }

            // Aliens low enough to be standing in a bunker take it apart. Only
            // ever called on a drop, and only the ones that have got that far.
            function chew()
            {
                var i, j, r, c, a, b;

                for( i = 0; i < aliens.length; i++ )
                {
                    a = aliens[ i ];
                    if( ! a.alive || a.y + 8 < BUNKER_Y ) continue;

                    for( j = 0; j < bunkers.length; j++ )
                    {
                        b = bunkers[ j ];
                        if( ! hits( a.x, a.y, a.w, 8, b.x, b.y, BCOLS * BLOCK, BROWS * BLOCK ) ) continue;

                        for( r = 0; r < BROWS; r++ )
                            for( c = 0; c < BCOLS; c++ )
                                if( b.cells[ r ][ c ] &&
                                    hits( a.x, a.y, a.w, 8,
                                          b.x + c * BLOCK, b.y + r * BLOCK, BLOCK, BLOCK ) )
                                    b.cells[ r ][ c ] = false;
                    }
                }
            }

            function addScore( n )
            {
                score = score + n;
                scoreEl.textContent = String( score );

                // The record climbs as it is beaten, the way 2048's does, and is
                // merged with a max - see saveBest() and adoptBest().
                if( score > best )
                {
                    best   = score;
                    record = true;
                    bestEl.textContent = String( best );
                    saveBest( 'invaders', best );
                }
            }

            //---- one step of the game ----------------------------------------

            function movePlayer()
            {
                var d;

                if( keyL ) px -= SHIP_SPEED;
                if( keyR ) px += SHIP_SPEED;

                // A finger drags the ship RELATIVE to where the drag began, not
                // to where the finger is: on a 390px screen the ship lives under
                // the thumb otherwise. It is still capped at a speed, so a flick
                // cannot teleport it out from under a bomb.
                if( touching )
                {
                    d   = targetX - px;
                    px += Math.max( -DRAG_SPEED, Math.min( DRAG_SPEED, d ) );
                }

                px = Math.max( EDGE, Math.min( W - EDGE - SPR.ship.w, px ) );

                // ONE shot on the screen at a time - the arcade rule, and what
                // makes the game about choosing the moment rather than holding
                // the button. So holding it is exactly right: the next shot
                // leaves as soon as the last one is spent.
                if( firing && ! shot )
                    shot = { x: px + Math.round( ( SPR.ship.w - SHOT_W ) / 2 ), y: SHIP_Y - SHOT_H };
            }

            function moveShot()
            {
                var top, i, a;

                if( ! shot ) return;

                top = shot.y - SHOT_SPEED;

                if( sweep( shot.x, shot.y, top, 0 ) ) { shot = null; return; }

                shot.y = top;
                if( shot.y + SHOT_H < 0 ) { shot = null; return; }

                for( i = 0; i < bombs.length; i++ )
                    if( hits( shot.x, shot.y, SHOT_W, SHOT_H, bombs[ i ].x, bombs[ i ].y, BOMB_W, BOMB_H ) )
                    { bombs.splice( i, 1 ); shot = null; return; }

                if( ufo && hits( shot.x, shot.y, SHOT_W, SHOT_H, ufo.x, UFO_Y, SPR.ufo.w, SPR.ufo.h ) )
                { addScore( ufo.points ); ufo = null; shot = null; return; }

                for( i = 0; i < aliens.length; i++ )
                {
                    a = aliens[ i ];
                    if( ! a.alive ) continue;
                    if( ! hits( shot.x, shot.y, SHOT_W, SHOT_H, a.x, a.y, a.w, 8 ) ) continue;

                    a.alive = false;
                    a.boom  = BOOM_TICKS;
                    alive  -= 1;
                    addScore( POINTS[ a.row ] );
                    shot = null;
                    return;
                }
            }

            function moveBombs()
            {
                var speed = Math.min( 2.2, 1.3 + ( wave - 1 ) * 0.1 );
                var i, b;

                for( i = bombs.length - 1; i >= 0; i-- )
                {
                    b    = bombs[ i ];
                    b.y += speed;

                    if( sweep( b.x + 1, b.y + BOMB_H - speed, b.y + BOMB_H, 1 ) ) { bombs.splice( i, 1 ); continue; }
                    if( b.y > GROUND_Y ) { bombs.splice( i, 1 ); continue; }

                    if( hits( b.x, b.y, BOMB_W, BOMB_H, px, SHIP_Y, SPR.ship.w, SPR.ship.h ) )
                    { bombs.splice( i, 1 ); hitShip(); return; }
                }

                if( --bombTick <= 0 )
                {
                    if( bombs.length < maxBombs() ) dropBomb();
                    bombTick = bombDelay();
                }
            }

            function moveUfo()
            {
                if( ufo )
                {
                    ufo.x += ufo.dir * UFO_SPEED;
                    if( ufo.x < -SPR.ufo.w || ufo.x > W ) ufo = null;
                    return;
                }

                // Only while there is still a crowd: a lone ufo crossing an
                // empty screen is a free 300 points.
                if( --ufoTick > 0 || alive <= 6 ) return;

                ufo = { dir: Math.random() < 0.5 ? 1 : -1,
                        points: UFO_POINTS[ Math.floor( Math.random() * UFO_POINTS.length ) ] };
                ufo.x   = ufo.dir > 0 ? -SPR.ufo.w : W;
                ufoTick = UFO_EVERY;
            }

            function step()
            {
                var i;

                // Any dialog over the app pauses it: the help sheet, the install
                // prompt, "session expired". They cover the pane and swallow the
                // keys (see onKey), and a ship that cannot be steered is a ship
                // standing still while it is shot at.
                if( document.querySelector( '.sheet-backdrop.open' ) ) { A.pause(); return; }

                for( i = 0; i < aliens.length; i++ ) if( aliens[ i ].boom > 0 ) aliens[ i ].boom--;

                if( state === 'dying' ) { if( --dieTick  <= 0 ) respawn();  return; }
                if( state === 'wave'  ) { if( --waveTick <= 0 ) nextWave(); return; }
                if( state !== 'playing' ) return;

                movePlayer();
                moveShot();

                if( --marchTick <= 0 ) { march(); marchTick = marchEvery(); }
                if( state !== 'playing' ) return;                       // march() may have ended it

                moveBombs();
                moveUfo();

                if( state === 'playing' && alive === 0 ) { state = 'wave'; waveTick = WAVE_TICKS; }
            }

            //---- losing, winning, and the wave in between ---------------------

            function hitShip()
            {
                lives  -= 1;
                bombs   = [];
                shot    = null;
                state   = 'dying';
                dieTick = DIE_TICKS;
                paint();
            }

            function respawn()
            {
                if( lives <= 0 ) { gameOver(); return; }

                px    = ( W - SPR.ship.w ) / 2;
                state = 'playing';
            }

            function nextWave()
            {
                wave += 1;
                setWave();
                state = 'playing';
                paint();
            }

            function gameOver()
            {
                state = 'over';
                A.loop.halt();

                // `score === best` as well as `record`: a game started before
                // loadData() answered raises `best` off zero on the first alien,
                // and the record adopted a moment later can be higher than this
                // whole game - which is not a record to announce.
                if( record && score === best ) NayiveUI.toast( TF( 'games.invadersRecord', { n: score } ) );
                A.overlay();
            }

            //---- the loop ----------------------------------------------------
            //
            // The accumulator that used to live here is now gameLoop(), out in
            // the shared scope: Asteroids became the second canvas game and
            // wanted the same one - the move clock() made when Sudoku became the
            // second game with a stopwatch. What stayed behind is the one rule
            // that is this game's and not the loop's, at the top of step().
            var A;                                 // the arcade shell (see above): the loop and the still states

            //---- painting ----------------------------------------------------

            // The canvas is a fixed 216 x 288 world scaled to whatever the pane
            // gives it, so this is the only place a real pixel is mentioned.
            // The pane is display:none when init() runs, which makes the box 0
            // wide - hence the guard, and the second call from enter().
            function fit()
            {
                var box = canvasEl.getBoundingClientRect();
                var dpr = window.devicePixelRatio || 1;
                var w   = Math.round( box.width * dpr );

                if( ! w || w === fitted ) return;

                fitted          = w;
                canvasEl.width  = w;
                canvasEl.height = Math.round( w * H / W );
                scale           = w / W;

                draw();                              // ...and a paused game repaints at the new size
            }

            // Canvas cannot read var(--x), so the palette is read out of the
            // stylesheet once and kept. It is the Minesweeper arrangement - two
            // fixed sets, one per scheme, right down to the same hexes - and
            // for the same reason: one percentage of --accent cannot serve a
            // dark background and a beige one.
            function palette()
            {
                var cs = getComputedStyle( canvasEl );
                var v  = function ( n ) { return cs.getPropertyValue( n ).trim(); };

                C = { ship:   v( '--iv-ship'   ), shot:   v( '--iv-shot'   ),
                      ufo:    v( '--iv-ufo'    ), bomb:   v( '--iv-bomb'   ),
                      shield: v( '--iv-shield' ), ground: v( '--iv-ground' ),
                      alien:  [ v( '--iv-a1' ), v( '--iv-a2' ), v( '--iv-a3' ) ],
                      text:   cs.color };

                font = cs.fontFamily;
            }

            function blit( s, x, y, colour )
            {
                var i, r;

                ctx.fillStyle = colour;
                for( i = 0; i < s.runs.length; i++ )
                {
                    r = s.runs[ i ];
                    ctx.fillRect( x + r.x, y + r.y, r.w, 1 );
                }
            }

            function draw()
            {
                var i, j, r, c, a, b, start;

                ctx.setTransform( scale, 0, 0, scale, 0, 0 );
                ctx.clearRect( 0, 0, W, H );                            // the CSS background shows through

                // The floor stops short of the sides: drawn wall to wall it runs
                // straight into the field's rounded corners and reads as the
                // canvas being cut off rather than as the ground.
                ctx.fillStyle = C.ground;
                ctx.fillRect( 8, GROUND_Y, W - 16, 1 );

                for( i = 0; i < aliens.length; i++ )
                {
                    a = aliens[ i ];
                    if( a.boom > 0 )       blit( SPR.boom, a.x + Math.round( ( a.w - SPR.boom.w ) / 2 ), a.y, C.alien[ a.type ] );
                    else if( a.alive )     blit( SPR.alien[ a.type ][ frame ], a.x, a.y, C.alien[ a.type ] );
                }

                if( ufo ) blit( SPR.ufo, ufo.x, UFO_Y, C.ufo );

                // The bunkers are drawn as runs of surviving blocks, so a whole
                // one is eight rectangles rather than eighty-eight.
                ctx.fillStyle = C.shield;
                for( i = 0; i < bunkers.length; i++ )
                {
                    b = bunkers[ i ];
                    for( r = 0; r < BROWS; r++ )
                    {
                        c = 0;
                        while( c < BCOLS )
                        {
                            if( ! b.cells[ r ][ c ] ) { c++; continue; }

                            start = c;
                            while( c < BCOLS && b.cells[ r ][ c ] ) c++;
                            ctx.fillRect( b.x + start * BLOCK, b.y + r * BLOCK, ( c - start ) * BLOCK, BLOCK );
                        }
                    }
                }

                if( state !== 'dying' )      blit( SPR.ship,  px, SHIP_Y, C.ship );
                else if( dieTick % 8 < 4 )   blit( SPR.wreck, px, SHIP_Y, C.bomb );

                if( shot )
                {
                    ctx.fillStyle = C.shot;
                    ctx.fillRect( shot.x, shot.y, SHOT_W, SHOT_H );
                }

                ctx.fillStyle = C.bomb;
                for( j = 0; j < bombs.length; j++ )
                    ctx.fillRect( bombs[ j ].x, bombs[ j ].y, BOMB_W, BOMB_H );

                if( state === 'wave' )
                {
                    ctx.fillStyle    = C.text;
                    ctx.font         = '700 14px ' + font;
                    ctx.textAlign    = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText( TF( 'games.invadersWaveN', { n: wave + 1 } ), W / 2, H / 2 );
                }
            }

            // The three figures in the toolbar. The lives are ships rather than
            // a number, and they are the LEFT group of the .view-bar because
            // Space Invaders has no difficulty switch to put there - the waves
            // are its difficulty - and .game-stats alone would sit off-centre.
            function paint()
            {
                scoreEl.textContent = String( score );
                bestEl.textContent  = String( best );
                waveEl.textContent  = String( wave );

                lifeEls.forEach( function ( el, i ) { el.classList.toggle( 'is-gone', i >= lives ); } );
            }

            function clearKeys() { keyL = keyR = firing = touching = false; }

            // A fresh game, sitting at "ready" behind its overlay. Nothing runs
            // until the player asks for it (see rule 3 at the top).
            function reset()
            {
                wave   = 1;
                score  = 0;
                lives  = LIVES;
                record = false;
                state  = 'ready';

                A.loop.halt();
                clearKeys();
                setWave();
                paint();
                A.overlay();
                draw();
            }

            //---- input -------------------------------------------------------

            function onKey( e )
            {
                var k = e.key, el = e.target;

                if( ! A.isLive() || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( keyBusy( e ) ) return;

                // Space and Enter belong to whatever button has the focus - the
                // overlay's own, or "new game" in the toolbar. Taking them here
                // as well would start the game twice on one press.
                if( el && el.tagName === 'BUTTON' && ( k === ' ' || k === 'Enter' ) ) return;

                if     ( k === 'ArrowLeft'  ) keyL = true;
                else if( k === 'ArrowRight' ) keyR = true;
                else if( k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'Enter' ) { firing = true; A.play(); }
                else if( k === 'p' || k === 'P' ) { if( state === 'paused' ) A.resume(); else A.pause(); }
                else return;

                e.preventDefault();                  // the arrows and space would scroll the page
            }

            function onKeyUp( e )
            {
                if     ( e.key === 'ArrowLeft'  ) keyL = false;
                else if( e.key === 'ArrowRight' ) keyR = false;
                else if( e.key === ' ' || e.key === 'Spacebar' || e.key === 'ArrowUp' || e.key === 'Enter' ) firing = false;
            }

            // touch-action: none on the canvas is what stops the browser
            // scrolling or zooming with the same finger; the pointer capture is
            // what keeps a finger that has drifted off the canvas still
            // steering.
            function onDown( e )
            {
                canvasEl.focus();

                if( state !== 'playing' && state !== 'dying' && state !== 'wave' ) { A.play(); return; }

                touching = true;
                firing   = true;
                dragFrom = e.clientX;
                dragShip = px;

                     'XXX',
                     '...' ],
                O: [ 'XX',
                     'XX' ],
                S: [ '.XX',

                     'XXX',
                     '...' ],

                {
                    minx = Math.min( minx, c[ i ][ 0 ] ); maxx = Math.max( maxx, c[ i ][ 0 ] );
                    miny = Math.min( miny, c[ i ][ 1 ] ); maxy = Math.max( maxy, c[ i ][ 1 ] );
                }

                ox = Math.floor( ( 4 - ( maxx - minx + 1 ) ) / 2 );
                oy = Math.floor( ( 2 - ( maxy - miny + 1 ) ) / 2 );

                for( i = 0; i < c.length; i++ )
                    on[ ( c[ i ][ 1 ] - miny + oy ) * 4 + ( c[ i ][ 0 ] - minx + ox ) ] = true;

                for( i = 0; i < nextCells.length; i++ )
                    if( on[ i ] ) nextCells[ i ].dataset.p = queue;
                    else          nextCells[ i ].removeAttribute( 'data-p' );

                nextEl.setAttribute( 'aria-label', T( 'games.tetrisNext' ) + ': ' + queue );
            }

            // Everything let go at once. A pane switch, a hidden tab or a window
            // that lost focus all arrive while a key is down, and its keyup is
            // then delivered somewhere else - so the piece would go on sliding
            // for ever.
            function clearKeys()
            {
                Object.keys( keys ).forEach( function ( k ) { keys[ k ] = false; } );
                Object.keys( pads ).forEach( function ( k ) { pads[ k ].classList.remove( 'is-down' ); } );
                das = 0; rep = 0; soft = 0;
            }

            // A fresh well, sitting at "ready" behind its overlay. Nothing runs
            // until the player asks for it.
            function reset()
            {
                var i;

                board = [];
                for( i = 0; i < ROWS * COLS; i++ ) board.push( 0 );

                score = 0; lines = 0; level = 1;
                piece = null; clearing = null; bag = [];
                dirty = false;
                state = 'ready';

                A.loop.halt();
                clearKeys();
                fit();                         // the box may have changed size behind another pane

                queue = nextPiece();
                spawn();

                paint();
                A.overlay();
                draw();
            }

            function over()
            {
                piece = null;
                state = 'over';
                A.loop.halt();
                flush();
                A.overlay();
                draw();
            }

            // The record is put up at every PAUSE in the game and not the moment
            // it is beaten: saveBest() rewrites the whole file and queues an
            // upload, and four rows go at once. Every way out of a game passes
            // through here - the last piece, the pause button, another pane, a
            // hidden tab - so nothing is ever left unwritten.
            function flush()
            {
                if( ! dirty ) return;
                dirty = false;
                saveBest( 'tetris', best );
            }

            //---- input -------------------------------------------------------

            // The three held keys and the two that are single presses. Left and
            // right repeat on their own clock (see step), so they are held;
            // rotate and the hard drop happen once and only once, however long
            // the key is down.
            var KEYS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down',
                         ArrowUp: 'cw', x: 'cw', X: 'cw', z: 'ccw', Z: 'ccw',
                         ' ': 'drop', Spacebar: 'drop' };

            // One place for what a key DOES the moment it goes down, so the five
            // touch keys are the same five keys and not a second set of rules.
            function press( k )
            {
                if( state !== 'playing' || clearing ) return;

                if     ( k === 'left'  ) { moveX( -1 ); das = 0; rep = 0; }
                else if( k === 'right' ) { moveX(  1 ); das = 0; rep = 0; }
                else if( k === 'down'  ) { if( moveDown() ) score++; soft = 0; }
                else if( k === 'cw'    ) rotate(  1 );
                else if( k === 'ccw'   ) rotate( -1 );
                else if( k === 'drop'  ) hardDrop();

                paint();
                draw();
            }

            function onKey( e )
            {
                var k = KEYS[ e.key ], el = e.target;

                if( ! A.isLive() || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( keyBusy( e ) ) return;

                if( e.key === 'p' || e.key === 'P' )
                {
                    if( state === 'paused' ) A.resume(); else A.pause();
                    e.preventDefault();
                    return;
                }

                if( ! k ) return;

                // Space belongs to whatever button has the focus - the overlay's
                // own, or "new game" in the toolbar. Taking it here as well
                // would start the game and drop a piece on one press.
                if( el && el.tagName === 'BUTTON' && e.key === ' ' ) return;

                e.preventDefault();            // the arrows and space would scroll the page

                // Asked FIRST: a still game is started by its first key, and
                // starting one clears the keys - so taking this one before that
                // happens would lose it again.
                if( state === 'ready' || state === 'over' ) { A.play(); return; }

                // The OS repeats a held key by sending more keydowns. Left,
                // right and down do their own repeating on the game's clock (and
                // at its speed), and a rotation must happen once however long
                // the key is held - so every one of them is dropped here.
                if( e.repeat ) return;

                if( keys[ k ] !== undefined ) keys[ k ] = true;
                if( pads[ k ] ) pads[ k ].classList.add( 'is-down' );

                press( k );
            }

            // The other half is answered whatever the state, and with none of
            // the guards above: they are there to stop a key being TAKEN, never
            // released, and one that is not let go stays held for the rest of
            // the game.
            function onKeyUp( e )
            {
                var k = KEYS[ e.key ];

                if( ! k ) return;
                if( keys[ k ] !== undefined ) keys[ k ] = false;
                if( pads[ k ] ) pads[ k ].classList.remove( 'is-down' );
            }

            function onPad( e )
            {
                var btn = e.currentTarget, k = btn.dataset.tetKey, down = e.type === 'pointerdown';

                if( down )
                {
                    // The finger keeps the key it started on even when it slides
                    // off, so the pointerup always comes back here and the key
                    // is always let go.
                    if( btn.setPointerCapture ) try { btn.setPointerCapture( e.pointerId ); } catch ( err ) {}
                    e.preventDefault();        // no focus ring and no click behind it
                }

                if( keys[ k ] !== undefined ) keys[ k ] = down;
                btn.classList.toggle( 'is-down', down );

                if( ! down ) return;

                // ...the five keys start a still game too, and then do nothing
                // else: the first tap is "play", not a piece moved.
                if( state === 'ready' || state === 'over' ) { A.play(); return; }
                press( k );
            }

            //---- mounting ----------------------------------------------------

            // The same max-merge every scored game here uses, and for the same
            // reason: the plug re-reads the file on focus and on a tap, and that
            // answer can be older than the game being played right now.
            function adoptBest( n )
            {
                best = keepBest( best, n, bestEl );
                return best;
            }

            function init()
            {
                rootEl      = document.querySelector( '.tetris' );
                canvasEl    = document.getElementById( 'tetCanvas' );
                ctx         = canvasEl.getContext( '2d' );
                overEl      = document.getElementById( 'tetOver' );
                overTitleEl = document.getElementById( 'tetOverTitle' );
                overSubEl   = document.getElementById( 'tetOverSub' );
                overBtnEl   = document.getElementById( 'tetOverBtn' );
                scoreEl     = document.getElementById( 'tetScore' );
                bestEl      = document.getElementById( 'tetBest' );
                linesEl     = document.getElementById( 'tetLines' );
                levelEl     = document.getElementById( 'tetLevel' );
                nextEl      = document.getElementById( 'tetNext' );
                pauseBtn    = document.getElementById( 'tetPause' );

                nextEl.innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>';
                nextCells = Array.prototype.slice.call( nextEl.children );

                build();

                A = arcade( {
                    readyKey: 'games.tetris',
                    els: { canvas: canvasEl, over: overEl, overTitle: overTitleEl,
                           overSub: overSubEl, overBtn: overBtnEl, pause: pauseBtn,
                           newGame: document.getElementById( 'tetNew' ) },
                    getState: function () { return state; },
                    setState: function ( v ) { state = v; },
                    score:    function () { return score; },
                    step: step, draw: draw, reset: reset, clearKeys: clearKeys,
                    flush: flush, palette: palette, fit: fit,
                    onKey: onKey, onKeyUp: onKeyUp
                } );

                // focusOnTap: the well takes the focus before the game starts,
                // or the space that follows re-clicks the button behind it.
                A.wire( { focusOnTap: true,
                          pads: { sel: '[data-tet-key]', on: onPad,
                                  keep: function ( b ) { pads[ b.dataset.tetKey ] = b; } } } );

                palette();
                reset();

                return { enter: A.enter, leave: A.leave };
            }

            return { init: init, adoptBest: adoptBest };
        } )();

        //------------------------------------------------------------------------//
        // PERSISTENCE - one file, one record per game:
        //
        //     { "best":  { "g2048": 12345, "invaders": 3120, "asteroids": 8400,
        //                  "tetris": 24500 },
        //       "times": { "easy": 47, "medium": 210, "hard": 999,
        //                  "sudokuEasy": 421, "sudokuMedium": 903 } }
        //
        // Two maps because there are two kinds of record: 2048 and the three
        // canvas games keep a SCORE, where more is better, and Minesweeper and
        // Sudoku keep a TIME per difficulty, where less is. Each is merged its
        // own way (see adoptBest / adoptTimes).
        //
        // The two timed games share the one `times` map and each reads only the
        // keys it knows: Minesweeper was first and took the bare easy / medium /
        // hard, so Sudoku's carry its name. A third timed game only has to pick
        // a prefix of its own.
        //
        // The board itself is not saved. A game is one sitting, and writing it
        // would PUT the whole file on every arrow key; only the record outlives
        // the visit.

        var data   = { best: {}, times: {} };   // the file as last read, kept whole so
                                                // another game's record is never written over
        var loaded = false;          // false = we do not know what is in the file

        async function loadData()
        {
            var res = await store.read( FILE );

            if( res.source === 'empty' )
            {
                data   = { best: {}, times: {} };   // no games.json yet - a safe first run
                loaded = true;
            }
            else if( res.body !== null )
            {
                try
                {
                    var parsed = JSON.parse( res.body );

                    data = ( parsed && typeof parsed === 'object' && ! Array.isArray( parsed ) ) ? parsed : {};
                    if( ! data.best  || typeof data.best  !== 'object' ) data.best  = {};
                    if( ! data.times || typeof data.times !== 'object' ) data.times = {};
                    loaded = true;
                }
                catch ( e )
                {
                    // A damaged file reads as "no record" and is never written over.
                    data   = { best: {}, times: {} };
                    loaded = false;
                }
            }
            // else: the server was unreachable AND nothing is cached (res.source
            // is 'unknown', or 'unauth' with no cached copy). Leave what we have
            // alone and stay unloaded - writing now is exactly what would
            // overwrite the real file with an empty one.

            // Both directions at once: a record set on another device is
            // adopted, and one set here since the last read is written back.
            saveBest( 'g2048',    G2048.adoptBest(    Number( data.best.g2048    ) || 0 ) );
            saveBest( 'invaders', Invaders.adoptBest( Number( data.best.invaders ) || 0 ) );
            saveBest( 'asteroids', Asteroids.adoptBest( Number( data.best.asteroids ) || 0 ) );
            saveBest( 'tetris',    Tetris.adoptBest(    Number( data.best.tetris    ) || 0 ) );

            var mineTimes = Mines.adoptTimes( data.times );
            Object.keys( mineTimes ).forEach( function ( k ) { saveTime( k, mineTimes[ k ] ); } );

            var sudokuTimes = Sudoku.adoptTimes( data.times );
            Object.keys( sudokuTimes ).forEach( function ( k ) { saveTime( k, sudokuTimes[ k ] ); } );
        }

        // Writes the local copy now and queues the upload; the store flushes it
        // on a short timer, on reconnect or on tab focus. Fire-and-forget.
        function saveBest( game, score )
        {
            if( ! loaded ) return;                         // we do not know the file: do not write it
            if( score <= ( Number( data.best[ game ] ) || 0 ) ) return;

            data.best[ game ] = score;
            store.write( FILE, JSON.stringify( data, null, 2 ) );
        }

        // The same, for the other kind of record: a time, where the merge is a
        // MINIMUM. A missing or damaged entry reads as NaN, which is not
        // finite, so a first record always wins - and a real 0 does not read as
        // "no record yet" the way `|| 0` made it.
        function saveTime( level, secs )
        {
            var have = Number( data.times[ level ] );

            if( ! loaded ) return;
            if( isFinite( have ) && secs >= have ) return;

            data.times[ level ] = secs;
            store.write( FILE, JSON.stringify( data, null, 2 ) );
        }

        //------------------------------------------------------------------------//
        // BOOT

        function start()
        {
            tiles   = Array.prototype.slice.call( document.querySelectorAll( '.game-tile[data-game]' ) );
            panes   = Array.prototype.slice.call( document.querySelectorAll( '.game-pane' ) );
            titleEl = document.getElementById( 'appTitle' );
            optsEl  = document.getElementById( 'gameOptions' );
            slotEl  = document.getElementById( 'gameOptionsSlot' );

            tiles.forEach( function ( b )
            {
                b.addEventListener( 'click', function () { showGame( b.dataset.game ); } );
            } );

            // Escape is the way back on a keyboard - the same thing the game's
            // name does with a click, from any of the six and whatever the game
            // is doing. goHome() calls leave(), so the loop stops, the held keys
            // are let go and the record is written, exactly as it is when the
            // name is clicked.
            //
            // keyBusy() is what keeps it out of the way of everything else that
            // answers Escape: a sheet over the app (the help dialog, the install
            // prompt, "session expired") closes itself instead of dropping the
            // game behind it, and a field with the caret in it keeps its own.
            // On the Games screen there is nothing to go back from, so `current`
            // being empty ends it before any of that.
            //
            // It used to be the second pause key in Invaders and Tetris. It is
            // not any more - `p` is, in both - because a key that means "out of
            // here" everywhere else in the suite cannot mean "wait a moment" in
            // two of six games.
            document.addEventListener( 'keydown', function ( e )
            {
                if( e.key !== 'Escape' || e.ctrlKey || e.altKey || e.metaKey ) return;
                if( ! current || keyBusy( e ) ) return;

                e.preventDefault();
                goHome();
            } );

            GAMES.sudoku   = Sudoku.init();
            GAMES.g2048    = G2048.init();
            GAMES.mines    = Mines.init();
            GAMES.invaders = Invaders.init();
            GAMES.asteroids = Asteroids.init();
            GAMES.tetris   = Tetris.init();

            // The six toolbars are written inside their panes - that is where
            // they are read, next to the board they act on - and MOVED into the
            // header here, after every init() has taken its references. A moved
            // node keeps its listeners and its id, so nothing above knows.
            Array.prototype.slice.call( document.querySelectorAll( '.view-bar[data-options]' ) )
                 .forEach( function ( bar ) { slotEl.appendChild( bar ); } );

            goHome();

            NayiveUI.firstRun( {
                app:   'games',
                title: 'Games',
                lead:  [ T( 'games.introLead' ), T( 'games.introBack' ) ],
                buttons: [
                    { sel: '.game-tile[data-game="sudoku"]',    text: T( 'games.introSudoku' ) },
                    { sel: '.game-tile[data-game="g2048"]',     text: T( 'games.intro2048' ) },
                    { sel: '.game-tile[data-game="mines"]',     text: T( 'games.introMines' ) },
                    { sel: '.game-tile[data-game="invaders"]',  text: T( 'games.introInvaders' ) },
                    { sel: '.game-tile[data-game="asteroids"]', text: T( 'games.introAsteroids' ) },
                    { sel: '.game-tile[data-game="tetris"]',    text: T( 'games.introTetris' ) },
                    { sel: '#syncIndicator', name: T( 'ui.syncName' ), text: T( 'games.introSync' ) }
                ]
            } );
        }

        NayiveI18n.ready.then( function ()
        {
            store = NayiveStore.createStore( { apiBase: GumApi.API_FILES } );

            start();

            // The store's state machine drives the header plug for every read
            // and write.
            store.onState( NayiveUI.syncIndicator() );

            // The plug's click and the focus / visibilitychange re-reads, all on
            // one guarded path (shared/ui.js). loadData() only ever raises the
            // best figure, so a re-read can never disturb a game in progress -
            // the default guard (any open sheet) is enough here.
            NayiveUI.wireRefresh( { store: store, read: loadData } );

            // Probe the API, then read. On a failed probe the shared helper
            // bounces to the sign-in page only when we are really online with
            // nothing cached; otherwise it opens on the local cache and the
            // store syncs once the connection is back.
            NayiveUI.bootWithStore( store, loadData );
        } );
    } )();
    </script>

</body>
</html>
