<!-- index.html - Games: the small games that run entirely in the browser.

     The header is the whole navigation: the app icon + name, then one
     .icon-btn per game (the Calendar day / week / month shape - icons with the
     name in the tooltip, .is-active on the current one). Each button shows its
     own <section class="game-pane">; only one is on screen at a time.

     All six are in - Sudoku, 2048, Minesweeper, Space Invaders,
     Asteroids and Tetris - and they went into their panes one at a time. The shared
     plumbing
     came with the first one: a store over data/games/games.json holding each
     game's record, the real clickable #syncIndicator in place of the static
     plug, and the { enter, leave } pair every game registers so that exactly
     one of them is ever live. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Games</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='6' y1='11' x2='10' y2='11'/%3E%3Cline x1='8' y1='9' x2='8' y2='13'/%3E%3Cline x1='15' y1='12' x2='15.01' y2='12'/%3E%3Cline x1='18' y1='10' x2='18.01' y2='10'/%3E%3Cpath d='M17.32 5H6.68a4 4 0 0 0-3.98 3.59c-.08.67-.7 5.87-.7 7.41a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.54-.62-6.74-.7-7.41A4 4 0 0 0 17.32 5z'/%3E%3C/svg%3E">

    <!-- Shared colour scheme. Apply the saved choice before first paint to avoid a flash. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <!-- Offline-capable persistence: local last-known-good cache + write-behind sync. -->
    <script src="../shared/store.js" defer></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS (and localhost). -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <style>
        /* The shell (.app / .topbar / .icon-btn / .empty-state) is all in
           ../shared/app.css. Only what is unique to Games lives here. */

        /* TOOL SHELL (see APP SHELL in app.css): .app is height: 100%, so the
           page under it has to be too, and the page itself never scrolls -
           .game-host does. It is what lets a game centre itself in the pane
           instead of piling up under the header. */
        html, body { height: 100%; overflow: hidden; }

        /* THE HEADER IS THE WHOLE NAVIGATION, and it has two states.

               [gamepad] Games                                       [?] [plug]
               [gamepad] Minesweeper  | [9x9][16][30] * 10 0:00 -- [new] | [?] [plug]

           On the Games screen it is only the app name; open a game and the
           NAME becomes the game's, and the game's own toolbar takes the middle.
           There are no game buttons in the header any more - the six cards in
           the pane below are the way in, and the name is the way back.

           Centring the middle group takes two things. First the two outer
           blocks share the slack equally (both `flex: 1 1 0`), which replaces
           app.css's `margin-left: auto` on .topbar-actions - an auto margin
           there would shove the group left of centre. That alone still leaves
           it 6px off, because the left side also carries 36px the right side
           does not: the 20px app icon, its 6px margin and the title's 10px one.
           So the right block opens with a 36px counterweight, and the group
           lands dead centre.

           The counterweight has to be PADDING on the right block. Putting it
           inside as a `::before` spacer does nothing: that block's width comes
           from flex-grow, not from its content, so a spacer within it never
           moves its edge. Nor can the padding be made to shrink - a wrapping
           flex row breaks onto a new line BEFORE it shrinks anything - so the
           phone block below simply takes it back off.

           A toolbar is wider than the six buttons it replaces (Minesweeper's is
           the widest: three levels, three counters and "new game"), so on a
           phone the header wraps to a second row with some games open. That
           costs nothing in height overall - the pane below gave up exactly this
           row to hand it over - and it is the reason .game-options is allowed
           to wrap as a UNIT and never inside itself. */
        .topbar h1 { flex: 1 1 0; min-width: 0; }

        /* The app name is plain text and the launcher link app.css wires
           (.nayive-home-link); the GAME name is a <button> inside the same h1,
           and shared/ui.js's home handler steps aside for any button in the
           header - so the two live in one element with no flag to keep in step.
           The name is cut with an ellipsis and never by counting characters:
           the six names are translated (Venator pyrobolorum is the long one)
           and a cut that is right in English is wrong in Latin. */
        .topbar h1.has-game                     { color: var(--text); cursor: default; }
        .topbar h1.has-game:hover               { text-decoration: none; }
        .game-title
        {
            display: block; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            padding: 0; border: 0; background: none; cursor: pointer;
            font: inherit; color: var(--accent); text-align: left;
        }
        .game-title:hover { text-decoration: underline; text-underline-offset: 3px; }

        /* The middle: the open game's toolbar, between two rules. It wraps to a
           row of its own before anything inside it does - nowrap on the slot,
           and the .view-bar inside it gives up the padding and the bottom line
           it wears in a pane, where it is a row across the top of the board. */
        .game-options
        {
            display: flex; align-items: stretch; gap: 6px;
            flex: 0 1 auto; min-width: 0; max-width: 100%;
        }
        .game-options .tb-sep   { width: 1px; align-self: stretch; margin: 4px 0; background: var(--line); flex: 0 0 auto; }
        .game-options-slot      { display: flex; align-items: center; min-width: 0; }
        .game-options .view-bar { padding: 0; border-bottom: 0; flex-wrap: nowrap; gap: var(--space-2); }
        /* In a pane the counters take the slack between the two button groups;
           in the header the whole group sits at its own width, or it would push
           the rules out to the edges of an empty row. */
        .game-options .game-stats { flex: 0 0 auto; }

        .topbar .topbar-actions { flex: 1 1 0; margin-left: 0; justify-content: flex-end; padding-left: 36px; }

        /* THE GAMES SCREEN - the launcher's own tile, one level down: the icon
           over the name, the whole card the way in, and no ">" on it. */
        .games-home
        {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100%; padding: 24px 16px; box-sizing: border-box;
        }
        .games-grid { display: grid; grid-template-columns: repeat( 3, 1fr ); gap: 14px 20px; justify-items: center; }
        .game-tile
        {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            width: clamp( 88px, 27vw, 118px ); padding: 16px 8px 12px;
            border: 0; border-radius: var(--radius-l); background: none; cursor: pointer;
            color: var(--text); font: inherit;
            transition: background .12s ease, transform .1s ease;
        }
        .game-tile:hover  { background: color-mix( in srgb, var(--accent) 12%, transparent ); }
        .game-tile:active { transform: scale( 0.95 ); }
        .game-tile svg    { width: 40px; height: 40px; color: var(--accent); flex: 0 0 auto; }
        .game-tile span   { font-size: 0.85rem; color: var(--text-dim); text-align: center; line-height: 1.2; }
        .game-tile:hover span { color: var(--text); }

        /* PHONE (the one breakpoint, see TWO LAYOUT MODES in app.css). A 390px
           row cannot hold the app name AND a toolbar, and sharing the slack
           between them is the wrong answer: the h1 has a 0 flex-basis, so it
           gives up ALL of its width and the game's name - the thing that says
           where you are - is what disappears. So the phone stops centring and
           takes TWO rows instead:

               [gamepad] Minesweeper                         [?] [plug]
                         | [9x9][16x16][30x16]  * 10  0:00  -- [new] |

           `flex: 1 0 100%` is the row of its own (the .bar-info trick, see
           app.css) and `order: 1` is what puts it under the "?" instead of
           pushing it onto a third line - it comes BEFORE .topbar-actions in the
           markup, where the centred desktop layout needs it. The counterweight
           and the shared slack go with the centring; the actions take their
           auto margin back and sit at the right edge of row 1.

           The Games screen keeps ONE row: the block is [hidden] there. */
        @media (max-width: 640px)
        {
            .topbar h1                { flex: 1 1 auto; }
            .topbar .topbar-actions   { flex: 0 0 auto; margin-left: auto; padding-left: 0; }
            .game-options             { order: 1; flex: 1 0 100%; justify-content: center; gap: 4px; }
            .game-options .view-bar   { gap: 10px; }
            .game-options .game-stats { gap: 10px; }
            .games-grid               { gap: 8px 6px; }
            .game-tile                { width: 100%; max-width: 116px; padding: 12px 4px 10px; }
        }

        /* The work area: one pane per game, only the active one shown. It fills
           what the header leaves and scrolls by itself (tool shell, see app.css). */
        .game-host         { flex: 1 1 auto; min-height: 0; overflow: auto; }
        .game-pane         { display: none; height: 100%; }
        .game-pane.is-open { display: block; }

        /* ---- 2048 ---------------------------------------------------------
           A 4x4 grid and one move( dir ). The game is turn-based, so there is
           no canvas and no loop: every render answers one key or one swipe.

           The board is sized off ONE length, --board, so the squares and the
           numerals inside them scale together. It is the
           smallest of three limits - a comfortable maximum, the phone's width,
           and the height of a short landscape window - which is what keeps the
           whole game on screen without the host ever having to scroll.

           The tile ramp: 2 and 4 are mixed out of the theme's own tokens, so
           they sit a faint step above the board in either colour scheme. From
           8 up they are fixed colours with near-white numerals - the sequence
           is something a player reads by sight, and it would stop being one if
           it changed with the theme. */
        .g2048
        {
            /* --board is the room the pane ACTUALLY has, not a guess at it.
               .g2048-area is a SIZE CONTAINER holding nothing but the board, so
               100cqw and 100cqh are exactly the width and the height left over
               once the header and the hint have taken theirs - which is what
               the old `min( 420px, 90vw, 56vh )` was trying to estimate, and
               why the board came out small on a desktop: the 420px cap won on
               every window wide enough to be a PC.

               The floor is for a window too short to hold even that: under it
               the area scrolls, the way it always did, instead of shrinking the
               board to nothing. */
            --board: max( 180px, min( 100cqw, 100cqh ) );
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; height: 100%; padding: 16px; box-sizing: border-box;
        }
        /* NOTHING but the board goes in here. Anything else inside a size
           container eats into the very height the board is measured against -
           which is why the hint stays outside it, as a sibling. */
        .g2048-area
        {
            flex: 1 1 auto; min-height: 0; align-self: stretch; overflow: auto;
            display: flex; container-type: size;
        }

        .g2048-board
        {
            position: relative; box-sizing: border-box; margin: auto;
            width: var(--board); aspect-ratio: 1;
            /* The ROWS have to be spelled out too. Left to `auto` they are
               sized by what is in them and the leftover height is then handed
               out in equal SHARES, not equal sizes - so a row holding a numeral
               came out taller than an empty one and no square was square. It
               never showed at 420px; at the size the board is now it is the
               first thing you see.

               The gap and the padding are off --board for the same kind of
               reason: a percentage here resolves against the PARENT's width,
               not the board's, so it stayed 45px wide while the board shrank. */
            display: grid;
            grid-template-columns: repeat( 4, 1fr );
            grid-template-rows:    repeat( 4, 1fr );
            gap: calc( var(--board) * 0.024 ); padding: calc( var(--board) * 0.024 );
            border-radius: var(--radius-m); background: var(--card2);
            touch-action: none; -webkit-user-select: none; user-select: none;
        }
        .g2048-cell
        {
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--radius-s);
            background: color-mix( in srgb, var(--text) 7%, transparent );
            font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
            font-size: calc( var(--board) * 0.115 );
        }
        /* Three, four and five digits in the same square as one. */
        .g2048-cell.is-mid   { font-size: calc( var(--board) * 0.098 ); }
        .g2048-cell.is-wide  { font-size: calc( var(--board) * 0.076 ); }
        .g2048-cell.is-xwide { font-size: calc( var(--board) * 0.060 ); }

        .g2048-cell[data-v="2"]     { background: color-mix( in srgb, var(--text) 17%, var(--card2) ); color: var(--text-dim); }
        .g2048-cell[data-v="4"]     { background: color-mix( in srgb, var(--text) 32%, var(--card2) ); color: var(--text); }
        .g2048-cell[data-v="8"]     { background: #2E7D74; color: #FBF7F0; }
        .g2048-cell[data-v="16"]    { background: #2F8B5C; color: #FBF7F0; }
        .g2048-cell[data-v="32"]    { background: #5E9633; color: #FBF7F0; }
        .g2048-cell[data-v="64"]    { background: #8C9526; color: #FBF7F0; }
        .g2048-cell[data-v="128"]   { background: #C0951F; color: #FBF7F0; }
        .g2048-cell[data-v="256"]   { background: #D07E1E; color: #FBF7F0; }
        .g2048-cell[data-v="512"]   { background: #C85F27; color: #FBF7F0; }
        .g2048-cell[data-v="1024"]  { background: #C0432F; color: #FBF7F0; }
        .g2048-cell[data-v="2048"]  { background: #B33C6E; color: #FBF7F0; }
        .g2048-cell[data-v="4096"]  { background: #8E4BB0; color: #FBF7F0; }
        .g2048-cell[data-v="8192"]  { background: #5A57C0; color: #FBF7F0; }
        .g2048-cell[data-v="max"]   { background: #3C6FC4; color: #FBF7F0; }

        /* The tile that was just dealt grows in, the ones that merged give a
           short pop. Both classes are re-applied on every render with one
           reflow in between (see render): without it the browser never sees
           the class leave, and a square that merges twice running would not
           replay the animation. */
        .g2048-cell.is-new    { animation: g2048-in  0.14s ease-out; }
        .g2048-cell.is-merged { animation: g2048-pop 0.14s ease-out; }
        @keyframes g2048-in  { from { transform: scale( 0.3 ); opacity: 0; } }
        @keyframes g2048-pop { 50%  { transform: scale( 1.14 ); } }


        /* THE COVER - what sits over a game that is not running: "ready",
           "paused" and "game over", and it is the same card in all six. Over the
           PLAY AREA and never over the header, so the game's name (the way back)
           and its toolbar stay live and an unfinished game can be left the way
           any other pane is left.

           It was written out four times - .g2048-over, .inv-over, .ast-over and
           .tet-over, the same nine lines each - before Minesweeper and Sudoku
           were going to make it six. The per-game class stays on the element for
           the few rules that really are its own; everything here is shared.

           `cursor: pointer` is not: the three canvas games take a click anywhere
           on the card, because on a phone the whole card is the target you
           actually hit, and the other three have a real button in the middle. */
        .game-cover
        {
            position: absolute; inset: 0; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            padding: 16px; box-sizing: border-box; text-align: center;
            border-radius: var(--radius-m);
            background: color-mix( in srgb, var(--card2) 86%, transparent );
        }
        .game-cover.tappable { cursor: pointer; }
        /* The two timed games cover the board SOLIDLY, and the others do not.
           86% of --card2 over a small canvas hides it; over a 440px Sudoku grid
           it does not, and a board that can still be read with the clock stopped
           is not a pause, it is free thinking time. Nothing is lost by hiding it
           whole - there is no animation to keep an eye on underneath. */
        .game-cover.solid    { cursor: pointer; background: var(--bg); }
        .game-cover-t { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--text); }
        .game-cover-s { margin: 0; font-size: 0.85rem; color: var(--text-dim); }

        .g2048-hint   { margin: 0; text-align: center; font-size: 0.78rem; color: var(--text-faint); }

        /* ---- Minesweeper ---------------------------------------------------
           The pane is a little screen of its own: the shared .view-bar row at
           the TOP - the three difficulties on the left, the counters in the
           middle, "new game" on the right - and the board under it.

           The difficulty switch is a mode switch, so it is the same shape as
           the five game buttons above it: .icon-btn, icon only, the level's
           name in the title, .is-active on the current one. It is NOT in the
           header, where the build plan first put it: that row has less than
           10px to spare at 390px (see the block at the top of this file), so
           three more buttons wrap it onto a second line on every phone - and
           they would sit there while the other four games are on screen, which
           is worse than a second row inside the one pane that owns them. */
        .mines            { position: relative; height: 100%; display: flex; flex-direction: column; }

        /* The counters take the slack between the two button groups, so they
           read as centred while the groups stay pinned to the two edges. This
           is NOT the shared .bar-info: that one is `flex: 1 0 100%`, a row of
           its own under the toolbar, and these belong on the line.

           It is .game-stats and not .mines-stats because Sudoku's toolbar
           carries the same pair - a clock and a record - in the same place. */
        .game-stats       { display: flex; align-items: center; justify-content: center; gap: 16px;
                            flex: 1 1 auto; min-width: 0; font-size: 0.85rem; color: var(--text-dim);
                            font-variant-numeric: tabular-nums; }
        .game-stat        { display: inline-flex; align-items: center; gap: 5px; }
        .game-stat svg    { width: 15px; height: 15px; flex: 0 0 auto; }
        .game-stat b      { font-weight: 600; color: var(--text); }

        /* The board scrolls INSIDE the pane, so the toolbar above it never
           leaves the screen: hard is 30 columns - around 900px - and no phone
           shows that whole. inline-grid + text-align is what centres it; a flex
           `justify-content: center` cuts the left edge off, and out of reach,
           as soon as the board is wider than the box. */
        /* A small board sits in the middle of the pane the way 2048's does.
           The centring is `margin: auto` ON THE CHILD and not a
           `justify-content: center` on the box: an auto margin collapses to 0
           when the free space runs out, so a board wider or taller than the
           pane still scrolls to its far edge instead of being cut off. */
        .mines-area       { flex: 1 1 auto; min-height: 0; overflow: auto;
                            display: flex; padding: var(--space-4);
                            container-type: size; }
        .mines-fit        { margin: auto; text-align: center; }

        /* Minesweeper is the odd one out of the five that scale: it has no
           --board, because the board is not one shape - it is 9x9, 16x16 or
           30x16, and what has to be sized is the CELL. So the same idea comes
           in through a different door. .mines-area is the size container (the
           hint sits outside it, as in the other four), --cols and --rows are
           written on the board by newGame(), and --fit is the biggest square
           that fits both ways at once.

           The floor is what the whole level is about: a cell is something a
           FINGER has to hit, so it never goes under the sizes below - hard
           would be an 11px square on a phone if it were made to fit. Under the
           floor the board scrolls inside the pane, exactly as it always has.
           Above it - which is every desktop - it now grows: hard on a 1080p
           screen is a 60px cell instead of 28. */
        .mines-board      { display: inline-grid; gap: 2px;
                            --fit: min( calc( ( 100cqw - ( var(--cols) - 1 ) * 2px ) / var(--cols) ),
                                        calc( ( 100cqh - ( var(--rows) - 1 ) * 2px ) / var(--rows) ) );
                            --cell: max( 34px, var(--fit) );
                            grid-template-columns: repeat( var(--cols), var(--cell) ); }
        .mines-board.lv-medium { --cell: max( 32px, var(--fit) ); }
        .mines-board.lv-hard   { --cell: max( 28px, var(--fit) ); }

        /* Game over: the board stops answering. One rule, instead of an
           "is-over" variant of every hover and cursor line below. */
        .mines-board.is-over   { pointer-events: none; }

        /* A cell is a real <button>: the focus ring, Enter / Space and the "no
           iOS callout on a long press" rule in app.css all come with it. */
        .mcell
        {
            width: var(--cell); height: var(--cell); padding: 0;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--line); border-radius: 4px;
            background: var(--card2); color: var(--text);
            /* the raised look of a square still to be opened: one highlight
               along its top edge. In the dark scheme --card2 and the opened
               tint below sit close together, and this is what tells them
               apart at a glance. */
            box-shadow: inset 0 1px 0 color-mix( in srgb, var(--text) 12%, transparent );
            font: 600 calc( var(--cell) * 0.52 ) / 1 var(--font-sans);
            cursor: pointer;
            /* the board pans with a finger on a phone and a double tap must not
               zoom it - a long press here is ours, it plants the flag */
            touch-action: manipulation; -webkit-user-select: none; user-select: none;
        }
        .mcell svg           { width: calc( var(--cell) * 0.62 ); height: calc( var(--cell) * 0.62 ); }
        .mcell:hover         { border-color: color-mix( in srgb, var(--accent) 55%, transparent ); }
        .mcell:focus         { outline: none; }
        .mcell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        /* An opened square is FLAT, but not invisible: a bare var(--bg) is the
           page itself and the cleared area then has no edges at all. The faint
           tint is the one 2048's empty squares use, a step below the raised
           var(--card2) of a square still to be opened. */
        .mcell.is-open       { background: color-mix( in srgb, var(--text) 6%, transparent );
                               border-color: transparent; box-shadow: none; cursor: default; }
        .mcell.is-open:hover { border-color: transparent; }
        .mcell.is-flag       { color: var(--accent); }
        .mcell.is-mine       { color: var(--text-dim); }
        .mcell.is-boom       { background: var(--danger); color: var(--on-accent);
                               border-color: transparent; box-shadow: none; }
        .mcell.is-wrong      { color: var(--danger); }

        /* The eight numbers. Minesweeper's classic palette (blue, green, red,
           navy, maroon...) is unreadable on a dark background, so there are two
           of them: these on the dark scheme... */
        .mines-board  { --m1: #5B9DF9; --m2: #6FBF73; --m3: #E9727F; --m4: #B58BF0;
                        --m5: #E0A21E; --m6: #4FC7C7; --m7: #E7E7E9; --m8: #93959F; }
        /* ...and these on the beige one (the light scheme is a data-theme
           attribute, not a media query - see theme.css). */
        :root[data-theme="light"] .mines-board
                      { --m1: #1A4F9E; --m2: #1F6B3A; --m3: #9C2F3A; --m4: #5B2E9E;
                        --m5: #8A5A0B; --m6: #0F6E6E; --m7: #242732; --m8: #5E6472; }
        .mcell[data-n="1"] { color: var(--m1); }
        .mcell[data-n="2"] { color: var(--m2); }
        .mcell[data-n="3"] { color: var(--m3); }
        .mcell[data-n="4"] { color: var(--m4); }
        .mcell[data-n="5"] { color: var(--m5); }
        .mcell[data-n="6"] { color: var(--m6); }
        .mcell[data-n="7"] { color: var(--m7); }
        .mcell[data-n="8"] { color: var(--m8); }

        /* Outside .mines-area, the way Sudoku's and Invaders' are: a size
           container may hold nothing but the thing it is measuring. */
        .mines-hint   { margin: var(--space-2) 0 0;
                        padding: 0 var(--space-4) var(--space-3); text-align: center;
                        font-size: 0.78rem; color: var(--text-faint); }

        /* PHONE: less padding round the board, and a lower FLOOR - 32px and
           28px rather than the 34 / 32 / 28 above. The floor is all that
           changes: --fit still measures the pane, so easy grows on a phone
           too (about 40px on a 390px screen, where the width is what limits
           it). Medium and hard fall under the floor there - they would be 21px
           and 11px squares if they were made to fit, which no finger can hit -
           so they keep 28 and the board scrolls, as it always has. */
        @media (max-width: 640px)
        {
            .mines-area            { padding: var(--space-2); }
            .game-stats            { gap: 12px; }
            .mines-board           { --cell: max( 32px, var(--fit) ); }
            .mines-board.lv-medium,
            .mines-board.lv-hard   { --cell: max( 28px, var(--fit) ); }
        }

        /* ---- Sudoku --------------------------------------------------------
           The third DOM grid, and the first game whose real work is not on the
           screen at all: the board has to be MADE, and made so that it has
           exactly one answer (see the module below).

           The pane is Minesweeper's shape - the shared .view-bar across the
           top, the board under it - plus the one thing neither of the first two
           games needed: a NUMBER PAD. A 9x9 board on a 390px phone leaves a
           38px square, which is a fine thing to tap but far too small to hold a
           choice of nine, and a phone keyboard has no number row to fall back
           on. So the square and the digit are two separate taps: pick the
           square on the board, pick the digit underneath it.

           Everything is sized off ONE length, --board, the way 2048 is - the
           squares, their numerals, the pencil marks and the pad all scale with
           it. 52vh rather than 2048's 56 because this pane also carries the
           toolbar, the pad and the hint line under them. */
        /* The two line weights are BOTH mixed out of --text, and neither is the
           shared --line: that one is a warm brown in the beige scheme and a
           grey in the dark one, so a 2px --line and a 1px --line read as the
           same stroke and the nine boxes disappear. Mixing both from the same
           colour is what keeps the thick one three times the thin one in either
           scheme. */
        /* --board is measured, not guessed: .sudoku-area is a SIZE CONTAINER
           and everything sized off --board lives inside it, so 100cqw / 100cqh
           are the real room left after the header and the hint. The area holds
           the board AND the pad, and the pad is a fixed fraction of the board
           (.spad is 0.115 tall), so the column is B + 12px gap + 0.115B: solve
           it for B and the two together always come out exactly the height
           there is. No vh figure, and no 440px cap to keep a desktop small. */
        .sudoku       { --board: max( 220px, min( 100cqw, calc( ( 100cqh - 12px ) / 1.115 ) ) );
                        --sline: color-mix( in srgb, var(--text) 60%, transparent );
                        --tline: color-mix( in srgb, var(--text) 20%, transparent );
                        --hi-peer: color-mix( in srgb, var(--text) 9%, transparent );
                        --hi-same: color-mix( in srgb, var(--accent) 26%, transparent );
                        --hi-sel:  color-mix( in srgb, var(--accent) 46%, transparent );
                        position: relative; height: 100%; display: flex; flex-direction: column; }
        :root[data-theme="light"] .sudoku
                      { --hi-peer: color-mix( in srgb, var(--text) 7%, transparent );
                        --hi-same: color-mix( in srgb, var(--accent) 14%, transparent );
                        --hi-sel:  color-mix( in srgb, var(--accent) 24%, transparent ); }

        /* Same as .mines-area: the board scrolls INSIDE the pane so the toolbar
           never leaves the screen, and the centring is `margin: auto` on the
           child - an auto margin collapses to 0 when the free space runs out,
           so a board too tall for a short window still scrolls to its far edge
           instead of having its top row cut off. */
        .sudoku-area  { flex: 1 1 auto; min-height: 0; overflow: auto;
                        display: flex; padding: var(--space-4);
                        container-type: size; }
        .sudoku-fit   { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }

        /* The board is one grid with no gaps: the lines ARE the squares'
           borders, so the thin ones inside a box and the thick ones between
           boxes never drift apart. The last column and row drop theirs - the
           board's own 2px frame is already there. */
        .sudoku-board
        {
            width: var(--board); aspect-ratio: 1; box-sizing: border-box;
            /* The rows are spelled out beside the columns for the reason
               written over 2048's board: `auto` rows take their size from what
               is in them and share out the rest, so a row with no given in it
               came out shorter than the others. */
            display: grid; grid-template-columns: repeat( 9, 1fr );
            grid-template-rows: repeat( 9, 1fr );
            border: 2px solid var(--sline); border-radius: var(--radius-s);
            overflow: hidden; background: var(--card2);
            -webkit-user-select: none; user-select: none;
        }
        /* Solved: the board stops answering and the frame turns to the accent.
           One rule instead of an "is-done" variant of every line below. */
        .sudoku-board.is-done { pointer-events: none; border-color: var(--accent); }

        /* A square is a real <button>, for the same three reasons Minesweeper's
           is: the focus ring, Enter / Space, and app.css's "no iOS callout on a
           long press". */
        .scell
        {
            box-sizing: border-box; padding: 0; margin: 0;
            border: 0; border-right: 1px solid var(--tline); border-bottom: 1px solid var(--tline);
            background: transparent; color: var(--text);
            display: flex; align-items: center; justify-content: center;
            font: 600 calc( var(--board) * 0.062 ) / 1 var(--font-sans);
            font-variant-numeric: tabular-nums;
            cursor: pointer; touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
        }
        .scell.bx                  { border-right:  2px solid var(--sline); }   /* columns 3 and 6 */
        .scell.by                  { border-bottom: 2px solid var(--sline); }   /* rows 3 and 6 */
        .scell:nth-child( 9n )     { border-right: 0; }
        .scell:nth-child( n + 73 ) { border-bottom: 0; }

        /* A clue is heavier and in the text colour; what the PLAYER wrote is in
           the accent, so the board he was dealt stays readable under his own
           work, and a digit that repeats in its row, column or box turns red on
           the spot - the game says nothing else about a wrong answer. */
        .scell.is-given { font-weight: 700; }
        .scell.is-own   { color: var(--accent); }
        .scell.is-bad   { color: var(--danger); }

        /* Three tints, weakest first so the strongest wins on a square that is
           all three: the twenty squares the selection can never repeat into,
           every square holding the same digit, and the selection itself.

           They are per scheme, the way Minesweeper's eight numbers are, and for
           the same reason: --accent is a light teal on the dark background and a
           DARK green (#0A6151) on the beige one, so one percentage cannot serve
           both - the 46% that reads as a highlight in the dark scheme is a solid
           dark green in the light one, and the digit inside it disappears. */
        .scell.is-peer  { background: var(--hi-peer); }
        .scell.is-same  { background: var(--hi-same); }
        .scell.is-sel   { background: var(--hi-sel); }
        .scell:focus         { outline: none; }
        .scell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

        /* Pencil marks: the nine candidates in the nine places they would sit
           on a 3x3, so the same digit is always in the same corner and the eye
           finds it without reading. */
        .snotes   { display: grid; grid-template-columns: repeat( 3, 1fr ); width: 100%; height: 100%;
                    align-items: center; justify-items: center;
                    font: 500 calc( var(--board) * 0.027 ) / 1 var(--font-sans); color: var(--text-dim); }
        .snotes i { font-style: normal; }

        /* The pad. It is the only way in on a phone and the fastest one on a
           mouse, so it is always on screen, never behind a toggle. A digit that
           is already on the board nine times goes faint - it is not disabled,
           because over-filling it is exactly the kind of mistake the red digit
           above is there to show. */
        .sudoku-pad { display: flex; gap: 4px; width: var(--board); }
        .spad
        {
            flex: 1 1 0; min-width: 0; height: calc( var(--board) * 0.115 );
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
            border: 1px solid var(--line); border-radius: var(--radius-s);
            background: var(--card2); color: var(--text);
            font: 600 calc( var(--board) * 0.055 ) / 1 var(--font-sans);
            font-variant-numeric: tabular-nums;
            cursor: pointer; touch-action: manipulation;
        }
        .spad svg           { width: calc( var(--board) * 0.055 ); height: calc( var(--board) * 0.055 ); }
        .spad:hover         { border-color: color-mix( in srgb, var(--accent) 55%, transparent ); }
        .spad:focus         { outline: none; }
        .spad:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .spad.is-done       { background: transparent; color: var(--text-faint); }
        /* In note mode the pad writes pencil marks instead of answers, and it
           has to SAY so - loudly. The toolbar toggle is a 30px button and it is
           now in the header, further from the board than it used to be, so it is
           not where the eye is at all; the pad is the thing directly under the
           board and the thing the finger is already aimed at.

           It used to be a slightly dimmer digit and an accent-tinted border, and
           that was not a state change anyone noticed - the whole row now takes
           the accent, and the digit is drawn SMALL, at the size of the mark the
           key writes. The eraser keeps its full size: it rubs out the same
           amount either way. */
        .sudoku-pad.is-notes .spad
        {
            border-color: color-mix( in srgb, var(--accent) 60%, transparent );
            background:   color-mix( in srgb, var(--accent) 14%, var(--card2) );
            color:        var(--accent);
            font-size:    calc( var(--board) * 0.038 );
        }

        /* The hint is OUTSIDE .sudoku-area now: it is not sized off --board,
           and a size container must hold nothing that is not, or the line of
           text would eat into the height the board is measured against. It
           sits at the foot of the pane, where Tetris' and Asteroids' do, and
           takes its width from padding rather than from --board. */
        .sudoku-hint { margin: var(--space-2) 0 0;
                       padding: 0 var(--space-4) var(--space-3); text-align: center;
                       font-size: 0.78rem; color: var(--text-faint); }

        /* PHONE: less padding round the board, and the width is what limits it
           there (94vw of 390px is 367px, well under 56vh of any phone), so the
           height cap can be the looser one. */
        @media (max-width: 640px)
        {
            .sudoku-area { padding: var(--space-2); }
            .sudoku      { --board: min( 440px, 94vw, 56vh ); }
        }
        /* ---- Space Invaders ------------------------------------------------
           The first game that moves on its own, and so the first <canvas>: the
           three above it are DOM grids that repaint one square at a time, and
           this one repaints the whole field sixty times a second, which no
           amount of <div>s does well.

           The pane is Minesweeper's shape once more - the shared .view-bar
           across the top, the game under it - with the one part that has no
           equivalent in the other three: the LIVES. They go in the bar's left
           slot, where Minesweeper and Sudoku put their difficulty switch,
           because Space Invaders has no difficulty to switch (the waves are
           its difficulty) and .game-stats alone in the row reads visibly
           off-centre. Three little cannons there balance the bar and say what
           is left at a glance, which is what the cabinet did.

           The field is sized off one length the way 2048 and Sudoku are, but
           what --board fixes here is the WIDTH of a 3:4 box: the canvas is a
           216 x 288 world scaled to it (see the module), so one number moves
           the game, the sprites and the aliens' step together. 46vh rather
           than Sudoku's 52 because the box is 4/3 as tall as it is wide. */
        .invaders         { --board: max( 200px, min( 100cqw, 75cqh ) );
                            height: 100%; display: flex; flex-direction: column; }

        /* 5px rather than Asteroids' 3: the cannons now fill their 17px box
           edge to edge, and at 3px the three of them read as one block. */
        .inv-lives        { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; color: var(--accent); }
        /* 17px is the app's own toolbar glyph - .icon-btn.sm svg in app.css -
           and the viewBox is cropped to the drawing (x 4-20, y 5-18 of the 24
           square) so the cannon really is that wide. At 15px on the full box it
           was drawn about 10px, two thirds of every other icon in the row. */
        .inv-lives svg    { width: 17px; height: 14px; }
        /* A life spent stays in place rather than disappearing: the row keeps
           its width, so nothing beside it shifts three times a game. */
        .inv-lives svg.is-gone { color: var(--text-faint); opacity: 0.35; }

        /* .inv-area is a SIZE CONTAINER and the stage is the only thing in it,
           so 100cqw / 100cqh above are the real room the pane has left - which
           is what the old `min( 380px, 92vw, 46vh )` was estimating, and why
           the 380px cap won on every PC and left the game small. */
        .inv-area         { flex: 1 1 auto; min-height: 0; overflow: auto;
                            display: flex; padding: var(--space-3);
                            container-type: size; }
        .inv-fit          { margin: auto; }
        .inv-stage        { position: relative; width: var(--board); aspect-ratio: 3 / 4; }

        /* The canvas is a real tab stop. It has to be: after a click on "new
           game" or on the overlay's own button the focus sits on that button,
           and the next space - the fire key - would press it again. Every path
           that starts or resumes a game ends with canvasEl.focus().

           touch-action: none is what stops the browser scrolling or zooming
           with the finger that is steering, exactly as on 2048's board. */
        .inv-canvas       { display: block; width: 100%; height: 100%;
                            border-radius: var(--radius-m); background: var(--card2);
                            touch-action: none; -webkit-user-select: none; user-select: none; }
        .inv-canvas:focus         { outline: none; }
        .inv-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* THE CANVAS PALETTE. A canvas cannot read var(--x) - fillStyle takes a
           colour, not a link to one - so these are read out of the stylesheet
           once, in palette(), and re-read when the scheme changes. It is
           Minesweeper's arrangement, down to the same eight hexes: one fixed
           set for the dark scheme... */
        .inv-canvas       { --iv-ship: #16A085; --iv-shot: #E7E7E9; --iv-ufo: #E0A21E;
                            --iv-bomb: #D9707D; --iv-shield: #7BA88F; --iv-ground: #93959F;
                            --iv-a1: #6FBF73; --iv-a2: #5B9DF9; --iv-a3: #B58BF0; }
        /* ...and one for the beige one (an attribute, not a media query - see
           theme-system.md). Near-white aliens on a dark field become invisible
           ink on beige, which is the whole reason there are two sets. */
        :root[data-theme="light"] .inv-canvas
                          { --iv-ship: #0A6151; --iv-shot: #242732; --iv-ufo: #8A5A0B;
                            --iv-bomb: #9C4150; --iv-shield: #2E6B4E; --iv-ground: #5E6472;
                            --iv-a1: #1F6B3A; --iv-a2: #1A4F9E; --iv-a3: #5B2E9E; }


        /* Outside .inv-area, for the reason written over Sudoku's: a size
           container may hold nothing but the thing it is measuring. */
        .inv-hint   { margin: var(--space-2) 0 0;
                      padding: 0 var(--space-4) var(--space-3); text-align: center;
                      font-size: 0.78rem; color: var(--text-faint); }

        /* PHONE: the width is what limits the field there (92vw of 390px is
           359px, well under 46vh of any phone), so the height cap can loosen
           and the padding round it comes off. */
        @media (max-width: 640px)
        {
            .inv-area { padding: var(--space-2); }
            .invaders { --board: min( 400px, 94vw, 54vh ); }
        }


        /* ---- Asteroids -----------------------------------------------------
           The first game with no DOM in it: one <canvas>, one loop, and every
           rock, bullet and ship is a line drawn on it. The pane is still
           Minesweeper's shape - the shared .view-bar across the top, the play
           area under it - plus the row of keys that is the only way to fly on a
           phone.

           The LEFT slot of the bar, where Mines and Sudoku put their .tb-modes,
           holds the ships still to lose: Asteroids has no difficulty to switch,
           and lives are the one figure that reads better as a picture than as a
           number. Score and record stay in the centred .game-stats, where the
           other two games keep their pair. */
        .asteroids       { height: 100%; display: flex; flex-direction: column; }

        .ast-lives       { display: flex; align-items: center; gap: 3px; flex: 0 0 auto;
                           min-width: 30px; color: var(--text); }
        .ast-lives svg   { width: 15px; height: 15px; }
        .ast-lives b     { font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* The BOX is what has a size; the canvas only ever follows it (see
           fit()). Sizing the canvas from the viewport instead would need the
           header, the bar, the keys and the hint all measured in CSS, and every
           one of them would have to be measured again on a phone. */
        .ast-area        { flex: 1 1 auto; min-height: 0; position: relative;
                           margin: var(--space-3) var(--space-4) 0;
                           border: 1px solid var(--line); border-radius: var(--radius-m);
                           background: var(--card2); overflow: hidden; }
        /* The frame is on the BOX and not on the canvas: a border on the canvas
           is inside the width the canvas is measured at, so the bitmap would be
           two pixels wider than the surface it is stretched over and every line
           in the game would be drawn a little blurred. */
        /* The canvas is a real tab stop, the way Space Invaders' is and for the
           same reason: after a click on "new game" or on the overlay's own
           button the focus sits on that button, and the next space bar would
           press it again instead of firing - so everything that starts or
           resumes a game ends with canvasEl.focus(). */
        .ast-canvas      { display: block; width: 100%; height: 100%; touch-action: none; }
        .ast-canvas:focus         { outline: none; }
        .ast-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }


        /* The keys are on screen ALWAYS, the way Sudoku's number pad is, and
           for a reason of its own: a phone has no arrow keys at all, so without
           them the game simply cannot be played on one - and `pointer: coarse`
           is not a test worth trusting here, because it answers wrongly on
           every touch laptop. They are held down, not tapped, which is why they
           carry .is-down and their own touch-action.

           They are NOT in the tab order (tabindex="-1" in the markup): they say
           the same thing as the four keys they stand for, and four more tab
           stops between the toolbar and the hint buy nothing. */
        .ast-pad          { display: flex; justify-content: center; gap: var(--space-2);
                            padding: var(--space-3) var(--space-4) 0; }
        .ast-key          { flex: 0 1 88px; height: 46px;
                            display: inline-flex; align-items: center; justify-content: center;
                            border: 1px solid var(--line); border-radius: var(--radius-m);
                            background: var(--card2); color: var(--text); cursor: pointer;
                            touch-action: none; -webkit-user-select: none; user-select: none; }
        .ast-key svg      { width: 21px; height: 21px; pointer-events: none; }
        .ast-key.fire     { flex-basis: 110px; color: var(--accent); }
        .ast-key:hover    { border-color: color-mix( in srgb, var(--accent) 55%, transparent ); }
        .ast-key.is-down  { background: color-mix( in srgb, var(--accent) 24%, var(--card2) );
                            border-color: color-mix( in srgb, var(--accent) 60%, transparent ); }
        .ast-key:focus    { outline: none; }

        .ast-hint         { margin: var(--space-2) 0 0; padding: 0 var(--space-4) var(--space-3);
                            text-align: center; font-size: 0.78rem; color: var(--text-faint); }

        /* PHONE: the keys take the whole width and grow, because a finger is
           what presses them there; and the hint goes, because half of it is
           about a keyboard the phone does not have and the four keys under it
           say the other half themselves. */
        @media (max-width: 640px)
        {
            .ast-area { margin: var(--space-2) var(--space-2) 0; }
            .ast-pad  { padding: var(--space-2) var(--space-2) 0; gap: 6px; }
            .ast-key      { flex: 1 1 0; height: 54px; }
            .ast-key.fire { flex-basis: 0; flex-grow: 1.4; }
            .ast-hint { display: none; }
        }

        /* ---- Tetris --------------------------------------------------------
           The third canvas game, and the pane is Asteroids' - the shared
           .view-bar, the play area, the touch keys, the hint. Two differences,
           both from the well being a fixed 10 x 20 shape rather than whatever
           room it is given:

           the stage is a 1:2 BOX sized off one --board, the way Invaders' 3:4
           one is, so a cell is exactly a tenth of the width and the canvas
           never has half a square along an edge; and the height cap is the one
           that binds nearly everywhere, since the box is twice as tall as it is
           wide and the pane also carries the keys and the hint. */
        /* The floor is only a "never vanish" guard, and it is deliberately
           LOW: a phone turned sideways has room for about an 8px cell, and a
           well that fits at 8px beats one you have to scroll at 10 - which is
           what the old 30vh rule gave. Nothing above a landscape phone ever
           reaches it. */
        .tetris          { --board: max( 80px, min( 100cqw, 50cqh ) );
                           height: 100%; display: flex; flex-direction: column; }

        /* The piece that is coming, in the bar's left slot. Eight squares in a
           fixed 4 x 2 grid - every piece fits that, and only the classes on it
           change - and they take their colour from the same seven tokens the
           canvas reads, which is why those live on .tetris and not on the
           canvas: DOM follows the theme by itself and needs no repaint. */
        .tet-next        { display: grid; grid-template-columns: repeat( 4, 11px );
                           grid-auto-rows: 11px; gap: 1px; flex: 0 0 auto; }
        .tet-next i      { border-radius: 2px; background: transparent; }
        .tet-next i[data-p="I"] { background: var(--tt-i); }
        .tet-next i[data-p="J"] { background: var(--tt-j); }
        .tet-next i[data-p="L"] { background: var(--tt-l); }
        .tet-next i[data-p="O"] { background: var(--tt-o); }
        .tet-next i[data-p="S"] { background: var(--tt-s); }
        .tet-next i[data-p="T"] { background: var(--tt-t); }
        .tet-next i[data-p="Z"] { background: var(--tt-z); }

        /* .tet-area is a SIZE CONTAINER and holds only the stage - the keys and
           the hint were already outside it - so 100cqw / 100cqh above are the
           room the well really has, with no vh figure standing in for the
           header, the keys and the hint. */
        .tet-area        { flex: 1 1 auto; min-height: 0; overflow: auto;
                           display: flex; padding: var(--space-3);
                           container-type: size; }
        .tet-fit         { margin: auto; }
        .tet-stage       { position: relative; width: var(--board); aspect-ratio: 1 / 2; }

        /* The canvas is a real tab stop, for the reason written up over
           Invaders': after a click on "new game" or on the overlay's own button
           the focus sits on that button, and the next space - here the hard
           drop - would press it again. Every path that starts or resumes a game
           ends with canvasEl.focus(). */
        .tet-canvas      { display: block; width: 100%; height: 100%;
                           border-radius: var(--radius-m); background: var(--card2);
                           touch-action: none; -webkit-user-select: none; user-select: none; }
        .tet-canvas:focus         { outline: none; }
        .tet-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* THE PALETTE. A canvas cannot read var(--x) - fillStyle takes a
           colour, not a link to one - so these are read out of the stylesheet
           once, in palette(), and re-read when the scheme changes. Minesweeper's
           arrangement a third time: one fixed set for the dark scheme...

           The seven are the colours the game has had since 1989 (cyan, blue,
           orange, yellow, green, purple, red) pulled towards this app's
           muted range. They must stay seven things told apart at a glance in a
           24px square, which is why they are fixed hexes and not theme tokens.

           --tt-ghost is where the piece would land, --tt-flash the row on its
           way out, --tt-grid the ruled well behind everything.

           They sit on :root and not on .tetris because the next-piece square
           wears four of them and it is NOT inside .tetris any more - the
           toolbar it lives in was moved into the header. palette() reads them
           off .tetris all the same: a custom property inherits. */
        :root            { --tt-i: #38BDD0; --tt-j: #4A7BD8; --tt-l: #D98A2B;
                           --tt-o: #D2B62E; --tt-s: #4FB06A; --tt-t: #9B6FD4;
                           --tt-z: #D9636F;
                           --tt-grid: rgba( 255, 255, 255, 0.07 );
                           --tt-ghost: rgba( 233, 230, 225, 0.30 );
                           --tt-flash: rgba( 255, 255, 255, 0.80 ); }
        /* ...and one for the beige one (an attribute, not a media query - see
           theme-system.md). The seven pastels of the dark scheme are seven
           washes of nothing on beige, so the light set is the same seven hues
           taken down to where they hold a white numeral's worth of contrast. */
        :root[data-theme="light"]
                         { --tt-i: #147A8C; --tt-j: #23509E; --tt-l: #A55B0C;
                           --tt-o: #8A7008; --tt-s: #1F7A42; --tt-t: #6B3FA8;
                           --tt-z: #A8323F;
                           --tt-grid: rgba( 36, 39, 50, 0.10 );
                           --tt-ghost: rgba( 36, 39, 50, 0.34 );
                           --tt-flash: rgba( 36, 39, 50, 0.55 ); }


        /* Asteroids' key row, five wide instead of four. .is-down is set from
           the module and not by :active, because a key is also lit while the
           KEYBOARD holds it. */
        .tet-pad         { display: flex; justify-content: center; gap: var(--space-2);
                           flex: 0 0 auto; padding: var(--space-3) var(--space-4) 0; }
        .tet-key         { flex: 0 1 76px; height: 44px;
                           display: flex; align-items: center; justify-content: center;
                           border: 1px solid var(--line); border-radius: var(--radius-m);
                           background: var(--card2); color: var(--text-dim); cursor: pointer;
                           touch-action: none; -webkit-user-select: none; user-select: none;
                           -webkit-touch-callout: none;
                           transition: background-color var(--tr-fast), color var(--tr-fast); }
        .tet-key svg     { width: 21px; height: 21px; pointer-events: none; }
        .tet-key.turn    { color: var(--accent); }
        .tet-key.drop    { flex-basis: 96px; color: var(--accent); }
        .tet-key:hover   { border-color: color-mix( in srgb, var(--accent) 55%, transparent ); }
        .tet-key.is-down { background: color-mix( in srgb, var(--accent) 24%, var(--card2) );
                           border-color: var(--accent); color: var(--text); }
        .tet-key:focus   { outline: none; }

        .tet-hint        { margin: var(--space-2) 0 0; padding: 0 var(--space-4) var(--space-3);
                           text-align: center; font-size: 0.78rem; color: var(--text-faint); }

        /* PHONE: the width is what limits the well there, so the height cap can
           loosen; the keys spread to fill the row and the hint comes off, the
           same three moves Asteroids makes. */
        @media (max-width: 640px)
        {
            .tet-area  { padding: var(--space-2); }
            .tet-pad   { padding: var(--space-2) var(--space-2) 0; gap: 6px; }
            .tet-key   { flex: 1 1 0; height: 50px; }
            .tet-hint  { display: none; }
        }

        /* A SHORT window - a laptop in landscape, or a phone turned sideways -
           is the one shape where the well's height is the whole problem: it is
           twice --board on its own, and the keys and the hint under it are what
           tip the pane into scrolling. The hint goes (it says what the keys
           already show) and the keys lose a few pixels. */
        @media (max-height: 620px)
        {
            /* No --board line here any more: the base rule measures what is
               left rather than guessing at it, so taking the hint away and
               shortening the keys is enough - the well grows into exactly the
               room those two moves free. */
            .tet-hint { display: none; }
            .tet-key  { height: 38px; }
        }


        /* The HEADER is two rows on every phone now - the game's toolbar takes
           one of its own under 640px - and the pane paid for exactly that by
           handing the toolbar over, so the two cancel and the well keeps the
           height it had. Under 377px there is no third row to fear any more,
           which is why this block only ever makes the board BIGGER: a width
           breakpoint standing in for a height one, because the thing that costs
           the height here is the width. */


    </style>
</head>

<body>
    <noscript><h2 data-i18n="ui.needJs"></h2></noscript>

    <div id="app" class="app" style="display: none;">

        <header class="topbar">
            <svg class="app-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"></line><line x1="8" y1="9" x2="8" y2="13"></line><line x1="15" y1="12" x2="15.01" y2="12"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59c-.08.67-.7 5.87-.7 7.41a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.54-.62-6.74-.7-7.41A4 4 0 0 0 17.32 5z"></path></svg>
            <h1 id="appTitle">Games</h1>


            <!-- The game's own toolbar lands here when a game is open: the six
                 .view-bars below are MOVED into the slot at boot, and only the
                 open game's is on screen. The two .tb-sep rules are what set the
                 group apart from the app name on one side and the "?" on the
                 other - the header is a single row of three unrelated things,
                 and without them the score reads as part of the title. The
                 whole block is [hidden] on the Games screen, rules and all. -->
            <div class="game-options" id="gameOptions" hidden>
                <span class="tb-sep"></span>
                <div class="game-options-slot" id="gameOptionsSlot"></div>
                <span class="tb-sep"></span>
            </div>

            <div class="topbar-actions">
                <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </button>
                <button id="syncIndicator" class="sync-indicator" type="button" data-i18n-attr="title:ui.sync.synced"></button>
            </div>
        </header>

        <!-- One pane per game, plus the Games screen itself - and only one of
             the seven is ever open. -->
        <div class="game-host" id="gameHost">
            <!-- THE GAMES SCREEN. The app opens here and every game comes
                 back here, so it is the one pane that is not a game: six cards,
                 the same shape as the launcher's own tiles (icon over name), and
                 the card itself opens the game - there is no ">" button on it.
                 The header carries no game buttons at all now; this grid IS the
                 way in, and the app name it replaces is the way back. -->
            <section class="game-pane is-open" data-pane="home">
                <div class="games-home">
                    <div class="games-grid">
                        <button class="game-tile" type="button" data-game="sudoku">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="18" y1="18" x2="18.01" y2="18"></line></svg>
                            <span data-i18n="games.sudoku"></span>
                        </button>
                        <button class="game-tile" type="button" data-game="g2048">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"></rect><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"></rect><rect x="3.5" y="13" width="17" height="7.5" rx="1.5"></rect></svg>
                            <span data-i18n="games.g2048"></span>
                        </button>
                        <button class="game-tile" type="button" data-game="mines">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="13.5" r="7.5"></circle><path d="M14.5 6.5 16.3 4.7a2.4 2.4 0 0 1 3.4 0l1.6 1.6a2.4 2.4 0 0 1 0 3.4L19.5 11.5"></path><line x1="22" y1="2" x2="20.5" y2="3.5"></line></svg>
                            <span data-i18n="games.mines"></span>
                        </button>
                        <button class="game-tile" type="button" data-game="invaders">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7.5" y1="7" x2="5.5" y2="4"></line><line x1="16.5" y1="7" x2="18.5" y2="4"></line><rect x="4" y="7" width="16" height="8" rx="2"></rect><line x1="9" y1="11" x2="9.01" y2="11"></line><line x1="15" y1="11" x2="15.01" y2="11"></line><line x1="6.5" y1="15" x2="6.5" y2="18"></line><line x1="12" y1="15" x2="12" y2="19.5"></line><line x1="17.5" y1="15" x2="17.5" y2="18"></line></svg>
                            <span data-i18n="games.invaders"></span>
                        </button>
                        <button class="game-tile" type="button" data-game="asteroids">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2.5 17.5 4.5 21 10 18.5 16.5 12.5 21 6 18.5 3 12.5 5 6"></polygon><line x1="9.5" y1="10" x2="9.51" y2="10"></line><line x1="14.5" y1="14.5" x2="14.51" y2="14.5"></line></svg>
                            <span data-i18n="games.asteroids"></span>
                        </button>
                        <button class="game-tile" type="button" data-game="tetris">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h15v8h-7v8H1v-8h7z"></path></svg>
                            <span data-i18n="games.tetris"></span>
                        </button>
                    </div>
                </div>
            </section>
            <!-- Sudoku. The 81 squares and the ten pad keys are built in JS
                 (they are all the same and only their contents change), so both
                 boxes open empty here. The toolbar is the shared .view-bar: the
                 three difficulties as a mode switch on the left, the clock and
                 the record in the middle, the pencil and "new game" on the
                 right. -->
            <section class="game-pane" data-pane="sudoku">
                <div class="sudoku">
                    <div class="view-bar" data-options="sudoku">
                        <div class="tb-modes">
                            <button class="icon-btn sm is-active" data-sudoku-level="easy" type="button" data-i18n-attr="title:games.sudokuEasy, aria-label:games.sudokuEasy">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="20" x2="12" y2="13"></line></svg>
                            </button>
                            <button class="icon-btn sm" data-sudoku-level="medium" type="button" data-i18n-attr="title:games.sudokuMedium, aria-label:games.sudokuMedium">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="9" y1="20" x2="9" y2="13"></line><line x1="15" y1="20" x2="15" y2="8.5"></line></svg>
                            </button>
                            <button class="icon-btn sm" data-sudoku-level="hard" type="button" data-i18n-attr="title:games.sudokuHard, aria-label:games.sudokuHard">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="13"></line><line x1="12" y1="20" x2="12" y2="8.5"></line><line x1="18" y1="20" x2="18" y2="4"></line></svg>
                            </button>
                        </div>

                        <div class="game-stats">
                            <span class="game-stat" data-i18n-attr="title:games.sudokuTime">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
                                <b id="sudokuTime">0:00</b>
                            </span>
                            <span class="game-stat" data-i18n-attr="title:games.sudokuBest">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v5a4 4 0 0 1-8 0z"></path><path d="M8 4.5H5.5V7a3 3 0 0 0 3 3"></path><path d="M16 4.5h2.5V7a3 3 0 0 1-3 3"></path><line x1="12" y1="12" x2="12" y2="17"></line><line x1="8.5" y1="20.5" x2="15.5" y2="20.5"></line><path d="M9.5 20.5c0-2 1-3.5 2.5-3.5s2.5 1.5 2.5 3.5"></path></svg>
                                <b id="sudokuBest">--</b>
                            </span>
                        </div>

                        <div class="tb-actions">
                            <button class="icon-btn sm" id="sudokuNotes" type="button" data-i18n-attr="title:games.sudokuNotes, aria-label:games.sudokuNotes">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7.5 18.5 3.5 19.5l1-4z"></path></svg>
                            </button>
                            <button class="icon-btn sm" id="sudokuPause" type="button" data-i18n-attr="title:games.pause, aria-label:games.pause">
                                <svg data-ic="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"></rect><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"></rect></svg>
                                <svg data-ic="play" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5.5a1 1 0 0 1 1.5-.87l9 6.5a1 1 0 0 1 0 1.74l-9 6.5A1 1 0 0 1 8 18.5z"></path></svg>
                            </button>
                            <button class="icon-btn sm" id="sudokuNew" type="button" data-i18n-attr="title:games.newGame, aria-label:games.newGame">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"></path><polyline points="21 3 21 8 16 8"></polyline><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path><polyline points="3 21 3 16 8 16"></polyline></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Paused. The clock is stopped and the board is COVERED:
                         a stopped clock over a board you can still read is not a
                         pause, it is free thinking time. Over the play area only
                         - the header keeps the game's name and its toolbar, so
                         a paused game is left the way any other pane is. -->
                    <div class="game-cover solid sudoku-pause" id="sudokuPaused" hidden>
                        <p class="game-cover-t" data-i18n="games.paused"></p>
                        <button class="text-btn" id="sudokuResume" type="button" data-i18n="games.resume"></button>
                    </div>

                    <div class="sudoku-area">
                        <div class="sudoku-fit">
                            <div class="sudoku-board" id="sudokuBoard"></div>
                            <div class="sudoku-pad" id="sudokuPad"></div>
                        </div>
                    </div>
                    <p class="sudoku-hint" data-i18n="games.hintSudoku"></p>
                </div>
            </section>
            <!-- 2048. The sixteen squares are built in JS (they are all the
                 same and only their numbers change), so the board opens empty
                 here; the overlay sits over it, not over the header, so the
                 game buttons stay live when a game is finished. -->
            <section class="game-pane" data-pane="g2048">
                <div class="g2048">
                    <div class="view-bar" data-options="g2048">
                        <div class="game-stats">
                            <span class="game-stat" data-i18n-attr="title:games.score">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg>
                                <b id="g2048Score">0</b>
                            </span>
                            <span class="game-stat" data-i18n-attr="title:games.best">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v5a4 4 0 0 1-8 0z"></path><path d="M8 4.5H5.5V7a3 3 0 0 0 3 3"></path><path d="M16 4.5h2.5V7a3 3 0 0 1-3 3"></path><line x1="12" y1="12" x2="12" y2="17"></line><line x1="8.5" y1="20.5" x2="15.5" y2="20.5"></line><path d="M9.5 20.5c0-2 1-3.5 2.5-3.5s2.5 1.5 2.5 3.5"></path></svg>
                                <b id="g2048Best">0</b>
                            </span>
                        </div>

                        <div class="tb-actions">
                            <button class="icon-btn sm" id="g2048Pause" type="button" data-i18n-attr="title:games.pause, aria-label:games.pause">
                                <svg data-ic="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"></rect><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"></rect></svg>
                                <svg data-ic="play" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5.5a1 1 0 0 1 1.5-.87l9 6.5a1 1 0 0 1 0 1.74l-9 6.5A1 1 0 0 1 8 18.5z"></path></svg>
                            </button>
                            <button class="icon-btn sm" id="g2048New" type="button" data-i18n-attr="title:games.newGame, aria-label:games.newGame">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"></path><polyline points="21 3 21 8 16 8"></polyline><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path><polyline points="3 21 3 16 8 16"></polyline></svg>
                            </button>
                        </div>
                    </div>

                    <div class="g2048-area">
                        <div class="g2048-board" id="g2048Board">
                            <div class="game-cover g2048-over" id="g2048Over" hidden>
                                <p class="game-cover-t" id="g2048OverTitle"></p>
                                <p class="game-cover-s" id="g2048OverScore"></p>
                                <button class="text-btn" id="g2048OverBtn" type="button"></button>
                            </div>
                        </div>
                    </div>

                    <p class="g2048-hint" data-i18n="games.hint2048"></p>
                </div>
            </section>
            <!-- Minesweeper. The cells are built in JS (there are up to 480 of
                 them and they are all the same), so the board opens empty here.
                 The toolbar is the shared .view-bar: the three difficulties as
                 a mode switch, the counters, and "new game". -->
            <section class="game-pane" data-pane="mines">
                <div class="mines">
                    <div class="view-bar" data-options="mines">
                        <div class="tb-modes">
                            <button class="icon-btn sm is-active" data-mines-level="easy" type="button" data-i18n-attr="title:games.minesEasy, aria-label:games.minesEasy">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="15" cy="9" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="9" cy="15" r="1.5" fill="currentColor" stroke="none"></circle><circle cx="15" cy="15" r="1.5" fill="currentColor" stroke="none"></circle></svg>
                            </button>
                            <button class="icon-btn sm" data-mines-level="medium" type="button" data-i18n-attr="title:games.minesMedium, aria-label:games.minesMedium">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="16.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="7.5" cy="12" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="16.5" cy="12" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="7.5" cy="16.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="12" cy="16.5" r="1.2" fill="currentColor" stroke="none"></circle><circle cx="16.5" cy="16.5" r="1.2" fill="currentColor" stroke="none"></circle></svg>
