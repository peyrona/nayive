<!-- index.html - Split: shared expenses between friends, in several currencies.
     One folder per group under data/split/<id>/group.json (see docs/split-app.md);
     all the arithmetic lives in money.js, everything on screen lives here. -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title>Split</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2316A085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16.5 7A7 7 0 1 0 16.5 17'/%3E%3Cline x1='3' y1='10.2' x2='13.5' y2='10.2'/%3E%3Cline x1='3' y1='13.8' x2='13.5' y2='13.8'/%3E%3C/svg%3E">

    <!-- Shared colour scheme. Apply the saved choice before first paint to avoid a flash. -->
    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>

    <!-- Installable / offline-capable. Only takes effect over HTTPS (and localhost). -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <style>
        /* Base reset, card shell (.page/.page-inner/.card), .header, .icon-btn,
           .pill, .card-row, .sheet and inputs all come from ../shared/app.css.
           Only what is unique to Split lives here. */


        /* PEOPLE COLOURS. The theme has one accent; people have to be told
           apart at a glance, so each member gets one of eight fixed hues by
           position in the group (wrapping). They are identity colours, not
           theme colours, so they are the same in light and dark and white
           text reads on all of them. */
        .avatar
        {
            display: inline-flex; align-items: center; justify-content: center;
            flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
            font-size: 0.76rem; font-weight: 700; letter-spacing: 0.02em;
            color: white; background: var(--m-color, var(--accent));
        }
        .avatar.sm { width: 24px; height: 24px; font-size: 0.62rem; }
        [data-c="0"] { --m-color: hsl(170 40% 38%); }
        [data-c="1"] { --m-color: hsl(215 45% 50%); }
        [data-c="2"] { --m-color: hsl(345 45% 52%); }
        [data-c="3"] { --m-color: hsl(35 55% 46%); }
        [data-c="4"] { --m-color: hsl(275 35% 52%); }
        [data-c="5"] { --m-color: hsl(95 35% 40%); }
        [data-c="6"] { --m-color: hsl(15 50% 52%); }
        [data-c="7"] { --m-color: hsl(200 25% 45%); }

        /* A round accent bubble for the rows that are not a person: a group
           (€) or a payment (→). Same size as an avatar so the lists line up. */
        .bubble
        {
            display: inline-flex; align-items: center; justify-content: center;
            flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
            background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
        }
        .bubble svg { width: 18px; height: 18px; }

        /* LISTS. Every row is a .card-row (shared). An ENTRY row is a <button>,
           so it needs the button look reset. A GROUP row cannot be one - it
           carries its own delete button - so it is a <div role="button"> and
           takes the pointer and the focus ring by hand instead. */
        .list                { display: flex; flex-direction: column; gap: 6px; }
        .list + .list,
        .section-label + .list { margin-top: 0; }
        button.card-row      { width: 100%; text-align: left; font: inherit; cursor: pointer; }
        .card-row[role="button"]                { cursor: pointer; }
        .card-row[role="button"]:focus-visible  { outline: 2px solid var(--accent); outline-offset: 2px; }
        .card-row.ro         { cursor: default; }
        /* Editar + Eliminar, at the right edge of a group's row. The trash keeps
           plain .icon-btn.danger - red at rest, as shared/app.css spells out, so
           a delete looks the same here as it does in Trips and in a dialog. */
        .row-act             { flex: 0 0 auto; }
        .row-main            { flex: 1 1 auto; min-width: 0; }
        .row-title
        {
            display: flex; align-items: center; gap: 8px; min-width: 0;
            font-size: 0.93rem; font-weight: 600; line-height: 1.3;
        }
        .row-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row-meta
        {
            margin-top: 2px; font-size: 0.77rem; color: var(--text-dim);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .row-amt             { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }
        .row-amt .main       { font-size: 0.95rem; font-weight: 700; }
        .row-amt .sub        { font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }
        .pos                 { color: var(--ok); }
        .neg                 { color: var(--danger); }
        .zero                { color: var(--text-dim); }

        .home-block          { margin-top: 18px; }
        .home-block:first-child { margin-top: 4px; }
        .archived-toggle     { margin-top: 18px; }

        /* HEADER TITLE: on the group list it is the app icon + "Split" in
           --accent (shared/app.css). Open a group and that pair is swapped for
           the group's own name in --text, with the people count + currency
           under it - the same shape Trips uses for an open trip
           (.trip-header-title). The name stays an <h2>: shared/ui.js wires
           every header <h1> as the way back to the launcher, and a group name
           that walked out of the app on a click would be a trap.

           The name is the ONE title in Nayive allowed to end in "...". The rule
           in shared/app.css ("never truncate") guards the APP name - a short
           fixed word that must always read in full. A group name is whatever
           the user typed, and letting 40 characters push the tabs onto their
           own line costs more than the tail of the name does. The full text
           stays one hover away (title=, set in renderGroup) and is spelled out
           in the edit sheet. `flex: 1 1 0` + `min-width: 0` all the way down is
           what makes the ellipsis engage: at `1 1 auto` flex lays the row out
           from the name's full width and wraps the tabs instead of shrinking. */
        .head-title          { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .head-title-name     { display: flex; align-items: center; flex-wrap: nowrap; gap: 8px; min-width: 0; }
        .head-title-name h2  { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1.3;
                               min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .head-title-sub      { font-size: 0.8rem; color: var(--text-dim); }

        /* TABS: Gastos | Saldos, at the right end of the title's row (Habits
           does the same). nowrap - they are two short pills and splitting them
           over two lines helps nobody. */
        .tabs                { display: flex; gap: 6px; flex-wrap: wrap; }
        .header .tabs        { flex: 0 0 auto; flex-wrap: nowrap; }

        /* IN A GROUP the button bar drops to a row of its own - the same thing
           .header already does on a narrow screen, made unconditional so the
           tabs keep the title's row. The whole bar packs against the RIGHT margin
           in one run - no gap opened up inside it - so it lines up with the tabs
           above and with the button bar on the group list. */
        .header.in-group .header-actions { flex: 0 0 100%; margin-left: 0; justify-content: flex-end; }
        .search              { width: 100%; margin-bottom: 10px; }

        /* BALANCES: one row per person, a thin bar under it showing how far
           from zero they are, then "who pays whom". */
        .totals              { margin: 0 0 10px; font-size: 0.8rem; color: var(--text-dim); line-height: 1.5; }
        .row-between         { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .row-between .section-label { margin-bottom: 0; }
        .bal                 { padding: 8px 2px 6px; }
        .bal-row             { display: flex; align-items: center; gap: 10px; }
        .bal-name            { flex: 1 1 auto; min-width: 0; font-size: 0.93rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bal-name small      { color: var(--text-dim); font-size: 0.78rem; }
        .bal-amt             { font-weight: 700; font-variant-numeric: tabular-nums; }
        .bal-bar
        {
            position: relative; height: 4px; margin: 6px 0 0 42px; border-radius: 2px;
            background: color-mix(in srgb, var(--text) 8%, transparent); overflow: hidden;
        }
        .bal-bar > i         { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
        .bal-bar > i.pos     { left: 50%; background: var(--ok); }
        .bal-bar > i.neg     { right: 50%; background: var(--danger); }
        .bal-detail          { margin: 3px 0 0 42px; font-size: 0.74rem; color: var(--text-dim); }

        .settle-row          { display: flex; align-items: center; gap: 8px; padding: 6px 2px; }
        .settle-who          { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.93rem; }
        .settle-who svg      { width: 16px; height: 16px; color: var(--text-dim); }
        .settle-amt          { font-weight: 700; font-variant-numeric: tabular-nums; }
        .all-even            { display: flex; align-items: center; gap: 8px; padding: 8px 2px; font-size: 0.9rem; color: var(--ok); }
        .all-even svg        { width: 18px; height: 18px; }
        .actions-row         { display: flex; justify-content: center; margin-top: 16px; }
        .cur-block           { margin-top: 14px; }
        .cur-block:first-child { margin-top: 0; }

        /* EMPTY STATES */
        .empty
        {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 36px 10px 18px; color: var(--text-faint);
        }
        .empty svg           { margin-bottom: 10px; opacity: 0.6; }
        .empty p             { margin: 0; font-size: 0.93rem; font-weight: 600; color: var(--text-dim); }
        .empty p + p         { margin-top: 4px; font-size: 0.8rem; font-weight: 400; color: var(--text-faint); }
        .empty .text-btn     { margin-top: 14px; }

        /* THE ENTRY SHEET (an expense or a payment). The amount first and big,
           the currency right beside it, then the fewest possible questions. */
        .kind-tabs           { margin: -4px 0 14px; }
        .amount-row          { display: flex; gap: 8px; align-items: stretch; margin-bottom: 14px; }
        .amount-input        { flex: 1 1 auto; min-width: 0; font-size: 1.7rem; font-weight: 700; text-align: right; padding: 8px 12px; }
        .amount-row select   { flex: 0 0 auto; width: 7em; font-weight: 600; }   /* "USD" + arrow; the amount gets the rest */
        .rate-row            { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .rate-row input      { flex: 0 1 150px; min-width: 0; }
        .rate-row .preview   { font-size: 0.85rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        .hint                { margin: 6px 0 0; font-size: 0.78rem; color: var(--text-dim); min-height: 1.1em; }
        .hint.warn           { color: var(--warn); }
        .field-label-row     { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .field-label-row label { margin-bottom: 0; }
        .field .field-label-row { margin-bottom: 5px; }
        .link-btn            { border: none; background: none; padding: 0 4px; font: inherit; font-size: 0.8rem; color: var(--link); cursor: pointer; }
        .chips               { display: flex; flex-wrap: wrap; gap: 6px; }
        .chips .pill         { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 4px; font-size: 0.82rem; }
        .chips .pill .avatar { width: 24px; height: 24px; font-size: 0.62rem; }
        .parts               { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .part-row            { display: flex; align-items: center; gap: 8px; }
        .part-row .name      { flex: 1 1 auto; min-width: 0; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .part-row input      { width: 112px; text-align: right; font-variant-numeric: tabular-nums; }
        .part-row .unit      { width: 2.4em; font-size: 0.8rem; color: var(--text-dim); }

        /* Native date inputs render in the browser's own locale (dd/mm/yyyy);
           the Nayive rule is yyyy-mm-dd. Hide the native text and overlay the
           ISO value; the input stays underneath so a tap still opens the picker.
           (Same trick as Calendar.) */
        .date-wrap                   { position: relative; }
        .date-wrap input[type=date]  { color: transparent; }
        .date-wrap .date-display
        {
            position: absolute; inset: 0; display: flex; align-items: center;
            padding: 0 11px; font-size: 1rem; color: var(--text); pointer-events: none;
        }

        /* PEOPLE SHEET */
        .member-row              { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .member-row input[type=text] { flex: 1 1 auto; min-width: 0; }
        .member-row label.me     { display: flex; align-items: center; gap: 4px; font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; cursor: pointer; }
        .member-row.is-hidden input[type=text] { color: var(--text-faint); text-decoration: line-through; }
        .member-row.is-hidden .avatar { opacity: 0.45; }
        .people-add              { margin-top: 4px; }

        /* PHONE (<= 640px, the shared rule). The card shell already goes edge to
           edge; here only the touch targets and the big number change. */
        @media (max-width: 640px)
        {
            .amount-input        { font-size: 1.5rem; }
            .chips .pill         { min-height: 36px; }
            .part-row input      { width: 100px; }
            .row-meta            { white-space: normal; }
        }
    </style>
</head>
<body>

    <div id="app" style="display: none;">
        <div class="page">
            <div class="page-inner">

                <div class="card">

                    <!-- Header, list:     [€] Split ............................. [+] [?] [•]
                         Header, in group:  [←] Lisboa 2026… ....... [Gastos] [Saldos]
                                                3 personas · EUR
                                     ... [+] [personas] [editar] [compartir] [copiar] [csv] [?] [•]
                         Archivar is NOT here - it lives on the group's row in the list.
                         In a group the button bar takes a row of its own (.in-group),
                         so the tabs get the title's row and the name has space to run. -->
                    <div class="header">
                        <!-- Inside a group: the way back to the list, before the app icon (as in Trips). -->
                        <button id="backBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:split.backToGroups, aria-label:split.backToGroups">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                        </button>
                        <!-- App icon + name on the group list; inside a group both give
                             way to the group's own name + facts (see render()). -->
                        <svg id="appIcon" class="app-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16.5 7A7 7 0 1 0 16.5 17"></path>
                            <line x1="3" y1="10.2" x2="13.5" y2="10.2"></line>
                            <line x1="3" y1="13.8" x2="13.5" y2="13.8"></line>
                        </svg>
                        <h1 id="appTitle">Split</h1>
                        <div id="groupTitle" class="head-title" hidden>
                            <div class="head-title-name">
                                <h2 id="groupName"></h2>
                                <span id="groupBadge"></span>
                            </div>
                            <div id="groupSub" class="head-title-sub"></div>
                        </div>

                        <!-- Gastos | Saldos ride the title's row (as in Habits). -->
                        <div id="groupTabs" class="tabs" role="tablist" hidden>
                            <button class="pill is-active" type="button" data-tab="entries" data-i18n="split.tabEntries"></button>
                            <button class="pill" type="button" data-tab="balances" data-i18n="split.tabBalances"></button>
                        </div>

                        <div class="header-actions">
                            <button id="addBtn" class="icon-btn" type="button" data-i18n-attr="title:split.newGroup, aria-label:split.newGroup">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                            <!-- The two the ⋮ menu was asked for most often, promoted to the bar.
                                 Icons only, the name lives in the tooltip. Both are edits, so a
                                 group somebody shared with us (read-only) hides them. -->
                            <!-- Its own key, not split.people: that one is the members sheet's
                                 heading, where "Personas" is the right word for a title. -->
                            <button id="peopleBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:split.peopleTip, aria-label:split.peopleTip">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                            </button>
                            <button id="editBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:split.editGroup, aria-label:split.editGroup">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                                </svg>
                            </button>
                            <button id="shareBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:split.shareGroup, aria-label:split.shareGroup">
                                <!-- Drive's share glyph, verbatim: the tray-with-an-arrow reads as
                                     "export a file", and this bar already has an export in the ⋮ menu. -->
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
                                </svg>
                            </button>
                            <!-- Copiar resumen / Exportar CSV. Both only READ the group, so a
                                 read-only one keeps them. They emptied the ⋮ menu, which is why
                                 there is no ⋮ button here any more. -->
                            <button id="copySumBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:split.copySummary, aria-label:split.copySummary">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                            <button id="csvBtn" class="icon-btn" type="button" hidden data-i18n-attr="title:split.exportCsv, aria-label:split.exportCsv">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </button>
                            <button class="icon-btn" data-intro-open type="button" data-i18n-attr="title:ui.help, aria-label:ui.help">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                            </button>
                            <button id="syncIndicator" class="sync-indicator" type="button" data-i18n-attr="title:ui.synced"></button>
                        </div>
                    </div>

                    <!-- HOME: the groups -->
                    <section id="homeView">
                        <div id="groupList" class="list"></div>

                        <div id="sharedBlock" class="home-block" hidden>
                            <div class="section-label" data-i18n="split.sharedWithMe"></div>
                            <div id="sharedList" class="list"></div>
                        </div>

                        <div id="archivedBlock" hidden>
                            <button id="archivedToggle" class="pill archived-toggle" type="button"></button>
                            <div id="archivedList" class="list" style="margin-top: 8px;" hidden></div>
                        </div>

                        <div id="homeEmpty" class="empty" hidden>
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16.5 7A7 7 0 1 0 16.5 17"></path>
                                <line x1="3" y1="10.2" x2="13.5" y2="10.2"></line>
                                <line x1="3" y1="13.8" x2="13.5" y2="13.8"></line>
                            </svg>
                            <p data-i18n="split.noGroups"></p>
                            <p data-i18n="split.noGroupsHint"></p>
                        </div>
                    </section>

                    <!-- A GROUP: Gastos | Saldos -->
                    <section id="groupView" hidden>
                        <div id="entriesTab">
                            <input id="searchInput" class="search" type="search" autocomplete="off" hidden data-i18n-attr="placeholder:split.searchPh">
                            <div id="entryList" class="list"></div>
                            <p id="noMatch" class="hint" hidden data-i18n="split.noMatch"></p>
                            <div id="entriesEmpty" class="empty" hidden>
                                <p data-i18n="split.noEntries"></p>
                                <p data-i18n="split.noEntriesHint"></p>
                            </div>
                        </div>

                        <div id="balancesTab" hidden>
                            <div id="totalsLine" class="totals"></div>
                            <div class="row-between">
                                <div class="section-label" data-i18n="split.balances"></div>
                                <button id="perCurBtn" class="pill" type="button" data-i18n="split.perCurrency" hidden data-i18n-attr="title:split.perCurrencyTip"></button>
                            </div>
                            <div id="balanceList"></div>
                            <div class="actions-row">

    <!-- All the arithmetic (integers in cents, splits, balances, settlements). -->
