    <script type="module">
        // Nothing is drawn from JS before the dictionary is in: without an
        // in-source fallback, an early render would paint the bare keys.
        await NayiveI18n.ready;

        //------------------------------------------------------------------------//
        // STATE

        const API_FILES = GumApi.API_FILES;
        const DIR       = 'data/split';      // one folder per group: data/split/<id>/group.json
        const FILE      = 'group.json';
        const M         = SplitMoney;
        const store     = NayiveStore.createStore( { apiBase: API_FILES } );

        // Interface strings: Spanish here, translatable through shared/i18n/*.json.
        const T  = k           => NayiveUI.t( k );
        const TF = ( k, vars ) => NayiveUI.tf( k, vars );

        let groups  = [];      // every group we can see: ours + shared with us (._ro)
        let current = null;    // the open group, or null on the home screen
        let tab     = 'entries';
        let perCur  = false;   // Saldos: true = one balance per currency, no conversion
        let search  = '';
        let meUser  = '';      // the login name, from /api/whoami
        const sharedOwners = {};   // "shared/<slug>" -> who shared it

        let es = null;         // the entry sheet's working state (see openEntrySheet)
        let gs = null;         // the group sheet's
        let ms = null;         // the people sheet's working copy of the members

        //------------------------------------------------------------------------//
        // SMALL HELPERS

        const $ = id => document.getElementById( id );

        function el( tag, cls, text )
        {
            const e = document.createElement( tag );
            if( cls ) e.className = cls;
            if( text != null ) e.textContent = text;
            return e;
        }

        function pad2( n ) { return ( n < 10 ? '0' : '' ) + n; }

        // Dates are stored and shown as yyyy-mm-dd (the Nayive rule); this is today's.
        function todayIso()
        {
            const d = new Date();
            return d.getFullYear() + '-' + pad2( d.getMonth() + 1 ) + '-' + pad2( d.getDate() );
        }

        function newId( prefix )
        {
            return prefix + '_' + Date.now().toString( 36 ) + Math.random().toString( 36 ).slice( 2, 6 );
        }

        function slugify( s )
        {
            const t = String( s || '' ).normalize( 'NFD' ).replace( /[\u0300-\u036f]/g, '' )
                        .toLowerCase().replace( /[^a-z0-9]+/g, '-' ).replace( /^-+|-+$/g, '' ).slice( 0, 24 );
            return t || 'grupo';
        }

        function fmt( minor, code, opts ) { return M.formatAmount( minor, code, opts ); }

        const IC = {
            arrow:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>',
            euro:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 7A7 7 0 1 0 16.5 17"></path><line x1="3" y1="10.2" x2="13.5" y2="10.2"></line><line x1="3" y1="13.8" x2="13.5" y2="13.8"></line></svg>',
            eye:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
            archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>',
            trash:   NayiveUI.icon( 'trash' ),
            check:   NayiveUI.icon( 'check' ),
            eyeoff:  NayiveUI.icon( 'eyeoff' )
        };

        //------------------------------------------------------------------------//
        // MEMBERS

        function members( g )         { return ( g && g.members ) || []; }
        function visibleMembers( g )  { return members( g ).filter( m => ! m.hidden ); }
        function memberOf( g, id )    { return members( g ).find( m => m.id === id ) || null; }
        function nameOf( g, id )      { const m = memberOf( g, id ); return m ? ( m.name || '?' ) : '?'; }
        function colorIndex( g, id )  { const i = members( g ).findIndex( m => m.id === id ); return ( i < 0 ? 7 : i ) % 8; }

        function initials( name )
        {
            const words = String( name || '' ).trim().split( /\s+/ ).filter( Boolean );
            if( ! words.length ) return '?';
            if( words.length === 1 ) return words[ 0 ].slice( 0, 2 ).toUpperCase();
            return ( words[ 0 ][ 0 ] + words[ 1 ][ 0 ] ).toUpperCase();
        }

        function avatarFor( colorIdx, name, small )
        {
            const a = el( 'span', 'avatar' + ( small ? ' sm' : '' ), initials( name ) );
            a.setAttribute( 'data-c', String( colorIdx % 8 ) );
            a.title = name || '';
            return a;
        }

        function avatar( g, id, small ) { return avatarFor( colorIndex( g, id ), nameOf( g, id ), small ); }

        function bubble( svg )
        {
            const b = el( 'span', 'bubble' );
            b.innerHTML = svg;
            return b;
        }

        // Who "I" am in a group. In my own groups: the member marked `me`. In a
        // group shared with me the owner's mark is theirs, so I am the member
        // whose name is my login name, if any.
        function meId( g )
        {
            if( ! g ) return null;
            let m;
            if( ! g._ro ) m = members( g ).find( x => x.me );
            else { const u = meUser.trim().toLowerCase(); m = u ? members( g ).find( x => ( x.name || '' ).trim().toLowerCase() === u ) : null; }
            return m ? m.id : null;
        }

        //------------------------------------------------------------------------//
        // INITIALIZATION

        NayiveI18n.ready.then( function()
        {
            $( 'addBtn'  ).addEventListener( 'click', function() { if( current ) openEntrySheet( null ); else openGroupSheet( null ); } );
            $( 'backBtn' ).addEventListener( 'click', goHome );
            $( 'copySumBtn' ).addEventListener( 'click', copySummary );
            $( 'csvBtn'      ).addEventListener( 'click', exportCsv );
            $( 'peopleBtn' ).addEventListener( 'click', openMembersSheet );
            $( 'editBtn'    ).addEventListener( 'click', function() { openGroupSheet( current ); } );
            $( 'shareBtn'  ).addEventListener( 'click', function()
            {
                const g = current;
                if( ! g ) return;
                NayiveUI.shareSheet( { path: g._base, app: 'split', title: g.name || 'Split' } );
            } );

            document.querySelectorAll( '[data-tab]' ).forEach( function( b )
            {
                b.addEventListener( 'click', function() { tab = b.dataset.tab; renderGroup(); } );
            } );
            $( 'searchInput' ).addEventListener( 'input', function() { search = this.value; renderEntries(); } );
            $( 'perCurBtn' ).addEventListener( 'click', function() { perCur = ! perCur; renderBalances(); } );
            $( 'copyBtn' ).addEventListener( 'click', copySummary );
            $( 'archivedToggle' ).addEventListener( 'click', function()
            {
                const list = $( 'archivedList' );
                list.hidden = ! list.hidden;
                this.classList.toggle( 'is-active', ! list.hidden );
            } );

            // Group sheet
            $( 'groupSaveBtn' ).addEventListener( 'click', saveGroup );
            $( 'groupNameInput' ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) saveGroup(); } );

            // Entry sheet
            $( 'kindTabs' ).addEventListener( 'click', function( e )
            {
                const b = e.target.closest( '[data-kind]' );
                if( b && es ) { es.kind = b.dataset.kind; renderEntrySheet(); }
            } );
            $( 'modeTabs' ).addEventListener( 'click', function( e )
            {
                const b = e.target.closest( '[data-mode]' );
                if( b && es ) { es.mode = b.dataset.mode; renderEntrySheet(); }
            } );
            $( 'amountInput' ).addEventListener( 'input', function() { if( es ) { es.amountText = this.value; refreshEntryHints(); } } );
            $( 'currencySel' ).addEventListener( 'change', function()
            {
                if( ! es ) return;
                es.currency = this.value;
                const known = current && current.rates && current.rates[ es.currency ];
                es.rateText = es.currency === current.currency ? '' : ( known ? String( known ) : '' );
                renderEntrySheet();
                if( es.currency !== current.currency && ! es.rateText ) $( 'rateInput' ).focus();
            } );
            $( 'rateInput' ).addEventListener( 'input', function() { if( es ) { es.rateText = this.value; refreshEntryHints(); } } );
            $( 'textInput' ).addEventListener( 'input', function() { if( es ) es.text = this.value; } );
            $( 'dateInput' ).addEventListener( 'input', function() { if( es ) es.date = this.value; $( 'dateDisplay' ).textContent = this.value; } );
            $( 'dateInput' ).addEventListener( 'change', function() { if( es ) es.date = this.value; $( 'dateDisplay' ).textContent = this.value; } );
            $( 'allBtn' ).addEventListener( 'click', function()
            {
                if( ! es ) return;
                es.among = visibleMembers( current ).map( m => m.id );
                renderEntrySheet();
            } );
            $( 'entrySaveBtn' ).addEventListener( 'click', saveEntry );
            $( 'entryDelBtn' ).addEventListener( 'click', deleteEntry );
            $( 'amountInput' ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) saveEntry(); } );
            $( 'textInput' ).addEventListener( 'keydown', function( e ) { if( e.key === 'Enter' ) saveEntry(); } );

            // People sheet
            $( 'addMemberBtn' ).addEventListener( 'click', function()
            {
                if( ! ms ) return;
                ms.push( { id: newId( 'm' ), name: '' } );
                renderMembersSheet();
                const inputs = $( 'memberRows' ).querySelectorAll( 'input[type=text]' );
                if( inputs.length ) inputs[ inputs.length - 1 ].focus();
            } );
            $( 'membersSaveBtn' ).addEventListener( 'click', saveMembers );

            // The × of every one of OUR sheets (shared/ui.js styles a data-act="close"
            // button and flags it _nayiveClose; closing it is the app's job). The
            // shared confirm/alert and share dialogs handle their own and carry no id.
            document.addEventListener( 'click', function( e )
            {
                const b = e.target.closest( 'button' );
                if( ! b || ! b._nayiveClose ) return;
                const back = b.closest( '.sheet-backdrop' );
                if( back && back.id ) closeSheet( back.id );
            } );

            // Escape closes the topmost of our sheets.
            document.addEventListener( 'keydown', function( e )
            {
                if( e.key !== 'Escape' ) return;
                const open = Array.from( document.querySelectorAll( '.sheet-backdrop.open' ) ).pop();
                if( open && open.id ) { closeSheet( open.id ); e.preventDefault(); }
            } );

            // The store's state machine drives the header plug for every read and write.
            store.onState( setSyncStatus );

            // The plug's click and the focus / visibilitychange re-reads, all on ONE guarded
            // path (shared/ui.js). Every save PUTs the whole group file (last write wins), so
            // a tab left open all day would upload stale groups over an edit made on the
            // phone. The default guard keeps the read out of an open sheet, where
            // re-rendering would throw away what is being typed.
            NayiveUI.wireRefresh( { store: store, read: loadGroups } );

            // Probe the API, then load. On a failed probe the shared helper bounces to the
            // sign-in page only when we are really online with nothing cached; otherwise it
            // opens on the local cache and the store syncs once the connection is back.
            NayiveUI.bootWithStore( store, async function( who )
            {
                meUser = ( who && who.user ) || '';   // null when we opened from the cache
                await loadGroups();
                applyOpenParam();
            } );
        } );

        // Deep link: ?open=<group folder> lands straight on that group. Drive's
        // "Compartido conmigo" uses it ("shared/<slug>"); applied once.
        let openParamDone = false;
        function applyOpenParam()
        {
            if( openParamDone ) return;
            openParamDone = true;
            const want = new URLSearchParams( location.search ).get( 'open' );
            if( ! want ) return;
            const g = groups.find( x => x._base === want.replace( /\/+$/, '' ) );
            if( g ) openGroup( g );
        }

        //------------------------------------------------------------------------//
        // PERSISTENCE - one folder per group: data/split/<id>/group.json. The
        // folder is what user-sharing lends to another person, and it leaves
        // room beside the JSON for receipts later. Which groups exist = the
        // folder listing (online) or the store's cache (offline).

        async function loadGroups()
        {
            let paths = null;

            if( navigator.onLine )
            {
                try
                {
                    const node = await GumApi.listDirRecursive( DIR );
                    const dirs = ( node.nodes || [] ).filter( n => Array.isArray( n.nodes ) );
                    paths = dirs
                        .filter( dn => ( dn.nodes || [] ).some( n => n.path === dn.path + '/' + FILE ) )
                        .map( dn => dn.path + '/' + FILE );
                }
                catch( err )
                {
                    // No data/split folder yet (a fresh account) = no groups, not "offline".
                    paths = String( err && err.message ).indexOf( 'HTTP 404' ) !== -1 ? [] : null;
                }
                if( paths !== null ) paths = paths.concat( await sharedGroupPaths() );
            }

            if( paths === null )
            {
                const own    = await store.listCached( DIR + '/' );
                const shared = await store.listCached( 'shared/' );
                paths = own.concat( shared ).filter( p => p.endsWith( '/' + FILE ) );
            }

            const results = await Promise.all( paths.map( p => store.read( p ).then( r => ( { path: p, res: r } ) ) ) );
            const loaded  = [];

            for( const { path, res } of results )
            {
                if( ! res.body ) continue;   // 'empty' (gone) or 'unknown' (unreachable, nothing cached)
                try
                {
                    const g = JSON.parse( res.body );
                    if( ! g || typeof g !== 'object' ) continue;
                    g.members = Array.isArray( g.members ) ? g.members : [];
                    g.entries = Array.isArray( g.entries ) ? g.entries : [];
                    g.rates   = g.rates && typeof g.rates === 'object' ? g.rates : {};
                    g._base   = path.slice( 0, -( FILE.length + 1 ) );
                    g._ro     = g._base.indexOf( 'shared/' ) === 0;
                    loaded.push( g );
                }
                catch( _ ) { /* one corrupt group.json must not take down the list */ }
            }

            groups = loaded;
            if( current ) current = groups.find( g => g._base === current._base ) || null;

            if( paths.length === 0 )                 // nothing to read -> the store never emitted
                setSyncStatus( navigator.onLine ? 'synced' : 'offline' );

            render();
        }

        // Groups other people shared with us: "shared/<slug>/group.json". A
        // failure here just means no shared groups, never a broken list.
        async function sharedGroupPaths()
        {
            try
            {
                const r = await fetch( window.location.origin + '/api/shares' );
                if( ! r.ok ) return [];
                const j = await r.json();
                return ( j.with_me || [] )
                    .filter( g => g.app === 'split' && ! g.gone )
                    .map( g => { sharedOwners[ g.path ] = g.by; return g.path + '/' + FILE; } );
            }
            catch( _ ) { return []; }
        }

        // Writes ONE group back to its own folder. Cached at once, uploaded now
        // or on reconnect. A group shared with us is never written.
        function persist( g )
        {
            if( ! g || g._ro ) return;
            const body = JSON.stringify( g, ( k, v ) => k.charAt( 0 ) === '_' ? undefined : v, 2 );
            store.write( g._base + '/' + FILE, body );
        }

        // Called by the store on every sync-state change (same mapping as Tasks).
        // The store drives the header plug; loadGroups() also calls it by hand when there is
        // nothing to read and the store therefore never emits a state.
        const setSyncStatus = NayiveUI.syncIndicator();

        //------------------------------------------------------------------------//
        // RENDER - home or one group

        // Show / hide any element, <svg> included (see render()).
        function setHidden( el, on )
        {
            if( on ) el.setAttribute( 'hidden', '' ); else el.removeAttribute( 'hidden' );
        }

        function render()
        {
            const inGroup = !! current;
            $( 'homeView'  ).hidden = inGroup;
            $( 'groupView' ).hidden = ! inGroup;
            $( 'backBtn'   ).hidden = ! inGroup;

            // Header title: "Split" on the list, the group's own name inside one.
            // setAttribute, not `.hidden =`: the app icon is an <svg>, and the
            // `hidden` IDL property lives on HTMLElement only - assigning it on
            // an SVGElement silently sets a dead JS property and the icon stays.
            setHidden( $( 'appIcon'    ), inGroup );
            setHidden( $( 'appTitle'   ), inGroup );
            setHidden( $( 'groupTitle' ), ! inGroup );
            setHidden( $( 'groupTabs'  ), ! inGroup );

            // .in-group drops the button bar to its own row (see the CSS).
            document.querySelector( '.header' ).classList.toggle( 'in-group', inGroup );

            // Personas, Editar and Compartir all change the group, so a read-only
            // one hides them. Copiar resumen and Exportar CSV only read it, so
            // they show for every open group.
            const canEdit = inGroup && ! current._ro;
            setHidden( $( 'peopleBtn'  ), ! canEdit );
            setHidden( $( 'editBtn'    ), ! canEdit );
            setHidden( $( 'shareBtn'   ), ! canEdit );
            setHidden( $( 'copySumBtn' ), ! inGroup );
            setHidden( $( 'csvBtn'     ), ! inGroup );

            const add = $( 'addBtn' );
            add.hidden = inGroup && current._ro;
            add.title  = inGroup ? T( 'split.addEntry' ) : T( 'split.addGroup' );
            add.setAttribute( 'aria-label', add.title );

            // The "?" answers about the screen you are on (see SPLIT_INTRO).
            if( window.SPLIT_INTRO && NayiveUI.setIntro )
                NayiveUI.setIntro( inGroup ? SPLIT_INTRO.group : SPLIT_INTRO.home );

            if( inGroup ) renderGroup(); else renderHome();
        }

        // Close one of our sheets and forget what it was editing.
        function closeSheet( id )
        {
            NayiveUI.close( id );
            if( id === 'entrySheetBackdrop' )   es = null;
            if( id === 'groupSheetBackdrop' )   gs = null;
            if( id === 'membersSheetBackdrop' ) ms = null;
        }

        function goHome()
        {
            current = null;
            render();
        }

        function openGroup( g )
        {
            current = g;
            tab     = 'entries';
            search  = '';
            $( 'searchInput' ).value = '';
            render();
        }

        const byName = ( a, b ) => String( a.name || '' ).localeCompare( String( b.name || '' ), undefined, { sensitivity: 'base' } );

        function renderHome()
        {
            const own    = groups.filter( g => ! g._ro && ! g.archived ).sort( byName );
            const shared = groups.filter( g => g._ro ).sort( byName );
            const arch   = groups.filter( g => ! g._ro && g.archived ).sort( byName );

            const list = $( 'groupList' );
            list.innerHTML = '';
            own.forEach( g => list.appendChild( groupRow( g ) ) );

            $( 'sharedBlock' ).hidden = ! shared.length;
            const sl = $( 'sharedList' );
            sl.innerHTML = '';
            shared.forEach( g => sl.appendChild( groupRow( g ) ) );

            $( 'archivedBlock' ).hidden = ! arch.length;
            $( 'archivedToggle' ).textContent = TF( 'split.archivedN', { n: arch.length } );
            const al = $( 'archivedList' );
            al.innerHTML = '';
            arch.forEach( g => al.appendChild( groupRow( g ) ) );
            if( ! arch.length ) { al.hidden = true; $( 'archivedToggle' ).classList.remove( 'is-active' ); }

            $( 'homeEmpty' ).hidden = groups.length > 0;
        }

        function membersLine( g )
        {
            const names = visibleMembers( g ).map( m => m.name || '?' );
            if( ! names.length ) return T( 'split.nobody' );
            if( names.length <= 4 ) return names.join( ', ' );
            return names.slice( 0, 3 ).join( ', ' ) + ' +' + ( names.length - 3 );
        }

        function amountNode( minor, code, cls )
        {
            const sign = minor > 0 ? 'pos' : minor < 0 ? 'neg' : 'zero';
            return el( 'div', ( cls || 'main' ) + ' ' + sign, fmt( minor, code, { plus: true } ) );
        }

        // The row is a <div role="button">, not a <button>: it carries its own
        // delete button, and a <button> inside a <button> is invalid HTML - the
        // parser unnests it and the row falls apart.
        function groupRow( g )
        {
            const row = el( 'div', 'card-row' );
            row.setAttribute( 'role', 'button' );
            row.tabIndex = 0;
            row.appendChild( bubble( IC.euro ) );

            const main  = el( 'div', 'row-main' );
            const title = el( 'div', 'row-title' );
            title.appendChild( el( 'span', null, g.name || T( 'split.unnamed' ) ) );
            if( g._ro ) title.appendChild( NayiveUI.sharedBadge( sharedOwners[ g._base ] || '' ) );
            main.appendChild( title );
            main.appendChild( el( 'div', 'row-meta', membersLine( g ) ) );
            row.appendChild( main );

            const amt = el( 'div', 'row-amt' );
            const me  = meId( g );
            if( me !== null )
            {
                const net = M.balances( g )[ me ] || 0;
                amt.appendChild( amountNode( net, g.currency ) );
                amt.appendChild( el( 'div', 'sub', net > 0 ? T( 'split.owedToYou' ) : net < 0 ? T( 'split.youOwe' ) : T( 'split.even' ) ) );
            }
            else
            {
                amt.appendChild( el( 'div', 'main', fmt( M.memberTotals( g ).total, g.currency ) ) );
                amt.appendChild( el( 'div', 'sub', T( 'split.totalWord' ) ) );
            }
            row.appendChild( amt );

            // ONE button at the right edge of every group we own, and it is the
            // group's next step rather than a menu: a live group offers the
            // archive box, and only once it is archived does that slot become
            // the bin. You cannot delete a group you have not put away first,
            // which is the whole point - it turns one tap on a live group into
            // two deliberate ones. Eliminar still asks (see deleteGroup). To
            // bring an archived group back, open it: the archive button in its
            // toolbar then reads "Desarchivar".
            if( ! g._ro )
            {
                const archived = !! g.archived;
                const act = el( 'button', 'icon-btn sm row-act' + ( archived ? ' danger' : '' ) );
                act.type  = 'button';
                act.title = archived ? T( 'split.deleteGroup' ) : T( 'split.archive' );
                act.setAttribute( 'aria-label', act.title );
                act.innerHTML = archived ? IC.trash : IC.archive;
                act.addEventListener( 'click', function()
                {
                    if( archived ) deleteGroup( g ); else toggleArchive( g );
                } );
                row.appendChild( act );
            }

            // The row opens the group - except where a real button caught the tap.
            row.addEventListener( 'click', function( e )
            {
                if( e.target.closest( 'button' ) ) return;
                openGroup( g );
            } );
            row.addEventListener( 'keydown', function( e )
            {
                if( e.key !== 'Enter' && e.key !== ' ' ) return;
                if( e.target !== row ) return;          // the trash handles its own keys
                e.preventDefault();                      // Space would scroll the page
                openGroup( g );
            } );
            return row;
        }

        //------------------------------------------------------------------------//
        // ONE GROUP

        function renderGroup()
        {
            const g = current;
            if( ! g ) return;

            const gname = g.name || T( 'split.unnamed' );
            $( 'groupName' ).textContent = gname;
            $( 'groupName' ).title       = gname;   // the header clips it with "..."; hover gives it back
            const badge = $( 'groupBadge' );
            badge.innerHTML = '';
            if( g._ro ) badge.appendChild( NayiveUI.sharedBadge( sharedOwners[ g._base ] || '' ) );

            const facts = [ TF( 'split.nPeople', { n: visibleMembers( g ).length } ), g.currency ];
            if( g.archived ) facts.push( T( 'split.archivedWord' ) );
            $( 'groupSub' ).textContent = facts.join( ' · ' );

            document.querySelectorAll( '[data-tab]' ).forEach( b => b.classList.toggle( 'is-active', b.dataset.tab === tab ) );
            $( 'entriesTab'  ).hidden = tab !== 'entries';
            $( 'balancesTab' ).hidden = tab !== 'balances';

            if( tab === 'entries' ) renderEntries(); else renderBalances();
        }

        // Newest first: by date, then by the moment it was written.
        function sortedEntries( g )
        {
            return ( g.entries || [] ).slice().sort( ( a, b ) =>
                String( b.date || '' ).localeCompare( String( a.date || '' ) ) || ( b.created || 0 ) - ( a.created || 0 ) );
        }

        function entryMatches( g, e, q )
        {
            const bits = [ e.text || '', e.date || '', e.currency || '', M.toDecimal( e.amount, e.currency || g.currency, ',' ) ];
            if( e.type === 'payment' ) bits.push( nameOf( g, e.from ), nameOf( g, e.to ), T( 'split.payment' ) );
            else { bits.push( nameOf( g, e.paidBy ) ); M.participants( e ).ids.forEach( id => bits.push( nameOf( g, id ) ) ); }
            return bits.join( ' ' ).toLowerCase().indexOf( q ) !== -1;
        }

        function renderEntries()
        {
            const g    = current;
            const all  = sortedEntries( g );
            const q    = search.trim().toLowerCase();
            const rows = q ? all.filter( e => entryMatches( g, e, q ) ) : all;

            $( 'searchInput' ).hidden = all.length < 6 && ! q;

            const list = $( 'entryList' );
            list.innerHTML = '';
            rows.forEach( e => list.appendChild( entryRow( g, e ) ) );

            $( 'noMatch' ).hidden = ! ( all.length && ! rows.length );

            const empty = $( 'entriesEmpty' );
            empty.hidden = all.length > 0;
            empty.querySelector( 'p + p' ).hidden = g._ro;
        }

        function entryRow( g, e )
        {
            const ro  = g._ro;
            const row = el( ro ? 'div' : 'button', 'card-row' + ( ro ? ' ro' : '' ) );
            if( ! ro )
            {
                row.type = 'button';
                row.title = T( 'split.editEntryTip' );
                row.addEventListener( 'click', function() { openEntrySheet( e ); } );
            }

            const main = el( 'div', 'row-main' );
            if( e.type === 'payment' )
            {
                row.appendChild( bubble( IC.arrow ) );
                const title = el( 'div', 'row-title' );
                title.appendChild( el( 'span', null, nameOf( g, e.from ) + ' → ' + nameOf( g, e.to ) ) );
                main.appendChild( title );
                main.appendChild( el( 'div', 'row-meta', T( 'split.payment' ) + ' · ' + ( e.date || '' ) ) );
            }
            else
            {
                row.appendChild( avatar( g, e.paidBy ) );
                const title = el( 'div', 'row-title' );
                title.appendChild( el( 'span', null, e.text || T( 'split.expense' ) ) );
                main.appendChild( title );

                const ids = M.participants( e ).ids;
                const who = ids.length >= visibleMembers( g ).length && ids.length > 1 ? T( 'split.forAll' )
                          : ids.length === 1 ? TF( 'split.forOne', { name: nameOf( g, ids[ 0 ] ) } )
                          : TF( 'split.forN', { n: ids.length } );
                main.appendChild( el( 'div', 'row-meta',
                    TF( 'split.paidBy', { name: nameOf( g, e.paidBy ) } ) + ' · ' + who + ' · ' + ( e.date || '' ) ) );
            }
            row.appendChild( main );

            const code = e.currency || g.currency;
            const amt  = el( 'div', 'row-amt' );
            amt.appendChild( el( 'div', 'main', fmt( e.amount, code ) ) );
            if( code !== g.currency ) amt.appendChild( el( 'div', 'sub', '≈ ' + fmt( M.entryBase( e, g.currency ), g.currency ) ) );
            row.appendChild( amt );

            return row;
        }

        //------------------------------------------------------------------------//
        // BALANCES

        function renderBalances()
        {
            const g    = current;
            const me   = meId( g );
            const mt   = M.memberTotals( g );
            const used = M.usedCurrencies( g );

            const parts = [ TF( 'split.totalSpent', { amt: fmt( mt.total, g.currency ) } ) ];
            if( me !== null && mt.members[ me ] )
            {
                parts.push( TF( 'split.yourShare', { amt: fmt( mt.members[ me ].share, g.currency ) } ) );
                parts.push( TF( 'split.youPaid', { amt: fmt( mt.members[ me ].paid,  g.currency ) } ) );
            }
            $( 'totalsLine' ).textContent = parts.join( ' · ' );

            const pcb = $( 'perCurBtn' );
            pcb.hidden = used.length < 2;
            pcb.classList.toggle( 'is-active', perCur && used.length > 1 );

            const box = $( 'balanceList' );
            box.innerHTML = '';

            if( perCur && used.length > 1 )
            {
                const byCur = M.balancesByCurrency( g );
                used.forEach( code =>
                {
                    const block = el( 'div', 'cur-block' );
                    block.appendChild( el( 'div', 'section-label', code + ' · ' + M.currency( code ).name ) );
                    balanceBlock( block, g, byCur[ code ] || {}, code, me, null );
                    box.appendChild( block );
                } );
            }
            else
            {
                balanceBlock( box, g, M.balances( g ), g.currency, me, mt );
            }
        }

        // The rows for one balance map + the transfers that settle it.
        function balanceBlock( box, g, net, code, me, mt )
        {
            const ids = members( g ).filter( m => ! m.hidden || ( net[ m.id ] || 0 ) !== 0 ).map( m => m.id )
                            .sort( ( a, b ) => ( net[ b ] || 0 ) - ( net[ a ] || 0 ) );
            const max = Math.max( 1, ...ids.map( id => Math.abs( net[ id ] || 0 ) ) );

            ids.forEach( id =>
            {
                const v    = net[ id ] || 0;
                const wrap = el( 'div', 'bal' );
                const row  = el( 'div', 'bal-row' );
                row.appendChild( avatar( g, id ) );

                const name = el( 'div', 'bal-name', nameOf( g, id ) );
                if( id === me ) { name.appendChild( document.createTextNode( ' ' ) ); name.appendChild( el( 'small', null, T( 'split.youParen' ) ) ); }
                row.appendChild( name );

                const sign = v > 0 ? 'pos' : v < 0 ? 'neg' : 'zero';
                row.appendChild( el( 'div', 'bal-amt ' + sign, fmt( v, code, { plus: true } ) ) );
                wrap.appendChild( row );

                const bar  = el( 'div', 'bal-bar' );
                const fill = el( 'i', sign );
                fill.style.width = ( 50 * Math.abs( v ) / max ).toFixed( 1 ) + '%';
                bar.appendChild( fill );
                wrap.appendChild( bar );

                if( mt && mt.members[ id ] )
                    wrap.appendChild( el( 'div', 'bal-detail',
                        TF( 'split.paidShare', { paid: fmt( mt.members[ id ].paid, code ), share: fmt( mt.members[ id ].share, code ) } ) ) );

                box.appendChild( wrap );
            } );

            box.appendChild( el( 'div', 'section-label', T( 'split.whoPays' ) ) ).style.marginTop = '12px';

            const transfers = M.settle( net );
            if( ! transfers.length )
            {
                const ok = el( 'div', 'all-even' );
                ok.innerHTML = IC.check;
                ok.appendChild( el( 'span', null, T( 'split.allEven' ) ) );
                box.appendChild( ok );
                return;
            }

            transfers.forEach( tr =>
            {
                const row = el( 'div', 'settle-row' );
                const who = el( 'div', 'settle-who' );
                who.appendChild( avatar( g, tr.from, true ) );
                who.appendChild( el( 'span', null, nameOf( g, tr.from ) ) );
                const arrow = el( 'span' ); arrow.innerHTML = IC.arrow;
                who.appendChild( arrow );
                who.appendChild( avatar( g, tr.to, true ) );
                who.appendChild( el( 'span', null, nameOf( g, tr.to ) ) );
                row.appendChild( who );
                row.appendChild( el( 'div', 'settle-amt', fmt( tr.amount, code ) ) );

                if( ! g._ro )
                {
                    const b = el( 'button', 'icon-btn sm' );
                    b.type  = 'button';
                    b.title = T( 'split.recordPayment' );
                    b.setAttribute( 'aria-label', b.title );
                    b.innerHTML = IC.check;
                    b.addEventListener( 'click', function()
                    {
                        openEntrySheet( null, { kind: 'payment', from: tr.from, to: tr.to, amount: tr.amount, currency: code } );
                    } );
                    row.appendChild( b );
                }
                box.appendChild( row );
            } );
        }

        //------------------------------------------------------------------------//
        // THE ENTRY SHEET - one dialog for an expense or a payment, new or edited.
        // `es` holds what is on screen; nothing touches the group until ✓.

        function openEntrySheet( entry, preset )
        {
            const g = current;
            if( ! g || g._ro ) return;
            preset = preset || {};

            const vis = visibleMembers( g );
            const me  = meId( g );

            es = {
                id:         entry ? entry.id : null,
                created:    entry ? entry.created : null,
                kind:       entry ? ( entry.type === 'payment' ? 'payment' : 'expense' ) : ( preset.kind || 'expense' ),
                currency:   entry ? ( entry.currency || g.currency ) : ( preset.currency || g.currency ),
                amountText: entry ? M.toDecimal( entry.amount, entry.currency || g.currency, ',' )
                          : preset.amount ? M.toDecimal( preset.amount, preset.currency || g.currency, ',' ) : '',
                rateText:   entry && entry.currency !== g.currency ? String( entry.rate || '' ) : '',
                text:       entry ? ( entry.text || '' ) : '',
                date:       entry ? ( entry.date || todayIso() ) : todayIso(),
                paidBy:     entry ? entry.paidBy : ( me !== null ? me : ( vis[ 0 ] ? vis[ 0 ].id : null ) ),
                among:      entry && entry.split && entry.split.mode === 'equal' ? ( entry.split.among || [] ).slice() : vis.map( m => m.id ),
                mode:       entry && entry.split && entry.split.mode ? entry.split.mode : 'equal',
                partText:   {},
                from:       entry ? entry.from : ( preset.from || ( me !== null ? me : null ) ),
                to:         entry ? entry.to : ( preset.to || null )
            };

            if( entry && entry.split && entry.split.parts )
            {
                Object.keys( entry.split.parts ).forEach( id =>
                {
                    const v = entry.split.parts[ id ];
                    es.partText[ id ] = es.mode === 'exact' ? M.toDecimal( v, es.currency, ',' ) : String( v );
                } );
            }
            if( es.currency !== g.currency && ! es.rateText && g.rates[ es.currency ] ) es.rateText = String( g.rates[ es.currency ] );

            $( 'entrySheetTitle' ).textContent = entry ? T( 'split.editEntry' ) : T( 'split.newEntry' );
            $( 'entryDelBtn' ).hidden = ! entry;
            fillCurrencySelect( $( 'currencySel' ), g, es.currency );
            $( 'amountInput' ).value = es.amountText;
            $( 'textInput' ).value   = es.text;
            $( 'dateInput' ).value   = es.date;

            renderEntrySheet();
            NayiveUI.open( 'entrySheetBackdrop' );
            setTimeout( function() { $( 'amountInput' ).focus(); }, 60 );
        }

        // The currency <select>: the group's + the ones already used + the
        // favourites first, then every other code alphabetically.
        function fillCurrencySelect( sel, g, value )
        {
            sel.innerHTML = '';
            const first = [];
            const push  = c => { if( c && first.indexOf( c ) === -1 ) first.push( c ); };
            if( g ) M.usedCurrencies( g ).forEach( push );
            M.FAVOURITES.forEach( push );
            push( value );

            const optFor = c => { const o = el( 'option', null, c + ' · ' + M.currency( c ).name ); o.value = c; o.dataset.full = o.textContent; return o; };

            const g1 = el( 'optgroup' ); g1.label = T( 'split.frequent' );
            first.forEach( c => g1.appendChild( optFor( c ) ) );
            sel.appendChild( g1 );

            const g2 = el( 'optgroup' ); g2.label = T( 'split.allCurrencies' );
            M.codes().filter( c => first.indexOf( c ) === -1 ).forEach( c => g2.appendChild( optFor( c ) ) );
            sel.appendChild( g2 );

            sel.value = value;
            compactSelect( sel );
        }

        // A native <select> shows the chosen option's full text when closed, and
        // "USD · Dólar estadounidense" leaves no room for the amount beside it.
        // So: closed = the code only; while the list is open, every option
        // shows code + name. Wired once per <select>.
        function compactSelect( sel )
        {
            const relabel = open =>
            {
                Array.from( sel.options ).forEach( o =>
                {
                    o.textContent = ( ! open && o.selected ) ? o.value : ( o.dataset.full || o.value );
                } );
            };
            if( ! sel._compact )
            {
                sel._compact = true;
                [ 'mousedown', 'touchstart', 'focus', 'keydown' ].forEach( ev => sel.addEventListener( ev, function() { relabel( true ); }, { passive: true } ) );
                [ 'change', 'blur' ].forEach( ev => sel.addEventListener( ev, function() { relabel( false ); } ) );
            }
            relabel( false );
        }

        function chip( g, id, active, onClick )
        {
            const b = el( 'button', 'pill' + ( active ? ' is-active' : '' ) );
            b.type = 'button';
            b.appendChild( avatar( g, id, true ) );
            b.appendChild( el( 'span', null, nameOf( g, id ) ) );
            b.setAttribute( 'aria-pressed', active ? 'true' : 'false' );
            b.addEventListener( 'click', onClick );
            return b;
        }

        // People offered in the chips: the visible members, plus anyone this
        // entry already names (a hidden member on an old expense stays editable).
        function chipMembers( g )
        {
            const ids = visibleMembers( g ).map( m => m.id );
            [ es.paidBy, es.from, es.to ].concat( es.among ).concat( Object.keys( es.partText ) )
                .forEach( id => { if( id && ids.indexOf( id ) === -1 && memberOf( g, id ) ) ids.push( id ); } );
            return ids;
        }

        function renderEntrySheet()
        {
            const g = current;
            if( ! g || ! es ) return;
            const pay = es.kind === 'payment';

            document.querySelectorAll( '#kindTabs [data-kind]' ).forEach( b => b.classList.toggle( 'is-active', b.dataset.kind === es.kind ) );
            document.querySelectorAll( '#modeTabs [data-mode]' ).forEach( b => b.classList.toggle( 'is-active', b.dataset.mode === es.mode ) );

            $( 'textField'  ).hidden = pay;
            $( 'toField'    ).hidden = ! pay;
            $( 'amongField' ).hidden = pay || es.mode !== 'equal';
            $( 'modeField'  ).hidden = pay;
            $( 'payerLabel' ).textContent = pay ? T( 'split.fromLabel' ) : T( 'split.paidByLabel' );
            $( 'dateDisplay' ).textContent = es.date || '';

            // exchange rate: only when the entry is not in the group currency
            const foreign = es.currency !== g.currency;
            $( 'rateField' ).hidden = ! foreign;
            if( foreign )
            {
                $( 'rateLabel' ).textContent = TF( 'split.rateLabel', { from: es.currency, to: g.currency } );
                $( 'rateInput' ).value = es.rateText;
            }

            const ids = chipMembers( g );

            const payer = $( 'payerChips' );
            payer.innerHTML = '';
            ids.forEach( id => payer.appendChild( chip( g, id, ( pay ? es.from : es.paidBy ) === id, function()
            {
                if( pay ) es.from = id; else es.paidBy = id;
                renderEntrySheet();
            } ) ) );

            if( pay )
            {
                const to = $( 'toChips' );
                to.innerHTML = '';
                ids.forEach( id => to.appendChild( chip( g, id, es.to === id, function() { es.to = id; renderEntrySheet(); } ) ) );
            }
            else if( es.mode === 'equal' )
            {
                const among = $( 'amongChips' );
                among.innerHTML = '';
                ids.forEach( id => among.appendChild( chip( g, id, es.among.indexOf( id ) !== -1, function()
                {
                    const at = es.among.indexOf( id );
                    if( at === -1 ) es.among.push( id ); else es.among.splice( at, 1 );
                    renderEntrySheet();
                } ) ) );
                $( 'allBtn' ).hidden = es.among.length >= ids.length;
            }

            // parts: one number per person for the other three modes
            const partsBox = $( 'partsList' );
            partsBox.hidden = pay || es.mode === 'equal';
            partsBox.innerHTML = '';
            if( ! partsBox.hidden )
            {
                const unit = es.mode === 'exact' ? M.currency( es.currency ).code : es.mode === 'percent' ? '%' : T( 'split.partsUnit' );
                ids.forEach( id =>
                {
                    const row = el( 'div', 'part-row' );
                    row.appendChild( avatar( g, id, true ) );
                    row.appendChild( el( 'div', 'name', nameOf( g, id ) ) );
                    const inp = el( 'input' );
                    inp.type = 'text';
                    inp.inputMode = 'decimal';
                    inp.placeholder = es.mode === 'shares' ? '1' : '0';
                    inp.value = es.partText[ id ] || '';
                    inp.setAttribute( 'aria-label', nameOf( g, id ) );
                    inp.addEventListener( 'input', function() { es.partText[ id ] = this.value; refreshEntryHints(); } );
                    row.appendChild( inp );
                    row.appendChild( el( 'span', 'unit', unit ) );
                    partsBox.appendChild( row );
                } );
            }

            refreshEntryHints();
        }

        // Reads the sheet's state and says whether it can be saved and why not.
        // Returns { ok, hint, amount, rate, split }.
        function validateEntry()
        {
            const g = current;
            const amount = M.parseAmount( es.amountText, es.currency );
            if( amount === null || amount <= 0 ) return { ok: false, hint: '' };

            let rate = 1;
            if( es.currency !== g.currency )
            {
                rate = Number( String( es.rateText || '' ).trim().replace( ',', '.' ) );
                if( ! ( rate > 0 ) ) return { ok: false, hint: TF( 'split.needRate', { to: g.currency } ) };
            }

            if( es.kind === 'payment' )
            {
                if( ! es.from || ! es.to ) return { ok: false, hint: T( 'split.needTwo' ) };
                if( es.from === es.to )    return { ok: false, hint: T( 'split.samePerson' ) };
                return { ok: true, hint: '', amount, rate };
            }

            if( ! es.paidBy ) return { ok: false, hint: T( 'split.needPayer' ) };

            if( es.mode === 'equal' )
            {
                if( ! es.among.length ) return { ok: false, hint: T( 'split.needSomeone' ) };
                return { ok: true, hint: '', amount, rate, split: { mode: 'equal', among: es.among.slice() } };
            }

            const parts = {};
            let sum = 0, count = 0;
            Object.keys( es.partText ).forEach( id =>
            {
                const raw = String( es.partText[ id ] || '' ).trim();
                if( ! raw ) return;
                const v = es.mode === 'exact' ? M.parseAmount( raw, es.currency ) : Number( raw.replace( ',', '.' ) );
                if( v === null || ! ( v > 0 ) ) return;
                parts[ id ] = v;
                sum   += v;
                count += 1;
            } );
            if( ! count ) return { ok: false, hint: T( 'split.needSomeone' ) };

            if( es.mode === 'exact' && sum !== amount )
            {
                const diff = amount - sum;
                return { ok: false, hint: diff > 0 ? TF( 'split.missing', { amt: fmt( diff, es.currency ) } )
                                                 : TF( 'split.over', { amt: fmt( -diff, es.currency ) } ) };
            }
            if( es.mode === 'percent' && Math.abs( sum - 100 ) > 0.001 )
                return { ok: false, hint: TF( 'split.pctSum', { n: Math.round( sum * 100 ) / 100 } ) };

            return { ok: true, hint: '', amount, rate, split: { mode: es.mode, parts } };
        }

        function refreshEntryHints()
        {
            const g = current;
            if( ! g || ! es ) return;

            // live "≈ 41,40 €" next to the rate
            const amount = M.parseAmount( es.amountText, es.currency );
            const rate   = Number( String( es.rateText || '' ).trim().replace( ',', '.' ) );
            $( 'ratePreview' ).textContent = ( es.currency !== g.currency && amount && rate > 0 )
                ? '≈ ' + fmt( M.toBase( amount, es.currency, rate, g.currency ), g.currency ) : '';

            const v = validateEntry();
            const hint = $( 'entryHint' );
            hint.textContent = v.hint;
            hint.classList.toggle( 'warn', !! v.hint );
            $( 'entrySaveBtn' ).disabled = ! v.ok;
        }

        function saveEntry()
        {
            const g = current;
            if( ! g || ! es ) return;
            const v = validateEntry();
            if( ! v.ok ) { refreshEntryHints(); return; }

            const isNew = ! es.id;
            const e = {
                id:       es.id || newId( 'e' ),
                type:     es.kind,
                date:     /^\d{4}-\d{2}-\d{2}$/.test( es.date || '' ) ? es.date : todayIso(),
                amount:   v.amount,
                currency: es.currency,
                rate:     es.currency === g.currency ? 1 : v.rate,
                created:  es.created || Date.now()
            };
            if( es.kind === 'payment' ) { e.from = es.from; e.to = es.to; }
            else { e.text = es.text.trim(); e.paidBy = es.paidBy; e.split = v.split; }

            if( es.currency !== g.currency ) g.rates[ es.currency ] = e.rate;   // remembered for next time

            const at = g.entries.findIndex( x => x.id === e.id );
            if( at >= 0 ) g.entries[ at ] = e; else g.entries.push( e );

            persist( g );
            closeSheet( 'entrySheetBackdrop' );
            renderGroup();
            toast( isNew ? ( e.type === 'payment' ? T( 'split.paymentSaved' ) : T( 'split.expenseSaved' ) )
                         : T( 'split.saved' ) );
        }

        // Delete = out at once, with six seconds to change your mind.
        function deleteEntry()
        {
            const g = current;
            if( ! g || ! es || ! es.id ) return;
            const at = g.entries.findIndex( x => x.id === es.id );
            if( at < 0 ) return;

            const removed = g.entries.splice( at, 1 )[ 0 ];
            persist( g );
            closeSheet( 'entrySheetBackdrop' );
            renderGroup();

            showUndo( T( 'split.deleted' ), function()
            {
                g.entries.splice( Math.min( at, g.entries.length ), 0, removed );
                persist( g );
                if( current === g ) renderGroup();
            } );
        }

        //------------------------------------------------------------------------//
        // THE GROUP SHEET - new group (name, currency, people) or edit (name, currency).

        function openGroupSheet( g )
        {
            gs = { g: g || null };
            $( 'groupSheetTitle' ).textContent = g ? T( 'split.editGroup' ) : T( 'split.newGroup' );
            $( 'groupNameInput' ).value = g ? ( g.name || '' ) : '';
            fillCurrencySelect( $( 'groupCurSel' ), g, g ? g.currency : 'EUR' );

            const locked = !! ( g && g.entries.length );
            $( 'groupCurSel' ).disabled = locked;
            $( 'groupCurHint' ).hidden  = ! locked;

            $( 'groupPeople' ).hidden = !! g;
            if( ! g )
            {
                $( 'meNameInput' ).value = meUser || '';
                $( 'othersInput' ).value = '';
            }

            NayiveUI.open( 'groupSheetBackdrop' );
            setTimeout( function() { $( 'groupNameInput' ).focus(); }, 60 );
        }

        function saveGroup()
        {
            if( ! gs ) return;
            const name = $( 'groupNameInput' ).value.trim();
            if( ! name ) { $( 'groupNameInput' ).focus(); return; }
            const cur = $( 'groupCurSel' ).value || 'EUR';

            if( gs.g )
            {
                gs.g.name = name;
                if( ! gs.g.entries.length ) gs.g.currency = cur;
                persist( gs.g );
                closeSheet( 'groupSheetBackdrop' );
                render();
                return;
            }

            const meName = $( 'meNameInput' ).value.trim() || meUser || T( 'split.meDefault' );
            const others = $( 'othersInput' ).value.split( /[\n,;]/ ).map( s => s.trim() ).filter( Boolean );
            const mem    = [ { id: newId( 'm' ), name: meName, me: true } ].concat( others.map( n => ( { id: newId( 'm' ), name: n } ) ) );
            const id     = slugify( name ) + '-' + Math.random().toString( 36 ).slice( 2, 6 );

            const g = { id, name, currency: cur, created: todayIso(), archived: false, members: mem, rates: {}, entries: [] };
            g._base = DIR + '/' + id;
            g._ro   = false;

            groups.push( g );
            persist( g );
            closeSheet( 'groupSheetBackdrop' );
            openGroup( g );
            toast( T( 'split.groupCreated' ) );
        }

        //------------------------------------------------------------------------//
        // THE PEOPLE SHEET - edit names, say who is "me", add, hide or remove.

        function openMembersSheet()
        {
            const g = current;
            if( ! g || g._ro ) return;
            ms = members( g ).map( m => Object.assign( {}, m ) );
            renderMembersSheet();
            NayiveUI.open( 'membersSheetBackdrop' );
        }

        function renderMembersSheet()
        {
            const box = $( 'memberRows' );
            box.innerHTML = '';

            ms.forEach( ( m, i ) =>
            {
                const row = el( 'div', 'member-row' + ( m.hidden ? ' is-hidden' : '' ) );
                row.appendChild( avatarFor( i, m.name, false ) );

                const inp = el( 'input' );
                inp.type = 'text';
                inp.value = m.name || '';
                inp.placeholder = T( 'split.nameWord' );
                inp.setAttribute( 'aria-label', T( 'split.nameWord' ) );
                inp.addEventListener( 'input', function() { m.name = this.value; row.firstChild.textContent = initials( this.value ); } );
                row.appendChild( inp );

                const lab = el( 'label', 'me' );
                const r   = el( 'input' );
                r.type = 'radio';
                r.name = 'meRadio';
                r.checked = !! m.me;
                r.addEventListener( 'change', function() { ms.forEach( x => { x.me = false; } ); m.me = true; } );
                lab.appendChild( r );
                lab.appendChild( document.createTextNode( T( 'split.meWord' ) ) );
                row.appendChild( lab );

                const btn = el( 'button', 'icon-btn sm' );
                btn.type = 'button';
                if( M.hasMovements( current, m.id ) )
                {
                    btn.innerHTML = m.hidden ? IC.eye : IC.eyeoff;
                    btn.title = m.hidden ? T( 'split.showPerson' ) : T( 'split.hidePerson' );
                    btn.addEventListener( 'click', function() { m.hidden = ! m.hidden; renderMembersSheet(); } );
                }
                else
                {
                    btn.classList.add( 'danger' );
                    btn.innerHTML = IC.trash;
                    btn.title = T( 'split.removePerson' );
                    btn.addEventListener( 'click', function() { ms.splice( i, 1 ); renderMembersSheet(); } );
                }
                btn.setAttribute( 'aria-label', btn.title );
                row.appendChild( btn );

                box.appendChild( row );
            } );
        }

        function saveMembers()
        {
            const g = current;
            if( ! g || ! ms ) return;
            const clean = ms.map( m => Object.assign( {}, m, { name: ( m.name || '' ).trim() } ) );
            if( clean.some( m => ! m.name ) ) { toast( T( 'split.nameAll' ) ); return; }

            g.members = clean;
            persist( g );
            closeSheet( 'membersSheetBackdrop' );
            renderGroup();
        }

        //------------------------------------------------------------------------//
        // THE ⋮ MENU

        // Called only from a group's row in the list, so the group comes in as an
        // argument. Never pass this straight to addEventListener: the click
        // event would land in `g`.
        function toggleArchive( g )
        {
            if( ! g || g._ro ) return;
            g.archived = ! g.archived;
            persist( g );
            goHome();
            toast( g.archived ? T( 'split.archived' ) : T( 'split.unarchived' ) );
        }

        // Called from the trash button on a group's row in the list - never from
        // inside an open group, so the group comes in as an argument.
        //
        // Only an ARCHIVED group can be deleted. Archiving first is the pause
        // that makes a delete deliberate: the row shows the archive box until
        // the group is put away, and only then does it show the bin. The test
        // is repeated here so no future caller can skip that step.
        async function deleteGroup( g )
        {
            if( ! g || g._ro || ! g.archived ) return;

            const ok = await NayiveUI.confirm( {
                title:  T( 'split.deleteGroup' ),
                body:   TF( 'split.deleteGroupBody', { name: g.name } ),
                danger: true
            } );
            if( ! ok ) return;

            if( ! navigator.onLine ) { toast( T( 'split.needOnline' ) ); return; }
            try { await GumApi.deletePaths( g._base ); }
            catch( _ ) { toast( T( 'split.deleteFailed' ) ); return; }

            await store.forget( g._base + '/' + FILE );
            groups  = groups.filter( x => x !== g );
            current = null;
            render();
            toast( T( 'split.groupDeleted' ) );
        }

        //------------------------------------------------------------------------//
        // SHARE THE NUMBERS - as text (WhatsApp, Telegram, mail) or as a CSV file.

        function summaryText( g )
        {
            const lines = [];
            lines.push( ( g.name || 'Split' ) + ' · ' + T( 'split.balancesAt' ) + ' ' + todayIso() );
            lines.push( T( 'split.totalSpentWord' ) + ': ' + fmt( M.memberTotals( g ).total, g.currency ) );

            const used   = M.usedCurrencies( g );
            const blocks = ( perCur && used.length > 1 )
                ? used.map( code => ( { code, net: M.balancesByCurrency( g )[ code ] || {} } ) )
                : [ { code: g.currency, net: M.balances( g ) } ];

            blocks.forEach( b =>
            {
                lines.push( '' );
                if( blocks.length > 1 ) lines.push( '[' + b.code + ']' );
                Object.keys( b.net )
                    .filter( id => memberOf( g, id ) && ( ! memberOf( g, id ).hidden || b.net[ id ] !== 0 ) )
                    .sort( ( x, y ) => b.net[ y ] - b.net[ x ] )
                    .forEach( id => lines.push( nameOf( g, id ) + ': ' + fmt( b.net[ id ], b.code, { plus: true } ) ) );

                lines.push( '' );
                lines.push( T( 'split.whoPays' ) + ':' );
                const tr = M.settle( b.net );
                if( ! tr.length ) lines.push( '· ' + T( 'split.allEven' ) );
                tr.forEach( x => lines.push( '· ' + nameOf( g, x.from ) + ' → ' + nameOf( g, x.to ) + ': ' + fmt( x.amount, b.code ) ) );
            } );
            return lines.join( '\n' );
        }

        async function copySummary()
        {
            const g = current;
            if( ! g ) return;
            const text = summaryText( g );

            // On a phone the share sheet is what people want (straight into a
            // chat); on a PC the clipboard is.
            const coarse = window.matchMedia && window.matchMedia( '(pointer: coarse)' ).matches;
            if( coarse && navigator.share )
            {
                try { await navigator.share( { text } ); return; }
                catch( e ) { if( e && e.name === 'AbortError' ) return; }
            }
            try
            {
                await navigator.clipboard.writeText( text );
                toast( T( 'split.copied' ) );
            }
            catch( _ )
            {
                NayiveUI.alert( { title: T( 'split.summary' ), body: text } );
            }
        }

        function csvText( g )
        {
            const SEP = ';';   // Spanish locale: ";" between fields, "," for decimals
            const q   = s => '"' + String( s == null ? '' : s ).replace( /"/g, '""' ) + '"';
            const rows = [ [ T( 'split.csvDate' ), T( 'split.csvKind' ), T( 'split.csvText' ),
                             T( 'split.csvPayer' ), T( 'split.csvFor' ), T( 'split.csvAmount' ),
                             T( 'split.csvCurrency' ), T( 'split.csvRate' ),
                             TF( 'split.csvAmountIn', { cur: g.currency } ) ].map( q ).join( SEP ) ];

            sortedEntries( g ).reverse().forEach( e =>
            {
                const pay  = e.type === 'payment';
                const code = e.currency || g.currency;
                rows.push( [
                    e.date || '',
                    T( pay ? 'split.csvPayment' : 'split.csvExpense' ),
                    pay ? '' : ( e.text || '' ),
                    nameOf( g, pay ? e.from : e.paidBy ),
                    pay ? nameOf( g, e.to ) : M.participants( e ).ids.map( id => nameOf( g, id ) ).join( ', ' ),
                    M.toDecimal( e.amount, code, ',' ),
                    code,
                    String( code === g.currency ? 1 : ( e.rate || '' ) ).replace( '.', ',' ),
                    M.toDecimal( M.entryBase( e, g.currency ), g.currency, ',' )
                ].map( q ).join( SEP ) );
            } );
            return '\ufeff' + rows.join( '\r\n' );   // BOM so Excel reads the accents
        }

        async function exportCsv()
        {
            const g = current;
            if( ! g ) return;
            const name = slugify( g.name ) + '.csv';
            const blob = new Blob( [ csvText( g ) ], { type: 'text/csv;charset=utf-8' } );

            if( navigator.canShare && window.File )
            {
                try
                {
                    const file = new File( [ blob ], name, { type: 'text/csv' } );
                    if( navigator.canShare( { files: [ file ] } ) && window.matchMedia( '(pointer: coarse)' ).matches )
                    {
                        await navigator.share( { files: [ file ], title: g.name } );
                        return;
                    }
                }
                catch( e ) { if( e && e.name === 'AbortError' ) return; }
            }

            const url = URL.createObjectURL( blob );
            const a   = document.createElement( 'a' );
            a.href = url;
            a.download = name;
            document.body.appendChild( a );
            a.click();
            setTimeout( function() { document.body.removeChild( a ); URL.revokeObjectURL( url ); }, 1000 );
        }

        //------------------------------------------------------------------------//
        // TOASTS

        // Both toasts are the shared ones (shared/ui.js + the .toast rules in
        // shared/theme.css); these two names are kept only because the app calls them a lot.
        // Plain functions, not `const x = NayiveUI.y`: shared/ui.js is deferred, so NayiveUI
        // does not exist yet while this script is parsed.
        function toast( msg )         { NayiveUI.toast( msg ); }
        function showUndo( msg, fn )  { NayiveUI.undoToast( msg, fn ); }
    </script>
</body>
</html>
