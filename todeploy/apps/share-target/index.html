<!-- index.html - Web Share Target landing page.

     The launcher manifest declares this folder as a share_target. When the user
     picks photos in the phone's gallery and taps Share -> "Nayive", the OS
     POSTs them here. A page can't read that POST, so apps/sw.js intercepts it,
     stashes the images in the "nayive-share-inbox" Cache, and 303-redirects here
     with ?n=<count>. This page reads them back out of that cache, lets the user
     confirm the destination album, uploads each file with PUT /api/files, then
     opens Photos on that folder.

     Online only (it uploads). iOS Safari does not support Web Share Target at
     all - there the launcher shows the "Add to Home Screen" recipe instead and
     users add photos from inside Photos (the header upload button). -->
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The interface language. First of all: it hides the page until the
         dictionary is in, and every inline script below may call it. -->
    <script src="../shared/i18n.js"></script>
    <title data-i18n="ui.shareToNayive"></title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d1b2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='6' y='2' width='16' height='16' rx='2'/%3E%3Ccircle cx='12' cy='8' r='2'/%3E%3Cpath d='M18 22H4a2 2 0 0 1-2-2V6'/%3E%3C/svg%3E">

    <meta name="theme-color" content="#1E1F23">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/app.css">
    <script>try{ if( localStorage.getItem( 'balata-theme' ) !== 'dark' ) document.documentElement.setAttribute( 'data-theme', 'light' ); }catch( e ){}</script>
    <script src="../shared/theme.js" defer></script>
    <script src="../shared/gum-api.js" defer></script>
    <script src="../shared/ui.js" defer></script>
    <script src="../shared/photo.js" defer></script>
    <script>
        if( 'serviceWorker' in navigator )
            window.addEventListener( 'load', function () { navigator.serviceWorker.register( '../sw.js' ).catch( function () {} ); } );
    </script>

    <style>
        html, body { height: 100%; }
        .app { max-width: 560px; margin: 0 auto; padding: 18px 16px 32px; }

        .st-head { display: flex; align-items: center; gap: 10px; margin: 6px 0 18px; }
        .st-head svg { width: 22px; height: 22px; color: var(--accent); flex: 0 0 auto; }
        .st-head h1 { font-size: 1.05rem; margin: 0; }

        .st-card
        {
            border: 1px solid var(--line); border-radius: var(--radius-l);
            background: var(--card); padding: 16px; margin-bottom: 14px;
        }
        .st-count { font-size: 0.9rem; color: var(--text-dim); margin: 0 0 12px; }

        .st-strip { display: flex; flex-wrap: wrap; gap: 8px; }
        .st-strip img
        {
            width: 74px; height: 74px; object-fit: cover; border-radius: var(--radius-m);
            background: var(--card2); border: 1px solid var(--line);
        }
        .st-strip .more
        {
            width: 74px; height: 74px; border-radius: var(--radius-m); background: var(--card2);
            border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; color: var(--text-dim);
        }

        .st-dest { display: flex; align-items: center; gap: 10px; }
        .st-dest .lbl { font-size: 0.8rem; color: var(--text-dim); flex: 0 0 auto; }
        .st-dest .val { flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .st-dest button
        {
            flex: 0 0 auto; border: 1px solid var(--line); background: var(--card2); color: var(--text);
            border-radius: var(--radius-m); padding: 6px 12px; font: inherit; cursor: pointer;
        }
        .st-dest button:hover { border-color: var(--accent); }

        .st-actions { display: flex; gap: 10px; margin-top: 6px; }
        .st-actions button
        {
            flex: 1 1 auto; border: none; border-radius: var(--radius-m); padding: 12px 14px;
            font: inherit; font-weight: 600; cursor: pointer;
        }
        .st-actions .go     { background: var(--accent); color: var(--on-accent); }
        .st-actions .cancel { background: var(--card2); color: var(--text); border: 1px solid var(--line); }
        .st-actions button[disabled] { opacity: 0.55; cursor: default; }

        .st-bar { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; margin-top: 14px; }
        .st-bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }

        .st-msg { color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; }
        .st-msg a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="app">
        <div class="st-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="16" height="16" rx="2"/><circle cx="12" cy="8" r="2"/><path d="M18 22H4a2 2 0 0 1-2-2V6"/></svg>
            <h1 data-i18n="ui.shareToNayive"></h1>
        </div>

        <div class="st-card" id="empty" hidden>
            <p class="st-msg" id="emptyMsg"><span data-i18n="st.noPhoto"></span><br><a href="../index.html" data-i18n="st.goToNayive"></a></p>
        </div>

        <div class="st-card" id="review" hidden>
            <p class="st-count" id="count"></p>
            <div class="st-strip" id="strip"></div>
        </div>

        <div class="st-card" id="destCard" hidden>
            <div class="st-dest">
                <span class="lbl" data-i18n="st.album"></span>
                <span class="val" id="destVal">…</span>
                <button type="button" id="changeDest" data-i18n="ui.change"></button>
            </div>
        </div>

        <div class="st-actions" id="actions" hidden>
            <button type="button" class="cancel" id="cancelBtn" data-i18n="ui.cancel"></button>
            <button type="button" class="go" id="goBtn" data-i18n="ui.upload"></button>
        </div>

        <div class="st-bar" id="bar" hidden><i id="barFill"></i></div>
    </div>

<script>
"use strict";

const $ = s => document.querySelector( s );
const INBOX = "nayive-share-inbox";
const PARAMS = new URLSearchParams( location.search );

let ITEMS = [];          // [{ name, blob }]
let DEST  = null;        // folder path, e.g. "files/fotos/viajes"

function baseName( p ) { return String( p ).split( "/" ).pop(); }

function uniqueName( name, taken )
{
    if( ! taken.has( name ) ) return name;
    const dot  = name.lastIndexOf( "." );
    const stem = dot > 0 ? name.slice( 0, dot ) : name;
    const ext  = dot > 0 ? name.slice( dot )    : "";
    let i = 2;
    while( taken.has( stem + " (" + i + ")" + ext ) ) i++;
    return stem + " (" + i + ")" + ext;
}

/* Pull the shared images back out of the Cache the service worker filled. */
async function readInbox()
{
    if( ! ( "caches" in window ) ) return [];

    let cache;
    try { cache = await caches.open( INBOX ); }
    catch ( _ ) { return []; }

    let manifest = { count: 0, names: [] };
    try
    {
        const m = await cache.match( new URL( "inbox/manifest.json", location.href ).toString() );
        if( m ) manifest = await m.json();
    }
    catch ( _ ) {}

    const n = manifest.count || parseInt( PARAMS.get( "n" ) || "0", 10 ) || 0;
    const out = [];

    for( let i = 0; i < n; i++ )
    {
        const res = await cache.match( new URL( "inbox/" + i, location.href ).toString() );
        if( ! res ) continue;
        const blob = await res.blob();
        let name = ( manifest.names && manifest.names[ i ] ) || "";
        if( ! name )
        {
            const h = res.headers.get( "X-File-Name" );
            name = h ? decodeURIComponent( h ) : ( "foto-" + ( i + 1 ) + ".jpg" );
        }
        out.push( { name: name, blob: blob } );
    }
    return out;
}

async function clearInbox()
{
    try
    {
        const cache = await caches.open( INBOX );
        const keys  = await cache.keys();
        await Promise.all( keys.map( k => cache.delete( k ) ) );
    }
    catch ( _ ) {}
}

function renderStrip()
{
    $( "#count" ).textContent = NayiveUI.tf( ITEMS.length === 1 ? "st.onePhoto" : "st.nPhotos",
                                            { n: ITEMS.length } );

    const strip = $( "#strip" );
    strip.innerHTML = "";
    const SHOW = 6;
    ITEMS.slice( 0, SHOW ).forEach( it =>
    {
        const img = document.createElement( "img" );
        img.src = URL.createObjectURL( it.blob );
        img.alt = it.name;
        img.addEventListener( "load", () => URL.revokeObjectURL( img.src ), { once: true } );
        strip.appendChild( img );
    } );
    if( ITEMS.length > SHOW )
    {
        const more = document.createElement( "div" );
        more.className = "more";
        more.textContent = "+" + ( ITEMS.length - SHOW );
        strip.appendChild( more );
    }
}

function setDest( folder )
{
    DEST = folder;
    $( "#destVal" ).textContent = folder
        ? ( folder.replace( /^files\//, "" ).replace( /^data\//, "" ) || NayiveUI.t( 'ui.filesRoot' ) )
        : NayiveUI.t( 'st.pickAlbum' );
    $( "#goBtn" ).disabled = ! folder || ! ITEMS.length;
}

async function upload()
{
    if( ! DEST || ! ITEMS.length ) return;

    // Room for all of it? If not, offer to empty the papelera (its contents
    // count against the quota just like anything else).
    const need = ITEMS.reduce( ( n, it ) => n + ( ( it.blob && it.blob.size ) || 0 ), 0 );
    if( ! await NayiveUI.ensureRoom( need ) ) return;

    $( "#goBtn" ).disabled = true;
    $( "#cancelBtn" ).disabled = true;
    $( "#changeDest" ).disabled = true;
    $( "#bar" ).hidden = false;

    // If this user has a max photo size, shrink + convert to JPEG right here.
    const maxPx = await NayivePhoto.limit();

    // names already in the destination, so a share never clobbers a file
    let taken = new Set();
    try
    {
        const r = await GumApi.listDir( DEST );
        taken = new Set( ( ( r && r.nodes ) || [] ).map( n => baseName( n.path ) ) );
    }
    catch ( _ ) {}

    let done = 0;
    for( let i = 0; i < ITEMS.length; i++ )
    {
        const it    = ITEMS[ i ];
        const ready = await NayivePhoto.prepare(
                          it.blob && ! it.blob.name ? new File( [ it.blob ], it.name || "foto.jpg",
                                                                { type: it.blob.type } )
                                                    : it.blob,
                          maxPx );
        const name  = uniqueName( ready.name || it.name ||
                                  ( "foto-" + Date.now() + "-" + i + ".jpg" ), taken );
        taken.add( name );

        try
        {
            const bytes = new Uint8Array( await ready.blob.arrayBuffer() );
            await GumApi.writeFileBytes( DEST + "/" + name, bytes );
            done++;
        }
        catch ( err )
        {
            const msg = String( err && err.message || err );
            if( msg.indexOf( "401" ) !== -1 ) { GumApi.loginRedirect(); return; }
            if( msg.indexOf( "507" ) !== -1 )
            {
                NayiveUI.toast( NayiveUI.t( 'ui.quotaExceeded' ) );
                break;
            }
        }
        $( "#barFill" ).style.width = Math.round( ( ( i + 1 ) / ITEMS.length ) * 100 ) + "%";
    }

    await clearInbox();
    NayiveUI.toast( NayiveUI.tf( done === 1 ? "st.oneUploaded" : "st.nUploaded", { n: done } ) );

    // Remember this album as the Photos folder, then open it there.
    try { await GumApi.writeJson( "data/photos/config.json", { folder: DEST } ); }
    catch ( _ ) {}

    location.replace( "../photos/?dir=" + encodeURIComponent( DEST ) );
}

$( "#changeDest" ).addEventListener( "click", async () =>
{
    const f = await NayiveUI.pickFolder( {
        title: NayiveUI.t( 'st.whichAlbum' ),
        note:  NayiveUI.t( 'st.whichAlbumNote' ),
        allowRoot: true,
        rootLabel: NayiveUI.t( 'ui.filesFolder' )
    } );
    if( f ) setDest( f );
} );

$( "#goBtn" ).addEventListener( "click", upload );
$( "#cancelBtn" ).addEventListener( "click", async () =>
{
    await clearInbox();
    location.replace( "../index.html" );
} );

async function boot()
{
    ITEMS = await readInbox();

    if( ! ITEMS.length )
    {
        $( "#empty" ).hidden = false;
        return;
    }

    renderStrip();
    $( "#review"   ).hidden = false;
    $( "#destCard" ).hidden = false;
    $( "#actions"  ).hidden = false;

    // Default destination: the folder Photos already remembers.
    let folder = null;
    try
    {
        const cfg = await GumApi.readJson( "data/photos/config.json" );
        if( cfg && cfg.folder ) folder = cfg.folder;
    }
    catch ( err )
    {
        if( String( err && err.message ).indexOf( "401" ) !== -1 ) { GumApi.loginRedirect(); return; }
    }
    setDest( folder );

    if( ! folder )
        NayiveUI.toast( NayiveUI.t( 'st.pickAlbumToast' ) );
}

// shared/gum-api.js + shared/ui.js load deferred; they run before
// DOMContentLoaded, so wait for it before boot() touches GumApi / NayiveUI.
NayiveI18n.ready.then( boot );
</script>
</body>
</html>
